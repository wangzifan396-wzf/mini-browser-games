<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#273744">
  <title>时间邮局：因果班表</title>
  <style>
    :root{--bg:#ecefeb;--paper:#fffefa;--ink:#1d2c33;--muted:#66757a;--line:#c2ccc8;--deep:#273744;--blue:#19769a;--teal:#33765e;--gold:#b9811d;--red:#aa4e50;--violet:#6c6088;--radius:8px;--shadow:0 12px 30px rgba(26,45,53,.11)}
    *{box-sizing:border-box;letter-spacing:0}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg)}button{font:inherit}.app{width:min(1240px,calc(100vw - 24px));margin:auto;padding:18px 0 30px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:18px 20px;border-bottom:4px solid #e0b84f;color:#fff;background:var(--deep)}h1{margin:0;font-size:28px}.sub{margin:5px 0 0;color:#d4e0e1;font-size:13px}.campaign{display:flex;gap:20px;text-align:right}.campaign b{display:block;color:#f1c85e;font-size:20px}.campaign span{color:#bbcdd0;font-size:10px}.missions{display:grid;grid-template-columns:repeat(12,minmax(42px,1fr));gap:5px;padding:12px 0}.mission{height:43px;border:1px solid #9eaeaa;border-radius:6px;color:#3e555c;background:#f8f9f5;font-weight:900;cursor:pointer}.mission.active{border-color:var(--blue);color:#fff;background:var(--blue)}.mission.locked{opacity:.42}.mission small{display:block;height:11px;color:#f1c453;font-size:9px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}.field{min-width:0;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);box-shadow:var(--shadow)}.brief{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.brief h2{margin:0;font-size:21px}.brief p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.goal{flex:0 0 auto;padding:7px 9px;border:1px solid #d0ad59;border-radius:6px;color:#72500c;background:#fff4d6;font-size:11px;font-weight:900}.task-title{margin:16px 0 8px;font-size:13px}.tasks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.task{min-height:84px;padding:9px;border:1px solid #a8b6b2;border-radius:6px;text-align:left;color:#344a51;background:#f5f7f2;cursor:pointer}.task.selected{border-color:var(--blue);box-shadow:0 0 0 3px rgba(25,118,154,.14)}.task.assigned{border-color:#8eb7a4;background:#edf5ef}.task b{display:block;margin-bottom:5px;color:var(--ink);font-size:13px}.task span{display:block;color:var(--muted);font-size:10px;line-height:1.45}.skill{display:inline-block!important;width:max-content;margin-top:4px;padding:2px 5px;border-radius:4px;color:#fff!important;background:var(--blue)}.skill.cargo{background:var(--gold)}.skill.mechanical{background:var(--violet)}.skill.fragile{background:var(--red)}.timeline-wrap{margin-top:12px;overflow-x:auto;border:1px solid #a6b5b1;border-radius:var(--radius);background:#eef2ee}.timeline{display:grid;gap:3px;min-width:700px;padding:7px}.time-head,.courier-label,.slot{min-height:48px;border-radius:5px}.time-head{display:grid;place-items:center;color:#50646a;font-size:10px;font-weight:900}.courier-label{display:flex;flex-direction:column;justify-content:center;padding:7px;color:#fff;background:var(--deep);font-size:12px;font-weight:900}.courier-label small{font-size:9px;font-weight:500;color:#c8d7d8}.slot{position:relative;display:grid;place-items:center;border:1px dashed #a8b6b2;color:#718087;background:#fafbf7;cursor:pointer}.slot:hover{border-color:var(--blue)}.slot.blocked{border-style:solid;color:#fff;background:#879397;cursor:not-allowed}.slot.busy{border-style:solid;border-color:#6e9bb0;color:#fff;background:var(--blue);font-size:9px;text-align:center}.slot.busy.anchor{border-color:#aa7d2c;background:var(--gold)}.slot.continue{opacity:.72}.slot.current{outline:3px solid #e2aa2d;outline-offset:-3px}.panel{display:flex;flex-direction:column;gap:10px}.box{padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}.box h3{margin:0 0 9px;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px 4px;border:1px solid #d2dad7;border-radius:6px;text-align:center;background:#f3f6f2}.stat b{display:block;color:var(--blue);font-size:18px}.stat span{color:var(--muted);font-size:10px}.couriers{display:grid;grid-template-columns:1fr 1fr;gap:6px}.courier{padding:9px;border-radius:6px;color:#fff;background:var(--blue)}.courier:last-child{background:var(--gold)}.courier b{display:block;font-size:13px}.courier span{font-size:9px}.actions,.archive{display:grid;grid-template-columns:1fr 1fr;gap:6px}.actions button,.archive button{min-height:39px;border:1px solid #9caca8;border-radius:6px;color:#314a51;background:#f3f5f0;font-weight:900;cursor:pointer}.actions .primary{grid-column:1/-1;border-color:var(--teal);color:#fff;background:var(--teal)}.status{min-height:72px;margin:0;padding:10px;border-left:4px solid var(--teal);color:#3d555d;background:#edf4ef;font-size:12px;line-height:1.55}.log{min-height:64px;margin:0;color:var(--muted);font-size:11px;line-height:1.6}.result{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(18,35,43,.72)}.result[hidden]{display:none}.result-card{width:min(430px,100%);padding:22px;border-radius:var(--radius);background:var(--paper);box-shadow:0 24px 70px rgba(0,0,0,.3);text-align:center}.result-card h2{margin:0}.result-stars{margin:12px 0;color:#d49a19;font-size:34px}.result-card button{min-height:42px;padding:0 18px;border:0;border-radius:6px;color:#fff;background:var(--blue);font-weight:900;cursor:pointer}
    @media(max-width:980px){.layout{grid-template-columns:1fr}.panel{display:grid;grid-template-columns:1fr 1fr}.panel .status{grid-column:1/-1}}
    @media(max-width:680px){.app{width:calc(100vw - 12px);padding-top:6px}.head{display:block;padding:14px}.campaign{justify-content:space-between;margin-top:12px;text-align:left}.missions{grid-template-columns:repeat(6,1fr);gap:4px}.mission{height:38px}.field{padding:9px}.brief{display:block}.goal{display:inline-block;margin-top:7px}.tasks{grid-template-columns:repeat(2,minmax(0,1fr))}.task{min-height:76px}.panel{display:flex}.sub{line-height:1.5}}
  </style>
</head>
<body>
  <main class="app">
    <header class="head"><div><h1>时间邮局：因果班表</h1><p class="sub">让两名信使并行穿梭时间窗；过去送达的物品会打开未来的道路。</p></div><div class="campaign"><div><b id="starTotal">0 / 36</b><span>委托星章</span></div><div><b id="perfectTotal">0 / 12</b><span>一次通过</span></div><div><b id="bestSpan">--</b><span>最短班表</span></div></div></header>
    <nav class="missions" id="missions" aria-label="时间委托"></nav>
    <section class="layout">
      <div class="field"><div class="brief"><div><h2 id="title"></h2><p id="brief"></p></div><span class="goal" id="goal"></span></div><h3 class="task-title">待投递事项</h3><div class="tasks" id="tasks"></div><div class="timeline-wrap"><div class="timeline" id="timeline"></div></div></div>
      <aside class="panel">
        <section class="box"><h3>班表状态</h3><div class="stats"><div class="stat"><b id="assigned">0 / 0</b><span>已排事项</span></div><div class="stat"><b id="span">0</b><span>完工时刻</span></div><div class="stat"><b id="checks">0</b><span>退回次数</span></div></div></section>
        <section class="box"><h3>值班信使</h3><div class="couriers"><div class="courier"><b>岚 · 轻信使</b><span>载重 2 · 信件/信号/易碎</span></div><div class="courier"><b>砾 · 重信使</b><span>载重 4 · 信件/货运/机械</span></div></div></section>
        <section class="box"><div class="actions"><button class="primary" id="execute">运行因果班表</button><button id="hint">排入一项</button><button id="undo">撤回</button><button id="reset">清空班表</button></div></section>
        <p class="status" id="status"></p>
        <section class="box"><h3>运行记录</h3><p class="log" id="log">尚未运行班表。</p></section>
        <section class="box"><div class="archive"><button id="exportSave">导出档案</button><button id="importSave">导入档案</button></div></section>
      </aside>
    </section>
  </main>
  <div class="result" id="result" hidden><div class="result-card"><h2 id="resultTitle"></h2><p id="resultText"></p><div class="result-stars" id="resultStars"></div><button id="next">下一份委托</button></div></div>
  <script>
  (()=>{
    "use strict";
    const SAVE_KEY="time_post_v2",couriers={swift:{name:"岚",capacity:2,skills:["letter","signal","fragile"]},anchor:{name:"砾",capacity:4,skills:["letter","cargo","mechanical"]}},skillNames={letter:"信件",signal:"信号",fragile:"易碎",cargo:"货运",mechanical:"机械"};
    const $=id=>document.getElementById(id),taskEl=$("tasks"),timelineEl=$("timeline"),missionEl=$("missions"),statusEl=$("status");
    function task(id,name,duration,earliest,deadline,load,skill,requires,produces,zone){return{id,name,duration,earliest,deadline,load,skill,requires,produces,zone}}
    function fork(id,title,brief,names){const tasks=[task("a",names[0],1,0,2,1,"signal",[],["a"],"旧城"),task("b",names[1],2,0,3,4,"cargo",[],["b"],"仓库"),task("c",names[2],1,1,3,1,"fragile",["a"],["c"],"旧城"),task("d",names[3],1,2,4,3,"mechanical",["b"],["d"],"钟区"),task("e",names[4],1,3,4,1,"letter",["c","d"],["e"],"未来街"),task("f",names[5],1,3,5,3,"cargo",["d"],["f"],"仓库")],reference={a:{courier:"swift",start:0},b:{courier:"anchor",start:0},c:{courier:"swift",start:1},d:{courier:"anchor",start:2},e:{courier:"swift",start:3},f:{courier:"anchor",start:3}};return{id,title,brief,slots:5,tasks,reference,target:4,blocks:[{courier:"swift",slot:2}]}}
    function cross(id,title,brief,names){const tasks=[task("a",names[0],1,0,2,1,"signal",[],["a"],"西巷"),task("b",names[1],1,0,2,3,"mechanical",[],["b"],"机房"),task("c",names[2],2,1,4,4,"cargo",["b"],["c"],"货桥"),task("d",names[3],2,1,4,2,"fragile",["a"],["d"],"光廊"),task("e",names[4],1,3,5,1,"letter",["c","d"],["e"],"中庭"),task("f",names[5],1,3,5,1,"signal",["d"],["f"],"钟区"),task("g",names[6],1,4,6,1,"letter",["e","f"],["g"],"未来街")],reference={a:{courier:"swift",start:0},b:{courier:"anchor",start:0},c:{courier:"anchor",start:1},d:{courier:"swift",start:1},e:{courier:"anchor",start:3},f:{courier:"swift",start:3},g:{courier:"swift",start:4}};return{id,title,brief,slots:6,tasks,reference,target:5,blocks:[{courier:"anchor",slot:5}]}}
    function relay(id,title,brief,names){const tasks=[task("a",names[0],1,0,2,1,"letter",[],["a"],"晨线"),task("b",names[1],2,0,3,4,"cargo",[],["b"],"重轨"),task("c",names[2],1,1,3,1,"signal",["a"],["c"],"晨线"),task("d",names[3],1,2,4,3,"mechanical",["b"],["d"],"机房"),task("e",names[4],2,2,5,2,"fragile",["c"],["e"],"玻璃桥"),task("f",names[5],2,3,6,4,"cargo",["d"],["f"],"重轨"),task("g",names[6],1,5,7,1,"letter",["e","f"],["g"],"终点钟"),task("h",names[7],1,5,7,3,"mechanical",["f"],["h"],"机房")],reference={a:{courier:"swift",start:0},b:{courier:"anchor",start:0},c:{courier:"swift",start:1},d:{courier:"anchor",start:2},e:{courier:"swift",start:2},f:{courier:"anchor",start:3},g:{courier:"swift",start:5},h:{courier:"anchor",start:5}};return{id,title,brief,slots:7,tasks,reference,target:6,blocks:[{courier:"swift",slot:4},{courier:"anchor",slot:6}]}}
    const missions=[
      fork("p1","橡果桥委托","种匣与木梁必须在未来信件出发前共同送达。",["过去种匣","旧木梁箱","萌芽回执","桥架校准件","晨钟来信","剩余木料"]),
      fork("p2","雨巷开门","信标先照亮旧巷，重件随后修复未来门轴。",["雾灯信标","铸铁门轴","玻璃回声瓶","门机扳手","雨后邀请函","备用铰链"]),
      fork("p3","失物博物馆","两条因果支线汇合后才能归还终展藏品。",["展柜编号","石质底座","羽毛标本","恒温齿轮","终展说明卡","封存材料"]),
      fork("p4","月台复写","旧时刻表和轨道部件共同改写末班车。",["旧站信号","道岔重箱","车次薄片","时钟联轴","末班车票","检修枕木"]),
      cross("p5","镜城双线","轻重信使各自完成两段长任务，再交换未来回执。",["镜面信号","折光机芯","银砂货柜","薄镜样本","会合公函","钟面校时","未来通行证"]),
      cross("p6","潮港换班","货桥和灯塔必须在同一时间窗完成联调。",["潮位报码","灯塔齿轮","压舱货箱","盐晶灯芯","港务回执","换班信号","夜航许可"]),
      cross("p7","纸月修复","易碎纸月与重型升降架并行穿过不同区域。",["月相报码","升降机芯","纸浆重箱","纸月弧片","修复记录","展厅信号","开幕请柬"]),
      cross("p8","星雨剧场","舞台机械和易碎星幕完成后才可发送首演函。",["灯阵报码","舞台齿轮","配重货箱","星幕薄片","联排记录","开场信号","首演邀请"]),
      relay("p9","冬庭长班","两条长途投递链在第五时刻汇合。",["晨霜来信","温室土箱","日照报码","供暖阀组","冰花样本","玻璃重梁","春庭回函","备用热机"]),
      relay("p10","深海钟楼","压力货箱和声呐样本分别穿越重轨与玻璃桥。",["潜钟来信","压舱货箱","声呐报码","钟锤机组","海晶样本","塔基重梁","浮上海图","备用绞盘"]),
      relay("p11","云端档案","高空易碎档案必须等待地面设施完成两段建设。",["风向来信","锚索货箱","航标报码","卷扬机组","云纸原卷","塔架重梁","归档凭证","备用滑轮"]),
      relay("p12","因果终班","八项终局投递覆盖全部技能、容量和前置关系。",["起点密函","纪元货箱","时门报码","主钟机组","因果棱镜","轨道重梁","终点回函","封存机芯"])
    ];
    let save=loadSave(),q=null,selected=null,audio=null;

    function defaults(){return{version:2,stars:{},best:{},updatedAt:Date.now()}}
    function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
    function normalize(value){const clean=defaults();if(!value||value.version!==2)return clean;for(const mission of missions){clean.stars[mission.id]=Math.max(0,Math.min(3,Number(value.stars?.[mission.id])||0));if(Number(value.best?.[mission.id])>0)clean.best[mission.id]=Number(value.best[mission.id])}return clean}
    function loadSave(){try{return normalize(JSON.parse(localStorage.getItem(SAVE_KEY)))}catch{return defaults()}}
    function persist(){save.updatedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(save));renderCampaign()}
    function encodeSave(){const body=btoa(unescape(encodeURIComponent(JSON.stringify(save))));return`POST2.${body}.${checksum(body)}`}
    function decodeSave(code){const parts=code.trim().split(".");if(parts.length!==3||parts[0]!=="POST2"||checksum(parts[1])!==parts[2])throw Error("邮局档案校验失败");return normalize(JSON.parse(decodeURIComponent(escape(atob(parts[1])))))}
    function blocked(mission,courier,slot){return mission.blocks.some(item=>item.courier===courier&&item.slot===slot)}
    function evaluate(mission,schedule){const errors=[],occupancy={swift:Array(mission.slots).fill(null),anchor:Array(mission.slots).fill(null)},byId=new Map(mission.tasks.map(item=>[item.id,item]));for(const item of mission.tasks){const entry=schedule[item.id];if(!entry){errors.push(`${item.name} 尚未排入班表`);continue}const courier=couriers[entry.courier];if(!courier){errors.push(`${item.name} 未指定有效信使`);continue}if(entry.start<item.earliest||entry.start+item.duration>item.deadline||entry.start+item.duration>mission.slots)errors.push(`${item.name} 超出 ${item.earliest+1}-${item.deadline} 时窗`);if(item.load>courier.capacity)errors.push(`${courier.name} 无法承载 ${item.name} 的 ${item.load} 级载重`);if(!courier.skills.includes(item.skill))errors.push(`${courier.name} 不具备 ${skillNames[item.skill]}资质`);for(let slot=entry.start;slot<entry.start+item.duration;slot++){if(blocked(mission,entry.courier,slot))errors.push(`${courier.name} 在时刻 ${slot+1} 的通道被封锁`);if(occupancy[entry.courier][slot])errors.push(`${courier.name} 在时刻 ${slot+1} 出现任务重叠`);else occupancy[entry.courier][slot]=item.id}}
      for(const item of mission.tasks){const entry=schedule[item.id];if(!entry)continue;for(const flag of item.requires){const producer=mission.tasks.find(other=>other.produces.includes(flag)),source=producer&&schedule[producer.id];if(!producer||!source||source.start+producer.duration>entry.start)errors.push(`${item.name} 必须等待 ${producer?.name||flag} 先送达`)}}
      for(let i=0;i<mission.tasks.length;i++)for(let j=i+1;j<mission.tasks.length;j++){const a=mission.tasks[i],b=mission.tasks[j],sa=schedule[a.id],sb=schedule[b.id];if(!sa||!sb||a.zone!==b.zone)continue;const overlap=sa.start<sb.start+b.duration&&sb.start<sa.start+a.duration;if(overlap)errors.push(`${a.name} 与 ${b.name} 不能同时经过${a.zone}`)}
      const makespan=Math.max(0,...mission.tasks.map(item=>schedule[item.id]?schedule[item.id].start+item.duration:0));return{valid:errors.length===0,errors:[...new Set(errors)],makespan,occupancy,byId}}
    function validateContent(){if(missions.length!==12)throw Error("委托数量错误");for(const mission of missions){const ids=new Set(mission.tasks.map(item=>item.id));if(ids.size!==mission.tasks.length||Object.keys(mission.reference).length!==mission.tasks.length)throw Error(`${mission.id} 事项配置错误`);const result=evaluate(mission,mission.reference);if(!result.valid||result.makespan>mission.target)throw Error(`${mission.id} 参考班表失败：${result.errors[0]||"超时"}`)}return{missions:missions.length,referencesPassed:missions.length,scheduledTasks:missions.reduce((sum,mission)=>sum+mission.tasks.length,0),targetSlots:missions.reduce((sum,mission)=>sum+mission.target,0)}}
    function unlocked(index){return index===0||Number(save.stars[missions[index-1].id])>0}
    function begin(index=0){if(!unlocked(index))return;q={index,mission:missions[index],schedule:{},history:[],hints:0,checks:0,current:-1,running:false};selected=null;renderAll();setStatus("先选择待投递事项，再点击信使行中的出发时刻。长任务会连续占用多个时刻。")}
    function setStatus(text){statusEl.textContent=text}
    function renderCampaign(){const stars=Object.values(save.stars).reduce((sum,n)=>sum+Number(n||0),0);$("starTotal").textContent=`${stars} / 36`;$("perfectTotal").textContent=`${Object.values(save.stars).filter(n=>n===3).length} / 12`;const best=Object.values(save.best);$("bestSpan").textContent=best.length?Math.min(...best):"--"}
    function renderMissions(){missionEl.replaceChildren();missions.forEach((mission,index)=>{const button=document.createElement("button"),stars=Number(save.stars[mission.id])||0;button.className=`mission${q?.index===index?" active":""}${unlocked(index)?"":" locked"}`;button.innerHTML=`${String(index+1).padStart(2,"0")}<small>${stars?"★".repeat(stars):""}</small>`;button.disabled=!unlocked(index);button.title=mission.title;button.onclick=()=>begin(index);missionEl.append(button)})}
    function requirementNames(item){return item.requires.map(flag=>q.mission.tasks.find(other=>other.produces.includes(flag))?.name).filter(Boolean)}
    function renderTasks(){taskEl.replaceChildren();for(const item of q.mission.tasks){const button=document.createElement("button"),requirements=requirementNames(item);button.className=`task${selected===item.id?" selected":""}${q.schedule[item.id]?" assigned":""}`;button.innerHTML=`<b>${item.name}</b><span>${item.duration} 时段 · 载重 ${item.load} · 最晚 ${item.deadline}</span><span>${requirements.length?`前置：${requirements.join(" / ")}`:"无前置因果"}</span><span class="skill ${item.skill}">${skillNames[item.skill]}</span>`;button.onclick=()=>{selected=selected===item.id?null:item.id;renderTasks();setStatus(selected?`已选择“${item.name}”，请选择信使与出发时刻。`:"已取消事项选择。")};taskEl.append(button)}}
    function renderTimeline(){const mission=q.mission,compact=innerWidth<=680,labelWidth=compact?78:118,slotWidth=compact?52:70,columns=`${labelWidth}px repeat(${mission.slots},minmax(${slotWidth}px,1fr))`;timelineEl.style.gridTemplateColumns=columns;timelineEl.style.minWidth=compact?`${labelWidth+mission.slots*slotWidth+14}px`:"700px";timelineEl.replaceChildren();const corner=document.createElement("div");corner.className="time-head";corner.textContent=compact?"信使":"信使 / 时刻";timelineEl.append(corner);for(let slot=0;slot<mission.slots;slot++){const head=document.createElement("div");head.className="time-head";head.textContent=`T${slot+1}`;timelineEl.append(head)}for(const courierId of["swift","anchor"]){const label=document.createElement("div");label.className="courier-label";label.innerHTML=`${couriers[courierId].name}<small>载重 ${couriers[courierId].capacity}</small>`;timelineEl.append(label);for(let slot=0;slot<mission.slots;slot++){const cell=document.createElement("button"),taskAt=mission.tasks.find(item=>{const entry=q.schedule[item.id];return entry?.courier===courierId&&slot>=entry.start&&slot<entry.start+item.duration}),entry=taskAt&&q.schedule[taskAt.id],isStart=taskAt&&entry.start===slot,isBlocked=blocked(mission,courierId,slot);cell.className=`slot${isBlocked?" blocked":""}${taskAt?` busy ${courierId}${isStart?"":" continue"}`:""}${q.current===slot?" current":""}`;cell.disabled=isBlocked||q.running;if(isBlocked)cell.textContent="封";else if(taskAt)cell.textContent=isStart?(compact?taskAt.name.slice(0,4):taskAt.name):"续";cell.onclick=()=>{if(taskAt){snapshot();delete q.schedule[taskAt.id];selected=taskAt.id;renderAll();setStatus(`已从班表移除“${taskAt.name}”，可重新安排。`)}else assign(courierId,slot)};timelineEl.append(cell)}}}
    function renderPanel(){const result=evaluate(q.mission,q.schedule);$("assigned").textContent=`${Object.keys(q.schedule).length} / ${q.mission.tasks.length}`;$("span").textContent=result.makespan;$("checks").textContent=q.checks;$("title").textContent=`${String(q.index+1).padStart(2,"0")} · ${q.mission.title}`;$("brief").textContent=q.mission.brief;$("goal").textContent=`${q.mission.slots} 时刻 · 三星目标 T${q.mission.target}`;$("undo").disabled=!q.history.length||q.running;$("execute").disabled=q.running}
    function renderAll(){renderCampaign();renderMissions();renderTasks();renderTimeline();renderPanel()}
    function snapshot(){q.history.push(JSON.parse(JSON.stringify(q.schedule)))}
    function assign(courierId,start){if(!selected){setStatus("请先从待投递事项中选择一项。");return}const item=q.mission.tasks.find(task=>task.id===selected),courier=couriers[courierId];if(!courier.skills.includes(item.skill)){setStatus(`${courier.name} 不具备${skillNames[item.skill]}资质。`);return}if(item.load>courier.capacity){setStatus(`${item.name} 载重为 ${item.load}，超过${courier.name}的承载能力。`);return}if(start<item.earliest||start+item.duration>item.deadline||start+item.duration>q.mission.slots){setStatus(`${item.name} 必须在 T${item.earliest+1}-T${item.deadline} 内完成。`);return}for(let slot=start;slot<start+item.duration;slot++)if(blocked(q.mission,courierId,slot)){setStatus(`${courier.name}在 T${slot+1} 的通道被封锁。`);return}snapshot();q.schedule[item.id]={courier:courierId,start};selected=null;renderAll();setStatus(`已将“${item.name}”交给${courier.name}，因果前置将在运行时统一校验。`)}
    function tone(freq,duration=.08){try{audio??=new AudioContext();const osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=freq;gain.gain.setValueAtTime(.04,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain).connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}catch{}}
    async function execute(){const result=evaluate(q.mission,q.schedule);if(!result.valid){q.checks++;renderPanel();setStatus(result.errors[0]);$("log").textContent=result.errors.slice(0,3).join("；");tone(90,.18);return}q.running=true;$("log").textContent="班表开始运行。";for(let slot=0;slot<result.makespan;slot++){q.current=slot;renderTimeline();const active=q.mission.tasks.filter(item=>q.schedule[item.id].start===slot).map(item=>`${couriers[q.schedule[item.id].courier].name}出发：${item.name}`);$("log").textContent=active.length?`T${slot+1} · ${active.join("；")}`:`T${slot+1} · 因果窗口稳定`;tone(300+slot*45);await new Promise(resolve=>setTimeout(resolve,220))}q.current=-1;q.running=false;const perfect=q.checks===0,stars=1+(perfect?1:0)+(perfect&&q.hints===0&&result.makespan<=q.mission.target?1:0),id=q.mission.id;save.stars[id]=Math.max(Number(save.stars[id])||0,stars);save.best[id]=Math.min(save.best[id]||Infinity,result.makespan);persist();renderAll();$("resultTitle").textContent="因果闭环成立";$("resultText").textContent=`${q.mission.tasks.length} 项投递在 T${result.makespan} 前完成，未来路线已经稳定。`;$("resultStars").textContent="★".repeat(stars)+"☆".repeat(3-stars);$("next").textContent=q.index<missions.length-1?"下一份委托":"返回终班";$("result").hidden=false;tone(560,.2)}
    function hint(){const item=q.mission.tasks.find(task=>!q.schedule[task.id]);if(!item){setStatus("所有事项都已排入班表，可以运行校验。");return}snapshot();q.schedule[item.id]={...q.mission.reference[item.id]};q.hints++;selected=null;renderAll();setStatus(`已按参考班表排入“${item.name}”，本次最多获得二星。`)}
    $("execute").onclick=execute;$("hint").onclick=hint;$("reset").onclick=()=>begin(q.index);$("undo").onclick=()=>{const previous=q.history.pop();if(previous===undefined)return;q.schedule=previous;selected=null;renderAll();setStatus("已撤回上一次排班变更。")};$("next").onclick=()=>{$("result").hidden=true;begin(Math.min(missions.length-1,q.index+1))};
    $("exportSave").onclick=async()=>{const code=encodeSave();try{await navigator.clipboard.writeText(code);setStatus("POST2 档案码已复制。") }catch{prompt("POST2 档案码",code)}};$("importSave").onclick=()=>{const code=prompt("输入 POST2 档案码");if(!code)return;try{save=decodeSave(code);persist();begin(0);setStatus("邮局档案导入完成。") }catch(error){setStatus(error.message)}};
    addEventListener("keydown",event=>{if(event.code==="Enter"&&!q.running)execute();if(event.code==="Escape"){selected=null;renderTasks()}});
    window.__timePostTest={validateContent,evaluate,missions,getState:()=>({index:q.index,schedule:q.schedule})};validateContent();begin(0);
  })();
  </script>
