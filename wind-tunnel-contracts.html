<title>风洞试验：十二组升阻合同</title>
<style>
:root{color-scheme:dark;--bg:#10151a;--panel:#1b2930;--panel2:#121d23;--line:#46616c;--text:#eff8f4;--muted:#b4c8c5;--aqua:#73dfcf;--gold:#f1c56c;--green:#7fd59b;--red:#ff8d8d;--blue:#85c8ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% -30%,#38616a,#0b1015 56%);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}button,textarea{font:inherit;color:inherit}.app{width:min(1340px,100%);margin:auto;padding:10px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:9px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:clamp(23px,3.5vw,36px);letter-spacing:0}.sub{margin-top:3px;color:var(--muted);font-size:10px;line-height:1.55}.stats{display:flex;gap:6px;flex-wrap:wrap}.stat{min-width:78px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#111d23}.stat small{display:block;color:var(--muted);font-size:8px}.stat b{color:var(--aqua);font-size:16px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:9px;margin-top:9px}.panel{border:1px solid var(--line);border-radius:9px;background:rgba(27,41,48,.97)}.lab{padding:10px;min-width:0}.lab-head{display:flex;justify-content:space-between;gap:9px}.lab h2{margin:0;font-size:19px}.chapter{height:max-content;padding:4px 7px;border:1px solid var(--blue);border-radius:5px;color:var(--blue);font-size:8px;font-weight:900}canvas{display:block;width:100%;aspect-ratio:16/5.1;margin-top:8px;border:1px solid #557681;border-radius:8px;background:#0d171c}.controls{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.btn{min-height:40px;padding:8px 10px;border:1px solid #55747d;border-radius:6px;background:#29444d;font-weight:900;cursor:pointer}.btn:hover{filter:brightness(1.13)}.btn.primary{border-color:var(--gold);background:var(--gold);color:#19252a}.btn.aqua{border-color:var(--aqua);background:var(--aqua);color:#08211e}.message{min-height:43px;margin-top:8px;padding:8px;border-left:3px solid var(--gold);background:#111d23;font-size:9px;line-height:1.55}.side{display:flex;flex-direction:column;gap:8px}.section{padding:10px}.section h2{margin:0 0 7px;font-size:14px}.group+.group{margin-top:7px}.group-head{display:flex;justify-content:space-between;gap:5px;margin-bottom:4px;color:var(--muted);font-size:8px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.option{min-height:42px;padding:5px;border:1px solid #46616c;border-radius:5px;background:#111d23;text-align:left;cursor:pointer;font-size:8px}.option.active{border-color:var(--aqua);outline:1px solid var(--aqua);background:#1d4550}.option b,.option small{display:block}.option small{margin-top:2px;color:var(--muted);font-size:7px;line-height:1.25}.runs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.run{padding:7px;border:1px solid #46616c;border-radius:6px;background:#111d23;font-size:8px;line-height:1.52}.run.bad{border-color:var(--red)}.run b{display:block;color:var(--gold)}.rule{padding:7px;border:1px solid #46616c;border-radius:6px;background:#111d23;font-size:8px;line-height:1.5}.rule+.rule{margin-top:5px}.rule b{color:var(--aqua)}.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:12px;background:#070b0eef}.overlay.hidden{display:none}.modal{width:min(1000px,100%);max-height:93vh;overflow:auto;padding:15px;border:1px solid #557681;border-radius:9px;background:#1b2930}.modal h2{margin:0 0 5px;font-size:25px}.modal>p{margin:0 0 11px;color:var(--muted);font-size:10px;line-height:1.55}.contracts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.contract-card{text-align:left;min-height:126px;padding:9px;border:1px solid #46616c;border-radius:7px;background:#111d23;cursor:pointer}.contract-card:disabled{opacity:.36}.contract-card span{font-size:24px}.contract-card h3{margin:4px 0;font-size:13px}.contract-card p{margin:0;color:var(--muted);font-size:8px;line-height:1.45}.stars{color:var(--gold)}.result{padding:12px;border:1px solid #557681;border-radius:7px;background:#111d23}.result strong{color:var(--gold);font-size:24px}.result ul{padding-left:18px;color:var(--muted);font-size:9px;line-height:1.7}.savebox{width:100%;height:130px;padding:8px;border:1px solid #55747d;background:#0d171c}.toast{position:fixed;z-index:50;left:50%;bottom:17px;transform:translateX(-50%);padding:8px 12px;border:1px solid var(--gold);border-radius:6px;background:#29444d;font-size:9px}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.side .panel:last-child{grid-column:1/-1}}@media(max-width:580px){.app{padding:5px}.top{align-items:flex-start;flex-direction:column}.stats{width:100%}.stat{flex:1;min-width:58px}.lab{padding:7px}.lab-head{display:block}.chapter{display:inline-block;margin-top:4px}canvas{aspect-ratio:10/6}.controls{display:grid;grid-template-columns:repeat(2,1fr)}.side{display:flex}.contracts{grid-template-columns:1fr}.contract-card{min-height:104px}.options{grid-template-columns:repeat(2,1fr)}.runs{grid-template-columns:1fr}}
</style>

<body>
<main class="app"><header class="top"><div><h1>风洞试验：十二组升阻合同</h1><div class="sub">在三档来流下同时签署升力、阻力、失速余量与试验资源合同。此页为离散抽象益智模型，不用于真实航空设计、试验或安全决策。</div></div><div class="stats"><div class="stat"><small>合同</small><b id="contractStat">1 / 12</b></div><div class="stat"><small>合格工况</small><b id="passStat">0 / 3</b></div><div class="stat"><small>资源</small><b id="energyStat">0</b></div><div class="stat"><small>风险</small><b id="riskStat">0</b></div><div class="stat"><small>最佳</small><b id="starStat">☆☆☆</b></div></div></header><div class="layout"><section class="panel lab"><div class="lab-head"><div><h2 id="contractTitle"></h2><div class="sub" id="contractBrief"></div></div><span class="chapter" id="chapterLabel"></span></div><canvas id="polarCanvas" width="960" height="300" aria-label="抽象风洞升阻曲线"></canvas><div class="controls"><button class="btn primary" id="submitBtn">签署试验合同</button><button class="btn aqua" id="hintBtn">工程师校样</button><button class="btn" id="undoBtn">撤回参数</button><button class="btn" id="resetBtn">恢复基线</button><button class="btn" id="archiveBtn">档案码</button><button class="btn" id="bookBtn">合同目录</button></div><div class="message" id="message"></div></section><aside class="side"><section class="panel section"><h2>试件参数</h2><div id="parameterGroups"></div></section><section class="panel section"><h2>三档风速验收</h2><div class="runs" id="runs"></div></section><section class="panel section"><h2>合同约束</h2><div id="rules"></div></section></aside></div></main>
<div class="overlay" id="bookOverlay"><section class="modal"><h2>十二组升阻合同</h2><p>每组合同都把三个离散风速同时纳入验收。正式枚举器遍历全部翼型、迎角、襟翼与表面组合，在零风险方案中先取最低资源、再取最低总阻力作为官方三星校样。</p><div class="contracts" id="contracts"></div></section></div>
<div class="overlay hidden" id="infoOverlay"><section class="modal"><h2 id="infoTitle"></h2><div id="infoBody"></div><div class="controls"><button class="btn primary" id="closeInfoBtn">返回风洞台</button></div></section></div>
<script>
(()=>{"use strict";const $=id=>document.getElementById(id),SAVE="windTunnelContractsV1",canvas=$("polarCanvas"),ctx=canvas.getContext("2d");
const WINGS={stream:{n:"细弦翼",lift:.94,drag:.64,stall:12,cost:2,desc:"低阻基础"},survey:{n:"巡测翼",lift:1.06,drag:.76,stall:15,cost:3,desc:"均衡巡测"},cargo:{n:"厚升力翼",lift:1.20,drag:.94,stall:18,cost:4,desc:"低速升力"},stable:{n:"稳态翼",lift:1.12,drag:.83,stall:17,cost:5,desc:"余量优先"}};
const ANGLES=[0,2,4,6,8],FLAPS=[0,5,10],SURF={matte:{n:"哑光",gain:0,cost:0,desc:"基线"},seal:{n:"封层",gain:.06,cost:1,desc:"减阻层"},polish:{n:"抛光",gain:.12,cost:2,desc:"高效表面"}};
const SEEDS=[["起始巡测","在中低风速保持均衡，合同首次引入表面处理。","survey",4,5,"seal"],["山口逆风","迎角不能只看一档风速，失速余量也要签字。","stable",4,0,"matte"],["低速升力","把厚翼与襟翼的增升换成可控阻力。","cargo",4,5,"seal"],["高空巡航","低阻表面有成本，只有三档都合格才有意义。","survey",6,0,"polish"],["侧风记录","中等迎角的裕度更重要，避免在最慢档掉出升力线。","stable",2,5,"seal"],["运载校核","低风速加升力，高风速守住阻力合同。","cargo",2,10,"polish"],["薄翼复核","细弦翼需要更精确的迎角和表面组合。","stream",6,5,"polish"],["夜航机位","同一试件在三档速度的曲线不能出现孤立超限。","survey",4,10,"polish"],["云层采样","资源上限压缩后，参数会从单点最优变为整体可行。","stable",6,0,"seal"],["高升力验收","襟翼越大不一定更好，峰值阻力会同时增长。","cargo",4,10,"seal"],["远程标定","用细弦翼争取低阻，但不能牺牲低速升力。","stream",8,5,"polish"],["终局：三速合同","把翼型、迎角、襟翼、表面四个杠杆同时纳入最终窗口。","stable",4,10,"polish"]];
function round(n){return Math.round(n*100)/100}function run(plan,speed){const w=WINGS[plan.wing],a=+plan.angle,f=+plan.flap,z=SURF[plan.surface];const lift=round(w.lift*speed*speed*(1+a*.072+f*.016));const drag=round(w.drag*speed*speed*(1+a*.052+f*.055-z.gain));const margin=round(w.stall-a+f*.18);return{speed,lift,drag,margin}}function energy(plan){return round(WINGS[plan.wing].cost+(+plan.angle)*.22+(+plan.flap)*.14+SURF[plan.surface].cost)}function simulate(plan,c){return{rows:c.speeds.map(speed=>run(plan,speed)),energy:energy(plan)}}
function buildContract(index){const [name,brief,wing,angle,flap,surface]=SEEDS[index],planned={wing,angle,flap,surface},speeds=[round(.76+(index%3)*.025),1,round(1.18+(index%2)*.035)],base=simulate(planned,{speeds}),checks=base.rows.map(row=>({lift:round(row.lift*.985),drag:round(row.drag*1.055),margin:round(row.margin-1)}));return{index,name,brief,chapter:Math.floor(index/3),speeds,checks,budget:round(base.energy+.01),initial:{wing:"stream",angle:0,flap:0,surface:"matte"},planned}}
const CONTRACTS=SEEDS.map((_,i)=>buildContract(i));
function evaluate(index,plan,hints=0){const c=CONTRACTS[index],s=simulate(plan,c),errors=[],rows=s.rows.map((row,i)=>{const check=c.checks[i],issues=[];if(row.lift<check.lift)issues.push("升力");if(row.drag>check.drag)issues.push("阻力");if(row.margin<check.margin)issues.push("余量");return{...row,check,issues,ok:!issues.length}});if(s.energy>c.budget)errors.push("资源预算超限");rows.forEach((row,i)=>{if(!row.ok)errors.push(`第 ${i+1} 档：${row.issues.join("/")}超限`)});const pass=!errors.length,efficient=pass&&s.energy<=c.objectiveEnergy&&rows.reduce((a,x)=>a+x.drag,0)<=c.objectiveDrag+.001,stars=pass?1+(efficient?1:0)+(efficient&&hints===0?1:0):0;return{pass,errors,rows,energy:s.energy,efficient,stars,hints}}
function solve(index){const c=CONTRACTS[index];let best=null;for(const wing of Object.keys(WINGS))for(const angle of ANGLES)for(const flap of FLAPS)for(const surface of Object.keys(SURF)){const plan={wing,angle,flap,surface},r=evaluate(index,plan,0);if(!r.pass)continue;const drag=round(r.rows.reduce((s,x)=>s+x.drag,0));if(!best||r.energy<best.energy||(r.energy===best.energy&&drag<best.drag))best={plan,energy:r.energy,drag}}return best}
CONTRACTS.forEach(c=>{const intended=simulate(c.planned,c);c.objectiveEnergy=intended.energy;c.objectiveDrag=round(intended.rows.reduce((s,x)=>s+x.drag,0));const found=solve(c.index);if(found){c.reference=found.plan;c.objectiveEnergy=found.energy;c.objectiveDrag=found.drag}});
function validateContent(){const errors=[],references=[];for(const c of CONTRACTS){const r=evaluate(c.index,c.reference,0),initial=evaluate(c.index,c.initial,0),found=solve(c.index);if(r.stars!==3)errors.push(`${c.name} 参考校样未三星`);if(initial.pass)errors.push(`${c.name} 基线已通过`);if(!found||found.energy!==c.objectiveEnergy)errors.push(`${c.name} 枚举器未找到最低资源解`);references.push({name:c.name,energy:c.objectiveEnergy,drag:c.objectiveDrag,stars:r.stars})}return{valid:!errors.length,errors,contracts:CONTRACTS.length,runs:CONTRACTS.length*3,wings:Object.keys(WINGS).length,references}}
function freshProfile(){return{v:1,unlocked:1,stars:Array(12).fill(0),best:Array(12).fill(null),clears:0}}function norm(v={}){return{v:1,unlocked:Math.max(1,Math.min(12,+v.unlocked||1)),stars:Array.from({length:12},(_,i)=>Math.max(0,Math.min(3,+v.stars?.[i]||0))),best:Array.from({length:12},(_,i)=>Number.isFinite(v.best?.[i])?v.best[i]:null),clears:+v.clears||0}}function fresh(index){return{v:1,contract:index,plan:{...CONTRACTS[index].initial},history:[],hints:0,message:"调整四项试件参数，三档风速会同时重新验收。"}}
let profile=freshProfile(),q=null;function hash(t){let h=2166136261;for(const c of t){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}function encode(){const raw=JSON.stringify({v:1,profile,q}),body=btoa(unescape(encodeURIComponent(raw)));return`TUNNEL1.${body}.${hash(body)}`}function decode(code){const m=String(code).trim().match(/^TUNNEL1\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/);if(!m||hash(m[1])!==m[2])throw Error("档案校验失败");const d=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(d.v!==1)throw Error("档案版本不兼容");return{profile:norm(d.profile),q:d.q}}function save(){localStorage.setItem(SAVE,JSON.stringify({v:1,profile,q}))}function load(){try{const d=JSON.parse(localStorage.getItem(SAVE));if(d?.v===1){profile=norm(d.profile);q=d.q}}catch{}}function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),1400)}
function start(index){if(index>=profile.unlocked)return;q=fresh(index);$("bookOverlay").classList.add("hidden");$("infoOverlay").classList.add("hidden");save();draw()}function setParam(key,value){if(q.plan[key]===value)return;q.history.push({plan:{...q.plan}});q.plan[key]=key==="angle"||key==="flap"?+value:value;q.message="试件参数已更新，三档曲线已重算。";save();draw()}function undo(){const old=q.history.pop();if(!old)return toast("没有可撤回的参数");q.plan=old.plan;q.message="已撤回上一项参数。";save();draw()}function hint(){const c=CONTRACTS[q.contract];q.history.push({plan:{...q.plan}});q.plan={...c.reference};q.hints++;q.message="工程师已装入官方校样；本合同最高两星。";save();draw();return evaluate(q.contract,q.plan,q.hints)}function submit(){const c=CONTRACTS[q.contract],r=evaluate(q.contract,q.plan,q.hints);if(!r.pass){q.message=`合同未通过：${r.errors[0]||"存在风险"}。`;save();draw();return r}profile.stars[q.contract]=Math.max(profile.stars[q.contract],r.stars);profile.best[q.contract]=profile.best[q.contract]==null?r.energy:Math.min(profile.best[q.contract],r.energy);profile.unlocked=Math.max(profile.unlocked,Math.min(12,q.contract+2));profile.clears++;save();$("infoTitle").textContent=`试验记录归档 · ${c.name}`;$("infoBody").innerHTML=`<div class="result"><strong>${"★".repeat(r.stars)}${"☆".repeat(3-r.stars)}</strong><ul><li>三档风速的升力、阻力与失速余量均已签署</li><li>试验资源：${r.energy} / 三星线 ${c.objectiveEnergy}</li><li>总阻力：${round(r.rows.reduce((s,x)=>s+x.drag,0))} / 三星线 ${c.objectiveDrag}</li><li>工程师校样：${q.hints} 次</li></ul>${q.contract<11?'<button class="btn primary" id="nextBtn">下一组合同</button>':""}</div>`;$("infoOverlay").classList.remove("hidden");if($("nextBtn"))$("nextBtn").onclick=()=>start(q.contract+1);draw();return r}
function drawCanvas(){const c=CONTRACTS[q.contract],r=evaluate(q.contract,q.plan,q.hints),w=960,h=300,left=74,right=900,top=35,bottom=243;ctx.clearRect(0,0,w,h);ctx.fillStyle="#0d171c";ctx.fillRect(0,0,w,h);ctx.strokeStyle="#35515c";ctx.lineWidth=1;for(let i=0;i<5;i++){const y=top+i*(bottom-top)/4;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke()}ctx.fillStyle="#b4c8c5";ctx.font="11px sans-serif";ctx.textAlign="left";ctx.fillText("归一化系数",12,24);const series=[{key:"lift",n:"升力",c:"#73dfcf",scale:2.4},{key:"drag",n:"阻力",c:"#f1c56c",scale:2.4}];series.forEach((s,si)=>{ctx.strokeStyle=s.c;ctx.lineWidth=3;ctx.beginPath();r.rows.forEach((row,i)=>{const x=left+i*(right-left)/2,y=bottom-row[s.key]/s.scale*(bottom-top);if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);ctx.fillStyle=s.c;ctx.fillRect(x-4,y-4,8,8)});ctx.stroke();ctx.fillStyle=s.c;ctx.font="bold 12px sans-serif";ctx.fillText(s.n,760+si*62,25)});r.rows.forEach((row,i)=>{const x=left+i*(right-left)/2;ctx.fillStyle="#b4c8c5";ctx.font="11px sans-serif";ctx.textAlign="center";ctx.fillText(`档 ${i+1} · ${row.speed}V`,x,267);ctx.fillStyle=row.ok?"#7fd59b":"#ff8d8d";ctx.fillText(row.ok?"全项合格":row.issues.join("/"),x,287)});ctx.fillStyle="#85c8ff";ctx.textAlign="left";ctx.font="11px sans-serif";ctx.fillText(`当前：${WINGS[q.plan.wing].n} / ${q.plan.angle}° / 襟翼 ${q.plan.flap}° / ${SURF[q.plan.surface].n}`,78,22)}
function options(key,items,value,text,detail){return`<div class="group"><div class="group-head"><b>${text}</b><span>${detail}</span></div><div class="options">${items.map(([id,item])=>`<button class="option ${String(value)===String(id)?"active":""}" data-param="${key}" data-value="${id}"><b>${item.n||`${id}°`}</b><small>${item.desc||"离散档位"}</small></button>`).join("")}</div></div>`}function drawBook(){$("contracts").innerHTML=CONTRACTS.map((c,i)=>`<button class="contract-card" data-contract="${i}" ${i>=profile.unlocked?"disabled":""}><span>${["⌁","◫","≋","✧"][c.chapter]}</span><h3>${i+1}. ${c.name}</h3><p>第 ${c.chapter+1} 章 · 3 档风速 · 三星资源 ${c.objectiveEnergy}<br>${c.brief}</p><div class="stars">${"★".repeat(profile.stars[i])}${"☆".repeat(3-profile.stars[i])}</div></button>`).join("");document.querySelectorAll("[data-contract]").forEach(b=>b.onclick=()=>start(+b.dataset.contract))}
function draw(){if(!q)return;const c=CONTRACTS[q.contract],r=evaluate(q.contract,q.plan,q.hints),ok=r.rows.filter(x=>x.ok).length;$("contractStat").textContent=`${q.contract+1} / 12`;$("passStat").textContent=`${ok} / 3`;$("energyStat").textContent=`${r.energy} / ${c.budget}`;$("riskStat").textContent=r.errors.length;$("starStat").textContent="★".repeat(profile.stars[q.contract])+"☆".repeat(3-profile.stars[q.contract]);$("contractTitle").textContent=`≋ ${c.name}`;$("contractBrief").textContent=c.brief;$("chapterLabel").textContent=`第 ${c.chapter+1} 章 · 三档来流`;$("message").textContent=q.message;$("parameterGroups").innerHTML=options("wing",Object.entries(WINGS),q.plan.wing,"翼型","升力 / 阻力基线")+options("angle",ANGLES.map(v=>[v,{n:`${v}°`,desc:"迎角"}]),q.plan.angle,"迎角","影响升阻与余量")+options("flap",FLAPS.map(v=>[v,{n:`${v}°`,desc:"襟翼偏转"}]),q.plan.flap,"襟翼","增升与阻力")+options("surface",Object.entries(SURF),q.plan.surface,"表面处理","减阻与资源");document.querySelectorAll("[data-param]").forEach(b=>b.onclick=()=>setParam(b.dataset.param,b.dataset.value));$("runs").innerHTML=r.rows.map((row,i)=>`<div class="run ${row.ok?"":"bad"}"><b>第 ${i+1} 档 · ${row.speed}V</b>升 ${row.lift} / ≥${row.check.lift}<br>阻 ${row.drag} / ≤${row.check.drag}<br>余 ${row.margin} / ≥${row.check.margin}</div>`).join("");$("rules").innerHTML=`<div class="rule"><b>三档共同验收</b>升力不得低于下线、阻力不得超过上线、失速余量不得低于下线。</div><div class="rule"><b>资源预算</b>当前 ${r.energy} / 合同 ${c.budget}；资源超限即拒签。</div><div class="rule"><b>三星校样</b>零风险、资源 ≤ ${c.objectiveEnergy}、总阻力 ≤ ${c.objectiveDrag}，且不请求工程师校样。</div><div class="rule"><b>模型边界</b>本页参数为抽象规则，不应用于真实航空器设计、试验或安全决策。</div>`;drawCanvas();drawBook();save()}
function showArchive(){const code=encode();$("infoTitle").textContent="跨设备风洞档案";$("infoBody").innerHTML=`<p class="sub">星级、最低资源记录与当前四项参数已封装在带校验的档案码中。</p><textarea class="savebox" id="saveCode">${code}</textarea><div class="controls"><button class="btn" id="copyBtn">复制导出</button><button class="btn" id="importBtn">导入上方档案</button></div>`;$("infoOverlay").classList.remove("hidden");$("copyBtn").onclick=()=>navigator.clipboard?.writeText($("saveCode").value);$("importBtn").onclick=()=>{try{const d=decode($("saveCode").value);profile=d.profile;q=d.q||fresh(0);save();$("infoOverlay").classList.add("hidden");draw();toast("风洞档案导入成功")}catch(e){toast(e.message)}}}
$("submitBtn").onclick=submit;$("hintBtn").onclick=hint;$("undoBtn").onclick=undo;$("resetBtn").onclick=()=>start(q.contract);$("archiveBtn").onclick=showArchive;$("bookBtn").onclick=()=>{$("bookOverlay").classList.remove("hidden");drawBook()};$("closeInfoBtn").onclick=()=>$('infoOverlay').classList.add("hidden");load();drawBook();if(q){$("bookOverlay").classList.add("hidden");draw()}
window.__windTunnelContracts={CONTRACTS,WINGS,ANGLES,FLAPS,SURF,run,simulate,evaluate,solve,validateContent,fresh,state:()=>q,profile:()=>profile,start,setParam,hint,submit,encode,decode};
})();
</script>
