<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>像素线索：十二卷逻辑图鉴</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23223530'/%3E%3Cpath d='M12 12h40v40H12z' fill='%23fff7df'/%3E%3Cpath d='M12 28h40M28 12v40M44 12v40' stroke='%23223530' stroke-width='3'/%3E%3Cpath d='M29 29h14v14H29z' fill='%23438671'/%3E%3C/svg%3E">
  <style>
    :root{--deep:#223530;--paper:#fffdf3;--ground:#e7ece6;--line:#9aa9a1;--ink:#20312b;--muted:#68776f;--green:#438671;--blue:#4f80a0;--gold:#d9a943;--red:#c75b5f;--radius:7px;--shadow:0 14px 32px rgba(31,48,41,.14)}
    *{box-sizing:border-box;letter-spacing:0}html,body{margin:0;min-height:100%;color:var(--ink);background:var(--ground);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}button,input{font:inherit}.app{width:min(1190px,calc(100vw - 24px));margin:auto;padding:16px 0 30px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:17px 20px;border-bottom:4px solid var(--gold);color:#fff;background:var(--deep)}h1{margin:0;font-size:28px}.sub{margin:5px 0 0;color:#d1ddd6;font-size:13px}.totals{display:flex;gap:18px;text-align:right}.totals b{display:block;color:#f3cc72;font-size:20px}.totals span{color:#cbd7d0;font-size:10px}.contracts{display:grid;grid-template-columns:repeat(12,minmax(42px,1fr));gap:5px;padding:11px 0}.contract{height:46px;border:1px solid #adb9b2;border-radius:6px;color:#405248;background:#f7f9f6;font-weight:900;cursor:pointer}.contract.active{border-color:var(--green);color:#fff;background:var(--green)}.contract:disabled{opacity:.42}.contract small{display:block;height:11px;color:#f4d17c;font-size:9px}.layout{display:grid;grid-template-columns:minmax(520px,790px) 330px;gap:14px;align-items:start}.workspace{display:grid;grid-template-columns:minmax(390px,1fr) 180px;gap:11px;padding:11px;border:1px solid #71847a;border-radius:var(--radius);background:#17251f;box-shadow:var(--shadow)}.board-wrap{position:relative;display:grid;place-items:center;min-width:0}.board-wrap canvas{display:block;width:min(100%,720px);height:auto;aspect-ratio:18/17;border:1px solid #5d7167;border-radius:6px;background:#101914;touch-action:none}.board-hud{position:absolute;inset:7px 7px auto;display:flex;justify-content:space-between;gap:5px;pointer-events:none}.board-hud span{padding:5px 7px;border:1px solid rgba(255,255,255,.18);border-radius:5px;color:#e3ece6;background:rgba(23,37,31,.9);font-size:10px}.briefing{display:flex;flex-direction:column;gap:9px;min-width:0;color:#e9f1ec}.briefing h2{margin:0;color:#fff;font-size:18px}.brief{margin:0;color:#b9c8bf;font-size:11px;line-height:1.55}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px}.metric{padding:8px;border:1px solid #52675c;border-radius:6px;background:#22342a}.metric b{display:block;color:#72cea8;font-size:17px}.metric span{color:#aebdb4;font-size:9px}.status{min-height:80px;margin:0;padding:9px;border-left:4px solid var(--gold);color:#d2ddd6;background:#22342a;font-size:11px;line-height:1.55}.side{display:flex;flex-direction:column;gap:10px}.panel{padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}.panel h3{margin:0 0 9px;font-size:14px}.kits{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.kit{min-height:66px;padding:6px;border:1px solid #abb8b0;border-radius:6px;color:#405248;background:#f0f4f0;font-size:9px;font-weight:900;cursor:pointer}.kit b{display:block;font-size:12px}.kit.active{border-color:var(--blue);color:#fff;background:var(--blue)}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.tool{min-height:50px;padding:5px;border:1px solid #9eafa5;border-radius:6px;color:#344b3f;background:#edf2ed;font-size:11px;font-weight:900;cursor:pointer}.tool b{display:block;font-size:17px}.tool.active{border-color:var(--green);color:#fff;background:var(--green)}.commands,.archive{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.commands button,.archive button{min-height:40px;border:1px solid #9eafa5;border-radius:6px;color:#344b3f;background:#edf2ed;font-weight:900;cursor:pointer}.commands .primary{grid-column:1/-1;border-color:var(--green);color:#fff;background:var(--green)}.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding:8px;border:1px solid #aab7af;border-radius:6px;color:#4b5d53;background:#f1f5f1;font-size:11px;font-weight:900}.toggle input{width:18px;height:18px;accent-color:var(--green)}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:14px;background:rgba(13,25,19,.9);text-align:center}.overlay[hidden]{display:none}.overlay-card{width:min(370px,100%);padding:22px;border-radius:var(--radius);color:#fff;background:#30453a;box-shadow:0 24px 60px rgba(0,0,0,.45)}.overlay-card h2{margin:0;font-size:24px}.overlay-card p{color:#d2ddd6;line-height:1.6}.overlay-stars{color:#efc668;font-size:34px}.overlay-card button{min-height:42px;padding:0 20px;border:0;border-radius:6px;color:#29382f;background:#efc668;font-weight:900;cursor:pointer}
    @media(max-width:980px){.layout{grid-template-columns:1fr}.workspace{grid-template-columns:minmax(0,1fr) 190px}.side{display:grid;grid-template-columns:1fr 1fr}.archive-panel{grid-column:1/-1}}
    @media(max-width:700px){.app{width:calc(100vw - 12px);padding-top:6px}.head{display:block;padding:13px}.head h1{font-size:22px}.sub{font-size:11px}.totals{justify-content:space-between;margin-top:11px;text-align:left}.contracts{grid-template-columns:repeat(6,1fr)}.contract{height:39px}.workspace{grid-template-columns:minmax(0,1fr);padding:7px}.board-wrap canvas{width:100%}.briefing{padding:4px}.side{display:flex}.panel{padding:10px}.tool{min-height:48px}}

</head>
<body>
  <main class="app">
    <header class="head">
      <div><h1>像素线索：十二卷逻辑图鉴</h1><p class="sub">从行列数字推导隐藏图案；十二张谜格均由正式求解器验证唯一解。</p></div>
      <div class="totals"><div><b id="starTotal">0 / 36</b><span>图鉴星章</span></div><div><b id="clearTotal">0 / 12</b><span>完成卷宗</span></div><div><b id="cleanTotal">0 / 12</b><span>无提示校勘</span></div></div>
    </header>
    <nav class="contracts" id="contracts" aria-label="谜格卷宗"></nav>
    <section class="layout">
      <div class="workspace">
        <div class="board-wrap">
          <canvas id="board" width="720" height="680" aria-label="Nonogram 逻辑谜格"></canvas>
          <div class="board-hud"><span>卷宗 <b id="chapterHud">春 01</b></span><span>操作 <b id="moveHud">0</b></span></div>
          <div class="overlay" id="overlay"><div class="overlay-card"><h2 id="overlayTitle"></h2><p id="overlayText"></p><div class="overlay-stars" id="overlayStars"></div><button id="overlayButton">开始</button></div></div>
        </div>
        <div class="briefing">
          <h2 id="puzzleTitle"></h2>
          <p class="brief" id="puzzleBrief"></p>
          <div class="metrics"><div class="metric"><b id="sizeMetric">5 × 5</b><span>谜格尺寸</span></div><div class="metric"><b id="moveMetric">0 / 0</b><span>操作 / 参考</span></div><div class="metric"><b id="hintMetric">0</b><span>逻辑提示</span></div><div class="metric"><b id="fillMetric">0 / 0</b><span>已填 / 目标</span></div></div>
          <p class="brief">行列数字按顺序表示连续黑格段；不同数字段之间至少空一格。</p>
          <p class="status" id="status"></p>
        </div>
      </div>
      <aside class="side">
        <section class="panel"><h3>选择校勘笔</h3><div class="kits"><button class="kit" data-kit="logic"><b>逻辑笔</b>首条提示免费</button><button class="kit" data-kit="swift"><b>速写笔</b>参考步数放宽</button><button class="kit" data-kit="archive"><b>归档笔</b>完成行自动画叉</button></div></section>
        <section class="panel"><div class="tools"><button class="tool" data-tool="fill"><b>■</b>填黑</button><button class="tool" data-tool="mark"><b>×</b>画叉</button><button class="tool" data-tool="erase"><b>⌫</b>擦除</button></div><label class="toggle"><span>完成行自动排除</span><input id="autoCross" type="checkbox"></label><div class="commands"><button class="primary" id="start">开始卷宗</button><button id="undo">撤回</button><button id="hint">逻辑提示</button><button id="check">检查矛盾</button><button id="clear">清空</button><button id="restart">重开</button></div></section>
        <section class="panel archive-panel"><h3>跨设备图鉴</h3><div class="archive"><button id="exportSave">导出档案</button><button id="importSave">导入档案</button></div></section>
      </aside>
    </section>
  </main>
  <script>
  (()=>{
    "use strict";
    const SAVE_KEY="pixel_clues_v2",chapters=["春芽","夏影","秋灯","冬城"],toolNames={fill:"填黑",mark:"画叉",erase:"擦除"};
    const puzzle=(name,brief,grid)=>({name,brief,grid,rows:grid.length,cols:grid[0].length});
    const puzzles=[
      puzzle("心芽","最小卷宗先练习单段与对称线索。",["01110","11111","11111","01110","00100"]),
      puzzle("晨帆","横向长段与中央桅杆构成第一张航图。",["00100","01110","11111","00100","01110"]),
      puzzle("铜钥","两段线索开始出现在同一行中。",["11100","10100","11100","00100","00111"]),
      puzzle("山月","六行谜格加入分离短段与整行填充。",["001100","011110","110011","111111","010010","100001"]),
      puzzle("林屋","屋檐与窗格要求同时观察行列交叉。",["001100","011110","111111","110011","110011","111111"]),
      puzzle("雨伞","对称伞面之下藏有两段分开的握柄。",["001100","011110","111111","101101","001100","010010"]),
      puzzle("蘑菇邮戳","七行卷宗开始要求连续完成多条边缘线。",["0011100","0111110","1111111","1001001","0011100","0011100","0111110"]),
      puzzle("树冠","宽窄交替的树冠会制造多组相似候选。",["0001000","0011100","0111110","1111111","0011100","0001000","0011100"]),
      puzzle("夜塔","塔顶、灯室与基座需要从高密度列线索反推。",["0011100","0011100","0001000","0011100","0111110","0110110","1111111"]),
      puzzle("巡夜猫","八行谜格组合耳尖、眼睛与分离尾部。",["00100100","01111110","11111111","11011011","11111111","01111110","00111100","01000010"]),
      puzzle("远星火箭","尾焰分叉让底部列线索不再保持对称。",["00011000","00111100","00111100","01111110","01111110","11011011","10011001","00100100"]),
      puzzle("雪冠","终卷把交叉短段、满行与不对称结构叠在一起。",["10000001","11000011","11100111","10111101","11111111","01111110","01111110","00111100"])
    ];
    const $=id=>document.getElementById(id),canvas=$("board"),ctx=canvas.getContext("2d"),overlay=$("overlay"),contractEl=$("contracts");
    let profile=load(),kit=profile.kit||"logic",selected=0,selectedTool="fill",q=makeState(0),activePointer=null,strokeValue=0,patternMemo=new Map();
    function defaults(){return{version:2,stars:{},best:{},clean:{},kit:"logic",autoCross:false,updatedAt:Date.now()}}
    function normalize(value){const clean=defaults();if(!value||value.version!==2)return clean;for(let i=0;i<puzzles.length;i++){clean.stars[i]=Math.max(0,Math.min(3,Number(value.stars?.[i])||0));if(Number.isFinite(Number(value.best?.[i])))clean.best[i]=Math.max(0,Number(value.best[i]));clean.clean[i]=Boolean(value.clean?.[i])}if(["logic","swift","archive"].includes(value.kit))clean.kit=value.kit;clean.autoCross=Boolean(value.autoCross);return clean}
    function load(){try{return normalize(JSON.parse(localStorage.getItem(SAVE_KEY)))}catch{return defaults()}}
    function save(){profile.kit=kit;profile.autoCross=$("autoCross").checked;profile.updatedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(profile));renderCampaign()}
    function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
    function encodeProfile(){const body=btoa(unescape(encodeURIComponent(JSON.stringify(profile))));return`PIXEL2.${body}.${checksum(body)}`}
    function decodeProfile(code){const part=code.trim().split(".");if(part.length!==3||part[0]!=="PIXEL2"||checksum(part[1])!==part[2])throw Error("图鉴档案校验失败");return normalize(JSON.parse(decodeURIComponent(escape(atob(part[1])))))}
    function toMatrix(item){return item.grid.map(row=>[...row].map(Number))}
    function lineClue(line){const result=[];let run=0;for(const value of line){if(value)run++;else if(run){result.push(run);run=0}}if(run)result.push(run);return result.length?result:[0]}
    function cluesFor(item){const grid=toMatrix(item),rows=grid.map(lineClue),cols=Array.from({length:item.cols},(_,x)=>lineClue(grid.map(row=>row[x])));return{rows,cols}}
    function blackCount(item){return item.grid.reduce((total,row)=>total+[...row].filter(value=>value==="1").length,0)}
    function basePar(item){return blackCount(item)+Math.ceil((item.rows+item.cols)/3)}
    function parFor(item){const base=basePar(item);return kit==="swift"?base+Math.ceil(base*.18):base}
    function makeState(index=selected){const item=puzzles[index];return{index,item,cells:Array.from({length:item.rows},()=>Array(item.cols).fill(0)),moves:0,hints:0,paidHints:0,checks:0,history:[],run:false,ended:false,won:false,message:"选择填黑、画叉或擦除，然后在谜格中点击或拖动。"}}
    function cloneCells(cells){return cells.map(row=>row.slice())}
    function groupsEqual(a,b){return a.length===b.length&&a.every((value,index)=>value===b[index])}
    function lineMasks(length,clue){const cacheKey=`${length}|${clue.join(",")}`;if(patternMemo.has(cacheKey))return patternMemo.get(cacheKey);if(clue.length===1&&clue[0]===0){patternMemo.set(cacheKey,[0]);return[0]}const result=[];function place(index,start,mask){if(index===clue.length){result.push(mask);return}const remaining=clue.slice(index).reduce((a,b)=>a+b,0)+(clue.length-index-1);for(let at=start;at+remaining<=length;at++){let next=mask;for(let bit=0;bit<clue[index];bit++)next|=1<<(at+bit);place(index+1,at+clue[index]+1,next)}}place(0,0,0);patternMemo.set(cacheKey,result);return result}
    function countSolutions(item,limit=2){const clues=cluesFor(item),rowDomains=clues.rows.map(clue=>lineMasks(item.cols,clue)),columnDomains=clues.cols.map(clue=>lineMasks(item.rows,clue));let count=0;function search(y,domains){if(count>=limit)return;if(y===item.rows){count++;return}for(const rowMask of rowDomains[y]){const next=[];let valid=true;for(let x=0;x<item.cols;x++){const bit=(rowMask>>x)&1,options=domains[x].filter(mask=>((mask>>y)&1)===bit);if(!options.length){valid=false;break}next.push(options)}if(valid)search(y+1,next)}}search(0,columnDomains);return count}
    function validateContent(){const signatures=new Set();let targets=0,uniqueSolutions=0,largest=0;for(const item of puzzles){if(item.rows!==item.grid.length||item.grid.some(row=>row.length!==item.cols||!/^[01]+$/.test(row)))throw Error(`${item.name} 的谜格尺寸错误`);const signature=item.grid.join("/");if(signatures.has(signature))throw Error(`${item.name} 与其他卷宗重复`);signatures.add(signature);const solutions=countSolutions(item);if(solutions!==1)throw Error(`${item.name} 的线索解数量为 ${solutions}`);uniqueSolutions++;targets+=blackCount(item);largest=Math.max(largest,item.rows*item.cols)}return{puzzles:puzzles.length,chapters:4,uniquePuzzles:signatures.size,uniqueSolutions,filledTargets:targets,largestBoard:largest}}
    function snapshot(){q.history.push({cells:cloneCells(q.cells),moves:q.moves});if(q.history.length>80)q.history.shift()}
    function completed(){const solution=toMatrix(q.item);for(let y=0;y<q.item.rows;y++)for(let x=0;x<q.item.cols;x++)if((q.cells[y][x]===1)!==Boolean(solution[y][x]))return false;return true}
    function applyAutoCross(){if(!($("autoCross").checked||kit==="archive"))return 0;const clues=cluesFor(q.item);let changed=0;for(let y=0;y<q.item.rows;y++){const line=q.cells[y].map(value=>value===1?1:0);if(groupsEqual(lineClue(line),clues.rows[y]))for(let x=0;x<q.item.cols;x++)if(q.cells[y][x]===0){q.cells[y][x]=2;changed++}}for(let x=0;x<q.item.cols;x++){const line=q.cells.map(row=>row[x]===1?1:0);if(groupsEqual(lineClue(line),clues.cols[x]))for(let y=0;y<q.item.rows;y++)if(q.cells[y][x]===0){q.cells[y][x]=2;changed++}}return changed}
    function setCell(x,y,value,countMove=true){if(!q.run||q.ended||x<0||y<0||x>=q.item.cols||y>=q.item.rows||q.cells[y][x]===value)return false;q.cells[y][x]=value;if(countMove)q.moves++;const crossed=applyAutoCross();q.message=crossed?`已按完整行列自动排除 ${crossed} 格。`:`已使用${toolNames[selectedTool]}，行列状态实时更新。`;finishIfSolved();renderAll();return true}
    function finishIfSolved(){if(!q.run||q.ended||!completed())return false;q.won=true;q.ended=true;q.run=false;const par=parFor(q.item),stars=1+(q.moves<=par?1:0)+(q.paidHints===0?1:0);profile.stars[q.index]=Math.max(Number(profile.stars[q.index])||0,stars);profile.best[q.index]=Math.min(Number(profile.best[q.index])||Infinity,q.moves);profile.clean[q.index]=profile.clean[q.index]||q.paidHints===0;save();renderAll();showOverlay("卷宗校勘完成",`${q.item.name} 用 ${q.moves} 次操作还原，逻辑提示 ${q.hints} 次。`,"★".repeat(stars)+"☆".repeat(3-stars),q.index<11?"下一卷":"返回图鉴",()=>{selected=q.index<11?q.index+1:q.index;begin(selected)});return true}
    function undoState(){if(!q.run||q.ended||!q.history.length)return false;const previous=q.history.pop();q.cells=cloneCells(previous.cells);q.moves=previous.moves;q.message="已撤回最近一次笔画。";renderAll();return true}
    function candidateMasks(cells,clue){return lineMasks(cells.length,clue).filter(mask=>cells.every((value,index)=>value===0||(value===1&&((mask>>index)&1)===1)||(value===2&&((mask>>index)&1)===0)))}
    function findForced(){const clues=cluesFor(q.item);for(let y=0;y<q.item.rows;y++){const options=candidateMasks(q.cells[y],clues.rows[y]);if(!options.length)return{conflict:`第 ${y+1} 行与线索矛盾`};for(let x=0;x<q.item.cols;x++)if(q.cells[y][x]===0){const first=(options[0]>>x)&1;if(options.every(mask=>((mask>>x)&1)===first))return{x,y,value:first?1:2,reason:`第 ${y+1} 行的全部候选在第 ${x+1} 格一致`}}}for(let x=0;x<q.item.cols;x++){const cells=q.cells.map(row=>row[x]),options=candidateMasks(cells,clues.cols[x]);if(!options.length)return{conflict:`第 ${x+1} 列与线索矛盾`};for(let y=0;y<q.item.rows;y++)if(q.cells[y][x]===0){const first=(options[0]>>y)&1;if(options.every(mask=>((mask>>y)&1)===first))return{x,y,value:first?1:2,reason:`第 ${x+1} 列的全部候选在第 ${y+1} 格一致`}}}return null}
    function hintState(){if(!q.run||q.ended)return false;let hint=findForced();if(hint?.conflict){q.message=`${hint.conflict}，请先撤回冲突笔画。`;renderAll();return false}if(!hint){const solution=toMatrix(q.item);outer:for(let y=0;y<q.item.rows;y++)for(let x=0;x<q.item.cols;x++)if(q.cells[y][x]===0){hint={x,y,value:solution[y][x]?1:2,reason:"需要跨行列的深层推断"};break outer}}if(!hint){q.message="当前卷宗已经没有待推导格。";renderAll();return false}snapshot();q.hints++;if(!(kit==="logic"&&q.hints===1))q.paidHints++;q.cells[hint.y][hint.x]=hint.value;q.moves++;const crossed=applyAutoCross();q.message=`提示：${hint.reason}，因此 (${hint.x+1}, ${hint.y+1}) 应${hint.value===1?"填黑":"排除"}${crossed?`；并自动排除 ${crossed} 格`:""}。`;finishIfSolved();renderAll();return true}
    function checkState(){if(!q.run||q.ended)return false;const solution=toMatrix(q.item);let conflicts=0;for(let y=0;y<q.item.rows;y++)for(let x=0;x<q.item.cols;x++)if((q.cells[y][x]===1&&!solution[y][x])||(q.cells[y][x]===2&&solution[y][x]))conflicts++;q.checks++;q.paidHints++;q.message=conflicts?`校对发现 ${conflicts} 处确定矛盾，但不会直接标出位置。`:`当前已落笔的格子没有确定矛盾。`;renderAll();return conflicts===0}
    function clearState(){if(!q.run||q.ended||q.cells.every(row=>row.every(value=>value===0)))return false;snapshot();q.cells=q.cells.map(row=>row.map(()=>0));q.moves++;q.message="谜格已清空，可从新的推导路线开始。";renderAll();return true}
    function unlocked(index){return index===0||Number(profile.stars[index-1])>0}
    function begin(index=selected){if(!unlocked(index))return;selected=index;q=makeState(index);renderAll();showOverlay(`第 ${index+1} 卷 · ${chapters[Math.floor(index/3)]}`,`${q.item.rows}×${q.item.cols} 谜格，${blackCount(q.item)} 个目标像素，参考操作 ${parFor(q.item)}。`,"","开始校勘",()=>{q.run=true;hideOverlay();q.message="先找线索总和接近行列长度的位置；不同数字段之间至少留一格。";renderAll()})}
    function showOverlay(title,text,stars,label,handler){$("overlayTitle").textContent=title;$("overlayText").textContent=text;$("overlayStars").textContent=stars;$("overlayButton").textContent=label;$("overlayButton").onclick=handler;overlay.hidden=false}
    function hideOverlay(){overlay.hidden=true}
    function renderCampaign(){contractEl.innerHTML=puzzles.map((item,index)=>`<button class="contract ${index===selected?"active":""}" data-index="${index}" ${unlocked(index)?"":"disabled"}>${String(index+1).padStart(2,"0")}<small>${"★".repeat(Number(profile.stars[index])||0)}</small></button>`).join("");$("starTotal").textContent=`${Object.values(profile.stars).reduce((a,b)=>a+Number(b||0),0)} / 36`;$("clearTotal").textContent=`${Object.values(profile.stars).filter(Boolean).length} / 12`;$("cleanTotal").textContent=`${Object.values(profile.clean).filter(Boolean).length} / 12`;document.querySelectorAll(".kit").forEach(button=>button.classList.toggle("active",button.dataset.kit===kit))}
    function filledCount(){return q.cells.reduce((total,row)=>total+row.filter(value=>value===1).length,0)}
    function renderInfo(){const chapter=chapters[Math.floor(q.index/3)];$("puzzleTitle").textContent=`${String(q.index+1).padStart(2,"0")} · ${q.ended?q.item.name:`${chapter}密卷`}`;$("puzzleBrief").textContent=q.item.brief;$("chapterHud").textContent=`${chapter.slice(0,1)} ${String(q.index%3+1).padStart(2,"0")}`;$("moveHud").textContent=q.moves;$("sizeMetric").textContent=`${q.item.cols} × ${q.item.rows}`;$("moveMetric").textContent=`${q.moves} / ${parFor(q.item)}`;$("hintMetric").textContent=q.hints;$("fillMetric").textContent=`${filledCount()} / ${blackCount(q.item)}`;$("status").textContent=q.message;document.querySelectorAll(".tool").forEach(button=>button.classList.toggle("active",button.dataset.tool===selectedTool))}
    function boardMetrics(){const left=118,top=102,size=Math.floor(Math.min((720-left-34)/q.item.cols,(680-top-34)/q.item.rows));return{left,top,size,x:Math.floor((720-(left+q.item.cols*size))/2),y:Math.floor((680-(top+q.item.rows*size))/2)+8}}
    function lineDone(cells,clue){return groupsEqual(lineClue(cells.map(value=>value===1?1:0)),clue)}
    function draw(){ctx.fillStyle="#14231c";ctx.fillRect(0,0,720,680);const m=boardMetrics(),clues=cluesFor(q.item),solution=toMatrix(q.item);ctx.fillStyle="#293d32";ctx.fillRect(m.x-8,m.y-8,m.left+q.item.cols*m.size+16,m.top+q.item.rows*m.size+16);ctx.fillStyle="#f4ecd6";ctx.fillRect(m.x,m.y,m.left+q.item.cols*m.size,m.top+q.item.rows*m.size);ctx.font=`900 ${Math.max(13,m.size*.23)}px system-ui`;ctx.textBaseline="middle";for(let y=0;y<q.item.rows;y++){const py=m.y+m.top+y*m.size,done=lineDone(q.cells[y],clues.rows[y]);ctx.fillStyle=done?"#d9eee2":"#fff8e5";ctx.fillRect(m.x,py,m.left-1,m.size-1);ctx.fillStyle=done?"#35755f":"#283a32";ctx.textAlign="right";ctx.fillText(clues.rows[y].join("  "),m.x+m.left-10,py+m.size/2)}for(let x=0;x<q.item.cols;x++){const px=m.x+m.left+x*m.size,cells=q.cells.map(row=>row[x]),done=lineDone(cells,clues.cols[x]);ctx.fillStyle=done?"#d9eee2":"#fff8e5";ctx.fillRect(px,m.y,m.size-1,m.top-1);ctx.fillStyle=done?"#35755f":"#283a32";ctx.textAlign="center";const clue=clues.cols[x];clue.forEach((value,index)=>ctx.fillText(value,px+m.size/2,m.y+m.top-13-(clue.length-1-index)*Math.max(16,m.size*.24)))}for(let y=0;y<q.item.rows;y++)for(let x=0;x<q.item.cols;x++){const px=m.x+m.left+x*m.size,py=m.y+m.top+y*m.size;ctx.fillStyle=(x+y)%2?"#f3efdc":"#fff9e8";ctx.fillRect(px,py,m.size-1,m.size-1);if(q.cells[y][x]===1){ctx.fillStyle="#438671";ctx.fillRect(px+4,py+4,m.size-9,m.size-9);ctx.fillStyle="rgba(255,255,255,.14)";ctx.fillRect(px+8,py+8,m.size*.28,m.size*.12)}else if(q.cells[y][x]===2){ctx.strokeStyle="#c75b5f";ctx.lineWidth=Math.max(2,m.size*.055);ctx.beginPath();ctx.moveTo(px+m.size*.25,py+m.size*.25);ctx.lineTo(px+m.size*.75,py+m.size*.75);ctx.moveTo(px+m.size*.75,py+m.size*.25);ctx.lineTo(px+m.size*.25,py+m.size*.75);ctx.stroke()}if(x%5===0){ctx.strokeStyle="#72837a";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,py+m.size);ctx.stroke()}if(y%5===0){ctx.strokeStyle="#72837a";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+m.size,py);ctx.stroke()}}ctx.fillStyle="#d8b354";ctx.font="900 16px system-ui";ctx.textAlign="left";ctx.fillText(q.ended?q.item.name:`${chapters[Math.floor(q.index/3)]} · 未解图样`,m.x+10,m.y+28);if(q.ended){ctx.globalAlpha=.11;ctx.fillStyle="#fff";for(let y=0;y<q.item.rows;y++)for(let x=0;x<q.item.cols;x++)if(solution[y][x])ctx.fillRect(m.x+m.left+x*m.size,m.y+m.top+y*m.size,m.size-1,m.size-1);ctx.globalAlpha=1}}
    function renderAll(){renderCampaign();renderInfo();draw()}
    function pointerCell(event){const rect=canvas.getBoundingClientRect(),m=boardMetrics(),x=(event.clientX-rect.left)*720/rect.width,y=(event.clientY-rect.top)*680/rect.height;return{x:Math.floor((x-m.x-m.left)/m.size),y:Math.floor((y-m.y-m.top)/m.size)}}
    function valueForEvent(event){return event.button===2?2:selectedTool==="fill"?1:selectedTool==="mark"?2:0}
    contractEl.addEventListener("click",event=>{const button=event.target.closest("[data-index]");if(button)begin(Number(button.dataset.index))});
    document.querySelectorAll(".kit").forEach(button=>button.addEventListener("click",()=>{if(q.run)return;kit=button.dataset.kit;if(kit==="archive")$("autoCross").checked=true;save();q=makeState(selected);renderAll()}));
    document.querySelectorAll(".tool").forEach(button=>button.addEventListener("click",()=>{selectedTool=button.dataset.tool;renderAll()}));
    canvas.addEventListener("contextmenu",event=>event.preventDefault());canvas.addEventListener("pointerdown",event=>{event.preventDefault();if(!q.run||q.ended)return;const cell=pointerCell(event);if(cell.x<0||cell.y<0||cell.x>=q.item.cols||cell.y>=q.item.rows)return;activePointer=event.pointerId;strokeValue=valueForEvent(event);snapshot();canvas.setPointerCapture(event.pointerId);if(!setCell(cell.x,cell.y,strokeValue))q.history.pop()});canvas.addEventListener("pointermove",event=>{if(event.pointerId!==activePointer)return;const cell=pointerCell(event);setCell(cell.x,cell.y,strokeValue)});canvas.addEventListener("pointerup",event=>{if(event.pointerId===activePointer)activePointer=null});canvas.addEventListener("pointercancel",()=>{activePointer=null});
    addEventListener("keydown",event=>{const map={Digit1:"fill",Digit2:"mark",Digit3:"erase"};if(map[event.code]){selectedTool=map[event.code];renderAll()}if(event.code==="KeyZ")undoState();if(event.code==="KeyH")hintState()});
    $("start").onclick=()=>begin(selected);$("restart").onclick=()=>begin(q.index);$("undo").onclick=undoState;$("hint").onclick=hintState;$("check").onclick=checkState;$("clear").onclick=clearState;$("autoCross").checked=profile.autoCross;$("autoCross").onchange=()=>save();
    $("exportSave").onclick=async()=>{const code=encodeProfile();try{await navigator.clipboard.writeText(code);q.message="PIXEL2 图鉴档案已复制。";renderAll()}catch{prompt("复制图鉴档案",code)}};$("importSave").onclick=()=>{const code=prompt("粘贴 PIXEL2 图鉴档案");if(!code)return;try{profile=decodeProfile(code);kit=profile.kit;$("autoCross").checked=profile.autoCross;save();q.message="图鉴档案已导入。";renderAll()}catch(error){q.message=error.message;renderAll()}};
    renderAll();showOverlay("十二卷待校勘","所有行列线索都来自固定像素图，每卷经正式 Nonogram 求解器验证仅有一个解。","","打开第一卷",()=>begin(0));
    window.__pixelCluesTest={puzzles,cluesFor,lineMasks,countSolutions,validateContent,begin,getState:()=>q,getProfile:()=>profile,encodeProfile,decodeProfile,setTool(type){selectedTool=type;renderAll()},applyCell(x,y,value=1){if(!q.run||q.ended)return false;snapshot();const result=setCell(x,y,value);if(!result)q.history.pop();return result},undoState,hintState,checkState,forceFinish(){if(!q)return;q.cells=toMatrix(q.item).map(row=>row.map(value=>value?1:2));q.moves=blackCount(q.item);q.hints=0;q.paidHints=0;q.run=true;q.ended=false;finishIfSolved()}};
  })();
  </script>
</body>
