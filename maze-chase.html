<body>
  <main class="app">
    <header class="head"><div><h1>霓虹迷宫：十二夜巡线</h1><p class="sub">收回散落信标，读取追猎者的固定巡逻轨迹，利用相位冻结与能量反击抵达出口。</p></div><div class="totals"><div><b id="starTotal">0 / 36</b><span>巡线星章</span></div><div><b id="clearTotal">0 / 12</b><span>完成夜班</span></div><div><b id="cleanTotal">0 / 12</b><span>无损撤离</span></div></div></header>

        <section class="panel"><h3>本夜巡逻</h3><div class="ghosts" id="ghosts"></div></section>
        <section class="panel"><div class="commands"><button class="primary" id="start">开始巡线</button><button id="restart">重开</button><button id="phaseButton">相位冻结 Q</button></div><div class="pad" aria-label="触屏移动"><span></span><button data-move="up" title="向上">↑</button><span></span><button data-move="left" title="向左">←</button><button data-move="wait" title="原地等待">·</button><button data-move="right" title="向右">→</button><span></span><button data-move="down" title="向下">↓</button><button class="phase" data-move="phase" title="冻结巡逻">相位</button></div><p class="help">`WASD/方向键` 移动，`Space` 原地等待，`Q` 冻结下一次巡逻。实心圆是追猎者当前位置，空心圆是下一步位置；收齐六边形信标后前往金色出口。</p></section>

  <script>
  (()=>{

      {title:"金轮加速",brief:"金轮每回合前进两格，空心预告比当前站位更重要。",seed:743,beacons:5,cores:3,ghosts:3,par:235},

    ];
    const $=id=>document.getElementById(id),canvas=$("canvas"),ctx=canvas.getContext("2d"),overlay=$("overlay"),missionEl=$("missions");let profile=load(),selected=0,operator=profile.operator||"scout",q=null,pulse=0,raf=0;
    function defaults(){return{version:2,stars:{},best:{},clean:{},operator:"scout",updatedAt:Date.now()}}

    function load(){try{return normalize(JSON.parse(localStorage.getItem(SAVE_KEY)))}catch{return defaults()}}
    function save(){profile.operator=operator;profile.updatedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(profile));renderCampaign()}
    function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
    function encodeProfile(){const body=btoa(unescape(encodeURIComponent(JSON.stringify(profile))));return`MAZE2.${body}.${checksum(body)}`}
    function decodeProfile(code){const part=code.trim().split(".");if(part.length!==3||part[0]!=="MAZE2"||checksum(part[1])!==part[2])throw Error("巡线档案校验失败");return normalize(JSON.parse(decodeURIComponent(escape(atob(part[1])))))}
    function rng(seed){let value=seed>>>0;return()=>((value=Math.imul(value^value>>>15,1|value),value^=value+Math.imul(value^value>>>7,61|value),(value^value>>>14)>>>0)/4294967296)}

    function key(cell){return `${cell.x},${cell.y}`}

    function neighbors(grid,cell){return Object.values(dirs).slice(0,4).map(([dx,dy])=>({x:cell.x+dx,y:cell.y+dy})).filter(next=>grid[next.y]?.[next.x]!=="#")}
    function generate(seed){const random=rng(seed),grid=Array.from({length:HEIGHT},()=>Array(WIDTH).fill("#")),stack=[{x:1,y:1}];grid[1][1]=" ";while(stack.length){const current=stack[stack.length-1],options=shuffle([[2,0],[-2,0],[0,2],[0,-2]],random).filter(([dx,dy])=>{const x=current.x+dx,y=current.y+dy;return x>0&&x<WIDTH-1&&y>0&&y<HEIGHT-1&&grid[y][x]==="#"});if(!options.length){stack.pop();continue}const [dx,dy]=options[0],next={x:current.x+dx,y:current.y+dy};grid[current.y+dy/2][current.x+dx/2]=" ";grid[next.y][next.x]=" ";stack.push(next)}for(let i=0;i<10;i++){const x=1+Math.floor(random()*(WIDTH-2)),y=1+Math.floor(random()*(HEIGHT-2));if(grid[y][x]!=="#")continue;if(grid[y][x-1]!=="#"&&grid[y][x+1]!=="#"||grid[y-1][x]!=="#"&&grid[y+1][x]!=="#")grid[y][x]=" "}return grid}
    function shortest(grid,start,goal){const queue=[start],seen=new Set([key(start)]),parent=new Map();for(let at=0;at<queue.length;at++){const cell=queue[at];if(cell.x===goal.x&&cell.y===goal.y){const path=[];let cursor=key(cell);while(cursor){const [x,y]=cursor.split(",").map(Number);path.push({x,y});cursor=parent.get(cursor)}return path.reverse()}for(const next of neighbors(grid,cell)){const id=key(next);if(seen.has(id))continue;seen.add(id);parent.set(id,key(cell));queue.push(next)}}return[]}

    function selectSpread(candidates,count,blocked=[]){const chosen=[],blockedKeys=new Set(blocked.map(key));for(const cell of candidates){if(blockedKeys.has(key(cell)))continue;if(chosen.every(other=>Math.abs(other.x-cell.x)+Math.abs(other.y-cell.y)>=4)){chosen.push(cell);if(chosen.length===count)break}}if(chosen.length<count)for(const cell of candidates)if(!blockedKeys.has(key(cell))&&!chosen.some(other=>key(other)===key(cell))){chosen.push(cell);if(chosen.length===count)break}return chosen}
    function buildMission(index){const spec=missions[index],grid=generate(spec.seed),start={x:1,y:1},distance=distances(grid,start),cells=[...distance].map(([id,d])=>{const [x,y]=id.split(",").map(Number);return{x,y,d}}).sort((a,b)=>b.d-a.d||a.y-b.y||a.x-b.x),exit={x:cells[0].x,y:cells[0].y},beacons=selectSpread(cells.slice(1),spec.beacons,[start,exit]),cores=selectSpread(cells.slice().reverse(),spec.cores,[start,exit,...beacons]),blocked=[start,exit,...beacons,...cores],ghosts=[];for(let i=0;i<spec.ghosts;i++){const type=types[(i+index)%types.length],home=cells.find(cell=>!blocked.some(other=>key(other)===key(cell))&&!ghosts.some(ghost=>key(ghost.home)===key(cell)))||cells[i+2],toward=shortest(grid,home,start),nodes=toward.slice(0,Math.min(type.nodes,toward.length)),path=nodes.concat(nodes.slice(1,-1).reverse());ghosts.push({name:type.name,color:type.color,speed:type.speed,home:{x:home.x,y:home.y},path,offset:(index*3+i*2)%path.length})}return{index,spec,grid,start,exit,beacons,cores,ghosts,walkable:cells.length,signature:grid.map(row=>row.join("")).join("/")+"|"+beacons.map(key).join(";")}}
    const compiled=missions.map((_,index)=>buildMission(index));
    function ghostPosition(ghost,turn,disabledUntil=-1){if(turn<disabledUntil)return null;return ghost.path[(turn*ghost.speed+ghost.offset)%ghost.path.length]}
    function same(a,b){return Boolean(a&&b&&a.x===b.x&&a.y===b.y)}
    function makeState(index=selected,simulation=false,activeOperator=operator){const map=compiled[index],phaseBase=activeOperator==="phase"?4:2;return{index,map,simulation,operator:activeOperator,player:{...map.start},direction:{x:1,y:0},beacons:new Set(map.beacons.map(key)),cores:new Set(map.cores.map(key)),pellets:new Set([...distances(map.grid,map.start).keys()].filter(id=>id!==key(map.start))),ghosts:map.ghosts.map(ghost=>({...ghost,disabledUntil:-1})),turn:0,steps:0,score:0,lives:3,hits:0,power:0,captures:0,phase:phaseBase,freeze:0,phaseShield:0,run:false,ended:false,won:false}}
    function collect(state){const id=key(state.player);if(state.pellets.delete(id))state.score+=10;if(state.beacons.delete(id))state.score+=120;if(state.cores.delete(id)){state.power=Math.max(state.power,state.operator==="surge"?14:10);state.score+=50}}
    function resolveCollision(state,ghost){if(state.power>0){ghost.disabledUntil=state.turn+4;state.captures++;state.score+=state.operator==="surge"?350:250;return}state.lives--;state.hits++;state.score=Math.max(0,state.score-100);state.player={...state.map.start};state.power=0;if(state.lives<=0){state.ended=true;state.run=false;state.won=false}}

    function usePhase(state){if(!state.run||state.ended||state.phase<=0)return false;state.phase--;state.freeze++;state.phaseShield=1;return true}
    function routeKey(position,mask,turn,charges,shield){return `${position}|${mask}|${turn%PERIOD}|${charges}|${shield?1:0}`}
    function solveReference(index){const map=compiled[index],beaconIndex=new Map(map.beacons.map((cell,i)=>[key(cell),i])),all=(1<<map.beacons.length)-1,cells=[...distances(map.grid,map.start).keys()],indexByKey=new Map(cells.map((id,i)=>[id,i])),positions=cells.map(id=>{const [x,y]=id.split(",").map(Number);return{x,y}}),startPos=indexByKey.get(key(map.start)),queue=[{p:startPos,mask:0,t:0,charges:4,shield:false}],seen=new Set([routeKey(startPos,0,0,4,false)]),parent=new Map(),actions=["up","down","left","right","wait"];let goal=null;for(let at=0;at<queue.length&&at<800000;at++){const state=queue[at],here=positions[state.p],stateId=routeKey(state.p,state.mask,state.t,state.charges,state.shield);if(state.mask===all&&same(here,map.exit)){goal=state;break}if(state.charges>0&&!state.shield){const candidate={...state,charges:state.charges-1,shield:true},id=routeKey(candidate.p,candidate.mask,candidate.t,candidate.charges,true);if(!seen.has(id)){seen.add(id);parent.set(id,{from:stateId,action:"phase"});queue.push(candidate)}}for(const action of actions){const [dx,dy]=dirs[action],next={x:here.x+dx,y:here.y+dy};if(map.grid[next.y]?.[next.x]==="#")continue;const nextIndex=indexByKey.get(key(next));if(nextIndex===undefined)continue;const oldGhosts=map.ghosts.map(ghost=>ghostPosition(ghost,state.t)),newGhosts=state.shield?oldGhosts:map.ghosts.map(ghost=>ghostPosition(ghost,state.t+1));let collision=false;if(!state.shield)for(let i=0;i<oldGhosts.length;i++)if(same(next,oldGhosts[i])||same(next,newGhosts[i])||same(here,newGhosts[i])&&same(next,oldGhosts[i])){collision=true;break}if(collision)continue;let mask=state.mask;const bit=beaconIndex.get(key(next));if(bit!==undefined)mask|=1<<bit;const candidate={p:nextIndex,mask,t:(state.t+1)%PERIOD,charges:state.charges,shield:false},id=routeKey(candidate.p,candidate.mask,candidate.t,candidate.charges,false);if(seen.has(id))continue;seen.add(id);parent.set(id,{from:stateId,action});queue.push(candidate)}}if(!goal)return{won:false,ste     function simulateReference(index){const solution=solveReference(index);if(!solution.won)return{won:false,steps:0,hits:0,states:solution.states};const state=makeState(index,true,"phase");state.run=true;for(const action of solution.route){if(action==="phase")usePhase(state);else moveState(state,action);if(state.ended)break}return{won:state.won,steps:state.steps,hits:state.hits,beacons:state.beacons.size,states:solution.states,route:solution.route}}
    function validateContent(){if(missions.length!==12)throw Error("夜班任务数量错误");const signatures=new Set();let walkable=0,beacons=0,cores=0,ghosts=0,referenceWins=0,maxReferenceSteps=0,searchStates=0;for(let i=0;i<missions.length;i++){const map=compiled[i];if(signatures.has(map.signature))throw Error(`第 ${i+1} 夜地图重复`);signatures.add(map.signature);if(distances(map.grid,map.start).size!==map.walkable)throw Error(`第 ${i+1} 夜存在断路`);walkable+=map.walkable;beacons+=map.beacons.length;cores+=map.cores.length;ghosts+=map.ghosts.length;const result=simulateReference(i);if(!result.won||result.hits||result.beacons)throw Error(`第 ${i+1} 夜参考巡线未通过`);if(result.steps>missions[i].par)throw Error(`第 ${i+1} 夜参考路线超出三星步数`);referenceWins++;maxReferenceSteps=Math.max(maxReferenceSteps,result.steps);searchStates+=result.states}return{missions:12,operators:3,uniqueMaps:signatures.size,walkable,beacons,cores,ghosts,referenceWins,maxReferenceSteps,searchStates}}
    function unlocked(index){return index===0||Number(profile.stars[index-1])>0}
    function begin(index=selected){if(!unlocked(index))return;selected=index;q=makeState(index);renderAll();showOverlay("巡线简报",`${q.map.spec.title}：回收 ${q.map.beacons.length} 枚信标后抵达金色出口。追猎者轨迹固定，每次移动或等待都会推进一拍。`,"","进入回廊",()=>{q.run=true;hideOverlay();setStatus("实心追猎者会在下一拍移动到空心预告位置。碰到能量核后可短暂反向捕获。")})}
    function finalize(){if(!q?.ended)return;if(q.won){const stars=1+(q.hits===0?1:0)+(q.hits===0&&q.steps<=q.map.spec.par?1:0);profile.stars[q.index]=Math.max(Number(profile.stars[q.index])||0,stars);profile.best[q.index]=Math.min(Number(profile.best[q.index])||Infinity,q.steps);profile.clean[q.index]=profile.clean[q.index]||q.hits===0;save();renderAll();showOverlay("巡线完成",`用时 ${q.steps} 步，捕获 ${q.captures} 次，护盾损失 ${q.hits}。`,"★".repeat(stars)+"☆".repeat(3-stars),q.index<11?"下一夜":"返回任务簿",()=>{const next=q.index<11?q.index+1:q.index;selected=next;begin(next)})}else showOverlay("巡线中断","护盾已经耗尽。预告轨迹不会改变，可以调整等待时机重新规划。","","重新进入",()=>begin(q.index))}
    function perform(action){if(action==="phase"){if(q&&usePhase(q)){setStatus("相位已充能：下一次有效移动将冻结全部巡逻一拍。");renderAll()}return}if(!q?.run||q.ended)return;const before=q.ended;if(moveState(q,action)){renderAll();if(!before&&q.ended)finalize()}}
    function nearestRoute(state){if(operator!=="scout"||!state.beacons.size)return[];let best=[];for(const id of state.beacons){const [x,y]=id.split(",").map(Number),path=shortest(state.map.grid,state.player,{x,y});if(path.length&&(!best.length||path.length<best.length))best=path}return best.slice(1,7)}
    function setStatus(text){$("status").textContent=text}
    function showOverlay(title,text,stars,label,handler){$("overlayTitle").textContent=title;$("overlayText").textContent=text;$("overlayStars").textContent=stars;$("overlayButton").textContent=label;$("overlayButton").onclick=handler;overlay.hidden=false}
    function hideOverlay(){overlay.hidden=true}
    function renderCampaign(){missionEl.innerHTML=missions.map((mission,index)=>`<button class="mission ${index===selected?"active":""}" data-index="${index}" ${unlocked(index)?"":"disabled"}>${String(index+1).padStart(2,"0")}<small>${"★".repeat(Number(profile.stars[index])||0)}</small></button>`).join("");$("starTotal").textContent=`${Object.values(profile.stars).reduce((a,b)=>a+Number(b||0),0)} / 36`;$("clearTotal").textContent=`${Object.values(profile.stars).filter(Boolean).length} / 12`;$("cleanTotal").textContent=`${Object.values(profile.clean).filter(Boolean).length} / 12`;document.querySelectorAll(".operator").forEach(button=>button.classList.toggle("active",button.dataset.operator===operator))}
    function renderInfo(){if(!q)return;$("missionTitle").textContent=`${String(q.index+1).padStart(2,"0")} · ${q.map.spec.title}`;$("missionBrief").textContent=q.map.spec.brief;$("steps").textContent=q.steps;$("score").textContent=q.score;$("power").textContent=q.power;$("lives").textContent=q.lives;$("beacons").textContent=`${q.map.beacons.length-q.beacons.size} / ${q.map.beacons.length}`;$("phaseCount").textContent=q.phase;$("objective").textContent=q.beacons.size?`还需回收 ${q.beacons.size} 枚信标；三星要求不损失护盾并在 ${q.map.spec.par} 步内撤离。`:`信标已全部回收，前往金色出口完成撤离。`;$("ghosts").innerHTML=q.map.ghosts.map(ghost=>`<div class="ghost"><i style="background:${ghost.color}"></i><b>${ghost.name}</b><br>${ghost.speed===2?"双步截击":"单步往返"} · ${ghost.path.length} 拍</div>`).join("")}
    function polygon(cx,cy,r,sides,fill,stroke){ctx.beginPath();for(let i=0;i<sides;i++){const angle=-Math.PI/2+i*Math.PI*2/sides,x=cx+Math.cos(angle)*r,y=cy+Math.sin(angle)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
    function draw(){if(!q)return;const w=canvas.width,h=canvas.height,cw=w/WIDTH,ch=h/HEIGHT;ctx.fillStyle="#101a22";ctx.fillRect(0,0,w,h);const route=new Set(nearestRoute(q).map(key));for(let y=0;y<HEIGHT;y++)for(let x=0;x<WIDTH;x++){const id=cellKey(x,y);if(q.map.grid[y][x]==="#"){ctx.fillStyle=(x+y)%2?"#243e54":"#294860";ctx.fillRect(x*cw+1,y*ch+1,cw-2,ch-2);ctx.strokeStyle="#3e6880";ctx.strokeRect(x*cw+4,y*ch+4,cw-8,ch-8)}else{ctx.fillStyle=route.has(id)?"rgba(73,195,191,.16)":"#111e27";ctx.fillRect(x*cw,y*ch,cw,ch);if(q.pellets.has(id)){ctx.fillStyle="#8bb5bd";ctx.beginPath();ctx.arc((x+.5)*cw,(y+.5)*ch,2.2,0,7);ctx.fill()}}}for(const id of q.cores){const [x,y]=id.split(",").map(Number);ctx.fillStyle=`rgba(102,222,209,${.62+.22*Math.sin(pulse*3)})`;ctx.beginPath();ctx.arc((x+.5)*cw,(y+.5)*ch,8,0,7);ctx.fill()}for(const id of q.beacons){const [x,y]=id.split(",").map(Number);polygon((x+.5)*cw,(y+.5)*ch,10,6,"#e5ba53","#fff0a4")}const exitOpen=!q.beacons.size;ctx.fillStyle=exitOpen?"#e4b44c":"#685b40";ctx.fillRect((q.map.exit.x+.22)*cw,(q.map.exit.y+.2)*ch,cw*.56,ch*.6);ctx.strokeStyle=exitOpen?"#fff0a7":"#a18b5e";ctx.strokeRect((q.map.exit.x+.22)*cw,(q.map.exit.y+.2)*ch,cw*.56,ch*.6);for(const ghost of q.ghosts){const current=ghostPosition(ghost,q.turn,ghost.disabledUntil),next=q.freeze?current:ghostPosition(ghost,q.turn+1,ghost.disabledUntil);if(next){ctx.strokeStyle=ghost.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc((next.x+.5)*cw,(next.y+.5)*ch,11,0,7);ctx.stroke()}if(current){ctx.fillStyle=q.power>0?"#6b88d8":ghost.color;ctx.beginPath();ctx.arc((current.x+.5)*cw,(current.y+.5)*ch,12,0,7);ctx.fill();ctx.fillStyle="#f7fbff";ctx.fillRect((current.x+.37)*cw,(current.y+.38)*ch,3,4);ctx.fillRect((current.x+.56)*cw,(current.y+.38)*ch,3,4)}}ctx.fillStyle="#f1d35d";ctx.beginPath();ctx.arc((q.player.x+.5)*cw,(q.player.y+.5)*ch,13,0,7);ctx.fill();ctx.fillStyle="#2d3032";ctx.beginPath();ctx.moveTo((q.player.x+.5)*cw,(q.player.y+.5)*ch);ctx.lineTo((q.player.x+.5+q.direct     function renderAll(){renderCampaign();renderInfo();draw()}
    function loop(time){pulse=time/1000;draw();raf=requestAnimationFrame(loop)}
    missionEl.addEventListener("click",event=>{const button=event.target.closest("[data-index]");if(button){selected=Number(button.dataset.index);begin(selected)}});document.querySelectorAll(".operator").forEach(button=>button.addEventListener("click",()=>{if(q?.run)return;operator=button.dataset.operator;save();q=makeState(selected);renderAll()}));document.querySelectorAll("[data-move]").forEach(button=>button.addEventListener("pointerdown",event=>{event.preventDefault();perform(button.dataset.move)}));addEventListener("keydown",event=>{const map={ArrowUp:"up",KeyW:"up",ArrowDown:"down",KeyS:"down",ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right",Space:"wait",KeyQ:"phase"};if(map[event.code]){event.preventDefault();perform(map[event.code])}});
    $("start").onclick=()=>begin(selected);$("restart").onclick=()=>begin(q?.index??selected);$("phaseButton").onclick=()=>perform("phase");$("exportSave").onclick=async()=>{const code=encodeProfile();try{await navigator.clipboard.writeText(code);setStatus("巡线档案已复制。") }catch{prompt("复制巡线档案",code)}};$("importSave").onclick=()=>{const code=prompt("粘贴 MAZE2 巡线档案");if(!code)return;try{profile=decodeProfile(code);operator=profile.operator;save();setStatus("巡线档案已导入。");begin(selected)}catch(error){setStatus(error.message)}};
    q=makeState(0);renderAll();showOverlay("夜班待命","每次移动都会推进全部追猎者的固定巡逻。先读实心当前位置与空心下一步，再决定前进或等待。","","查看巡线图",()=>begin(selected));raf=requestAnimationFrame(loop);
