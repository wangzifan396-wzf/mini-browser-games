<body>
  <main class="app">
    <header class="topbar">
      <div><p class="eyebrow">DETERMINISTIC SKY CAMPAIGN</p><h1 class="title">雷霆先锋：裂空战役</h1></div>
      <div class="top-actions"><button class="btn" id="pauseBtn" disabled>暂停</button><button class="btn" id="archiveBtn">档案</button></div>
    </header>
    <section class="layout">
      <div class="stage">
        <canvas id="gameCanvas" aria-label="雷霆先锋空战画面"></canvas>
        <div class="hud">
          <div class="hud-block"><b id="hudMission">待命</b><div class="hud-line"><span>机体 <em id="hpText">100</em></span><span>协议 <em id="protocolText">0</em></span></div><div class="meter"><i id="hpBar"></i></div></div>
          <div class="hud-block right"><b id="scoreText">000000</b><div class="hud-line"><span id="comboText">连击 0</span><span id="timeText">00:00</span></div><div class="meter storm"><i id="stormBar"></i></div></div>
        </div>
        <div class="boss-meter" id="bossMeter"><span id="bossName">首领</span><div class="meter"><i id="bossBar"></i></div></div>
        <button class="storm-btn" id="stormBtn" disabled>雷暴<br><small>未充能</small></button>
        <div class="overlay" id="overlay"><div class="modal" id="overlayCard"></div></div>
      </div>
      <aside class="side">
        <section class="side-section full">
          <div class="section-title"><h2>九站战役</h2><span id="campaignStars">0 / 27 星</span></div>
          <div class="missions" id="missions"></div>
          <div class="brief"><b id="missionTitle"></b><p id="missionBrief"></p><div class="goals" id="goals"></div></div>
        </section>
        <div class="divider"></div>
        <section class="side-section">
          <div class="section-title"><h2>战机框架</h2><span>全部可用</span></div>
          <div class="fighter-tabs" id="fighters"></div>
        </section>
        <div class="divider"></div>
        <section class="side-section">
          <div class="section-title"><h2>双槽模块</h2><span id="slotText">0 / 2</span></div>
          <div class="modules" id="modules"></div>
        </section>
        <div class="divider"></div>
        <section class="side-section full">
          <div class="status-grid"><div><b id="clearText">0</b><small>完成架次</small></div><div><b id="medalText">0</b><small>战术勋章</small></div><div><b id="bestText">0</b><small>当前纪录</small></div></div>
        </section>
        <div class="button-row"><button class="btn primary" id="launchBtn">出击</button><button class="btn warn" id="referenceBtn">参考战术</button></div>
        <p class="tip">WASD / 方向键移动，按住或拖动战机也可操控。战机自动射击；雷暴充满后按空格或点击按钮，可清除敌弹并重创编队。</p>
      </aside>
    </section>
  </main>
  <div class="archive hidden" id="archive">
    <div class="modal"><h2>先锋档案</h2><p>复制档案码可在另一台设备恢复战役星级、纪录、战机和模块配置。</p><textarea id="archiveText" aria-label="先锋档案码"></textarea><div class="feedback" id="feedback"></div><div class="button-row"><button class="btn primary" id="copyBtn">生成并复制</button><button class="btn" id="importBtn">导入</button><button class="btn" id="closeBtn">关闭</button></div></div>
  </div>
  <script>
  (()=>{
    const $=id=>document.getElementById(id),canvas=$("gameCanvas"),ctx=canvas.getContext("2d"),STORAGE="mini_thunder_vanguard_v2";
    const FIGHTERS={swift:{name:"矢量蜂",tag:"高速闪避",hp:82,speed:.72,damage:11,rate:.18,shots:1,spread:0,color:"#49d4cf"},bulwark:{name:"重铠鲸",tag:"耐久火力",hp:132,speed:.49,damage:16,rate:.25,shots:1,spread:0,color:"#f4c95d"},falcon:{name:"聚束隼",tag:"双轨压制",hp:96,speed:.58,damage:10,rate:.21,shots:2,spread:.055,color:"#8ca9ff"}};
    const MODULES={rail:{name:"磁轨透镜",text:"伤害 +22%",unlock:0},armor:{name:"复合装甲",text:"耐久 +24",unlock:0},loader:{name:"超导装填",text:"射速 +16%",unlock:3},wing:{name:"矢量喷口",text:"速度 +17%",unlock:6},capacitor:{name:"风暴电容",text:"雷暴获取 +30%",unlock:10},drone:{name:"维修蜂群",text:"击破首领前回复 18",unlock:15}};
    const PROTOCOLS={focus:{name:"聚焦协议",text:"主炮伤害 +25%"},split:{name:"翼展协议",text:"增加一条弹道"},overclock:{name:"超频协议",text:"射击间隔 -18%"},barrier:{name:"壁垒协议",text:"耐久上限 +25 并修复"},magnet:{name:"回收协议",text:"雷暴获取 +35%"},pierce:{name:"穿云协议",text:"炮弹可贯穿一个目标"},tempest:{name:"雷神协议",text:"雷暴伤害 +45%"}};
    const FORMATIONS={line:[{type:"scout",x:.17},{type:"scout",x:.39},{type:"scout",x:.61},{type:"scout",x:.83}],vee:[{type:"scout",x:.18,d:0},{type:"scout",x:.34,d:.16},{type:"ace",x:.5,d:.32},{type:"scout",x:.66,d:.16},{type:"scout",x:.82,d:0}],sweep:[{type:"dart",x:.12,d:0},{type:"dart",x:.36,d:.18},{type:"dart",x:.64,d:.36},{type:"dart",x:.88,d:.54}],guard:[{type:"scout",x:.25,d:.18},{type:"tank",x:.5},{type:"scout",x:.75,d:.18}],aces:[{type:"ace",x:.2,d:.18},{type:"ace",x:.5},{type:"ace",x:.8,d:.18}],lance:[{type:"dart",x:.16},{type:"ace",x:.38,d:.16},{type:"ace",x:.62,d:.16},{type:"dart",x:.84}],fortress:[{type:"tank",x:.3},{type:"tank",x:.7,d:.28}]};
    const MISSIONS=[
      {id:"first-light",name:"晨线点火",sector:"曙光层",brief:"穿过侦察机防线，校准第一座裂空信标。",seed:1103,boss:"carrier",bossName:"灰鹭母舰",hull:.35,target:2200,waves:["line","vee","sweep","guard","line","aces","vee"]},
      {id:"crosswind",name:"侧风回廊",sector:"曙光层",brief:"高速截断两翼突击队，不让编队占据航道。",seed:2207,boss:"mantis",bossName:"螳刃截击者",hull:.38,target:2500,waves:["sweep","vee","lance","guard","sweep","aces","line","lance"]},
      {id:"sunken-signal",name:"沉没信号",sector:"曙光层",brief:"深入低云电离区，摧毁持续放出重甲机的中继舰。",seed:3301,boss:"citadel",bossName:"玄武中继舰",hull:.4,target:2800,waves:["guard","fortress","line","aces","vee","guard","lance","fortress"]},
      {id:"glass-storm",name:"琉璃风暴",sector:"雷暴层",brief:"弹幕折射异常，保持移动并保存雷暴用于密集波次。",seed:4409,boss:"mantis",bossName:"镜刃双生机",hull:.42,target:3050,waves:["sweep","lance","aces","vee","fortress","sweep","guard","aces","lance"]},
      {id:"iron-rain",name:"铁雨航路",sector:"雷暴层",brief:"重甲机封锁补给线，需要在首领入场前建立火力协议。",seed:5519,boss:"carrier",bossName:"铸雨母舰",hull:.44,target:3350,waves:["fortress","guard","lance","line","fortress","aces","vee","guard","lance"]},
      {id:"silent-eye",name:"寂静之眼",sector:"雷暴层",brief:"攻击风眼核心，识别突击机与堡垒编队的交替节奏。",seed:6619,boss:"citadel",bossName:"寂静观测站",hull:.46,target:3650,waves:["aces","fortress","sweep","guard","lance","vee","fortress","aces","guard","lance"]},
      {id:"red-horizon",name:"赤色地平线",sector:"裂空层",brief:"三支王牌队轮番突入，连击与清弹时机同样重要。",seed:7727,boss:"mantis",bossName:"赤霄猎手",hull:.48,target:3950,waves:["aces","lance","sweep","aces","fortress","vee","lance","guard","aces","fortress"]},
      {id:"thunder-gate",name:"雷门强袭",sector:"裂空层",brief:"突破两列空中堡垒，阻止母舰开启永久风暴门。",seed:8821,boss:"carrier",bossName:"雷门旗舰",hull:.5,target:4300,waves:["fortress","lance","guard","fortress","aces","sweep","lance","vee","fortress","aces","guard"]},
      {id:"skybreak",name:"裂空终局",sector:"裂空层",brief:"所有敌型投入最后防线，击坠核心城塞并封闭裂隙。",seed:9907,boss:"citadel",bossName:"裂空核心城塞",hull:.52,target:4700,waves:["lance","fortress","aces","guard","sweep","vee","fortress","lance","aces","guard","fortress","aces"]}
    ];
    const ENEMIES={scout:{hp:28,r:.026,v:.125,fire:1.8,damage:7,score:60,color:"#bc8cff"},dart:{hp:34,r:.024,v:.165,fire:1.45,damage:8,score:75,color:"#e7839d"},ace:{hp:52,r:.031,v:.105,fire:1.15,damage:9,score:105,color:"#7c9cff"},tank:{hp:118,r:.044,v:.065,fire:1.7,damage:12,score:165,color:"#e6a95d"},carrier:{hp:920,r:.09,v:.045,fire:.72,damage:10,score:1450,color:"#ed6a68",boss:true},mantis:{hp:840,r:.078,v:.06,fire:.53,damage:9,score:1500,color:"#ef7dbe",boss:true},citadel:{hp:1120,r:.1,v:.035,fire:.64,damage:12,score:1700,color:"#ef895f",boss:true}};
    const MEDALS=[{id:"intact",name:"无痕返航",test:r=>r.success&&r.hull>=.9},{id:"storm",name:"雷暴终结",test:r=>r.success&&r.bossStorm},{id:"chain",name:"八连追猎",test:r=>r.maxCombo>=8},{id:"sector",name:"曙光全星",test:()=>profile.stars.slice(0,3).every(v=>v===3)},{id:"veteran",name:"十八星老兵",test:()=>sumStars()>=18},{id:"legend",name:"裂空传奇",test:()=>profile.stars.every(v=>v===3)}];
    function blankProfile(){return{v:2,unlocked:0,stars:Array(9).fill(0),scores:Array(9).fill(0),fighter:"swift",modules:["rail"],clears:0,medals:[]}}
    function normalize(p){const fighter=FIGHTERS[p?.fighter]?p.fighter:"swift",modules=[...new Set(Array.isArray(p?.modules)?p.modules:[])].filter(id=>MODULES[id]).slice(0,2);return{v:2,unlocked:Math.max(0,Math.min(8,+p?.unlocked||0)),stars:Array.from({length:9},(_,i)=>Math.max(0,Math.min(3,+p?.stars?.[i]||0))),scores:Array.from({length:9},(_,i)=>Math.max(0,+p?.scores?.[i]||0)),fighter,modules,clears:Math.max(0,+p?.clears||0),medals:[...new Set(Array.isArray(p?.medals)?p.medals:[])].filter(id=>MEDALS.some(m=>m.id===id))}}
    function load(){try{const p=JSON.parse(localStorage.getItem(STORAGE)||"null");return p?.v===2?normalize(p):blankProfile()}catch{return blankProfile()}}
    let profile=load(),missionIndex=Math.min(profile.unlocked,8),keys=new Set(),pointer=null,last=performance.now(),w=900,h=700,dpr=1,audio=null,q=idleState();
    function idleState(){return{mode:"menu",time:0,score:0,combo:0,maxCombo:0,comboTimer:0,storm:0,stormMax:100,stormGain:1,stormDamage:1,stormUses:0,bossStorm:false,eventIndex:0,upgradeIndex:0,protocols:[],bullets:[],enemies:[],particles:[],messages:[],p:null,plan:[],boss:null,mission:missionIndex}}
    function sumStars(){return profile.stars.reduce((a,b)=>a+b,0)}function save(){localStorage.setItem(STORAGE,JSON.stringify(profile))}
    function seeded(seed){let s=seed>>>0;return()=>((s=Math.imul(s,1664525)+1013904223>>>0)/4294967296)}
    function missionPlan(index){const m=MISSIONS[index],rng=seeded(m.seed),out=[];m.waves.forEach((formation,wave)=>{const base=1+wave*2.45;for(const spec of FORMATIONS[formation])out.push({at:+(base+(spec.d||0)).toFixed(2),type:spec.type,x:+Math.max(.08,Math.min(.92,spec.x+(rng()-.5)*.035)).toFixed(4),phase:+(rng()*6.28).toFixed(4),wave,formation})});out.push({at:+(3.4+m.waves.length*2.45).toFixed(2),type:m.boss,x:.5,phase:+(rng()*6.28).toFixed(4),wave:m.waves.length,formation:"boss"});return out.sort((a,b)=>a.at-b.at||a.x-b.x)}

    function drawEnemy(e){const px=e.x*w,py=e.y*h,s=Math.min(w,h)*e.r;ctx.save();ctx.translate(px,py);ctx.fillStyle=e.color;if(e.boss){ctx.beginPath();ctx.moveTo(-s*1.45,-s*.2);ctx.lineTo(-s*.55,-s*.85);ctx.lineTo(0,-s*.55);ctx.lineTo(s*.55,-s*.85);ctx.lineTo(s*1.45,-s*.2);ctx.lineTo(s*.72,s*.72);ctx.lineTo(0,s*.38);ctx.lineTo(-s*.72,s*.72);ctx.closePath();ctx.fill();ctx.fillStyle="#1a2532";ctx.fillRect(-s*.32,-s*.24,s*.64,s*.42)}else{ctx.beginPath();ctx.moveTo(0,s);ctx.lineTo(-s*.92,-s*.62);ctx.lineTo(-s*.25,-s*.36);ctx.lineTo(0,-s);ctx.lineTo(s*.25,-s*.36);ctx.lineTo(s*.92,-s*.62);ctx.closePath();ctx.fill()}if(!e.boss){ctx.fillStyle="#16202d";ctx.fillRect(-s, -s*1.35,s*2,3);ctx.fillStyle="#6ed197";ctx.fillRect(-s,-s*1.35,s*2*Math.max(0,e.hp/e.maxHp),3)}ctx.restore()}
    function drawBullet(b){ctx.fillStyle=b.player?"#7ff6ec":"#ff7f91";const px=b.x*w,py=b.y*h;if(b.player){ctx.fillRect(px-2,py-10,4,15);ctx.fillStyle="rgba(127,246,236,.35)";ctx.fillRect(px-4,py-3,8,13)}else{ctx.beginPath();ctx.arc(px,py,Math.max(3,(b.r||.007)*Math.min(w,h)),0,Math.PI*2);ctx.fill()}}
    function loop(now){const dt=Math.min(.033,(now-last)/1000||.016);last=now;update(dt);draw();requestAnimationFrame(loop)}
    function pointFromEvent(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
    function audioStart(){if(!audio)try{audio=new(window.AudioContext||window.webkitAudioContext)()}catch{}if(audio?.state==="suspended")audio.resume()}
    function tone(freq,duration,volume){if(!audio)return;const oscillator=audio.createOscillator(),gain=audio.createGain(),now=audio.currentTime;oscillator.type="square";oscillator.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(volume,now);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);oscillator.connect(gain).connect(audio.destination);oscillator.start(now);oscillator.stop(now+duration)}
    canvas.addEventListener("pointerdown",e=>{if(q.mode!=="running")return;canvas.setPointerCapture?.(e.pointerId);pointer=pointFromEvent(e)});canvas.addEventListener("pointermove",e=>{if(pointer&&q.mode==="running")pointer=pointFromEvent(e)});canvas.addEventListener("pointerup",()=>pointer=null);canvas.addEventListener("pointercancel",()=>pointer=null);addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code))e.preventDefault();keys.add(e.code);if(e.code==="Space"&&!e.repeat)triggerStorm();if(e.code==="KeyP"&&!e.repeat)togglePause()});addEventListener("keyup",e=>keys.delete(e.code));addEventListener("resize",resize);
    $("launchBtn").onclick=startMission;$("referenceBtn").onclick=()=>applyReference(missionIndex);$("stormBtn").onclick=triggerStorm;$("pauseBtn").onclick=togglePause;$("archiveBtn").onclick=()=>{$("archiveText").value=encode();$("feedback").textContent="";$("archive").classList.remove("hidden")};$("closeBtn").onclick=()=>$("archive").classList.add("hidden");$("copyBtn").onclick=async()=>{$("archiveText").value=encode();$("archiveText").select();try{await navigator.clipboard.writeText($("archiveText").value);$("feedback").textContent="档案已复制。"}catch{$("feedback").textContent="档案已生成，请手动复制。"}};$("importBtn").onclick=()=>{try{profile=decode($("archiveText").value);save();missionIndex=Math.min(profile.unlocked,8);renderSide();showMenu();$("feedback").textContent="导入成功。"}catch(error){$("feedback").textContent=error.message}};
    window.__thunderVanguard={MISSIONS,FIGHTERS,MODULES,PROTOCOLS,FORMATIONS,profile:()=>profile,state:()=>q,missionPlan,selectMission,selectFighter,toggleModule,startMission,chooseProtocol,triggerStorm,calculateStars,simulateReference,applyReference,validateContent,encode,decode,renderSide};renderSide();resize();showMenu();requestAnimationFrame(loop);
  })();
