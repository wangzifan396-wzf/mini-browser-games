  <style>
    :root{--bg:#eaf0ed;--paper:#fffefa;--ink:#162a32;--muted:#62757c;--line:#bdcbc8;--deep:#183746;--blue:#18779b;--teal:#2e765e;--gold:#b9801c;--red:#ad4c52;--violet:#6b6088;--radius:8px;--shadow:0 12px 30px rgba(20,49,59,.11)}
    *{box-sizing:border-box;letter-spacing:0}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg)}button,textarea{font:inherit}.app{width:min(1180px,calc(100vw - 24px));margin:auto;padding:18px 0 30px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:18px 20px;border-bottom:4px solid #e1ba51;color:#fff;background:var(--deep)}h1{margin:0;font-size:28px}.sub{margin:5px 0 0;color:#d1e2e3;font-size:13px}.campaign{display:flex;gap:20px;text-align:right}.campaign b{display:block;color:#f1c95f;font-size:20px}.campaign span{color:#b9d0d1;font-size:10px}.missions{display:grid;grid-template-columns:repeat(12,minmax(42px,1fr));gap:5px;padding:12px 0}.mission{height:43px;border:1px solid #9badaa;border-radius:6px;color:#3b555e;background:#f8f9f5;font-weight:900;cursor:pointer}.mission.active{border-color:var(--blue);color:#fff;background:var(--blue)}.mission.locked{opacity:.42}.mission small{display:block;height:11px;color:#f2c452;font-size:9px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}.playfield{min-width:0;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);box-shadow:var(--shadow)}.brief{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.brief h2{margin:0;font-size:21px}.brief p{margin:5px 0 0;color:var(--muted);font-size:12px}.badge{flex:0 0 auto;padding:7px 9px;border:1px solid #d1ad59;border-radius:6px;color:#73510c;background:#fff4d6;font-size:11px;font-weight:900}.board-wrap{display:grid;place-items:center;min-height:470px;padding:10px;border:1px solid #9fb0ad;border-radius:var(--radius);background:#203941}.board{display:grid;gap:3px;width:min(100%,720px);touch-action:manipulation}.cell{display:grid;place-items:center;min-width:0;aspect-ratio:1;border:1px solid #8da3a0;border-radius:4px;color:#203139;background:#dce5df;font-weight:900;cursor:pointer}.cell:hover{outline:2px solid #f0c45c;outline-offset:-2px}.cell.open{border-color:#c3ceca;background:#fffdf5;cursor:default}.cell.flag{color:#fff;background:var(--violet)}.cell.mine{color:#fff;background:var(--red)}.cell.void{border-color:transparent;background:#203941;cursor:default}.cell.hint{animation:pulse 1s infinite;outline:3px solid #e2a72e;outline-offset:-3px}.cell[data-num="1"]{color:#18779b}.cell[data-num="2"]{color:#2e765e}.cell[data-num="3"]{color:#ad4c52}.cell[data-num="4"]{color:#6b6088}.cell[data-num="5"],.cell[data-num="6"],.cell[data-num="7"],.cell[data-num="8"]{color:#7a4d24}.panel{display:flex;flex-direction:column;gap:10px}.box{padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}.box h3{margin:0 0 9px;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px 4px;border:1px solid #d1dad7;border-radius:6px;text-align:center;background:#f3f6f2}.stat b{display:block;color:var(--blue);font-size:18px}.stat span{color:var(--muted);font-size:10px}.modes,.actions,.archive{display:grid;grid-template-columns:1fr 1fr;gap:6px}.modes button,.actions button,.archive button{min-height:39px;border:1px solid #9baca8;border-radius:6px;color:#314a53;background:#f3f5f0;font-weight:900;cursor:pointer}.modes button.active{border-color:var(--blue);color:#fff;background:var(--blue)}.actions button.primary{border-color:var(--teal);color:#fff;background:var(--teal)}.status{min-height:68px;margin:0;padding:10px;border-left:4px solid var(--teal);color:#3c555e;background:#edf4ef;font-size:12px;line-height:1.55}.logic{margin:0;padding-left:18px;color:var(--muted);font-size:11px;line-height:1.7}.progress{height:8px;border-radius:4px;background:#dce4df;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);transition:width .2s}.result{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(15,37,44,.72)}.result[hidden]{display:none}.result-card{width:min(420px,100%);padding:22px;border-radius:var(--radius);background:var(--paper);box-shadow:0 24px 70px rgba(0,0,0,.3);text-align:center}.result-card h2{margin:0}.result-stars{margin:12px 0;color:#d59a19;font-size:34px}.result-card button{min-height:42px;padding:0 18px;border:0;border-radius:6px;color:#fff;background:var(--blue);font-weight:900;cursor:pointer}@keyframes pulse{50%{filter:brightness(1.15);transform:scale(.94)}}
    .cell.hint{animation:none;box-shadow:inset 0 0 0 3px rgba(226,167,46,.28)}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.panel{display:grid;grid-template-columns:1fr 1fr}.panel .status{grid-column:1/-1}.board-wrap{min-height:0}}
    @media(max-width:620px){.app{width:calc(100vw - 12px);padding-top:6px}.head{display:block;padding:14px}.campaign{justify-content:space-between;margin-top:12px;text-align:left}.missions{grid-template-columns:repeat(6,1fr);gap:4px}.mission{height:38px}.playfield{padding:8px}.brief{display:block}.badge{display:inline-block;margin-top:7px}.board-wrap{padding:5px}.board{gap:2px}.cell{font-size:11px}.panel{display:flex}.sub{line-height:1.5}}
  </style>
</head>
<body>
  <main class="app">
    <header class="head"><div><h1>深空扫雷：逻辑航图</h1><p class="sub">十二片确定性雷区，每一步都能由数字约束推出，不需要概率猜测。</p></div><div class="campaign"><div><b id="starTotal">0 / 36</b><span>航图星章</span></div><div><b id="perfectTotal">0 / 12</b><span>无误任务</span></div><div><b id="logicTotal">0</b><span>已验证推导</span></div></div></header>
    <nav class="missions" id="missions" aria-label="航图任务"></nav>
    <section class="layout">
      <div class="playfield"><div class="brief"><div><h2 id="title"></h2><p id="brief"></p></div><span class="badge" id="badge"></span></div><div class="board-wrap"><div class="board" id="board" aria-label="扫雷逻辑棋盘"></div></div></div>
      <aside class="panel">
        <section class="box"><h3>勘测状态</h3><div class="stats"><div class="stat"><b id="minesLeft">0</b><span>未标记雷</span></div><div class="stat"><b id="timer">00:00</b><span>用时</span></div><div class="stat"><b id="shield">3</b><span>护盾</span></div></div><div class="progress" style="margin-top:9px"><i id="progress"></i></div></section>
        <section class="box"><h3>探测模式</h3><div class="modes"><button data-mode="probe">探测</button><button data-mode="flag">标记</button></div></section>
        <section class="box"><h3>逻辑工具</h3><div class="actions"><button class="primary" id="hint">推导一步</button><button id="undo">撤回</button><button id="replay">任务回放</button><button id="restart">重新勘测</button></div></section>
        <p class="status" id="status"></p>
        <section class="box"><h3>本区规则</h3><ul class="logic"><li>数字只统计周围八格中的地雷</li><li>已公开区域和信标扫描结果固定</li><li>提示只使用当前盘面可证明的结论</li></ul></section>
        <section class="box"><div class="archive"><button id="exportSave">导出航图</button><button id="importSave">导入航图</button></div></section>
      </aside>
    </section>
  </main>
  <div class="result" id="result" hidden><div class="result-card"><h2 id="resultTitle"></h2><p id="resultText"></p><div class="result-stars" id="resultStars"></div><button id="next">继续勘测</button></div></div>
  <script>
  (()=>{
    "use strict";
    const SAVE_KEY="mine_matrix_v2";
    const defs=[
      {id:"s1",title:"近港信标",brief:"双信标展开基础零区。",w:6,h:6,mines:6,shape:"full",beacons:[[1,1],[4,4]],seed:111},
      {id:"s2",title:"货舱残响",brief:"狭长货舱要求从两端合并线索。",w:7,h:6,mines:8,shape:"corners",beacons:[[1,1],[5,4]],seed:227},
      {id:"s3",title:"静默甲板",brief:"三处扫描区共同约束中段雷群。",w:8,h:7,mines:10,shape:"full",beacons:[[1,1],[6,1],[3,5]],seed:349},
      {id:"n1",title:"断角船坞",brief:"缺失的四角不会参与数字统计。",w:8,h:8,mines:12,shape:"corners",beacons:[[2,2],[5,5]],seed:461},
      {id:"n2",title:"裂片航道",brief:"残骸空洞切断部分邻接关系。",w:9,h:7,mines:13,shape:"wreck",beacons:[[1,1],[7,1],[4,5]],seed:587},
      {id:"n3",title:"空心反应堆",brief:"中央禁区形成环形推导链。",w:9,h:8,mines:15,shape:"core",beacons:[[1,1],[7,6],[1,6]],seed:709},
      {id:"r1",title:"双门裂谷",brief:"竖向裂谷只在两处门洞连通。",w:10,h:8,mines:17,shape:"rift",beacons:[[1,1],[8,1],[4,6]],seed:823},
      {id:"r2",title:"漂流群岛",brief:"离散空洞让边界数字更重要。",w:10,h:9,mines:19,shape:"islands",beacons:[[1,1],[8,7],[5,1]],seed:947},
      {id:"r3",title:"镜面星云",brief:"对称缺口隐藏着非对称雷区。",w:11,h:9,mines:22,shape:"mirror",beacons:[[1,4],[9,4],[5,1]],seed:1061},
      {id:"x1",title:"深核外环",brief:"外环与内环的约束必须交替推进。",w:11,h:10,mines:25,shape:"core",beacons:[[1,1],[9,8],[1,8]],seed:1193},
      {id:"x2",title:"碎星矩阵",brief:"高密度残骸区需要集合包含推导。",w:12,h:10,mines:28,shape:"wreck",beacons:[[1,1],[10,1],[5,8]],seed:1307},
      {id:"x3",title:"零猜终局",brief:"最终航图组合全部异形边界与高密度约束。",w:12,h:10,mines:31,shape:"final",beacons:[[1,1],[10,8],[6,1],[1,8]],seed:1429}
    ];
    const $=id=>document.getElementById(id),boardEl=$("board"),statusEl=$("status"),missionEl=$("missions");
    let save=loadSave(),prepared=[],q=null,mode="probe",clock=null,hintIndex=-1;

    function defaults(){return{version:2,stars:{},best:{},replays:{},updatedAt:Date.now()}}
    function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
    function normalize(value){const clean=defaults();if(!value||value.version!==2)return clean;for(const def of defs){clean.stars[def.id]=Math.max(0,Math.min(3,Number(value.stars?.[def.id])||0));if(Number(value.best?.[def.id])>0)clean.best[def.id]=Number(value.best[def.id]);if(Array.isArray(value.replays?.[def.id]))clean.replays[def.id]=value.replays[def.id].slice(0,400)}return clean}
    function loadSave(){try{return normalize(JSON.parse(localStorage.getItem(SAVE_KEY)))}catch{return defaults()}}
    function persist(){save.updatedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(save));renderCampaign()}
    function encodeSave(){const body=btoa(unescape(encodeURIComponent(JSON.stringify(save))));return`MINE2.${body}.${checksum(body)}`}
    function decodeSave(code){const parts=code.trim().split(".");if(parts.length!==3||parts[0]!=="MINE2"||checksum(parts[1])!==parts[2])throw Error("航图校验失败");return normalize(JSON.parse(decodeURIComponent(escape(atob(parts[1])))))}
    function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
    function activeAt(def,x,y){if(x<0||y<0||x>=def.w||y>=def.h)return false;if(def.shape==="full")return true;if(def.shape==="corners")return!((x===0||x===def.w-1)&&(y===0||y===def.h-1));if(def.shape==="core")return!(x>=Math.floor(def.w/2)-1&&x<=Math.floor(def.w/2)&&y>=Math.floor(def.h/2)-1&&y<=Math.floor(def.h/2));if(def.shape==="wreck")return!((x*3+y*5)%19===0||(x===Math.floor(def.w/2)&&y%4===2));if(def.shape==="rift")return x!==Math.floor(def.w/2)||y===1||y===def.h-2;if(def.shape==="islands")return!((x+y*2)%17===0||(x*2+y)%23===0);if(def.shape==="mirror")return!((x===2||x===def.w-3)&&(y===2||y===def.h-3));if(def.shape==="final")return!((x===Math.floor(def.w/2)&&y>2&&y<def.h-2)||((x+y)%17===0));return true}
    function neighbors(board,index){const{x,y}=board.cells[index],out=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<board.w&&ny<board.h){const next=ny*board.w+nx;if(board.cells[next].active)out.push(next)}}return out}
    function reveal(board,open,index){const cell=board.cells[index];if(!cell.active||cell.mine||open.has(index))return[];const added=[],queue=[index];while(queue.length){const current=queue.shift(),item=board.cells[current];if(open.has(current)||item.mine||!item.active)continue;open.add(current);added.push(current);if(item.num===0)for(const next of neighbors(board,current))if(!open.has(next)&&!board.cells[next].mine)queue.push(next)}return added}
    function makeBoard(def,seed){const cells=[];for(let y=0;y<def.h;y++)for(let x=0;x<def.w;x++)cells.push({x,y,active:activeAt(def,x,y),mine:false,num:0});const board={w:def.w,h:def.h,cells,seed,mines:def.mines};const excluded=new Set();for(const[x,y]of def.beacons){const index=y*def.w+x;excluded.add(index);for(const next of neighbors(board,index))excluded.add(next)}const pool=cells.map((cell,index)=>({cell,index})).filter(({cell,index})=>cell.active&&!excluded.has(index)).map(x=>x.index),random=rng(seed);for(let i=pool.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}for(const index of pool.slice(0,def.mines))cells[index].mine=true;cells.forEach((cell,index)=>{if(cell.active)cell.num=neighbors(board,index).filter(next=>cells[next].mine).length});return board}
    function initialOpen(def,board){const open=new Set();for(const[x,y]of def.beacons)reveal(board,open,y*def.w+x);return open}
    function constraints(board,open,flags){const list=[];for(const index of open){const cell=board.cells[index];if(!cell.num)continue;const near=neighbors(board,index),hidden=near.filter(next=>!open.has(next)&&!flags.has(next));if(!hidden.length)continue;const remaining=cell.num-near.filter(next=>flags.has(next)).length;list.push({source:index,cells:new Set(hidden),remaining})}return list}
    function derive(board,open,flags){const safe=new Set(),mines=new Set(),reasons=new Map(),list=constraints(board,open,flags);for(const rule of list){if(rule.remaining===0)for(const index of rule.cells){safe.add(index);reasons.set(`s${index}`,`数字 ${board.cells[rule.source].num} 周围的地雷已经全部标记`) }if(rule.remaining===rule.cells.size)for(const index of rule.cells){mines.add(index);reasons.set(`m${index}`,`数字 ${board.cells[rule.source].num} 的所有未明邻格都必须是雷`) }}for(const a of list)for(const b of list){if(a===b||a.cells.size>=b.cells.size)continue;const subset=[...a.cells].every(index=>b.cells.has(index));if(!subset)continue;const diff=[...b.cells].filter(index=>!a.cells.has(index)),remaining=b.remaining-a.remaining;if(remaining===0)for(const index of diff){safe.add(index);reasons.set(`s${index}`,"两个数字约束相减后，该格必定安全") }if(remaining===diff.length)for(const index of diff){mines.add(index);reasons.set(`m${index}`,"两个数字约束相减后，该格必定为雷") }}for(const index of flags)safe.delete(index);for(const index of open){safe.delete(index);mines.delete(index)}return{safe,mines,reasons}}
    function solve(board,initial){const open=new Set(initial),flags=new Set(),log=[];let guard=0;while(guard++<500){const step=derive(board,open,flags);if(!step.safe.size&&!step.mines.size)break;const safe=[...step.safe].filter(index=>!board.cells[index].mine),mines=[...step.mines].filter(index=>board.cells[index].mine);if(safe.length!==step.safe.size||mines.length!==step.mines.size)throw Error("逻辑求解器产生矛盾");for(const index of mines)flags.add(index);for(const index of safe)reveal(board,open,index);log.push({safe,mines})}const activeSafe=board.cells.filter(cell=>cell.active&&!cell.mine).length;return{solved:open.size===activeSafe,open,flags,log}}
    function prepare(def){for(let offset=0;offset<12000;offset++){const board=makeBoard(def,def.seed+offset),open=initialOpen(def,board),solution=solve(board,open);if(solution.solved)return{def,board,initial:open,solution,seed:def.seed+offset}}throw Error(`${def.id} 无法生成无猜解棋盘`)}
    function validateContent(){if(prepared.length!==12)throw Error("航图数量错误");for(const item of prepared){const active=item.board.cells.filter(cell=>cell.active).length,mines=item.board.cells.filter(cell=>cell.mine).length;if(mines!==item.def.mines||active-mines<=0||!item.solution.solved||!item.solution.log.length)throw Error(`${item.def.id} 内容验证失败`)}return{missions:prepared.length,logicSolved:prepared.length,totalDeductions:prepared.reduce((sum,item)=>sum+item.solution.log.length,0),seeds:prepared.map(item=>item.seed)}}
    function unlocked(index){return index===0||Number(save.stars[defs[index-1].id])>0}
    function begin(index=0){if(!unlocked(index))return;const item=prepared[index];clearInterval(clock);q={index,item,open:new Set(item.initial),flags:new Set(),actions:[],history:[],mistakes:0,hints:0,shield:3,time:0,over:false,replaying:false};hintIndex=-1;mode="probe";clock=setInterval(()=>{if(!q.over&&!q.replaying){q.time++;sync()}},1000);renderAll();setStatus("初始信标区已公开。沿数字边界推进，整张航图都存在确定性下一步。")}
    function setStatus(text){statusEl.textContent=text}
    function renderCampaign(){const stars=Object.values(save.stars).reduce((sum,n)=>sum+Number(n||0),0);$("starTotal").textContent=`${stars} / 36`;$("perfectTotal").textContent=`${Object.values(save.stars).filter(n=>n===3).length} / 12`;$("logicTotal").textContent=prepared.reduce((sum,item)=>sum+item.solution.log.length,0)}
    function renderMissions(){missionEl.replaceChildren();defs.forEach((def,index)=>{const button=document.createElement("button"),stars=Number(save.stars[def.id])||0;button.className=`mission${q?.index===index?" active":""}${unlocked(index)?"":" locked"}`;button.innerHTML=`${String(index+1).padStart(2,"0")}<small>${stars?"★".repeat(stars):""}</small>`;button.disabled=!unlocked(index);button.title=def.title;button.onclick=()=>begin(index);missionEl.append(button)})}
    function renderBoard(){const{board}=q.item;boardEl.style.gridTemplateColumns=`repeat(${board.w},1fr)`;boardEl.style.maxWidth=`${Math.min(720,board.w*62)}px`;boardEl.replaceChildren();board.cells.forEach((cell,index)=>{const button=document.createElement("button");button.className=`cell${cell.active?"":" void"}${q.open.has(index)?" open":""}${q.flags.has(index)?" flag":""}${q.over&&cell.mine?" mine":""}${hintIndex===index?" hint":""}`;button.disabled=!cell.active||q.replaying;button.dataset.index=index;if(q.flags.has(index))button.textContent="⚑";else if(q.open.has(index)){button.textContent=cell.num||"";button.dataset.num=cell.num}else if(q.over&&cell.mine)button.textContent="✹";button.onclick=()=>interact(index);button.oncontextmenu=event=>{event.preventDefault();toggleFlag(index)};boardEl.append(button)})}
    function sync(){const{board}=q.item,activeSafe=board.cells.filter(cell=>cell.active&&!cell.mine).length;$("minesLeft").textContent=Math.max(0,board.mines-q.flags.size);$("timer").textContent=`${String(Math.floor(q.time/60)).padStart(2,"0")}:${String(q.time%60).padStart(2,"0")}`;$("shield").textContent=q.shield;$("progress").style.width=`${Math.round(q.open.size/activeSafe*100)}%`;$("title").textContent=`${String(q.index+1).padStart(2,"0")} · ${q.item.def.title}`;$("brief").textContent=q.item.def.brief;$("badge").textContent=`${q.item.def.w}×${q.item.def.h} · ${q.item.def.mines} 雷 · Seed ${q.item.seed}`;document.querySelectorAll("[data-mode]").forEach(button=>button.classList.toggle("active",button.dataset.mode===mode));$("undo").disabled=!q.history.length||q.replaying;$("replay").disabled=!save.replays[q.item.def.id]?.length||q.replaying}
    function renderAll(){renderCampaign();renderMissions();sync();renderBoard()}
    function snapshot(){q.history.push({open:new Set(q.open),flags:new Set(q.flags),actions:q.actions.slice(),mistakes:q.mistakes,hints:q.hints,shield:q.shield})}
    function checkWin(){const activeSafe=q.item.board.cells.filter(cell=>cell.active&&!cell.mine).length;if(q.open.size!==activeSafe||q.replaying)return;finish()}
    function probe(index,fromReplay=false){if(q.over||q.replaying&&!fromReplay||q.open.has(index)||q.flags.has(index))return;hintIndex=-1;if(!fromReplay)snapshot();const cell=q.item.board.cells[index];if(cell.mine){q.mistakes++;q.shield--;q.flags.add(index);if(!fromReplay)q.actions.push(["flag",index]);setStatus(q.shield?"探针触雷，护盾吸收冲击并自动标记该格。无误星章已经失去。":"护盾耗尽，雷区完整公开，可以重新勘测本任务。");if(q.shield<=0){q.over=true;clearInterval(clock)}}else{const added=reveal(q.item.board,q.open,index);if(!fromReplay)q.actions.push(["probe",index]);setStatus(added.length>1?`零区展开 ${added.length} 格，新的数字边界已经形成。`:"该格安全，继续沿数字约束推进。")}renderAll();checkWin()}
    function toggleFlag(index,fromReplay=false){if(q.over||q.open.has(index)||q.replaying&&!fromReplay)return;hintIndex=-1;if(!fromReplay)snapshot();if(q.flags.has(index))q.flags.delete(index);else q.flags.add(index);if(!fromReplay)q.actions.push(["flag",index]);renderAll();checkWin()}
    function interact(index){if(mode==="flag")toggleFlag(index);else probe(index)}
    function hint(){if(q.over)return;const wrong=[...q.flags].find(index=>!q.item.board.cells[index].mine);if(wrong!==undefined){hintIndex=wrong;q.hints++;setStatus("当前标记与数字约束矛盾：高亮旗帜需要撤回。");renderAll();return}const step=derive(q.item.board,q.open,q.flags),safe=[...step.safe][0],mine=[...step.mines][0],index=safe??mine;if(index===undefined){setStatus("当前盘面没有可用推导；检查是否遗漏了已有数字周围的标记。");return}hintIndex=index;q.hints++;setStatus((safe!==undefined?"可安全探测：":"可确定为雷：")+step.reasons.get(`${safe!==undefined?"s":"m"}${index}`));renderAll()}
    function finish(){q.over=true;clearInterval(clock);const flawless=q.mistakes===0,stars=1+(flawless?1:0)+(flawless&&q.hints===0?1:0),id=q.item.def.id;save.stars[id]=Math.max(Number(save.stars[id])||0,stars);save.best[id]=Math.min(save.best[id]||Infinity,q.time);save.replays[id]=q.actions.slice();persist();$("resultTitle").textContent="航图确认";$("resultText").textContent=`${q.item.def.mines} 枚地雷全部定位，用时 ${q.time} 秒。`;$("resultStars").textContent="★".repeat(stars)+"☆".repeat(3-stars);$("next").textContent=q.index<defs.length-1?"下一片雷区":"返回终局";$("result").hidden=false}
    async function replay(){const actions=save.replays[q.item.def.id];if(!actions?.length)return;const index=q.index;begin(index);q.replaying=true;clearInterval(clock);setStatus("正在按最后一次通关记录复盘探测与标记。");renderAll();for(const[type,cell]of actions){await new Promise(resolve=>setTimeout(resolve,180));if(type==="probe")probe(cell,true);else toggleFlag(cell,true)}q.replaying=false;q.over=true;renderAll();setStatus("回放结束；点击重新勘测可开始新的解题记录。")}
    document.querySelectorAll("[data-mode]").forEach(button=>button.onclick=()=>{mode=button.dataset.mode;sync()});$("hint").onclick=hint;$("restart").onclick=()=>begin(q.index);$("replay").onclick=replay;$("undo").onclick=()=>{const previous=q.history.pop();if(!previous)return;q.open=previous.open;q.flags=previous.flags;q.actions=previous.actions;q.mistakes=previous.mistakes;q.hints=previous.hints;q.shield=previous.shield;hintIndex=-1;q.over=false;renderAll();setStatus("已撤回上一步勘测。")};$("next").onclick=()=>{$("result").hidden=true;begin(Math.min(defs.length-1,q.index+1))};
    $("exportSave").onclick=async()=>{const code=encodeSave();try{await navigator.clipboard.writeText(code);setStatus("MINE2 航图码已复制。") }catch{prompt("MINE2 航图码",code)}};$("importSave").onclick=()=>{const code=prompt("输入 MINE2 航图码");if(!code)return;try{save=decodeSave(code);persist();begin(0);setStatus("航图导入完成。") }catch(error){setStatus(error.message)}};
    addEventListener("keydown",event=>{if(event.code==="KeyF"){mode=mode==="flag"?"probe":"flag";sync()}if(event.code==="KeyH")hint()});
    prepared=defs.map(prepare);window.__mineMatrixTest={validateContent,prepared,derive,solve,getState:()=>({index:q.index,open:q.open.size,flags:q.flags.size})};validateContent();begin(0);
  })();
  </script>
