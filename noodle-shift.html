  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23283a34'/%3E%3Cpath d='M12 25h40l-5 25H17z' fill='%23f2cf72'/%3E%3Cpath d='M18 20c3-8 4 7 8 0s5 8 9 0 5 8 10 0' fill='none' stroke='%23fff8e6' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{--deep:#263a34;--ground:#e9ece5;--paper:#fffaf0;--line:#a7afa6;--ink:#293a33;--muted:#6d786f;--green:#43866f;--blue:#4f819e;--gold:#d8a640;--red:#c35d58;--radius:7px;--shadow:0 14px 32px rgba(35,52,45,.14)}
    *{box-sizing:border-box;letter-spacing:0}html,body{margin:0;min-height:100%;color:var(--ink);background:var(--ground);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}button{font:inherit}.app{width:min(1190px,calc(100vw - 24px));margin:auto;padding:16px 0 30px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:17px 20px;border-bottom:4px solid var(--gold);color:#fff;background:var(--deep)}h1{margin:0;font-size:28px}.sub{margin:5px 0 0;color:#d1ddd6;font-size:13px}.totals{display:flex;gap:18px;text-align:right}.totals b{display:block;color:#f3ca70;font-size:20px}.totals span{color:#cad6d0;font-size:10px}.contracts{display:grid;grid-template-columns:repeat(12,minmax(42px,1fr));gap:5px;padding:11px 0}.contract{height:46px;border:1px solid #adb8b1;border-radius:6px;color:#405248;background:#f7f9f6;font-weight:900;cursor:pointer}.contract.active{border-color:var(--green);color:#fff;background:var(--green)}.contract:disabled{opacity:.42}.contract small{display:block;height:11px;color:#f3d17c;font-size:9px}.layout{display:grid;grid-template-columns:minmax(510px,790px) 340px;gap:14px;align-items:start}.stage{position:relative;overflow:hidden;padding:8px;border:1px solid #77867e;border-radius:var(--radius);background:#17251f;box-shadow:var(--shadow)}.stage canvas{display:block;width:100%;height:auto;aspect-ratio:36/31;border:1px solid #566a60;border-radius:6px;background:#13201b;touch-action:none}.canvas-hud{position:absolute;inset:16px 16px auto;display:flex;justify-content:space-between;gap:6px;pointer-events:none}.canvas-hud span{padding:5px 7px;border:1px solid rgba(255,255,255,.2);border-radius:5px;color:#e1ebe5;background:rgba(22,36,29,.9);font-size:10px}.side{display:flex;flex-direction:column;gap:10px}.panel{padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}.panel h2,.panel h3{margin:0 0 8px}.panel h2{font-size:18px}.panel h3{font-size:14px}.brief{margin:0;color:var(--muted);font-size:11px;line-height:1.55}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:9px 0}.metric{padding:7px;border:1px solid #b2bab2;border-radius:6px;background:#f2f5ef}.metric b{display:block;color:var(--green);font-size:17px}.metric span{color:#738078;font-size:9px}.status{min-height:55px;margin:8px 0 0;padding:8px;border-left:4px solid var(--gold);color:#526159;background:#eef2ea;font-size:11px;line-height:1.5}.carts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.cart{min-height:66px;padding:6px;border:1px solid #aab6ae;border-radius:6px;color:#405248;background:#edf2ed;font-size:9px;font-weight:900;cursor:pointer}.cart b{display:block;font-size:12px}.cart.active{border-color:var(--blue);color:#fff;background:var(--blue)}.tickets{display:grid;gap:5px;max-height:230px;overflow:auto}.ticket{display:grid;grid-template-columns:1fr auto;gap:4px;padding:7px;border:1px solid #aeb8b0;border-radius:6px;color:#3c5045;background:#f2f5ef;text-align:left;cursor:pointer}.ticket.active{border-color:var(--green);box-shadow:inset 4px 0 var(--green)}.ticket strong{font-size:11px}.ticket small{color:#68786f;font-size:9px}.ticket time{color:var(--red);font-size:10px;font-weight:900}.ticket .recipe{grid-column:1/-1;display:flex;gap:3px}.dot{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;color:#fff;font-size:9px;font-weight:900}.empty{padding:12px;color:#7a867f;text-align:center;font-size:11px}.pots{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.pot{min-height:56px;padding:5px;border:1px solid #a3afa7;border-radius:6px;color:#3d5046;background:#edf2ed;font-size:10px;font-weight:900;cursor:pointer}.pot b{display:block;font-size:14px}.pot.active{border-color:var(--green);color:#fff;background:var(--green)}.ingredients{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}.ingredient{min-height:42px;border:1px solid #a6b2aa;border-radius:6px;color:#354b40;background:#f1f4ee;font-size:10px;font-weight:900;cursor:pointer}.ingredient i{display:inline-block;width:9px;height:9px;margin-right:4px;border-radius:50%}.commands,.archive{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.commands button,.archive button{min-height:40px;border:1px solid #9eafa5;border-radius:6px;color:#344b3f;background:#edf2ed;font-weight:900;cursor:pointer}.commands .primary{grid-column:1/-1;border-color:var(--green);color:#fff;background:var(--green)}.commands .serve{border-color:var(--gold);color:#3c3728;background:#f1ce72}.overlay{position:absolute;inset:8px;display:grid;place-items:center;padding:14px;background:rgba(13,25,19,.9);text-align:center}.overlay[hidden]{display:none}.overlay-card{width:min(380px,100%);padding:22px;border-radius:var(--radius);color:#fff;background:#30453a;box-shadow:0 24px 60px rgba(0,0,0,.45)}.overlay-card h2{margin:0;font-size:24px}.overlay-card p{color:#d2ddd6;line-height:1.6}.overlay-stars{color:#efc668;font-size:34px}.overlay-card button{min-height:42px;padding:0 20px;border:0;border-radius:6px;color:#29382f;background:#efc668;font-weight:900;cursor:pointer}
    .commands button:disabled{opacity:.55;cursor:not-allowed}@media(max-width:930px){.layout{grid-template-columns:1fr}.side{order:-1;display:grid;grid-template-columns:1fr 1fr}.tickets-panel,.kitchen-panel{grid-column:1/-1}.archive-panel{grid-column:1/-1}.tickets{max-height:190px}}
    @media(max-width:700px){.app{width:calc(100vw - 12px);padding-top:6px}.head{display:block;padding:13px}.head h1{font-size:22px}.sub{font-size:11px}.totals{justify-content:space-between;margin-top:11px;text-align:left}.contracts{grid-template-columns:repeat(6,1fr)}.contract{height:39px}.side{display:flex}.panel{padding:10px}.tickets{max-height:220px}.stage{padding:6px}.overlay{inset:6px}}

<body>
  <main class="app">
    <header class="head"><div><h1>夜市面摊：十二班灯火账</h1><p class="sub">看固定订单表调度三口汤锅，在四条夜街完成十二班可复盘的出餐合同。</p></div><div class="totals"><div><b id="starTotal">0 / 36</b><span>夜班星章</span></div><div><b id="clearTotal">0 / 12</b><span>完成班次</span></div><div><b id="cleanTotal">0 / 12</b><span>零错单班次</span></div></div></header>
    <nav class="contracts" id="contracts" aria-label="夜班合同"></nav>
    <section class="layout">
      <div class="stage"><canvas id="board" width="720" height="620" aria-label="夜市三锅面摊"></canvas><div class="canvas-hud"><span>班次 <b id="shiftHud">01</b></span><span>时间 <b id="timeHud">0.0</b>s</span></div><div class="overlay" id="overlay"><div class="overlay-card"><h2 id="overlayTitle"></h2><p id="overlayText"></p><div class="overlay-stars" id="overlayStars"></div><button id="overlayButton">开始</button></div></div></div>
      <aside class="side">
        <section class="panel"><h2 id="shiftTitle"></h2><p class="brief" id="shiftBrief"></p><div class="metrics"><div class="metric"><b id="serveMetric">0 / 0</b><span>出餐 / 目标</span></div><div class="metric"><b id="moneyMetric">0 / 0</b><span>收入 / 二星线</span></div><div class="metric"><b id="mistakeMetric">0</b><span>错单 / 超时</span></div></div><p class="status" id="status"></p></section>
        <section class="panel"><h3>选择餐车</h3><div class="carts"><button class="cart" data-cart="stove"><b>老灶车</b>煮面快 18%</button><button class="cart" data-cart="prep"><b>备菜车</b>自动放首料</button><button class="cart" data-cart="lantern"><b>暖灯车</b>耐心增 18%</button></div></section>
        <section class="panel tickets-panel"><h3>待出订单 · 点击选中</h3><div class="tickets" id="tickets"></div></section>
        <section class="panel kitchen-panel"><h3>三锅并行 · 点击空锅开火</h3><div class="pots" id="pots"></div><div class="ingredients" id="ingredients"></div><div class="commands"><button class="primary" id="start">开始夜班</button><button class="serve" id="serve">出餐</button><button id="discard">倒掉本锅</button><button id="pause">暂停</button><button id="restart">重开</button></div></section>
        <section class="panel archive-panel"><h3>跨设备灯火账</h3><div class="archive"><button id="exportSave">导出档案</button><button id="importSave">导入档案</button></div></section>
      </aside>
    </section>
  </main>
  <script>
  (()=>{
    "use strict";
    const SAVE_KEY="noodle_shift_v2",BLANCH=2.35,FINISH_PER_TOPPING=.28,streets=["河灯街","雨巷口","旧码头","灯会桥"];
    const ingredients={egg:{name:"卤蛋",mark:"蛋",color:"#d4a83e"},beef:{name:"酱牛肉",mark:"肉",color:"#b45a52"},veg:{name:"青菜",mark:"青",color:"#5d9b63"},fish:{name:"鱼丸",mark:"鱼",color:"#6f9eae"},chili:{name:"辣油",mark:"辣",color:"#c65d47"},mushroom:{name:"香菇",mark:"菇",color:"#826d56"}};
    const recipes={veg:{name:"青菜清汤",items:["veg"]},egg:{name:"卤蛋面",items:["egg"]},beef:{name:"酱牛肉面",items:["beef"]},eggveg:{name:"芽菜蛋面",items:["egg","veg"]},beefveg:{name:"青菜牛肉",items:["beef","veg"]},fishveg:{name:"鱼丸青汤",items:["fish","veg"]},spicybeef:{name:"红油牛肉",items:["beef","chili"]},mushroomegg:{name:"香菇蛋面",items:["egg","mushroom"]},harbor:{name:"码头三鲜",items:["fish","chili","veg"]},house:{name:"灯火招牌",items:["egg","beef","mushroom"]},festival:{name:"四喜灯会",items:["egg","beef","fish","veg"]}};
    const customers=["夜骑手","码头工","巡街人","收摊阿姨","晚课生","修灯匠","渡船客","报时员"];
    function makeShift(title,brief,ids,gap,patience,index){return{title,brief,street:streets[Math.floor(index/3)],orders:ids.map((recipe,i)=>({id:i,recipe,customer:customers[(i*3+index)%customers.length],at:.8+i*gap+(i%3)*.18,patience:patience+(i%4)*.65})),target:Math.max(1,ids.length-1)}}
    const shiftSeeds=[];
    shiftSeeds.push(["初灯试灶","单料面与双料面交替出现，先熟悉三锅切换。",["egg","veg","beef","eggveg","veg","egg","beef","eggveg"],4.4,14.5]);
    shiftSeeds.push(["河风并单","同类订单会连续出现，适合提前分配空锅。",["beef","veg","beefveg","egg","eggveg","beef","beefveg","veg"],4.05,14]);
    shiftSeeds.push(["桥头散席","河灯街末班首次加入三种双料面。",["eggveg","beefveg","egg","beef","eggveg","veg","beefveg","egg","beef"],3.8,13.6]);
    shiftSeeds.push(["雨巷新味","鱼丸与香菇进入菜单，订单辨认比锅速更重要。",["fishveg","mushroomegg","egg","veg","fishveg","beefveg","mushroomegg","beef","eggveg"],3.75,13.3]);
    shiftSeeds.push(["红油夜雨","辣油只属于红油与三鲜，错放会整锅作废。",["spicybeef","fishveg","beef","spicybeef","eggveg","mushroomegg","fishveg","veg","spicybeef","egg"],3.5,12.9]);
    shiftSeeds.push(["伞下连席","双料订单密集到达，观察下一单再决定空锅。",["mushroomegg","spicybeef","fishveg","beefveg","eggveg","mushroomegg","spicybeef","fishveg","beef","veg"],3.35,12.6]);
    shiftSeeds.push(["码头开舱","三鲜面加入第三种配料，备菜车开始体现优势。",["harbor","fishveg","beefveg","spicybeef","harbor","eggveg","mushroomegg","fishveg","beef","harbor"],3.3,12.4]);
    shiftSeeds.push(["潮班换岗","招牌面与三鲜面交错，不能只记配料数量。",["house","harbor","eggveg","spicybeef","fishveg","house","beefveg","harbor","mushroomegg","house","veg"],3.08,12.1]);
    shiftSeeds.push(["汽笛末班","旧码头的最后一班把单料面藏进复杂订单之间。",["harbor","house","beef","festival","fishveg","spicybeef","egg","house","harbor","beefveg","mushroomegg"],2.95,11.9]);
    shiftSeeds.push(["灯会初巡","四喜面登场，四料锅会占用更长收尾时间。",["festival","house","harbor","eggveg","festival","spicybeef","mushroomegg","house","fishveg","festival","beef"],2.9,11.8]);
    shiftSeeds.push(["百灯同席","三锅几乎持续满载，订单预告决定调度顺序。",["house","festival","harbor","spicybeef","festival","fishveg","house","mushroomegg","festival","beefveg","harbor","egg"],2.75,11.5]);
    shiftSeeds.push(["子夜合账","终班混合全部面谱，用完整灯火账完成收官。",["festival","house","harbor","spicybeef","mushroomegg","festival","beefveg","fishveg","house","harbor","festival","eggveg"],2.62,11.3]);
    const shifts=shiftSeeds.map((seed,index)=>makeShift(...seed,index));
    const carts={stove:{name:"老灶车",cookFactor:.82,patienceFactor:1,autoFirst:false},prep:{name:"备菜车",cookFactor:1,patienceFactor:1,autoFirst:true},lantern:{name:"暖灯车",cookFactor:1,patienceFactor:1.18,autoFirst:false}};
    const $=id=>document.getElementById(id),canvas=$("board"),ctx=canvas.getContext("2d"),contractEl=$("contracts"),overlay=$("overlay");
    let profile=load(),cart=profile.cart||"stove",selected=0,q=makeState(0),lastTime=0,loopToken=0,audio=null;
    function defaults(){return{version:2,stars:{},best:{},clean:{},cart:"stove",updatedAt:Date.now()}}
    function normalize(value){const clean=defaults();if(!value||value.version!==2)return clean;for(let i=0;i<shifts.length;i++){clean.stars[i]=Math.max(0,Math.min(3,Number(value.stars?.[i])||0));if(Number.isFinite(Number(value.best?.[i])))clean.best[i]=Math.max(0,Number(value.best[i]));clean.clean[i]=Boolean(value.clean?.[i])}if(carts[value.cart])clean.cart=value.cart;return clean}
    function load(){try{return normalize(JSON.parse(localStorage.getItem(SAVE_KEY)))}catch{return defaults()}}
    function save(){profile.cart=cart;profile.updatedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(profile));renderCampaign()}
    function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
    function encodeProfile(){const body=btoa(unescape(encodeURIComponent(JSON.stringify(profile))));return`NOODLE2.${body}.${checksum(body)}`}
    function decodeProfile(code){const part=code.trim().split(".");if(part.length!==3||part[0]!=="NOODLE2"||checksum(part[1])!==part[2])throw Error("灯火账档案校验失败");return normalize(JSON.parse(decodeURIComponent(escape(atob(part[1])))))}
    function recipeFor(order){return recipes[order.recipe]}
    function cookDuration(order,cartId=cart){return(BLANCH+recipeFor(order).items.length*FINISH_PER_TOPPING)*carts[cartId].cookFactor}
    function deadlineFor(order,cartId=cart){return order.at+order.patience*carts[cartId].patienceFactor}
    function baseValue(order){return 14+recipeFor(order).items.length*9}
    function priceAt(order,finishedAt,cartId=cart){const remaining=Math.max(0,deadlineFor(order,cartId)-finishedAt);return baseValue(order)+Math.floor(remaining/3)}
    function referencePlan(shiftIndex,cartId="stove"){const shift=shifts[shiftIndex],available=[0,0,0],plan=[];let income=0,served=0;for(const source of shift.orders){let pot=0;for(let i=1;i<3;i++)if(available[i]<available[pot])pot=i;const start=Math.max(source.at,available[pot]),finish=start+cookDuration(source,cartId);if(finish>deadlineFor(source,cartId))continue;available[pot]=finish+.16;income+=priceAt(source,finish,cartId);served++;plan.push({orderId:source.id,pot,start,finish})}return{won:served>=shift.target,served,income,plan,lastFinish:Math.max(...available)}}
    function validateContent(){const signatures=new Set();let orders=0,referenceWins=0,referencePlans=0;for(let i=0;i<shifts.length;i++){const shift=shifts[i],signature=shift.orders.map(order=>`${order.recipe}@${order.at.toFixed(2)}:${order.patience.toFixed(2)}`).join("|");if(signatures.has(signature))throw Error(`第 ${i+1} 班订单重复`);signatures.add(signature);if(shift.orders.some(order=>!recipes[order.recipe]||deadlineFor(order,"stove")<=order.at))throw Error(`第 ${i+1} 班订单非法`);orders+=shift.orders.length;let all=true;for(const cartId of Object.keys(carts)){const result=referencePlan(i,cartId);referencePlans++;if(!result.won||result.served!==shift.orders.length)all=false}if(!all)throw Error(`第 ${i+1} 班存在无法完整履约的餐车`);referenceWins++}return{shifts:shifts.length,streets:4,recipes:Object.keys(recipes).length,ingredients:Object.keys(ingredients).length,orders,uniqueSchedules:signatures.size,referencePlans,referenceWins}}
    function makeState(index=selected){const shift=shifts[index];return{index,shift,mode:"brief",time:0,orders:shift.orders.map(order=>({...order,status:"scheduled",deadline:deadlineFor(order),pot:null,servedAt:null})),pots:Array.from({length:3},()=>({orderId:null,stage:"empty",timer:0,items:[]})),selectedOrder:null,selectedPot:0,served:0,income:0,waste:0,missed:0,message:"查看固定订单表，选中订单后点击空锅开火。"}}
    function ensureAudio(){try{if(!audio)audio=new(AudioContext||webkitAudioContext)();if(audio.state==="suspended")audio.resume()}catch{audio=null}}
    function beep(freq=.03,duration=.08,gain=.03){if(!audio)return;const osc=audio.createOscillator(),amp=audio.createGain();osc.frequency.value=220+freq;osc.type="sine";amp.gain.setValueAtTime(gain,audio.currentTime);amp.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);osc.connect(amp);amp.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration+.02)}
    function activeOrders(){return q.orders.filter(order=>order.status==="waiting"||order.status==="cooking")}
    function startRun(){ensureAudio();q.mode="running";lastTime=performance.now();loopToken++;hideOverlay();q.message="第一批订单将按固定时刻进入；票面配料顺序不影响成品。";renderAll();requestAnimationFrame(time=>loop(time,loopToken))}
    function loop(time,token){if(token!==loopToken||q.mode!=="running")return;const dt=Math.min(.08,Math.max(0,(time-lastTime)/1000));lastTime=time;advance(dt);requestAnimationFrame(next=>loop(next,token))}
    function advance(dt){if(q.mode!=="running")return;q.time+=dt;let dirty=false;for(const order of q.orders)if(order.status==="scheduled"&&q.time>=order.at){order.status="waiting";dirty=true}for(let index=0;index<q.pots.length;index++){const pot=q.pots[index];if(pot.stage==="blanch"){pot.timer-=dt;if(pot.timer<=0){pot.stage="dress";pot.timer=0;const order=q.orders.find(item=>item.id===pot.orderId);if(carts[cart].autoFirst&&order&&!pot.items.length)pot.items.push(recipeFor(order).items[0]);q.message=`${index+1} 号锅已出汤，可以按票面加料。`;beep(230,0.07,.025);dirty=true}}}for(const order of q.orders)if((order.status==="waiting"||order.status==="cooking")&&q.time>order.deadline){expireOrder(order);dirty=true}if(q.orders.every(order=>order.status==="served"||order.status==="missed")){finishShift();return}if(dirty)renderAll();else renderFrame()}
    function expireOrder(order){order.status="missed";q.missed++;if(order.pot!==null){const pot=q.pots[order.pot];pot.orderId=null;pot.stage="empty";pot.items=[];pot.timer=0}if(q.selectedOrder===order.id)q.selectedOrder=null;q.message=`${order.customer} 等候超时，本班目标仍可继续争取。`;beep(40,.16,.03)}
    function selectOrder(id){if(q.mode!=="running")return false;const order=q.orders.find(item=>item.id===id);if(!order||order.status!=="waiting")return false;q.selectedOrder=id;q.message=`已选 ${order.customer} 的${recipeFor(order).name}，点击空锅开火。`;renderAll();return true}
    function selectPot(index){if(index<0||index>2)return false;q.selectedPot=index;const pot=q.pots[index];if(q.mode!=="running"){renderAll();return false}if(pot.stage==="empty"&&q.selectedOrder!==null){const order=q.orders.find(item=>item.id===q.selectedOrder&&item.status==="waiting");if(order){pot.orderId=order.id;pot.stage="blanch";pot.timer=BLANCH*carts[cart].cookFactor;pot.items=[];order.status="cooking";order.pot=index;q.selectedOrder=null;q.message=`${index+1} 号锅开始煮 ${recipeFor(order).name}。`;beep(70,.08,.025)}}else if(pot.stage!=="empty"){const order=q.orders.find(item=>item.id===pot.orderId);if(order)q.message=`${index+1} 号锅：${recipeFor(order).name}，${pot.stage==="blanch"?`还需 ${pot.timer.toFixed(1)} 秒出汤`:"等待配料与出餐"}。`}renderAll();return true}
    function addIngredient(id){if(q.mode!=="running"||!ingredients[id])return false;const pot=q.pots[q.selectedPot];if(pot.stage!=="dress"||pot.items.includes(id))return false;pot.items.push(id);q.message=`${q.selectedPot+1} 号锅加入${ingredients[id].name}。`;beep(150+pot.items.length*55,.06,.02);renderAll();return true}
    function sameItems(a,b){return a.length===b.length&&[...a].sort().every((value,index)=>value===[...b].sort()[index])}
    function servePot(){if(q.mode!=="running")return false;const pot=q.pots[q.selectedPot],order=q.orders.find(item=>item.id===pot.orderId);if(!order||pot.stage!=="dress")return false;const expected=recipeFor(order).items;if(!sameItems(pot.items,expected)){q.waste++;order.status="waiting";order.pot=null;pot.orderId=null;pot.stage="empty";pot.items=[];q.message=`错单：${recipeFor(order).name} 需要 ${expected.map(id=>ingredients[id].name).join("、")}，本锅已倒掉。`;beep(30,.18,.035);renderAll();return false}const value=priceAt(order,q.time);order.status="served";order.servedAt=q.time;order.pot=null;q.served++;q.income+=value;pot.orderId=null;pot.stage="empty";pot.items=[];q.message=`${recipeFor(order).name} 出餐，收入 ${value}。`;beep(330,.12,.035);renderAll();return true}
    function discardPot(){if(q.mode!=="running")return false;const pot=q.pots[q.selectedPot],order=q.orders.find(item=>item.id===pot.orderId);if(!order)return false;order.status="waiting";order.pot=null;pot.orderId=null;pot.stage="empty";pot.items=[];pot.timer=0;q.waste++;q.message=`${q.selectedPot+1} 号锅已倒掉，订单回到等待区。`;renderAll();return true}
    function finishShift(){if(q.mode==="over")return;loopToken++;q.mode="over";const reference=referencePlan(q.index,cart),won=q.served>=q.shift.target;if(!won){showOverlay("本班未结清",`完成 ${q.served}/${q.shift.target} 份目标订单，重新安排开火顺序再试一次。`,"","重开夜班",()=>begin(q.index));return}const stars=1+(q.income>=Math.floor(reference.income*.88)?1:0)+(q.waste===0&&q.missed===0?1:0);profile.stars[q.index]=Math.max(Number(profile.stars[q.index])||0,stars);profile.best[q.index]=Math.max(Number(profile.best[q.index])||0,q.income);profile.clean[q.index]=profile.clean[q.index]||(q.waste===0&&q.missed===0);save();renderAll();showOverlay("灯火账已结清",`出餐 ${q.served} 份，收入 ${q.income}，错单 ${q.waste}，超时 ${q.missed}。`,"★".repeat(stars)+"☆".repeat(3-stars),q.index<11?"下一班":"返回班表",()=>begin(q.index<11?q.index+1:q.index))}
    function togglePause(){if(q.mode==="running"){q.mode="paused";loopToken++;showOverlay("炉火暂歇","订单时钟与汤锅已经暂停。","","继续夜班",()=>{q.mode="running";lastTime=performance.now();loopToken++;hideOverlay();requestAnimationFrame(time=>loop(time,loopToken))})}}
    function unlocked(index){return index===0||Number(profile.stars[index-1])>0}
    function begin(index=selected){if(!unlocked(index))return;loopToken++;selected=index;q=makeState(index);renderAll();const ref=referencePlan(index,cart);showOverlay(`${q.shift.street} · ${q.shift.title}`,`${q.shift.orders.length} 份固定订单，目标出餐 ${q.shift.target} 份；${carts[cart].name}参考收入 ${ref.income}。`,"","升火开摊",startRun)}
    function showOverlay(title,text,stars,label,handler){$("overlayTitle").textContent=title;$("overlayText").textContent=text;$("overlayStars").textContent=stars;$("overlayButton").textContent=label;$("overlayButton").onclick=handler;overlay.hidden=false}
    function hideOverlay(){overlay.hidden=true}
    function renderCampaign(){contractEl.innerHTML=shifts.map((shift,index)=>`<button class="contract ${index===selected?"active":""}" data-index="${index}" ${unlocked(index)?"":"disabled"}>${String(index+1).padStart(2,"0")}<small>${"★".repeat(Number(profile.stars[index])||0)}</small></button>`).join("");$("starTotal").textContent=`${Object.values(profile.stars).reduce((a,b)=>a+Number(b||0),0)} / 36`;$("clearTotal").textContent=`${Object.values(profile.stars).filter(Boolean).length} / 12`;$("cleanTotal").textContent=`${Object.values(profile.clean).filter(Boolean).length} / 12`;document.querySelectorAll(".cart").forEach(button=>button.classList.toggle("active",button.dataset.cart===cart))}
    function renderTickets(){const active=activeOrders().sort((a,b)=>a.deadline-b.deadline);$("tickets").innerHTML=active.length?active.map(order=>`<button class="ticket ${q.selectedOrder===order.id?"active":""}" data-order="${order.id}" ${order.status!=="waiting"?"disabled":""}><strong>${order.customer} · ${recipeFor(order).name}</strong><time>${Math.max(0,order.deadline-q.time).toFixed(1)}s</time><small>${order.status==="cooking"?`${Number(order.pot)+1} 号锅制作中`:"等待开火"}</small><span class="recipe">${recipeFor(order).items.map(id=>`<i class="dot" style="background:${ingredients[id].color}">${ingredients[id].mark}</i>`).join("")}</span></button>`).join(""):`<div class="empty">${q.mode==="running"?"下一张订单尚未到达":"开摊后显示固定订单"}</div>`}
    function renderKitchen(){$("pots").innerHTML=q.pots.map((pot,index)=>{const order=q.orders.find(item=>item.id===pot.orderId),label=pot.stage==="empty"?"空锅":pot.stage==="blanch"?`${pot.timer.toFixed(1)}s`:pot.items.length?pot.items.map(id=>ingredients[id].mark).join("+"):"待加料";return`<button class="pot ${q.selectedPot===index?"active":""}" data-pot="${index}"><b>${index+1} 号锅</b>${order?recipeFor(order).name:"可接订单"}<br><span class="pot-state">${label}</span></button>`}).join("");$("ingredients").innerHTML=Object.entries(ingredients).map(([id,item])=>`<button class="ingredient" data-ingredient="${id}"><i style="background:${item.color}"></i>${item.name}</button>`).join("")}
    function renderInfo(){const ref=referencePlan(q.index,cart),running=q.mode==="running"||q.mode==="paused";$("shiftTitle").textContent=`${String(q.index+1).padStart(2,"0")} · ${q.shift.title}`;$("shiftBrief").textContent=`${q.shift.street}：${q.shift.brief}`;$("serveMetric").textContent=`${q.served} / ${q.shift.target}`;$("moneyMetric").textContent=`${q.income} / ${Math.floor(ref.income*.88)}`;$("mistakeMetric").textContent=`${q.waste} / ${q.missed}`;$("status").textContent=q.message;$("shiftHud").textContent=String(q.index+1).padStart(2,"0");$("timeHud").textContent=q.time.toFixed(1);$("pause").textContent=q.mode==="paused"?"继续":"暂停";$("start").disabled=running;$("start").textContent=running?"夜班进行中":"开始夜班"}
    function drawPot(x,y,pot,index){ctx.fillStyle="#d5a943";ctx.beginPath();ctx.ellipse(x,y,88,32,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#2b3d35";ctx.beginPath();ctx.ellipse(x,y-4,73,22,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle=q.selectedPot===index?"#72cfaa":"#82938a";ctx.lineWidth=q.selectedPot===index?6:3;ctx.stroke();if(pot.stage!=="empty"){const order=q.orders.find(item=>item.id===pot.orderId);ctx.fillStyle="#f2ead4";ctx.beginPath();ctx.ellipse(x,y-4,62,16,0,0,Math.PI*2);ctx.fill();if(order){const ids=pot.stage==="blanch"?[]:pot.items;ids.forEach((id,i)=>{ctx.fillStyle=ingredients[id].color;ctx.beginPath();ctx.arc(x-28+i*24,y-5,8,0,Math.PI*2);ctx.fill()})}}ctx.fillStyle="#e4ece7";ctx.font="900 15px system-ui";ctx.textAlign="center";ctx.fillText(`${index+1} 号锅`,x,y+55)}
    function draw(){ctx.fillStyle="#15231d";ctx.fillRect(0,0,720,620);ctx.fillStyle="#263b32";ctx.fillRect(0,0,720,150);for(let i=0;i<18;i++){ctx.fillStyle=i%3===0?"#d9aa43":"#6d927e";ctx.beginPath();ctx.arc(30+i*42,70+(i%2)*18,5,0,Math.PI*2);ctx.fill()}ctx.fillStyle="#314a3e";ctx.fillRect(0,150,720,470);ctx.fillStyle="#1e3028";for(let y=180;y<620;y+=74)ctx.fillRect(0,y,720,2);ctx.fillStyle="#f3cc71";ctx.font="900 24px system-ui";ctx.textAlign="left";ctx.fillText(`${q.shift.street} · ${q.shift.title}`,28,118);ctx.fillStyle="#c6d3cb";ctx.font="14px system-ui";ctx.fillText(`固定订单 ${q.shift.orders.length} · ${carts[cart].name} · 已出 ${q.served}`,30,145);q.pots.forEach((pot,index)=>drawPot(150+index*210,325,pot,index));const next=q.orders.find(order=>order.status==="scheduled");ctx.fillStyle="#22362d";ctx.fillRect(36,450,648,116);ctx.fillStyle="#72cba7";ctx.font="900 18px system-ui";ctx.fillText("下一单预告",58,480);ctx.fillStyle="#e5eee8";ctx.font="900 22px system-ui";ctx.fillText(next?`${next.customer} · ${recipeFor(next).name}`:"本班订单已全部到齐",58,520);if(next){ctx.fillStyle="#aebdb4";ctx.font="14px system-ui";ctx.fillText(`${Math.max(0,next.at-q.time).toFixed(1)} 秒后到达`,58,550);recipeFor(next).items.forEach((id,index)=>{ctx.fillStyle=ingredients[id].color;ctx.beginPath();ctx.arc(430+index*42,518,15,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="900 11px system-ui";ctx.textAlign="center";ctx.fillText(ingredients[id].mark,430+index*42,519);ctx.textAlign="left"})}}
    function renderFrame(){renderInfo();document.querySelectorAll(".ticket[data-order]").forEach(button=>{const order=q.orders.find(item=>item.id===Number(button.dataset.order)),time=button.querySelector("time");if(order&&time)time.textContent=`${Math.max(0,order.deadline-q.time).toFixed(1)}s`});document.querySelectorAll("[data-pot]").forEach(button=>{const pot=q.pots[Number(button.dataset.pot)],label=button.querySelector(".pot-state");if(pot&&label&&pot.stage==="blanch")label.textContent=`${pot.timer.toFixed(1)}s`});draw()}
    function renderAll(){renderCampaign();renderTickets();renderKitchen();renderInfo();draw()}
    contractEl.addEventListener("click",event=>{const button=event.target.closest("[data-index]");if(button)begin(Number(button.dataset.index))});$("tickets").addEventListener("click",event=>{const button=event.target.closest("[data-order]");if(button)selectOrder(Number(button.dataset.order))});$("pots").addEventListener("click",event=>{const button=event.target.closest("[data-pot]");if(button)selectPot(Number(button.dataset.pot))});$("ingredients").addEventListener("click",event=>{const button=event.target.closest("[data-ingredient]");if(button)addIngredient(button.dataset.ingredient)});document.querySelectorAll(".cart").forEach(button=>button.addEventListener("click",()=>{if(q.mode==="running"||q.mode==="paused")return;cart=button.dataset.cart;save();q=makeState(selected);renderAll()}));canvas.addEventListener("pointerdown",event=>{const rect=canvas.getBoundingClientRect(),x=(event.clientX-rect.left)*720/rect.width,y=(event.clientY-rect.top)*620/rect.height;if(y>250&&y<410){const index=Math.max(0,Math.min(2,Math.floor((x-45)/210)));selectPot(index)}});addEventListener("keydown",event=>{if(["Digit1","Digit2","Digit3"].includes(event.code))selectPot(Number(event.code.slice(-1))-1);const ingredientKeys={KeyE:"egg",KeyB:"beef",KeyV:"veg",KeyF:"fish",KeyC:"chili",KeyM:"mushroom"};if(ingredientKeys[event.code])addIngredient(ingredientKeys[event.code]);if(event.code==="Space"){event.preventDefault();servePot()}if(event.code==="KeyP")togglePause()});$("start").onclick=()=>begin(selected);$("serve").onclick=servePot;$("discard").onclick=discardPot;$("pause").onclick=togglePause;$("restart").onclick=()=>begin(q.index);
    $("exportSave").onclick=async()=>{const code=encodeProfile();try{await navigator.clipboard.writeText(code);q.message="NOODLE2 灯火账已复制。";renderAll()}catch{prompt("复制灯火账",code)}};$("importSave").onclick=()=>{const code=prompt("粘贴 NOODLE2 灯火账");if(!code)return;try{profile=decodeProfile(code);cart=profile.cart;save();q.message="灯火账已导入。";renderAll()}catch(error){q.message=error.message;renderAll()}};
    renderAll();showOverlay("十二班待开摊","所有订单的到达、耐心、面谱与价值固定不变；失败可以复盘锅位和开火顺序。","","查看首班",()=>begin(0));
    window.__noodleShiftTest={shifts,recipes,ingredients,carts,cookDuration,deadlineFor,referencePlan,validateContent,begin,getState:()=>q,getProfile:()=>profile,encodeProfile,decodeProfile,advance(seconds){advance(seconds)},selectOrder,selectPot,addIngredient,servePot,discardPot,forceFinish(){const ref=referencePlan(q.index,cart);for(const order of q.orders){order.status="served";order.servedAt=ref.plan.find(item=>item.orderId===order.id)?.finish||order.at}q.served=q.orders.length;q.income=ref.income;q.waste=0;q.missed=0;q.mode="running";finishShift()}};
  })();
  </script>
