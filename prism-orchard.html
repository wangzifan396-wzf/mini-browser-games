<!doctype html>
<html lang="zh-CN">

  <title>棱镜果园：十二季光谱委托</title>
  <style>
    :root{--ink:#283630;--muted:#69766f;--paper:#fff;--line:#bcc5bf;--deep:#31423c;--green:#3f8067;--blue:#48799a;--gold:#b88231;--red:#b5555c;--violet:#745f91;--radius:8px;--shadow:0 12px 30px rgba(40,54,48,.14)}
    *{box-sizing:border-box;letter-spacing:0}html,body{margin:0;min-height:100%;color:var(--ink);background:#e8ece7;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}button{font:inherit}.app{width:min(1190px,calc(100vw - 24px));margin:auto;padding:16px 0 30px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:17px 20px;border-bottom:4px solid #d5a34b;color:#fff;background:var(--deep)}h1{margin:0;font-size:28px}.sub{margin:5px 0 0;color:#d0dbd5;font-size:13px}.totals{display:flex;gap:18px;text-align:right}.totals b{display:block;color:#f0cb75;font-size:20px}.totals span{color:#c9d4ce;font-size:10px}.contracts{display:grid;grid-template-columns:repeat(12,minmax(42px,1fr));gap:5px;padding:11px 0}.contract{height:46px;border:1px solid #adb8b1;border-radius:6px;color:#405248;background:#f7f9f6;font-weight:900;cursor:pointer}.contract.active{border-color:var(--green);color:#fff;background:var(--green)}.contract:disabled{opacity:.42}.contract small{display:block;height:11px;color:#f2cc74;font-size:9px}.layout{display:grid;grid-template-columns:minmax(450px,790px) 330px;gap:14px;align-items:start}.orchard{display:grid;grid-template-columns:minmax(360px,640px) minmax(170px,1fr);gap:12px;padding:12px;border:1px solid #91a098;border-radius:var(--radius);background:#192720;box-shadow:var(--shadow)}.board-wrap{position:relative;display:grid;place-items:center;min-width:0}.board-wrap canvas{display:block;width:min(100%,640px);height:auto;aspect-ratio:32/31;border:1px solid #61766a;border-radius:6px;background:#101a15;touch-action:none}.board-hud{position:absolute;inset:8px 8px auto;display:flex;justify-content:space-between;gap:6px;pointer-events:none}.board-hud span{padding:5px 7px;border:1px solid rgba(255,255,255,.2);border-radius:5px;color:#e1ebe4;background:rgba(25,39,32,.88);font-size:10px}.orchard-info{display:flex;flex-direction:column;gap:9px;min-width:0;color:#e9f0eb}.orchard-info h2{margin:0;color:#fff;font-size:19px}.brief{margin:0;color:#b9c6be;font-size:12px;line-height:1.55}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px}.metric{padding:8px;border:1px solid #53675c;border-radius:6px;background:#22332a}.metric b{display:block;color:#75cfaa;font-size:18px}.metric span{color:#aebdb4;font-size:9px}.target-list{display:grid;gap:5px}.target-item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 7px;border:1px solid #50645a;border-radius:5px;color:#c9d5ce;background:#22332a;font-size:10px}.target-item.done{border-color:#4e846b;color:#83d5b1}.spectrum{display:flex;gap:3px}.spectrum i{display:block;width:9px;height:9px;border-radius:50%}.orchard-status{min-height:64px;margin:0;padding:9px;border-left:4px solid var(--gold);color:#d1dbd5;background:#22332a;font-size:11px;line-height:1.55}.side{display:flex;flex-direction:column;gap:10px}.panel{padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}.panel h3{margin:0 0 9px;font-size:14px}.kits{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.kit{min-height:64px;padding:6px;border:1px solid #abb8b0;border-radius:6px;color:#405248;background:#f0f4f0;font-size:9px;font-weight:900;cursor:pointer}.kit b{display:block;font-size:12px}.kit.active{border-color:var(--blue);color:#fff;background:var(--blue)}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.tool{min-height:44px;padding:5px;border:1px solid #9eafa5;border-radius:6px;color:#344b3f;background:#edf2ed;font-size:11px;font-weight:900;cursor:pointer}.tool b{display:block;font-size:15px}.tool.active{border-color:var(--green);color:#fff;background:var(--green)}.tool:disabled{opacity:.42}.commands,.archive{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.commands button,.archive button{min-height:40px;border:1px solid #9eafa5;border-radius:6px;color:#344b3f;background:#edf2ed;font-weight:900;cursor:pointer}.commands .primary{grid-column:1/-1;border-color:var(--green);color:#fff;background:var(--green)}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:14px;background:rgba(14,26,20,.9);text-align:center}.overlay[hidden]{display:none}.overlay-card{width:min(360px,100%);padding:22px;border-radius:var(--radius);color:#fff;background:#30453a;box-shadow:0 24px 60px rgba(0,0,0,.45)}.overlay-card h2{margin:0;font-size:24px}.overlay-card p{color:#d2ddd6;line-height:1.6}.overlay-stars{color:#efc668;font-size:34px}.overlay-card button{min-height:42px;padding:0 20px;border:0;border-radius:6px;color:#29382f;background:#efc668;font-weight:900;cursor:pointer}
    @media(max-width:980px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.side .panel:first-child{grid-column:1/-1}}
    @media(max-width:700px){.app{width:calc(100vw - 12px);padding-top:6px}.head{display:block;padding:13px}.head h1{font-size:22px}.sub{font-size:11px}.totals{justify-content:space-between;margin-top:11px;text-align:left}.contracts{grid-template-columns:repeat(6,1fr)}.contract{height:39px}.orchard{grid-template-columns:minmax(0,1fr);padding:7px}.board-wrap canvas{width:min(100%,620px)}.orchard-info{padding:4px}.side{display:flex}.panel{padding:10px}.tools{grid-template-columns:repeat(4,1fr)}}

<body>
  <main class="app">
    <header class="head"><div><h1>棱镜果园：十二季光谱委托</h1><p class="sub">布置镜片、分光器、棱镜与三色滤镜，让红、绿、蓝光准确抵达每棵果树的光谱需求。</p></div><div class="totals"><div><b id="starTotal">0 / 36</b><span>光谱星章</span></div><div><b id="clearTotal">0 / 12</b><span>完成委托</span></div><div><b id="cleanTotal">0 / 12</b><span>无提示点亮</span></div></div></header>
    <nav class="contracts" id="contracts" aria-label="光谱委托"></nav>
    <section class="layout">
      <section class="orchard">
        <div class="board-wrap"><canvas id="board" width="640" height="620" aria-label="棱镜果园光路棋盘"></canvas><div class="board-hud"><span>光束 <b id="beamCount">0</b></span><span>步数 <b id="moveCount">0</b></span></div><div class="overlay" id="overlay"><div class="overlay-card"><h2 id="overlayTitle"></h2><p id="overlayText"></p><div class="overlay-stars" id="overlayStars"></div><button id="overlayButton">开始</button></div></div></div>
        <div class="orchard-info"><h2 id="contractTitle"></h2><p class="brief" id="contractBrief"></p><div class="metrics"><div class="metric"><b id="litCount">0 / 0</b><span>光谱果树</span></div><div class="metric"><b id="parCount">0 / 0</b><span>操作 / 参考</span></div><div class="metric"><b id="hintCount">0</b><span>提示使用</span></div><div class="metric"><b id="pieceCount">0</b><span>已布器件</span></div></div><div><p class="brief">果树需求</p><div class="target-list" id="targetList"></div></div><p class="orchard-status" id="status"></p></div>
      </section>
      <aside class="side">
        <section class="panel"><h3>选择园艺组</h3><div class="kits"><button class="kit" data-kit="survey"><b>测光组</b>首次提示免费</button><button class="kit" data-kit="prism"><b>分光组</b>额外棱镜分光</button><button class="kit" data-kit="engineer"><b>工程组</b>额外双向镜片</button></div></section>
        <section class="panel"><div class="tools"><button class="tool" data-tool="slash"><b>/</b><span></span></button><button class="tool" data-tool="back"><b>\</b><span></span></button><button class="tool" data-tool="split"><b>Y</b><span></span></button><button class="tool" data-tool="prism"><b>△</b><span></span></button><button class="tool" data-tool="red"><b style="color:#d35d63">R</b><span></span></button><button class="tool" data-tool="green"><b style="color:#4f9b69">G</b><span></span></button><button class="tool" data-tool="blue"><b style="color:#568ac2">B</b><span></span></button><button class="tool" data-tool="remove"><b>×</b><span>拆除</span></button></div><div class="commands"><button class="primary" id="start">开始委托</button><button id="undo">撤回</button><button id="hint">提示</button><button id="clear">清空</button><button id="restart">重开</button></div></section>
        <section class="panel"><div class="archive"><button id="exportSave">导出档案</button><button id="importSave">导入档案</button></div></section>
      </aside>
    </section>
  </main>
  <script>
  (()=>{
    "use strict";
    const SAVE_KEY="prism_orchard_v2",MASK={red:1,green:2,blue:4,white:7},dirs=[[0,-1],[1,0],[0,1],[-1,0]],maskColors={1:"#db6066",2:"#58a973",3:"#e0bf58",4:"#5d91cc",5:"#c477b5",6:"#56b8bd",7:"#fff0bc"},toolNames={slash:"/ 镜",back:"\\ 镜",split:"分光",prism:"棱镜",red:"红滤",green:"绿滤",blue:"蓝滤"},rotations={slash:1,back:1,split:2,prism:2,red:1,green:1,blue:1};
    function mission(title,brief,size,sources,targets,reference,rocks=[]){const inventory={slash:0,back:0,split:0,prism:0,red:0,green:0,blue:0};for(const piece of reference)inventory[piece.type]++;return{title,brief,size,sources,targets,reference,rocks,inventory,par:reference.length+1}}
    const missions=[
      mission("晨露折光","用一枚斜镜把白光折向第一棵晨露树。",[7,6],[{x:0,y:4,dir:1,mask:7}],[{x:4,y:1,mask:7}],[{x:4,y:4,type:"slash",rot:0}],[{x:1,y:1},{x:5,y:3}]),
      mission("高枝横照","让底部灯塔先向上，再沿树冠横向照亮两棵果树。",[8,7],[{x:1,y:6,dir:0,mask:7}],[{x:4,y:2,mask:7},{x:6,y:2,mask:7}],[{x:1,y:2,type:"slash",rot:0}],[{x:3,y:4},{x:5,y:5}]),
      mission("双梢分枝","分光器保留直行光，同时向上复制第二条光路。",[8,7],[{x:0,y:3,dir:1,mask:7}],[{x:7,y:3,mask:7},{x:3,y:0,mask:7}],[{x:3,y:3,type:"split",rot:0}],[{x:5,y:1},{x:1,y:5}]),
      mission("回廊双树","分出左向支路后再折向上方，维持中央白光继续前进。",[9,8],[{x:4,y:7,dir:0,mask:7}],[{x:4,y:0,mask:7},{x:1,y:1,mask:7}],[{x:4,y:4,type:"split",rot:0},{x:1,y:4,type:"back",rot:0}],[{x:2,y:6},{x:7,y:3}]),
      mission("三色初熟","一枚棱镜把白光拆成红、绿、蓝三路，对应三棵果树。",[8,8],[{x:0,y:4,dir:1,mask:7}],[{x:3,y:1,mask:1},{x:7,y:4,mask:2},{x:3,y:7,mask:4}],[{x:3,y:4,type:"prism",rot:0}],[{x:1,y:1},{x:6,y:6}]),
      mission("彩冠三翼","棱镜横向分色，两枚斜镜把红蓝支路同时送上树冠。",[9,8],[{x:4,y:7,dir:0,mask:7}],[{x:1,y:1,mask:1},{x:4,y:1,mask:2},{x:7,y:1,mask:4}],[{x:4,y:5,type:"prism",rot:0},{x:1,y:5,type:"back",rot:0},{x:7,y:5,type:"slash",rot:0}],[{x:2,y:3},{x:6,y:3}]),
      mission("滤光花架","白光分支经过红、绿滤镜，只保留果树需要的颜色。",[9,7],[{x:0,y:4,dir:1,mask:7}],[{x:3,y:0,mask:1},{x:8,y:4,mask:2}],[{x:3,y:4,type:"split",rot:0},{x:3,y:2,type:"red",rot:0},{x:5,y:4,type:"green",rot:0}],[{x:1,y:1},{x:7,y:2}]),
      mission("紫果会光","红光绕过石墙，与底部蓝光在同一棵紫果树会合。",[9,8],[{x:0,y:5,dir:1,mask:1},{x:6,y:7,dir:0,mask:4}],[{x:6,y:2,mask:5}],[{x:2,y:5,type:"slash",rot:0},{x:2,y:2,type:"slash",rot:0}],[{x:3,y:4},{x:4,y:6},{x:7,y:5}]),
      mission("暮蓝长廊","棱镜直送红绿光，蓝光绕过果园下缘再折回高枝。",[9,8],[{x:0,y:4,dir:1,mask:7}],[{x:3,y:1,mask:1},{x:8,y:4,mask:2},{x:8,y:1,mask:4}],[{x:3,y:4,type:"prism",rot:0},{x:3,y:6,type:"back",rot:0},{x:8,y:6,type:"slash",rot:0}],[{x:1,y:1},{x:5,y:5},{x:7,y:3}]),
      mission("白果合流","三座单色灯塔从不同方向汇入同一棵全光谱果树。",[9,8],[{x:0,y:6,dir:1,mask:1},{x:5,y:0,dir:2,mask:2},{x:5,y:7,dir:0,mask:4}],[{x:5,y:3,mask:7}],[{x:2,y:6,type:"slash",rot:0},{x:2,y:3,type:"slash",rot:0}],[{x:3,y:5},{x:6,y:6},{x:7,y:2}]),
      mission("虹桥合冠","三色支路各自照亮途中果树，最终在中央形成完整白光。",[9,8],[{x:5,y:7,dir:0,mask:7}],[{x:1,y:3,mask:1},{x:5,y:3,mask:2},{x:8,y:3,mask:4},{x:5,y:2,mask:7}],[{x:5,y:5,type:"prism",rot:0},{x:1,y:5,type:"back",rot:0},{x:1,y:2,type:"slash",rot:0},{x:8,y:5,type:"slash",rot:0},{x:8,y:2,type:"back",rot:0}],[{x:3,y:6},{x:6,y:6}]),
      mission("丰年光谱","终局同时使用棱镜、分光与双绿滤镜，完成四棵差异果树。",[9,8],[{x:0,y:4,dir:1,mask:7}],[{x:2,y:1,mask:1},{x:8,y:1,mask:4},{x:8,y:4,mask:2},{x:5,y:0,mask:2}],[{x:2,y:4,type:"prism",rot:0},{x:2,y:6,type:"back",rot:0},{x:8,y:6,type:"slash",rot:0},{x:5,y:4,type:"split",rot:0},{x:7,y:4,type:"green",rot:0},{x:5,y:2,type:"green",rot:0}],[{x:1,y:1},{x:3,y:5},{x:6,y:3},{x:7,y:7}])
    ];
    const $=id=>document.getElementById(id),canvas=$("board"),ctx=canvas.getContext("2d"),overlay=$("overlay"),contractEl=$("contracts");let profile=load(),selected=0,kit=profile.kit||"survey",selectedTool="slash",q=null;
    function defaults(){return{version:2,stars:{},best:{},clean:{},kit:"survey",updatedAt:Date.now()}}
    function normalize(value){const clean=defaults();if(!value||value.version!==2)return clean;for(let i=0;i<missions.length;i++){clean.stars[i]=Math.max(0,Math.min(3,Number(value.stars?.[i])||0));if(Number.isFinite(Number(value.best?.[i])))clean.best[i]=Math.max(0,Number(value.best[i]));clean.clean[i]=Boolean(value.clean?.[i])}if(["survey","prism","engineer"].includes(value.kit))clean.kit=value.kit;return clean}
    function load(){try{return normalize(JSON.parse(localStorage.getItem(SAVE_KEY)))}catch{return defaults()}}
    function save(){profile.kit=kit;profile.updatedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(profile));renderCampaign()}
    function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
    function encodeProfile(){const body=btoa(unescape(encodeURIComponent(JSON.stringify(profile))));return`ORCHARD2.${body}.${checksum(body)}`}
    function decodeProfile(code){const part=code.trim().split(".");if(part.length!==3||part[0]!=="ORCHARD2"||checksum(part[1])!==part[2])throw Error("光谱档案校验失败");return normalize(JSON.parse(decodeURIComponent(escape(atob(part[1])))))}
    function key(x,y){return`${x},${y}`}
    function clonePieces(pieces){return new Map([...pieces].map(([id,piece])=>[id,{...piece}]))}
    function makeInventory(item){const inventory={...item.inventory};if(kit==="prism"){inventory.prism++;inventory.split++}if(kit==="engineer"){inventory.slash++;inventory.back++}return inventory}
    function makeState(index=selected,simulation=false){const item=missions[index];return{index,item,simulation,pieces:new Map(),inventory:makeInventory(item),moves:0,hints:0,paidHints:0,history:[],beams:[],lit:new Map(),run:false,ended:false,won:false,message:"选择器件并点击棋盘格布置。"}}
    function inBounds(item,x,y){return x>=0&&y>=0&&x<item.size[0]&&y<item.size[1]}
    function rockAt(item,x,y){return item.rocks.some(rock=>rock.x===x&&rock.y===y)}
    function targetAt(item,x,y){return item.targets.find(target=>target.x===x&&target.y===y)}
    function sourceAt(item,x,y){return item.sources.find(source=>source.x===x&&source.y===y)}
    function reflect(dir,type){return type==="slash"?[1,0,3,2][dir]:[3,2,1,0][dir]}
    function traceLight(state){const item=state.item,queue=item.sources.map(source=>({...source})),beams=[],lit=new Map(),seen=new Set();let guard=0;while(queue.length&&guard++<700){const ray=queue.shift();let{x,y,dir,mask}=ray;for(let step=0;step<60;step++){const [dx,dy]=dirs[dir],nx=x+dx,ny=y+dy;beams.push({x1:x,y1:y,x2:nx,y2:ny,mask});x=nx;y=ny;if(!inBounds(item,x,y)||rockAt(item,x,y))break;const visit=`${x},${y},${dir},${mask}`;if(seen.has(visit))break;seen.add(visit);const target=targetAt(item,x,y);if(target)lit.set(key(x,y),(lit.get(key(x,y))||0)|mask);const piece=state.pieces.get(key(x,y));if(!piece)continue;if(piece.type==="slash"||piece.type==="back"){dir=reflect(dir,piece.type);continue}if(["red","green","blue"].includes(piece.type)){mask&=MASK[piece.type];if(!mask)break;continue}if(piece.type==="split"){const branch=(dir+(piece.rot?1:3))%4;queue.push({x,y,dir,mask});queue.push({x,y,dir:branch,mask});break}if(piece.type==="prism"){const left=(dir+3)%4,right=(dir+1)%4;if(mask&1)queue.push({x,y,dir:piece.rot?right:left,mask:1});if(mask&2)queue.push({x,y,dir,mask:2});if(mask&4)queue.push({x,y,dir:piece.rot?left:right,mask:4});break}}}state.beams=beams;state.lit=lit;state.won=item.targets.every(target=>((lit.get(key(target.x,target.y))||0)&target.mask)===target.mask);return{won:state.won,beams:beams.length,lit:[...lit.values()].filter(Boolean).length}}
    function referenceState(index){const state=makeState(index,true);for(const piece of state.item.reference)state.pieces.set(key(piece.x,piece.y),{...piece});const result=traceLight(state);return{...result,pieces:state.pieces.size,targets:state.item.targets.length}}
    function validateContent(){if(missions.length!==12)throw Error("光谱委托数量错误");let targets=0,referencePieces=0,referenceWins=0;const signatures=new Set();for(let i=0;i<missions.length;i++){const item=missions[i],signature=`${item.size}|${item.sources.map(s=>`${s.x}:${s.y}:${s.dir}:${s.mask}`).join(";")}|${item.targets.map(t=>`${t.x}:${t.y}:${t.mask}`).join(";")}|${item.reference.map(p=>`${p.x}:${p.y}:${p.type}:${p.rot}`).join(";")}`;if(signatures.has(signature))throw Error(`第 ${i+1} 份委托重复`);signatures.add(signature);for(const piece of item.reference){if(!inBounds(item,piece.x,piece.y)||rockAt(item,piece.x,piece.y)||targetAt(item,piece.x,piece.y)||sourceAt(item,piece.x,piece.y))throw Error(`第 ${i+1} 份参考器件位置非法`)}targets+=item.targets.length;referencePieces+=item.reference.length;const result=referenceState(i);if(!result.won||result.pieces!==item.reference.length||result.targets!==item.targets.length)throw Error(`第 ${i+1} 份参考布镜未通过`);referenceWins++}return{missions:12,kits:3,targets,referencePieces,referenceWins,uniqueMissions:signatures.size}}
    function snapshot(state){state.history.push({pieces:clonePieces(state.pieces),inventory:{...state.inventory},moves:state.moves});if(state.history.length>60)state.history.shift()}
    function finishIfSolved(state){if(!state.run||state.ended||!state.won)return;state.ended=true;state.run=false;const stars=1+(state.moves<=state.item.par?1:0)+(state.moves<=state.item.par&&state.paidHints===0?1:0);profile.stars[state.index]=Math.max(Number(profile.stars[state.index])||0,stars);profile.best[state.index]=Math.min(Number(profile.best[state.index])||Infinity,state.moves);profile.clean[state.index]=profile.clean[state.index]||state.paidHints===0;save();renderAll();showOverlay("光谱验收通过",`用 ${state.moves} 步点亮 ${state.item.targets.length} 棵果树，提示 ${state.hints} 次。`,"★".repeat(stars)+"☆".repeat(3-stars),state.index<11?"下一份委托":"返回委托簿",()=>{const next=state.index<11?state.index+1:state.index;selected=next;begin(next)})}
    function applyCell(state,x,y){if(!state.run||state.ended||!inBounds(state.item,x,y)||rockAt(state.item,x,y)||targetAt(state.item,x,y)||sourceAt(state.item,x,y))return false;const id=key(x,y),current=state.pieces.get(id);snapshot(state);if(selectedTool==="remove"){if(!current){state.history.pop();return false}state.inventory[current.type]++;state.pieces.delete(id)}else if(current){if(current.type===selectedTool&&rotations[current.type]>1)current.rot=(current.rot+1)%rotations[current.type];else if(current.type!==selectedTool&&state.inventory[selectedTool]>0){state.inventory[current.type]++;state.inventory[selectedTool]--;state.pieces.set(id,{type:selectedTool,rot:0})}else{state.history.pop();return false}}else if(state.inventory[selectedTool]>0){state.inventory[selectedTool]--;state.pieces.set(id,{type:selectedTool,rot:0})}else{state.history.pop();return false}state.moves++;traceLight(state);state.message="光路已重新计算。";renderAll();finishIfSolved(state);return true}
    function undoState(state){if(!state.run||state.ended||!state.history.length)return false;const previous=state.history.pop();state.pieces=clonePieces(previous.pieces);state.inventory={...previous.inventory};state.moves=previous.moves;traceLight(state);state.message="已撤回最近一次布镜。";renderAll();return true}
    function hintState(state){if(!state.run||state.ended)return false;const expected=state.item.reference.find(piece=>{const current=state.pieces.get(key(piece.x,piece.y));return!current||current.type!==piece.type||current.rot!==piece.rot});if(!expected){state.message="参考光路已经完整。";renderAll();return false}snapshot(state);const id=key(expected.x,expected.y),current=state.pieces.get(id);if(current)state.inventory[current.type]++;if(state.inventory[expected.type]>0)state.inventory[expected.type]--;state.pieces.set(id,{...expected});state.moves++;state.hints++;if(!(kit==="survey"&&state.hints===1))state.paidHints++;traceLight(state);state.message=`提示已定位 ${toolNames[expected.type]} 的下一处参考位置。`;renderAll();finishIfSolved(state);return true}
    function clearState(state){if(!state.run||state.ended||!state.pieces.size)return false;snapshot(state);for(const piece of state.pieces.values())state.inventory[piece.type]++;state.pieces.clear();state.moves++;traceLight(state);state.message="可移动器件已全部收回。";renderAll();return true}
    function unlocked(index){return index===0||Number(profile.stars[index-1])>0}
    function begin(index=selected){if(!unlocked(index))return;selected=index;q=makeState(index);traceLight(q);renderAll();showOverlay("委托简报",`${q.item.title}：${q.item.sources.length} 座灯塔、${q.item.targets.length} 棵光谱果树、${q.item.reference.length} 枚参考器件。`,"","进入果园",()=>{q.run=true;hideOverlay();q.message="光束实时更新；果树外圈表示所需的红、绿、蓝通道。";renderAll()})}
    function setStatus(text){if(q)q.message=text;$("status").textContent=text}
    function showOverlay(title,text,stars,label,handler){$("overlayTitle").textContent=title;$("overlayText").textContent=text;$("overlayStars").textContent=stars;$("overlayButton").textContent=label;$("overlayButton").onclick=handler;overlay.hidden=false}
    function hideOverlay(){overlay.hidden=true}
    function renderCampaign(){contractEl.innerHTML=missions.map((item,index)=>`<button class="contract ${index===selected?"active":""}" data-index="${index}" ${unlocked(index)?"":"disabled"}>${String(index+1).padStart(2,"0")}<small>${"★".repeat(Number(profile.stars[index])||0)}</small></button>`).join("");$("starTotal").textContent=`${Object.values(profile.stars).reduce((a,b)=>a+Number(b||0),0)} / 36`;$("clearTotal").textContent=`${Object.values(profile.stars).filter(Boolean).length} / 12`;$("cleanTotal").textContent=`${Object.values(profile.clean).filter(Boolean).length} / 12`;document.querySelectorAll(".kit").forEach(button=>button.classList.toggle("active",button.dataset.kit===kit))}
    function spectrum(mask){return`<span class="spectrum">${[1,2,4].filter(bit=>mask&bit).map(bit=>`<i style="background:${maskColors[bit]}"></i>`).join("")}</span>`}
    function renderInfo(){if(!q)return;const item=q.item,litTargets=item.targets.filter(target=>((q.lit.get(key(target.x,target.y))||0)&target.mask)===target.mask).length;$("contractTitle").textContent=`${String(q.index+1).padStart(2,"0")} · ${item.title}`;$("contractBrief").textContent=item.brief;$("beamCount").textContent=q.beams.length;$("moveCount").textContent=q.moves;$("litCount").textContent=`${litTargets} / ${item.targets.length}`;$("parCount").textContent=`${q.moves} / ${item.par}`;$("hintCount").textContent=q.hints;$("pieceCount").textContent=q.pieces.size;$("targetList").innerHTML=item.targets.map((target,index)=>{const lit=((q.lit.get(key(target.x,target.y))||0)&target.mask)===target.mask;return`<div class="target-item ${lit?"done":""}"><span>${String(index+1).padStart(2,"0")} · (${target.x+1}, ${target.y+1})</span>${spectrum(target.mask)}</div>`}).join("");$("status").textContent=q.message;document.querySelectorAll(".tool").forEach(button=>{const type=button.dataset.tool;button.classList.toggle("active",type===selectedTool);if(type!=="remove"){button.querySelector("span").textContent=q.inventory[type];button.disabled=q.inventory[type]<=0&&!q.pieces.size}})}
    function boardMetrics(){const [cols,rows]=q.item.size,size=Math.floor(Math.min((640-24)/cols,(620-70)/rows));return{size,x:Math.floor((640-cols*size)/2),y:Math.floor((620-rows*size)/2)+18}}
    function drawBeam(beam,m){const x1=m.x+(beam.x1+.5)*m.size,y1=m.y+(beam.y1+.5)*m.size,x2=m.x+(beam.x2+.5)*m.size,y2=m.y+(beam.y2+.5)*m.size;ctx.strokeStyle=maskColors[beam.mask]||maskColors[7];ctx.globalAlpha=.28;ctx.lineWidth=Math.max(8,m.size*.15);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.globalAlpha=.92;ctx.lineWidth=Math.max(2,m.size*.045);ctx.stroke();ctx.globalAlpha=1}
    function drawPiece(piece,x,y,size){ctx.fillStyle="#f7f4df";ctx.fillRect(x+size*.18,y+size*.18,size*.64,size*.64);ctx.strokeStyle="#65766d";ctx.strokeRect(x+size*.18,y+size*.18,size*.64,size*.64);ctx.lineWidth=Math.max(3,size*.07);ctx.lineCap="round";ctx.strokeStyle=piece.type==="prism"?"#785e94":piece.type==="split"?"#a1743d":maskColors[MASK[piece.type]]||"#3f8067";ctx.beginPath();if(piece.type==="slash"){ctx.moveTo(x+size*.3,y+size*.7);ctx.lineTo(x+size*.7,y+size*.3)}else if(piece.type==="back"){ctx.moveTo(x+size*.3,y+size*.3);ctx.lineTo(x+size*.7,y+size*.7)}else if(piece.type==="split"){ctx.moveTo(x+size*.5,y+size*.72);ctx.lineTo(x+size*.5,y+size*.45);ctx.lineTo(x+(piece.rot?.7:.3)*size,y+size*.28)}else if(piece.type==="prism"){ctx.moveTo(x+size*.5,y+size*.25);ctx.lineTo(x+size*.72,y+size*.7);ctx.lineTo(x+size*.28,y+size*.7);ctx.closePath()}else{ctx.moveTo(x+size*.3,y+size*.5);ctx.lineTo(x+size*.7,y+size*.5)}ctx.stroke()}
    function draw(){if(!q)return;ctx.fillStyle="#15231c";ctx.fillRect(0,0,640,620);const m=boardMetrics(),[cols,rows]=q.item.size;ctx.fillStyle="#25382e";ctx.fillRect(m.x-8,m.y-8,cols*m.size+16,rows*m.size+16);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const px=m.x+x*m.size,py=m.y+y*m.size;ctx.fillStyle=(x+y)%2?"#eef0df":"#f7f3df";ctx.fillRect(px,py,m.size-1,m.size-1);ctx.fillStyle="rgba(58,112,82,.06)";ctx.fillRect(px+4,py+4,m.size-9,m.size-9);if(rockAt(q.item,x,y)){ctx.fillStyle="#66716c";ctx.fillRect(px+m.size*.18,py+m.size*.2,m.size*.64,m.size*.6)}}for(const beam of q.beams)drawBeam(beam,m);for(const source of q.item.sources){const px=m.x+(source.x+.5)*m.size,py=m.y+(source.y+.5)*m.size;ctx.fillStyle=maskColors[source.mask];ctx.beginPath();ctx.arc(px,py,m.size*.22,0,Math.PI*2);ctx.fill();ctx.fillStyle="#27352e";ctx.font=`900 ${Math.max(10,m.size*.2)}px system-ui`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("灯",px,py)}for(const target of q.item.targets){const px=m.x+(target.x+.5)*m.size,py=m.y+(target.y+.5)*m.size,lit=((q.lit.get(key(target.x,target.y))||0)&target.mask)===target.mask;ctx.fillStyle=lit?"#6aa466":"#69835e";ctx.beginPath();ctx.arc(px,py,m.size*.23,0,Math.PI*2);ctx.fill();let angle=-Math.PI/2;for(const bit of [1,2,4])if(target.mask&bit){ctx.strokeStyle=maskColors[bit];ctx.lineWidth=4;ctx.beginPath();ctx.arc(px,py,m.size*.31,angle,angle+Math.PI*2/[1,2,4].filter(b=>target.mask&b).length-.08);ctx.stroke();angle+=Math.PI*2/[1,2,4].filter(b=>target.mask&b).length}}for(const [id,piece] of q.pieces){const [x,y]=id.split(",").map(Number);drawPiece(piece,m.x+x*m.size,m.y+y*m.size,m.size)}}
    function renderAll(){renderCampaign();renderInfo();draw()}
    function pointerCell(event){const rect=canvas.getBoundingClientRect(),m=boardMetrics(),x=(event.clientX-rect.left)*640/rect.width,y=(event.clientY-rect.top)*620/rect.height;return{x:Math.floor((x-m.x)/m.size),y:Math.floor((y-m.y)/m.size)}}
    contractEl.addEventListener("click",event=>{const button=event.target.closest("[data-index]");if(button){selected=Number(button.dataset.index);begin(selected)}});document.querySelectorAll(".kit").forEach(button=>button.addEventListener("click",()=>{if(q?.run)return;kit=button.dataset.kit;save();q=makeState(selected);traceLight(q);renderAll()}));document.querySelectorAll(".tool").forEach(button=>button.addEventListener("click",()=>{selectedTool=button.dataset.tool;renderAll()}));canvas.addEventListener("pointerdown",event=>{event.preventDefault();const cell=pointerCell(event);applyCell(q,cell.x,cell.y)});addEventListener("keydown",event=>{const map={Digit1:"slash",Digit2:"back",Digit3:"split",Digit4:"prism",KeyR:"red",KeyG:"green",KeyB:"blue",KeyX:"remove"};if(map[event.code]){selectedTool=map[event.code];renderAll()}if(event.code==="KeyZ")undoState(q)});$("start").onclick=()=>begin(selected);$("restart").onclick=()=>begin(q?.index??selected);$("undo").onclick=()=>undoState(q);$("hint").onclick=()=>hintState(q);$("clear").onclick=()=>clearState(q);
    $("exportSave").onclick=async()=>{const code=encodeProfile();try{await navigator.clipboard.writeText(code);setStatus("光谱档案已复制。") }catch{prompt("复制光谱档案",code)}};$("importSave").onclick=()=>{const code=prompt("粘贴 ORCHARD2 光谱档案");if(!code)return;try{profile=decodeProfile(code);kit=profile.kit;save();setStatus("光谱档案已导入。");begin(selected)}catch(error){setStatus(error.message)}};
    q=makeState(0);traceLight(q);renderAll();showOverlay("果园待命","每棵果树外圈显示需要的光谱。光束实时演算，循环光路会被安全截断。","","查看委托",()=>begin(selected));
    window.__prismOrchardTest={missions,makeState,traceLight,referenceState,validateContent,begin,getState:()=>q,getProfile:()=>profile,encodeProfile,decodeProfile,applyCell,undoState,hintState,setTool(type){selectedTool=type;renderAll()},forceFinish(){if(!q)return;q.pieces=new Map(q.item.reference.map(piece=>[key(piece.x,piece.y),{...piece}]));q.moves=q.item.reference.length;q.hints=0;q.paidHints=0;q.run=true;traceLight(q);finishIfSolved(q)}};
  })();
