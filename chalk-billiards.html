  <style>

    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(135deg,#0c1824,#1d4243 50%,#3c3747);background-size:30px 30px,30px 30px,auto}button,textarea{font:inherit}.app{width:min(1480px,calc(100vw - 24px));margin:12px auto 20px}.topbar,.stage,.side{border:1px solid var(--line);border-radius:var(--radius);background:rgba(255,253,243,.97);box-shadow:0 16px 38px var(--shadow)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 19px}.eyebrow{margin:0 0 5px;color:#896318;font-size:11px;font-weight:900}.title{margin:0;font-size:clamp(26px,3.5vw,42px);line-height:1;letter-spacing:0}.actions,.button-row{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:42px;padding:0 14px;border:1px solid #2a5b55;border-radius:var(--radius);color:#fff;background:var(--teal);font-weight:900;cursor:pointer}.btn.secondary{color:var(--ink);border-color:#987326;background:#f0ce6d}.btn.ghost{color:var(--ink);border-color:#879991;background:#f5f3e6}.btn:disabled{opacity:.45;cursor:not-allowed}.layout{display:grid;grid-template-columns:minmax(0,1fr) 366px;gap:12px;margin-top:12px;align-items:start}.stage{position:relative;min-height:650px;overflow:hidden;background:#111e29}.stage canvas{display:block;width:100%;height:min(73vh,700px);min-height:650px;touch-action:none}.canvas-hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.hud-box{min-width:165px;padding:8px 10px;border:1px solid rgba(172,202,192,.72);border-radius:var(--radius);color:#fff;background:rgba(11,28,34,.85);backdrop-filter:blur(5px)}.hud-box.right{text-align:right}.hud-box b{display:block;font-size:18px}.hud-box small{color:#c4d5d0}.power-panel{position:absolute;left:50%;bottom:11px;width:min(430px,calc(100% - 170px));padding:8px 11px;border:1px solid rgba(151,177,167,.8);border-radius:var(--radius);color:#fff;background:rgba(12,31,37,.88);transform:translateX(-50%);pointer-events:none}.power-line{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:900}.bar{height:8px;margin-top:5px;border:1px solid #648079;border-radius:8px;overflow:hidden;background:#152d34}.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,#4ec6a4,#f0ce6d,#d56059)}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:22px;background:rgba(9,24,29,.68);backdrop-filter:blur(4px)}.overlay.hidden{display:none}.modal{width:min(550px,100%);max-height:calc(100% - 14px);overflow:auto;padding:21px;border:1px solid #9baaa0;border-radius:var(--radius);background:var(--paper);box-shadow:0 23px 56px rgba(0,0,0,.42)}.modal h2{margin:0 0 8px;font-size:29px}.modal p{margin:7px 0;color:var(--muted);line-height:1.62}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:15px 0}.result-grid div{padding:9px;border:1px solid #a3afa7;border-radius:var(--radius);background:#f5f2e3;text-align:center}.result-grid b{display:block;color:#896318;font-size:22px}.side{padding:13px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}.section-title h2{margin:0;font-size:16px}.section-title span{color:#896318;font-size:12px;font-weight:900}.missions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mission{min-height:62px;padding:7px;border:1px solid #9aa8a3;border-radius:var(--radius);color:var(--ink);background:#f6f5e9;text-align:left;cursor:pointer}.mission.active{border-color:#997219;background:#fff0b8}.mission:disabled{opacity:.42}.mission b,.mission small{display:block}.mission b{font-size:11px}.mission small{margin-top:4px;color:var(--muted);font-size:10px}.brief{margin:10px 0 12px;padding:10px;border-left:3px solid var(--teal);background:#edf1e7}.brief b{display:block}.brief p{margin:4px 0;color:var(--muted);font-size:12px;line-height:1.55}.goals{display:grid;gap:5px;margin-top:8px}.goal-row{display:flex;justify-content:space-between;gap:8px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:11px}.stat{padding:8px 4px;border:1px solid #a2ada6;border-radius:var(--radius);background:#f6f5e9;text-align:center}.stat b,.stat small{display:block}.stat b{color:var(--teal);font-size:18px}.stat small{color:var(--muted);font-size:10px}.cues{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.cue{min-height:58px;padding:7px;border:1px solid #99a8a2;border-radius:var(--radius);color:var(--ink);background:#f6f5e9;cursor:pointer}.cue.active{border-color:var(--teal);background:#e0eee8}.cue b,.cue small{display:block}.cue small{margin-top:3px;color:var(--muted);font-size:10px}.chalks{display:grid;grid-template-columns:1fr 1fr;gap:6px}.chalk{min-height:53px;padding:7px;border:1px solid #99a8a2;border-radius:var(--radius);color:var(--ink);background:#f6f5e9;text-align:left;cursor:pointer}.chalk.active{border-color:#9d761c;background:#fff0b8}.chalk:disabled{opacity:.42}.chalk b,.chalk small{display:block}.chalk small{margin-top:3px;color:var(--muted);font-size:10px}.divider{height:1px;margin:12px 0;background:#bdc7c0}.tip{margin:9px 0 0;color:var(--muted);font-size:11px;line-height:1.55}.archive{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:rgba(7,19,23,.83)}.archive.hidden{display:none}.archive textarea{width:100%;height:110px;margin:9px 0;padding:9px;border:1px solid #879991;border-radius:var(--radius);color:var(--ink);background:#f7f5e8;resize:vertical}.feedback{min-height:20px;color:#896318;font-size:12px}.hidden{display:none!important}@media(max-width:980px){.layout{grid-template-columns:1fr}.stage,.stage canvas{min-height:590px}.stage canvas{height:67vh}.side{display:grid;grid-template-columns:1fr 1fr;gap:12px}.side-section.full,.side>.button-row,.side> <body>
  <main class="app">
    <header class="topbar"><div><p class="eyebrow">PHYSICS CUE CAMPAIGN</p><h1 class="title">粉笔台球：九桌杆法赛</h1></div><div class="actions"><button class="btn ghost" id="resetDrillBtn" disabled>重摆本球</button><button class="btn" id="archiveBtn">档案</button></div></header>
    <section class="layout">
      <div class="stage"><canvas id="gameCanvas" aria-label="粉笔台球杆法挑战球桌"></canvas><div class="canvas-hud"><div class="hud-box"><b id="hudMission">球房待命</b><small>球型 <span id="drillText">0 / 3</span> · 杆数 <span id="shotText">0</span></small></div><div class="hud-box right"><b id="scoreText">0</b><small>力度印记 <span id="markText">0 / 3</span></small></div></div><div class="power-panel"><div class="power-line"><span id="powerLabel">拖拽白球反向蓄力</span><span id="powerText">0%</span></div><div class="bar"><i id="powerBar"></i></div></div><div class="overlay" id="overlay"><div class="modal" id="overlayCard"></div></div></div>
      <aside class="side">
        <section class="side-section full"><div class="section-title"><h2>三馆九桌</h2><span id="campaignStars">0 / 27 星</span></div><div class="missions" id="missions"></div><div class="brief"><b id="missionTitle"></b><p id="missionBrief"></p><div class="goals" id="goals"></div></div></section>
        <section class="side-section full"><div class="stats"><div class="stat"><b id="clearText">0</b><small>完赛</small></div><div class="stat"><b id="medalText">0</b><small>徽章</small></div><div class="stat"><b id="recordText">0</b><small>最佳杆</small></div><div class="stat"><b id="physicsText">27</b><small>固定球型</small></div></div></section>
        <div class="divider"></div>
        <section class="side-section"><div class="section-title"><h2>球杆框架</h2><span>全部可用</span></div><div class="cues" id="cues"></div></section>
        <div class="divider"></div>
        <section class="side-section"><div class="section-title"><h2>双槽巧粉</h2><span id="slotText">0 / 2</span></div><div class="chalks" id="chalks"></div></section>
        <div class="divider"></div>
        <div class="button-row"><button class="btn" id="startBtn">进入球桌</button><button class="btn secondary" id="referenceBtn">参考球路</button></div>
        <p class="tip">在白球附近按下并向后拖拽，松手出杆。每桌连续完成三个固定球型；目标球必须进入发光袋口，力度落在标记区且无白球/干扰球落袋，才获得第三星。</p>
      </aside>
    </section>
  </main>
  <div class="archive hidden" id="archive"><div class="modal"><h2>杆法赛档案</h2><p>档案码保存桌次星级、最佳杆数、球杆、巧粉与徽章，可跨设备恢复。</p><textarea id="archiveText" aria-label="杆法赛档案码"></textarea><div class="feedback" id="feedback"></div><div class="button-row"><button class="btn" id="copyBtn">生成并复制</button><button class="btn ghost" id="importBtn">导入</button><button class="btn ghost" id="closeBtn">关闭</button></div></div></div>
  <script>
  (()=>{
    const $=id=>document.getElementById(id),canvas=$("gameCanvas"),ctx=canvas.getContext("2d"),TW=900,TH=500,R=15,STORAGE="mini_chalk_billiards_v2",POCKETS=[{x:30,y:30},{x:450,y:22},{x:870,y:30},{x:30,y:470},{x:450,y:478},{x:870,y:470}],INWARD=[[1,1],[0,1],[-1,1],[1,-1],[0,-1],[-1,-1]].map(([x,y])=>{const n=Math.hypot(x,y);return{x:x/n,y:y/n}});
    const CUES={fine:{name:"细线杆",tag:"长引导",force:.94,guide:520,color:"#e4c477"},balance:{name:"平衡杆",tag:"标准手感",force:1,guide:430,color:"#79b6a3"},hammer:{name:"重芯杆",tag:"强劲短线",force:1.1,guide:340,color:"#d98261"}};
    const CHALKS={line:{name:"长线粉",text:"瞄准线 +120",unlock:0},trace:{name:"轨迹粉",text:"显示目标球路",unlock:0},soft:{name:"柔触粉",text:"出力 -8%",unlock:3},hard:{name:"硬触粉",text:"出力 +8%",unlock:7},guard:{name:"防污粉",text:"首次犯规不扣印记",unlock:13},score:{name:"金章粉",text:"得分 +20%",unlock:20}};
    function drill(pocket,depth,behind,offset,power,band,decoys=[]){const p=POCKETS[pocket],i=INWARD[pocket],perp={x:-i.y,y:i.x},target={x:p.x+i.x*depth,y:p.y+i.y*depth},ghost={x:target.x+i.x*(R*2+1),y:target.y+i.y*(R*2+1)},cue={x:ghost.x+i.x*behind+perp.x*offset,y:ghost.y+i.y*behind+perp.y*offset};return{pocket,target:{x:+target.x.toFixed(2),y:+target.y.toFixed(2)},cue:{x:+cue.x.toFixed(2),y:+cue.y.toFixed(2)},aim:{x:+ghost.x.toFixed(2),y:+ghost.y.toFixed(2)},power,band,decoys}}
    const D=(p,d,b,o,power,band,decoys)=>drill(p,d,b,o,power,band,decoys);
    const MISSIONS=[
      {id:"chalk-line",name:"粉线初试",room:"晨光球房",brief:"三颗直线目标依次送入上方袋口，熟悉反向拖杆。",par:3,limit:6,drills:[D(0,145,165,0,.58,[.48,.68]),D(1,145,185,0,.57,[.47,.67]),D(2,145,165,0,.58,[.48,.68])]},
      {id:"lower-corners",name:"下袋巡礼",room:"晨光球房",brief:"转向下半桌，保持中等力度完成三个底袋球型。",par:3,limit:6,drills:[D(3,150,170,0,.59,[.49,.69]),D(4,140,190,0,.57,[.47,.67]),D(5,150,170,0,.59,[.49,.69])]},
      {id:"first-cut",name:"浅角切球",room:"晨光球房",brief:"白球离开目标轴线，沿幽灵球位置完成第一组切球。",par:3,limit:7,drills:[D(0,150,175,28,.62,[.52,.72]),D(2,150,175,-28,.62,[.52,.72]),D(4,145,185,34,.61,[.51,.71])]},
      {id:"cross-table",name:"横桌远征",room:"青岩会馆",brief:"加长白球行程，在速度衰减前保持足够入袋动量。",par:3,limit:7,drills:[D(1,125,255,-25,.72,[.62,.82]),D(3,135,235,30,.72,[.62,.82]),D(5,135,235,-30,.72,[.62,.82])]},
      {id:"traffic-gap",name:"障碍间隙",room:"青岩会馆",brief:"干扰球守在非目标区域，进错球会失去力度印记。",par:3,limit:7,drills:[D(0,145,180,38,.65,[.55,.75],[{x:690,y:365}]),D(2,145,180,-38,.65,[.55,.75],[{x:210,y:365}]),D(4,135,205,42,.66,[.56,.76],[{x:700,y:130}])]},
      {id:"three-colors",name:"三色礼球",room:"青岩会馆",brief:"每个球型加入两颗干扰球，只认编号 1 的目标球。",par:3,limit:8,drills:[D(3,145,195,45,.68,[.58,.78],[{x:660,y:115},{x:745,y:185}]),D(1,135,225,-42,.69,[.59,.79],[{x:165,y:390},{x:735,y:390}]),D(5,145,195,-45,.68,[.58,.78],[{x:155,y:180},{x:245,y:115}])]},
      {id:"deep-cut",name:"深角切线",room:"暮金俱乐部",brief:"更大的侧向偏移压缩容错，瞄准幽灵球而非目标球心。",par:3,limit:8,drills:[D(0,145,180,58,.72,[.62,.82]),D(2,145,180,-58,.72,[.62,.82]),D(4,135,205,62,.73,[.63,.83])]},
      {id:"long-power",name:"长台强攻",room:"暮金俱乐部",brief:"三次长台都要求强力区间，过轻会在袋口前停下。",par:3,limit:8,drills:[D(1,115,285,35,.82,[.74,.9]),D(3,125,265,48,.81,[.73,.89]),D(5,125,265,-48,.81,[.73,.89])]},
      {id:"final-signature",name:"终场签名",room:"暮金俱乐部",brief:"长台、深切与干扰球同时出现，完成九桌最后签名。",par:3,limit:9,drills:[D(0,130,235,66,.8,[.72,.88],[{x:690,y:390}]),D(2,130,235,-66,.8,[.72,.88],[{x:205,y:390}]),D(4,120,265,70,.83,[.75,.91],[{x:165,y:120},{x:735,y:120}])]}
    ];
    const MEDALS=[{id:"first",name:"第一记粉线",test:r=>r.success},{id:"clean",name:"无污球局",test:r=>r.success&&r.fouls===0},{id:"three",name:"三杆清桌",test:r=>r.success&&r.shots===3},{id:"morning",name:"晨光全星",test:()=>profile.stars.slice(0,3).every(v=>v===3)},{id:"veteran",name:"十八星球手",test:()=>sumStars()>=18},{id:"master",name:"九桌大师",test:()=>profile.stars.every(v=>v===3)}];
    function blankProfile(){return{v:2,unlocked:0,stars:Array(9).fill(0),best:Array(9).fill(0),cue:"balance",chalks:["line"],clears:0,medals:[]}}
    function normalize(p){const cue=CUES[p?.cue]?p.cue:"balance",chalks=[...new Set(Array.isArray(p?.chalks)?p.chalks:[])].filter(id=>CHALKS[id]).slice(0,2);return{v:2,unlocked:Math.max(0,Math.min(8,+p?.unlocked||0)),stars:Array.from({length:9},(_,i)=>Math.max(0,Math.min(3,+p?.stars?.[i]||0))),best:Array.from({length:9},(_,i)=>Math.max(0,+p?.best?.[i]||0)),cue,chalks,clears:Math.max(0,+p?.clears||0),medals:[...new Set(Array.isArray(p?.medals)?p.medals:[])].filter(id=>MEDALS.some(m=>m.id===id))}}
    function load(){try{const p=JSON.parse(localStorage.getItem(STORAGE)||"null");return p?.v===2?normalize(p):blankProfile()}catch{return blankProfile()}}
    let profile=load(),missionIndex=Math.min(profile.unlocked,8),state=null,w=900,h=680,dpr=1,last=performance.now();
    function sumStars(){return profile.stars.reduce((a,b)=>a+b,0)}function save(){localStorage.setItem(STORAGE,JSON.stringify(profile))}
    function ball(x,y,color,num,cue=false,target=false){return{x,y,vx:0,vy:0,r:R,color,num,cue,target,pocketed:false,pocket:-1,railHits:0,flash:0}}
    function ballsFor(dr){const balls=[ball(dr.cue.x,dr.cue.y,"#fffdf4",0,true,false),ball(dr.target.x,dr.target.y,"#f0cf70",1,false,true)];dr.decoys.forEach((p,i)=>balls.push(ball(p.x,p.y,["#bd5148","#326f91","#7b5bb4"][i%3],i+7)));return balls}
    function rules(){const set=new Set(profile.chalks),cue=CUES[profile.cue];return{force:cue.force*(set.has("soft")?.92:1)*(set.has("hard")?1.08:1),guide:cue.guide+(set.has("line")?120:0),trace:set.has("trace"),guard:set.has("guard"),score:set.has("score")?1.2:1,color:cue.color}}
    function makeRun(index,options={}){const s={mode:"menu",mission:index,drillIndex:0,shots:0,marks:0,score:0,fouls:0,forgiven:false,balls:[],aim:null,inShot:false,shotTime:0,physicsAccumulator:0,lastPower:0,message:"",messageTimer:0,rules:options.reference?{force:1,guide:430,trace:true,guard:false,score:1,color:CUES.balance.color}:rules()};loadDrill(s,0);return s}
    function loadDrill(s,index){s.drillIndex=index;s.balls=ballsFor(MISSIONS[s.mission].drills[index]);s.aim=null;s.inShot=false;s.shotTime=0;s.targetPocket=-1;s.shotFoul=false}
    function allStill(s){return s.balls.every(b=>b.pocketed||Math.hypot(b.vx,b.vy)<1)}
    function rail(b){let hit=false;if(b.x<b.r+28){b.x=b.r+28;b.vx=Math.abs(b.vx)*.9;hit=true}if(b.x>TW-b.r-28){b.x=TW-b.r-28;b.vx=-Math.abs(b.vx)*.9;hit=true}if(b.y<b.r+28){b.y=b.r+28;b.vy=Math.abs(b.vy)*.9;hit=true}if(b.y>TH-b.r-28){b.y=TH-b.r-28;b.vy=-Math.abs(b.vy)*.9;hit=true}if(hit)b.railHits++}
    function collide(a,b){if(a.pocketed||b.pocketed)return;const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),min=a.r+b.r;if(dist>=min||dist===0)return;const nx=dx/dist,ny=dy/dist,over=(min-dist)/2;a.x-=nx*over;a.y-=ny*over;b.x+=nx*over;b.y+=ny*over;const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){a.vx+=rel*nx;a.vy+=rel*ny;b.vx-=rel*nx;b.vy-=rel*ny;a.flash=b.flash=.15}}
    function detectPockets(s){for(const b of s.balls){if(b.pocketed)continue;for(let i=0;i<POCKETS.length;i++){const p=POCKETS[i];if(Math.hypot(b.x-p.x,b.y-p.y)<34){b.pocketed=true;b.pocket=i;b.vx=b.vy=0;if(b.target)s.targetPocket=i;if(b.cue||(!b.target&&!b.cue))s.shotFoul=true;break}}}}
    function stepPhysics(s,dt){for(const b of s.balls){if(b.pocketed)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;const damp=Math.exp(-1.35*dt);b.vx*=damp;b.vy*=damp;if(Math.hypot(b.vx,b.vy)<3)b.vx=b.vy=0;rail(b);b.flash=Math.max(0,b.flash-dt)}for(let pass=0;pass<2;pass++)for(let i=0;i<s.balls.length;i++)for(let j=i+1;j<s.balls.length;j++)collide(s.balls[i],s.balls[j]);detectPockets(s)}
    function velocityFor(from,to,power,force=1){const dx=to.x-from.x,dy=to.y-from.y,n=Math.hypot(dx,dy)||1,speed=(560+1050*power)*force;return{vx:dx/n*speed,vy:dy/n*speed}}

    function sync(){if(!state)return;const dr=MISSIONS[state.mission].drills[state.drillIndex],power=state.aim?Math.min(1,Math.hypot(state.aim.start.x-state.aim.now.x,state.aim.start.y-state.aim.now.y)/180):0;$("hudMission").textContent=state.mode==="menu"?"球房待命":MISSIONS[state.mission].name;$("drillText").textContent=`${state.drillIndex+1} / 3`;$("shotText").textContent=state.shots;$("scoreText").textContent=state.score;$("markText").textContent=`${state.marks} / 3`;$("powerText").textContent=`${Math.round(power*100)}%`;$("powerBar").style.width=`${power*100}%`;$("powerLabel").textContent=`目标力度 ${Math.round(dr.band[0]*100)}–${Math.round(dr.band[1]*100)}%`}
