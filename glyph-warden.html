  <body>
    <header class="topbar">
      <div class="brand"><h1>字灵守门：十二卷声韵战线</h1><p>拼音直输 · 三线守卷 · 固定战役</p></div>
      <div class="top-actions">
        <button class="icon-button" id="missionButton" title="选择战卷" aria-label="选择战卷">▦</button>
        <button class="icon-button" id="archiveButton" title="守卷档案" aria-label="守卷档案">⇄</button>
        <button class="icon-button" id="muteButton" title="声音" aria-label="切换声音">♪</button>
      </div>
    </header>
    <main class="app">
      <section class="mission-head">
        <div><p class="chapter" id="chapterText">第一章 · 听风入门</p><h2 id="missionName">01 青山初响</h2></div>
        <div class="saved-stars" id="savedStars">☆☆☆</div>
      </section>
      <section class="layout">
        <div class="battle">
          <div class="canvas-wrap" id="canvasWrap"><canvas id="glyphCanvas" aria-label="三线字灵防守战场"></canvas></div>
          <div class="target-strip">
            <div><div class="target-label">当前锁定</div><div class="target-word" id="targetWord">等待字灵</div></div>
            <div class="target-progress" id="targetProgress">键入拼音首字母自动锁定最近目标</div>
            <div class="charge"><b id="chargeText">墨势 0%</b><div class="charge-track"><div class="charge-fill" id="chargeFill"></div></div></div>
          </div>
        </div>
        <aside class="side">
          <section class="panel"><div class="panel-inner"><h3>守门战况</h3><div class="stats">
            <div class="stat"><b id="integrityText">100</b><span>门印完整</span></div>
            <div class="stat"><b id="scoreText">0</b><span>校勘分</span></div>
            <div class="stat"><b id="comboText">0</b><span>最高连字</span></div>
            <div class="stat"><b id="progressText">0/8</b><span>已净字灵</span></div>
          </div><p class="brief" id="briefText"></p></div></section>
          <section class="panel"><div class="panel-inner"><h3>三星验收</h3><div class="goals" id="goals"></div></div></section>
          <section class="panel"><div class="panel-inner"><h3>守卷人</h3><div class="wardens" id="wardens"></div><div class="controls">
            <button class="command primary" id="pauseButton">暂停</button>
            <button class="command" id="burstButton">墨震</button>
            <button class="command danger" id="retryButton">重开</button>
          </div><p class="status-line" id="statusLine">选择守卷人后开始本卷</p></div></section>
        </aside>
      </section>
      <section class="keyboard-panel">
        <div class="keyboard" id="keyboard" aria-label="触屏拼音键盘"></div>
        <p class="keyboard-note">实体键盘直接输入 A–Z；空格释放满充墨震，Esc 暂停。错误字母会中断连字，但不会吞掉后续输入。</p>
      </section>
    </main>

    <dialog id="missionDialog"><div class="dialog-head"><h2>十二卷声韵战线</h2><button class="close" data-close="missionDialog" aria-label="关闭">×</button></div><div class="dialog-body" id="missionGrid"></div></dialog>
    <dialog id="archiveDialog"><div class="dialog-head"><h2>GLYPH2 守卷档案</h2><button class="close" data-close="archiveDialog" aria-label="关闭">×</button></div><div class="dialog-body"><p class="dialog-copy" id="archiveMessage">档案保存十二卷星级、守门纪录与当前守卷人，可跨设备导入；被修改的档案会被拒绝。</p><textarea class="archive-box" id="archiveText" aria-label="GLYPH2 档案码"></textarea><div class="dialog-actions"><button class="command" id="copyArchive">复制</button><button class="command" id="importArchive">导入并校验</button><button class="command primary" data-close="archiveDialog">返回战场</button></div></div></dialog>
    <dialog id="briefDialog"><div class="dialog-head"><h2 id="briefTitle">战卷简报</h2><button class="close" data-close="briefDialog" aria-label="关闭">×</button></div><div class="dialog-body"><p class="dialog-copy" id="briefDialogText"></p><div class="brief-grid" id="briefGrid"></div><div class="dialog-actions"><button class="command primary" id="startBattle">开始守卷</button></div></div></dialog>
    <dialog id="resultDialog"><div class="dialog-head"><h2>守卷验收</h2><button class="close" data-close="resultDialog" aria-label="关闭">×</button></div><div class="dialog-body result"><p class="chapter" id="resultChapter"></p><h3 id="resultTitle"></h3><div class="result-stars" id="resultStars">★★★</div><p class="result-summary" id="resultSummary"></p><div class="dialog-actions"><button class="command" id="retryResult">再守一卷</button><button class="command primary" id="nextResult">下一卷</button></div></div></dialog>

    <script>
      (() => {
        const WORDS=[

          ["东风","dongfeng"],["西楼","xilou"],["海棠","haitang"],["兰舟","lanzhou"],["风骨","fenggu"],["星火","xinghuo"],["千秋","qianqiu"],["万象","wanxiang"],
          ["知音","zhiyin"],["守正","shouzheng"],["开卷","kaijuan"],["破阵","pozhen"],["问道","wendao"],["行云","xingyun"],["止水","zhishui"],["流光","liuguang"]

        const MISSIONS=[

          {chapter:"第一章 · 听风入门",name:"双径回声",brief:"两线交替来字，红色疾灵会更快逼近门印。",seed:227,count:9,interval:1.4,travel:12.3,kinds:["ink","rush"],integrity:82,combo:28},

        ];
        const ui=Object.fromEntries([...document.querySelectorAll("[id]")].map((node)=>[node.id,node]));
        const archivePrefix="GLYPH2",storageKey="glyph_warden_v2";
        let profile=loadProfile(),game=null,muted=false,audioContext=null,canvasWidth=900,canvasHeight=500,dpr=1,lastFrame=performance.now(),enemyId=1;
        function clamp(value,min,max){return Math.max(min,Math.min(max,value))}
        function freshProfile(){return{version:2,mission:0,warden:"scribe",stars:Array(12).fill(0),bestIntegrity:Array(12).fill(0),bestCombo:Array(12).fill(0),clears:Array(12).fill(0)}}
        function normalizeProfile(value){const base=freshProfile();if(!value||typeof value!=="object")return base;base.mission=clamp(Number(value.mission)||0,0,11);base.warden=WARDENS.some((warden)=>warden.id===value.warden)?value.warden:"scribe";for(const key of["stars","bestIntegrity","bestCombo","clears"]){if(Array.isArray(value[key]))base[key]=base[key].map((_,index)=>clamp(Number(value[key][index])||0,0,key==="stars"?3:99999))}return base}
        function loadProfile(){try{return normalizeProfile(JSON.parse(localStorage.getItem(storageKey)||"null"))}catch{return freshProfile()}}
        function saveProfile(){localStorage.setItem(storageKey,JSON.stringify(profile))}
