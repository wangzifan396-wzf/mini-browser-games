<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#163d44" />
    <title>镜前主编：十二期封面委托</title>
    <style>
      :root {
        color-scheme: light;
        --ink:#17343a; --muted:#607376; --paper:#f4f2ec; --white:#fffdfa;
        --teal:#176c72; --deep:#123e46; --red:#c65343; --gold:#dca52e; --line:#cbd4ce; --green:#3e805d;
      }
      * { box-sizing:border-box; }
      html,body { margin:0; min-height:100%; background:#dfe6df; color:var(--ink); font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
      button,textarea { font:inherit; }
      button { min-height:42px; border:1px solid #a9bbb5; border-radius:7px; background:var(--white); color:var(--ink); font-weight:700; cursor:pointer; }
      button:hover { border-color:var(--teal); }
      button:focus-visible,textarea:focus-visible { outline:3px solid rgba(220,165,46,.42); outline-offset:2px; }
      button:disabled { opacity:.43; cursor:not-allowed; }
      .app { min-height:100vh; }
      .topbar { min-height:67px; padding:10px clamp(12px,3vw,32px); display:flex; align-items:center; justify-content:space-between; gap:16px; background:var(--deep); color:white; border-bottom:4px solid var(--gold); }
      .brand h1 { margin:0; font-size:clamp(20px,2.4vw,29px); letter-spacing:0; }
      .brand p { margin:2px 0 0; color:#c8e0dc; font-size:13px; }
      .top-actions { display:flex; gap:7px; }
      .top-actions button { width:43px; min-height:40px; padding:0; background:#185861; border-color:#6d9999; color:white; font-size:18px; }
      .workspace { width:min(1320px,100%); margin:0 auto; padding:clamp(10px,2vw,22px); display:grid; grid-template-columns:minmax(360px,.82fr) minmax(520px,1.18fr); gap:clamp(12px,2vw,22px); align-items:start; }
      .preview { overflow:hidden; border:1px solid #78918d; border-radius:8px; background:#153f46; box-shadow:0 12px 32px rgba(25,55,57,.14); }
      .preview-head { min-height:77px; padding:13px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; color:white; background:#195b62; border-bottom:1px solid #76a3a0; }
      .kicker { margin:0 0 3px; color:#f0c968; font-size:12px; font-weight:800; }
      .preview-head h2 { margin:0; font-size:clamp(19px,2vw,26px); letter-spacing:0; }
      .stars { min-width:92px; color:#ffd65b; text-align:right; font-size:25px; letter-spacing:0; }
      .canvas-wrap { min-height:552px; display:grid; place-items:center; padding:10px; background:#d7e0d9; }
      canvas { display:block; width:100%; max-width:560px; height:auto; aspect-ratio:4/5; }
      .desk { display:grid; gap:11px; }
      .section { padding:13px; border-top:4px solid var(--teal); background:var(--white); box-shadow:0 5px 17px rgba(27,54,56,.07); }
      .section h3 { margin:0 0 9px; font-size:15px; letter-spacing:0; }
      .brief-line { display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--line); }
      .brief-stat { min-width:0; padding:9px 6px; text-align:center; border-right:1px solid var(--line); }
      .brief-stat:last-child { border-right:0; }
      .brief-stat b { display:block; color:var(--deep); font-size:18px; }
      .brief-stat span { display:block; margin-top:2px; color:var(--muted); font-size:11px; }
      .brief-copy { margin:9px 0 0; color:#486165; line-height:1.5; font-size:13px; }
      .chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
      .chip { padding:4px 7px; border:1px solid #b5c5be; border-radius:4px; color:#36565a; background:#edf1ec; font-size:11px; }
      .swatch { width:22px; height:22px; display:inline-block; border:2px solid white; outline:1px solid #aab6af; border-radius:4px; }
      .score-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; }
      .score-item { min-width:0; padding:7px 4px; text-align:center; background:#edf1ec; border-bottom:3px solid #9eaea8; }
      .score-item.good { background:#e4f1e7; border-bottom-color:var(--green); }
      .score-item b { display:block; color:var(--deep); font-size:15px; }
      .score-item span { color:var(--muted); font-size:10px; }
      .score-total { margin-top:8px; display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:12px; }
      .score-total strong { color:var(--deep); font-size:18px; }
      .tabs { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-bottom:8px; }
      .tabs button { min-height:38px; padding:4px; font-size:12px; }
      .tabs button.active { border-color:var(--teal); background:var(--teal); color:white; }
      .wardrobe { min-height:222px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; }
      .piece { position:relative; min-width:0; min-height:103px; padding:8px 5px 6px; display:grid; align-content:center; justify-items:center; gap:2px; text-align:center; }
      .piece.selected { border-color:var(--gold); box-shadow:inset 0 0 0 2px var(--gold); background:#fff7dd; }
      .piece .icon { font-size:27px; line-height:1; }
      .piece strong { max-width:100%; font-size:12px; overflow-wrap:anywhere; }
      .piece small { color:var(--muted); font-size:10px; }
      .piece .mini-swatch { position:absolute; top:6px; right:6px; width:12px; height:12px; border:1px solid rgba(20,40,40,.28); border-radius:3px; }
      .actions { display:grid; grid-template-columns:1fr 1fr 1.3fr; gap:7px; margin-top:9px; }
      .actions .primary { border-color:var(--red); background:var(--red); color:white; }
      .hint-line { min-height:20px; margin-top:7px; color:var(--muted); text-align:center; font-size:12px; }
      dialog { width:min(900px,calc(100% - 24px)); max-height:calc(100vh - 24px); padding:0; border:1px solid #6e8a86; border-radius:8px; color:var(--ink); background:var(--paper); box-shadow:0 24px 70px rgba(13,41,45,.38); }
      dialog::backdrop { background:rgba(8,29,32,.72); }
      .dialog-head { padding:15px 17px; display:flex; align-items:center; justify-content:space-between; gap:10px; color:white; background:var(--deep); border-bottom:4px solid var(--gold); }
      .dialog-head h2 { margin:0; font-size:21px; letter-spacing:0; }
      .close { width:42px; min-height:38px; padding:0; border-color:#72999a; background:#185861; color:white; font-size:21px; }
      .dialog-body { padding:15px; overflow:auto; }
      .issue-title { margin:15px 0 7px; color:var(--deep); font-size:14px; }
      .issue-title:first-child { margin-top:0; }
      .issue-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; }
      .issue { min-height:82px; padding:9px; display:grid; align-content:space-between; text-align:left; }
      .issue.active { border-color:var(--gold); box-shadow:inset 0 0 0 2px var(--gold); }
      .issue strong { font-size:13px; }
      .issue span { color:var(--muted); font-size:10px; }
      .issue em { color:#b67900; font-style:normal; font-size:16px; }
      .archive-note { margin:0 0 9px; color:var(--muted); line-height:1.55; }
      .archive-box { width:100%; min-height:145px; resize:vertical; padding:10px; border:1px solid #9eafa9; border-radius:6px; background:white; color:var(--ink); word-break:break-all; }
      .dialog-actions { margin-top:10px; display:flex; justify-content:flex-end; gap:7px; flex-wrap:wrap; }
      .dialog-actions .primary { border-color:var(--teal); background:var(--teal); color:white; }
      .result { text-align:center; }
      .result h3 { margin:3px 0; font-size:25px; }
      .result-stars { margin:8px 0; color:#d68b00; font-size:45px; line-height:1; }
      .breakdown { margin:12px 0; display:grid; grid-template-columns:repeat(5,1fr); gap:5px; }
      .breakdown div { padding:8px 4px; background:#e9eee8; }
      .breakdown b { display:block; color:var(--deep); }
      .feedback { max-width:650px; margin:10px auto; color:var(--muted); line-height:1.55; }
      @media(max-width:980px) {
        .workspace { grid-template-columns:1fr; }
        .canvas-wrap { min-height:0; }
        .preview { width:min(650px,100%); margin:0 auto; }
      }
      @media(max-width:560px) {
        .brand h1 { font-size:16px; }
        .brand p { display:none; }
        .top-actions { gap:4px; }
        .top-actions button { width:40px; }
        .workspace { padding:8px; gap:8px; }
        .preview-head { min-height:65px; padding:10px 12px; }
        .canvas-wrap { padding:4px; }
        .section { padding:10px; }
        .score-grid { grid-template-columns:repeat(3,1fr); }
        .score-grid .score-item:nth-child(4),.score-grid .score-item:nth-child(5) { grid-column:span 1; }
        .tabs { grid-template-columns:repeat(5,1fr); }
        .tabs button { padding:2px; font-size:11px; }
        .wardrobe { grid-template-columns:repeat(2,minmax(0,1fr)); min-height:414px; }
        .piece { min-height:96px; }
        .issue-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
        .breakdown { grid-template-columns:repeat(3,1fr); }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand"><h1>镜前主编：十二期封面委托</h1><p>固定编辑简报 · 五轴透明评分 · STYLE2 主编档案</p></div>
        <div class="top-actions">
          <button id="issueButton" title="选择委托" aria-label="选择委托">▦</button>
          <button id="archiveButton" title="主编档案" aria-label="主编档案">⇄</button>
          <button id="muteButton" title="声音" aria-label="切换声音">♪</button>
        </div>
      </header>
      <div class="workspace">
        <section class="preview" aria-label="造型预览">
          <div class="preview-head"><div><p class="kicker" id="chapterText"></p><h2 id="briefName"></h2></div><div class="stars" id="savedStars">☆☆☆</div></div>
          <div class="canvas-wrap" id="canvasWrap"><canvas id="lookCanvas" width="640" height="800" aria-label="封面造型预览"></canvas></div>
        </section>
        <section class="desk">
          <div class="section">
            <h3>编辑简报</h3>
            <div class="brief-line">
              <div class="brief-stat"><b id="styleText">--</b><span>风格方向</span></div>
              <div class="brief-stat"><b id="budgetText">0/0</b><span>制作预算</span></div>
              <div class="brief-stat"><b id="totalStars">0/36</b><span>主编星章</span></div>
            </div>
            <p class="brief-copy" id="briefCopy"></p>
            <div class="chips" id="briefChips"></div>
          </div>
          <div class="section">
            <h3>实时审稿</h3>
            <div class="score-grid" id="scoreGrid"></div>
            <div class="score-total"><span id="selectionText">已选 0/5</span><span>预估 <strong id="scoreText">0</strong>/100</span></div>
          </div>
          <div class="section">
            <h3>造型衣橱</h3>
            <div class="tabs" id="slotTabs"></div>
            <div class="wardrobe" id="wardrobe"></div>
            <div class="actions"><button id="clearButton">清空</button><button id="hintButton">主编提示</button><button id="submitButton" class="primary">提交封面</button></div>
            <div class="hint-line" id="hintLine">从五个类别各选一件单品</div>
          </div>
        </section>
      </div>
    </main>

    <dialog id="issueDialog"><div class="dialog-head"><h2>十二期固定委托</h2><button class="close" data-close="issueDialog" aria-label="关闭">×</button></div><div class="dialog-body" id="issueGrid"></div></dialog>
    <dialog id="archiveDialog"><div class="dialog-head"><h2>STYLE2 主编档案</h2><button class="close" data-close="archiveDialog" aria-label="关闭">×</button></div><div class="dialog-body"><p class="archive-note" id="archiveMessage"></p><textarea class="archive-box" id="archiveText" aria-label="STYLE2 档案码"></textarea><div class="dialog-actions"><button id="copyArchive">复制</button><button id="importArchive">导入并校验</button><button class="primary" data-close="archiveDialog">返回编辑台</button></div></div></dialog>
    <dialog id="resultDialog"><div class="dialog-head"><h2>封面审定</h2><button class="close" data-close="resultDialog" aria-label="关闭">×</button></div><div class="dialog-body result"><p class="kicker">本期审稿结果</p><h3 id="resultTitle"></h3><div class="result-stars" id="resultStars"></div><p><strong id="resultScore"></strong></p><div class="breakdown" id="resultBreakdown"></div><p class="feedback" id="resultFeedback"></p><div class="dialog-actions"><button id="retryResult">重新搭配</button><button id="nextResult" class="primary">下一期</button></div></div></dialog>
