  <meta name="theme-color" content="#163f3a">
  <title>桁架工坊：十二座山谷验算</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23163f3a'/%3E%3Cpath d='M8 48h48L32 14 8 48zm8-5 16-22 16 22H16z' fill='%23efc247'/%3E%3Cpath d='M16 43h32M22 35h20M27 27h10' stroke='%23f7f2df' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#152d2b;--muted:#60716e;--paper:#fffdf6;--wash:#e8ede7;--line:#a2b0ac;--dark:#163f3a;--green:#2b7669;--gold:#d5a323;--red:#b84e46;--blue:#267899;--pine:#b17a3f;--steel:#6f7f87;--cable:#d5a323;--radius:8px}
    *{box-sizing:border-box}[hidden]{display:none!important}html{background:#dce5df}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;background:#e3e9e4}button,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,textarea:focus-visible{outline:3px solid rgba(213,163,35,.42);outline-offset:2px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:96px;padding:15px max(18px,calc((100vw - 1360px)/2));border-bottom:5px solid var(--gold);color:#fff;background:var(--dark)}.brand h1{margin:0;font-size:clamp(28px,4vw,44px);line-height:1.06;letter-spacing:0}.brand p{margin:6px 0 0;color:#c7d8d3;font-size:13px;font-weight:800}.top-actions{display:flex;gap:8px}.icon-button{display:grid;place-items:center;width:46px;height:46px;padding:0;border:1px solid #79a197;border-radius:var(--radius);color:#fff;background:#245f57;font-size:20px;font-weight:900}
    .app{width:min(1360px,calc(100vw - 24px));margin:18px auto 40px}.contract-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 16px;border:1px solid #145248;border-bottom:0;color:#fff;background:var(--green)}.chapter{margin:0 0 4px;color:#ffdb75;font-size:12px;font-weight:900}.contract-head h2{margin:0;font-size:24px}.saved-stars{color:#ffdc61;font-size:28px;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;align-items:start}.workbench{min-width:0;border:1px solid var(--line);background:var(--paper)}.canvas-wrap{height:500px;padding:9px;background:#cad5d0}canvas{display:block;width:100%;height:100%;touch-action:none;background:#dce9e8}.build-strip{padding:13px;border-top:1px solid var(--line)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.section-head h3{margin:0;font-size:18px}.selection-note{color:var(--muted);font-size:12px;font-weight:800}.materials{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.material{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;min-height:62px;padding:8px;border:1px solid #9eadaa;border-radius:var(--radius);color:var(--ink);text-align:left;background:#fff}.material.active{border:3px solid var(--gold);padding:6px;background:#fff8dd}.swatch{display:grid;place-items:center;width:36px;height:36px;border-radius:6px;color:#fff;font-size:12px;font-weight:900}.material strong,.material small{display:block}.material small{margin-top:2px;color:var(--muted);font-size:10px}.material b{color:var(--green);font-size:18px}
    .side{display:grid;align-content:start;gap:12px}.panel{border:1px solid var(--line);border-top:5px solid var(--green);background:var(--paper)}.panel-inner{padding:13px}.panel h3{margin:0 0 10px;font-size:18px}.scenario-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}.scenario{min-height:39px;padding:5px;border:1px solid #a5b3af;border-radius:6px;color:var(--ink);background:#edf1ec;font-size:11px;font-weight:900}.scenario.active{border-color:#1c6258;color:#fff;background:var(--green)}.metrics{display:grid;grid-template-columns:1fr 1fr;border:1px solid #b1bfba}.metric{padding:9px;text-align:center}.metric:nth-child(odd){border-right:1px solid #b1bfba}.metric:nth-child(-n+2){border-bottom:1px solid #b1bfba}.metric b{display:block;font-size:21px}.metric span{color:var(--muted);font-size:10px;font-weight:800}.brief{margin:9px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.goals{display:grid;gap:7px}.goal{display:grid;grid-template-columns:31px 1fr auto;gap:8px;align-items:center;padding:9px;border-left:4px solid #a3b1ad;background:#edf1ec}.goal.done{border-color:var(--gold);background:#fff7d8}.goal strong:first-child{color:var(--green)}.goal b{white-space:nowrap}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}.command{min-height:43px;padding:0 9px;border:1px solid #8ca09b;border-radius:var(--radius);color:var(--ink);background:#edf1ec;font-weight:900}.command.primary{border-color:#11584f;color:#fff;background:var(--green)}.command.danger{border-color:#9e443e;color:#fff;background:var(--red)}.status-line{min-height:38px;margin:9px 0 0;color:var(--muted);font-size:12px;line-height:1.45;text-align:center}.member-info{padding:9px;border:1px solid #aebbb7;background:#edf1ec;color:var(--muted);font-size:11px;line-height:1.5}.member-info strong{display:block;color:var(--ink);font-size:13px}.legend{display:grid;grid-template-columns:1fr 1fr;gap:7px}.legend-item{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:800}.legend-line{width:31px;height:6px;border-radius:3px;background:var(--pine)}.legend-line.steel{background:var(--steel)}.legend-line.cable{height:3px;background:var(--cable)}.legend-line.pull{height:3px;background:var(--blue)}.legend-line.push{height:3px;background:var(--red)}
    dialog{width:min(820px,calc(100vw - 24px));max-height:min(840px,calc(100vh - 24px));padding:0;border:1px solid #78918b;border-radius:var(--radius);color:var(--ink);background:var(--paper);box-shadow:0 24px 72px rgba(16,43,39,.36)}dialog::backdrop{background:rgba(10,35,31,.72)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:4px solid var(--gold);color:#fff;background:var(--dark)}.dialog-head h2{margin:0;font-size:22px}.close{display:grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid #79a198;border-radius:6px;color:#fff;background:#245f57;font-size:22px}.dialog-body{padding:16px}.dialog-copy{margin:0 0 14px;color:var(--muted);line-height:1.6}.contract-title{margin:16px 0 8px;color:var(--green);font-size:15px}.contract-title:first-child{margin-top:0}.contract-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.contract-card{min-height:91px;padding:10px;border:1px solid #a9b8b3;border-radius:var(--radius);color:var(--ink);text-align:left;background:#fff}.contract-card.active{border:3px solid var(--gold);padding:8px;background:#fff7d8}.contract-card strong,.contract-card span,.contract-card em{display:block}.contract-card span{margin:5px 0;color:var(--muted);font-size:11px}.contract-card em{color:#b37c0c;font-style:normal}.archive-box{width:100%;height:145px;padding:10px;border:1px solid #8da19b;border-radius:var(--radius);resize:vertical;font-family:Consolas,monospace;font-size:12px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:12px}.result{text-align:center}.result h3{margin:4px 0;font-size:28px}.result-stars{color:#d18e08;font-size:44px}.result-summary{color:var(--muted);line-height:1.65}
    @media(max-width:1020px){.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.side .panel:last-child{grid-column:1/-1}.canvas-wrap{height:470px}}
    @media(max-width:620px){.topbar{min-height:0;padding:13px 11px}.brand h1{font-size:26px}.brand p{display:none}.icon-button{width:43px;height:43px}.app{width:calc(100vw - 14px);margin:9px auto 26px}.contract-head{padding:11px}.contract-head h2{font-size:20px}.saved-stars{font-size:23px}.layout{display:block}.side{display:grid;grid-template-columns:1fr;margin-top:12px}.side .panel:last-child{grid-column:auto}.canvas-wrap{height:355px;padding:5px}.materials{grid-template-columns:1fr}.material{min-height:55px}.contract-grid{grid-template-columns:1fr 1fr}.dialog-body{padding:13px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><h1>桁架工坊：十二座山谷验算</h1><p>节点平衡 · 拉压容量 · 多工况 · 工料预算</p></div>
    <div class="top-actions"><button class="icon-button" id="contractButton" title="选择委托" aria-label="选择委托">▦</button><button class="icon-button" id="archiveButton" title="工程档案" aria-label="工程档案">⇄</button><button class="icon-button" id="muteButton" title="声音" aria-label="切换声音">♪</button></div>
  </header>
  <main class="app">
    <section class="contract-head"><div><p class="chapter" id="chapterText"></p><h2 id="contractName"></h2></div><div class="saved-stars" id="savedStars">☆☆☆</div></section>
    <section class="layout">
      <div class="workbench">
        <div class="canvas-wrap" id="canvasWrap"><canvas id="trussCanvas" aria-label="山谷桁架受力图"></canvas></div>
        <section class="build-strip"><div class="section-head"><h3>杆件库</h3><span class="selection-note" id="selectionNote">选择材料，再依次点击两个节点</span></div><div class="materials" id="materials"></div></section>
      </div>
      <aside class="side">
        <section class="panel"><div class="panel-inner"><h3>工况验算</h3><div class="scenario-tabs" id="scenarioTabs"></div><div class="metrics"><div class="metric"><b id="memberText">0/0</b><span>已架杆件</span></div><div class="metric"><b id="costText">0</b><span>工料成本</span></div><div class="metric"><b id="utilText">--</b><span>最大利用率</span></div><div class="metric"><b id="totalText">0/36</b><span>工程星章</span></div></div><p class="brief" id="briefText"></p></div></section>
        <section class="panel"><div class="panel-inner"><h3>三星验收</h3><div class="goals" id="goals"></div></div></section>
        <section class="panel"><div class="panel-inner"><h3>施工操作</h3><div class="controls"><button class="command" id="removeButton">拆除选杆</button><button class="command" id="undoButton">撤回</button><button class="command" id="hintButton">监理提示</button><button class="command danger" id="clearButton">清空</button><button class="command primary" id="verifyButton" style="grid-column:1/-1">执行全工况验算</button></div><p class="status-line" id="statusLine">虚线是可施工测线，点两个节点架设当前材料</p></div></section>
        <section class="panel"><div class="panel-inner"><h3>选中杆件</h3><div class="member-info" id="memberInfo"><strong>尚未选择</strong>点击已架杆件可查看轴力与容量。</div></div></section>
        <section class="panel"><div class="panel-inner"><h3>图例</h3><div class="legend"><div class="legend-item"><i class="legend-line"></i>松木梁</div><div class="legend-item"><i class="legend-line steel"></i>精钢杆</div><div class="legend-item"><i class="legend-line cable"></i>拉索</div><div class="legend-item"><i class="legend-line pull"></i>受拉</div><div class="legend-item"><i class="legend-line push"></i>受压</div></div></div></section>
      </aside>
    </section>
  </main>

  <dialog id="contractDialog"><div class="dialog-head"><h2>十二座山谷合同</h2><button class="close" data-close="contractDialog" aria-label="关闭">×</button></div><div class="dialog-body" id="contractGrid"></div></dialog>
  <dialog id="archiveDialog"><div class="dialog-head"><h2>TRUSS2 工程档案</h2><button class="close" data-close="archiveDialog" aria-label="关闭">×</button></div><div class="dialog-body"><p class="dialog-copy" id="archiveMessage">档案保存十二座星级、最低造价与当前合同，可跨设备导入；被修改的档案会被拒绝。</p><textarea class="archive-box" id="archiveText" aria-label="TRUSS2 档案码"></textarea><div class="dialog-actions"><button class="command" id="copyArchive">复制</button><button class="command" id="importArchive">导入并校验</button><button class="command primary" data-close="archiveDialog">返回工坊</button></div></div></dialog>
  <dialog id="resultDialog"><div class="dialog-head"><h2>结构验收</h2><button class="close" data-close="resultDialog" aria-label="关闭">×</button></div><div class="dialog-body result"><p class="chapter" id="resultChapter"></p><h3 id="resultTitle"></h3><div class="result-stars" id="resultStars"></div><p class="result-summary" id="resultSummary"></p><div class="dialog-actions"><button class="command" id="retryResult">重新施工</button><button class="command primary" id="nextResult">下一座</button></div></div></dialog>

  <script>
  (()=>{
    const MATERIALS={pine:{id:"pine",name:"松木梁",short:"木",tension:58,compression:46,cost:7,color:"#b17a3f",note:"低价，可承受中等拉压"},steel:{id:"steel",name:"精钢杆",short:"钢",tension:520,compression:500,cost:15,color:"#6f7f87",note:"高价，适合主弦与长压杆"},cable:{id:"cable",name:"高强拉索",short:"索",tension:145,compression:0,cost:6,color:"#d5a323",note:"只承受拉力，轻且便宜"}};
    const edgeKey=(a,b)=>a<b?a+"-"+b:b+"-"+a;
    const load=(name,items)=>({name,items});
    const item=(node,fx,fy)=>({node,fx,fy});
    function contract(id,chapter,name,bays,height,pattern,scenarios,brief){
      const nodes=[];for(let i=0;i<=bays;i+=1){nodes.push({id:"B"+i,x:i*100,y:0,type:i===0?"pin":i===bays?"roller":"joint"});nodes.push({id:"T"+i,x:i*100,y:height,type:"joint"})}
      const reference=[];for(let i=0;i<bays;i+=1){reference.push(edgeKey("B"+i,"B"+(i+1)),edgeKey("T"+i,"T"+(i+1)))}for(let i=0;i<=bays;i+=1)reference.push(edgeKey("B"+i,"T"+i));for(let i=0;i<bays;i+=1)reference.push(pattern[i]==="R"?edgeKey("B"+i,"T"+(i+1)):edgeKey("T"+i,"B"+(i+1)));
      const candidates=[...reference];for(let i=0;i<bays;i+=1)candidates.push(pattern[i]==="R"?edgeKey("T"+i,"B"+(i+1)):edgeKey("B"+i,"T"+(i+1)));
      return{id,chapter,name,bays,height,nodes,reference:[...new Set(reference)],candidates:[...new Set(candidates)],scenarios,brief,supports:["B0","B"+bays]};
    }
    const CONTRACTS=[
      contract("brook","第一辑 · 基础三角","溪口便桥",2,82,"RL",[load("静载",[item("T1",0,-24)]),load("行人偏载",[item("T0",0,-10),item("T1",0,-12)])],"两跨入门桥。先补齐上下弦、立柱与斜腹杆，再观察蓝色受拉和红色受压。"),
      contract("orchard","第一辑 · 基础三角","果园栈桥",2,64,"RL",[load("满载",[item("T0",0,-16),item("T1",0,-28),item("T2",0,-12)]),load("东风",[item("T0",9,-10),item("T1",12,-14),item("T2",9,-8)])],"低矮桥会放大弦杆轴力；拉索便宜，但遇到反向受压会立刻失效。"),
      contract("mill","第一辑 · 基础三角","水磨运梁",3,86,"RLL",[load("木料车",[item("T1",0,-34),item("T2",0,-18)]),load("回程车",[item("T1",0,-15),item("T2",0,-32)])],"移动荷载会改变腹杆受力，材料必须通过两个车位，而不是只看当前工况。"),
      contract("gorge","第二辑 · 移动荷载","峡口邮路",3,62,"RRL",[load("中跨车",[item("T1",0,-38),item("T2",0,-24)]),load("左跨车",[item("T0",0,-10),item("T1",0,-44)]),load("西风",[item("T0",-10,-8),item("T1",-14,-16),item("T2",-12,-12),item("T3",-8,-6)])],"三种工况共同验收。低桁高让主弦受力更大，精钢应留给真正高利用率杆件。"),
      contract("terrace","第二辑 · 移动荷载","梯田水渠",3,104,"RLL",[load("蓄水",[item("T0",0,-20),item("T1",0,-26),item("T2",0,-26),item("T3",0,-20)]),load("检修偏载",[item("T2",0,-42),item("T3",0,-18)])],"高桁架降低弦杆力，却让竖杆和斜杆更长，受压容量会因失稳折减。"),
      contract("quarry","第二辑 · 移动荷载","采石重桥",4,80,"RRLL",[load("双车",[item("T1",0,-42),item("T3",0,-42)]),load("中央重车",[item("T2",0,-72)]),load("制动",[item("T1",18,-28),item("T2",20,-34)])],"四跨重载首次要求同时管理高轴力与材料件数，不能用全钢绕过预算。"),
      contract("pinewind","第三辑 · 风荷反转","松岭风廊",4,68,"RRLL",[load("南风",[item("T0",14,-9),item("T1",18,-14),item("T2",20,-16),item("T3",18,-14),item("T4",14,-9)]),load("北风",[item("T0",-14,-9),item("T1",-18,-14),item("T2",-20,-16),item("T3",-18,-14),item("T4",-14,-9)])],"双向横风可能让同一腹杆在拉、压之间反转，单向拉索必须谨慎布置。"),
      contract("frost","第三辑 · 风荷反转","霜谷巡桥",4,112,"RRLL",[load("积雪",[item("T0",0,-24),item("T1",0,-30),item("T2",0,-36),item("T3",0,-30),item("T4",0,-24)]),load("雪车右行",[item("T3",12,-52),item("T4",8,-18)]),load("回风",[item("T0",-12,-10),item("T1",-15,-18),item("T2",-16,-22),item("T3",-15,-18),item("T4",-12,-10)])],"高而长的腹杆有明显压屈折减；切换工况可检查它们是否始终只受拉。"),
      contract("reservoir","第三辑 · 风荷反转","水库管桥",5,82,"RRRLL",[load("满管",[item("T0",0,-18),item("T1",0,-26),item("T2",0,-32),item("T3",0,-32),item("T4",0,-26),item("T5",0,-18)]),load("阀组偏载",[item("T1",0,-20),item("T2",0,-55),item("T3",0,-16)]),load("侧向脉冲",[item("T1",14,-12),item("T2",20,-18),item("T3",18,-16),item("T4",12,-10)])],"五跨结构开始出现更高的主弦力，材料选择要同时看成本与最不利工况。"),
      contract("canyon","第四辑 · 综合验收","赤峡货线",5,60,"RRRLL",[load("重载列车",[item("T1",0,-46),item("T2",0,-58),item("T3",0,-58),item("T4",0,-46)]),load("列车制动",[item("T2",26,-46),item("T3",22,-40)]),load("空桥横风",[item("T0",-12,-8),item("T1",-18,-10),item("T2",-22,-12),item("T3",-22,-12),item("T4",-18,-10),item("T5",-12,-8)])],"低桁高、重载和制动力叠加，主弦必须用钢，但其余位置仍有节省空间。"),
      contract("cloud","第四辑 · 综合验收","云脊索道桥",5,118,"RRRLL",[load("吊舱左列",[item("T0",0,-18),item("T1",0,-38),item("T2",0,-42)]),load("吊舱右列",[item("T3",0,-42),item("T4",0,-38),item("T5",0,-18)]),load("山口逆风",[item("T0",-16,-8),item("T1",-20,-12),item("T2",-24,-14),item("T3",-24,-14),item("T4",-20,-12),item("T5",-16,-8)])],"超高桁架拥有较低弦杆力，却承受更强横风和更长压杆折减，是拉索发挥价值的最后课堂。"),
      contract("crown","第四辑 · 综合验收","王冠终谷",5,76,"RRRLL",[load("全线车队",[item("T0",0,-20),item("T1",0,-44),item("T2",0,-60),item("T3",0,-60),item("T4",0,-44),item("T5",0,-20)]),load("左侧拥堵",[item("T0",0,-22),item("T1",0,-64),item("T2",0,-70)]),load("右侧拥堵",[item("T3",0,-70),item("T4",0,-64),item("T5",0,-22)]),load("暴风封谷",[item("T0",20,-12),item("T1",24,-20),item("T2",28,-24),item("T3",28,-24),item("T4",24,-20),item("T5",20,-12)])],"终局用四种工况检验结构。任何只针对单一荷载的省料方案，都可能在另一侧车队或暴风中失效。")
    ];
    const nodeBy=(contract,id)=>contract.nodes.find(node=>node.id===id);
    function splitEdge(key){const [a,b]=key.split("-");return[a,b]}

    function pointerPoint(event){const rect=ui.trussCanvas.getBoundingClientRect(),sx=canvasWidth/rect.width,sy=canvasHeight/rect.height;return{x:(event.clientX-rect.left)*sx,y:(event.clientY-rect.top)*sy}}
    function distanceToSegment(point,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((point.x-a.x)*dx+(point.y-a.y)*dy)/(dx*dx+dy*dy||1))),x=a.x+t*dx,y=a.y+t*dy;return Math.hypot(point.x-x,point.y-y)}
    function handleCanvas(event){event.preventDefault();const point=pointerPoint(event),view=geometry||layoutGeometry(),node=current().nodes.map(node=>({id:node.id,distance:Math.hypot(point.x-view.points[node.id].x,point.y-view.points[node.id].y)})).sort((a,b)=>a.distance-b.distance)[0];if(node&&node.distance<=18)return clickNode(node.id);const member=game.placements.map(item=>{const[a,b]=splitEdge(item.key);return{key:item.key,distance:distanceToSegment(point,view.points[a],view.points[b])}}).sort((a,b)=>a.distance-b.distance)[0];if(member&&member.distance<=14)return selectMember(member.key);game.firstNode=null;game.selected=null;updateUi();draw();return false}

    window.__trussWorkshopTest={contracts:CONTRACTS,materials:MATERIALS,freshProfile,encodeArchive,decodeArchive,solveScenario,analyze,capacity,validateContent,runReference,begin(index=0,options={testing:true}){return begin(index,options)},setMaterial,addMember,clickNode,selectMember,removeSelected,undo,hint,verify,getState(){const result=analysis();return{contract:profile.contract,placements:game.placements.map(member=>({...member})),material:game.material,firstNode:game.firstNode,selected:game.selected,scenario:game.scenario,hints:game.hints,complete:game.complete,result:game.result,analysis:{stable:result.stable,capacityPass:result.capacityPass,budgetPass:result.budgetPass,pass:result.pass,cost:result.cost,worst:result.worst,required:result.required},geometry:geometry?{points:geometry.points,scale:geometry.scale,baseY:geometry.baseY}:null}}};
