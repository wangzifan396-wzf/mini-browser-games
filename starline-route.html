<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#202c42">
  <title>星港巡线：欧拉航图</title>
  <style>
    :root{--bg:#edf0f3;--paper:#fff;--ink:#202c3b;--muted:#687380;--line:#c4ccd3;--deep:#202c42;--blue:#236f9b;--cyan:#2e8d9a;--gold:#b88124;--red:#aa4e50;--green:#377760;--violet:#695b87;--radius:8px;--shadow:0 12px 28px rgba(27,42,63,.13)}
    *{box-sizing:border-box;letter-spacing:0}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg)}button{font:inherit}.app{width:min(1200px,calc(100vw - 24px));margin:auto;padding:18px 0 30px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:18px 20px;border-bottom:4px solid #d9aa4e;color:#fff;background:var(--deep)}h1{margin:0;font-size:28px}.sub{margin:5px 0 0;color:#cbd4e2;font-size:13px}.campaign{display:flex;gap:20px;text-align:right}.campaign b{display:block;color:#efc565;font-size:20px}.campaign span{color:#bdc9d9;font-size:10px}.missions{display:grid;grid-template-columns:repeat(12,minmax(40px,1fr));gap:5px;padding:12px 0}.mission{height:45px;border:1px solid #a7b1bd;border-radius:6px;color:#405064;background:#fafbfc;font-weight:900;cursor:pointer}.mission.active{border-color:var(--blue);color:#fff;background:var(--blue)}.mission.locked{opacity:.42}.mission small{display:block;height:11px;color:#f0ca6f;font-size:9px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px}.chart{min-width:0;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);box-shadow:var(--shadow)}.brief{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}.brief h2{margin:0;font-size:21px}.brief p{margin:5px 0 0;color:var(--muted);font-size:12px}.goal{flex:0 0 auto;padding:7px 9px;border:1px solid #c8a258;border-radius:6px;color:#704f12;background:#fff4d9;font-size:11px;font-weight:900}.map{position:relative;overflow:hidden;border-radius:6px;background:#18243a}.map svg{display:block;width:100%;aspect-ratio:16/9;touch-action:manipulation}.grid-line{stroke:rgba(126,166,197,.1);stroke-width:1}.edge{stroke:#60748a;stroke-width:5;stroke-linecap:round;transition:.15s}.edge.used{stroke:#d8ae55;stroke-width:7}.edge.next{stroke:#70d0d7;stroke-width:9}.node{cursor:pointer}.node circle{fill:#e8edf2;stroke:#8ba0b2;stroke-width:5;transition:.15s}.node text{fill:#26384b;font:bold 20px sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}.node.current circle{fill:#2d8b98;stroke:#9de0e2}.node.current text{fill:#fff}.node.available circle{stroke:#edc565;stroke-width:8}.node.start circle{filter:drop-shadow(0 0 8px rgba(237,197,101,.55))}.map-note{position:absolute;left:9px;bottom:8px;padding:5px 7px;border-radius:4px;color:#d4e1ee;background:rgba(18,31,51,.78);font-size:9px}.ledger-head{display:flex;align-items:center;justify-content:space-between;margin:11px 0 6px}.ledger-head h3{margin:0;font-size:14px}.ledger-head span{color:var(--muted);font-size:10px}.ledger-wrap{overflow-x:auto;padding-bottom:3px}.ledger{display:flex;align-items:center;min-height:45px;gap:4px}.stop{display:grid;place-items:center;flex:0 0 34px;height:34px;border:1px solid #9eacb8;border-radius:50%;color:#3d4e60;background:#f3f5f7;font-size:11px;font-weight:900}.stop.current{border-color:var(--cyan);color:#fff;background:var(--cyan)}.arrow{color:#a57924;font-weight:900}.empty{color:var(--muted);font-size:11px}.panel{display:flex;flex-direction:column;gap:10px}.box{padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}.box h3{margin:0 0 9px;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px 3px;border:1px solid #d3d9df;border-radius:6px;text-align:center;background:#f3f5f7}.stat b{display:block;color:var(--blue);font-size:18px}.stat span{color:var(--muted);font-size:9px}.actions,.archive{display:grid;grid-template-columns:1fr 1fr;gap:6px}.actions button,.archive button{min-height:40px;border:1px solid #a5b0ba;border-radius:6px;color:#35465a;background:#f0f3f5;font-weight:900;cursor:pointer}.actions .primary{grid-column:1/-1;border-color:var(--blue);color:#fff;background:var(--blue)}.actions button:disabled{opacity:.45;cursor:not-allowed}.status{min-height:78px;margin:0;padding:10px;border-left:4px solid var(--blue);color:#3b4d61;background:#eef3f7;font-size:12px;line-height:1.55}.legend{display:grid;grid-template-columns:1fr 1fr;gap:7px;color:var(--muted);font-size:10px}.legend i{display:inline-block;width:14px;height:4px;margin-right:5px;vertical-align:middle;background:#60748a}.legend .used{height:6px;background:#d8ae55}.legend .now{width:11px;height:11px;border-radius:50%;background:#2d8b98}.legend .open{width:11px;height:11px;border:3px solid #edc565;border-radius:50%;background:#fff}.result{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(16,27,45,.76)}.result[hidden]{display:none}.result-card{width:min(430px,100%);padding:22px;border-radius:var(--radius);background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.3);text-align:center}.result-card h2{margin:0}.result-card p{color:var(--muted);line-height:1.6}.result-stars{margin:12px 0;color:#d49a18;font-size:34px}.result-card button{min-height:42px;padding:0 18px;border:0;border-radius:6px;color:#fff;background:var(--blue);font-weight:900;cursor:pointer}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.panel{display:grid;grid-template-columns:1fr 1fr}.panel .status{grid-column:1/-1}}
    @media(max-width:680px){.app{width:calc(100vw - 12px);padding-top:6px}.head{display:block;padding:14px}.campaign{justify-content:space-between;margin-top:12px;text-align:left}.missions{grid-template-columns:repeat(6,1fr)}.mission{height:39px}.chart{padding:8px}.brief{display:block}.goal{display:inline-block;margin-top:7px}.map svg{aspect-ratio:4/3}.panel{display:flex}}
  </style>
</head>
<body>
  <main class="app">
    <header class="head"><div><h1>星港巡线：欧拉航图</h1><p class="sub">从指定港口启航，每条航线恰好巡检一次，并在目标港完成交班。</p></div><div class="campaign"><div><b id="starTotal">0 / 36</b><span>巡线星章</span></div><div><b id="perfectTotal">0 / 12</b><span>无撤回航图</span></div><div><b id="edgeTotal">0</b><span>累计巡检边</span></div></div></header>
    <nav class="missions" id="missions" aria-label="巡线合同"></nav>
    <section class="layout">
      <div class="chart">
        <div class="brief"><div><h2 id="title"></h2><p id="brief"></p></div><span class="goal" id="goal"></span></div>
        <div class="map"><svg id="map" viewBox="0 0 900 520" role="group" aria-label="星港巡线图"></svg><span class="map-note">点击与当前港口直接相连的下一站</span></div>
        <div class="ledger-head"><h3>巡检航迹</h3><span id="endpoint"></span></div>
        <div class="ledger-wrap"><div class="ledger" id="ledger"></div></div>
      </div>
      <aside class="panel">
        <section class="box"><h3>航图状态</h3><div class="stats"><div class="stat"><b id="covered">0 / 0</b><span>已巡航线</span></div><div class="stat"><b id="undos">0</b><span>撤回次数</span></div><div class="stat"><b id="hints">0</b><span>导航提示</span></div></div></section>
        <section class="box"><div class="actions"><button class="primary" id="inspect">提交巡检航图</button><button id="hint">导航一步</button><button id="undo">撤回</button><button id="reset">重新规划</button><button id="replay">参考回放</button></div></section>
        <p class="status" id="status"></p>
        <section class="box"><div class="legend"><span><i></i>未巡航线</span><span><i class="used"></i>已巡航线</span><span><i class="now"></i>当前港口</span><span><i class="open"></i>可达港口</span></div></section>
        <section class="box"><div class="archive"><button id="exportSave">导出档案</button><button id="importSave">导入档案</button></div></section>
      </aside>
    </section>
  </main>
  <div class="result" id="result" hidden><div class="result-card"><h2 id="resultTitle"></h2><p id="resultText"></p><div class="result-stars" id="resultStars"></div><button id="next">下一张航图</button></div></div>
  <script>
  (()=>{
    "use strict";
    const SAVE_KEY="starline_route_v2",positions={A:[90,260],B:[245,85],C:[470,72],D:[700,145],E:[790,370],F:[545,452],G:[275,430],H:[455,270],I:[845,245]},specs=[
      ["晨星外环","六港外环与三条交叉线构成首份闭合巡检。","A B C D A E F D B E C F A"],["双月联桥","两组环线共享中央联桥，必须一次完成。","A B C D E A C F E B D F A"],["折光航道","辨认交叉线的连接关系，不要被视觉交点误导。","A B D C A E D F C E B F A"],["雾湾交班","从 A 港启航，并在 G 港完成开放式巡线。","A B C A D B E C F D G E F G"],
      ["赤道六港","三组短环互锁形成紧凑的欧拉航图。","A B D A C B E D F C E F A"],["寒潮中继","中央航线度数较高，提前判断进出次数。","A C B D A E C F B E D F A"],["七港花环","外环与内侧跳线共同组成十四边合同。","A B C D A E B F C G D E F G A"],["镜面星区","航线交叉不代表星港，只有字母节点可以转向。","A D B C A E D F B G C E G F A"],
      ["远岸八站","八个港口组成双层回路，巡检后返回 A 港。","A B C A D B E C F D G E H F G H A"],["深空换班","从 A 港到 H 港，两个奇度端点不可互换。","A B D C A E B F C G D H E G F H"],["脉冲回廊","高密度跳线要求在进入边缘港前保留出口。","A C B D A E C F B G D H E G F H A"],["星门总巡","九港十八边终局航图，覆盖全域后回到 A 港。","A B C D A E B F C G D H E I F H G I A"]
    ];
    const $=id=>document.getElementById(id),missionEl=$("missions"),mapEl=$("map"),ledgerEl=$("ledger"),statusEl=$("status"),NS="http://www.w3.org/2000/svg";
    function edgeKey(a,b){return a<b?`${a}-${b}`:`${b}-${a}`}
    function buildMission(spec,index){const[title,brief,text]=spec,reference=text.split(" "),nodeIds=[...new Set(reference)],edges=[];for(let step=1;step<reference.length;step++){const a=reference[step-1],b=reference[step],key=edgeKey(a,b);if(edges.some(edge=>edge.key===key))throw Error(`${title} 存在重复参考边 ${key}`);edges.push({a,b,key})}return{id:`r${index+1}`,title,brief,nodes:nodeIds.map(id=>({id,x:positions[id][0],y:positions[id][1]})),edges,reference,start:reference[0],end:reference.at(-1)}}
    const missions=specs.map(buildMission);
    let save=loadSave(),q=null,audio=null,replayToken=0;
    function defaults(){return{version:2,stars:{},routes:{},updatedAt:Date.now()}}
    function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
    function normalize(value){const clean=defaults();if(!value||value.version!==2)return clean;for(const mission of missions){clean.stars[mission.id]=Math.max(0,Math.min(3,Number(value.stars?.[mission.id])||0));if(Array.isArray(value.routes?.[mission.id]))clean.routes[mission.id]=value.routes[mission.id].filter(id=>mission.nodes.some(node=>node.id===id)).slice(0,mission.edges.length+1)}return clean}
    function loadSave(){try{return normalize(JSON.parse(localStorage.getItem(SAVE_KEY)))}catch{return defaults()}}
    function persist(){save.updatedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(save));renderCampaign()}
    function encodeSave(){const body=btoa(unescape(encodeURIComponent(JSON.stringify(save))));return`ROUTE2.${body}.${checksum(body)}`}
    function decodeSave(code){const parts=code.trim().split(".");if(parts.length!==3||parts[0]!=="ROUTE2"||checksum(parts[1])!==parts[2])throw Error("巡线档案校验失败");return normalize(JSON.parse(decodeURIComponent(escape(atob(parts[1])))))}
    function routeKeys(route){const keys=[];for(let index=1;index<route.length;index++)keys.push(edgeKey(route[index-1],route[index]));return keys}
    function validateRoute(mission,route){const keys=routeKeys(route),known=new Set(mission.edges.map(edge=>edge.key));return route[0]===mission.start&&route.at(-1)===mission.end&&keys.length===mission.edges.length&&new Set(keys).size===keys.length&&keys.every(key=>known.has(key))}
    function findCompletion(mission,current,usedInput){const used=new Set(usedInput),byNode=new Map(mission.nodes.map(node=>[node.id,[]]));for(const edge of mission.edges){byNode.get(edge.a).push(edge);byNode.get(edge.b).push(edge)}function search(node){if(used.size===mission.edges.length)return node===mission.end?[node]:null;for(const edge of byNode.get(node)){if(used.has(edge.key))continue;used.add(edge.key);const next=edge.a===node?edge.b:edge.a,result=search(next);if(result)return[node,...result];used.delete(edge.key)}return null}return search(current)}
    function validateContent(){if(missions.length!==12)throw Error("巡线合同数量错误");let edgeCount=0;for(const mission of missions){edgeCount+=mission.edges.length;if(!validateRoute(mission,mission.reference))throw Error(`${mission.id} 参考路线无效`);const degrees=Object.fromEntries(mission.nodes.map(node=>[node.id,0]));mission.edges.forEach(edge=>{degrees[edge.a]++;degrees[edge.b]++});const odd=Object.entries(degrees).filter(([,degree])=>degree%2).map(([id])=>id).sort(),expected=mission.start===mission.end?[]:[mission.start,mission.end].sort();if(odd.join()!==expected.join())throw Error(`${mission.id} 欧拉端点配置错误`);const solved=findCompletion(mission,mission.start,[]);if(!solved||!validateRoute(mission,solved))throw Error(`${mission.id} 求解器失败`)}return{missions:missions.length,referenceRoutes:missions.length,edges:edgeCount,eulerVerified:missions.length}}
    function unlocked(index){return index===0||Number(save.stars[missions[index-1].id])>0}
    function begin(index=0){if(!unlocked(index))return;replayToken++;const mission=missions[index];q={index,mission,route:[mission.start],used:new Set(),undos:0,hints:0,replaying:false,nextHint:null};renderAll();setStatus(`从 ${mission.start} 港出发。点击金色描边的相邻港口，每条航线只能巡检一次。`)}
    function setStatus(text){statusEl.textContent=text}
    function renderCampaign(){const stars=Object.values(save.stars).reduce((sum,n)=>sum+Number(n||0),0),perfect=Object.values(save.stars).filter(n=>n===3).length,edges=missions.reduce((sum,mission)=>sum+(save.stars[mission.id]?mission.edges.length:0),0);$("starTotal").textContent=`${stars} / 36`;$("perfectTotal").textContent=`${perfect} / 12`;$("edgeTotal").textContent=edges}
    function renderMissions(){missionEl.replaceChildren();missions.forEach((mission,index)=>{const button=document.createElement("button"),stars=Number(save.stars[mission.id])||0;button.className=`mission${q?.index===index?" active":""}${unlocked(index)?"":" locked"}`;button.innerHTML=`${String(index+1).padStart(2,"0")}<small>${stars?"★".repeat(stars):""}</small>`;button.disabled=!unlocked(index)||q?.replaying;button.title=mission.title;button.onclick=()=>begin(index);missionEl.append(button)})}
    function availableNodes(){const current=q.route.at(-1);return new Set(q.mission.edges.filter(edge=>!q.used.has(edge.key)&&(edge.a===current||edge.b===current)).map(edge=>edge.a===current?edge.b:edge.a))}
    function svg(type,attributes={}){const element=document.createElementNS(NS,type);for(const[key,value]of Object.entries(attributes))element.setAttribute(key,value);return element}
    function renderMap(){mapEl.replaceChildren();for(let x=0;x<=900;x+=75)mapEl.append(svg("line",{x1:x,y1:0,x2:x,y2:520,class:"grid-line"}));for(let y=0;y<=520;y+=65)mapEl.append(svg("line",{x1:0,y1:y,x2:900,y2:y,class:"grid-line"}));const nodes=Object.fromEntries(q.mission.nodes.map(node=>[node.id,node])),available=availableNodes();for(const edge of q.mission.edges){const a=nodes[edge.a],b=nodes[edge.b],line=svg("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:`edge${q.used.has(edge.key)?" used":""}${q.nextHint===edge.key?" next":""}`});line.dataset.edge=edge.key;mapEl.append(line)}for(const node of q.mission.nodes){const group=svg("g",{class:`node${node.id===q.route.at(-1)?" current":""}${available.has(node.id)?" available":""}${node.id===q.mission.start?" start":""}`,tabindex:"0",role:"button","aria-label":`${node.id} 港`});group.dataset.node=node.id;group.append(svg("circle",{cx:node.x,cy:node.y,r:27}));const text=svg("text",{x:node.x,y:node.y});text.textContent=node.id;group.append(text);group.onclick=()=>travel(node.id);group.onkeydown=event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();travel(node.id)}};mapEl.append(group)}}
    function renderLedger(){ledgerEl.replaceChildren();if(!q.route.length){ledgerEl.innerHTML='<span class="empty">尚未启航</span>';return}q.route.forEach((node,index)=>{if(index){const arrow=document.createElement("span");arrow.className="arrow";arrow.textContent="→";ledgerEl.append(arrow)}const stop=document.createElement("span");stop.className=`stop${index===q.route.length-1?" current":""}`;stop.textContent=node;ledgerEl.append(stop)});ledgerEl.parentElement.scrollLeft=ledgerEl.scrollWidth}
    function renderPanel(){$("title").textContent=`${String(q.index+1).padStart(2,"0")} · ${q.mission.title}`;$("brief").textContent=q.mission.brief;$("goal").textContent=`${q.mission.start} → ${q.mission.end} · ${q.mission.edges.length} 边`;$("endpoint").textContent=`当前 ${q.route.at(-1)} 港 · 目标 ${q.mission.end} 港`;$("covered").textContent=`${q.used.size} / ${q.mission.edges.length}`;$("undos").textContent=q.undos;$("hints").textContent=q.hints;$("undo").disabled=q.route.length<=1||q.replaying;$("hint").disabled=q.replaying;$("inspect").disabled=q.replaying;$("replay").disabled=!save.stars[q.mission.id]||q.replaying}
    function renderAll(){renderCampaign();renderMissions();renderMap();renderLedger();renderPanel()}
    function tone(freq,duration=.08){try{audio??=new AudioContext();const osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=freq;gain.gain.setValueAtTime(.035,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain).connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}catch{}}
    function travel(node,fromHint=false){if(q.replaying)return;const current=q.route.at(-1);if(node===current)return;const key=edgeKey(current,node),edge=q.mission.edges.find(item=>item.key===key);if(!edge){setStatus(`${current} 港与 ${node} 港之间没有直达航线。`);tone(95,.15);return}if(q.used.has(key)){setStatus(`${current}-${node} 航线已经巡检，不能重复经过。`);tone(105,.15);return}q.used.add(key);q.route.push(node);q.nextHint=null;if(fromHint)q.hints++;renderAll();tone(330+q.used.size*18);if(q.used.size===q.mission.edges.length)setStatus(`全部 ${q.used.size} 条航线已覆盖，请提交航图。`);else if(!availableNodes().size)setStatus(`当前停在 ${node} 港且没有未巡航出口，请撤回后改走其他航线。`);else setStatus(`已巡检 ${current}-${node}，剩余 ${q.mission.edges.length-q.used.size} 条航线。`)}
    function undo(){if(q.route.length<=1||q.replaying)return;const node=q.route.pop(),previous=q.route.at(-1);q.used.delete(edgeKey(previous,node));q.undos++;q.nextHint=null;renderAll();setStatus(`已撤回 ${previous}-${node} 航线，可从 ${previous} 港重新规划。`)}
    function hint(){const current=q.route.at(-1),completion=findCompletion(q.mission,current,q.used);if(!completion||completion.length<2){setStatus(q.used.size===q.mission.edges.length?"航图已经完整，可以提交。":"当前路线无法覆盖全部剩余航线，请先撤回。");tone(105,.15);return}q.nextHint=edgeKey(current,completion[1]);renderMap();setStatus(`导航建议：从 ${current} 港前往 ${completion[1]} 港。`);setTimeout(()=>{if(q.nextHint)travel(completion[1],true)},180)}
    function inspect(){if(q.used.size!==q.mission.edges.length){setStatus(`仍有 ${q.mission.edges.length-q.used.size} 条航线未巡检。`);tone(100,.15);return}if(q.route.at(-1)!==q.mission.end){setStatus(`合同要求在 ${q.mission.end} 港交班，当前停在 ${q.route.at(-1)} 港。`);tone(100,.15);return}if(!validateRoute(q.mission,q.route)){setStatus("航图存在重复或无效边，请重新规划。");return}const stars=1+(q.hints<=2?1:0)+(q.hints===0&&q.undos===0?1:0),id=q.mission.id;save.stars[id]=Math.max(Number(save.stars[id])||0,stars);save.routes[id]=[...q.route];persist();renderAll();$("resultTitle").textContent="全线巡检完成";$("resultText").textContent=`${q.mission.edges.length} 条航线均恰好经过一次，巡检舰已在 ${q.mission.end} 港交班。`;$("resultStars").textContent="★".repeat(stars)+"☆".repeat(3-stars);$("next").textContent=q.index<missions.length-1?"下一张航图":"返回总巡";$("result").hidden=false;tone(620,.2)}
    async function replay(){if(q.replaying)return;const route=save.routes[q.mission.id]||q.mission.reference,token=++replayToken;q.replaying=true;q.route=[route[0]];q.used=new Set();renderAll();setStatus("正在回放已验收航图。");for(const node of route.slice(1)){await new Promise(resolve=>setTimeout(resolve,210));if(token!==replayToken)return;const current=q.route.at(-1);q.used.add(edgeKey(current,node));q.route.push(node);renderMap();renderLedger();renderPanel();tone(280+q.used.size*12)}q.replaying=false;renderAll();setStatus("参考航图回放完成。")}
    $("inspect").onclick=inspect;$("hint").onclick=hint;$("undo").onclick=undo;$("reset").onclick=()=>begin(q.index);$("replay").onclick=replay;$("next").onclick=()=>{$("result").hidden=true;begin(Math.min(missions.length-1,q.index+1))};
    $("exportSave").onclick=async()=>{const code=encodeSave();try{await navigator.clipboard.writeText(code);setStatus("ROUTE2 档案码已复制。") }catch{prompt("ROUTE2 档案码",code)}};$("importSave").onclick=()=>{const code=prompt("输入 ROUTE2 档案码");if(!code)return;try{save=decodeSave(code);persist();begin(0);setStatus("巡线档案导入完成。") }catch(error){setStatus(error.message)}};
    addEventListener("keydown",event=>{if(event.code==="Backspace"){event.preventDefault();undo()}if(event.code==="Enter"&&event.target===document.body)inspect()});
    window.__starlineRouteTest={validateContent,validateRoute,findCompletion,missions,getState:()=>({index:q.index,route:[...q.route],used:q.used.size})};validateContent();begin(0);
  })();
  </script>
