  <style>
    :root{--ink:#15242b;--muted:#617177;--paper:#f8f6ed;--line:#93a3a6;--blue:#326f8e;--green:#34735d;--gold:#b1812c;--red:#a94d49;--radius:8px;--shadow:rgba(4,14,20,.3)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:linear-gradient(135deg,#091a28,#283a52 56%,#504348)}button,textarea{font:inherit}.app{width:min(1480px,calc(100vw - 24px));margin:12px auto 28px}.topbar,.panel,.archive{border:1px solid var(--line);border-radius:var(--radius);background:rgba(248,246,237,.97);box-shadow:0 16px 38px var(--shadow)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 19px}.eyebrow{margin:0 0 4px;color:#86621b;font-size:12px;font-weight:900}.topbar h1{margin:0;font-size:clamp(27px,4vw,43px);line-height:1.05}.subtitle{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.actions,.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.actions{justify-content:flex-end}.btn{min-height:42px;padding:0 13px;border:1px solid #285c74;border-radius:var(--radius);color:#fff;background:var(--blue);font-weight:900;cursor:pointer}.btn.secondary{color:var(--ink);background:#efd17a;border-color:#98731f}.btn.ghost{color:var(--ink);background:#e9edeb;border-color:#81918f}.btn:disabled{opacity:.46;cursor:not-allowed}.layout{display:grid;grid-template-columns:225px minmax(520px,1fr) 300px;gap:12px;margin-top:12px;align-items:start}.panel{padding:12px}.panel h2{margin:0 0 9px;font-size:16px}.mission-list{display:grid;gap:6px;max-height:670px;overflow:auto}.mission{width:100%;padding:9px;border:1px solid #a2ada9;border-radius:var(--radius);color:var(--ink);background:#f5f4e9;text-align:left;cursor:pointer}.mission strong,.mission small{display:block}.mission small{margin-top:3px;color:var(--muted);font-size:10px}.mission span{float:right;color:var(--gold)}.mission.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(50,111,142,.18);background:#e5eef2}.mission:disabled{opacity:.45;cursor:not-allowed}.flight-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}.flight-head h2{margin:0;font-size:24px}.flight-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.contract{text-align:right;white-space:nowrap}.contract b{display:block;color:var(--blue);font-size:22px}.stage{position:relative;overflow:hidden;border:1px solid #657b86;border-radius:var(--radius);background:#111b2a;aspect-ratio:16/10}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:22px;background:rgba(10,22,30,.56)}.modal{width:min(460px,100%);padding:20px;border:1px solid #a4b0ad;border-radius:var(--radius);background:#fffdf5;box-shadow:0 22px 48px rgba(0,0,0,.32)}.modal h2{margin:0 0 8px}.modal p{margin:0 0 14px;color:var(--muted);line-height:1.6}.hidden{display:none!important}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.control{min-height:48px;border:1px solid #879894;border-radius:var(--radius);color:var(--ink);background:#edf0e9;font-size:18px;font-weight:900;cursor:pointer;touch-action:none}.control.main{color:#fff;background:var(--blue)}.message{margin-top:7px;min-height:20px;color:var(--muted);font-size:12px;font-weight:800}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{padding:8px;border:1px solid #a2ada9;border-radius:var(--radius);background:#f5f4e9}.stat b{display:block;color:var(--blue);font-size:20px}.stat small{color:var(--muted);font-size:10px;font-weight:800}.meter{margin-top:9px}.meter span{display:flex;justify-content:space-between;font-size:11px;font-weight:900}.bar{height:12px;margin-top:5px;overflow:hidden;border:1px solid #82948f;border-radius:6px;background:#e2e5de}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#83c8b1)}.landers,.modules{display:grid;gap:6px}.lander,.module{padding:8px;border:1px solid #9ba8a4;border-radius:var(--radius);color:var(--ink);background:#f5f4e9;text-align:left;cursor:pointer}.lander strong,.lander small,.module strong,.module small{display:block}.lander small,.module small{margin-top:2px;color:var(--muted);font-size:10px}.lander.active,.module.active{border-color:var(--gold);background:#fff0c3}.goal{margin-top:9px;padding:9px;border:1px solid #a2ada9;border-radius:var(--radius);background:#f5f4e9}.goal-row{display:flex;justify-content:space-between;gap:7px;padding:4px 0;border-bottom:1px solid #d6d8d3;font-size:12px}.goal-row:last-child{border-bottom:0}.goal-row.ok{color:var(--green);font-weight:900}.archive{position:fixed;z-index:20;left:50%;top:50%;width:min(620px,calc(100vw - 26px));padding:18px;transform:translate(-50%,-50%)}.archive h2{margin:0 0 7px}.archive p{margin:0 0 10px;color:var(--muted);font-size:12px}.archive textarea{width:100%;min-height:94px;padding:9px;border:1px solid var(--line);border-radius:var(--radius);resize:vertical}.feedback{min-height:20px;margin-top:7px;color:var(--green);font-size:12px;font-weight:900}@media(max-width:1080px){.layout{grid-template-columns:205px minmax(500px,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}}@media(max-width:760px){.app{width:calc(100vw - 14px);margin-top:7px}.topbar{display:block;padding:14px}.actions{margin-top:11px;justify-content:stretch}.actions .btn{flex:1 1 auto}.layout{grid-template-columns:1fr}.mission-list{grid-template-columns:repeat(3,1fr);max-height:none}.right{grid-column:auto;display:block}.flight-head{display:block}.contract{text-align:left;margin-top:7px}.stage{min-height:0}.controls{grid-template-columns:repeat(2,1fr)}}

<body>
  <main class="app">
    <header class="topbar"><div><p class="eyebrow">PHYSICS LANDING CONTRACTS</p><h1>月面轻降：九站合同</h1><p class="subtitle">不同重力、横风、平台宽度与着陆器装配，让每次下降都需要重新判断姿态和燃料。</p></div><div class="actions"><button class="btn" id="startBtn">开始下降</button><button class="btn secondary" id="referenceBtn">自动示范</button><button class="btn ghost" id="restartBtn">重置合同</button><button class="btn ghost" id="archiveBtn">飞行档案</button></div></header>
    <section class="layout">
      <aside class="panel"><h2>九站合同</h2><div class="mission-list" id="missionList"></div></aside>
      <section class="panel"><div class="flight-head"><div><h2 id="missionTitle"></h2><p id="missionBrief"></p></div><div class="contract"><b>任务 <span id="timeText"></span> 秒</b><span>横风 <strong id="windText"></strong></span></div></div><div class="stage"><canvas id="flightCanvas" width="960" height="600" aria-label="着陆器下降飞行画面"></canvas><div class="overlay" id="overlay"><div class="modal"><h2 id="overlayTitle"></h2><p id="overlayText"></p><button class="btn" id="overlayBtn">进入下降</button></div></div></div><div class="controls"><button class="control" data-control="left">↶ 左转</button><button class="control main" data-control="main">↑ 主推</button><button class="control" data-control="right">右转 ↷</button><button class="control" data-control="stabilize">◇ 扶正</button></div><div class="message" id="message"></div></section>
      <aside class="right"><section class="panel"><h2>飞行遥测</h2><div class="stats" id="stats"></div><div class="meter"><span><b>燃料</b><em id="fuelText"></em></span><div class="bar"><i id="fuelBar"></i></div></div><div class="goal" id="goals"></div></section><section class="panel" style="margin-top:12px"><h2>着陆器</h2><div class="landers" id="landers"></div><h2 style="margin-top:12px">任务模块 · 选 2</h2><div class="modules" id="modules"></div></section></aside>
    </section>
  </main>
  <section class="archive hidden" id="archive"><h2>九站飞行档案</h2><p>档案保存合同解锁、星级和最佳评分，并带有完整性校验。</p><textarea id="archiveText" spellcheck="false"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="copyBtn">生成并复制</button><button class="btn secondary" id="importBtn">导入档案</button><button class="btn ghost" id="closeBtn">关闭</button></div><div class="feedback" id="feedback"></div></section>
  <script>
  (()=>{
    const STORAGE="moonLanderV2",WORLD={w:960,h:600,padY:520},$=id=>document.getElementById(id),canvas=$("flightCanvas"),ctx=canvas.getContext("2d");
    const LANDERS={kestrel:{name:"隼式测绘艇",text:"均衡推力与姿态控制",thrust:104,turn:2.7,fuel:112,burn:1},atlas:{name:"阿特拉斯货舱",text:"燃料充足，转向较慢",thrust:118,turn:2.15,fuel:138,burn:1.12},needle:{name:"银针试验艇",text:"转向灵敏，燃料较少",thrust:98,turn:3.35,fuel:96,burn:.86}};
    const MODULES={reserve:{name:"副燃料舱",text:"燃料 +24%"},gyro:{name:"姿态陀螺",text:"转向响应 +25%"},shield:{name:"缓冲支架",text:"安全速度 +6"},wind:{name:"侧风整流",text:"横风影响 -45%"},boost:{name:"增压喷口",text:"主推力 +12%，耗油 +8%"},beacon:{name:"测距信标",text:"三星精度要求放宽 14"}};
    const MISSIONS=[
      {id:"dust-1",name:"静海初降",region:"静海",brief:"无横风基础合同，熟悉减速与扶正。",gravity:28,wind:0,freq:.45,padX:620,padW:170,start:[175,82,28,0],fuel:108,safe:38,angle:.32,par:24,fuelGoal:30,precision:46},
      {id:"dust-2",name:"曙光返航",region:"静海",brief:"反向初速要求提前建立水平制动。",gravity:30,wind:3,freq:.5,padX:300,padW:145,start:[790,85,-30,2],fuel:108,safe:36,angle:.3,par:25,fuelGoal:28,precision:42},
      {id:"dust-3",name:"环形山哨",region:"静海",brief:"窄平台与周期微风考验末段姿态。",gravity:32,wind:6,freq:.55,padX:705,padW:118,start:[185,78,34,0],fuel:110,safe:34,angle:.28,par:27,fuelGoal:27,precision:35},
      {id:"amber-1",name:"琥珀货运",region:"琥珀谷",brief:"较高重力下使用货舱控制燃料余量。",gravity:36,wind:4,freq:.62,padX:530,padW:140,start:[175,78,24,3],fuel:116,safe:35,angle:.28,par:25,fuelGoal:30,precision:38},
      {id:"amber-2",name:"侧风中继",region:"琥珀谷",brief:"稳定横风持续把着陆器推离平台。",gravity:37,wind:10,freq:.42,padX:735,padW:126,start:[215,80,18,0],fuel:120,safe:34,angle:.27,par:29,fuelGoal:28,precision:34},
      {id:"amber-3",name:"双峰采样",region:"琥珀谷",brief:"初始横移与反向风场同时出现。",gravity:39,wind:-11,freq:.48,padX:335,padW:112,start:[760,82,-20,2],fuel:122,safe:33,angle:.26,par:30,fuelGoal:27,precision:32},
      {id:"night-1",name:"永夜观测",region:"永夜原",brief:"高重力窄台，尽早建立下降剖面。",gravity:42,wind:7,freq:.68,padX:610,padW:105,start:[170,76,27,0],fuel:128,safe:32,angle:.25,par:29,fuelGoal:27,precision:30},
      {id:"night-2",name:"磁暴窗口",region:"永夜原",brief:"强周期横风要求持续修正而非末段猛推。",gravity:44,wind:14,freq:.78,padX:285,padW:100,start:[800,78,-31,1],fuel:132,safe:31,angle:.24,par:32,fuelGoal:25,precision:28},
      {id:"night-3",name:"终环轻降",region:"永夜原",brief:"最高重力与最窄平台的最终认证。",gravity:47,wind:-15,freq:.7,padX:690,padW:94,start:[155,75,32,0],fuel:138,safe:30,angle:.23,par:34,fuelGoal:24,precision:26}
    ];
    function blankProfile(){return{v:2,unlocked:0,stars:Array(9).fill(0),best:Array(9).fill(0),clears:0}}
    function normalize(p){return{v:2,unlocked:Math.max(0,Math.min(8,+p.unlocked||0)),stars:Array.from({length:9},(_,i)=>Math.max(0,Math.min(3,+p.stars?.[i]||0))),best:Array.from({length:9},(_,i)=>Math.max(0,+p.best?.[i]||0)),clears:Math.max(0,+p.clears||0)}}
    function load(){try{const p=JSON.parse(localStorage.getItem(STORAGE)||"null");return p?.v===2?normalize(p):blankProfile()}catch{return blankProfile()}}
    let profile=load(),missionIndex=Math.min(profile.unlocked,8),landerId="kestrel",selectedModules=new Set(["gyro","wind"]),state=makeFlight(missionIndex),keys=new Set(),last=performance.now(),dpr=1,w=960,h=600,token=0;
    function mission(s=state){return MISSIONS[s.mission]}
    function config(lander=landerId,mods=selectedModules,missionId=missionIndex){const base=LANDERS[lander],m=MISSIONS[missionId],has=x=>mods.has(x);return{thrust:base.thrust*(has("boost")?1.12:1),turn:base.turn*(has("gyro")?1.25:1),maxFuel:(m.fuel+base.fuel-108)*(has("reserve")?1.24:1),burn:base.burn*(has("boost")?1.08:1),windScale:has("wind")?.55:1,safe:m.safe+(has("shield")?6:0),precision:m.precision+(has("beacon")?14:0)}}
    function makeFlight(index,lander=landerId,mods=new Set(selectedModules)){const m=MISSIONS[index],cfg=config(lander,mods,index);return{mission:index,lander,modules:new Set(mods),mode:"ready",ship:{x:m.start[0],y:m.start[1],vx:m.start[2],vy:m.start[3],a:0,va:0},fuel:cfg.maxFuel,maxFuel:cfg.maxFuel,time:0,windNow:0,score:0,stars:0,result:null,trail:[],particles:[],message:"按开始下降后，用主推减速、左右转向，接近平台时保持竖直。"}}
    function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
    function groundY(x){return 556-Math.sin(x*.018)*12-Math.sin(x*.041)*5}
    function physicsStep(s,dt,control={},testing=false){if(s.mode!=="running")return s.result;const m=mission(s),cfg=config(s.lander,s.modules,s.mission),ship=s.ship,wind=m.wind*Math.sin(s.time*m.freq+.7)*cfg.windScale;s.windNow=wind;const throttle=s.fuel>0?clamp(+control.main||0,0,1):0,turn=clamp(+control.turn||0,-1,1);ship.va+=turn*cfg.turn*dt;if(control.stabilize)ship.va+=clamp(-ship.a*5-ship.va*2.8,-cfg.turn,cfg.turn)*dt;ship.va*=Math.pow(.36,dt);ship.a+=ship.va*dt;ship.a=clamp(ship.a,-1.1,1.1);if(throttle){ship.vx+=Math.sin(ship.a)*cfg.thrust*throttle*dt;ship.vy-=Math.cos(ship.a)*cfg.thrust*throttle*dt;s.fuel=Math.max(0,s.fuel-cfg.burn*throttle*dt*3.1);s.particles.push({x:ship.x-Math.sin(ship.a)*18,y:ship.y+Math.cos(ship.a)*20,life:1})}ship.vx+=wind*dt;ship.vy+=m.gravity*dt;ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;s.time+=dt;s.trail.push([ship.x,ship.y]);if(s.trail.length>160)s.trail.shift();s.particles=s.particles.filter(p=>{p.y+=42*dt;p.life-=dt*1.6;return p.life>0});if(ship.x<12||ship.x>WORLD.w-12||ship.y<-70)return finishFlight(s,false,"飞行器离开安全走廊",testing);const contactY=WORLD.padY-18;if(ship.y>=contactY&&Math.abs(ship.x-m.padX)<=m.padW/2){const speed=Math.hypot(ship.vx,ship.vy),ok=speed<=cfg.safe&&Math.abs(ship.a)<=m.angle&&ship.vy>=-8;return finishFlight(s,ok,ok?"平台接触稳定":"接触速度或姿态超限",testing)}if(ship.y>=groundY(ship.x)-18)return finishFlight(s,false,"未落在指定平台",testing);return null}
    function resultOf(s){const m=mission(s),cfg=config(s.lander,s.modules,s.mission),speed=Math.hypot(s.ship.vx,s.ship.vy),error=Math.abs(s.ship.x-m.padX),landed=Boolean(s.result?.landed);return{ok:landed,mission:m.id,stars:s.stars,score:s.score,time:+s.time.toFixed(1),fuel:+s.fuel.toFixed(1),speed:+speed.toFixed(1),angle:+Math.abs(s.ship.a).toFixed(3),error:+error.toFixed(1),safe:cfg.safe}}
    function finishFlight(s,landed,reason,testing=false){if(s.mode==="result")return s.result;s.mode="result";const m=mission(s),cfg=config(s.lander,s.modules,s.mission),speed=Math.hypot(s.ship.vx,s.ship.vy),error=Math.abs(s.ship.x-m.padX);s.stars=landed?1+(s.fuel>=m.fuelGoal?1:0)+(s.time<=m.par&&error<=cfg.precision?1:0):0;s.score=landed?Math.max(100,Math.round(1600+s.fuel*9-s.time*13-error*4-speed*3)):0;s.result={landed,reason};s.message=landed?`轻降成功：${s.stars} 星，剩余燃料 ${s.fuel.toFixed(1)}。`:`任务失败：${reason}。`;if(landed&&!testing&&s===state){profile.stars[s.mission]=Math.max(profile.stars[s.mission],s.stars);profile.best[s.mission]=Math.max(profile.best[s.mission],s.score);profile.unlocked=Math.max(profile.unlocked,Math.min(8,s.mission+1));profile.clears++;save();showOverlay("合同完成",`${s.message} 评分 ${s.score}。`,"再次下降")}else if(!testing&&s===state)showOverlay("下降失败",s.message,"重新尝试");return resultOf(s)}
    function autopilot(s){const m=mission(s),cfg=config(s.lander,s.modules,s.mission),ship=s.ship,alt=WORLD.padY-18-ship.y,error=m.padX-ship.x,targetVx=clamp(error*.12,-38,38),windComp=-s.windNow/cfg.thrust,targetAngle=clamp((targetVx-ship.vx)*.026+windComp,-.42,.42),turn=clamp((targetAngle-ship.a)*7-ship.va*3.5,-1,1),targetVy=alt>300?42:alt>170?29:alt>75?17:7,verticalNeed=m.gravity+(ship.vy-targetVy)*2.2,horizontalNeed=Math.abs(targetVx-ship.vx)>8?8:0,main=clamp((verticalNeed+horizontalNeed)/(cfg.thrust*Math.max(.72,Math.cos(ship.a))),0,1);return{main,turn,stabilize:alt<95}}
    function simulateReference(index){const moduleSets=[["gyro","wind"],["reserve","gyro"],["reserve","wind"],["boost","gyro"]];let best=null;for(const lander of Object.keys(LANDERS))for(const mods of moduleSets){const s=makeFlight(index,lander,new Set(mods));s.mode="running";for(let i=0;i<3600&&s.mode==="running";i++){const control=autopilot(s);physicsStep(s,1/60,control,true)}if(s.mode==="running")finishFlight(s,false,"自动示范超时",true);const result={...resultOf(s),lander,modules:mods};if(!best||result.stars>best.stars||result.stars===best.stars&&result.score>best.score)best=result}return best}
    function applyReference(){const ref=simulateReference(missionIndex);landerId=ref.lander;selectedModules=new Set(ref.modules);state=makeFlight(missionIndex,landerId,selectedModules);state.mode="running";for(let i=0;i<3600&&state.mode==="running";i++)physicsStep(state,1/60,autopilot(state),true);state.message=`自动示范：${ref.stars} 星 / ${ref.time} 秒 / ${ref.fuel} 燃料。`;hideOverlay();renderAll();return ref}
    function startFlight(){token++;state=makeFlight(missionIndex,landerId,selectedModules);state.mode="running";hideOverlay();last=performance.now();renderAll()}
    function validateContent(){const errors=[],refs=[];for(let i=0;i<MISSIONS.length;i++){const result=simulateReference(i);refs.push(result);if(!result.ok||result.stars!==3)errors.push(`reference ${i}: ${JSON.stringify(result)}`)}return{valid:errors.length===0,errors,missions:MISSIONS.length,regions:3,landers:Object.keys(LANDERS).length,modules:Object.keys(MODULES).length,references:refs.length}}
    function save(){localStorage.setItem(STORAGE,JSON.stringify(profile))}
    function selectMission(index,force=false){if(index<0||index>8||(!force&&index>profile.unlocked))return false;missionIndex=index;state=makeFlight(index);showReady();renderAll();return true}
    function selectLander(id){if(!LANDERS[id]||state.mode==="running")return false;landerId=id;state=makeFlight(missionIndex);showReady();renderAll();return true}
    function toggleModule(id){if(!MODULES[id]||state.mode==="running")return false;if(selectedModules.has(id))selectedModules.delete(id);else{if(selectedModules.size>=2)return false;selectedModules.add(id)}state=makeFlight(missionIndex);showReady();renderAll();return true}
    function checksum(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
    function encode(){const payload=btoa(unescape(encodeURIComponent(JSON.stringify({v:2,u:profile.unlocked,s:profile.stars,b:profile.best,c:profile.clears}))));return`LANDER2.${payload}.${checksum(payload)}`}
    function decode(code){const p=String(code).trim().split(".");if(p.length!==3||p[0]!=="LANDER2"||checksum(p[1])!==p[2])throw Error("飞行档案校验失败");const data=JSON.parse(decodeURIComponent(escape(atob(p[1]))));if(data.v!==2)throw Error("飞行档案版本不兼容");return normalize({v:2,unlocked:data.u,stars:data.s,best:data.b,clears:data.c})}
    function showOverlay(title,text,button){$("overlayTitle").textContent=title;$("overlayText").textContent=text;$("overlayBtn").textContent=button;$("overlay").classList.remove("hidden")}
    function hideOverlay(){$("overlay").classList.add("hidden")}
    function showReady(){const m=MISSIONS[missionIndex];showOverlay(`${m.region} · ${m.name}`,`${m.brief} 安全速度 ${m.safe}，安全倾角 ${Math.round(m.angle*57.3)}°。`,"进入下降")}
    function resize(){const r=canvas.getBoundingClientRect();dpr=Math.max(1,Math.min(2,devicePixelRatio||1));w=Math.max(320,r.width);h=Math.max(300,r.height);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
    function sx(x){return x/WORLD.w*w}function sy(y){return y/WORLD.h*h}
    function draw(){ctx.clearRect(0,0,w,h);const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,"#101927");bg.addColorStop(1,"#28354a");ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.fillStyle="rgba(255,255,255,.18)";for(let i=0;i<90;i++)ctx.fillRect((i*83)%w,(i*47)%h,2,2);const m=mission();ctx.fillStyle="#cabb96";ctx.beginPath();ctx.moveTo(0,h);for(let x=0;x<=WORLD.w;x+=16)ctx.lineTo(sx(x),sy(groundY(x)));ctx.lineTo(w,h);ctx.fill();ctx.fillStyle="#82c7b1";ctx.fillRect(sx(m.padX-m.padW/2),sy(WORLD.padY),sx(m.padW),Math.max(8,sy(12)));ctx.fillStyle="#173c3b";ctx.font=`900 ${Math.max(10,w*.013)}px system-ui`;ctx.textAlign="center";ctx.fillText("LAND",sx(m.padX),sy(WORLD.padY)+12);if(state.trail.length>1){ctx.strokeStyle="rgba(239,209,122,.48)";ctx.lineWidth=2;ctx.beginPath();state.trail.forEach((p,i)=>i?ctx.lineTo(sx(p[0]),sy(p[1])):ctx.moveTo(sx(p[0]),sy(p[1])));ctx.stroke()}for(const p of state.particles){ctx.globalAlpha=p.life;ctx.fillStyle="#efd17a";ctx.beginPath();ctx.arc(sx(p.x),sy(p.y),4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}const s=state.ship;ctx.save();ctx.translate(sx(s.x),sy(s.y));ctx.rotate(s.a);ctx.strokeStyle="#82c7b1";ctx.lineWidth=3;ctx.fillStyle="#fffdf4";ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(15,16);ctx.lineTo(-15,16);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle="#326f8e";ctx.fillRect(-7,-2,14,9);ctx.restore();const wind=state.windNow;ctx.fillStyle=wind>=0?"#8ac9db":"#efd17a";ctx.font=`900 ${Math.max(12,w*.017)}px system-ui`;ctx.textAlign="left";ctx.fillText(`${wind>=0?"→":"←"} ${Math.abs(wind).toFixed(1)}`,14,24)}
    function renderMissionList(){$("missionList").innerHTML=MISSIONS.map((m,i)=>`<button class="mission ${i===missionIndex?"active":""}" data-mission="${i}" ${i>profile.unlocked?"disabled":""}><span>${profile.stars[i]?"★".repeat(profile.stars[i]):i<=profile.unlocked?"待飞":"锁定"}</span><strong>${i+1}. ${m.name}</strong><small>${m.region} · G ${m.gravity} · 风 ${Math.abs(m.wind)}</small></button>`).join("");$("missionList").querySelectorAll("[data-mission]").forEach(b=>b.onclick=()=>selectMission(+b.dataset.mission))}
    function renderRight(){const m=mission(),cfg=config(state.lander,state.modules,state.mission),speed=Math.hypot(state.ship.vx,state.ship.vy),error=Math.abs(state.ship.x-m.padX),landed=Boolean(state.result?.landed);$("stats").innerHTML=[["速度",speed.toFixed(1)],["倾角",Math.round(Math.abs(state.ship.a)*57.3)+"°"],["高度",Math.max(0,Math.round(WORLD.padY-state.ship.y))],["平台偏差",Math.round(error)],["安全速度",cfg.safe],["评分",state.score]].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join("");$("fuelText").textContent=`${state.fuel.toFixed(1)} / ${state.maxFuel.toFixed(0)}`;$("fuelBar").style.width=`${clamp(state.fuel/state.maxFuel*100,0,100)}%`;const rows=[["安全着陆",landed],[`燃料 ≥ ${m.fuelGoal}`,state.fuel>=m.fuelGoal],[`${m.par} 秒内且偏差 ≤ ${cfg.precision}`,state.time<=m.par&&error<=cfg.precision]];$("goals").innerHTML=rows.map(x=>`<div class="goal-row ${x[1]?"ok":""}"><span>${x[0]}</span><b>${x[1]?"达成":"未达"}</b></div>`).join("")}
    function renderAll(){const m=mission();renderMissionList();renderRight();$("landers").innerHTML=Object.entries(LANDERS).map(([id,l])=>`<button class="lander ${landerId===id?"active":""}" data-lander="${id}" ${state.mode==="running"?"disabled":""}><strong>${l.name}</strong><small>${l.text}</small></button>`).join("");$("landers").querySelectorAll("[data-lander]").forEach(b=>b.onclick=()=>selectLander(b.dataset.lander));$("modules").innerHTML=Object.entries(MODULES).map(([id,m])=>`<button class="module ${selectedModules.has(id)?"active":""}" data-module="${id}" ${state.mode==="running"?"disabled":""}><strong>${m.name}</strong><small>${m.text}</small></button>`).join("");$("modules").querySelectorAll("[data-module]").forEach(b=>b.onclick=()=>{if(!toggleModule(b.dataset.module)){state.message="最多装配两个任务模块。";renderAll()}});$("missionTitle").textContent=`${m.region} · ${m.name}`;$("missionBrief").textContent=m.brief;$("timeText").textContent=state.time.toFixed(1);$("windText").textContent=`${state.windNow>=0?"东":"西"} ${Math.abs(state.windNow).toFixed(1)}`;$("message").textContent=state.message;$("startBtn").disabled=state.mode==="running";draw()}
    function playerControl(){return{main:keys.has("main")||keys.has("ArrowUp")||keys.has("KeyW")?1:0,turn:(keys.has("right")||keys.has("ArrowRight")||keys.has("KeyD")?1:0)-(keys.has("left")||keys.has("ArrowLeft")||keys.has("KeyA")?1:0),stabilize:keys.has("stabilize")||keys.has("ArrowDown")||keys.has("KeyS")}}
    function loop(now){const dt=Math.min(.033,(now-last)/1000||.016);last=now;if(state.mode==="running"){physicsStep(state,dt,playerControl());renderAll()}requestAnimationFrame(loop)}
    document.querySelectorAll("[data-control]").forEach(b=>{const key=b.dataset.control;b.addEventListener("pointerdown",e=>{e.preventDefault();keys.add(key);try{b.setPointerCapture?.(e.pointerId)}catch{}});for(const event of ["pointerup","pointercancel","lostpointercapture"])b.addEventListener(event,()=>keys.delete(key))});document.addEventListener("keydown",e=>{keys.add(e.code);if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();if(e.code==="KeyR")startFlight()});document.addEventListener("keyup",e=>keys.delete(e.code));window.addEventListener("blur",()=>keys.clear());window.addEventListener("resize",resize);$("startBtn").onclick=startFlight;$("overlayBtn").onclick=startFlight;$("restartBtn").onclick=()=>selectMission(missionIndex,true);$("referenceBtn").onclick=applyReference;$("archiveBtn").onclick=()=>{$("archiveText").value=encode();$("feedback").textContent="";$("archive").classList.remove("hidden")};$("closeBtn").onclick=()=>$("archive").classList.add("hidden");$("copyBtn").onclick=async()=>{$("archiveText").value=encode();$("archiveText").select();try{await navigator.clipboard.writeText($("archiveText").value);$("feedback").textContent="档案已复制。"}catch{$("feedback").textContent="档案已生成，请手动复制。"}};$("importBtn").onclick=()=>{try{profile=decode($("archiveText").value);save();missionIndex=Math.min(profile.unlocked,8);state=makeFlight(missionIndex);$("feedback").textContent="导入成功。";showReady();renderAll()}catch(error){$("feedback").textContent=error.message}};
    window.__moonLander={MISSIONS,LANDERS,MODULES,profile:()=>profile,state:()=>state,selectMission,selectLander,toggleModule,physicsStep,autopilot,simulateReference,applyReference,startFlight,validateContent,encode,decode,renderAll};resize();showReady();renderAll();requestAnimationFrame(loop);
  })();
  </script>
