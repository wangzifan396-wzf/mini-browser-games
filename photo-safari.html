  <style>
    :root{color-scheme:dark;--bg:#0b1714;--panel:#173027;--panel2:#0e221c;--line:#426858;--text:#f0f6ed;--muted:#abc4b7;--gold:#ffd06b;--green:#69d894;--red:#ff757d;--blue:#73bee6}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -15%,#365b43,#08120f 48%);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}button,input,textarea{font:inherit;color:inherit}.app{width:min(1320px,100%);margin:auto;padding:10px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:9px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:clamp(23px,3.6vw,36px)}.sub{margin-top:3px;color:var(--muted);font-size:10px;line-height:1.5}.stats{display:flex;gap:6px;flex-wrap:wrap}.stat{min-width:78px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#091a15}.stat small{display:block;color:var(--muted);font-size:8px}.stat b{color:var(--gold);font-size:16px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:9px;margin-top:9px}.panel{border:1px solid var(--line);border-radius:9px;background:rgba(23,48,39,.97)}.camera{padding:8px;min-width:0}.camera-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:7px}.camera-head h2{margin:0;font-size:17px}.camera-head p{margin:3px 0 0;color:var(--muted);font-size:9px}.chapter{padding:4px 7px;border:1px solid var(--blue);border-radius:5px;color:var(--blue);font-size:8px;font-weight:900}.canvas-wrap{position:relative;overflow:hidden;border:2px solid #587366;border-radius:8px;background:#18372a}canvas{display:block;width:100%;aspect-ratio:16/9;touch-action:none}.reticle{position:absolute;width:74px;height:74px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 1px #000,0 0 18px #0008}.reticle::before,.reticle::after{content:"";position:absolute;background:#fff}.reticle::before{left:50%;top:-9px;width:1px;height:90px}.reticle::after{left:-9px;top:50%;width:90px;height:1px}.behavior-tag{position:absolute;left:10px;top:10px;padding:5px 7px;border-radius:5px;background:#07130fcf;color:var(--gold);font-size:9px;pointer-events:none}.controls{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.btn{min-height:40px;padding:8px 9px;border:1px solid #527a68;border-radius:6px;background:#2c5143;font-weight:900;cursor:pointer}.btn:hover{filter:brightness(1.13)}.btn:disabled{opacity:.38}.btn.primary{border-color:var(--gold);background:var(--gold);color:#342600}.btn.blue{border-color:var(--blue);background:var(--blue);color:#071824}.zoom{display:flex;align-items:center;gap:7px;flex:1 1 220px;min-height:40px;padding:0 9px;border:1px solid #456c5c;border-radius:6px;background:#10251e}.zoom label{font-size:9px}.zoom input{flex:1;accent-color:var(--gold)}.message{min-height:42px;margin-top:7px;padding:8px;border-left:3px solid var(--gold);background:#0a1a15;font-size:9px;line-height:1.5}.side{display:flex;flex-direction:column;gap:7px}.section{padding:9px}.section h2{margin:0 0 7px;font-size:14px}.mission{padding:8px;border:1px solid #3d6655;border-radius:6px;background:#10251e}.mission+.mission{margin-top:5px}.mission.done{border-color:var(--green)}.mission header{display:flex;justify-content:space-between;gap:5px}.mission small{display:block;color:var(--muted);font-size:8px;line-height:1.45}.mission strong{color:var(--gold)}.timeline{max-height:190px;overflow:auto}.encounter{display:grid;grid-template-columns:27px 1fr auto;gap:5px;align-items:center;padding:5px;border-bottom:1px solid #ffffff0c;font-size:8px}.encounter.current{background:#294d3e}.encounter.goal b{color:var(--gold)}.encounter span{font-size:19px}.encounter em{color:var(--muted);font-style:normal}.photos{max-height:170px;overflow:auto}.photo{display:grid;grid-template-columns:27px 1fr auto;gap:5px;align-items:center;padding:5px 0;border-bottom:1px solid #ffffff0c;font-size:8px}.photo span{font-size:20px}.photo b{color:var(--gold)}.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:12px;background:#08130ff2}.overlay.hidden{display:none}.modal{width:min(960px,100%);max-height:93vh;overflow:auto;padding:15px;border:1px solid #527564;border-radius:9px;background:#173027}.modal h2{margin:0 0 5px;font-size:25px}.modal>p{margin:0 0 11px;color:var(--muted);font-size:10px;line-height:1.55}.surveys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.survey{text-align:left;min-height:132px;padding:9px;border:1px solid #426b59;border-radius:7px;background:#10261e;cursor:pointer}.survey:disabled{opacity:.35}.survey span{font-size:28px}.survey h3{margin:4px 0;font-size:13px}.survey p{margin:0;color:var(--muted);font-size:8px;line-height:1.45}.stars{color:var(--gold)}.savebox{width:100%;height:130px;padding:8px;border:1px solid #527361;background:#091712}.result{padding:12px;border:1px solid #426b59;border-radius:7px;background:#0c1e18}.result strong{color:var(--gold);font-size:24px}.result ul{padding-left:18px;color:var(--muted);font-size:9px;line-height:1.7}.toast{position:fixed;left:50%;bottom:17px;z-index:50;transform:translateX(-50%);padding:8px 12px;border:1px solid var(--gold);border-radius:6px;background:#10251e;font-size:9px}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.side .panel:last-child{grid-column:1/-1}}@media(max-width:580px){.app{padding:5px}.top{align-items:flex-start;flex-direction:column}.stats{width:100%}.stat{flex:1;min-width:62px}.camera{padding:5px}.camera-head{display:block}.chapter{display:inline-block;margin-top:4px}.side{display:flex}.controls{display:grid;grid-template-columns:repeat(2,1fr)}.zoom{grid-column:1/-1}.surveys{grid-template-columns:1fr}.survey{min-height:105px}.reticle{width:58px;height:58px}.reticle::before{height:70px}.reticle::after{width:70px}.modal{padding:10px}}

<body>
<main class="app">
  <header class="top"><div><h1>荒野摄影师：十二次生态调查</h1><div class="sub">阅读踪迹与行为窗口，用有限快门记录物种、关键行为和栖息地证据；观察优先于追逐。</div></div><div class="stats"><div class="stat"><small>调查</small><b id="surveyStat">1 / 12</b></div><div class="stat"><small>时间</small><b id="timeStat">0 / 45s</b></div><div class="stat"><small>快门</small><b id="shotStat">0 / 8</b></div><div class="stat"><small>证据</small><b id="evidenceStat">0 / 3</b></div><div class="stat"><small>最佳</small><b id="starStat">☆☆☆</b></div></div></header>
  <section class="layout">
    <section class="panel camera"><div class="camera-head"><div><h2 id="surveyTitle"></h2><p id="surveyBrief"></p></div><span class="chapter" id="chapterLabel"></span></div><div class="canvas-wrap"><canvas id="canvas" width="960" height="540" aria-label="野生动物取景画面"></canvas><div class="reticle" id="reticle"></div><div class="behavior-tag" id="behaviorTag">等待踪迹</div></div><div class="controls"><button class="btn primary" id="playBtn">开始观察</button><button class="btn" id="stepBtn">等待 1 秒</button><button class="btn blue" id="shutterBtn">按下快门</button><button class="btn" id="hintBtn">追踪提示</button><button class="btn" id="submitBtn">提交调查</button><button class="btn" id="resetBtn">重新调查</button><button class="btn" id="archiveBtn">档案码</button><button class="btn" id="mapBtn">调查簿</button><div class="zoom"><label>焦距 <b id="zoomText">1.0×</b></label><input id="zoomRange" type="range" min="10" max="24" value="10" aria-label="调整焦距"></div></div><div class="message" id="message"></div></section>
    <aside class="side"><section class="panel section"><h2>必要证据</h2><div id="missions"></div></section><section class="panel section"><h2>踪迹时间线</h2><div class="timeline" id="timeline"></div></section><section class="panel section"><h2>精选底片</h2><div class="photos" id="photos"></div></section></aside>
  </section>
</main>
<div class="overlay" id="mapOverlay"><section class="modal"><h2>十二次生态调查</h2><p>每次调查有六段可复现踪迹与三项必要行为证据。完整记录可推进下一站；三星要求有限快门内完成、三项证据均达到 90 分且不使用追踪提示。设计借鉴“观察与保护驱动探索”的公开理念，不复制任何素材或关卡。</p><div class="surveys" id="surveys"></div><div class="controls"><button class="btn" id="mapArchiveBtn">查看档案码</button></div></section></div>
<div class="overlay hidden" id="infoOverlay"><section class="modal"><h2 id="infoTitle"></h2><div id="infoBody"></div><div class="controls"><button class="btn primary" id="closeInfoBtn">返回</button></div></section></div>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),SAVE="photoSafariSurveyV2",LEGACY="photoSafariV3",canvas=$("canvas"),ctx=canvas.getContext("2d");
const SPECIES=[
{n:"草原兔",i:"🐇",behavior:"竖耳警戒",habitat:"草原",speed:1.0},{n:"梅花鹿",i:"🦌",behavior:"回首张望",habitat:"草原",speed:.75},{n:"野马",i:"🐎",behavior:"群体奔跑",habitat:"草原",speed:1.35},{n:"金雕",i:"🦅",behavior:"低空俯冲",habitat:"草原",speed:1.55},
{n:"赤狐",i:"🦊",behavior:"伏地潜行",habitat:"森林",speed:1.1},{n:"棕熊",i:"🐻",behavior:"翻木觅食",habitat:"森林",speed:.55},{n:"啄木鸟",i:"🐦",behavior:"啄击树干",habitat:"森林",speed:.9},{n:"白狼",i:"🐺",behavior:"仰首嚎叫",habitat:"森林",speed:1.15},
{n:"岩羊",i:"🐐",behavior:"跃上岩台",habitat:"峡谷",speed:1.0},{n:"沙猫",i:"🐈",behavior:"贴岩伏击",habitat:"峡谷",speed:1.2},{n:"蜥蜴",i:"🦎",behavior:"展背晒暖",habitat:"峡谷",speed:.5},{n:"峡谷鹰",i:"🦅",behavior:"逆风盘旋",habitat:"峡谷",speed:1.45},
{n:"雪兔",i:"🐰",behavior:"踏雪跳跃",habitat:"高原",speed:1.1},{n:"牦牛",i:"🐂",behavior:"刨雪取食",habitat:"高原",speed:.5},{n:"雪豹",i:"🐆",behavior:"岩脊凝视",habitat:"高原",speed:1.25},{n:"白枭",i:"🦉",behavior:"静默展翼",habitat:"高原",speed:1.3},
{n:"水獭",i:"🦦",behavior:"水面翻滚",habitat:"湿地",speed:1.0},{n:"火烈鸟",i:"🦩",behavior:"同步群舞",habitat:"湿地",speed:.65},{n:"鳄鱼",i:"🐊",behavior:"缓慢出水",habitat:"湿地",speed:.45},{n:"蓝鹭",i:"🪿",behavior:"俯身捕鱼",habitat:"湿地",speed:.85},
{n:"树懒",i:"🦥",behavior:"缓慢苏醒",habitat:"雨林",speed:.3},{n:"黑豹",i:"🐈‍⬛",behavior:"跃过枝隙",habitat:"雨林",speed:1.4},{n:"巨嘴鸟",i:"🦜",behavior:"振翅鸣叫",habitat:"雨林",speed:1.0},{n:"月蛾",i:"🦋",behavior:"绕花发光",habitat:"雨林",speed:.8}
];
const REGIONS=[{n:"晨曦草原",icon:"🌾",chapter:"踪迹入门",colors:["#789b65","#d6bb74"]},{n:"雾雨森林",icon:"🌲",chapter:"遮挡观察",colors:["#315c46","#71875b"]},{n:"赤岩峡谷",icon:"🏜️",chapter:"运动追焦",colors:["#a36446","#d29a62"]},{n:"雪线高原",icon:"🏔️",chapter:"稀有静候",colors:["#6f8d98","#d6e3e4"]},{n:"潮汐湿地",icon:"🌊",chapter:"潮窗行为",colors:["#36767b","#83a987"]},{n:"星夜雨林",icon:"🌌",chapter:"低光终章",colors:["#24384b","#285a48"]}];
const configs=[
{r:0,n:"晨线初识",brief:"跟随草痕识别停驻与奔跑的差异。",seed:11},{r:0,n:"迁徙边缘",brief:"在逆光草坡记录快速物种的行为窗口。",seed:23},{r:1,n:"雾林足迹",brief:"动物只会在树隙间短暂显露完整姿态。",seed:37},{r:1,n:"林冠回声",brief:"观察树干与林冠声源，提前等候行为。",seed:49},{r:2,n:"赤岩风口",brief:"用焦距和预判追踪横穿峡谷的动物。",seed:61},{r:2,n:"暮色岩台",brief:"光线下降前记录伏击、晒暖与盘旋。",seed:73},{r:3,n:"雪线静候",brief:"稀有物种警觉，快门必须留给关键姿态。",seed:89},{r:3,n:"高原风暴",brief:"风雪缩短观察窗，先读时间线再构图。",seed:101},{r:4,n:"潮窗初涨",brief:"潮位依次唤醒水面、浅滩与芦苇物种。",seed:113},{r:4,n:"芦苇归巢",brief:"在交叠踪迹中分辨捕鱼与群舞时刻。",seed:127},{r:5,n:"雨林薄暮",brief:"低光下的动作需要更准确的中心与焦距。",seed:139},{r:5,n:"星夜萤路",brief:"完成最终夜行图鉴，不惊扰任何目标。",seed:151}
];
function randomAt(seed,index){let x=(seed+Math.imul(index+1,0x9e3779b1))>>>0;x+=0x6d2b79f5;x=Math.imul(x^x>>>15,x|1);x^=x+Math.imul(x^x>>>7,x|61);return((x^x>>>14)>>>0)/4294967296}
function clamp(value,min,max){return Math.max(min,Math.min(max,value))}
function prepare(config,index){const encounters=[];for(let i=0;i<6;i++){const species=config.r*4+(i+Math.floor(randomAt(config.seed,1)*4))%4,start=2+i*6+randomAt(config.seed,i+2)*1.4,duration=8+randomAt(config.seed,i+12)*2.5,fromLeft=(i+config.seed)%2===0,y=115+(i%3)*140+randomAt(config.seed,i+22)*45,scale=.82+randomAt(config.seed,i+32)*.42,behaviorStart=start+2.2+randomAt(config.seed,i+42)*1.5,behaviorDuration=2.2;encounters.push({id:`E${i+1}`,species,start,duration,x0:fromLeft?-80:1040,x1:fromLeft?1040:-80,y,scale,behaviorStart,behaviorDuration})}const goals=[encounters[1],encounters[3],encounters[4]].map(encounter=>encounter.id);return{...config,index,icon:REGIONS[config.r].icon,chapter:REGIONS[config.r].chapter,encounters,goals,timeLimit:43,shotLimit:6,targetScore:270}}
const SURVEYS=configs.map(prepare);
let profile={v:2,unlocked:1,stars:Array(12).fill(0),bestScore:Array(12).fill(0),clears:Array(12).fill(0),dex:[],legacyDex:0},q=null,running=false,last=0,raf=null,reticle={x:480,y:270},zoom=1;
function animalAt(encounter,time){if(time<encounter.start||time>encounter.start+encounter.duration)return null;const species=SPECIES[encounter.species],progress=(time-encounter.start)/encounter.duration,eased=progress<.5?2*progress*progress:1-Math.pow(-2*progress+2,2)/2,x=encounter.x0+(encounter.x1-encounter.x0)*eased,y=encounter.y+Math.sin(progress*Math.PI*2)*16*species.speed,behavior=time>=encounter.behaviorStart&&time<=encounter.behaviorStart+encounter.behaviorDuration;return{x,y,behavior,progress,scale:encounter.scale,speed:species.speed}}
function optimalZoom(encounter){return clamp(1.45/encounter.scale,1,2.4)}
function scoreShot(survey,encounter,time,aim,shotZoom){const animal=animalAt(encounter,time);if(!animal)return{valid:false,score:0,reason:"主体不在观察窗"};const distance=Math.hypot(aim.x-animal.x,aim.y-animal.y),center=Math.max(0,42-distance/4),zoomScore=Math.max(0,23-Math.abs(shotZoom-optimalZoom(encounter))*18),behavior=animal.behavior?25:0,clarity=Math.max(0,10-(animal.speed>1.2&&!animal.behavior?5:0)),score=Math.round(clamp(center+zoomScore+behavior+clarity,0,100));return{valid:distance<150/shotZoom,score,behavior:animal.behavior,distance,zoom:shotZoom,reason:animal.behavior?`${SPECIES[encounter.species].behavior} · 构图 ${Math.round(center)}`:`普通活动 · 构图 ${Math.round(center)}`}}
function fresh(index){return{v:2,survey:index,time:0,shots:0,photos:[],hints:0,finished:false,message:"先阅读踪迹时间线。开始观察后移动取景圈，调整焦距，在行为窗口按下快门。"}}
function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
function encodeArchive(){const clean=q?{...q}:null,payload=btoa(unescape(encodeURIComponent(JSON.stringify({v:2,profile,q:clean}))));return`PHOTO2.${payload}.${checksum(payload)}`}
function decodeArchive(code){const match=String(code).trim().match(/^PHOTO2\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/);if(!match||checksum(match[1])!==match[2])throw Error("档案校验失败");const data=JSON.parse(decodeURIComponent(escape(atob(match[1]))));if(data.v!==2||!Array.isArray(data.profile?.stars))throw Error("档案版本不兼容");return data}
function save(){localStorage.setItem(SAVE,JSON.stringify({v:2,profile,q}))}
function load(){try{const data=JSON.parse(localStorage.getItem(SAVE));if(data?.v===2){profile={...profile,...data.profile};q=data.q}else{const legacy=JSON.parse(localStorage.getItem(LEGACY));if(legacy?.v===3)profile.legacyDex=(legacy.profile?.dex||legacy.dex||[]).length}}catch{}}
function bestFor(encounterId,photos=q.photos){return photos.filter(photo=>photo.encounter===encounterId).sort((a,b)=>b.score-a.score)[0]||null}
function evaluate(index,photos,hints=0,shots=photos.length){const survey=SURVEYS[index],goals=survey.goals.map(id=>{const encounter=survey.encounters.find(item=>item.id===id),best=bestFor(id,photos);return{id,encounter,best,pass:Boolean(best&&best.behavior&&best.score>=75)}}),complete=goals.every(goal=>goal.pass),score=goals.reduce((sum,goal)=>sum+(goal.best?.score||0),0),limited=shots<=survey.shotLimit,excellent=goals.every(goal=>(goal.best?.score||0)>=90);return{complete,score,goals,limited,excellent,shots,stars:complete?1+(limited&&score>=survey.targetScore?1:0)+(limited&&excellent&&hints===0?1:0):0}}
function referenceResult(index){const survey=SURVEYS[index],photos=survey.goals.map(id=>{const encounter=survey.encounters.find(item=>item.id===id),time=encounter.behaviorStart+encounter.behaviorDuration/2,animal=animalAt(encounter,time),result=scoreShot(survey,encounter,time,{x:animal.x,y:animal.y},optimalZoom(encounter));return{encounter:id,species:encounter.species,time,score:result.score,behavior:result.behavior,reason:result.reason}});return{...evaluate(index,photos,0,photos.length),photos}}
function validateContent(){const errors=[],used=new Set(),references=[];for(const survey of SURVEYS){for(const encounter of survey.encounters)used.add(encounter.species);const ids=new Set(survey.encounters.map(item=>item.id));if(ids.size!==survey.encounters.length)errors.push(`${survey.n} 遭遇 ID 重复`);if(survey.goals.some(id=>!ids.has(id)))errors.push(`${survey.n} 目标悬空`);if(new Set(survey.goals.map(id=>survey.encounters.find(item=>item.id===id).species)).size!==3)errors.push(`${survey.n} 必要证据必须覆盖三个不同物种`);const result=referenceResult(survey.index);references.push({name:survey.n,score:result.score,shots:result.shots,stars:result.stars});if(result.stars!==3)errors.push(`${survey.n} 参考摄影未三星：${result.score}`)}return{valid:!errors.length,errors,surveys:SURVEYS.length,encounters:SURVEYS.reduce((sum,survey)=>sum+survey.encounters.length,0),species:used.size,references}}
function startSurvey(index){stop();q=fresh(index);reticle={x:480,y:270};zoom=1;$("mapOverlay").classList.add("hidden");$("infoOverlay").classList.add("hidden");save();drawUI();render()}
function stop(){running=false;cancelAnimationFrame(raf);raf=null;$("playBtn").textContent="开始观察"}
function play(){if(q.finished)return;if(running)return stop();running=true;last=performance.now();$("playBtn").textContent="暂停观察";raf=requestAnimationFrame(loop)}
function advance(seconds){if(q.finished)return;q.time=clamp(q.time+seconds,0,SURVEYS[q.survey].timeLimit);if(q.time>=SURVEYS[q.survey].timeLimit){stop();q.message="调查时限结束，可以提交已有证据或重新调查。"}drawUI();render();save()}
function loop(now){if(!running)return;const dt=Math.min(.05,(now-last)/1000);last=now;q.time+=dt;if(q.time>=SURVEYS[q.survey].timeLimit){q.time=SURVEYS[q.survey].timeLimit;stop();q.message="调查时限结束，可以提交已有证据或重新调查。";drawUI();render();return}drawUI();render();raf=requestAnimationFrame(loop)}
function shoot(){if(q.finished)return;const survey=SURVEYS[q.survey];if(q.shots>=survey.shotLimit)return toast("胶卷已经用完");const active=survey.encounters.map(encounter=>({encounter,animal:animalAt(encounter,q.time)})).filter(item=>item.animal).sort((a,b)=>Math.hypot(reticle.x-a.animal.x,reticle.y-a.animal.y)-Math.hypot(reticle.x-b.animal.x,reticle.y-b.animal.y))[0];q.shots++;if(!active){q.message="快门落空：当前取景圈内没有清晰主体。";tone(110);drawUI();save();return}const result=scoreShot(survey,active.encounter,q.time,reticle,zoom);if(!result.valid){q.message="主体偏离取景圈，照片无法作为调查证据。";tone(120);drawUI();save();return}const photo={encounter:active.encounter.id,species:active.encounter.species,time:q.time,score:result.score,behavior:result.behavior,reason:result.reason},prior=bestFor(photo.encounter);if(!prior||photo.score>prior.score){q.photos=q.photos.filter(item=>item.encounter!==photo.encounter);q.photos.push(photo)}q.message=`记录 ${SPECIES[photo.species].n}：${photo.score} 分 · ${photo.behavior?SPECIES[photo.species].behavior:"普通活动"}`;tone(photo.behavior?680:320);drawUI();save()}
function hint(){const survey=SURVEYS[q.survey],next=survey.goals.map(id=>survey.encounters.find(item=>item.id===id)).find(encounter=>!bestFor(encounter.id)||!bestFor(encounter.id).behavior);if(!next)return toast("必要行为证据已经齐全");stop();q.time=next.behaviorStart+next.behaviorDuration/2;const animal=animalAt(next,q.time);reticle={x:animal.x,y:animal.y};zoom=optimalZoom(next);q.hints++;q.message=`踪迹提示：${SPECIES[next.species].n} 即将出现“${SPECIES[next.species].behavior}”。`;drawUI();render();save()}
function submit(){stop();const result=evaluate(q.survey,q.photos,q.hints,q.shots),survey=SURVEYS[q.survey];if(!result.complete){q.message=`证据不足：必要行为记录 ${result.goals.filter(goal=>goal.pass).length}/3。`;drawUI();return}q.finished=true;const old=profile.stars[q.survey]||0;profile.stars[q.survey]=Math.max(old,result.stars);profile.bestScore[q.survey]=Math.max(profile.bestScore[q.survey]||0,result.score);profile.clears[q.survey]=(profile.clears[q.survey]||0)+1;profile.unlocked=Math.max(profile.unlocked,Math.min(12,q.survey+2));for(const photo of q.photos)if(!profile.dex.includes(photo.species))profile.dex.push(photo.species);save();$("infoTitle").textContent=`调查完成 · ${survey.n}`;$("infoBody").innerHTML=`<div class="result"><strong>${"★".repeat(result.stars)}${"☆".repeat(3-result.stars)}</strong><ul><li>必要证据：3/3</li><li>证据总分：${result.score}/${survey.targetScore}</li><li>使用快门：${q.shots}/${survey.shotLimit}</li><li>追踪提示：${q.hints}</li><li>图鉴物种：${profile.dex.length}/24</li></ul>${q.survey<11?'<button class="btn primary" id="nextSurveyBtn">下一次调查</button>':""}</div>`;$("infoOverlay").classList.remove("hidden");if($("nextSurveyBtn"))$("nextSurveyBtn").onclick=()=>startSurvey(q.survey+1)}
function showArchive(){const code=encodeArchive();$("infoTitle").textContent="跨设备生态档案";$("infoBody").innerHTML=`<p class="sub">调查星级、图鉴、最佳分数、旧版图鉴数量和当前底片都会写入校验档案。</p><textarea class="savebox" id="archiveCode">${code}</textarea><div class="controls"><button class="btn" id="copyArchiveBtn">复制档案</button><button class="btn" id="importArchiveBtn">导入上方档案</button></div>`;$("infoOverlay").classList.remove("hidden");$("copyArchiveBtn").onclick=()=>navigator.clipboard?.writeText($("archiveCode").value);$("importArchiveBtn").onclick=()=>{try{const data=decodeArchive($("archiveCode").value);profile=data.profile;q=data.q;stop();save();$("infoOverlay").classList.add("hidden");if(q){$("mapOverlay").classList.add("hidden");drawUI();render()}else{drawMap();$("mapOverlay").classList.remove("hidden")}toast("生态档案导入成功")}catch(error){toast(error.message)}}}
function drawMap(){$("surveys").innerHTML=SURVEYS.map((survey,index)=>`<button class="survey" data-survey="${index}" ${index>=profile.unlocked?"disabled":""}><span>${survey.icon}</span><h3>${index+1}. ${survey.n}</h3><p>${survey.chapter} · 6 段踪迹 · 3 项必要行为<br>${survey.brief}</p><div class="stars">${"★".repeat(profile.stars[index]||0)}${"☆".repeat(3-(profile.stars[index]||0))}</div></button>`).join("")+`<div class="survey"><h3>生态总档</h3><p>当前新图鉴 ${profile.dex.length}/24 · 旧 V3 图鉴 ${profile.legacyDex||0}/24</p></div>`;document.querySelectorAll("[data-survey]").forEach(button=>button.onclick=()=>startSurvey(+button.dataset.survey))}
function drawUI(){if(!q)return;const survey=SURVEYS[q.survey],result=evaluate(q.survey,q.photos,q.hints,q.shots),best=profile.stars[q.survey]||0;$("surveyStat").textContent=`${q.survey+1} / 12`;$("timeStat").textContent=`${q.time.toFixed(1)} / ${survey.timeLimit}s`;$("shotStat").textContent=`${q.shots} / ${survey.shotLimit}`;$("evidenceStat").textContent=`${result.goals.filter(goal=>goal.pass).length} / 3`;$("starStat").textContent="★".repeat(best)+"☆".repeat(3-best);$("surveyTitle").textContent=`${survey.icon} ${survey.n}`;$("surveyBrief").textContent=survey.brief;$("chapterLabel").textContent=survey.chapter;$("message").textContent=q.message;$("zoomText").textContent=zoom.toFixed(1)+"×";$("zoomRange").value=Math.round(zoom*10);$("reticle").style.left=`${reticle.x/960*100}%`;$("reticle").style.top=`${reticle.y/540*100}%`;
$("missions").innerHTML=result.goals.map(goal=>{const species=SPECIES[goal.encounter.species];return`<div class="mission ${goal.pass?"done":""}"><header><b>${species.i}${species.n}</b><strong>${goal.best?.score||0}</strong></header><small>记录行为：${species.behavior}<br>${goal.pass?"证据有效":goal.best?"需要行为窗口且 ≥75 分":"尚无底片"}</small></div>`}).join("");$("timeline").innerHTML=survey.encounters.map(encounter=>{const species=SPECIES[encounter.species],current=q.time>=encounter.start&&q.time<=encounter.start+encounter.duration,goal=survey.goals.includes(encounter.id);return`<div class="encounter ${current?"current":""} ${goal?"goal":""}"><span>${species.i}</span><div><b>${encounter.id} ${species.n}</b><br><em>${encounter.start.toFixed(1)}–${(encounter.start+encounter.duration).toFixed(1)}s · ${species.behavior}</em></div><strong>${goal?"必要":"观察"}</strong></div>`}).join("");$("photos").innerHTML=[...q.photos].sort((a,b)=>b.score-a.score).map(photo=>`<div class="photo"><span>${SPECIES[photo.species].i}</span><div>${SPECIES[photo.species].n}<br><small>${photo.behavior?SPECIES[photo.species].behavior:"普通活动"}</small></div><b>${photo.score}</b></div>`).join("")||'<div class="photo"><div>尚无有效底片</div></div>';$("playBtn").textContent=running?"暂停观察":"开始观察";save()}
function render(){const survey=SURVEYS[q?.survey||0],region=REGIONS[survey.r],gradient=ctx.createLinearGradient(0,0,0,540);gradient.addColorStop(0,region.colors[0]);gradient.addColorStop(1,region.colors[1]);ctx.fillStyle=gradient;ctx.fillRect(0,0,960,540);ctx.fillStyle="#ffffff10";for(let i=0;i<18;i++){ctx.beginPath();ctx.arc((i*137+survey.seed)%960,80+(i*89)%410,20+(i%4)*14,0,Math.PI*2);ctx.fill()}ctx.fillStyle="#07110d42";ctx.fillRect(0,465,960,75);if(!q)return;let tag="等待踪迹";for(const encounter of survey.encounters){const animal=animalAt(encounter,q.time);if(!animal)continue;const species=SPECIES[encounter.species],size=50*animal.scale*zoom;ctx.globalAlpha=animal.behavior?1:.88;ctx.font=`${size}px serif`;ctx.textAlign="center";ctx.fillText(species.i,animal.x,animal.y);ctx.globalAlpha=1;if(animal.behavior){ctx.fillStyle="#ffd06b";ctx.font="bold 13px sans-serif";ctx.fillText(species.behavior,animal.x,animal.y-size*.7);tag=`行为窗口：${species.n} · ${species.behavior}`}}$("behaviorTag").textContent=tag}
function focusReference(goalIndex=0){const survey=SURVEYS[q.survey],id=survey.goals[goalIndex],encounter=survey.encounters.find(item=>item.id===id);stop();q.time=encounter.behaviorStart+encounter.behaviorDuration/2;const animal=animalAt(encounter,q.time);reticle={x:animal.x,y:animal.y};zoom=optimalZoom(encounter);drawUI();render();return{id,time:q.time,reticle:{...reticle},zoom}}
function tone(frequency){try{const audio=new AudioContext,osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=frequency;gain.gain.value=.03;osc.connect(gain);gain.connect(audio.destination);osc.start();gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);osc.stop(audio.currentTime+.12)}catch{}}
function toast(text){const el=document.createElement("div");el.className="toast";el.textContent=text;document.body.append(el);setTimeout(()=>el.remove(),1500)}
canvas.onpointerdown=event=>{if(!q)return;const rect=canvas.getBoundingClientRect();reticle={x:clamp((event.clientX-rect.left)/rect.width*960,0,960),y:clamp((event.clientY-rect.top)/rect.height*540,0,540)};drawUI();render()};$("zoomRange").oninput=()=>{zoom=+$("zoomRange").value/10;drawUI();render()};$("playBtn").onclick=play;$("stepBtn").onclick=()=>{stop();advance(1)};$("shutterBtn").onclick=shoot;$("hintBtn").onclick=hint;$("submitBtn").onclick=submit;$("resetBtn").onclick=()=>startSurvey(q.survey);$("archiveBtn").onclick=showArchive;$("mapArchiveBtn").onclick=showArchive;$("mapBtn").onclick=()=>{stop();drawMap();$("mapOverlay").classList.remove("hidden")};$("closeInfoBtn").onclick=()=>$("infoOverlay").classList.add("hidden");load();drawMap();if(q){$("mapOverlay").classList.add("hidden");drawUI();render()}
window.__photoSafari={SPECIES,SURVEYS,animalAt,scoreShot,optimalZoom,evaluate,referenceResult,validateContent,fresh,state:()=>q,profile:()=>profile,start:startSurvey,focusReference,shoot,submit,encode:encodeArchive,decode:decodeArchive};
})();
</script>
