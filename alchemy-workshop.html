function fresh(index){return{v:2,contract:index,ingredients:[],apparatus:"pot",heat:"medium",duration:"standard",experiments:0,hints:0,last:null,finished:false,message:"选择二至四种素材，设定器具、火候与时长后进行实验。检定结果会永久写入成分档案。"}}
function freshProfile(){return{v:2,unlocked:1,stars:Array(12).fill(0),bestScore:Array(12).fill(0),learned:[0,1,2,3,4],reactions:[],clears:0,legacyKnown:0}}
function normalizeProfile(value={}){return{v:2,unlocked:clamp(+value.unlocked||1,1,12),stars:Array.from({length:12},(_,i)=>clamp(+value.stars?.[i]||0,0,3)),bestScore:Array.from({length:12},(_,i)=>clamp(+value.bestScore?.[i]||0,0,100)),learned:[...new Set(value.learned||[0,1,2,3,4])].filter(id=>INGREDIENTS[id]),reactions:[...new Set(value.reactions||[])].filter(id=>REACTIONS[id]),clears:Math.max(0,+value.clears||0),legacyKnown:Math.max(0,+value.legacyKnown||0)}}
let profile=freshProfile(),q=null;
function stateConfig(){return cleanConfig(q)}
function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
function encodeArchive(){const payload=btoa(unescape(encodeURIComponent(JSON.stringify({v:2,profile,q}))));return`ALCH2.${payload}.${checksum(payload)}`}
function decodeArchive(code){const match=String(code).trim().match(/^ALCH2\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/);if(!match||checksum(match[1])!==match[2])throw Error("档案校验失败");const data=JSON.parse(decodeURIComponent(escape(atob(match[1]))));if(data.v!==2||!Array.isArray(data.profile?.stars))throw Error("档案版本不兼容");return{v:2,profile:normalizeProfile(data.profile),q:data.q}}
function save(){localStorage.setItem(SAVE,JSON.stringify({v:2,profile,q}))}
function load(){try{const data=JSON.parse(localStorage.getItem(SAVE));if(data?.v===2){profile=normalizeProfile(data.profile);q=data.q}else{const legacy=JSON.parse(localStorage.getItem(LEGACY));if(legacy?.v===3){profile.legacyKnown=(legacy.known||[]).length;profile.learned=[...new Set([...profile.learned,...(legacy.known||[]).flatMap(id=>BLUEPRINTS[id]?.ingredients||[])])]}}}catch{}}
function toast(text){const element=document.createElement("div");element.className="toast";element.textContent=text;document.body.append(element);setTimeout(()=>element.remove(),1400)}
function startContract(index){if(index>=profile.unlocked)return;const contract=CONTRACTS[index];q=fresh(index);$("bookOverlay").classList.add("hidden");$("infoOverlay").classList.add("hidden");q.message=`${contract.n} 已展开：先读验收区间，再用实验缩小配方空间。`;save();draw()}
function markChanged(){q.last=null;q.finished=false;q.message="配方已经调整；请重新实验，旧批次检定不再代表当前配置。";save();draw()}
function toggleIngredient(id){if(!q||INGREDIENTS[id].tier>CONTRACTS[q.contract].chapter)return;const position=q.ingredients.indexOf(id);if(position>=0)q.ingredients.splice(position,1);else{if(q.ingredients.length>=4)return toast("单批最多四种素材");q.ingredients.push(id)}markChanged()}
function setApparatus(value){q.apparatus=APPARATUS[value]?value:q.apparatus;markChanged()}
function setHeat(value){q.heat=HEATS[value]?value:q.heat;markChanged()}
function setDuration(value){q.duration=DURATIONS[value]?value:q.duration;markChanged()}
function learnBatch(batch){for(const id of batch.ingredients)if(!profile.learned.includes(id))profile.learned.push(id);for(const id of batch.reactions)if(!profile.reactions.includes(id))profile.reactions.push(id)}
function assay(){if(q.ingredients.length<2)return toast("至少选择两种素材");q.experiments++;q.last=simulate(stateConfig());learnBatch(q.last);q.message=`检定完成：赤热 ${q.last.axis[0]}、澄明 ${q.last.axis[1]}、生机 ${q.last.axis[2]}，杂质 ${q.last.impurity}，成本 ${q.last.cost}。`;save();draw();return q.last}
function applyReference(index=q.contract){if(index!==q.contract)startContract(index);const reference=CONTRACTS[index].reference;q.ingredients=[...reference.ingredients];q.apparatus=reference.apparatus;q.heat=reference.heat;q.duration=reference.duration;q.hints++;q.last=simulate(q);learnBatch(q.last);q.message="导师校样已装入实验台；可以检定和提交，但本次最高两星。";save();draw();return evaluate(index,q,q.hints)}
function submit(){if(q.ingredients.length<2)return toast("至少选择两种素材");const result=evaluate(q.contract,stateConfig(),q.hints),contract=CONTRACTS[q.contract];q.last=result;learnBatch(result);if(!result.pass){q.message=`验收未通过：效力偏差 ${result.deviation}；${result.within?"三项效力合格":"至少一项效力越界"}，${result.pure?"杂质合格":"杂质超标"}。`;save();draw();return result}q.finished=true;profile.stars[q.contract]=Math.max(profile.stars[q.contract],result.stars);profile.bestScore[q.contract]=Math.max(profile.bestScore[q.contract],result.score);profile.unlocked=Math.max(profile.unlocked,Math.min(12,q.contract+2));profile.clears++;save();$("infoTitle").textContent=`委托完成 · ${contract.n}`;$("infoBody").innerHTML=`<div class="result"><strong>${"★".repeat(result.stars)}${"☆".repeat(3-result.stars)}</strong><ul><li>效力：${result.axis.join(" / ")}（总偏差 ${result.deviation}）</li><li>杂质：${result.impurity} / ${contract.maxImpurity}</li><li>成本：${result.cost} / ${contract.parCost}</li><li>实验次数：${q.experiments}</li><li>导师校样：${q.hints}</li></ul>${q.contract<11?'<button class="btn primary" id="nextContractBtn">下一份委托</button>':""}</div>`;$("infoOverlay").classList.remove("hidden");if($("nextContractBtn"))$("nextContractBtn").onclick=()=>startContract(q.contract+1);draw();return result}
function drawChart(){const contract=CONTRACTS[q.contract],batch=q.last,w=960,h=300;ctx.clearRect(0,0,w,h);ctx.fillStyle="#17101f";ctx.fillRect(0,0,w,h);ctx.font="bold 22px sans-serif";ctx.textAlign="left";ctx.fillStyle="#fff3df";ctx.fillText("正式成分检定",28,35);const max=Math.max(20,...contract.target.map(value=>value+5),...(batch?.axis||[]));AXES.forEach((axis,index)=>{const y=76+index*58,x=145,width=745,[low,high]=contract.range[index];ctx.fillStyle="#31263d";ctx.fillRect(x,y,width,18);ctx.fillStyle=axis.c+"55";ctx.fillRect(x+low/max*width,y,(high-low)/max*width,18);ctx.strokeStyle=axis.c;ctx.strokeRect(x+low/max*width,y,(high-low)/max*width,18);ctx.fillStyle="#d5c7dc";ctx.font="bold 17px sans-serif";ctx.fillText(axis.n,28,y+15);ctx.font="14px sans-serif";ctx.fillStyle="#9f90ab";ctx.fillText(`${low}–${high} · 精确 ${contract.target[index]}`,28,y+35);if(batch){const px=x+clamp(batch.axis[index]/max,0,1)*width;ctx.fillStyle=axis.c;ctx.beginPath();ctx.arc(px,y+9,10,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold 14px sans-serif";ctx.textAlign="center";ctx.fillText(batch.axis[index],px,y-6);ctx.textAlign="left"}});ctx.fillStyle=batch?"#fff3df":"#9f90ab";ctx.font="bold 16px sans-serif";ctx.fillText(batch?`当前批次 · 杂质 ${batch.impurity}/${contract.maxImpurity} · 成本 ${batch.cost}/${contract.parCost}`:"进行实验后显示当前批次位置",28,276)}
function drawBook(){$("contracts").innerHTML=CONTRACTS.map((contract,index)=>`<button class="contract" data-contract="${index}" ${index>=profile.unlocked?"disabled":""}><span>${contract.i}</span><h3>${index+1}. ${contract.n}</h3><p>第 ${contract.chapter+1} 章 · 可用素材 ${Math.min(20,(contract.chapter+1)*5)} 种<br>${contract.brief}</p><div class="stars">${"★".repeat(profile.stars[index])}${"☆".repeat(3-profile.stars[index])}</div></button>`).join("")+`<div class="contract"><h3>旧工坊纪录</h3><p>V3 已发现秘方 ${profile.legacyKnown}/24；仅保留为历史数字，不伪造新委托星级。</p></div>`;document.querySelectorAll("[data-contract]").forEach(button=>button.onclick=()=>startContract(+button.dataset.contract))}
function draw(){if(!q)return;const contract=CONTRACTS[q.contract],batch=q.last,available=(contract.chapter+1)*5;$("contractStat").textContent=`${q.contract+1} / 12`;$("experimentStat").textContent=q.experiments;$("learnedStat").textContent=`${profile.learned.length} / 20`;$("reactionStat").textContent=`${profile.reactions.length} / ${REACTIONS.length}`;$("starStat").textContent="★".repeat(profile.stars[q.contract])+"☆".repeat(3-profile.stars[q.contract]);$("contractTitle").textContent=`${contract.i} ${contract.n}`;$("contractBrief").textContent=contract.brief;$("chapterLabel").textContent=`第 ${contract.chapter+1} 章 · ${available} 种素材`;$("message").textContent=q.message;$("apparatusSelect").value=q.apparatus;$("heatSelect").value=q.heat;$("durationSelect").value=q.duration;$("formula").innerHTML=q.ingredients.length?q.ingredients.map((id,index)=>`${index?'<span class="plus">＋</span>':""}<div class="chip"><span>${INGREDIENTS[id].i}</span>${INGREDIENTS[id].n}</div>`).join(""):'<span class="sub">尚未选择素材 · 单批二至四种，不可重复</span>';
$("ingredients").innerHTML=INGREDIENTS.map(item=>{const known=profile.learned.includes(item.id),enabled=item.tier<=contract.chapter;return`<button class="ingredient ${q.ingredients.includes(item.id)?"selected":""}" data-ing="${item.id}" ${enabled?"":"disabled"}><span>${enabled?item.i:"🔒"}</span><b>${enabled?item.n:"未开放"}</b><small>${enabled?(known?`赤${item.a[0]} 澄${item.a[1]} 生${item.a[2]}<br>杂${item.p} · 成本${item.c}`:`成分待检 · 成本 ${item.c}`):`第 ${item.tier+1} 章开放`}</small></button>`}).join("");document.querySelectorAll("[data-ing]").forEach(button=>button.onclick=()=>toggleIngredient(+button.dataset.ing));$("targets").innerHTML=AXES.map((axis,index)=>`<div class="target"><span style="color:${axis.c}">${axis.n}</span><b>${contract.range[index][0]}–${contract.range[index][1]}</b><small>精确中心 ${contract.target[index]}</small></div>`).join("")+`<div class="target"><span>杂质上限</span><b>${contract.maxImpurity}</b><small>超标无法交付</small></div><div class="target"><span>大师成本</span><b>≤ ${contract.parCost}</b><small>精确中心、无校样且不超成本才获三星</small></div>`;
const active=batch?.reactions||[];$("reactions").innerHTML=active.length?active.map(id=>{const reaction=REACTIONS[id];return`<div class="reaction"><b>${reaction.n}</b><br>${INGREDIENTS[reaction.a].i}＋${INGREDIENTS[reaction.b].i} · 赤${reaction.v[0]>=0?"+":""}${reaction.v[0]} 澄${reaction.v[1]>=0?"+":""}${reaction.v[1]} 生${reaction.v[2]>=0?"+":""}${reaction.v[2]} 杂${reaction.p>=0?"+":""}${reaction.p}<br>${reaction.d}</div>`}).join(""):'<div class="sub">检定包含反应对的批次后显示。</div>';const learned=INGREDIENTS.filter(item=>profile.learned.includes(item.id));$("notebook").innerHTML=learned.map(item=>`<div class="note"><span>${item.i}</span><div><b>${item.n}</b><small>赤${item.a[0]} · 澄${item.a[1]} · 生${item.a[2]} · 杂${item.p} · 成本${item.c}<br>${item.d}</small></div></div>`).join("");drawChart();drawBook();save()}
function showArchive(){const code=encodeArchive();$("infoTitle").textContent="跨设备成分档案";$("infoBody").innerHTML=`<p class="sub">十二份星级、最佳分、已检成分、已知反应和当前实验台都包含在校验档案中。</p><textarea class="savebox" id="saveCode">${code}</textarea><div class="controls"><button class="btn" id="copyCodeBtn">复制导出</button><button class="btn" id="importCodeBtn">导入上方档案</button></div>`;$("infoOverlay").classList.remove("hidden");$("copyCodeBtn").onclick=()=>navigator.clipboard?.writeText($("saveCode").value);$("importCodeBtn").onclick=()=>{try{const data=decodeArchive($("saveCode").value);profile=data.profile;q=data.q||fresh(0);save();$("infoOverlay").classList.add("hidden");draw();toast("成分档案导入成功")}catch(error){toast(error.message)}}}
$("apparatusSelect").innerHTML=Object.entries(APPARATUS).map(([id,item])=>`<option value="${id}">${item.i} ${item.n} · ${item.d}</option>`).join("");$("heatSelect").innerHTML=Object.entries(HEATS).map(([id,item])=>`<option value="${id}">${item.n} · ${item.d}</option>`).join("");$("durationSelect").innerHTML=Object.entries(DURATIONS).map(([id,item])=>`<option value="${id}">${item.n} · ${item.d}</option>`).join("");$("apparatusSelect").onchange=event=>setApparatus(event.target.value);$("heatSelect").onchange=event=>setHeat(event.target.value);$("durationSelect").onchange=event=>setDuration(event.target.value);$("assayBtn").onclick=assay;$("submitBtn").onclick=submit;$("hintBtn").onclick=()=>applyReference();$("undoBtn").onclick=()=>{if(q.ingredients.length){q.ingredients.pop();markChanged()}};$("resetBtn").onclick=()=>startContract(q.contract);$("archiveBtn").onclick=showArchive;$("bookBtn").onclick=()=>{$("bookOverlay").classList.remove("hidden");drawBook()};$("closeInfoBtn").onclick=()=>$("infoOverlay").classList.add("hidden");load();drawBook();if(q){$("bookOverlay").classList.add("hidden");draw()}
window.__alchemyWorkshop={INGREDIENTS,APPARATUS,HEATS,DURATIONS,REACTIONS,CONTRACTS,simulate,evaluate,referenceResult,validateContent,fresh,state:()=>q,profile:()=>profile,start:startContract,toggleIngredient,setApparatus,setHeat,setDuration,assay,applyReference,submit,encode:encodeArchive,decode:decodeArchive};
})();
</script>
</body>
