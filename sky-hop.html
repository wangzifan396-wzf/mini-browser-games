<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#28414a">
  <title>云端跃迁：十二峰风径</title>
  <style>
    :root{--ink:#26373d;--muted:#68787c;--paper:#fff;--line:#b7c4c5;--deep:#28414a;--teal:#2f807b;--blue:#44799b;--gold:#bd8431;--red:#b8555b;--green:#4a866c;--radius:8px;--shadow:0 12px 30px rgba(38,55,61,.14)}
    *{box-sizing:border-box;letter-spacing:0}html,body{margin:0;min-height:100%;color:var(--ink);background:#e7eceb;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}button{font:inherit}.app{width:min(1180px,calc(100vw - 24px));margin:auto;padding:16px 0 30px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:17px 20px;border-bottom:4px solid #d7a64a;color:#fff;background:var(--deep)}h1{margin:0;font-size:28px}.sub{margin:5px 0 0;color:#cfdddd;font-size:13px}.totals{display:flex;gap:18px;text-align:right}.totals b{display:block;color:#f1cb72;font-size:20px}.totals span{color:#c8d6d6;font-size:10px}.routes{display:grid;grid-template-columns:repeat(12,minmax(42px,1fr));gap:5px;padding:11px 0}.route{height:46px;border:1px solid #aab8b9;border-radius:6px;color:#40545a;background:#f7f9f8;font-weight:900;cursor:pointer}.route.active{border-color:var(--teal);color:#fff;background:var(--teal)}.route:disabled{opacity:.42}.route small{display:block;height:11px;color:#f2cc74;font-size:9px}.layout{display:grid;grid-template-columns:minmax(430px,760px) 330px;gap:14px;align-items:start}.flight{display:grid;grid-template-columns:minmax(340px,530px) minmax(170px,1fr);gap:12px;padding:12px;border:1px solid #8fa1a4;border-radius:var(--radius);background:#17282e;box-shadow:var(--shadow)}.sky{position:relative;display:grid;place-items:center;min-width:0}.sky canvas{display:block;width:min(100%,520px);height:auto;aspect-ratio:4/5;border:1px solid #5d7780;border-radius:6px;background:#10252e;touch-action:none}.sky-hud{position:absolute;inset:8px 8px auto;display:flex;justify-content:space-between;gap:6px;pointer-events:none}.sky-hud span{padding:5px 7px;border:1px solid rgba(255,255,255,.2);border-radius:5px;color:#e0eeee;background:rgba(24,40,46,.88);font-size:10px}.flight-info{display:flex;flex-direction:column;gap:9px;min-width:0;color:#e8f0f0}.flight-info h2{margin:0;color:#fff;font-size:19px}.brief{margin:0;color:#b8c8c9;font-size:12px;line-height:1.55}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px}.metric{padding:8px;border:1px solid #516a70;border-radius:6px;background:#20343a}.metric b{display:block;color:#6dd3ca;font-size:18px}.metric span{color:#aebfc0;font-size:9px}.wind-card{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;border:1px solid #506970;border-radius:6px;background:#20343a}.wind-card b{color:#efc76b}.platform-key{display:grid;grid-template-columns:1fr 1fr;gap:5px}.key-item{display:flex;align-items:center;gap:6px;color:#c4d3d4;font-size:10px}.swatch{width:18px;height:6px;border-radius:2px}.flight-status{min-height:64px;margin:0;padding:9px;border-left:4px solid var(--gold);color:#d0dddd;background:#20343a;font-size:11px;line-height:1.55}.side{display:flex;flex-direction:column;gap:10px}.panel{padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}.panel h3{margin:0 0 9px;font-size:14px}.riders{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.rider{min-height:65px;padding:6px;border:1px solid #a9b8ba;border-radius:6px;color:#40545a;background:#f0f4f3;font-size:9px;font-weight:900;cursor:pointer}.rider b{display:block;font-size:12px}.rider.active{border-color:var(--blue);color:#fff;background:var(--blue)}.commands,.archive{display:grid;grid-template-columns:1fr 1fr;gap:6px}.commands button,.archive button,.steer button{min-height:42px;border:1px solid #9daeb1;border-radius:6px;color:#344b51;background:#edf2f1;font-weight:900;cursor:pointer;touch-action:none}.commands .primary{grid-column:1/-1;border-color:var(--teal);color:#fff;background:var(--teal)}.commands .wide{grid-column:1/-1}.steer{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.steer button{font-size:18px}.energy{height:8px;margin:9px 0 0;border-radius:4px;background:#d8e0df;overflow:hidden}.energy span{display:block;width:100%;height:100%;background:var(--teal);transform-origin:left}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:14px;background:rgba(15,31,37,.9);text-align:center}.overlay[hidden]{display:none}.overlay-card{width:min(350px,100%);padding:22px;border-radius:var(--radius);color:#fff;background:#2b424a;box-shadow:0 24px 60px rgba(0,0,0,.45)}.overlay-card h2{margin:0;font-size:24px}.overlay-card p{color:#d2dede;line-height:1.6}.overlay-stars{color:#efc667;font-size:34px}.overlay-card button{min-height:42px;padding:0 20px;border:0;border-radius:6px;color:#29383d;background:#efc667;font-weight:900;cursor:pointer}
    @media(max-width:960px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.side .panel:first-child{grid-column:1/-1}}
    @media(max-width:690px){.app{width:calc(100vw - 12px);padding-top:6px}.head{display:block;padding:13px}.head h1{font-size:22px}.sub{font-size:11px}.totals{justify-content:space-between;margin-top:11px;text-align:left}.routes{grid-template-columns:repeat(6,1fr)}.route{height:39px}.flight{grid-template-columns:minmax(0,1fr);padding:7px}.sky canvas{width:min(100%,480px)}.flight-info{padding:4px}.side{display:flex}.panel{padding:10px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="head"><div><h1>云端跃迁：十二峰风径</h1><p class="sub">沿固定平台序列自动弹跳，读取横风与移动台节拍，收齐星片后抵达每条风径的峰顶信标。</p></div><div class="totals"><div><b id="starTotal">0 / 36</b><span>风径星章</span></div><div><b id="clearTotal">0 / 12</b><span>完成路线</span></div><div><b id="shardTotal">0 / 12</b><span>全星片路线</span></div></div></header>
    <nav class="routes" id="routes" aria-label="峰顶风径"></nav>
    <section class="layout">
      <section class="flight">
        <div class="sky"><canvas id="sky" width="520" height="650" aria-label="云端跃迁路线"></canvas><div class="sky-hud"><span>高度 <b id="height">0m</b></span><span>用时 <b id="clock">0.0s</b></span></div><div class="overlay" id="overlay"><div class="overlay-card"><h2 id="overlayTitle"></h2><p id="overlayText"></p><div class="overlay-stars" id="overlayStars"></div><button id="overlayButton">开始</button></div></div></div>
        <div class="flight-info"><h2 id="routeTitle"></h2><p class="brief" id="routeBrief"></p><div class="metrics"><div class="metric"><b id="platformCount">0 / 15</b><span>通过平台</span></div><div class="metric"><b id="shards">0 / 3</b><span>路线星片</span></div><div class="metric"><b id="dashCount">0</b><span>脉冲使用</span></div><div class="metric"><b id="best">--</b><span>最佳用时</span></div></div><div class="wind-card"><span>当前风场</span><b id="windName">静风</b></div><div class="platform-key"><div class="key-item"><span class="swatch" style="background:#65c8ad"></span>稳固台</div><div class="key-item"><span class="swatch" style="background:#e7bb56"></span>弹簧台</div><div class="key-item"><span class="swatch" style="background:#70a8d1"></span>移动台</div><div class="key-item"><span class="swatch" style="background:#c67d83"></span>碎裂台</div></div><p class="flight-status" id="status"></p></div>
      </section>
      <aside class="side">
        <section class="panel"><h3>选择跃迁员</h3><div class="riders"><button class="rider" data-rider="scout"><b>寻路者</b>转向灵敏</button><button class="rider" data-rider="glider"><b>滑翔手</b>长时滑翔</button><button class="rider" data-rider="pulse"><b>脉冲客</b>三次突进</button></div></section>
        <section class="panel"><div class="commands"><button class="primary" id="start">进入风径</button><button id="dash">脉冲突进</button><button id="glide">展开滑翼</button><button id="restart">重开</button><button id="pause">暂停</button></div><div class="steer"><button data-steer="-1" title="向左">←</button><button data-steer="1" title="向右">→</button></div><div class="energy"><span id="energyBar"></span></div></section>
        <section class="panel"><div class="archive"><button id="exportSave">导出档案</button><button id="importSave">导入档案</button></div></section>
      </aside>
    </section>
  </main>
  <script>
  (()=>{
    "use strict";
    const SAVE_KEY="sky_hop_v2",VIEW=3.15,platformColors={start:"#65c8ad",normal:"#65c8ad",spring:"#e7bb56",moving:"#70a8d1",cloud:"#d4edf0",crumble:"#c67d83",goal:"#f1d474"},riders={scout:{name:"寻路者",control:4.4,maxVx:1.02,glide:1.8,dashes:1},glider:{name:"滑翔手",control:3.7,maxVx:.9,glide:3.2,dashes:1},pulse:{name:"脉冲客",control:4,maxVx:1.08,glide:1.55,dashes:3}};
    const specs=[
      {title:"薄云初径",brief:"稳固平台组成第一条有限上升线，先掌握空中转向与落台节拍。",seed:101,wind:"静风",windMode:"calm",force:0,types:["normal"],par:19,dashPar:0},
      {title:"金簧阶梯",brief:"弹簧台提高下一跃高度，提前转向才能接住更远的平台。",seed:211,wind:"南侧微风",windMode:"steady",force:.04,types:["normal","spring"],par:20,dashPar:0},
      {title:"横风塔脊",brief:"持续东风会累积水平速度，反向输入用于控制落点而非临时补救。",seed:307,wind:"东向横风",windMode:"steady",force:.13,types:["normal","spring"],par:21,dashPar:0},
      {title:"漂台钟摆",brief:"移动台共享固定时钟，观察摆幅后选择跟随或提前截住。",seed:419,wind:"静风",windMode:"calm",force:0,types:["normal","moving"],par:22,dashPar:0},
      {title:"雨幕云桥",brief:"云台只承托一次，落台后必须立即规划下一段方向。",seed:523,wind:"西向细雨",windMode:"steady",force:-.08,types:["cloud","normal","spring"],par:22,dashPar:1},
      {title:"逆流风眼",brief:"高度越高风向越会反转，移动台与弹簧台要求连续修正。",seed:631,wind:"双向剪风",windMode:"shear",force:.16,types:["moving","spring","normal"],par:23,dashPar:1},
      {title:"赤层碎阶",brief:"碎裂台在一次起跳后失效，回落不会再提供第二次支撑。",seed:743,wind:"东向热流",windMode:"steady",force:.11,types:["crumble","normal","spring"],par:23,dashPar:1},
      {title:"双峰急流",brief:"周期阵风改变每一跃的横移量，落台时机与方向需要同时判断。",seed:857,wind:"周期阵风",windMode:"gust",force:.2,types:["moving","crumble","normal"],par:24,dashPar:1},
      {title:"极光升降",brief:"窄幅移动台与一次云台交替出现，三枚星片分布在完整主线上。",seed:967,wind:"西向高流",windMode:"steady",force:-.14,types:["moving","cloud","spring"],par:24,dashPar:1},
      {title:"雷层速攀",brief:"弹簧、碎台与阵风压缩反应窗口，脉冲只应修正关键一跃。",seed:1087,wind:"雷层阵风",windMode:"gust",force:-.22,types:["spring","crumble","moving"],par:25,dashPar:1},
      {title:"星片回廊",brief:"左右交替的窄台要求持续保留转向余量，漏掉星片会失去完整评价。",seed:1201,wind:"双向剪风",windMode:"shear",force:-.2,types:["cloud","moving","crumble","normal"],par:26,dashPar:2},
      {title:"天穹终径",brief:"全部平台生态与复合高空风场汇入最后一条十二峰航线。",seed:1327,wind:"天穹复合风",windMode:"crown",force:.22,types:["moving","spring","cloud","crumble"],par:27,dashPar:2}
    ];
    function random(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
    function clamp(value,min,max){return Math.max(min,Math.min(max,value))}
    function buildRoute(spec,index){const rng=random(spec.seed),platforms=[{x:.5,y:.14,w:.28,type:"start",amp:0,speed:0,phase:0,star:false}];for(let i=1;i<16;i++){const previous=platforms[i-1],type=i===15?"goal":spec.types[(i+Math.floor(rng()*spec.types.length))%spec.types.length],gap=previous.type==="spring"?.5:.34+rng()*.035;let x=clamp(previous.x+(rng()-.5)*.3,.17,.83);if(index>=9&&i%4===0)x=clamp(previous.x+(i%8===0?-.24:.24),.17,.83);const w=type==="goal"?.25:Math.max(.15,.235-i*.003+(rng()-.5)*.025);platforms.push({x,y:previous.y+gap,w,type,amp:type==="moving"?.045+rng()*.025:0,speed:.72+rng()*.45,phase:rng()*Math.PI*2,star:[4,9,14].includes(i)})}return{...spec,index,platforms,height:platforms.at(-1).y,signature:platforms.map(p=>`${p.x.toFixed(3)}:${p.y.toFixed(3)}:${p.type}`).join("|")}}
    const routes=specs.map(buildRoute),$=id=>document.getElementById(id),canvas=$("sky"),ctx=canvas.getContext("2d"),overlay=$("overlay"),routeEl=$("routes");let profile=load(),selected=0,riderKey=profile.rider||"scout",q=null,last=0,raf=0,keys=new Set(),touchSteer=0,touchGlide=false,pointerTarget=null,referenceCache=new Map();
    function defaults(){return{version:2,stars:{},best:{},shards:{},ghost:{},rider:"scout",updatedAt:Date.now()}}
    function normalize(value){const clean=defaults();if(!value||value.version!==2)return clean;for(let i=0;i<routes.length;i++){clean.stars[i]=clamp(Number(value.stars?.[i])||0,0,3);if(Number.isFinite(Number(value.best?.[i])))clean.best[i]=Math.max(0,Number(value.best[i]));clean.shards[i]=Boolean(value.shards?.[i]);if(Array.isArray(value.ghost?.[i]))clean.ghost[i]=value.ghost[i].filter(point=>Array.isArray(point)&&point.length===3&&point.every(Number.isFinite)).slice(0,400)}if(riders[value.rider])clean.rider=value.rider;return clean}
    function load(){try{return normalize(JSON.parse(localStorage.getItem(SAVE_KEY)))}catch{return defaults()}}
    function save(){profile.rider=riderKey;profile.updatedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(profile));renderCampaign()}
    function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
    function encodeProfile(){const body=btoa(unescape(encodeURIComponent(JSON.stringify(profile))));return`SKY2.${body}.${checksum(body)}`}
    function decodeProfile(code){const part=code.trim().split(".");if(part.length!==3||part[0]!=="SKY2"||checksum(part[1])!==part[2])throw Error("风径档案校验失败");return normalize(JSON.parse(decodeURIComponent(escape(atob(part[1])))))}
    function platformX(platform,time){return platform.x+(platform.type==="moving"?Math.sin(time*platform.speed+platform.phase)*platform.amp:0)}
    function windForce(state){const route=state.route;if(route.windMode==="steady")return route.force;if(route.windMode==="shear")return Math.sin(state.player.y*1.7)*route.force;if(route.windMode==="gust")return(.35+.65*Math.sin(state.elapsed*1.25+state.player.y))*route.force;if(route.windMode==="crown")return Math.sin(state.player.y*1.35)*route.force+Math.sin(state.elapsed*.9)*.075;return 0}
    function decodeGhost(points){return Array.isArray(points)?points.map(([t,x,y])=>[t/10,x/100,y/100]):[]}
    function encodeGhost(points){return points.filter((_,i)=>i%2===0).slice(0,400).map(([t,x,y])=>[Math.round(t*10),Math.round(x*100),Math.round(y*100)])}
    function makeState(index=selected,simulation=false,chosen=riderKey){const route=routes[index],rider=riders[chosen];return{index,route,riderKey:chosen,rider,simulation,player:{x:.5,y:.14,vx:0,vy:1.64},control:0,gliding:false,energy:rider.glide,dashes:rider.dashes,dashesUsed:0,elapsed:0,camera:0,currentPlatform:0,highestPlatform:0,used:new Set(),collected:new Set(),trace:[[0,.5,.14]],traceClock:0,ghostTrace:[],run:false,paused:false,ended:false,won:false,shards:0,falls:0,message:"峰顶信标等待接入。"}}
    function recordTrace(state,dt){state.traceClock+=dt;if(state.traceClock>=.1){state.traceClock=0;state.trace.push([state.elapsed,state.player.x,state.player.y])}}
    function land(state,index,platform){state.currentPlatform=Math.max(state.currentPlatform,index);state.highestPlatform=Math.max(state.highestPlatform,index);state.player.y=platform.y;state.player.vy=platform.type==="spring"?2.02:1.64;state.energy=Math.min(state.rider.glide,state.energy+.34);if(platform.star&&!state.collected.has(index)){state.collected.add(index);state.shards++;state.message=`收回第 ${state.shards} 枚路线星片。`}else state.message=`落在第 ${index} 号${platform.type==="moving"?"移动台":platform.type==="spring"?"弹簧台":"平台"}。`;if(["cloud","crumble"].includes(platform.type))state.used.add(index);if(platform.type==="goal"){state.won=true;state.ended=true;state.run=false;state.message="峰顶信标接入完成。"}}
    function stepState(state,dt){if(!state.run||state.paused||state.ended)return;state.elapsed+=dt;if(state.elapsed>state.route.par+18){state.ended=true;state.run=false;state.message="风径时间窗已经关闭。";return}const steps=Math.max(1,Math.ceil(dt/(1/120))),unit=dt/steps;for(let s=0;s<steps&&!state.ended;s++){const p=state.player,previousY=p.y,gravity=state.gliding&&state.energy>0?2.15:3.15;if(state.gliding&&state.energy>0)state.energy=Math.max(0,state.energy-unit);p.vx+=((state.control||0)*state.rider.control+windForce(state))*unit;p.vx*=Math.pow(.975,unit*60);p.vx=clamp(p.vx,-state.rider.maxVx,state.rider.maxVx);p.vy-=gravity*unit;p.x=clamp(p.x+p.vx*unit,.045,.955);p.y+=p.vy*unit;if(p.vy<0){let landed=null;for(let i=Math.min(state.route.platforms.length-1,state.highestPlatform+3);i>=Math.max(0,state.highestPlatform-1);i--){const platform=state.route.platforms[i];if(state.used.has(i)||previousY<platform.y||p.y>platform.y)continue;const px=platformX(platform,state.elapsed);if(Math.abs(p.x-px)<=platform.w/2+.035){landed={i,platform};break}}if(landed)land(state,landed.i,landed.platform)}state.camera=Math.max(state.camera,p.y-1.5);if(p.y<state.camera-.22){state.falls++;state.ended=true;state.run=false;state.message="跃迁员坠出当前风径。"}recordTrace(state,unit)}}
    function dashState(state){if(!state.run||state.paused||state.ended||state.dashes<=0)return false;let direction=Math.sign(state.control||0);if(!direction){const target=state.route.platforms[Math.min(15,state.currentPlatform+1)];direction=Math.sign(platformX(target,state.elapsed)-state.player.x)||1}state.player.vx=clamp(state.player.vx+direction*.52,-state.rider.maxVx*1.2,state.rider.maxVx*1.2);state.dashes--;state.dashesUsed++;state.message=direction<0?"脉冲向左修正航迹。":"脉冲向右修正航迹。";return true}
    function referenceControl(state){const target=state.route.platforms[Math.min(15,state.currentPlatform+1)],future=state.elapsed+.2,tx=platformX(target,future),error=tx-state.player.x,desired=clamp(error*3.8,-state.rider.maxVx*.86,state.rider.maxVx*.86);state.control=clamp((desired-state.player.vx)*2.4,-1,1);state.gliding=false}
    function simulateReference(index){const state=makeState(index,true,"scout");state.run=true;for(let i=0;i<7200&&!state.ended;i++){referenceControl(state);stepState(state,1/120)}return{won:state.won,shards:state.shards,time:state.elapsed,dashes:state.dashesUsed,falls:state.falls,platform:state.highestPlatform,trace:state.trace}}
    function getReference(index){if(!referenceCache.has(index))referenceCache.set(index,simulateReference(index));return referenceCache.get(index)}
    function validateContent(){if(routes.length!==12)throw Error("风径数量错误");const signatures=new Set();let platforms=0,shards=0,referenceWins=0,maxReferenceTime=0;for(let i=0;i<routes.length;i++){const route=routes[i];if(route.platforms.length!==16)throw Error(`第 ${i+1} 条平台数量错误`);if(signatures.has(route.signature))throw Error(`第 ${i+1} 条风径重复`);signatures.add(route.signature);platforms+=route.platforms.length;shards+=route.platforms.filter(p=>p.star).length;const result=getReference(i);if(!result.won||result.shards!==3||result.falls||result.platform!==15||result.time>route.par)throw Error(`第 ${i+1} 条参考巡航未通过：${JSON.stringify({...result,trace:undefined})}`);referenceWins++;maxReferenceTime=Math.max(maxReferenceTime,result.time)}return{routes:12,riders:3,platforms,shards,referenceWins,uniqueRoutes:signatures.size,maxReferenceTime:Number(maxReferenceTime.toFixed(2))}}
    function unlocked(index){return index===0||Number(profile.stars[index-1])>0}
    function begin(index=selected){if(!unlocked(index))return;selected=index;q=makeState(index);q.ghostTrace=decodeGhost(profile.ghost[index]);if(!q.ghostTrace.length)q.ghostTrace=getReference(index).trace;renderAll();showOverlay("风径简报",`${q.route.title}：15 次连续落台，收回 3 枚星片后接入峰顶信标。`,"","开始跃迁",()=>{q.run=true;hideOverlay();setStatus("自动弹跳已经启动，持续调整水平速度以接住下一座平台。")})}
    function finalize(){if(!q?.ended)return;if(q.won){const stars=1+(q.shards===3?1:0)+(q.shards===3&&q.elapsed<=q.route.par&&q.dashesUsed<=q.route.dashPar?1:0),oldBest=Number(profile.best[q.index]);profile.stars[q.index]=Math.max(Number(profile.stars[q.index])||0,stars);profile.shards[q.index]=profile.shards[q.index]||q.shards===3;if(!Number.isFinite(oldBest)||q.elapsed<oldBest){profile.best[q.index]=q.elapsed;profile.ghost[q.index]=encodeGhost(q.trace)}save();renderAll();showOverlay("峰顶抵达",`用时 ${q.elapsed.toFixed(1)} 秒，星片 ${q.shards}/3，脉冲 ${q.dashesUsed} 次。`,"★".repeat(stars)+"☆".repeat(3-stars),q.index<11?"下一条风径":"返回路线簿",()=>{const next=q.index<11?q.index+1:q.index;selected=next;begin(next)})}else showOverlay("跃迁中止",q.message,"","重新起跳",()=>begin(q.index))}
    function setStatus(text){if(q)q.message=text;$("status").textContent=text}
    function showOverlay(title,text,stars,label,handler){$("overlayTitle").textContent=title;$("overlayText").textContent=text;$("overlayStars").textContent=stars;$("overlayButton").textContent=label;$("overlayButton").onclick=handler;overlay.hidden=false}
    function hideOverlay(){overlay.hidden=true}
    function renderCampaign(){routeEl.innerHTML=routes.map((route,index)=>`<button class="route ${index===selected?"active":""}" data-index="${index}" ${unlocked(index)?"":"disabled"}>${String(index+1).padStart(2,"0")}<small>${"★".repeat(Number(profile.stars[index])||0)}</small></button>`).join("");$("starTotal").textContent=`${Object.values(profile.stars).reduce((a,b)=>a+Number(b||0),0)} / 36`;$("clearTotal").textContent=`${Object.values(profile.stars).filter(Boolean).length} / 12`;$("shardTotal").textContent=`${Object.values(profile.shards).filter(Boolean).length} / 12`;document.querySelectorAll(".rider").forEach(button=>button.classList.toggle("active",button.dataset.rider===riderKey))}
    function renderInfo(){if(!q)return;$("routeTitle").textContent=`${String(q.index+1).padStart(2,"0")} · ${q.route.title}`;$("routeBrief").textContent=q.route.brief;$("height").textContent=`${Math.max(0,Math.round((q.player.y-.14)*240))}m`;$("clock").textContent=`${q.elapsed.toFixed(1)}s`;$("platformCount").textContent=`${q.highestPlatform} / 15`;$("shards").textContent=`${q.shards} / 3`;$("dashCount").textContent=`${q.dashesUsed} / ${q.dashesUsed+q.dashes}`;$("best").textContent=Number.isFinite(Number(profile.best[q.index]))?`${Number(profile.best[q.index]).toFixed(1)}s`:"--";$("windName").textContent=q.route.wind;$("status").textContent=q.message;$("dash").textContent=`脉冲突进 ${q.dashes}`;$("energyBar").style.transform=`scaleX(${q.energy/q.rider.glide})`}
    function skyY(world,camera){return canvas.height-(world-camera)/VIEW*canvas.height}
    function drawBackground(state){ctx.fillStyle="#173b4d";ctx.fillRect(0,0,520,650);ctx.fillStyle="#24596b";ctx.fillRect(0,0,520,190);ctx.fillStyle="rgba(236,246,239,.18)";for(let i=0;i<8;i++){const x=(i*83+state.camera*41)%600-40,y=80+(i%3)*120;ctx.beginPath();ctx.arc(x,y,22+(i%2)*8,0,Math.PI*2);ctx.arc(x+24,y+4,17,0,Math.PI*2);ctx.fill()}ctx.strokeStyle="rgba(231,197,103,.28)";ctx.setLineDash([7,8]);for(let i=1;i<=3;i++){const y=650-i*650/3;ctx.beginPath();ctx.moveTo(18,y);ctx.lineTo(502,y);ctx.stroke()}ctx.setLineDash([])}
    function drawPlatform(state,platform,index){if(state.used.has(index))return;const x=platformX(platform,state.elapsed)*520,y=skyY(platform.y,state.camera),w=platform.w*520;if(y<-30||y>680)return;ctx.fillStyle=platformColors[platform.type];ctx.fillRect(x-w/2,y-5,w,10);ctx.fillStyle="rgba(255,255,255,.35)";ctx.fillRect(x-w/2+4,y-3,Math.max(0,w-8),2);if(platform.type==="spring"){ctx.strokeStyle="#5b4930";ctx.beginPath();ctx.moveTo(x-8,y+6);ctx.lineTo(x,y+13);ctx.lineTo(x+8,y+6);ctx.stroke()}if(platform.type==="goal"){ctx.fillStyle="#f6e6a5";ctx.fillRect(x-3,y-40,6,34);ctx.beginPath();ctx.moveTo(x+3,y-38);ctx.lineTo(x+28,y-29);ctx.lineTo(x+3,y-20);ctx.fill()}if(platform.star&&!state.collected.has(index)){ctx.fillStyle="#ffe586";ctx.font="22px system-ui";ctx.textAlign="center";ctx.fillText("✦",x,y-18)}}
    function tracePoint(trace,time){if(!trace?.length)return null;let low=0,high=trace.length-1;while(low<high){const mid=Math.ceil((low+high)/2);if(trace[mid][0]<=time)low=mid;else high=mid-1}return trace[low]}
    function drawPlayer(state){const ghost=tracePoint(state.ghostTrace,state.elapsed);if(ghost){const gy=skyY(ghost[2],state.camera);if(gy>-30&&gy<680){ctx.strokeStyle="rgba(238,219,146,.65)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(ghost[1]*520,gy-15,11,0,Math.PI*2);ctx.stroke()}}const x=state.player.x*520,y=skyY(state.player.y,state.camera);ctx.fillStyle="#f1cf70";ctx.beginPath();ctx.arc(x,y-15,12,0,Math.PI*2);ctx.fill();ctx.fillStyle="#29424b";ctx.fillRect(x-5,y-17,10,5);ctx.strokeStyle="#d9f2ed";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-8,y-4);ctx.lineTo(x,y-13);ctx.lineTo(x+8,y-4);ctx.stroke();if(state.gliding&&state.energy>0){ctx.strokeStyle="#87ddd0";ctx.beginPath();ctx.moveTo(x-8,y-13);ctx.lineTo(x-25,y-6);ctx.moveTo(x+8,y-13);ctx.lineTo(x+25,y-6);ctx.stroke()}}
    function draw(){if(!q)return;drawBackground(q);for(let i=0;i<q.route.platforms.length;i++)drawPlatform(q,q.route.platforms[i],i);drawPlayer(q)}
    function renderAll(){renderCampaign();renderInfo();draw()}
    function loop(time){const dt=Math.min(.05,(time-last)/1000||0);last=time;if(q){let control=touchSteer+(keys.has("ArrowLeft")||keys.has("KeyA")?-1:0)+(keys.has("ArrowRight")||keys.has("KeyD")?1:0);if(pointerTarget!==null)control=clamp((pointerTarget-q.player.x)*4-q.player.vx*1.6,-1,1);q.control=clamp(control,-1,1);q.gliding=touchGlide||keys.has("Space");const before=q.ended;stepState(q,dt);renderInfo();draw();if(!before&&q.ended)finalize()}raf=requestAnimationFrame(loop)}
    routeEl.addEventListener("click",event=>{const button=event.target.closest("[data-index]");if(button){selected=Number(button.dataset.index);begin(selected)}});document.querySelectorAll(".rider").forEach(button=>button.addEventListener("click",()=>{if(q?.run)return;riderKey=button.dataset.rider;save();q=makeState(selected);renderAll()}));
    function capturePointer(element,event){try{element.setPointerCapture(event.pointerId)}catch{}}
    document.querySelectorAll("[data-steer]").forEach(button=>{button.addEventListener("pointerdown",event=>{event.preventDefault();touchSteer=Number(button.dataset.steer);capturePointer(button,event)});for(const type of ["pointerup","pointercancel","lostpointercapture"])button.addEventListener(type,()=>touchSteer=0)});$("glide").addEventListener("pointerdown",event=>{event.preventDefault();touchGlide=true;capturePointer($("glide"),event)});for(const type of ["pointerup","pointercancel","lostpointercapture"])$("glide").addEventListener(type,()=>touchGlide=false);canvas.addEventListener("pointermove",event=>{const rect=canvas.getBoundingClientRect();pointerTarget=clamp((event.clientX-rect.left)/rect.width,.05,.95)});canvas.addEventListener("pointerleave",()=>pointerTarget=null);
    addEventListener("keydown",event=>{keys.add(event.code);if(["ArrowLeft","ArrowRight","Space"].includes(event.code))event.preventDefault();if(["ShiftLeft","ShiftRight"].includes(event.code))dashState(q)});addEventListener("keyup",event=>keys.delete(event.code));$("dash").onclick=()=>dashState(q);$("start").onclick=()=>begin(selected);$("restart").onclick=()=>begin(q?.index??selected);$("pause").onclick=()=>{if(!q||q.ended)return;q.paused=!q.paused;$("pause").textContent=q.paused?"继续":"暂停";setStatus(q.paused?"风径已暂停。":"风径继续运行。")} ;
    $("exportSave").onclick=async()=>{const code=encodeProfile();try{await navigator.clipboard.writeText(code);setStatus("风径档案已复制。") }catch{prompt("复制风径档案",code)}};$("importSave").onclick=()=>{const code=prompt("粘贴 SKY2 风径档案");if(!code)return;try{profile=decodeProfile(code);riderKey=profile.rider;save();setStatus("风径档案已导入。");begin(selected)}catch(error){setStatus(error.message)}};
    q=makeState(0);renderAll();showOverlay("风径待命","每条路线的平台位置、移动时钟、风场和星片均固定。空心跃迁员显示参考或个人最佳航迹。","","查看路线",()=>begin(selected));raf=requestAnimationFrame(loop);
    window.__skyHopTest={routes,riders,buildRoute,makeState,stepState,dashState,simulateReference,getReference,validateContent,begin,getState:()=>q,getProfile:()=>profile,encodeProfile,decodeProfile,forceFinish(){if(!q)return;q.shards=3;q.elapsed=Math.min(12,q.route.par-1);q.dashesUsed=0;q.highestPlatform=15;q.currentPlatform=15;q.ended=true;q.run=false;q.won=true;finalize()}};
  })();
