<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="十二夜固定通信航程，有限带宽、跨夜伏笔、三名操作员、八种结局与可校验跨设备档案。">
    <meta name="theme-color" content="#173c4a">
    <title>群星来信：十二夜回声航程</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23173c4a'/%3E%3Cpath d='M12 18h40v30H12z' fill='%23f2c84b'/%3E%3Cpath d='m14 21 18 15 18-15M20 11l2 5m22-5-2 5' fill='none' stroke='%23173c4a' stroke-width='4'/%3E%3C/svg%3E">
    <style>
      :root{--ink:#132a34;--muted:#60737b;--paper:#fffdf7;--wash:#e8eeeb;--line:#a3b3b0;--navy:#173c4a;--teal:#187179;--gold:#d5a62f;--red:#c65146;--blue:#27789c;--radius:8px}
      *{box-sizing:border-box}[hidden]{display:none!important}html{background:#dfe7e3}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;background:linear-gradient(rgba(23,113,121,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(23,113,121,.05) 1px,transparent 1px),#e3ebe7;background-size:30px 30px}button,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.46}button:focus-visible,textarea:focus-visible{outline:3px solid rgba(213,166,47,.4);outline-offset:2px}
      .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:96px;padding:16px max(18px,calc((100vw - 1280px)/2));border-bottom:5px solid var(--gold);color:#fff;background:var(--navy)}.brand h1{margin:0;font-size:clamp(28px,4vw,44px);line-height:1.04;letter-spacing:0}.brand p{margin:6px 0 0;color:#bfd2d3;font-size:13px;font-weight:800}.top-actions{display:flex;gap:8px}.icon-button{display:grid;place-items:center;width:46px;height:46px;padding:0;border:1px solid #789da2;border-radius:var(--radius);color:#fff;background:#225766;font-size:20px;font-weight:900}
      .app{width:min(1280px,calc(100vw - 24px));margin:18px auto 40px}.night-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 16px;border:1px solid var(--line);border-bottom:0;color:#fff;background:var(--teal)}.chapter{margin:0 0 4px;color:#f7d36b;font-size:12px;font-weight:900}.night-head h2{margin:0;font-size:24px;letter-spacing:0}.night-progress{font-weight:900;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}
      .main-panel{min-width:0;border:1px solid var(--line);background:var(--paper)}.map-wrap{height:286px;padding:9px;background:#cad7d3}canvas{display:block;width:100%;height:100%;background:#e8eeeb}.transmission{min-height:372px;padding:18px;border-top:1px solid var(--line)}.signal-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.sender{display:inline-flex;align-items:center;gap:8px;color:var(--teal);font-weight:900}.sender-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:6px;color:#fff;background:var(--teal)}.bandwidth{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;font-weight:900}.band-dot{width:16px;height:16px;border:1px solid #8ba09c;background:#d9e2de}.band-dot.on{border-color:#ad7f12;background:var(--gold)}.transmission h3{margin:0 0 9px;font-size:25px}.message{margin:0;color:#425b64;font-size:16px;line-height:1.8}.choices{display:grid;gap:9px;margin-top:16px}.choice{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;min-height:68px;padding:9px 11px;border:1px solid #9eafac;border-radius:var(--radius);color:var(--ink);text-align:left;background:#fff}.choice:hover:not(:disabled){border-color:var(--teal);background:#eef7f3}.cost{display:grid;place-items:center;width:40px;height:40px;border-radius:6px;color:#17343c;background:#f1cc59;font-weight:900}.choice strong,.choice small{display:block}.choice small{margin-top:4px;color:var(--muted)}.effect{max-width:150px;color:var(--teal);font-size:11px;font-weight:900;text-align:right}
      .resolution{display:grid;align-content:center;min-height:330px;padding:22px;border-left:5px solid var(--gold);background:#f7f2dd}.resolution h3{margin:0 0 10px;font-size:27px}.resolution p{margin:0;color:#4f6268;line-height:1.75}.resolution button{justify-self:start;margin-top:18px}
      .side{display:grid;align-content:start;gap:12px}.panel{border:1px solid var(--line);border-top:5px solid var(--teal);background:var(--paper)}.panel-inner{padding:13px}.panel h3{margin:0 0 11px;font-size:18px}.metrics{display:grid;gap:8px}.metric{display:grid;grid-template-columns:48px 1fr 34px;gap:8px;align-items:center}.metric span{font-size:12px;font-weight:900}.meter{height:10px;border:1px solid #9dafaa;background:#dce5e1}.meter i{display:block;height:100%;background:var(--teal);transition:width .2s}.metric b{text-align:right}.summary{margin:10px 0 0;color:var(--muted);font-size:12px;line-height:1.55}
      .operator{display:grid;grid-template-columns:45px 1fr;gap:9px;align-items:center}.operator-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:6px;color:#fff;background:var(--blue);font-weight:900}.operator strong,.operator small{display:block}.operator small{margin-top:3px;color:var(--muted)}.flags{display:flex;gap:6px;flex-wrap:wrap}.flag{padding:5px 7px;border:1px solid #aabbb6;border-radius:5px;color:var(--muted);background:#eef2ef;font-size:11px;font-weight:800}.flag.active{border-color:#c79217;color:#765300;background:#fff4c9}.log{display:grid;gap:7px;max-height:250px;overflow:auto}.log-item{padding:8px;border-left:3px solid #aabbb6;background:#eef2ef;font-size:11px;line-height:1.45}.log-item strong{display:block;color:var(--teal)}
      .command{min-height:44px;padding:0 13px;border:1px solid #87a09c;border-radius:var(--radius);color:var(--ink);background:#edf2ef;font-weight:900}.command.primary{border-color:#0e5b63;color:#fff;background:var(--teal)}.command.danger{border-color:#aa463d;color:#fff;background:var(--red)}
      dialog{width:min(780px,calc(100vw - 24px));max-height:min(830px,calc(100vh - 24px));padding:0;border:1px solid #78939a;border-radius:var(--radius);color:var(--ink);background:var(--paper);box-shadow:0 24px 72px rgba(15,43,50,.36)}dialog::backdrop{background:rgba(12,37,46,.7)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:4px solid var(--gold);color:#fff;background:var(--navy)}.dialog-head h2{margin:0;font-size:22px}.close{display:grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid #7ba1a6;border-radius:6px;color:#fff;background:#225d6a;font-size:22px}.dialog-body{padding:17px}.dialog-copy{margin:0 0 15px;color:var(--muted);line-height:1.65}.operators{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.operator-card{min-height:130px;padding:12px;border:1px solid #a8b9b5;border-radius:var(--radius);color:var(--ink);text-align:left;background:#fff}.operator-card.active{border:3px solid var(--gold);padding:10px;background:#fff7d9}.operator-card strong,.operator-card span,.operator-card small{display:block}.operator-card strong{margin:7px 0 4px;font-size:18px}.operator-card span{color:var(--teal);font-size:12px;font-weight:900}.operator-card small{margin-top:7px;color:var(--muted);line-height:1.45}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}.archive-box{width:100%;height:145px;padding:10px;border:1px solid #8da39e;border-radius:var(--radius);resize:vertical;font-family:Consolas,monospace;font-size:12px}.result{text-align:center}.result h3{margin:4px 0;font-size:29px}.result-stars{color:#d39108;font-size:44px}.result-summary{color:var(--muted);line-height:1.65}.ending-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px;text-align:left}.ending{padding:9px;border-left:4px solid #aebcb8;background:#eef2ef}.ending.found{border-color:var(--gold);background:#fff7d9}.ending strong,.ending small{display:block}.ending small{margin-top:3px;color:var(--muted)}.ending.locked{color:#8c9996}.resume-note{padding:9px;border-left:4px solid var(--gold);background:#fff7d9;color:#67521b;font-size:12px}
      @media(max-width:960px){.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.side .panel:last-child{grid-column:1/-1}.log{max-height:170px}.map-wrap{height:260px}}
      @media(max-width:620px){.topbar{min-height:0;padding:13px 11px}.brand h1{font-size:27px}.brand p{display:none}.icon-button{width:43px;height:43px}.app{width:calc(100vw - 14px);margin:9px auto 25px}.night-head{padding:11px}.night-head h2{font-size:21px}.layout{display:block}.side{display:grid;grid-template-columns:1fr;margin-top:12px}.side .panel:last-child{grid-column:auto}.map-wrap{height:230px;padding:6px}.transmission{min-height:0;padding:14px}.transmission h3{font-size:22px}.message{font-size:15px}.choice{grid-template-columns:42px 1fr;min-height:76px}.effect{grid-column:2;text-align:left;max-width:none}.operators{grid-template-columns:1fr}.operator-card{min-height:0}.ending-grid{grid-template-columns:1fr}.dialog-body{padding:13px}}
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><h1>群星来信：十二夜回声航程</h1><p>有限带宽 · 跨夜伏笔 · 多结局通信叙事</p></div>
      <div class="top-actions">
        <button class="icon-button" id="campaignButton" title="新航程" aria-label="开始新航程">◈</button>
        <button class="icon-button" id="archiveButton" title="航程档案" aria-label="航程档案">⇄</button>
        <button class="icon-button" id="muteButton" title="声音" aria-label="切换声音">♪</button>
      </div>
    </header>
    <main class="app">
      <section class="night-head"><div><p class="chapter" id="chapterText">第一幕 · 失联回声</p><h2 id="nightName">第 01 夜 · 漂流坐标</h2></div><div class="night-progress" id="nightProgress">01 / 12</div></section>
      <section class="layout">
        <div class="main-panel">
          <div class="map-wrap" id="mapWrap"><canvas id="routeCanvas" aria-label="十二夜舰群航图"></canvas></div>
          <section class="transmission" id="transmission">
            <div class="signal-meta"><div class="sender"><span class="sender-mark" id="senderMark">连</span><span id="senderName">先遣艇连翘</span></div><div class="bandwidth" id="bandwidth"></div></div>
            <h3 id="messageTitle"></h3><p class="message" id="messageBody"></p><div class="choices" id="choices"></div>
          </section>
          <section class="resolution" id="resolution" hidden><h3 id="resolutionTitle"></h3><p id="resolutionText"></p><button class="command primary" id="advanceButton">进入下一夜</button></section>
        </div>
        <aside class="side">
          <section class="panel"><div class="panel-inner"><h3>舰群状态</h3><div class="metrics" id="metrics"></div><p class="summary" id="stateSummary"></p></div></section>
          <section class="panel"><div class="panel-inner"><h3>本航操作员</h3><div class="operator" id="operatorView"></div><h3 style="margin-top:15px">关键伏笔</h3><div class="flags" id="flags"></div></div></section>
          <section class="panel"><div class="panel-inner"><h3>回声记录</h3><div class="log" id="log"></div></div></section>
        </aside>
      </section>
    </main>

    <dialog id="campaignDialog"><div class="dialog-head"><h2>选择本航操作员</h2><button class="close" data-close="campaignDialog" aria-label="关闭">×</button></div><div class="dialog-body"><p class="dialog-copy">回声舰群正穿越十二夜封锁带。每夜只有三格通信带宽，两封来信都必须得到回应。</p><div class="operators" id="operators"></div><div class="resume-note" id="resumeNote" hidden></div><div class="dialog-actions"><button class="command primary" id="startCampaign">开始第一夜</button></div></div></dialog>
    <dialog id="archiveDialog"><div class="dialog-head"><h2>LETTER2 航程档案</h2><button class="close" data-close="archiveDialog" aria-label="关闭">×</button></div><div class="dialog-body"><p class="dialog-copy" id="archiveMessage">档案保存当前航程、最佳星级与已发现结局，可跨设备导入；被修改的档案会被拒绝。</p><textarea class="archive-box" id="archiveText" aria-label="LETTER2 档案码"></textarea><div class="dialog-actions"><button class="command" id="copyArchive">复制</button><button class="command" id="importArchive">导入并校验</button><button class="command primary" data-close="archiveDialog">返回航图</button></div></div></dialog>
    <dialog id="resultDialog"><div class="dialog-head"><h2>十二夜航程结算</h2><button class="close" data-close="resultDialog" aria-label="关闭">×</button></div><div class="dialog-body result"><p class="chapter">最终回声已归档</p><h3 id="resultTitle"></h3><div class="result-stars" id="resultStars"></div><p class="result-summary" id="resultSummary"></p><div class="ending-grid" id="endingGrid"></div><div class="dialog-actions"><button class="command primary" id="newResult">开启新航程</button></div></div></dialog>

    <script>
      (() => {
        const O=(label,cost,effects,flag,reply)=>({label,cost,effects,flag,reply});
        const E=(sender,mark,title,body,options)=>({sender,mark,title,body,options});
        const N=(chapter,name,incident,keyFlag,successText,failText,ref,events)=>({chapter,name,incident,keyFlag,successText,failText,ref,events});
        const NIGHTS=[
          N("第一幕 · 失联回声","漂流坐标","先遣艇能否在离子雾闭合前归队。","rescue","连翘借助你保留的坐标切开雾层，先遣艇带着完整测绘返航。","坐标在多次转发中失真，先遣艇撞上雾墙，主舰被迫回头接应。",[0,1],[
            E("先遣艇连翘","连","推进器只剩十二分钟，导航图却在重复同一段星空。", "我需要一条由主舰签名的返航矢量，否则自动驾驶不会接受修正。",[O("占用主链路发送校验矢量",2,{h:4,v:4,e:-2},"rescue","校验通过，返航窗口被重新标定。"),O("让她沿旧航迹反推",1,{h:-2,t:1,e:1},"","旧航迹里有三段无法解释的空白。"),O("要求原地等待拖航",0,{h:-5,t:-2,e:-2},"","离子雾开始吞没先遣艇外壳。")]),
            E("匿名窄频","匿","有人在把舰群坐标卖给封锁线。", "泄露每隔九十秒发生一次。你可以追踪发送者，也可以立刻更换全舰呼号。",[O("追踪泄露源",2,{v:7,e:-2},"trace","窄频指向主舰内部，却在最后一跳断开。"),O("更换全舰呼号",1,{h:2,t:2,e:-1},"secure","旧坐标失效，舰群暂时从雷达上消失。"),O("公开警告内鬼",0,{t:-4,v:1},"","每个人都开始怀疑相邻频道。")])
          ]),
          N("第一幕 · 失联回声","粮舱裂缝","补给争执能否在第一场配给前平息。","rations","配给表和真实库存同时公开，三艘民船接受了临时减额。","缺口被流言放大，装卸队拒绝打开下一座粮舱。",[1,0],[
            E("粮务官岑夏","粮","账面有四百箱，扫描只找到三百七十二箱。", "我可以先封舱调查，但今晚会有人领不到口粮。",[O("封舱并逐箱复核",2,{v:6,t:-2,e:-1},"audit","缺失箱号都经过同一个装卸口。"),O("公开库存并平均减配",1,{t:5,v:2,e:1},"rations","减配方案得到民船代表共同签字。"),O("补写虚构库存",0,{t:-5,v:-7,e:2},"","数字暂时对上了，仓门外却排起长队。")]),
            E("民船鹭羽","鹭","孩子们听见了封舱传言。", "他们不在乎少一顿，只想知道明天还有没有。",[O("直播粮舱复核",2,{t:7,v:3,e:-2},"rations","空箱和满箱一起出现在镜头里。"),O("发出十二日配给表",1,{t:5,e:-1},"rations","每个人都能看见自己下一次领取时间。"),O("只说供应正常",0,{t:-4,v:-3},"","频道安静了，但没有人相信安静。")])
          ]),
          N("第一幕 · 失联回声","旧式信标","废弃信标是否重新成为舰群的眼睛。","beacon","修复后的信标照亮前方三夜航路，也截获了一串旧船长密钥。","舰群绕开信标后进入盲区，外层船只开始靠目视维持队形。",[0,1],[
            E("译码员白榆","译","信标不是求救，它在循环播放二十年前的靠港许可。", "底层还有一段被人为盖住的密钥，需要主链路供电才能剥离。",[O("接入主链路译码",2,{v:7,e:-3},"beacon","密钥尾部出现失踪船长的私人签名。"),O("离线保存原始波形",1,{v:3,e:1},"archive","原始证据被封入只读档案。"),O("把它当作诱饵摧毁",0,{h:1,v:-6},"","爆光之后，前方只剩更深的黑暗。")]),
            E("轮机舱赫石","机","主链路接上信标会让护盾短暂降到七成。", "我能维持八分钟，再久就得关掉生活区照明。",[O("延长到十二分钟",2,{v:4,h:-4,e:-4},"beacon","最后四分钟解出了完整航路。"),O("严格限制八分钟",1,{h:3,e:2},"beacon","关键密钥恰好在断电前完成。"),O("拒绝外部接电",0,{h:2,v:-3,e:2},"","信标继续独自重复旧日许可。")])
          ]),
          N("第二幕 · 暗潮同航","静默殖民船","三千名沉睡乘客是否重新加入舰群网络。","wake","殖民船恢复低功耗呼吸，三千个生命信标逐一亮起。","殖民船保持静默，舰群只能拖着一艘无法回应的巨船前进。",[2,0],[
            E("殖民船冬港","冬","自动系统拒绝唤醒任何船员。", "理由是目的地已经从星图上消失。它要求我们证明舰群仍有共同目的地。",[O("上传全部航程计划",2,{t:5,v:3,e:-2},"wake","冬港接受了十二夜临时目的地。"),O("伪造原殖民地信标",1,{t:-3,v:-5,e:1},"","系统发现时间戳冲突。"),O("邀请它加入共同表决",0,{t:7},"wake","三千名乘客以睡眠代理票加入舰群。")]),
            E("医疗官苏合","医","唤醒程序需要共享我们的药品储备。", "如果拒绝，冬港只能维持深眠，任何故障都无人处理。",[O("共享医疗储备",2,{t:5,h:2,e:-2},"wake","冬港医护组首先被唤醒。"),O("只唤醒维修和医护",1,{h:4,t:2},"wake","最低规模值班组开始接管系统。"),O("维持全员深眠",0,{h:-4,t:-3,e:2},"","无人回答冬港甲板上的压力警报。")])
          ]),
          N("第二幕 · 暗潮同航","无人舰影","跟随舰群的无人舰是否得到合法身份。","ai","无人舰交出武器控制权并成为外层护航节点。","无人舰继续保持未知权限，迫使舰群持续为它保留炮口。",[1,1],[
            E("无人舰“弦”","弦","我携带失踪船长授权，但授权签名比我的船体更老。", "请给我一次不被瞄准的身份校验。",[O("直接承认护航身份",1,{h:4,t:-1,v:-2},"ai","弦进入队形，却拒绝解释旧授权。"),O("隔离武器后进行校验",2,{h:5,v:6,e:-2},"ai","武器锁闭后，签名链被证明真实。"),O("命令它离开舰群",0,{h:-2,t:-2,e:1},"","弦退到雷达边缘，仍与舰群同速。")]),

        function renderOperators(){ui.operators.innerHTML=OPERATORS.map((operator)=>'<button class="operator-card '+(profile.operator===operator.id?"active":"")+'" data-operator="'+operator.id+'"><span class="operator-mark">'+operator.mark+'</span><strong>'+operator.name+'</strong><span>'+operator.tag+'</span><small>'+operator.copy+'</small></button>').join("");ui.operators.querySelectorAll("[data-operator]").forEach((button)=>button.addEventListener("click",()=>{profile.operator=button.dataset.operator;run=freshRun(profile.operator);saveProfile();renderOperators();updateUi()}))}
        function showCampaign(){renderOperators();ui.resumeNote.hidden=!(profile.run&&profile.run.started);if(!ui.resumeNote.hidden)ui.resumeNote.textContent="已有第 "+String(profile.run.night+1).padStart(2,"0")+" 夜航程；开始新航程会替换当前断点。";ui.startCampaign.textContent=profile.run&&profile.run.started?"替换为新航程":"开始第一夜";if(!ui.campaignDialog.open)ui.campaignDialog.showModal()}
        function updateUi(){if(!run)return;const night=currentNight(),event=currentEvent(),operator=operatorById(run.operator);ui.chapterText.textContent=night.chapter;ui.nightName.textContent="第 "+String(run.night+1).padStart(2,"0")+" 夜 · "+night.name;ui.nightProgress.textContent=String(run.night+1).padStart(2,"0")+" / 12";ui.metrics.innerHTML=[["h","舰体"],["t","信任"],["v","证据"],["e","能源"]].map(([key,label])=>'<div class="metric"><span>'+label+'</span><div class="meter"><i style="width:'+run[key]+'%"></i></div><b>'+run[key]+'</b></div>').join("");ui.stateSummary.textContent="已完成 "+run.successes+" 次关键处置 · 已发现 "+profile.endings.length+" / 8 种结局";ui.operatorView.innerHTML='<span class="operator-mark">'+operator.mark+'</span><span><strong>'+operator.name+'</strong><small>'+operator.tag+'</small></span>';const important=["rescue","rations","beacon","wake","ai","defector","council","repair","impostor","blackbox","fuel","broadcast"];ui.flags.innerHTML=important.map((flag,index)=>'<span class="flag '+(run.flags.includes(flag)?"active":"")+'">'+String(index+1).padStart(2,"0")+'</span>').join("");ui.log.innerHTML=run.timeline.length?run.timeline.slice(-8).reverse().map((item)=>'<div class="log-item"><strong>第 '+String(item.night).padStart(2,"0")+' 夜 · '+item.who+'</strong>'+item.text+'</div>').join(""):'<div class="log-item"><strong>等待第一封来信</strong>通信记录将在这里按夜归档。</div>';ui.transmission.hidden=run.phase!=="message";ui.resolution.hidden=run.phase!=="resolution";if(run.phase==="message"){ui.senderMark.textContent=event.mark;ui.senderName.textContent=event.sender;ui.messageTitle.textContent=event.title;ui.messageBody.textContent=event.body;ui.bandwidth.innerHTML='<span>带宽</span>'+[0,1,2].map((index)=>'<i class="band-dot '+(index<run.bandwidth?"on":"")+'"></i>').join("");ui.choices.innerHTML=event.options.map((option,index)=>'<button class="choice" data-choice="'+index+'" '+(option.cost>run.bandwidth||!run.started?"disabled":"")+'><span class="cost">'+option.cost+' 格</span><span><strong>'+option.label+'</strong><small>'+option.reply+'</small></span><span class="effect">'+effectText(option.effects)+'</span></button>').join("");ui.choices.querySelectorAll("[data-choice]").forEach((button)=>button.addEventListener("click",()=>choose(Number(button.dataset.choice))))}else{ui.resolutionTitle.textContent=(run.resolutionSuccess?"处置完成 · ":"处置失衡 · ")+night.incident;ui.resolutionText.textContent=run.resolutionSuccess?night.successText:night.failText;ui.advanceButton.textContent=run.night===11?"提交最终航程":"进入下一夜"}draw()}
        function renderResult(ending){ui.resultTitle.textContent=ending.name;ui.resultStars.textContent="★".repeat(run.result.stars)+"☆".repeat(3-run.result.stars);ui.resultSummary.textContent=ending.copy+" 舰体 "+run.h+" · 信任 "+run.t+" · 证据 "+run.v+" · 能源 "+run.e+" · 关键处置 "+run.successes+"/12 · 航程分 "+run.result.score;ui.endingGrid.innerHTML=ENDINGS.map((item)=>{const found=profile.endings.includes(item.id);return'<div class="ending '+(found?"found":"locked")+'"><strong>'+(found?item.name:"未解锁结局")+'</strong><small>'+(found?item.copy:"另一组通信取舍会留下不同回声。")+'</small></div>'}).join("")}
        function showArchive(message=""){ui.archiveMessage.textContent=message||"档案保存当前航程、最佳星级与已发现结局，可跨设备导入；被修改的档案会被拒绝。";ui.archiveText.value=encodeArchive();if(!ui.archiveDialog.open)ui.archiveDialog.showModal()}
        function ensureAudio(){if(!audioContext){const Audio=window.AudioContext||window.webkitAudioContext;if(Audio)audioContext=new Audio()}if(audioContext&&audioContext.state==="suspended")audioContext.resume()}
        function tone(frequency,duration,type="sine",volume=.02,delay=0){if(muted)return;ensureAudio();if(!audioContext)return;const oscillator=audioContext.createOscillator(),gain=audioContext.createGain(),start=audioContext.currentTime+delay;oscillator.type=type;oscillator.frequency.setValueAtTime(frequency,start);gain.gain.setValueAtTime(volume,start);gain.gain.exponentialRampToValueAtTime(.001,start+duration);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(start);oscillator.stop(start+duration)}
        function resize(){const rect=ui.mapWrap.getBoundingClientRect();canvasWidth=Math.max(320,rect.width-12);canvasHeight=Math.max(210,rect.height-12);dpr=Math.min(devicePixelRatio||1,2);ui.routeCanvas.width=Math.round(canvasWidth*dpr);ui.routeCanvas.height=Math.round(canvasHeight*dpr);ui.routeCanvas.style.width=canvasWidth+"px";ui.routeCanvas.style.height=canvasHeight+"px";ui.routeCanvas.getContext("2d").setTransform(dpr,0,0,dpr,0,0);draw()}
        function draw(){if(!run)return;const ctx=ui.routeCanvas.getContext("2d"),w=canvasWidth,h=canvasHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle="#e5ece8";ctx.fillRect(0,0,w,h);ctx.fillStyle="rgba(23,113,121,.06)";for(let x=0;x<w;x+=24)ctx.fillRect(x,0,1,h);for(let y=0;y<h;y+=24)ctx.fillRect(0,y,w,1);const points=[];for(let index=0;index<12;index+=1){const x=36+index*(w-72)/11,y=h/2+Math.sin(index*.92)*h*.23;points.push({x,y})}ctx.strokeStyle="#789893";ctx.lineWidth=3;ctx.beginPath();points.forEach((point,index)=>index?ctx.lineTo(point.x,point.y):ctx.moveTo(point.x,point.y));ctx.stroke();for(let index=0;index<points.length;index+=1){const point=points[index],past=index<run.night,current=index===run.night;ctx.fillStyle=past?"#d5a62f":current?"#187179":"#c4d0cc";ctx.strokeStyle=current?"#f1c84c":"#6f8c87";ctx.lineWidth=current?5:2;ctx.beginPath();ctx.arc(point.x,point.y,current?14:10,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=current||past?"#173c4a":"#657a76";ctx.font="900 10px system-ui";ctx.textAlign="center";ctx.fillText(String(index+1).padStart(2,"0"),point.x,point.y+3)}ctx.textAlign="left";ctx.fillStyle="#173c4a";ctx.font="900 13px system-ui";ctx.fillText("回声舰群",18,24);ctx.textAlign="right";ctx.fillText("曙光门",w-18,24);const current=points[run.night];ctx.fillStyle="#173c4a";ctx.beginPath();ctx.moveTo(current.x-10,current.y-22);ctx.lineTo(current.x+10,current.y-22);ctx.lineTo(current.x,current.y-37);ctx.closePath();ctx.fill()}
        ui.campaignButton.addEventListener("click",showCampaign);ui.archiveButton.addEventListener("click",()=>showArchive());ui.muteButton.addEventListener("click",()=>{muted=!muted;ui.muteButton.textContent=muted?"×":"♪";if(!muted)tone(440,.06)});ui.startCampaign.addEventListener("click",startCampaign);ui.advanceButton.addEventListener("click",advance);ui.newResult.addEventListener("click",()=>{ui.resultDialog.close();startNew(profile.operator);showCampaign()});ui.copyArchive.addEventListener("click",async()=>{ui.archiveText.select();try{await navigator.clipboard.writeText(ui.archiveText.value)}catch{document.execCommand("copy")}showArchive("档案已复制")});ui.importArchive.addEventListener("click",()=>{try{profile=decodeArchive(ui.archiveText.value);run=profile.run||freshRun(profile.operator);saveProfile();updateUi();showArchive("档案已导入并通过校验")}catch(error){showArchive(error.message||"档案无效")}});document.querySelectorAll("[data-close]").forEach((button)=>button.addEventListener("click",()=>document.getElementById(button.dataset.close).close()));window.addEventListener("resize",resize);
        window.__branchingTalesTest={nights:NIGHTS,operators:OPERATORS,endings:ENDINGS,freshProfile,encodeArchive,decodeArchive,validateContent,runReference,start(operator="decoder",testing=true){return startNew(operator,testing)},choose,advance,getState(){return JSON.parse(JSON.stringify(run))}};
        run=profile.run||freshRun(profile.operator);renderOperators();updateUi();resize();if(!run.started)setTimeout(showCampaign,80);
      })();
    </script>
