</style></head><body><main class="app"><header class="top"><div><h1>城市频率局：十二张干扰图</h1><div class="sub">为相邻基站协调频道：普通链路避开同频，强干扰链路还要保留一档间隔。</div></div><div class="stats"><div class="stat"><small>干扰图</small><b id="scenarioStat">1 / 12</b></div><div class="stat"><small>冲突</small><b id="conflictStat">0</b></div><div class="stat"><small>超容</small><b id="capacityStat">0</b></div><div class="stat"><small>改频</small><b id="retuneStat">0 / 0</b></div><div class="stat"><small>最佳</small><b id="starStat">☆☆☆</b></div></div></header><div class="layout"><section class="panel network"><div class="network-head"><div><h2 id="scenarioTitle"></h2><div class="sub" id="scenarioBrief"></div></div><span class="chapter" id="chapterLabel"></span></div><canvas id="networkCanvas" width="960" height="480" aria-label="城市信道干扰网络"></canvas><div class="channels" id="channels"></div><div class="nodes" id="nodes"></div><div class="controls"><button class="btn primary" id="submitBtn">执行全网验收</button><button class="btn blue" id="demoBtn">检查选中站</button><button class="btn" id="hintBtn">协调参考</button><button class="btn" id="undoBtn">撤回改频</button><button class="btn" id="resetBtn">重置方案</button><button class="btn" id="archiveBtn">档案码</button><button class="btn" id="bookBtn">干扰图目录</button></div><div class="message" id="message"></div></section><aside class="side"><section class="panel section"><h2>频道容量</h2><div id="capacities"></div></section><section class="panel section"><h2>当前问题</h2><div id="violations"></div></section><section class="panel section"><h2>图例与规则</h2><div class="legend"><span class="line"></span><span>普通干扰边：两端频道不得相同</span><span class="line strong"></span><span>强干扰边：频道编号至少相差 2</span></div><div class="message">锁定站不可改频。三星要求全网合法、改频数不超过公开预算且不使用协调参考。本页是抽象图约束游戏，不用于真实无线电规划。</div></section></aside></div></main><div class="overlay" id="bookOverlay"><section class="modal"><h2>十二张城市干扰图</h2><p>从三区教学网递进到五频道高密网络。所有拓扑、初始频道、锁定站和容量均固定可复现。</p><div class="scenarios" id="scenarios"></div></section></div><div class="over (()=>{"use strict";const $=id=>document.getElementById(id),SAVE="frequencyBureauV2",canvas=$("networkCanvas"),ctx=canvas.getContext("2d"),COLORS=["#ff7c83","#69bff0","#68d99a","#ffd068","#bc8cf2"],NAMES=["旧城教学网","滨河接力网","山麓广播网","东环通勤网","港区堆场网","湖湾会展网","北岭应急网","南城密集网","跨江联络网","星港多层网","环湾高功率网","终局全域网"],BRIEFS=["三频道基础：先消除相邻同频。","加入频道容量，不能把所有站挤到同一空闲频道。","首个锁定站出现，围绕固定频道重新协调。","强干扰边要求至少隔开一档频道。","四频道网络开始出现多条弦边。","在锁定站和容量之间控制改频数量。","高功率站扩大干扰间隔。","八站密集网要求复用多个频道。","跨江链路把两片局部网连接起来。","五频道让解空间扩大，也带来更严格容量。","强干扰边密度继续提高。","十一站全域终审，要求预算内一次通过。"];
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function edgeKey(a,b){return a<b?`${a}-${b}`:`${b}-${a}`}
function buildScenario(index){const count=6+Math.floor(index/2),channelCount=3+Math.floor(index/4),chapter=Math.floor(index/3),nodes=Array.from({length:count},(_,id)=>{const angle=-Math.PI/2+Math.PI*2*id/count,radius=id%2?185:160;return{id,n:`站 ${String.fromCharCode(65+id)}`,x:480+Math.cos(angle)*radius,y:240+Math.sin(angle)*radius}}),reference=nodes.map((_,id)=>(id+index)%channelCount),seen=new Set(),edges=[];function add(a,b,strong=false){if(a===b||reference[a]===reference[b])return;const key=edgeKey(a,b);if(seen.has(key))return;seen.add(key);const separation=Math.abs(reference[a]-reference[b]);edges.push({a,b,strong:strong&&separation>=2})}for(let id=0;id<count-1;id++)add(id,id+1,(id+index)%4===0);add(count-1,0,index%2===0);for(let id=0;id<count;id++){add(id,(id+2)%count,(id+index)%3===0);if(index>=5)add(id,(id+3)%count,(id*2+index)%5===0)}const locked=index>=2?[index%count]:(index===1?[0]:[]),initial=nodes.map((_,id)=>locked.includes(id)?reference[id]:0),capacity=Array.from({length:channelCount},(_,channel)=>reference.filter(value=>value===channel).length),par=reference.reduce((sum,value,id)=>sum+(!locked.includes(id)&&value!==initial[id]?1:0),0);return{index,n:NAMES[index],brief:BRIEFS[index],chapter,nodes,edges,channelCount,reference,locked,initial,capacity,par}}
const SCENARIOS=Array.from({length:12},(_,index)=>buildScenario(index));
function evaluate(index,assignment,hints=0){const item=SCENARIOS[index],values=Array.from({length:item.nodes.length},(_,id)=>Number.isInteger(assignment?.[id])?assignment[id]:item.initial[id]),edgeViolations=item.edges.filter(edge=>edge.strong?Math.abs(values[edge.a]-values[edge.b])<2:values[edge.a]===values[edge.b]),counts=Array.from({length:item.channelCount},(_,channel)=>values.filter(value=>value===channel).length),capacityViolations=counts.map((count,channel)=>({channel,count,limit:item.capacity[channel]})).filter(value=>value.count>value.limit),lockViolations=item.locked.filter(id=>values[id]!==item.reference[id]),retunes=values.reduce((sum,value,id)=>sum+(value!==item.initial[id]?1:0),0),pass=!edgeViolations.length&&!capacityViolations.length&&!lockViolations.length,efficient=pass&&retunes<=item.par+1,master=efficient&&retunes<=item.par&&hints===0,stars=pass?1+(efficient?1:0)+(master?1:0):0;return{values,edgeViolations,counts,capacityViolations,lockViolations,retunes,pass,efficient,master,stars}}
function referenceResult(index){return evaluate(index,SCENARIOS[index].reference,0)}
function validateContent(){const errors=[],references=[];for(const item of SCENARIOS){if(new Set(item.edges.map(edge=>edgeKey(edge.a,edge.b))).size!==item.edges.length)errors.push(`${item.n} 重复边`);if(item.edges.length<item.nodes.length)errors.push(`${item.n} 拓扑过薄`);const ref=referenceResult(item.index);references.push({name:item.n,nodes:item.nodes.length,edges:item.edges.length,stars:ref.stars,retunes:ref.retunes});if(ref.stars!==3)errors.push(`${item.n} 参考协调未三星`);if(evaluate(item.index,item.initial,0).pass)errors.push(`${item.n} 初始方案已经通过`)}return{valid:!errors.length,errors,scenarios:SCENARIOS.length,nodes:SCENARIOS.reduce((sum,item)=>sum+item.nodes.length,0),edges:SCENARIOS.reduce((sum,item)=>sum+item.edges.length,0),strongEdges:SCENARIOS.reduce((sum,item)=>sum+item.edges.filter(edge=>edge.strong).length,0),references}}
function freshProfile(){return{v:2,unlocked:1,stars:Array(12).fill(0),bestRetunes:Array(12).fill(null),clears:0}}function normalizeProfile(v={}){return{v:2,unlocked:clamp(+v.unlocked||1,1,12),stars:Array.from({length:12},(_,i)=>clamp(+v.stars?.[i]||0,0,3)),bestRetunes:Array.from({length:12},(_,i)=>Number.isInteger(v.bestRetunes?.[i])?Math.max(0,v.bestRetunes[i]):null),clears:Math.max(0,+v.clears||0)}}function fresh(index){const item=SCENARIOS[index];return{v:2,scenario:index,assignment:[...item.initial],selected:item.locked.includes(0)?1:0,history:[],hints:0,finished:false,message:"选择基站后分配频道；先处理红色冲突边，再检查各频道容量。"}}
let profile=freshProfile(),q=null;function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}function encode(){const payload=btoa(unescape(encodeURIComponent(JSON.stringify({v:2,profile,q}))));return`FREQ2.${payload}.${checksum(payload)}`}function decode(code){const m=String(code).trim().match(/^FREQ2\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/);if(!m||checksum(m[1])!==m[2])throw Error("档案校验失败");const data=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(data.v!==2||!Array.isArray(data.profile?.stars))throw Error("档案版本不兼容");return{v:2,profile:normalizeProfile(data.profile),q:data.q}}function save(){localStorage.setItem(SAVE,JSON.stringify({v:2,profile,q}))}function load(){try{const data=JSON.parse(localStorage.getItem(SAVE));if(data?.v===2){profile=normalizeProfile(data.profile);q=data.q}}catch{}}function toast(text){const e=document.createElement("div");e.className="toast";e.textContent=text;document.body.append(e);setTimeout(()=>e.remove(),1400)}
function start(index){if(index>=profile.unlocked)return;q=fresh(index);$("bookOverlay").classList.add("hidden");$("infoOverlay").classList.add("hidden");save();draw()}function assign(channel){const item=SCENARIOS[q.scenario],id=q.selected;if(item.locked.includes(id))return toast("该站频道已锁定");if(channel>=item.channelCount)return;q.history.push([...q.assignment]);q.assignment[id]=channel;q.finished=false;q.message=`${item.nodes[id].n} 已改为频道 ${channel+1}。`;save();draw()}function undo(){const old=q.history.pop();if(!old)return toast("没有可撤回的改频");q.assignment=old;q.message="已撤回上一次改频。";save();draw()}function applyReference(){const item=SCENARIOS[q.scenario];q.history.push([...q.assignment]);q.assignment=[...item.reference];q.hints++;q.message="协调参考已装入；可以验收，但本次最高两星。";save();draw();return evaluate(q.scenario,q.assignment,q.hints)}function inspect(){const item=SCENARIOS[q.scenario],result=evaluate(q.scenario,q.assignment,q.hints),edges=result.edgeViolations.filter(edge=>edge.a===q.selected||edge.b===q.selected);q.message=edges.length?`${item.nodes[q.selected].n} 仍有 ${edges.length} 条干扰边不合格。`:`${item.nodes[q.selected].n} 的相邻干扰边当前合格。`;draw()}function submit(){const item=SCENARIOS[q.scenario],result=evaluate(q.scenario,q.assignment,q.hints);if(!result.pass){q.message=`全网未通过：干扰冲突 ${result.edgeViolations.length}、频道超容 ${result.capacityViolations.length}、锁定错误 ${result.lockViolations.length}。`;save();draw();return result}q.finished=true;profile.stars[q.scenario]=Math.max(profile.stars[q.scenario],result.stars);profile.bestRetunes[q.scenario]=profile.bestRetunes[q.scenario]==null?result.retunes:Math.min(profile.bestRetunes[q.scenario],result.retunes);profile.unlocked=Math.max(profile.unlocked,Math.min(12,q.scenario+2));profile.clears++;save();$("infoTitle").textContent=`全网验收完成 · ${item.n}`;$("infoBody").innerHTML=`<div class="result"><strong>${"★".repeat(result.stars)}${"☆".repeat(3-result.stars)}</strong><ul><li>干扰边：${item.edges.length} 条全部合格</li><li>改频：${result.retunes} / 大师预算 ${item.par}</li><li>频道容量：${result.counts.map((value,index)=>`${index+1}号 ${value}/${item.capacity[index]}`).join("；")}</li><li>协调参考：${q.hints}</li></ul>${q.scenario<11?'<button class="btn primary" id="nextBtn">下一张干扰图</button>':""}</div>`;$("infoOverlay").classList.remove("hidden");if($("nextBtn"))$("nextBtn").onclick=()=>start(q.scenario+1);draw();return result}
function drawCanvas(){const item=SCENARIOS[q.scenario],result=evaluate(q.scenario,q.assignment,q.hints);ctx.clearRect(0,0,960,480);ctx.fillStyle="#071b26";ctx.fillRect(0,0,960,480);for(const edge of item.edges){const a=item.nodes[edge.a],b=item.nodes[edge.b],bad=result.edgeViolations.includes(edge);ctx.strokeStyle=bad?"#ff7c83":edge.strong?"#f0a06d":"#4f8299";ctx.lineWidth=edge.strong?6:3;ctx.setLineDash(edge.strong?[9,5]:[]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}ctx.setLineDash([]);for(const node of item.nodes){const selected=node.id===q.selected,locked=item.locked.includes(node.id);ctx.fillStyle=COLORS[q.assignment[node.id]];ctx.beginPath();ctx.arc(node.x,node.y,selected?31:26,0,Math.PI*2);ctx.fill();ctx.strokeStyle=selected?"#fff":"#07131b";ctx.lineWidth=selected?5:3;ctx.stroke();ctx.fillStyle="#061018";ctx.textAlign="center";ctx.font="bold 15px sans-serif";ctx.fillText(node.n,node.x,node.y+5);if(locked){ctx.font="16px serif";ctx.fillText("🔒",node.x+24,node.y-20)}}}
function drawBook(){$("scenarios").innerHTML=SCENARIOS.map((item,index)=>`<button class="scenario" data-scenario="${index}" ${index>=profile.unlocked?"disabled":""}><span>${["📻","📡","🛰️","🌐"][item.chapter]}</span><h3>${index+1}. ${item.n}</h3><p>第 ${item.chapter+1} 章 · ${item.nodes.length} 站 / ${item.edges.length} 边 / ${item.channelCount} 频道<br>${item.brief}</p><div class="stars">${"★".repeat(profile.stars[index])}${"☆".repeat(3-profile.stars[index])}</div></button>`).join("");document.querySelectorAll("[data-scenario]").forEach(button=>button.onclick=()=>start(+button.dataset.scenario))}
function draw(){if(!q)return;const item=SCENARIOS[q.scenario],result=evaluate(q.scenario,q.assignment,q.hints);$("scenarioStat").textContent=`${q.scenario+1} / 12`;$("conflictStat").textContent=result.edgeViolations.length;$("capacityStat").textContent=result.capacityViolations.length;$("retuneStat").textContent=`${result.retunes} / ${item.par}`;$("starStat").textContent="★".repeat(profile.stars[q.scenario])+"☆".repeat(3-profile.stars[q.scenario]);$("scenarioTitle").textContent=`📡 ${item.n}`;$("scenarioBrief").textContent=item.brief;$("chapterLabel").textContent=`第 ${item.chapter+1} 章 · ${item.channelCount} 频道`;$("message").textContent=q.message;$("channels").innerHTML=COLORS.map((color,index)=>`<button class="channel ${q.assignment[q.selected]===index?"active":""}" data-channel="${index}" style="background:${color};color:#061018" ${index>=item.channelCount?"disabled":""}>频道 ${index+1}</button>`).join("");document.querySelectorAll("[data-channel]").forEach(button=>button.onclick=()=>assign(+button.dataset.channel));$("nodes").innerHTML=item.nodes.map(node=>`<button class="node ${node.id===q.selected?"selected":""} ${item.locked.includes(node.id)?"locked":""}" data-node="${node.id}"><b><span style="color:${COLORS[q.assignment[node.id]]}">●</span> ${node.n} ${item.locked.includes(node.id)?"🔒":""}</b><small>初始频道 ${item.initial[node.id]+1} · 当前 ${q.assignment[node.id]+1}</small></button>`).join("");document.querySelectorAll("[data-node]").forEach(button=>button.onclick=()=>{q.selected=+button.dataset.node;save();draw()});$("capacities").innerHTML=result.counts.map((count,index)=>`<div class="capacity"><span style="color:${COLORS[index]}">● ${index+1}号</span><div class="bar"><i style="width:${Math.min(100,count/item.capacity[index]*100)}%;background:${count>item.capacity[index]?"#ff7c83":COLORS[index]}"></i></div><b>${count}/${item.capacity[index]}</b></div>`).join("");const issues=[];result.edgeViolations.slice(0,6).forEach(edge=>issues.push(`<div class="violation bad"><b>${edge.strong?"强干扰":"同频冲突"}</b><br>${item.nodes[edge.a].n} ↔ ${item.nodes[edge.b].n}</div>`));result.capacityViolations.forEach(value=>issues.push(`<div class="violation bad"><b>频道 ${value.channel+1} 超容</b><br>${value.count}/${value.limit} 个基站</div>`));$("violations").innerHTML=issues.join("")||'<div class="violation"><b>当前无规则冲突</b><br>仍需执行全网验收记录结果。</div>';drawCanvas();drawBook();save()}
function showArchive(){const code=encode();$("infoTitle").textContent="跨设备频率档案";$("infoBody").innerHTML=`<p class="sub">星级、最佳改频数和当前协调方案包含在校验档案中。</p><textarea class="savebox" id="saveCode">${code}</textarea><div class="controls"><button class="btn" id="copyBtn">复制导出</button><button class="btn" id="importBtn">导入上方档案</button></div>`;$("infoOverlay").classList.remove("hidden");$("copyBtn").onclick=()=>navigator.clipboard?.writeText($("saveCode").value);$("importBtn").onclick=()=>{try{const data=decode($("saveCode").value);profile=data.profile;q=data.q||fresh(0);save();$("infoOverlay").classList.add("hidden");draw();toast("频率档案导入成功")}catch(error){toast(error.message)}}}
canvas.onpointerdown=event=>{if(!q)return;const rect=canvas.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width*960,y=(event.clientY-rect.top)/rect.height*480,item=SCENARIOS[q.scenario],nearest=[...item.nodes].sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y))[0];if(Math.hypot(nearest.x-x,nearest.y-y)<55){q.selected=nearest.id;save();draw()}};$("submitBtn").onclick=submit;$("demoBtn").onclick=inspect;$("hintBtn").onclick=applyReference;$("undoBtn").onclick=undo;$("resetBtn").onclick=()=>start(q.scenario);$("archiveBtn").onclick=showArchive;$("bookBtn").onclick=()=>{$("bookOverlay").classList.remove("hidden");drawBook()};$("closeInfoBtn").onclick=()=>$("infoOverlay").classList.add("hidden");load();drawBook();if(q){$("bookOverlay").classList.add("hidden");draw()}window.__frequencyBureau={SCENARIOS,evaluate,referenceResult,validateContent,fresh,state:()=>q,profile:()=>profile,start,assign,applyReference,submit,encode,decode};
})();</script></body></html>
