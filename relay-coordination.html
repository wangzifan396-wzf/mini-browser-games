function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
function encodeArchive(){const payload=btoa(unescape(encodeURIComponent(JSON.stringify({v:2,profile,q}))));return`RELAY2.${payload}.${checksum(payload)}`}
function decodeArchive(code){const match=String(code).trim().match(/^RELAY2\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/);if(!match||checksum(match[1])!==match[2])throw Error("档案校验失败");const data=JSON.parse(decodeURIComponent(escape(atob(match[1]))));if(data.v!==2||!Array.isArray(data.profile?.stars))throw Error("档案版本不兼容");return data}
function save(){localStorage.setItem(SAVE,JSON.stringify({v:2,profile,q}))}
function load(){try{const data=JSON.parse(localStorage.getItem(SAVE));if(data?.v===2){profile={...profile,...data.profile,stars:[...profile.stars,...(data.profile.stars||[])].slice(-12),bestHints:[...profile.bestHints,...(data.profile.bestHints||[])].slice(-12),clears:[...profile.clears,...(data.profile.clears||[])].slice(-12)};q=data.q;if(q&&!SCENARIOS[q.scenario])q=null}}catch{}}
function pathResult(s,settings,test){const contenders=test.path.filter(id=>id!==test.disabled&&settings[id].pickup<=test.current).map(id=>({id,delay:settings[id].delay}));if(!contenders.length)return{pass:false,winners:[],reason:"故障电流低于全部动作电流，保护拒动"};const first=Math.min(...contenders.map(x=>x.delay)),winners=contenders.filter(x=>x.delay===first).map(x=>x.id),pass=winners.length===1&&winners[0]===test.target;return{pass,winners,first,reason:pass?`${test.target} 在 ${first} 级时限首先动作`:winners.length>1?`${winners.join("、")} 同时动作，失去选择性`:`${winners[0]} 越级动作，应由 ${test.target} 先切除`}}
function evaluateScenario(index,settings){const s=SCENARIOS[index],normal=s.edges.map(e=>({id:`N-${e.id}`,name:`${e.id} 正常负荷`,type:"normal",pass:settings[e.id].pickup>e.normal,reason:settings[e.id].pickup>e.normal?`负荷 ${e.normal} < 整定 ${settings[e.id].pickup}`:`动作电流 ${settings[e.id].pickup} 不高于负荷 ${e.normal}`})),faults=s.cases.map(test=>({...test,...pathResult(s,settings,test)})),primary=faults.filter(x=>x.type==="primary"),backup=faults.filter(x=>x.type==="backup"),pickupSum=Object.values(settings).reduce((a,x)=>a+x.pickup,0),delaySum=Object.values(settings).reduce((a,x)=>a+x.delay,0),normalPass=normal.every(x=>x.pass),primaryPass=primary.every(x=>x.pass),backupPass=backup.every(x=>x.pass),complete=normalPass&&primaryPass,efficient=pickupSum<=s.pickupBudget&&delaySum<=s.delayBudget;return{normal,faults,tests:[...normal,...faults],normalPass,primaryPass,backupPass,complete,efficient,pickupSum,delaySum,primaryPassed:primary.filter(x=>x.pass).length,backupPassed:backup.filter(x=>x.pass).length,primaryTotal:primary.length,backupTotal:backup.length,stars:complete?1+(backupPass?1:0)+(backupPass&&efficient?1:0):0}}
function validateContent(){const errors=[],references=[];for(const s of SCENARIOS){const nodeIds=new Set(s.nodes.map(n=>n.id)),edgeIds=new Set(s.edges.map(e=>e.id));if(nodeIds.size!==s.nodes.length||edgeIds.size!==s.edges.length)errors.push(`${s.name} ID 重复`);if(s.edges.some(e=>!nodeIds.has(e.from)||!nodeIds.has(e.to)))errors.push(`${s.name} 存在悬空边`);const result=evaluateScenario(s.index,s.reference);references.push({name:s.name,edges:s.edges.length,cases:s.cases.length,stars:result.stars});if(result.stars!==3)errors.push(`${s.name} 参考整定未三星`)}return{valid:!errors.length,errors,scenarios:SCENARIOS.length,relays:SCENARIOS.reduce((a,s)=>a+s.edges.length,0),cases:SCENARIOS.reduce((a,s)=>a+s.cases.length,0),references}}
function pushHistory(){q.history.push(JSON.stringify(q.settings));q.history=q.history.slice(-30)}
function setSetting(id,key,value){pushHistory();q.settings[id][key]=+value;q.last=null;q.focusPath=[id];q.trips=[];q.message=`${id} ${key==="pickup"?"动作电流":"时限"}调整为 ${value}${key==="delay"?" 级":""}。`;save();draw()}
function undo(){const prior=q.history.pop();if(!prior)return toast("没有可撤销的整定");q.settings=JSON.parse(prior);q.last=null;q.message="已撤销上一步整定。";save();draw()}
function reset(){pushHistory();const freshRun=fresh(q.scenario);q.settings=freshRun.settings;q.hints=0;q.last=null;q.focusPath=[];q.trips=[];q.message="已恢复初始整定，所有保护暂用相同时限。";save();draw()}
function hint(){const s=SCENARIOS[q.scenario],wrong=s.edges.find(e=>q.settings[e.id].pickup!==s.reference[e.id].pickup)||s.edges.find(e=>q.settings[e.id].delay!==s.reference[e.id].delay);if(!wrong)return toast("当前整定已经与参考方案一致");pushHistory();const ref=s.reference[wrong.id],cur=q.settings[wrong.id];if(cur.pickup!==ref.pickup)cur.pickup=ref.pickup;else cur.delay=ref.delay;q.hints++;q.focusPath=[wrong.id];q.trips=[];q.message=`提示：校准 ${wrong.id} 的${cur.pickup===ref.pickup&&cur.delay!==ref.delay?"动作电流":"整定参数"}，注意上下级之间必须保留时限级差。`;save();draw()}
function focusCase(){const s=SCENARIOS[q.scenario],test=s.cases[selectedCase]||s.cases[0];q.focusPath=[...test.path];q.trips=[];q.message=`${test.name}：故障电流 ${test.current}，期望 ${test.target} 首先动作${test.disabled?`；假定 ${test.disabled} 拒动`:""}。`;draw()}
function demo(){const s=SCENARIOS[q.scenario],test=s.cases[selectedCase]||s.cases[0],result=pathResult(s,q.settings,test);q.focusPath=[...test.path];q.trips=[...result.winners];q.last={kind:"demo",tests:[{...test,...result}]};q.message=`演练结果：${result.reason}。`;save();draw();tone(result.pass?620:120)}
function testAll(){const result=evaluateScenario(q.scenario,q.settings),s=SCENARIOS[q.scenario];q.last=result;q.focusPath=[];q.trips=result.faults.filter(x=>!x.pass).flatMap(x=>x.winners).slice(0,4);q.message=result.complete?`一次保护全部正确；后备 ${result.backupPassed}/${result.backupTotal}，本次获得 ${result.stars} 星。`:`尚未通过：正常负荷 ${result.normalPass?"通过":"误动"}，一次保护 ${result.primaryPassed}/${result.primaryTotal}。`;if(result.complete){const stars=result.stars-(q.hints>0&&result.stars===3?1:0),old=profile.stars[q.scenario]||0;profile.stars[q.scenario]=Math.max(old,stars);profile.bestHints[q.scenario]=profile.bestHints[q.scenario]==null?q.hints:Math.min(profile.bestHints[q.scenario],q.hints);profile.clears[q.scenario]=(profile.clears[q.scenario]||0)+1;profile.unlocked=Math.max(profile.unlocked,Math.min(12,q.scenario+2));save();showResult({...result,stars});tone(760)}else{save();tone(100)}draw()}
function showResult(result){const s=SCENARIOS[q.scenario],next=q.scenario<11?`<button class="btn primary" id="nextScenarioBtn">下一站</button>`:"";$("infoTitle").textContent=`整定验收 · ${s.name}`;$("infoBody").innerHTML=`<div class="result-card"><strong>${"★".repeat(result.stars)}${"☆".repeat(3-result.stars)}</strong><ul><li>正常负荷：${result.normalPass?"无误动":"存在误动"}</li><li>一次保护：${result.primaryPassed}/${result.primaryTotal}</li><li>后备保护：${result.backupPassed}/${result.backupTotal}</li><li>灵敏度预算：${result.pickupSum}/${s.pickupBudget}</li><li>时限预算：${result.delaySum}/${s.delayBudget}</li><li>提示次数：${q.hints}${q.hints?"（本局最高两星）":""}</li></ul>${next}</div>`;$("infoOverlay").classList.remove("hidden");if($("nextScenarioBtn"))$("nextScenarioBtn").onclick=()=>startScenario(q.scenario+1)}
function showArchive(){const code=encodeArchive();$("infoTitle").textContent="跨设备保护档案";$("infoBody").innerHTML=`<p class="sub">十二站星级、解锁进度与当前整定均包含在带校验的档案码中。</p><textarea class="savebox" id="archiveCode">${code}</textarea><div class="controls"><button class="btn" id="copyArchiveBtn">复制档案</button><button class="btn" id="importArchiveBtn">导入上方档案</button></div>`;$("infoOverlay").classList.remove("hidden");$("copyArchiveBtn").onclick=()=>navigator.clipboard?.writeText($("archiveCode").value);$("importArchiveBtn").onclick=()=>{try{const data=decodeArchive($("archiveCode").value);profile=data.profile;q=data.q;save();$("infoOverlay").classList.add("hidden");if(q){$("mapOverlay").classList.add("hidden");selectedCase=0;draw()}else{$("mapOverlay").classList.remove("hidden");drawMap()}toast("保护档案导入成功")}catch(error){toast(error.message)}}}
function startScenario(index){q=fresh(index);selectedCase=0;selectedRelay=null;$("mapOverlay").classList.add("hidden");$("infoOverlay").classList.add("hidden");save();draw()}
function drawMap(){$("scenarioList").innerHTML=SCENARIOS.map((s,i)=>`<button class="scenario" data-scenario="${i}" ${i>=profile.unlocked?"disabled":""}><span>${s.icon}</span><h3>${i+1}. ${s.name}</h3><p>${s.chapter} · ${s.edges.length} 级保护 · ${s.cases.length} 项故障试验<br>${s.brief}</p><div class="stars">${"★".repeat(profile.stars[i]||0)}${"☆".repeat(3-(profile.stars[i]||0))}</div></button>`).join("");document.querySelectorAll("[data-scenario]").forEach(button=>button.onclick=()=>startScenario(+button.dataset.scenario))}
function drawNetwork(){const s=SCENARIOS[q.scenario],node=Object.fromEntries(s.nodes.map(n=>[n.id,n]));$("network").innerHTML=s.edges.map(e=>{const a=node[e.from],b=node[e.to],mx=(a.x+b.x)/2,my=(a.y+b.y)/2,active=q.focusPath.includes(e.id),trip=q.trips.includes(e.id),good=q.last?.complete&&q.last?.faults?.every(x=>x.pass);return`<g class="relay-hit" data-relay-svg="${e.id}"><line class="wire ${active?"active":""} ${trip?"trip":""} ${good?"good":""}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/><circle class="breaker" cx="${mx}" cy="${my}" r="24"/><text class="relay-label" x="${mx}" y="${my-2}">${e.id}</text><text class="relay-pickup" x="${mx}" y="${my+14}">${q.settings[e.id].pickup}A · t${q.settings[e.id].delay}</text></g>`}).join("")+s.nodes.map(n=>`<g class="node ${n.kind}" transform="translate(${n.x} ${n.y})"><circle r="35"/><text y="-2">${n.kind==="source"?"⚡":n.kind==="critical"?"⭐":"●"}</text><text class="kind" y="18">${n.name}</text></g>`).join("");document.querySelectorAll("[data-relay-svg]").forEach(g=>g.onclick=()=>{selectedRelay=g.dataset.relaySvg;q.focusPath=[selectedRelay];draw();document.querySelector(`[data-relay-card="${selectedRelay}"]`)?.scrollIntoView({behavior:"smooth",block:"nearest"})})}
function draw(){if(!q)return;const s=SCENARIOS[q.scenario],evaluation=evaluateScenario(q.scenario,q.settings),best=profile.stars[q.scenario]||0;$("scenarioStat").textContent=`${q.scenario+1} / 12`;$("primaryStat").textContent=`${evaluation.primaryPassed} / ${evaluation.primaryTotal}`;$("backupStat").textContent=`${evaluation.backupPassed} / ${evaluation.backupTotal}`;$("starStat").textContent="★".repeat(best)+"☆".repeat(3-best);$("scenarioTitle").textContent=`${s.icon} ${s.name}`;$("scenarioBrief").textContent=s.brief;$("chapterLabel").textContent=s.chapter;$("message").textContent=q.message;drawNetwork();
$("caseSelect").innerHTML=s.cases.map((test,i)=>`<option value="${i}" ${i===selectedCase?"selected":""}>${test.type==="backup"?"后备":"一次"} · ${test.name}</option>`).join("");$("budgetSummary").innerHTML=`<div class="summary-item"><small>动作电流和</small><b>${evaluation.pickupSum}/${s.pickupBudget}</b></div><div class="summary-item"><small>动作时限和</small><b>${evaluation.delaySum}/${s.delayBudget}</b></div><div class="summary-item"><small>提示</small><b>${q.hints}</b></div>`;
$("relays").innerHTML=s.edges.map(e=>{const setting=q.settings[e.id],ref=s.reference[e.id];return`<article class="relay-card ${q.focusPath.includes(e.id)||selectedRelay===e.id?"focus":""} ${q.trips.includes(e.id)?"trip":""}" data-relay-card="${e.id}"><header><b>${e.id}</b><small>负荷 ${e.normal}<br>参考范围 &gt;${e.normal}</small></header><div class="field"><label>动作电流</label><select data-setting="pickup" data-id="${e.id}">${PICKUPS.map(v=>`<option value="${v}" ${v===setting.pickup?"selected":""}>${v} A</option>`).join("")}</select></div><div class="field"><label>动作时限</label><select data-setting="delay" data-id="${e.id}">${DELAYS.map(v=>`<option value="${v}" ${v===setting.delay?"selected":""}>t${v}</option>`).join("")}</select></div></article>`}).join("");document.querySelectorAll("[data-setting]").forEach(select=>select.onchange=()=>setSetting(select.dataset.id,select.dataset.setting,select.value));
const tests=q.last?.tests||evaluation.tests;$("testList").innerHTML=tests.map(test=>`<div class="test"><span class="${test.pass?"ok":"bad"}">${test.pass?"✓":"✕"}</span><span>${test.name}<br><em>${test.reason}</em></span><b>${test.type==="normal"?"负荷":test.type==="backup"?"后备":"一次"}</b></div>`).join("");$("undoBtn").disabled=!q.history.length;save()}
function tone(frequency){try{const audio=new AudioContext,osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=frequency;gain.gain.value=.035;osc.connect(gain);gain.connect(audio.destination);osc.start();gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.16);osc.stop(audio.currentTime+.16)}catch{}}
function toast(text){const el=document.createElement("div");el.className="toast";el.textContent=text;document.body.append(el);setTimeout(()=>el.remove(),1500)}
$("caseSelect").onchange=()=>{selectedCase=+$("caseSelect").value;focusCase()};$("focusBtn").onclick=focusCase;$("demoBtn").onclick=demo;$("testAllBtn").onclick=testAll;$("hintBtn").onclick=hint;$("undoBtn").onclick=undo;$("resetBtn").onclick=reset;$("archiveBtn").onclick=showArchive;$("mapArchiveBtn").onclick=showArchive;$("mapBtn").onclick=()=>{drawMap();$("mapOverlay").classList.remove("hidden")};$("closeInfoBtn").onclick=()=>$("infoOverlay").classList.add("hidden");load();drawMap();if(q){$("mapOverlay").classList.add("hidden");draw()}
window.__relayCoordination={SCENARIOS,prepare,evaluateScenario,validateContent,reference:index=>JSON.parse(JSON.stringify(SCENARIOS[index].reference)),fresh:index=>fresh(index),state:()=>q,profile:()=>profile,applyReference(index=q?.scenario||0){if(!q||q.scenario!==index)q=fresh(index);q.settings=JSON.parse(JSON.stringify(SCENARIOS[index].reference));draw();return evaluateScenario(index,q.settings)},encode:encodeArchive,decode:decodeArchive,start:startScenario,test:testAll};
})();
</script>
