</style></head><body><main class="app"><header class="top"><div><h1>展柜守护：十二馆微气候</h1><div class="sub">读取六段室外预报，为每段选择一种控制策略，让温度、湿度与照度零风险且能耗最低。</div></div><div class="stats"><div class="stat"><small>展馆</small><b id="galleryStat">1 / 12</b></div><div class="stat"><small>已排时段</small><b id="plannedStat">0 / 6</b></div><div class="stat"><small>风险项</small><b id="riskStat">0</b></div><div class="stat"><small>能耗</small><b id="energyStat">0 / 0</b></div><div class="stat"><small>最佳</small><b id="starStat">☆☆☆</b></div></div></header><div class="layout"><section class="panel gallery"><div class="gallery-head"><div><h2 id="galleryTitle"></h2><div class="sub" id="galleryBrief"></div></div><span class="chapter" id="chapterLabel"></span></div><canvas id="climateCanvas" width="960" height="360" aria-label="展柜微气候曲线"></canvas><div class="shifts" id="shifts"></div><div class="modes" id="modes"></div><div class="controls"><button class="btn primary" id="submitBtn">执行六段验收</button><button class="btn blue" id="hintBtn">载入节能参考</button><button class="btn" id="undoBtn">撤回策略</button><button class="btn" id="resetBtn">清空班表</button><button class="btn" id="archiveBtn">档案码</button><button class="btn" id="bookBtn">展馆目录</button></div><div class="message" id="message"></div></section><aside class="side"><section class="panel section"><h2>藏品安全带</h2><div id="bands"></div></section><section class="panel section"><h2>室外六段预报</h2><div class="forecast" id="forecast"></div></section><section class="panel section"><h2>逐段报告</h2><div class="report" id="report"></div></section></aside></div></main><div class="overlay" id="bookOverlay"><section class="modal"><h2>十二馆微气候排班</h2><p>每馆六段连续环境，上一段柜内状态会传入下一段。正式求解器穷举零风险策略并取最低能耗，作为公开三星线。</p><div class="galleries" id="galleries"></div></section></div><div class="overlay hidden" id="infoOverlay"><section class="modal"><h2 id="infoTitle"></h2><div id="infoBody"></div><div class="controls"><button class="btn primary" id="closeInfoBtn">返回环境台</button></div></section></div><script>
(()=>{"use strict";const $=id=>document.getElementById(id),SAVE="museumClimateV2",canvas=$("climateCanvas"),ctx=canvas.getContext("2d"),MATERIALS=[{n:"纸本文献",i:"📜",t:[18,24],h:[42,58],l:80},{n:"木质器物",i:"🪵",t:[17,25],h:[40,60],l:100},{n:"纺织藏品",i:"🧵",t:[18,24],h:[43,57],l:70},{n:"金属器物",i:"🏺",t:[16,26],h:[32,55],l:130},{n:"彩绘木板",i:"🖼️",t:[18,24],h:[42,56],l:75},{n:"混合档案",i:"📚",t:[18,24],h:[40,56],l:85}],MODES={standby:{n:"待机通风",i:"🌬️",drift:.32,t:0,h:0,light:1,e:0,d:"低能耗，环境随室外漂移"},cool:{n:"冷却除湿",i:"❄️",drift:.32,t:-3,h:-4,light:1,e:3,d:"同时降低温度与湿度"},warm:{n:"加热增湿",i:"♨️",drift:.32,t:2.5,h:6,light:1,e:3,d:"同时提高温度与湿度"},humid:{n:"恒温增湿",i:"💧",drift:.28,t:0,h:7,light:1,e:2,d:"主要提升湿度"},dry:{n:"恒温除湿",i:"🌀",drift:.28,t:0,h:-7,light:1,e:2,d:"主要降低湿度"},shade:{n:"遮光运行",i:"🌑",drift:.32,t:0,h:0,light:.25,e:1,d:"降低照度，不隔绝热湿"},seal:{n:"密闭缓冲",i:"🛡️",drift:.12,t:0,h:0,light:.35,e:2,d:"减慢热湿渗透并降低照度"}},MODE_IDS=Object.keys(MODES),NAMES=["纸本文献馆","木构工艺馆","纺织修复馆","青铜器陈列厅","地方志档案馆","彩绘壁板馆","海港混合库","山地民俗馆","近代纸品馆","跨材质联展","高温高湿特展","终局全天候馆"],BRIEFS=["基础温湿度漂移与午间遮光。","木质器物允许更宽湿度，但仍需控制峰值。","低照度纺织品要求更积极遮光。","金属展柜重点防止高湿累积。","早晚湿度反转，策略会影响下一段。","彩绘藏品同时收紧湿度与照度。","混合档案采用交集安全带。","外界振幅提高，密闭缓冲开始关键。","六段连续状态不能逐段孤立判断。","跨材质联展安全带更窄。","高温高湿叠加考验组合策略。","终局预报振幅最大，要求最低能耗零风险。"];
function round(v){return Math.round(v*10)/10}function outside(index){const baseT=[20,24,28,27,22,18],baseH=[52,62,58,43,35,47],baseL=[25,110,220,170,75,18],chapter=Math.floor(index/3),phase=index%3;return Array.from({length:6},(_,p)=>({t:round(baseT[(p+phase)%6]+(chapter?Math.sin((p+1)*(index+2))*(chapter*.7):0)),h:round(baseH[(p+phase*2)%6]+Math.cos((p+index)*1.3)*chapter*2),l:Math.max(10,Math.round(baseL[(p+phase)%6]*(1+chapter*.05))) }))}function step(state,ext,modeId){const m=MODES[modeId],t=round(state.t+(ext.t-state.t)*m.drift+m.t),h=round(state.h+(ext.h-state.h)*m.drift+m.h),l=Math.round(ext.l*m.light);return{t,h,l,mode:modeId,e:m.e}}function safe(v,mat){return v.t>=mat.t[0]&&v.t<=mat.t[1]&&v.h>=mat.h[0]&&v.h<=mat.h[1]&&v.l<=mat.l}function solve(ext,mat,start){let best=null;function walk(i,state,plan,energy){if(best&&energy>=best.energy)return;if(i===ext.length){best={plan:[...plan],energy};return}for(const mode of MODE_IDS){const next=step(state,ext[i],mode);if(!safe(next,mat))continue;plan.push(mode);walk(i+1,next,plan,energy+MODES[mode].e);plan.pop()}}walk(0,start,[],0);return best}function buildGallery(index){const material=MATERIALS[index%MATERIALS.length],raw=outside(index),ext=index===11?raw.map(v=>({t:round(21+(v.t-21)*.75),h:round(50+(v.h-50)*.75),l:Math.round(v.l*.9)})):raw,start={t:21,h:50,l:0},solution=solve(ext,material,start);return{index,n:NAMES[index],brief:BRIEFS[index],chapter:Math.floor(index/3),material,ext,start,reference:solution?.plan||[],budget:solution?.energy??0}}

function freshProfile(){return{v:2,unlocked:1,stars:Array(12).fill(0),bestEnergy:Array(12).fill(null),clears:0}}function norm(v={}){return{v:2,unlocked:Math.max(1,Math.min(12,+v.unlocked||1)),stars:Array.from({length:12},(_,i)=>Math.max(0,Math.min(3,+v.stars?.[i]||0))),bestEnergy:Array.from({length:12},(_,i)=>Number.isFinite(v.bestEnergy?.[i])?v.bestEnergy[i]:null),clears:+v.clears||0}}function fresh(index){return{v:2,gallery:index,plan:Array(6).fill(null),selected:0,history:[],hints:0,finished:false,message:"选择时段与控制策略。上一段柜内温湿度会继续传入下一段。"}}let profile=freshProfile(),q=null;function hash(t){let h=2166136261;for(const c of t){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}function encode(){const p=btoa(unescape(encodeURIComponent(JSON.stringify({v:2,profile,q}))));return`CLIMATE2.${p}.${hash(p)}`}function decode(code){const m=String(code).trim().match(/^CLIMATE2\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/);if(!m||hash(m[1])!==m[2])throw Error("档案校验失败");const d=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(d.v!==2||!Array.isArray(d.profile?.stars))throw Error("档案版本不兼容");return{v:2,profile:norm(d.profile),q:d.q}}function save(){localStorage.setItem(SAVE,JSON.stringify({v:2,profile,q}))}function load(){try{const d=JSON.parse(localStorage.getItem(SAVE));if(d?.v===2){profile=norm(d.profile);q=d.q}}catch{}}function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),1400)}
function start(index){if(index>=profile.unlocked)return;q=fresh(index);$("bookOverlay").classList.add("hidden");$("infoOverlay").classList.add("hidden");save();draw()}function setMode(mode){q.history.push([...q.plan]);q.plan[q.selected]=mode;q.finished=false;q.message=`第 ${q.selected+1} 段已设为“${MODES[mode].n}”。`;save();draw()}function undo(){const old=q.history.pop();if(!old)return toast("没有可撤回的策略");q.plan=old;q.message="已撤回上一次策略设置。";save();draw()}function hint(){const item=GALLERIES[q.gallery];q.history.push([...q.plan]);q.plan=[...item.reference];q.hints++;q.message="最低能耗参考已载入；本次最高两星。";save();draw();return evaluate(q.gallery,q.plan,q.hints)}function submit(){const item=GALLERIES[q.gallery],r=evaluate(q.gallery,q.plan,q.hints);if(!r.pass){q.message=`六段验收未通过：共 ${r.risks.length} 项未排或越界风险。`;save();draw();return r}q.finished=true;profile.stars[q.gallery]=Math.max(profile.stars[q.gallery],r.stars);profile.bestEnergy[q.gallery]=profile.bestEnergy[q.gallery]==null?r.energy:Math.min(profile.bestEnergy[q.gallery],r.energy);profile.unlocked=Math.max(profile.unlocked,Math.min(12,q.gallery+2));profile.clears++;save();$("infoTitle").textContent=`微气候验收完成 · ${item.n}`;$("infoBody").innerHTML=`<div class="result"><strong>${"★".repeat(r.stars)}${"☆".repeat(3-r.stars)}</strong><ul><li>六段温度、湿度与照度：零风险</li><li>总能耗：${r.energy} / 最低预算 ${item.budget}</li><li>节能参考：${q.hints}</li><li>正式求解：穷举全部七策略组合并取最低能耗</li></ul>${q.gallery<11?'<button class="btn primary" id="nextBtn">下一展馆</button>':""}</div>`;$("infoOverlay").classList.remove("hidden");if($("nextBtn"))$("nextBtn").onclick=()=>start(q.gallery+1);draw();return r}
function drawCanvas(){const item=GALLERIES[q.gallery],r=evaluate(q.gallery,q.plan,q.hints),w=960,h=360;ctx.clearRect(0,0,w,h);ctx.fillStyle="#121b22";ctx.fillRect(0,0,w,h);const rows=[{key:"t",n:"温度 °C",color:"#ff8c7c",min:10,max:32,band:item.material.t},{key:"h",n:"湿度 %",color:"#74bee9",min:20,max:75,band:item.material.h},{key:"l",n:"照度 lx",color:"#ffd16b",min:0,max:250,band:[0,item.material.l]}];rows.forEach((row,ri)=>{const y=58+ri*98,x=145,width=760;ctx.fillStyle="#24323c";ctx.fillRect(x,y,width,56);const by=y+(row.max-row.band[1])/(row.max-row.min)*56,bh=(row.band[1]-row.band[0])/(row.max-row.min)*56;ctx.fillStyle=row.color+"35";ctx.fillRect(x,by,width,bh);ctx.strokeStyle=row.color;ctx.strokeRect(x,by,width,bh);ctx.fillStyle="#dce6e8";ctx.font="bold 15px sans-serif";ctx.textAlign="left";ctx.fillText(row.n,24,y+25);ctx.fillStyle="#93a8b3";ctx.font="11px sans-serif";ctx.fillText(`安全 ${row.band[0]}–${row.band[1]}`,24,y+44);ctx.strokeStyle=row.color;ctx.lineWidth=3;ctx.beginPath();let begun=false;r.periods.forEach((p,i)=>{if(!p)return;const px=x+i/(5)*width,py=y+(row.max-p[row.key])/(row.max-row.min)*56;if(!begun){ctx.moveTo(px,py);begun=true}else ctx.lineTo(px,py);ctx.fillStyle=row.color;ctx.fillRect(px-4,py-4,8,8)});ctx.stroke()});ctx.fillStyle="#b1c0c8";ctx.font="13px sans-serif";ctx.textAlign="center";ctx.fillText("第 1 段",145,340);ctx.fillText("第 6 段",905,340)}function drawBook(){$("galleries").innerHTML=GALLERIES.map((item,index)=>`<button class="gallery-card" data-gallery="${index}" ${index>=profile.unlocked?"disabled":""}><span>${item.material.i}</span><h3>${index+1}. ${item.n}</h3><p>第 ${item.chapter+1} 章 · ${item.material.n} · 最低能耗 ${item.budget}<br>${item.brief}</p><div class="stars">${"★".repeat(profile.stars[index])}${"☆".repeat(3-profile.stars[index])}</div></button>`).join("");document.querySelectorAll("[data-gallery]").forEach(b=>b.onclick=()=>start(+b.dataset.gallery))}
function draw(){if(!q)return;const item=GALLERIES[q.gallery],r=evaluate(q.gallery,q.plan,q.hints);$("galleryStat").textContent=`${q.gallery+1} / 12`;$("plannedStat").textContent=`${r.planned} / 6`;$("riskStat").textContent=r.risks.length;$("energyStat").textContent=`${r.energy} / ${item.budget}`;$("starStat").textContent="★".repeat(profile.stars[q.gallery])+"☆".repeat(3-profile.stars[q.gallery]);$("galleryTitle").textContent=`${item.material.i} ${item.n}`;$("galleryBrief").textContent=item.brief;$("chapterLabel").textContent=`第 ${item.chapter+1} 章 · ${item.material.n}`;$("message").textContent=q.message;$("shifts").innerHTML=Array.from({length:6},(_,i)=>{const p=r.periods[i],ext=item.ext[i];return`<button class="shift ${q.selected===i?"active":""}" data-shift="${i}"><b>第 ${i+1} 段</b><small>外 ${ext.t}° / ${ext.h}% / ${ext.l}lx<br>${q.plan[i]?MODES[q.plan[i]].n:"未排策略"}${p?` · 柜 ${p.t}°/${p.h}%`:""}</small></button>`}).join("");document.querySelectorAll("[data-shift]").forEach(b=>b.onclick=()=>{q.selected=+b.dataset.shift;save();draw()});$("modes").innerHTML=MODE_IDS.map(id=>`<button class="mode ${q.plan[q.selected]===id?"active":""}" data-mode="${id}">${MODES[id].i} ${MODES[id].n}<small>能耗 ${MODES[id].e} · ${MODES[id].d}</small></button>`).join("");document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$("bands").innerHTML=`<div class="band"><span>温度</span><b>${item.material.t[0]}–${item.material.t[1]}°C</b><small>超出即记录风险</small></div><div class="band"><span>相对湿度</span><b>${item.material.h[0]}–${item.material.h[1]}%</b><small>上一段状态持续传递</small></div><div class="band"><span>照度上限</span><b>${item.material.l} lx</b><small>遮光与密闭可降低照度</small></div><div class="band"><span>三星能耗</span><b>≤ ${item.budget}</b><small>正式穷举得到的最低值</small></div>`;$("forecast").innerHTML=item.ext.map((x,i)=>`<div><b>第 ${i+1} 段</b>${x.t}°C<br>${x.h}%RH<br>${x.l} lx</div>`).join("");$("report").innerHTML=r.periods.map((p,i)=>p?`<div class="period ${p.ok?"":"bad"}"><b>第 ${i+1} 段 · ${MODES[p.mode].n}</b><br>柜内 ${p.t}°C / ${p.h}%RH / ${p.l}lx · 能耗 ${p.e}<br>${p.ok?"三项安全":"至少一项越界"}</div>`:`<div class="period bad"><b>第 ${i+1} 段 · 未排策略</b></div>`).join("");drawCanvas();drawBook();save()}function showArchive(){const code=encode();$("infoTitle").textContent="跨设备展馆档案";$("infoBody").innerHTML=`<p class="sub">星级、最低能耗纪录与当前六段班表包含在校验档案中。</p><textarea class="savebox" id="saveCode">${code}</textarea><div class="controls"><button class="btn" id="copyBtn">复制导出</button><button class="btn" id="importBtn">导入上方档案</button></div>`;$("infoOverlay").classList.remove("hidden");$("copyBtn").onclick=()=>navigator.clipboard?.writeText($("saveCode").value);$("importBtn").onclick=()=>{try{const d=decode($("saveCode").value);profile=d.profile;q=d.q||fresh(0);save();$("infoOverlay").classList.add("hidden");draw();toast("展馆档案导入成功")}catch(e){toast(e.message)}}}
$("submitBtn").onclick=submit;$("hintBtn").onclick=hint;$("undoBtn").onclick=undo;$("resetBtn").onclick=()=>start(q.gallery);$("archiveBtn").onclick=showArchive;$("bookBtn").onclick=()=>{$("bookOverlay").classList.remove("hidden");drawBook()};$("closeInfoBtn").onclick=()=>$("infoOverlay").classList.add("hidden");load();drawBook();if(q){$("bookOverlay").classList.add("hidden");draw()}window.__museumClimate={MATERIALS,MODES,GALLERIES,step,simulate,evaluate,referenceResult,validateContent,fresh,state:()=>q,profile:()=>profile,start,setMode,hint,submit,encode,decode};})();</script></body></html>
