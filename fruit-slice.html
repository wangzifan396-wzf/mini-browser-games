<!doctype html>

  <title>百果试刀：十二席料理委托</title>
  <style>
    :root{--ink:#342f2d;--muted:#776c67;--paper:#fff;--line:#d0c3bb;--deep:#493b3c;--red:#b74f50;--green:#47795e;--gold:#b6812e;--cyan:#3b7f89;--violet:#755c83;--radius:8px;--shadow:0 12px 30px rgba(63,48,45,.14)}
    *{box-sizing:border-box;letter-spacing:0}html,body{margin:0;min-height:100%;color:var(--ink);background:#ece6e1;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}button{font:inherit}.app{width:min(1180px,calc(100vw - 24px));margin:auto;padding:16px 0 28px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:17px 20px;border-bottom:4px solid #dba84d;color:#fff;background:var(--deep)}h1{margin:0;font-size:28px}.sub{margin:5px 0 0;color:#ded1cc;font-size:13px}.totals{display:flex;gap:18px;text-align:right}.totals b{display:block;color:#f0c96f;font-size:20px}.totals span{color:#d3c6c1;font-size:10px}.missions{display:grid;grid-template-columns:repeat(12,minmax(42px,1fr));gap:5px;padding:11px 0}.mission{height:46px;border:1px solid #bcaea7;border-radius:6px;color:#5a4d48;background:#faf8f6;font-weight:900;cursor:pointer}.mission.active{border-color:var(--red);color:#fff;background:var(--red)}.mission:disabled{opacity:.42}.mission small{display:block;height:11px;color:#f4d17b;font-size:9px}.layout{display:grid;grid-template-columns:minmax(0,790px) 305px;gap:14px;align-items:start}.stage{position:relative;min-height:610px;border:1px solid #a28f87;border-radius:var(--radius);overflow:hidden;background:#2a2425;box-shadow:var(--shadow);touch-action:none}.stage canvas{display:block;width:100%;height:610px}.hud{position:absolute;top:10px;left:10px;right:10px;z-index:2;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.hud span{min-width:90px;padding:6px 9px;border:1px solid rgba(255,255,255,.22);border-radius:6px;color:#f1e6df;background:rgba(61,45,45,.84);font-size:11px}.hud b{color:#fff}.side{display:flex;flex-direction:column;gap:10px}.panel{padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}.panel h2,.panel h3{margin:0}.panel h2{font-size:20px}.panel h3{margin-bottom:9px;font-size:14px}.brief{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.orders{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}.order{padding:6px 2px;border:1px solid #dfd5cf;border-radius:6px;background:#f7f3f0;text-align:center;font-size:10px}.order b{display:block;color:var(--red);font-size:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px 2px;border:1px solid #ddd3ce;border-radius:6px;text-align:center;background:#f6f3f1}.stat b{display:block;color:var(--red);font-size:17px}.stat span{color:var(--muted);font-size:9px}.blades{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.blade{min-height:54px;padding:5px;border:1px solid #b9aaa3;border-radius:6px;color:#5a4a44;background:#f4efec;font-size:10px;font-weight:900;cursor:pointer}.blade b{display:block;font-size:13px}.blade.active{border-color:var(--red);color:#fff;background:var(--red)}.seals{display:grid;grid-template-columns:1fr 1fr;gap:5px}.seal{min-height:49px;padding:6px;border:1px solid #b9aaa3;border-radius:6px;color:#594c47;background:#f4f0ed;text-align:left;font-size:9px;cursor:pointer}.seal b{display:block;font-size:12px}.seal.active{border-color:var(--violet);color:#fff;background:var(--violet)}.slots{margin:7px 0 0;color:var(--muted);font-size:10px}.commands{display:grid;grid-template-columns:1fr 1fr;gap:6px}.commands button,.archive button{min-height:40px;border:1px solid #b4a49c;border-radius:6px;color:#4e403b;background:#f3efec;font-weight:900;cursor:pointer}.commands .primary{grid-column:1/-1;border-color:var(--red);color:#fff;background:var(--red)}.status{min-height:80px;margin:0;padding:10px;border-left:4px solid var(--red);color:#594d48;background:#f4eeea;font-size:12px;line-height:1.55}.archive{display:grid;grid-template-columns:1fr 1fr;gap:6px}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:rgba(42,31,31,.86);text-align:center}.overlay[hidden]{display:none}.overlay-card{width:min(440px,100%);padding:23px;border-radius:var(--radius);color:#fff;background:#493b3c;box-shadow:0 24px 65px rgba(0,0,0,.4)}.overlay-card h2{margin:0;font-size:25px}.overlay-card p{color:#dfd2cc;line-height:1.6}.overlay-stars{color:#efc766;font-size:35px}.overlay-card button{min-height:42px;padding:0 20px;border:0;border-radius:6px;color:#382e2d;background:#efc767;font-weight:900;cursor:pointer}
    @media(max-width:910px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.side .status{grid-column:1/-1}.stage,.stage canvas{height:570px;min-height:570px}}
    @media(max-width:620px){.app{width:calc(100vw - 12px);padding-top:6px}.head{display:block;padding:13px}.totals{justify-content:space-between;margin-top:11px;text-align:left}.missions{grid-template-columns:repeat(6,1fr)}.mission{height:39px}.stage,.stage canvas{height:520px;min-height:520px}.hud span{min-width:0;padding:5px;font-size:9px}.side{display:flex}.panel{padding:10px}.sub{font-size:11px}}

<body>
  <main class="app">
    <header class="head"><div><h1>百果试刀：十二席料理委托</h1><p class="sub">读取固定出果节奏，按订单切取食材，避开铁胆，用刀具与双槽刀印完成十二席验收。</p></div><div class="totals"><div><b id="starTotal">0 / 36</b><span>料理星章</span></div><div><b id="clearTotal">0 / 12</b><span>完成委托</span></div><div><b id="perfectTotal">0 / 12</b><span>零失误</span></div></div></header>
    <nav class="missions" id="missions" aria-label="料理委托"></nav>
    <section class="layout">
      <div class="stage" id="stage"><canvas id="canvas"></canvas><div class="hud"><span>得分 <b id="score">0</b></span><span>连切 <b id="combo">0</b></span><span>时间 <b id="clock">0</b></span></div><div class="overlay" id="overlay"><div class="overlay-card"><h2 id="overlayTitle"></h2><p id="overlayText"></p><div class="overlay-stars" id="overlayStars"></div><button id="overlayButton">开始</button></div></div></div>
      <aside class="side">
        <section class="panel"><h2 id="missionTitle"></h2><p class="brief" id="missionBrief"></p><div class="orders" id="orders"></div></section>
        <section class="panel"><div class="stats"><div class="stat"><b id="hearts">3</b><span>容错</span></div><div class="stat"><b id="misses">0</b><span>漏果</span></div><div class="stat"><b id="bestCombo">0</b><span>最高连切</span></div></div></section>
        <section class="panel"><h3>选择刀具</h3><div class="blades"><button class="blade" data-blade="cleaver"><b>阔刃</b>范围宽</button><button class="blade" data-blade="needle"><b>针锋</b>高分窄刃</button><button class="blade" data-blade="ribbon"><b>游丝</b>连切宽限</button></div></section>
        <section class="panel"><h3>双槽刀印</h3><div class="seals"><button class="seal" data-seal="guard"><b>护手印</b>抵消首枚铁胆</button><button class="seal" data-seal="harvest"><b>丰收印</b>订单果加分</button><button class="seal" data-seal="tempo"><b>留香印</b>延长连切时间</button><button class="seal" data-seal="arc"><b>弧光印</b>增加刀锋宽度</button></div><p class="slots" id="slots"></p></section>
        <section class="panel"><div class="commands"><button class="primary" id="start">开始本席</button><button id="pause">暂停</button><button id="restart">重开</button></div></section>
        <p class="status" id="status"></p>
        <section class="panel"><div class="archive"><button id="exportSave">导出档案</button><button id="importSave">导入档案</button></div></section>
      </aside>
    </section>
  </main>
  <script>
  (()=>{
    "use strict";
    const SAVE_KEY="fruit_slice_v2",fruits={apple:{name:"苹果",color:"#df5b59",score:30},pear:{name:"雪梨",color:"#d6d85b",score:32},citrus:{name:"柑橘",color:"#e99b42",score:34},melon:{name:"青瓜",color:"#63b77c",score:36},plum:{name:"紫李",color:"#9671ad",score:38}},blades={cleaver:{name:"阔刃",width:1.35,score:1,window:1.15},needle:{name:"针锋",width:.78,score:1.45,window:1.05},ribbon:{name:"游丝",width:1,score:1.08,window:1.85}},seals={guard:{name:"护手印"},harvest:{name:"丰收印"},tempo:{name:"留香印"},arc:{name:"弧光印"}};
    const missions=[
      {title:"晨摊试刃",brief:"单果弧线清楚，先熟悉短划与连续命中。",seed:101,duration:30,interval:.78,orders:{apple:6,pear:5},extra:5,bombs:0,combo:5,boss:null},
      {title:"橘香双盘",brief:"两路同时抛果，横向一刀可以完成双切。",seed:207,duration:32,interval:.72,orders:{citrus:8,apple:5},extra:6,bombs:2,combo:7,boss:null},
      {title:"青玉冷盘",brief:"瓜果体积更大，但铁胆会混入相近轨迹。",seed:313,duration:34,interval:.69,orders:{melon:9,pear:6},extra:7,bombs:3,combo:8,boss:null},
      {title:"四味拼盘",brief:"订单覆盖四类食材，漏切会迅速打乱节奏。",seed:419,duration:36,interval:.66,orders:{apple:5,pear:5,citrus:5,plum:5},extra:8,bombs:4,combo:9,boss:null},
      {title:"铁胆间奏",brief:"铁胆密度提高，短划比贯穿全屏更可靠。",seed:523,duration:38,interval:.63,orders:{apple:8,melon:8,plum:5},extra:8,bombs:7,combo:8,boss:null},
      {title:"金瓜头盘",brief:"末段金瓜需要连续三次命中，切口会保留短暂无敌。",seed:631,duration:40,interval:.62,orders:{pear:8,citrus:8,melon:6},extra:9,bombs:5,combo:10,boss:{type:"melon",hp:3}},
      {title:"暮市流席",brief:"三连抛果开始出现，阔刃与弧光印更易覆盖整组。",seed:739,duration:42,interval:.59,orders:{apple:9,citrus:9,plum:7},extra:10,bombs:6,combo:12,boss:null},
      {title:"紫李回旋",brief:"左右回旋轨迹交错，观察铁胆颜色后再出刀。",seed:847,duration:43,interval:.57,orders:{plum:12,pear:8,melon:7},extra:10,bombs:8,combo:11,boss:{type:"plum",hp:3}},
      {title:"五色长案",brief:"五类订单同时验收，稳定连切比追逐单个高分更重要。",seed:953,duration:45,interval:.55,orders:{apple:6,pear:6,citrus:6,melon:6,plum:6},extra:12,bombs:8,combo:14,boss:null},
      {title:"双核果宴",brief:"两枚分层果先后登场，必须等待切口冷却再补刀。",seed:1061,duration:47,interval:.54,orders:{citrus:11,melon:10,plum:9},extra:12,bombs:9,combo:13,boss:{type:"citrus",hp:4,count:2}},
      {title:"风炉急席",brief:"高频三路抛果压缩判断时间，护手印可提供一次容错。",seed:1171,duration:49,interval:.51,orders:{apple:10,pear:10,melon:10,plum:8},extra:14,bombs:12,combo:16,boss:{type:"pear",hp:4}},
      {title:"百果终席",brief:"五色订单、密集铁胆与三枚分层果共同构成最终验收。",seed:1283,duration:52,interval:.49,orders:{apple:9,pear:9,citrus:9,melon:9,plum:9},extra:15,bombs:14,combo:18,boss:{type:"plum",hp:5,count:3}}
    ];
    const $=id=>document.getElementById(id),canvas=$("canvas"),ctx=canvas.getContext("2d"),stage=$("stage"),missionEl=$("missions"),overlay=$("overlay");let profile=load(),q=null,selectedBlade="cleaver",chosen=["guard","harvest"],trail=[],pointerDown=false,last=0,raf=0,audio=null;
    function defaults(){return{version:2,stars:{},best:{},perfect:{},updatedAt:Date.now()}}
    function normalize(value){const clean=defaults();if(!value||value.version!==2)return clean;for(let i=0;i<missions.length;i++){clean.stars[i]=Math.max(0,Math.min(3,Number(value.stars?.[i])||0));if(Number.isFinite(Number(value.best?.[i])))clean.best[i]=Math.max(0,Number(value.best[i]));clean.perfect[i]=Boolean(value.perfect?.[i])}return clean}
    function load(){try{return normalize(JSON.parse(localStorage.getItem(SAVE_KEY)))}catch{return defaults()}}
    function save(){profile.updatedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(profile));renderCampaign()}
    function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
    function encodeProfile(){const body=btoa(unescape(encodeURIComponent(JSON.stringify(profile))));return`FRUIT2.${body}.${checksum(body)}`}
    function decodeProfile(code){const part=code.trim().split(".");if(part.length!==3||part[0]!=="FRUIT2"||checksum(part[1])!==part[2])throw Error("料理档案校验失败");return normalize(JSON.parse(decodeURIComponent(escape(atob(part[1])))))}
    function unlocked(index){return index===0||Number(profile.stars[index-1])>0}
    function rng(seed){let value=seed>>>0;return()=>((value=Math.imul(value^value>>>15,1|value),value^=value+Math.imul(value^value>>>7,61|value),(value^value>>>14)>>>0)/4294967296)}
    function shuffle(list,random){for(let i=list.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}return list}
    function buildSchedule(index){const mission=missions[index],random=rng(mission.seed),required=[];for(const [type,count] of Object.entries(mission.orders))for(let i=0;i<count;i++)required.push(type);const keys=Object.keys(fruits);for(let i=0;i<mission.extra;i++)required.push(keys[Math.floor(random()*keys.length)]);shuffle(required,random);const schedule=[],spacing=Math.min(mission.interval,(mission.duration-4)/(required.length+mission.bombs+1));required.forEach((type,i)=>{const lane=(i*3+Math.floor(random()*5))%7,x=.13+lane*.123,vx=(.5-x)*(.28+random()*.16)+(random()-.5)*.08;schedule.push({time:1+i*spacing,type,x,vx,vy:-.92-random()*.16,hp:1,bomb:false})});for(let i=0;i<mission.bombs;i++){const slot=2+i*Math.max(2,Math.floor(required.length/Math.max(1,mission.bombs))),time=1+(slot+.42)*spacing,x=.14+((i*5+index)%7)*.12;schedule.push({time,type:"bomb",x,vx:(.5-x)*.34,vy:-.97-(i%3)*.04,hp:1,bomb:true})}if(mission.boss){for(let i=0;i<(mission.boss.count||1);i++)schedule.push({time:mission.duration-6+i*.72,type:mission.boss.type,x:.3+i*.2,vx:(i%2?.16:-.12),vy:-1.02,hp:mission.boss.hp,bomb:false,boss:true})}return schedule.sort((a,b)=>a.time-b.time).map((event,id)=>({...event,id}))}
    const schedules=missions.map((_,index)=>buildSchedule(index));
    function makeState(index,blade=selectedBlade,activeSeals=chosen,simulation=false){const mission=missions[index];return{index,mission,blade,seals:[...activeSeals],simulation,run:false,paused:false,ended:false,won:false,time:mission.duration,elapsed:0,score:0,combo:0,bestCombo:0,comboLeft:0,hearts:3,misses:0,guard:activeSeals.includes("guard")?1:0,objects:[],cursor:0,progress:Object.fromEntries(Object.keys(mission.orders).map(key=>[key,0])),cuts:0,bombsHit:0}}
    function spawnEvent(state,event){state.objects.push({...event,y:1.08,r:event.bomb?.043:event.boss?.064:.038,dead:false,cutCd:0,spin:0})}
    function distSegment(px,py,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((px-a.x)*dx+(py-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(px-(a.x+t*dx),py-(a.y+t*dy))}
    function cutObject(state,object){if(object.dead||object.cutCd>0)return;if(object.bomb){object.dead=true;if(state.guard>0)state.guard--;else{state.hearts--;state.bombsHit++;state.combo=0;state.comboLeft=0}return}object.hp--;object.cutCd=.16;state.score+=Math.round(fruits[object.type].score*blades[state.blade].score*(state.seals.includes("harvest")&&state.mission.orders[object.type]?1.25:1));if(object.hp>0){state.score+=25;return}object.dead=true;state.cuts++;state.combo++;state.bestCombo=Math.max(state.bestCombo,state.combo);state.comboLeft=blades[state.blade].window+(state.seals.includes("tempo")?.55:0);state.score+=state.combo*4;if(state.progress[object.type]!==undefined)state.progress[object.type]++}
    function slash(state,a,b){if(!state.run||state.paused||state.ended)return 0;const width=.013*blades[state.blade].width*(state.seals.includes("arc")?1.35:1);let hits=0;for(const object of state.objects)if(!object.dead&&distSegment(object.x,object.y,a,b)<object.r+width){cutObject(state,object);hits++}if(hits)tone(290+Math.min(300,state.combo*15));return hits}
    function ordersDone(state){return Object.entries(state.mission.orders).every(([type,count])=>state.progress[type]>=count)}
    function step(state,dt){if(!state.run||state.paused||state.ended)return state;state.elapsed+=dt;state.time=Math.max(0,state.mission.duration-state.elapsed);state.comboLeft=Math.max(0,state.comboLeft-dt);if(!state.comboLeft)state.combo=0;while(state.cursor<schedules[state.index].length&&schedules[state.index][state.cursor].time<=state.elapsed)spawnEvent(state,schedules[state.index][state.cursor++]);for(const object of state.objects){object.cutCd=Math.max(0,object.cutCd-dt);object.vy+=1.18*dt;object.x+=object.vx*dt;object.y+=object.vy*dt;object.spin+=dt*(object.vx*8+2);if(object.x<object.r){object.x=object.r;object.vx=Math.abs(object.vx)}if(object.x>1-object.r){object.x=1-object.r;object.vx=-Math.abs(object.vx)}if(object.y>1.15&&!object.dead){object.dead=true;if(!object.bomb){state.misses++;state.combo=0;state.comboLeft=0}}}state.objects=state.objects.filter(object=>!object.dead||object.cutCd>0);if(state.hearts<=0){state.ended=true;state.run=false;state.won=false}else if((state.time<=0||state.cursor===schedules[state.index].length&&!state.objects.some(o=>!o.dead))){state.ended=true;state.run=false;state.won=ordersDone(state)}return state}
    function referenceSlash(state){for(const object of state.objects)if(!object.dead&&!object.bomb&&object.y>.12&&object.y<.94&&object.cutCd<=0){slash(state,{x:object.x,y:object.y},{x:object.x,y:object.y});break}}
    function simulateReference(index){const state=makeState(index,"needle",["harvest","tempo"],true);state.run=true;let frames=0;for(;frames<12_000&&!state.ended;frames++){step(state,1/120);referenceSlash(state)}return{won:state.won,orders:ordersDone(state),hearts:state.hearts,misses:state.misses,bombsHit:state.bombsHit,bestCombo:state.bestCombo,frames}}
    function validateContent(){if(missions.length!==12)throw Error("料理委托数量错误");let events=0,fruitEvents=0,bombs=0,bossLayers=0,orderItems=0;const signatures=new Set(),references=[];for(let i=0;i<missions.length;i++){const mission=missions[i],schedule=schedules[i],signature=schedule.map(e=>`${e.time.toFixed(2)}:${e.type}:${e.x.toFixed(2)}`).join("|");if(signatures.has(signature))throw Error(`第 ${i+1} 席出果脚本重复`);signatures.add(signature);events+=schedule.length;fruitEvents+=schedule.filter(e=>!e.bomb).length;bombs+=schedule.filter(e=>e.bomb).length;bossLayers+=schedule.filter(e=>e.boss).reduce((sum,e)=>sum+e.hp,0);orderItems+=Object.values(mission.orders).reduce((a,b)=>a+b,0);const result=simulateReference(i);if(!result.won||!result.orders||result.bombsHit)throw Error(`第 ${i+1} 席参考切手未通过`);references.push(result)}return{missions:12,blades:3,seals:4,events,fruitEvents,bombs,bossLayers,orderItems,referenceWins:references.filter(r=>r.won).length,maxFrames:Math.max(...references.map(r=>r.frames))}}
    function begin(index=q?.index||0){if(!unlocked(index))return;q=makeState(index);trail=[];renderAll();showOverlay("料理简报",`${q.mission.title}：完成 ${Object.values(q.mission.orders).reduce((a,b)=>a+b,0)} 份订单食材，铁胆不会计入订单。`,"","开席",()=>{q.run=true;hideOverlay();setStatus("按住并划过食材形成刀光。短划更容易避开铁胆，分层果需要等待切口冷却后补刀。")})}
    function finish(){if(q.won){const stars=1+(q.bombsHit===0&&q.misses<=2?1:0)+(q.bombsHit===0&&q.misses===0&&q.bestCombo>=q.mission.combo?1:0);profile.stars[q.index]=Math.max(Number(profile.stars[q.index])||0,stars);profile.best[q.index]=Math.max(Number(profile.best[q.index])||0,q.score);if(q.bombsHit===0&&q.misses===0)profile.perfect[q.index]=true;save();showOverlay("本席验收",`订单完成，得分 ${q.score}，最高连切 ${q.bestCombo}，漏果 ${q.misses}。`,`★`.repeat(stars),q.index<11?"进入下一席":"重返终席",()=>begin(q.index<11?q.index+1:q.index))}else showOverlay("订单未完成",`尚缺 ${missingText(q)}。调整刀具与刀印，优先完成指定食材。`,"","重新开席",()=>begin(q.index))}
    function missingText(state){const list=Object.entries(state.mission.orders).map(([type,count])=>[fruits[type].name,Math.max(0,count-state.progress[type])]).filter(item=>item[1]);return list.length?list.map(item=>`${item[0]} ${item[1]}`).join("、"):"少量时间"}
    function showOverlay(title,text,starsText,label,action){$("overlayTitle").textContent=title;$("overlayText").textContent=text;$("overlayStars").textContent=starsText;$("overlayButton").textContent=label;$("overlayButton").onclick=action;overlay.hidden=false}
    function hideOverlay(){overlay.hidden=true}
    function setStatus(text){$("status").textContent=text}
    function renderCampaign(){const stars=Object.values(profile.stars).reduce((s,n)=>s+Number(n||0),0),clears=Object.values(profile.stars).filter(Boolean).length,perfect=Object.values(profile.perfect).filter(Boolean).length;$("starTotal").textContent=`${stars} / 36`;$("clearTotal").textContent=`${clears} / 12`;$("perfectTotal").textContent=`${perfect} / 12`;missionEl.replaceChildren();missions.forEach((mission,index)=>{const b=document.createElement("button"),star=Number(profile.stars[index])||0;b.className=`mission${q?.index===index?" active":""}`;b.innerHTML=`${String(index+1).padStart(2,"0")}<small>${star?"★".repeat(star):""}</small>`;b.disabled=!unlocked(index);b.title=mission.title;b.onclick=()=>begin(index);missionEl.append(b)})}
    function renderAll(){renderCampaign();if(!q)return;$("missionTitle").textContent=`${String(q.index+1).padStart(2,"0")} · ${q.mission.title}`;$("missionBrief").textContent=q.mission.brief;const orders=$("orders");orders.replaceChildren();for(const [type,count] of Object.entries(q.mission.orders)){const div=document.createElement("div");div.className="order";div.innerHTML=`${fruits[type].name}<b>${Math.min(q.progress[type],count)} / ${count}</b>`;orders.append(div)}document.querySelectorAll(".blade").forEach(b=>b.classList.toggle("active",b.dataset.blade===selectedBlade));document.querySelectorAll(".seal").forEach(b=>b.classList.toggle("active",chosen.includes(b.dataset.seal)));$("slots").textContent=`已装配 ${chosen.length} / 2：${chosen.map(key=>seals[key].name).join(" + ")}`;sync()}
    function sync(){if(!q)return;$("score").textContent=q.score;$("combo").textContent=`×${q.combo}`;$("clock").textContent=Math.ceil(q.time);$("hearts").textContent=q.hearts;$("misses").textContent=q.misses;$("bestCombo").textContent=q.bestCombo;$("pause").textContent=q.paused?"继续":"暂停";const boxes=$("orders").children;Object.entries(q.mission.orders).forEach(([type,count],index)=>{const b=boxes[index]?.querySelector("b");if(b)b.textContent=`${Math.min(q.progress[type],count)} / ${count}`})}
    function resize(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);if(canvas.width!==Math.round(rect.width*dpr)||canvas.height!==Math.round(rect.height*dpr)){canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}}
    function drawFruit(object,w,h){const px=object.x*w,py=object.y*h,r=object.r*w;if(object.bomb){ctx.fillStyle="#343638";ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#d8a247";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px+r*.25,py-r*.78);ctx.quadraticCurveTo(px+r*.7,py-r*1.2,px+r*.86,py-r*1.5);ctx.stroke();ctx.fillStyle="#f1c65d";ctx.font=`900 ${Math.max(10,r*.75)}px system-ui`;ctx.textAlign="center";ctx.fillText("!",px,py+r*.25);return}ctx.save();ctx.translate(px,py);ctx.rotate(object.spin);ctx.fillStyle=fruits[object.type].color;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#427153";ctx.fillRect(-1,-r*1.15,3,r*.35);ctx.restore();if(object.boss){ctx.fillStyle="#fff";ctx.font="800 11px system-ui";ctx.textAlign="center";ctx.fillText(`×${object.hp}`,px,py+4)}}
    function draw(){if(!q)return;resize();const w=canvas.clientWidth,h=canvas.clientHeight,g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,"#4b3435");g.addColorStop(.58,"#2d3836");g.addColorStop(1,"#1f2021");ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.strokeStyle="rgba(239,207,157,.08)";ctx.lineWidth=1;for(let y=80;y<h;y+=54){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}for(const object of q.objects)if(!object.dead)drawFruit(object,w,h);if(trail.length>1){ctx.strokeStyle="#fff1d5";ctx.lineWidth=5;ctx.lineCap="round";ctx.lineJoin="round";ctx.shadowBlur=10;ctx.shadowColor="#fff0ca";ctx.beginPath();trail.forEach((p,i)=>i?ctx.lineTo(p.x*w,p.y*h):ctx.moveTo(p.x*w,p.y*h));ctx.stroke();ctx.shadowBlur=0}}
    function loop(now){const dt=Math.min(.025,(now-last)/1000||0);last=now;if(q?.run&&!q.paused&&!q.ended){step(q,dt);if(q.ended)finish();sync()}trail.forEach(point=>point.life-=dt);trail=trail.filter(point=>point.life>0);draw();raf=requestAnimationFrame(loop)}
    function point(event){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(event.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(event.clientY-r.top)/r.height)),life:.16}}
    canvas.addEventListener("pointerdown",event=>{pointerDown=true;canvas.setPointerCapture?.(event.pointerId);trail=[point(event)]});canvas.addEventListener("pointermove",event=>{if(!pointerDown)return;const next=point(event),previous=trail.at(-1);if(previous)slash(q,previous,next);trail.push(next);if(trail.length>12)trail.shift()});canvas.addEventListener("pointerup",()=>{pointerDown=false});canvas.addEventListener("pointercancel",()=>{pointerDown=false});
    function tone(freq){try{audio??=new AudioContext();const o=audio.createOscillator(),gain=audio.createGain();o.frequency.value=freq;gain.gain.setValueAtTime(.022,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.07);o.connect(gain).connect(audio.destination);o.start();o.stop(audio.currentTime+.07)}catch{}}
    document.querySelectorAll(".blade").forEach(button=>button.onclick=()=>{if(q?.run)return setStatus("料理进行中不能换刀，请先重开本席。");selectedBlade=button.dataset.blade;q=makeState(q?.index||0);renderAll();setStatus(`${blades[selectedBlade].name}已就位。`) });document.querySelectorAll(".seal").forEach(button=>button.onclick=()=>{if(q?.run)return setStatus("料理进行中不能更换刀印，请先重开本席。");const key=button.dataset.seal;if(chosen.includes(key)){if(chosen.length===1)return;chosen=chosen.filter(item=>item!==key)}else if(chosen.length<2)chosen.push(key);else{chosen.shift();chosen.push(key)}q=makeState(q?.index||0);renderAll();setStatus(`已装配：${chosen.map(item=>seals[item].name).join(" + ")}。`) });
    $("start").onclick=()=>begin(q?.index||0);$("pause").onclick=()=>{if(!q?.run)return;q.paused=!q.paused;sync();setStatus(q.paused?"料理暂停。":"料理继续。")};$("restart").onclick=()=>begin(q?.index||0);$("exportSave").onclick=async()=>{const code=encodeProfile();try{await navigator.clipboard.writeText(code);setStatus("FRUIT2 档案已复制到剪贴板。")}catch{prompt("复制料理档案",code)}};$("importSave").onclick=()=>{const code=prompt("粘贴 FRUIT2 料理档案");if(!code)return;try{profile=decodeProfile(code);save();begin(0);setStatus("料理档案导入成功。")}catch(error){setStatus(error.message)}};
    addEventListener("keydown",event=>{if(event.code==="KeyP")$("pause").click()});
    window.__fruitSliceTest={missions,schedules,fruits,blades,seals,makeState,step,slash,referenceSlash,simulateReference,validateContent,getState:()=>q,getProfile:()=>profile,encodeProfile,decodeProfile,begin,forceFinish:()=>{q.progress={...q.mission.orders};q.won=true;q.ended=true;q.run=false;finish()}};
    q=makeState(0);renderAll();setStatus("选择刀具与两枚刀印后开始首席。所有出果与铁胆时序固定，可观察并优化切线。");showOverlay("十二席料理委托","每席都有固定出果脚本、订单目标与连切标准。不要为了高分横扫整屏，短划才能避开铁胆。","","查看首席",()=>begin(0));raf=requestAnimationFrame(loop);
  })();
  </script>
