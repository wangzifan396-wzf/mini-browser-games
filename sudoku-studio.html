  <style>
    :root{--bg:#e9edf0;--paper:#fff;--ink:#20303d;--muted:#687681;--line:#c2cbd2;--deep:#263d50;--blue:#26739c;--teal:#2d7f7c;--gold:#b57d20;--red:#aa4a4d;--green:#3a775c;--violet:#675a86;--radius:8px;--shadow:0 12px 28px rgba(32,52,68,.12)}
    *{box-sizing:border-box;letter-spacing:0}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg)}button{font:inherit}.app{width:min(1120px,calc(100vw - 24px));margin:auto;padding:18px 0 30px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:18px 20px;border-bottom:4px solid #dfad4a;color:#fff;background:var(--deep)}h1{margin:0;font-size:28px}.sub{margin:5px 0 0;color:#cfdae3;font-size:13px}.campaign{display:flex;gap:20px;text-align:right}.campaign b{display:block;color:#f1c869;font-size:20px}.campaign span{color:#bfccd7;font-size:10px}.missions{display:grid;grid-template-columns:repeat(12,minmax(40px,1fr));gap:5px;padding:12px 0}.mission{height:45px;border:1px solid #a4b0ba;border-radius:6px;color:#415261;background:#fafbfc;font-weight:900;cursor:pointer}.mission.active{border-color:var(--blue);color:#fff;background:var(--blue)}.mission.locked{opacity:.42}.mission small{display:block;height:11px;color:#f2ca70;font-size:9px}.layout{display:grid;grid-template-columns:minmax(420px,660px) 310px;justify-content:center;gap:14px}.workbench{min-width:0;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);box-shadow:var(--shadow)}.brief{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}.brief h2{margin:0;font-size:21px}.brief p{margin:5px 0 0;color:var(--muted);font-size:12px}.goal{flex:0 0 auto;padding:7px 9px;border:1px solid #c69d4e;border-radius:6px;color:#704d0a;background:#fff4d8;font-size:11px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(9,1fr);border:3px solid #304c62;background:#304c62}.cell{position:relative;display:grid;place-items:center;aspect-ratio:1;min-width:0;padding:0;border:0;border-right:1px solid #aebbc5;border-bottom:1px solid #aebbc5;color:#2c4d62;background:#fff;font-size:clamp(18px,3vw,31px);font-weight:900;cursor:pointer}.cell:nth-child(3n){border-right:3px solid #304c62}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:3px solid #304c62}.cell.fixed{color:#20313e;background:#eef2f4}.cell.peer{background:#edf5f8}.cell.same{background:#d8ebf0}.cell.selected{box-shadow:inset 0 0 0 4px var(--blue);z-index:2}.cell.bad{color:#fff;background:var(--red)}.cell.diagonal:not(.selected):not(.bad){background:#edf0fa}.cell.cage-top{border-top:2px dashed #a87525}.cell.cage-left{border-left:2px dashed #a87525}.cell.cage-right{border-right:2px dashed #a87525}.cell.cage-bottom{border-bottom:2px dashed #a87525}.cage-sum{position:absolute;left:3px;top:1px;color:#8c641f;font-size:8px;font-weight:900}.notes{display:grid;grid-template-columns:repeat(3,1fr);width:82%;height:82%;color:#547085;font-size:8px;font-weight:700}.notes i{display:grid;place-items:center;font-style:normal}.keypad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-top:10px}.keypad button{height:43px;border:1px solid #9eacb7;border-radius:6px;color:#30485b;background:#eff3f5;font-weight:900;cursor:pointer}.keypad button.complete{opacity:.4}.panel{display:flex;flex-direction:column;gap:10px}.box{padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}.box h3{margin:0 0 9px;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px 3px;border:1px solid #d1d9df;border-radius:6px;text-align:center;background:#f3f5f7}.stat b{display:block;color:var(--blue);font-size:17px}.stat span{color:var(--muted);font-size:9px}.mode{display:grid;grid-template-columns:1fr 1fr;gap:5px}.mode button{min-height:40px;border:1px solid #9daab5;border-radius:6px;color:#354a5b;background:#eff2f4;font-weight:900;cursor:pointer}.mode button.active{border-color:var(--blue);color:#fff;background:var(--blue)}.actions,.archive{display:grid;grid-template-columns:1fr 1fr;gap:6px}.actions button,.archive button{min-height:40px;border:1px solid #9daab5;border-radius:6px;color:#354a5b;background:#eff2f4;font-weight:900;cursor:pointer}.actions .primary{grid-column:1/-1;border-color:var(--blue);color:#fff;background:var(--blue)}.actions button:disabled{opacity:.45}.status{min-height:88px;margin:0;padding:10px;border-left:4px solid var(--blue);color:#3a5062;background:#eef4f7;font-size:12px;line-height:1.55}.rule{margin:0;color:var(--muted);font-size:11px;line-height:1.65}.result{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(24,42,57,.75)}.result[hidden]{display:none}.result-card{width:min(430px,100%);padding:22px;border-radius:var(--radius);background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.3);text-align:center}.result-card h2{margin:0}.result-card p{color:var(--muted);line-height:1.6}.result-stars{margin:12px 0;color:#d49a18;font-size:34px}.result-card button{min-height:42px;padding:0 18px;border:0;border-radius:6px;color:#fff;background:var(--blue);font-weight:900;cursor:pointer}
    @media(max-width:820px){.layout{grid-template-columns:1fr}.panel{display:grid;grid-template-columns:1fr 1fr}.panel .status{grid-column:1/-1}}
    @media(max-width:620px){.app{width:calc(100vw - 12px);padding-top:6px}.head{display:block;padding:14px}.campaign{justify-content:space-between;margin-top:12px;text-align:left}.missions{grid-template-columns:repeat(6,1fr)}.mission{height:39px}.workbench{padding:7px}.brief{display:block}.goal{display:inline-block;margin-top:7px}.cell{font-size:20px}.keypad{grid-template-columns:repeat(5,1fr)}.keypad button{height:40px}.panel{display:flex}.cage-sum{font-size:7px}}

<body>
  <main class="app">
    <header class="head"><div><h1>数独工坊：十二式逻辑课</h1><p class="sub">从经典宫格到双对角线与杀手笼，逐题学习候选排除和唯一位置。</p></div><div class="campaign"><div><b id="starTotal">0 / 36</b><span>逻辑星章</span></div><div><b id="perfectTotal">0 / 12</b><span>无错完成</span></div><div><b id="solvedTotal">0 / 12</b><span>完成课题</span></div></div></header>
    <nav class="missions" id="missions" aria-label="数独课题"></nav>
    <section class="layout">
      <div class="workbench"><div class="brief"><div><h2 id="title"></h2><p id="brief"></p></div><span class="goal" id="goal"></span></div><div class="grid" id="grid"></div><div class="keypad" id="keypad"></div></div>
      <aside class="panel">
        <section class="box"><h3>解题状态</h3><div class="stats"><div class="stat"><b id="filled">0 / 0</b><span>已填空格</span></div><div class="stat"><b id="errors">0</b><span>错误次数</span></div><div class="stat"><b id="hints">0</b><span>教学提示</span></div></div></section>
        <section class="box"><h3>输入模式</h3><div class="mode"><button id="answerMode" class="active">填入答案</button><button id="noteMode">候选笔记</button></div></section>
        <section class="box"><div class="actions"><button class="primary" id="inspect">检查当前盘面</button><button id="erase">擦除</button><button id="hint">推导一步</button><button id="undo">撤回</button><button id="reset">重做课题</button></div></section>
        <p class="status" id="status"></p>
        <section class="box"><p class="rule" id="rule"></p></section>
        <section class="box"><div class="archive"><button id="exportSave">导出档案</button><button id="importSave">导入档案</button></div></section>
      </aside>
    </section>
  </main>
  <div class="result" id="result" hidden><div class="result-card"><h2 id="resultTitle"></h2><p id="resultText"></p><div class="result-stars" id="resultStars"></div><button id="next">下一式</button></div></div>
  <script>
  (()=>{
    "use strict";
    const SAVE_KEY="sudoku_studio_v2",raw=[
      ["classic","006080004400000200100065003008700010001320060003001045060002071034017600000046009","376289154459173286182465793698754312541328967723691845865932471934517628217846539"],
      ["classic","000120397010000205007008000059400106000300050060501000205000060600000800780006039","846125397913647285527938614359482176172369458468571923235894761691753842784216539"],
      ["classic","000005007160800000009163002000400001003000900800259400981000700720000010000090004","348925167162874395579163842297438651453617928816259473981542736724386519635791284"],
      ["classic","009386104000002006000000300000010007480000000001907050600091500790003008000704000","579386124348152796126479385953618247487235961261947853634891572792563418815724639"],
      ["diagonal","000803625002106000063004100005008076009040000300010000007401800420009007650000490","714893625892156734563724189145238976289647513376915248937461852421589367658372491"],
      ["diagonal","000000159038000004500040080100904300020001907009070010070500800006008502080019000","742683159638195274591247683157964328824351967369872415473526891916738542285419736"],
      ["diagonal","300298040006000097912000030057020000108300000239000700700000000020100800000002300","375298641486513297912746538657924183148375926239681754763859412524137869891462375"],
      ["diagonal","000400300200060000380007400000079060100000890008000073065040030070900605000050700","719425386254368917386197452543879261127536894698214573965742138471983625832651749"],
      ["killer","000000076000104090503900401420000000300700000010002034000000007000008009000070053","194285376672134598583967421428396715356741982917852634249513867735628149861479253"],
      ["killer","040005003007000000000080060000009002093042006000006000070560090000000030920007000","849675123637124985152983467786319542593742816214856379371568294465291738928437651"],
      ["killer","000000000400000009073000024500040000000000000910308000000810002000005706005000080","159624378462783519873159624527941863348562197916378245734816952281495736695237481"],
      ["killer","280030400700000030006000080005060000070000000003800000000000050040008000007005000","289536417754981236136274589415369872978412365623857194892643751541798623367125948"]
    ];
    const titles=["单元排除","隐性唯一","宫格交叉","经典终课","双线入门","交点锁定","斜线进阶","双线终课","二格小笼","三格合计","低线索笼","杀手终课"],briefs=["用同行、同列与同宫已有数字排除候选。","寻找某个数字在一行中唯一可落的位置。","同时观察宫格与交叉行列的候选收缩。","线索更少，综合使用前面三种逻辑。","两条主对角线也必须分别包含 1–9。","中心格同时属于两条对角线，优先处理交点。","把对角线候选与九宫排除结合。","在低线索盘面完成双对角线终课。","虚线笼内数字不重复，且总和等于角标。","先用笼和缩小组合，再回到行列唯一。","更少给定数，笼和成为主要信息来源。","综合行列宫与 28 个笼完成最终课题。"];
    const $=id=>document.getElementById(id),gridEl=$("grid"),missionEl=$("missions"),keypadEl=$("keypad"),statusEl=$("status");
    function makeCages(solution,seed){let state=seed>>>0,random=()=>((state=Math.imul(state,1664525)+1013904223>>>0)/4294967296),cages=[];for(let row=0;row<9;row++){let col=0;while(col<9){let size=col<=6&&random()>.35?3:2;if(col+size>9)size=9-col;if(size===1&&cages.length){const cage=cages.at(-1);cage.cells.push(row*9+col);cage.sum+=Number(solution[row*9+col]);col++;continue}const cells=[];for(let i=0;i<size;i++)cells.push(row*9+col+i);cages.push({cells,sum:cells.reduce((sum,index)=>sum+Number(solution[index]),0)});col+=size}}return cages}
    const missions=raw.map(([variant,puzzle,solution],index)=>({id:`s${index+1}`,variant,puzzle,solution,title:titles[index],brief:briefs[index],cages:variant==="killer"?makeCages(solution,12000+index):[],par:81-puzzle.replace(/0/g,"").length}));
    let save=loadSave(),q=null,mode="answer",audio=null;
    function defaults(){return{version:2,stars:{},errors:{},updatedAt:Date.now()}}
    function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
    function normalize(value){const clean=defaults();if(!value||value.version!==2)return clean;for(const mission of missions){clean.stars[mission.id]=Math.max(0,Math.min(3,Number(value.stars?.[mission.id])||0));if(Number.isFinite(Number(value.errors?.[mission.id])))clean.errors[mission.id]=Math.max(0,Number(value.errors[mission.id]))}return clean}
    function loadSave(){try{return normalize(JSON.parse(localStorage.getItem(SAVE_KEY)))}catch{return defaults()}}
    function persist(){save.updatedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(save));renderCampaign()}
    function encodeSave(){const body=btoa(unescape(encodeURIComponent(JSON.stringify(save))));return`SUDOKU2.${body}.${checksum(body)}`}
    function decodeSave(code){const parts=code.trim().split(".");if(parts.length!==3||parts[0]!=="SUDOKU2"||checksum(parts[1])!==parts[2])throw Error("逻辑课档案校验失败");return normalize(JSON.parse(decodeURIComponent(escape(atob(parts[1])))))}
    function valid(board,index,value,mission){const row=Math.floor(index/9),col=index%9;for(let i=0;i<9;i++)if((row*9+i!==index&&board[row*9+i]===value)||(i*9+col!==index&&board[i*9+col]===value))return false;const br=Math.floor(row/3)*3,bc=Math.floor(col/3)*3;for(let y=0;y<3;y++)for(let x=0;x<3;x++){const cell=(br+y)*9+bc+x;if(cell!==index&&board[cell]===value)return false}if(mission.variant==="diagonal"){if(row===col)for(let i=0;i<9;i++){const cell=i*9+i;if(cell!==index&&board[cell]===value)return false}if(row+col===8)for(let i=0;i<9;i++){const cell=i*9+8-i;if(cell!==index&&board[cell]===value)return false}}if(mission.variant==="killer"){const cage=mission.cages.find(item=>item.cells.includes(index));if(cage){let sum=value;for(const cell of cage.cells)if(cell!==index&&board[cell]){if(board[cell]===value)return false;sum+=board[cell]}if(sum>cage.sum)return false;if(cage.cells.every(cell=>cell===index||board[cell])&&sum!==cage.sum)return false}}return true}
    function candidates(board,index,mission){const result=[];if(board[index])return result;for(let n=1;n<=9;n++)if(valid(board,index,n,mission))result.push(n);return result}
    function countSolutions(mission,limit=2){const board=mission.puzzle.split("").map(Number);let count=0,solution="";function walk(){if(count>=limit)return;let index=-1,options=null;for(let i=0;i<81;i++)if(!board[i]){const list=candidates(board,i,mission);if(!list.length)return;if(!options||list.length<options.length){index=i;options=list;if(list.length===1)break}}if(index<0){count++;solution||=(board.join(""));return}for(const value of options){board[index]=value;walk();board[index]=0;if(count>=limit)return}}walk();return{count,solution}}
    function validateContent(){if(missions.length!==12)throw Error("逻辑课数量错误");let clues=0,cages=0;for(const mission of missions){clues+=mission.puzzle.replace(/0/g,"").length;cages+=mission.cages.length;const result=countSolutions(mission);if(result.count!==1||result.solution!==mission.solution)throw Error(`${mission.id} 唯一解校验失败`)}return{missions:12,uniqueSolutions:12,classic:4,diagonal:4,killer:4,clues,cages}}
    function unlocked(index){return index===0||Number(save.stars[missions[index-1].id])>0}
    function begin(index=0){if(!unlocked(index))return;const mission=missions[index],values=mission.puzzle.split("").map(Number);q={index,mission,values,fixed:values.map(Boolean),notes:Array.from({length:81},()=>new Set()),selected:values.findIndex(value=>!value),history:[],errors:0,hints:0,done:false};mode="answer";renderAll();setStatus("选择空格后填入答案；不确定时切换候选笔记，记录可能数字。")}
    function setStatus(text){statusEl.textContent=text}
    function renderCampaign(){const stars=Object.values(save.stars).reduce((sum,n)=>sum+Number(n||0),0),solved=Object.values(save.stars).filter(Boolean).length,perfect=Object.values(save.errors).filter(n=>n===0).length;$("starTotal").textContent=`${stars} / 36`;$("solvedTotal").textContent=`${solved} / 12`;$("perfectTotal").textContent=`${perfect} / 12`}
    function renderMissions(){missionEl.replaceChildren();missions.forEach((mission,index)=>{const button=document.createElement("button"),stars=Number(save.stars[mission.id])||0;button.className=`mission${q?.index===index?" active":""}${unlocked(index)?"":" locked"}`;button.innerHTML=`${String(index+1).padStart(2,"0")}<small>${stars?"★".repeat(stars):""}</small>`;button.disabled=!unlocked(index);button.title=mission.title;button.onclick=()=>begin(index);missionEl.append(button)})}
    function cageClass(index){if(q.mission.variant!=="killer")return"";const cage=q.mission.cages.find(item=>item.cells.includes(index)),pos=cage.cells.indexOf(index),classes=[];if(pos===0)classes.push("cage-left");if(pos===cage.cells.length-1)classes.push("cage-right");classes.push("cage-top","cage-bottom");return classes.join(" ")}
    function peers(a,b){const ar=Math.floor(a/9),ac=a%9,br=Math.floor(b/9),bc=b%9;return ar===br||ac===bc||(Math.floor(ar/3)===Math.floor(br/3)&&Math.floor(ac/3)===Math.floor(bc/3))}
    function renderGrid(){gridEl.replaceChildren();const selectedValue=q.values[q.selected],selectedRow=Math.floor(q.selected/9),selectedCol=q.selected%9;for(let index=0;index<81;index++){const row=Math.floor(index/9),col=index%9,value=q.values[index],button=document.createElement("button"),diagonal=q.mission.variant==="diagonal"&&(row===col||row+col===8),bad=value&&value!==Number(q.mission.solution[index]);button.className=`cell ${q.fixed[index]?"fixed ":""}${peers(index,q.selected)?"peer ":""}${selectedValue&&value===selectedValue?"same ":""}${index===q.selected?"selected ":""}${bad?"bad ":""}${diagonal?"diagonal ":""}${cageClass(index)}`;button.dataset.index=index;if(q.mission.variant==="killer"){const cage=q.mission.cages.find(item=>item.cells[0]===index);if(cage){const sum=document.createElement("span");sum.className="cage-sum";sum.textContent=cage.sum;button.append(sum)}}if(value){button.append(String(value))}else if(q.notes[index].size){const notes=document.createElement("span");notes.className="notes";for(let n=1;n<=9;n++){const mark=document.createElement("i");mark.textContent=q.notes[index].has(n)?n:"";notes.append(mark)}button.append(notes)}button.onclick=()=>{q.selected=index;renderGrid()};gridEl.append(button)}}
    function renderKeypad(){keypadEl.replaceChildren();for(let n=1;n<=9;n++){const button=document.createElement("button"),complete=q.values.filter(value=>value===n).length===9;button.textContent=n;button.className=complete?"complete":"";button.onclick=()=>input(n);keypadEl.append(button)}}
    function renderPanel(){const total=q.mission.par,filled=q.values.reduce((sum,value,index)=>sum+(!q.fixed[index]&&value?1:0),0),variant={classic:"经典",diagonal:"双对角线",killer:"杀手笼"}[q.mission.variant];$("title").textContent=`${String(q.index+1).padStart(2,"0")} · ${q.mission.title}`;$("brief").textContent=q.mission.brief;$("goal").textContent=`${variant} · ${q.mission.puzzle.replace(/0/g,"").length} 线索`;$("filled").textContent=`${filled} / ${total}`;$("errors").textContent=q.errors;$("hints").textContent=q.hints;$("answerMode").classList.toggle("active",mode==="answer");$("noteMode").classList.toggle("active",mode==="note");$("undo").disabled=!q.history.length;$("rule").textContent=q.mission.variant==="classic"?"每行、每列和每个 3×3 宫都必须恰好包含数字 1–9。":q.mission.variant==="diagonal"?"除标准规则外，两条主对角线也必须分别恰好包含数字 1–9。":"除标准规则外，每个虚线笼内数字不得重复，数字之和必须等于左上角标。"}
    function renderAll(){renderCampaign();renderMissions();renderGrid();renderKeypad();renderPanel()}
    function snapshot(){q.history.push({values:[...q.values],notes:q.notes.map(set=>[...set]),errors:q.errors})}
    function restore(state){q.values=state.values;q.notes=state.notes.map(list=>new Set(list));q.errors=state.errors;renderAll()}
    function tone(freq,duration=.07){try{audio??=new AudioContext();const osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=freq;gain.gain.setValueAtTime(.025,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain).connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}catch{}}
    function input(value){const index=q.selected;if(q.fixed[index]||q.done)return;snapshot();if(mode==="note"){q.notes[index].has(value)?q.notes[index].delete(value):q.notes[index].add(value);setStatus(`候选 ${value} 已${q.notes[index].has(value)?"加入":"移除"}。`)}else{q.values[index]=value;q.notes[index].clear();if(value!==Number(q.mission.solution[index])){q.errors++;setStatus(`${value} 与当前约束冲突，红色格会保留供你修正。`);tone(100,.15)}else{for(let i=0;i<81;i++)if(peers(i,index))q.notes[i].delete(value);setStatus(`已填入 ${value}，相关同行、同列与同宫候选已清理。`);tone(360)}}renderAll();if(q.values.every((number,i)=>number===Number(q.mission.solution[i])))finish()}
    function erase(){if(q.fixed[q.selected]||q.done)return;snapshot();q.values[q.selected]=0;q.notes[q.selected].clear();renderAll();setStatus("已清空当前格。")}
    function hint(){if(q.done)return;let index=-1,options=[];for(let i=0;i<81;i++)if(!q.values[i]){const list=candidates(q.values,i,q.mission);if(list.length===1){index=i;options=list;break}}let explanation;if(index>=0)explanation=`格 ${Math.floor(index/9)+1}-${index%9+1} 排除同行、同列与区域后只剩 ${options[0]}。`;else{index=q.values.findIndex((value,i)=>!value&&value!==Number(q.mission.solution[i]));if(index<0)return;options=[Number(q.mission.solution[index])];explanation=`格 ${Math.floor(index/9)+1}-${index%9+1} 的候选需结合唯一位置继续收缩，填入 ${options[0]}。`}q.selected=index;snapshot();q.values[index]=options[0];q.notes[index].clear();q.hints++;renderAll();setStatus(explanation);tone(480);if(q.values.every((number,i)=>number===Number(q.mission.solution[i])))finish()}
    function inspect(){const wrong=q.values.findIndex((value,index)=>value&&value!==Number(q.mission.solution[index]));if(wrong>=0){q.selected=wrong;renderGrid();setStatus(`第 ${Math.floor(wrong/9)+1} 行第 ${wrong%9+1} 格不符合约束。`);tone(100,.15);return}const empty=q.values.indexOf(0);if(empty>=0){q.selected=empty;renderGrid();setStatus("当前已填数字没有冲突，但盘面尚未完成。");return}finish()}
    function finish(){if(q.done)return;q.done=true;const stars=1+(q.errors<=2?1:0)+(q.errors===0&&q.hints===0?1:0),id=q.mission.id;save.stars[id]=Math.max(Number(save.stars[id])||0,stars);save.errors[id]=Math.min(save.errors[id]??Infinity,q.errors);persist();renderAll();$("resultTitle").textContent="逻辑课完成";$("resultText").textContent=`${q.mission.title} 已唯一闭合，错误 ${q.errors} 次，教学提示 ${q.hints} 次。`;$("resultStars").textContent="★".repeat(stars)+"☆".repeat(3-stars);$("next").textContent=q.index<missions.length-1?"下一式":"返回终课";$("result").hidden=false;tone(620,.2)}
    $("answerMode").onclick=()=>{mode="answer";renderPanel()};$("noteMode").onclick=()=>{mode="note";renderPanel()};$("inspect").onclick=inspect;$("erase").onclick=erase;$("hint").onclick=hint;$("undo").onclick=()=>{const state=q.history.pop();if(state)restore(state)};$("reset").onclick=()=>begin(q.index);$("next").onclick=()=>{$("result").hidden=true;begin(Math.min(missions.length-1,q.index+1))};
    $("exportSave").onclick=async()=>{const code=encodeSave();try{await navigator.clipboard.writeText(code);setStatus("SUDOKU2 档案码已复制。") }catch{prompt("SUDOKU2 档案码",code)}};$("importSave").onclick=()=>{const code=prompt("输入 SUDOKU2 档案码");if(!code)return;try{save=decodeSave(code);persist();begin(0);setStatus("逻辑课档案导入完成。") }catch(error){setStatus(error.message)}};
    addEventListener("keydown",event=>{if(event.key>="1"&&event.key<="9")input(Number(event.key));if(event.key==="Backspace"||event.key==="Delete")erase();if(event.key==="n"){$("noteMode").click()}if(event.key==="z"&&(event.ctrlKey||event.metaKey)){$("undo").click()}});
    function solveReference(){for(let index=0;index<81&&!q.done;index++)if(!q.values[index]){q.selected=index;input(Number(q.mission.solution[index]))}}
    window.__sudokuStudioTest={validateContent,countSolutions,missions,begin,input,hint,erase,inspect,solveReference,encodeSave,decodeSave,getSave:()=>save,getState:()=>({index:q.index,values:[...q.values],notes:q.notes.map(set=>[...set]),errors:q.errors,hints:q.hints,history:q.history.length,done:q.done})};validateContent();begin(0);
  })();
  </script>
</body>
