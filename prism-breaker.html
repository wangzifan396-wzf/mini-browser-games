  <style>
    :root{--ink:#24333a;--muted:#68777d;--paper:#fff;--line:#bec9cd;--deep:#293a42;--cyan:#21839a;--gold:#b88327;--red:#b44d52;--green:#36745f;--violet:#715b8d;--radius:8px;--shadow:0 12px 30px rgba(35,51,58,.14)}
    *{box-sizing:border-box;letter-spacing:0}html,body{margin:0;min-height:100%;color:var(--ink);background:#e4e9e9;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}button{font:inherit}.app{width:min(1190px,calc(100vw - 24px));margin:auto;padding:16px 0 28px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:17px 20px;border-bottom:4px solid #dcad49;color:#fff;background:var(--deep)}h1{margin:0;font-size:28px}.sub{margin:5px 0 0;color:#cbd6d9;font-size:13px}.totals{display:flex;gap:18px;text-align:right}.totals b{display:block;color:#efc96d;font-size:20px}.totals span{color:#becdd1;font-size:10px}.missions{display:grid;grid-template-columns:repeat(12,minmax(42px,1fr));gap:5px;padding:11px 0}.mission{height:46px;border:1px solid #a9b8bd;border-radius:6px;color:#43575f;background:#f8fafb;font-weight:900;cursor:pointer}.mission.active{border-color:var(--violet);color:#fff;background:var(--violet)}.mission:disabled{opacity:.42}.mission small{display:block;height:11px;color:#f4d17a;font-size:9px}.layout{display:grid;grid-template-columns:minmax(0,800px) 300px;gap:14px;align-items:start}.stage{position:relative;min-height:610px;border:1px solid #87979e;border-radius:var(--radius);overflow:hidden;background:#14242b;box-shadow:var(--shadow);touch-action:none}.stage canvas{display:block;width:100%;height:610px}.hud{position:absolute;top:10px;left:10px;right:10px;z-index:2;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.hud span{min-width:92px;padding:6px 9px;border:1px solid rgba(255,255,255,.22);border-radius:6px;color:#dce9ec;background:rgba(25,44,52,.83);font-size:11px}.hud b{color:#fff}.side{display:flex;flex-direction:column;gap:10px}.panel{padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}.panel h2,.panel h3{margin:0}.panel h2{font-size:20px}.panel h3{margin-bottom:9px;font-size:14px}.brief{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.goal{margin:8px 0 0;padding:7px 8px;border-left:4px solid var(--gold);color:#624b1e;background:#fff4d9;font-size:11px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px 2px;border:1px solid #d4dcdf;border-radius:6px;text-align:center;background:#f2f5f5}.stat b{display:block;color:var(--violet);font-size:17px}.stat span{color:var(--muted);font-size:9px}.modules{display:grid;grid-template-columns:1fr 1fr;gap:6px}.module{min-height:57px;padding:6px;border:1px solid #aab9be;border-radius:6px;color:#3d535c;background:#eff3f4;text-align:left;font-size:10px;cursor:pointer}.module b{display:block;font-size:13px}.module.active{border-color:var(--violet);color:#fff;background:var(--violet)}.slots{margin:7px 0 0;color:var(--muted);font-size:10px}.energy{height:9px;margin-top:8px;border-radius:4px;overflow:hidden;background:#d8e0e2}.energy i{display:block;width:0;height:100%;background:#c39131}.commands{display:grid;grid-template-columns:1fr 1fr;gap:6px}.commands button,.archive button{min-height:40px;border:1px solid #9eafb5;border-radius:6px;color:#344b54;background:#edf2f3;font-weight:900;cursor:pointer}.commands .primary{grid-column:1/-1;border-color:var(--violet);color:#fff;background:var(--violet)}.commands .action{border-color:#ba882c;color:#64440d;background:#fff0c9}.status{min-height:84px;margin:0;padding:10px;border-left:4px solid var(--violet);color:#3d535c;background:#edf1f3;font-size:12px;line-height:1.55}.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:9px;text-align:center;color:var(--muted)}.swatch{display:block;width:100%;height:9px;margin-bottom:3px;border-radius:2px}.archive{display:grid;grid-template-columns:1fr 1fr;gap:6px}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:rgba(16,30,36,.86);text-align:center}.overlay[hidden]{display:none}.overlay-card{width:min(440px,100%);padding:23px;border-radius:var(--radius);color:#fff;background:#293a42;box-shadow:0 24px 65px rgba(0,0,0,.4)}.overlay-card h2{margin:0;font-size:25px}.overlay-card p{color:#ccd8db;line-height:1.6}.overlay-stars{color:#f0c864;font-size:35px}.overlay-card button{min-height:42px;padding:0 20px;border:0;border-radius:6px;color:#26343a;background:#efc763;font-weight:900;cursor:pointer}
    @media(max-width:910px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.side .status{grid-column:1/-1}.stage,.stage canvas{height:570px;min-height:570px}}
    @media(max-width:620px){.app{width:calc(100vw - 12px);padding-top:6px}.head{display:block;padding:13px}.totals{justify-content:space-between;margin-top:11px;text-align:left}.missions{grid-template-columns:repeat(6,1fr)}.mission{height:39px}.stage,.stage canvas{height:520px;min-height:520px}.hud span{min-width:0;padding:5px;font-size:9px}.side{display:flex}.panel{padding:10px}.sub{font-size:11px}}

<body>
  <main class="app">
    <header class="head"><div><h1>棱镜破阵：十二座光学堡垒</h1><p class="sub">观察固定砖阵，搭配两枚工程模块，用反射、棱镜增益与聚焦射线拆解核心。</p></div><div class="totals"><div><b id="starTotal">0 / 36</b><span>堡垒星章</span></div><div><b id="clearTotal">0 / 12</b><span>完成任务</span></div><div><b id="perfectTotal">0 / 12</b><span>无损破阵</span></div></div></header>
    <nav class="missions" id="missions" aria-label="堡垒任务"></nav>
    <section class="layout">
      <div class="stage" id="stage"><canvas id="canvas"></canvas><div class="hud"><span>目标 <b id="progress">0 / 0</b></span><span>分数 <b id="score">0</b></span><span>球体 <b id="ballCount">1</b></span></div><div class="overlay" id="overlay"><div class="overlay-card"><h2 id="overlayTitle"></h2><p id="overlayText"></p><div class="overlay-stars" id="overlayStars"></div><button id="overlayButton">开始</button></div></div></div>
      <aside class="side">
        <section class="panel"><h2 id="missionTitle"></h2><p class="brief" id="missionBrief"></p><p class="goal" id="missionGoal"></p></section>
        <section class="panel"><div class="stats"><div class="stat"><b id="lives">3</b><span>备用光球</span></div><div class="stat"><b id="shields">0</b><span>底线护盾</span></div><div class="stat"><b id="clock">0:00</b><span>任务用时</span></div></div></section>
        <section class="panel"><h3>双槽工程模块</h3><div class="modules"><button class="module" data-module="laser"><b>聚焦器</b>主动射线 / 穿透单砖</button><button class="module" data-module="split"><b>分光器</b>主动分球 / 棱镜增殖</button><button class="module" data-module="magnet"><b>磁轨器</b>牵引光球 / 宽板掉落</button><button class="module" data-module="shield"><b>护盾器</b>底线拦截 / 容错恢复</button></div><p class="slots" id="slots"></p><div class="energy"><i id="energyFill"></i></div></section>
        <section class="panel"><div class="commands"><button class="primary" id="start">开始本阵</button><button class="action" id="action">模块动作 Space</button><button id="pause">暂停</button><button id="restart">重开</button></div></section>
        <p class="status" id="status"></p>
        <section class="panel"><div class="legend"><div><i class="swatch" style="background:#4bb4c7"></i>普通</div><div><i class="swatch" style="background:#d19a3f"></i>装甲</div><div><i class="swatch" style="background:#9a73bb"></i>棱镜</div><div><i class="swatch" style="background:#d45b61"></i>核心</div><div><i class="swatch" style="background:#68767b"></i>障碍</div></div></section>
        <section class="panel"><div class="archive"><button id="exportSave">导出档案</button><button id="importSave">导入档案</button></div></section>
      </aside>
    </section>
  </main>
  <script>
  (()=>{
    "use strict";
    const SAVE_KEY="prism_breaker_v2",modules={laser:{name:"聚焦器"},split:{name:"分光器"},magnet:{name:"磁轨器"},shield:{name:"护盾器"}};
    const missions=[
      {title:"光栅入门",brief:"两层基础光栅，用偏心击球学习改变横向速度。",objective:"clear",goal:"清除全部可破坏砖",map:["...........","..1111111..",".111111111.","...........","....P.P....","...........","..........."]},
      {title:"折角回廊",brief:"斜向砖墙会把球路引向边缘，预先移动挡板接回折线。",objective:"clear",goal:"清除全部可破坏砖",map:["1.........1",".11.....11.","..11...11..","...11.11...","....1P1....","...........","..........."]},
      {title:"装甲门扉",brief:"金色装甲需要两次命中；先打薄两翼，再集中中门。",objective:"clear",goal:"击破全部普通与装甲砖",map:["..2222222..","..2111112..","..21PPP12..","..2111112..","..2222222..","...........","..........."]},
      {title:"三棱采样",brief:"紫色棱镜会按固定序列掉落补给，规划接取顺序。",objective:"prism",goal:"击破全部 9 枚棱镜",map:[".1P1P1P1P1.","..1111111..","...P1P1P...","..1111111..","....P.P....","...........","..........."]},
      {title:"断桥光路",brief:"不可破坏的灰色桥墩会反射光球，利用缺口绕进上层。",objective:"clear",goal:"清除桥墩之外的所有砖",map:["11111.11111","22222.22222","XXX.....XXX","..11PPP11..","...11.11...","...........","..........."]},
      {title:"赤核前哨",brief:"核心在棱镜护层存在时免疫，先拆紫色护层再攻红核。",objective:"core",goal:"解除护层并摧毁 1 枚核心",map:["...22C22...","..2PPPPP2..",".211111112.","..11XXX11..","...11111...","...........","..........."]},
      {title:"蜂巢折射",brief:"交错空隙会让高速光球频繁换层，磁轨模块更易稳住回球。",objective:"clear",goal:"清除全部蜂巢单元",map:[".1.1.1.1.1.","1.2.2.2.2.1",".2.P.P.P.2.","1.2.2.2.2.1",".1.1.1.1.1.","...........","..........."]},
      {title:"双核协议",brief:"两枚核心共享四枚棱镜护层，分光与聚焦各有破局路线。",objective:"core",goal:"解除护层并摧毁 2 枚核心",map:["..C22.22C..","..2PP.PP2..","..211.112..","XXX.....XXX","..1111111..","...........","..........."]},
      {title:"潮汐堡垒",brief:"五行厚阵考验持续控球，确定性掉落会补充能量与板宽。",objective:"clear",goal:"清除 50 枚可破坏砖",map:["22222.22222","21111.11112","21PPP.PPP12","21111.11112","22222.22222",".....X.....","..........."]},
      {title:"棱镜王冠",brief:"只需取得王冠上的全部棱镜，但高位装甲会不断改写反弹。",objective:"prism",goal:"击破王冠上的 13 枚棱镜",map:["P.P.P.P.P.P",".P2222222P.","..P11111P..","...P1P1P...","....XXX....","...........","..........."]},
      {title:"三核矩阵",brief:"三核分别被护层包围；优先打通一侧可减少球路分叉。",objective:"core",goal:"解除护层并摧毁 3 枚核心",map:[".C...C...C.","PPP.PPP.PPP","222.222.222","111.111.111","..XXX.XXX..","...........","..........."]},
      {title:"白昼主堡",brief:"厚阵、桥墩、棱镜护层与三枚核心同时出现，完成最终工程验收。",objective:"core",goal:"摧毁主堡 3 枚核心",map:["..C..C..C..",".2P22P22P2.","22P22P22P22","11111111111","XX.XX.XX.XX",".111...111.","..........."]}
    ];
    const $=id=>document.getElementById(id),canvas=$("canvas"),ctx=canvas.getContext("2d"),stage=$("stage"),missionEl=$("missions"),overlay=$("overlay");let profile=load(),q=null,chosen=["laser","shield"],pointerX=.5,last=0,raf=0,audio=null;
    function defaults(){return{version:2,stars:{},best:{},perfect:{},updatedAt:Date.now()}}
    function normalize(value){const clean=defaults();if(!value||value.version!==2)return clean;for(let i=0;i<missions.length;i++){clean.stars[i]=Math.max(0,Math.min(3,Number(value.stars?.[i])||0));if(Number.isFinite(Number(value.best?.[i])))clean.best[i]=Math.max(0,Number(value.best[i]));clean.perfect[i]=Boolean(value.perfect?.[i])}return clean}
    function load(){try{return normalize(JSON.parse(localStorage.getItem(SAVE_KEY)))}catch{return defaults()}}
    function save(){profile.updatedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(profile));renderCampaign()}
    function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
    function encodeProfile(){const body=btoa(unescape(encodeURIComponent(JSON.stringify(profile))));return`PRISM2.${body}.${checksum(body)}`}
    function decodeProfile(code){const part=code.trim().split(".");if(part.length!==3||part[0]!=="PRISM2"||checksum(part[1])!==part[2])throw Error("破阵档案校验失败");return normalize(JSON.parse(decodeURIComponent(escape(atob(part[1])))))}
    function unlocked(index){return index===0||Number(profile.stars[index-1])>0}
    function prepare(index){const mission=missions[index],rows=mission.map.length,cols=11,bricks=[];mission.map.forEach((line,row)=>{if(line.length!==cols)throw Error(`第 ${index+1} 阵第 ${row+1} 行宽度错误`);[...line].forEach((type,col)=>{if(type!==".")bricks.push({id:row*cols+col,type,x:.055+(col+.5)*.081,y:.105+row*.061,w:.072,h:.046,hp:type==="2"?2:type==="C"?5:Infinity,dead:false,flash:0})})});const breakable=bricks.filter(b=>b.type!=="X"),targets=mission.objective==="clear"?breakable:bricks.filter(b=>b.type===(mission.objective==="prism"?"P":"C"));return{...mission,index,bricks,targets:targets.map(b=>b.id),targetCount:targets.length,breakableCount:breakable.length,prisms:bricks.filter(b=>b.type==="P").length,cores:bricks.filter(b=>b.type==="C").length}}
    const prepared=missions.map((_,index)=>prepare(index));
    function makeState(index,selected=chosen,simulation=false){const mission=prepared[index];return{index,mission,modules:[...selected],simulation,run:false,paused:false,ended:false,won:false,time:0,score:0,lives:3,shield:selected.includes("shield")?1:0,energy:simulation?100:55,paddle:{x:.5,w:selected.includes("magnet")?.18:.145},balls:[],bricks:mission.bricks.map(b=>({...b,hp:b.type==="1"||b.type==="P"?1:b.hp})),drops:[],lasers:[],wide:0,magnet:0,broken:new Set(),targetDone:0,serveDelay:.4}}
    function serve(state){state.balls=[{x:state.paddle.x,y:.855,vx:.31*(state.index%2?1:-1),vy:-.53,r:.012}];state.serveDelay=.35}
    function remainingPrisms(state){return state.bricks.some(b=>!b.dead&&b.type==="P")}
    function objectiveDone(state){return state.targetDone>=state.mission.targetCount}
    function registerTarget(state,brick){if(state.mission.targets.includes(brick.id)){state.targetDone++;if(objectiveDone(state)){state.won=true;state.ended=true;state.run=false}}}
    function splitBalls(state){const copies=[];for(const ball of state.balls.slice(0,3)){if(state.balls.length+copies.length>=5)break;copies.push({...ball,vx:-ball.vx*.94,vy:ball.vy*.98})}state.balls.push(...copies)}
    function spawnDrop(state,brick){const kinds=["energy","wide","split","shield"],kind=kinds[(brick.id+state.index*3)%kinds.length];state.drops.push({x:brick.x,y:brick.y,kind,vy:.18})}
    function damageBrick(state,brick,power=1){if(brick.dead||brick.type==="X")return false;if(brick.type==="C"&&remainingPrisms(state)){brick.flash=.18;return false}brick.hp-=power;brick.flash=.16;if(brick.hp>0)return true;brick.dead=true;state.broken.add(brick.id);state.score+=brick.type==="C"?300:brick.type==="P"?90:brick.type==="2"?45:25;if(brick.type==="P"||(brick.id+state.index)%7===0)spawnDrop(state,brick);registerTarget(state,brick);return true}
    function collectDrop(state,drop){if(drop.kind==="energy")state.energy=Math.min(100,state.energy+45);if(drop.kind==="wide"){state.wide=Math.max(state.wide,12);state.paddle.w=Math.min(.24,state.paddle.w+.045)}if(drop.kind==="split")splitBalls(state);if(drop.kind==="shield")state.shield=Math.min(3,state.shield+1);state.score+=20}
    function targetBrick(state){const live=state.bricks.filter(b=>!b.dead&&b.type!=="X");if(!live.length)return null;if(remainingPrisms(state)){const prism=live.find(b=>b.type==="P");if(prism)return prism}if(state.mission.objective==="core"){const core=live.find(b=>b.type==="C");if(core)return core}if(state.mission.objective==="prism"){const prism=live.find(b=>b.type==="P");if(prism)return prism}return live.sort((a,b)=>b.y-a.y||a.x-b.x)[0]}
    function fireLaser(state){if(!state.modules.includes("laser")||state.energy<18)return false;state.energy-=18;const candidates=state.bricks.filter(b=>!b.dead&&b.type!=="X"&&Math.abs(b.x-state.paddle.x)<b.w*.72).sort((a,b)=>b.y-a.y);const brick=candidates[0];state.lasers.push({x:state.paddle.x,time:.13,hit:brick?.y||.04});if(brick)damageBrick(state,brick,1);return true}
    function activate(state){if(state.modules.includes("laser")&&fireLaser(state))return"聚焦射线已发射";if(state.modules.includes("split")&&state.energy>=45&&state.balls.length<5){state.energy-=45;splitBalls(state);return"光球已分裂"}if(state.modules.includes("shield")&&state.energy>=70){state.energy-=70;state.shield=Math.min(3,state.shield+1);return"底线护盾已充能"}if(state.modules.includes("magnet")&&state.energy>=35){state.energy-=35;state.magnet=7;return"磁轨牵引已增强"}return"当前能量不足或模块条件未满足"}
    function circleBox(ball,brick){const nx=Math.max(brick.x-brick.w/2,Math.min(ball.x,brick.x+brick.w/2)),ny=Math.max(brick.y-brick.h/2,Math.min(ball.y,brick.y+brick.h/2)),dx=ball.x-nx,dy=ball.y-ny;return dx*dx+dy*dy<ball.r*ball.r}
    function stepBall(state,ball,dt){const px=ball.x,py=ball.y;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x<ball.r+.012){ball.x=ball.r+.012;ball.vx=Math.abs(ball.vx)}if(ball.x>1-ball.r-.012){ball.x=1-ball.r-.012;ball.vx=-Math.abs(ball.vx)}if(ball.y<ball.r+.055){ball.y=ball.r+.055;ball.vy=Math.abs(ball.vy)}const paddle=state.paddle;if(ball.vy>0&&ball.y+ball.r>.875&&py<.9&&Math.abs(ball.x-paddle.x)<paddle.w/2+ball.r){ball.y=.875-ball.r;ball.vy=-Math.max(.46,Math.abs(ball.vy));ball.vx+=(ball.x-paddle.x)/paddle.w*.52;const speed=Math.hypot(ball.vx,ball.vy);if(speed>.82){ball.vx*=.82/speed;ball.vy*=.82/speed}}
      for(const brick of state.bricks){if(brick.dead||!circleBox(ball,brick))continue;const fromX=px<brick.x-brick.w/2||px>brick.x+brick.w/2;if(fromX)ball.vx*=-1;else ball.vy*=-1;damageBrick(state,brick);break}if(state.modules.includes("magnet")||state.magnet>0){const pull=(paddle.x-ball.x)*dt*(state.magnet>0?.36:.12);if(ball.y>.48)ball.vx+=pull}}
    function step(state,input,dt){if(!state.run||state.paused||state.ended)return state;state.time+=dt;state.energy=Math.min(100,state.energy+dt*(state.modules.includes("laser")?8:5));state.wide=Math.max(0,state.wide-dt);state.magnet=Math.max(0,state.magnet-dt);if(!state.wide)state.paddle.w+=( (state.modules.includes("magnet")?.18:.145)-state.paddle.w)*Math.min(1,dt*3);const speed=state.modules.includes("magnet")?1.72:1.48,dx=input.x-state.paddle.x;state.paddle.x+=Math.sign(dx)*Math.min(Math.abs(dx),speed*dt);state.paddle.x=Math.max(state.paddle.w/2,Math.min(1-state.paddle.w/2,state.paddle.x));if(state.serveDelay>0){state.serveDelay-=dt;if(state.balls.length)state.balls[0].x=state.paddle.x}if(input.action)activate(state);for(const ball of state.balls)stepBall(state,ball,dt);state.balls=state.balls.filter(ball=>ball.y<1.04);for(const drop of state.drops)drop.y+=drop.vy*dt;for(const drop of state.drops)if(!drop.dead&&drop.y>.84&&drop.y<.94&&Math.abs(drop.x-state.paddle.x)<state.paddle.w/2){drop.dead=true;collectDrop(state,drop)}state.drops=state.drops.filter(drop=>!drop.dead&&drop.y<1.02);for(const laser of state.lasers)laser.time-=dt;state.lasers=state.lasers.filter(laser=>laser.time>0);for(const brick of state.bricks)brick.flash=Math.max(0,brick.flash-dt);if(state.ended)return state;if(!state.balls.length){if(state.shield>0){state.shield--;serve(state)}else{state.lives--;if(state.lives>0)serve(state);else{state.ended=true;state.run=false;state.won=false}}}return state}

    function validateContent(){if(missions.length!==12)throw Error("堡垒任务数量错误");let bricks=0,targets=0,prisms=0,cores=0;const references=[];for(const mission of prepared){bricks+=mission.breakableCount;targets+=mission.targetCount;prisms+=mission.prisms;cores+=mission.cores;if(!mission.targetCount)throw Error(`第 ${mission.index+1} 阵没有任务目标`);const result=simulateReference(mission.index);if(!result.won)throw Error(`第 ${mission.index+1} 阵参考破阵失败`);references.push(result)}return{missions:12,modules:4,bricks,targets,prisms,cores,referenceWins:references.filter(r=>r.won).length,maxFrames:Math.max(...references.map(r=>r.frames))}}
    function begin(index=q?.index||0){if(!unlocked(index))return;q=makeState(index);serve(q);renderAll();showOverlay("工程简报",`${q.mission.goal}。已装配：${q.modules.map(key=>modules[key].name).join(" + ")}。`,"","开始破阵",()=>{q.run=true;hideOverlay();setStatus("拖动挡板接球。击中球板的左右侧会改变反射角，空格键启动当前可用模块。")})}

    function showOverlay(title,text,stars,label,action){$("overlayTitle").textContent=title;$("overlayText").textContent=text;$("overlayStars").textContent=stars;$("overlayButton").textContent=label;$("overlayButton").onclick=action;overlay.hidden=false}

    function sync(){if(!q)return;$("progress").textContent=`${q.targetDone} / ${q.mission.targetCount}`;$("score").textContent=q.score;$("ballCount").textContent=q.balls.length;$("lives").textContent=q.lives;$("shields").textContent=q.shield;$("clock").textContent=clockText(q.time);$("energyFill").style.width=`${q.energy}%`;$("pause").textContent=q.paused?"继续":"暂停"}
    function resize(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);if(canvas.width!==Math.round(rect.width*dpr)||canvas.height!==Math.round(rect.height*dpr)){canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}}
