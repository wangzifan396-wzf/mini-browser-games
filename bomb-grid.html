<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17252b">
  <title>爆格特攻：连锁战役</title>
  <style>
    :root{--bg:#e8ece8;--paper:#fffdf7;--ink:#17252b;--muted:#637176;--line:#bcc8c5;--deep:#17252b;--blue:#187397;--teal:#2d765f;--gold:#bd841d;--red:#ad4c4c;--violet:#6d5f88;--cell:#dfe6e1;--radius:8px;--shadow:0 12px 28px rgba(26,48,54,.12)}
    *{box-sizing:border-box;letter-spacing:0}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg)}button,select,textarea{font:inherit}.app{width:min(1180px,calc(100vw - 24px));margin:0 auto;padding:18px 0 28px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:18px 20px;border-bottom:4px solid #e2b84d;color:#fff;background:var(--deep)}h1{margin:0;font-size:28px}.subtitle{margin:5px 0 0;color:#d4e2e1;font-size:13px}.summary{display:flex;gap:18px;text-align:right}.summary b{display:block;color:#f1c85e;font-size:20px}.summary span{font-size:11px;color:#b9cdcd}.mission-strip{display:grid;grid-template-columns:repeat(12,minmax(42px,1fr));gap:5px;padding:12px 0}.mission-btn{height:43px;border:1px solid #9eaeaa;border-radius:6px;color:#40545b;background:#f7f8f3;font-weight:900;cursor:pointer}.mission-btn.active{border-color:var(--blue);color:#fff;background:var(--blue)}.mission-btn.locked{opacity:.44}.mission-btn .stars{display:block;height:12px;color:#f5c750;font-size:9px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}.field{min-width:0;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);box-shadow:var(--shadow)}.brief{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.brief h2{margin:0;font-size:21px}.brief p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.goal{flex:0 0 auto;padding:7px 9px;border:1px solid #d1ad59;border-radius:6px;color:#75520e;background:#fff4d7;font-size:11px;font-weight:900}.board{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;width:100%;aspect-ratio:9/7;padding:7px;border:1px solid #9dacaa;border-radius:var(--radius);background:#22333a;touch-action:manipulation}.cell{position:relative;display:grid;place-items:center;min-width:0;border:0;border-radius:4px;color:var(--ink);background:var(--cell);cursor:pointer;overflow:hidden}.cell:hover{outline:2px solid #f1c85e;outline-offset:-2px}.cell.wall{background:#52666c;box-shadow:inset 0 0 0 2px #33474d}.cell.crate{background:#b9784f}.cell.crate:before,.cell.crate:after{content:"";position:absolute;background:#845037}.cell.crate:before{width:72%;height:4px;transform:rotate(36deg)}.cell.crate:after{width:4px;height:72%;transform:rotate(36deg)}.cell.preview{box-shadow:inset 0 0 0 3px rgba(24,115,151,.58)}.cell.blast{animation:flash .58s ease}.cell.blast:after{content:"";position:absolute;inset:5%;border-radius:40%;background:#f09b3d;box-shadow:0 0 14px #d65343}.enemy{z-index:2;display:grid;place-items:center;width:56%;aspect-ratio:1;border-radius:50%;color:#fff;background:var(--red);font-size:11px;font-weight:900;box-shadow:0 3px 0 #783434}.enemy.shield{background:var(--violet);box-shadow:0 0 0 4px #c8bde0 inset,0 3px 0 #463b5d}.enemy.core{border-radius:5px;background:#9a3f51;transform:rotate(45deg)}.enemy.core span{transform:rotate(-45deg)}.charge{z-index:3;display:grid;place-items:center;width:48%;aspect-ratio:1;border:3px solid #f1c85e;border-radius:50%;color:#fff;background:#1c262b;font-size:10px;font-weight:900}.charge.fuse{box-shadow:0 0 0 4px rgba(241,200,94,.26),0 0 16px #f1c85e}.panel{display:flex;flex-direction:column;gap:10px}.box{padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}.box h3{margin:0 0 9px;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px 5px;border:1px solid #d2dad7;border-radius:6px;text-align:center;background:#f4f6f1}.stat b{display:block;color:var(--blue);font-size:18px}.stat span{color:var(--muted);font-size:10px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.seg button,.tool,.action{min-height:40px;border:1px solid #9daea9;border-radius:6px;color:#30464e;background:#f1f4ef;font-weight:900;cursor:pointer}.seg button.active{border-color:var(--blue);color:#fff;background:var(--blue)}.seg button small{display:block;font-size:9px;font-weight:700}.charge-types button:nth-child(2).active{background:var(--gold);border-color:var(--gold)}.charge-types button:nth-child(3).active{background:var(--violet);border-color:var(--violet)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.action.primary{grid-column:1/-1;border-color:var(--red);color:#fff;background:var(--red)}.action:disabled{cursor:not-allowed;opacity:.45}.status{min-height:52px;margin:0;padding:9px;border-left:4px solid var(--teal);color:#3d555c;background:#edf4ef;font-size:12px;line-height:1.5}.archive{display:grid;grid-template-columns:1fr 1fr;gap:6px}.archive button{min-height:36px;border:1px solid #9daea9;border-radius:6px;background:#fff;color:#41545a;font-weight:800;cursor:pointer}.legend{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:10px}.legend i{display:inline-block;width:9px;height:9px;margin-right:4px;border-radius:50%}.result{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(13,29,34,.72)}.result[hidden]{display:none}.result-card{width:min(430px,100%);padding:22px;border-radius:var(--radius);background:var(--paper);box-shadow:0 24px 70px rgba(0,0,0,.3);text-align:center}.result-card h2{margin:0 0 8px}.result-stars{margin:12px 0;color:#d49a18;font-size:34px}.result-card button{min-height:42px;padding:0 18px;border:0;border-radius:6px;color:#fff;background:var(--blue);font-weight:900;cursor:pointer}@keyframes flash{0%,100%{filter:none}40%{filter:brightness(1.4)}}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.panel{display:grid;grid-template-columns:1fr 1fr}.panel .box:last-child{grid-column:1/-1}}
    @media(max-width:620px){.app{width:calc(100vw - 12px);padding-top:6px}.top{display:block;padding:14px}.summary{margin-top:12px;justify-content:space-between;text-align:left}.mission-strip{grid-template-columns:repeat(6,1fr);gap:4px}.mission-btn{height:38px}.field{padding:8px}.brief{display:block}.goal{display:inline-block;margin-top:8px}.board{gap:3px;padding:4px}.enemy{width:66%;font-size:9px}.charge{width:58%;border-width:2px;font-size:8px}.panel{display:flex}.stats .stat{padding:7px 2px}.seg button{font-size:12px}.subtitle{line-height:1.5}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div><h1>爆格特攻：连锁战役</h1><p class="subtitle">十二份固定爆破合同，每一次布置都必须形成完整引爆链。</p></div>
      <div class="summary"><div><b id="totalStars">0 / 36</b><span>战役星章</span></div><div><b id="medals">0 / 4</b><span>行动勋章</span></div><div><b id="bestChain">0</b><span>最长连锁</span></div></div>
    </header>
    <nav class="mission-strip" id="missionStrip" aria-label="战役任务"></nav>
    <section class="layout">
      <div class="field">
        <div class="brief"><div><h2 id="missionTitle"></h2><p id="missionBrief"></p></div><span class="goal" id="missionGoal"></span></div>
        <div class="board" id="board" aria-label="爆破战术棋盘"></div>
      </div>
      <aside class="panel">
        <section class="box"><h3>行动状态</h3><div class="stats"><div class="stat"><b id="integrity">3</b><span>防线</span></div><div class="stat"><b id="budget">0 / 0</b><span>布置</span></div><div class="stat"><b id="targets">0</b><span>目标耐久</span></div></div></section>
        <section class="box"><h3>行动员</h3><div class="seg" id="operators"><button data-operator="analyst">校准员<small>爆区预览</small></button><button data-operator="engineer">工兵<small>额外槽位</small></button><button data-operator="warden">守备员<small>防线 +1</small></button></div></section>
        <section class="box"><h3>爆破模块</h3><div class="seg charge-types" id="chargeTypes"><button data-type="pulse">脉冲<small>十字 2 格</small></button><button data-type="lance">贯穿<small>穿箱 4 格</small></button><button data-type="nova">震荡<small>九宫爆区</small></button></div></section>
        <section class="box"><div class="actions"><button class="action primary" id="detonate">引爆连锁</button><button class="action" id="undo">撤回布置</button><button class="action" id="hint">战术提示</button><button class="action" id="reset">重置任务</button></div></section>
        <p class="status" id="status"></p>
        <section class="box"><div class="archive"><button id="exportSave">导出档案</button><button id="importSave">导入档案</button></div></section>
        <div class="legend"><span><i style="background:#ad4c4c"></i>侦察机 1</span><span><i style="background:#6d5f88"></i>护盾机 2</span><span><i style="background:#9a3f51"></i>核心 3</span></div>
      </aside>
    </section>
  </main>
  <div class="result" id="result" hidden><div class="result-card"><h2 id="resultTitle"></h2><p id="resultText"></p><div class="result-stars" id="resultStars"></div><button id="resultNext">继续战役</button></div></div>
  <script>
  (()=>{
    "use strict";
    const W=9,H=7,SAVE_KEY="bomb_grid_v2";
    const missions=[
      {id:"a1",title:"灰港校准",brief:"单枚脉冲覆盖纵向目标。",par:1,map:["#########","#.......#","#.......#","#.......#","#.......#","#.......#","#########"],enemies:[[4,2,1]],ref:[[4,4,"pulse"]]},
      {id:"a2",title:"双点归零",brief:"寻找能同时覆盖两架侦察机的交汇点。",par:1,map:["#########","#.......#","#.......#","#...#...#","#.......#","#.......#","#########"],enemies:[[2,2,1],[6,2,1]],ref:[[4,2,"pulse"]]},
      {id:"a3",title:"接力火线",brief:"第二枚炸弹只有进入第一枚爆区才会启动。",par:2,map:["#########","#.......#","#.......#","#.......#","#.......#","#.......#","#########"],enemies:[[1,3,1],[7,3,1]],ref:[[3,3,"pulse"],[5,3,"pulse"]]},
      {id:"b1",title:"木箱之后",brief:"贯穿模块能击穿木箱并继续传播。",par:1,map:["#########","#.......#","#.......#","#....c..#","#.......#","#.......#","#########"],enemies:[[7,3,1]],ref:[[3,3,"lance"]]},
      {id:"b2",title:"双重护盾",brief:"护盾目标必须被两次独立爆炸覆盖。",par:2,map:["#########","#.......#","#.......#","#.......#","#.......#","#.......#","#########"],enemies:[[4,3,2]],ref:[[3,2,"nova"],[4,2,"nova"]]},
      {id:"b3",title:"折线联爆",brief:"用贯穿纵线连接远端脉冲。",par:2,map:["#########","#..#....#","#..#....#","#.......#","#.....#.#","#.......#","#########"],enemies:[[1,1,1],[7,5,1]],ref:[[1,5,"lance"],[5,5,"pulse"]]},
      {id:"c1",title:"封箱走廊",brief:"先建立纵向引线，再让贯穿模块越过木箱。",par:2,map:["#########","#....c..#","#.......#","#.......#","#.......#","#.......#","#########"],enemies:[[7,1,1],[3,5,1]],ref:[[3,3,"pulse"],[3,1,"lance"]]},
      {id:"c2",title:"护盾夹击",brief:"两枚脉冲既要互相触发，也要重复覆盖中央目标。",par:2,map:["#########","#.......#","#..#.#..#","#.......#","#..#.#..#","#.......#","#########"],enemies:[[1,3,1],[4,3,2],[7,3,1]],ref:[[3,3,"pulse"],[5,3,"pulse"]]},
      {id:"c3",title:"震荡走廊",brief:"把三枚震荡模块排成接力链。",par:3,map:["#########","#..#.#..#","#.......#","#.......#","#.......#","#..#.#..#","#########"],enemies:[[2,2,1],[6,4,1]],ref:[[3,3,"nova"],[4,3,"nova"],[5,3,"nova"]]},
      {id:"d1",title:"重核贯穿",brief:"两条贯穿波必须同时命中重型核心。",par:2,map:["#########","#.......#","#.......#","#.....c.#","#.......#","#.......#","#########"],enemies:[[7,3,2]],ref:[[3,3,"lance"],[5,3,"lance"]]},
      {id:"d2",title:"四角封锁",brief:"一枚纵向贯穿同时启动上下两条火线。",par:4,map:["#########","#.......#","#...#...#","#.......#","#...#...#","#.......#","#########"],enemies:[[1,1,1],[7,1,1],[1,5,1],[7,5,1]],ref:[[3,1,"lance"],[5,1,"pulse"],[3,5,"pulse"],[5,5,"pulse"]]},
      {id:"d3",title:"赤核终局",brief:"三枚震荡模块必须连续启动并三次覆盖赤核。",par:3,map:["#########","#.......#","#.......#","#.......#","#.......#","#.......#","#########"],enemies:[[2,2,1],[4,3,3],[6,2,1]],ref:[[3,2,"nova"],[4,2,"nova"],[5,2,"nova"]]}
    ];
    const operators={analyst:{integrity:3,bonus:0,preview:true},engineer:{integrity:3,bonus:1,preview:false},warden:{integrity:4,bonus:0,preview:false}};
    const typeLabel={pulse:"脉",lance:"贯",nova:"震"};
    const $=id=>document.getElementById(id);
    const board=$("board"),missionStrip=$("missionStrip"),status=$("status");
    let audio=null,save=loadSave(),state=null,selectedType="pulse";

    function defaultSave(){return{version:2,operator:"analyst",stars:{},bestChain:0,medals:[],updatedAt:Date.now()}}
    function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
    function normalizeSave(value){const clean=defaultSave();if(!value||value.version!==2)return clean;clean.operator=operators[value.operator]?value.operator:"analyst";for(const mission of missions)clean.stars[mission.id]=Math.max(0,Math.min(3,Number(value.stars?.[mission.id])||0));clean.bestChain=Math.max(0,Number(value.bestChain)||0);clean.medals=Array.isArray(value.medals)?value.medals.filter(x=>["first","perfect","chain","campaign"].includes(x)):[];return clean}
    function loadSave(){try{return normalizeSave(JSON.parse(localStorage.getItem(SAVE_KEY)))}catch{return defaultSave()}}
    function persist(){save.updatedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(save));renderMeta()}
    function encodeSave(){const json=JSON.stringify(save),body=btoa(unescape(encodeURIComponent(json)));return`BOMB2.${body}.${checksum(body)}`}
    function decodeSave(code){const parts=code.trim().split(".");if(parts.length!==3||parts[0]!=="BOMB2"||checksum(parts[1])!==parts[2])throw Error("档案校验失败");return normalizeSave(JSON.parse(decodeURIComponent(escape(atob(parts[1])))))}
    function key(x,y){return`${x},${y}`}
    function mapSets(mission){const walls=new Set(),crates=new Set();mission.map.forEach((row,y)=>[...row].forEach((char,x)=>{if(char==="#")walls.add(key(x,y));if(char==="c")crates.add(key(x,y))}));return{walls,crates}}
    function lineCells(x,y,dx,dy,range,walls,crates,passCrate){const cells=[];for(let step=1;step<=range;step++){const nx=x+dx*step,ny=y+dy*step,k=key(nx,ny);if(nx<0||ny<0||nx>=W||ny>=H||walls.has(k))break;cells.push(k);if(crates.has(k)&&!passCrate)break}return cells}
    function blastCells(bomb,walls,crates){const cells=new Set([key(bomb.x,bomb.y)]);if(bomb.type==="nova"){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const k=key(bomb.x+dx,bomb.y+dy);if(!walls.has(k))cells.add(k)}}else{const range=bomb.type==="lance"?4:2,pass=bomb.type==="lance";for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])for(const k of lineCells(bomb.x,bomb.y,dx,dy,range,walls,crates,pass))cells.add(k)}return cells}
    function simulateMission(mission,placements){const{walls,crates}=mapSets(mission),remainingCrates=new Set(crates),enemies=mission.enemies.map(([x,y,hp])=>({x,y,hp})),bombs=placements.map(([x,y,type])=>({x,y,type})),byCell=new Map(bombs.map((bomb,index)=>[key(bomb.x,bomb.y),index])),queue=bombs.length?[0]:[],triggered=new Set(),waves=[];while(queue.length){const index=queue.shift();if(triggered.has(index))continue;triggered.add(index);const cells=blastCells(bombs[index],walls,remainingCrates);waves.push([...cells]);for(const cell of cells){remainingCrates.delete(cell);const linked=byCell.get(cell);if(linked!==undefined&&!triggered.has(linked))queue.push(linked);for(const enemy of enemies)if(enemy.hp>0&&key(enemy.x,enemy.y)===cell)enemy.hp--}}return{cleared:enemies.every(enemy=>enemy.hp<=0),triggered:triggered.size,total:bombs.length,waves,enemies,crates:remainingCrates}}
    function validatePlacement(mission,placements){const{walls,crates}=mapSets(mission),used=new Set();for(const[x,y,type]of placements){const k=key(x,y);if(x<0||y<0||x>=W||y>=H||walls.has(k)||crates.has(k)||used.has(k)||!typeLabel[type]||mission.enemies.some(enemy=>enemy[0]===x&&enemy[1]===y))return false;used.add(k)}return true}
    function validateContent(){if(missions.length!==12)throw Error("任务数量错误");const ids=new Set();for(const mission of missions){if(ids.has(mission.id)||mission.map.length!==H||mission.map.some(row=>row.length!==W))throw Error(`${mission.id} 地图错误`);ids.add(mission.id);if(!validatePlacement(mission,mission.ref))throw Error(`${mission.id} 参考布置非法`);const result=simulateMission(mission,mission.ref);if(!result.cleared||result.triggered!==mission.ref.length||mission.ref.length>mission.par)throw Error(`${mission.id} 参考战术失败`)}return{missions:missions.length,referencesPassed:missions.length,stars:36}}
    function unlocked(index){return index===0||Number(save.stars[missions[index-1].id])>0}
    function startMission(index=0){if(!unlocked(index))return;const mission=missions[index],operator=operators[save.operator];state={index,mission,placements:[],integrity:operator.integrity,hintUsed:false,lastResult:null,flash:new Set()};selectedType="pulse";renderAll();setStatus("选择爆破模块后点击空地布置；第一枚是引信，只有被爆区连接的模块才会启动。")}
    function setStatus(text){status.textContent=text}
    function renderMeta(){const stars=Object.values(save.stars).reduce((sum,n)=>sum+Number(n||0),0);$("totalStars").textContent=`${stars} / 36`;$("bestChain").textContent=save.bestChain;const medals=[];if(stars>0)medals.push("first");if(Object.values(save.stars).filter(x=>x===3).length>=4)medals.push("perfect");if(save.bestChain>=4)medals.push("chain");if(missions.every(m=>save.stars[m.id]))medals.push("campaign");save.medals=[...new Set([...save.medals,...medals])];$("medals").textContent=`${save.medals.length} / 4`}
    function renderStrip(){missionStrip.replaceChildren();missions.forEach((mission,index)=>{const button=document.createElement("button"),stars=Number(save.stars[mission.id])||0;button.className=`mission-btn${state?.index===index?" active":""}${unlocked(index)?"":" locked"}`;button.innerHTML=`${String(index+1).padStart(2,"0")}<span class="stars">${stars?"★".repeat(stars):""}</span>`;button.disabled=!unlocked(index);button.title=mission.title;button.onclick=()=>startMission(index);missionStrip.append(button)})}
    function previewSet(){if(!operators[save.operator].preview||!state.placements.length)return new Set();const result=simulateMission(state.mission,state.placements);return new Set(result.waves.flat())}
    function renderBoard(){const mission=state.mission,{walls,crates}=mapSets(mission),preview=previewSet(),bombMap=new Map(state.placements.map((bomb,index)=>[key(bomb[0],bomb[1]),{bomb,index}])),enemyMap=new Map(mission.enemies.map(enemy=>[key(enemy[0],enemy[1]),enemy]));board.replaceChildren();for(let y=0;y<H;y++)for(let x=0;x<W;x++){const k=key(x,y),cell=document.createElement("button"),bombData=bombMap.get(k),enemy=enemyMap.get(k);cell.className=`cell${walls.has(k)?" wall":""}${crates.has(k)?" crate":""}${preview.has(k)?" preview":""}${state.flash.has(k)?" blast":""}`;cell.dataset.x=x;cell.dataset.y=y;cell.disabled=walls.has(k)||crates.has(k)||Boolean(enemy);if(enemy){const token=document.createElement("span");token.className=`enemy ${enemy[2]===2?"shield":enemy[2]===3?"core":""}`;token.innerHTML=enemy[2]===3?"<span>3</span>":String(enemy[2]);cell.append(token)}if(bombData){const token=document.createElement("span");token.className=`charge${bombData.index===0?" fuse":""}`;token.textContent=typeLabel[bombData.bomb[2]];cell.append(token);cell.disabled=false}cell.onclick=()=>toggleCharge(x,y);cell.oncontextmenu=event=>{event.preventDefault();removeCharge(x,y)};board.append(cell)}}
    function renderControls(){document.querySelectorAll("[data-operator]").forEach(button=>button.classList.toggle("active",button.dataset.operator===save.operator));document.querySelectorAll("[data-type]").forEach(button=>button.classList.toggle("active",button.dataset.type===selectedType));const mission=state.mission,operator=operators[save.operator],budget=mission.par+operator.bonus,targetHp=mission.enemies.reduce((sum,e)=>sum+e[2],0);$("missionTitle").textContent=`${String(state.index+1).padStart(2,"0")} · ${mission.title}`;$("missionBrief").textContent=mission.brief;$("missionGoal").textContent=`基准 ${mission.par} 枚 · 全链三星`;$("integrity").textContent=state.integrity;$("budget").textContent=`${state.placements.length} / ${budget}`;$("targets").textContent=targetHp;$("detonate").disabled=!state.placements.length;$("undo").disabled=!state.placements.length;$("hint").disabled=state.placements.length>=budget}
    function renderAll(){renderMeta();renderStrip();renderControls();renderBoard()}
    function toggleCharge(x,y){const existing=state.placements.findIndex(b=>b[0]===x&&b[1]===y);if(existing>=0){state.placements.splice(existing,1);renderAll();return}const budget=state.mission.par+operators[save.operator].bonus;if(state.placements.length>=budget){setStatus("布置槽位已满；撤回一个模块或更换工兵行动员。");return}const candidate=[...state.placements,[x,y,selectedType]];if(!validatePlacement(state.mission,candidate)){setStatus("该位置不能布置爆破模块。");return}state.placements=candidate;renderAll();setStatus(state.placements.length===1?"引信已设定。继续把后续模块放入已有模块的爆区。":"模块已加入连锁预案。")}
    function removeCharge(x,y){const index=state.placements.findIndex(b=>b[0]===x&&b[1]===y);if(index>=0){state.placements.splice(index,1);renderAll()}}
    function tone(freq,duration=.08){try{audio??=new AudioContext();const osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=freq;gain.gain.setValueAtTime(.05,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain).connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}catch{}}
    async function detonate(){const result=simulateMission(state.mission,state.placements);state.lastResult=result;state.flash=new Set();for(const wave of result.waves){for(const cell of wave)state.flash.add(cell);renderBoard();tone(120+state.flash.size*3,.11);await new Promise(resolve=>setTimeout(resolve,180))}save.bestChain=Math.max(save.bestChain,result.triggered);if(result.cleared){const stars=1+(result.triggered===result.total?1:0)+(state.placements.length<=state.mission.par&&!state.hintUsed?1:0);save.stars[state.mission.id]=Math.max(Number(save.stars[state.mission.id])||0,stars);persist();showResult(stars,result)}else{state.integrity--;tone(70,.22);if(state.integrity<=0){setStatus("防线耗尽，任务已重置。参考引线仍可通过战术提示逐步查看。");state.integrity=operators[save.operator].integrity}else if(result.triggered<result.total)setStatus(`只有 ${result.triggered}/${result.total} 枚模块进入连锁；未连接模块不会自动引爆。`);else setStatus(`目标仍有 ${result.enemies.reduce((sum,e)=>sum+Math.max(0,e.hp),0)} 点耐久，需要叠加爆区。`);state.placements=[];state.flash=new Set();renderAll();persist()}}
    function showResult(stars,result){$("resultTitle").textContent="合同完成";$("resultText").textContent=`${result.triggered} 枚模块全部联动，记录已写入战役档案。`;$("resultStars").textContent="★".repeat(stars)+"☆".repeat(3-stars);$("resultNext").textContent=state.index<missions.length-1?"下一份合同":"返回终局";$("result").hidden=false;tone(520,.18)}
    function useHint(){const next=state.mission.ref.find(ref=>!state.placements.some(b=>b[0]===ref[0]&&b[1]===ref[1]));if(!next){setStatus("参考引线已经完整呈现。");return}const budget=state.mission.par+operators[save.operator].bonus;if(state.placements.length>=budget)return;state.placements.push([...next]);state.hintUsed=true;selectedType=next[2];renderAll();setStatus("已标出参考战术中的下一枚模块，本次最多获得二星。")}
    document.querySelectorAll("[data-operator]").forEach(button=>button.onclick=()=>{save.operator=button.dataset.operator;persist();startMission(state.index)});document.querySelectorAll("[data-type]").forEach(button=>button.onclick=()=>{selectedType=button.dataset.type;renderControls()});
    $("undo").onclick=()=>{state.placements.pop();renderAll()};$("reset").onclick=()=>startMission(state.index);$("hint").onclick=useHint;$("detonate").onclick=detonate;$("resultNext").onclick=()=>{$("result").hidden=true;startMission(Math.min(missions.length-1,state.index+1))};
    $("exportSave").onclick=async()=>{const code=encodeSave();try{await navigator.clipboard.writeText(code);setStatus("BOMB2 档案码已复制。") }catch{prompt("BOMB2 档案码",code)}};
    $("importSave").onclick=()=>{const code=prompt("输入 BOMB2 档案码");if(!code)return;try{save=decodeSave(code);persist();startMission(0);setStatus("档案导入完成。") }catch(error){setStatus(error.message)}};
    addEventListener("keydown",event=>{if(event.code==="Digit1")selectedType="pulse";else if(event.code==="Digit2")selectedType="lance";else if(event.code==="Digit3")selectedType="nova";else if(event.code==="Enter"&&!$("detonate").disabled)detonate();else return;renderControls()});
    window.__bombGridTest={validateContent,simulateMission,simulateReference:index=>simulateMission(missions[index],missions[index].ref),getState:()=>JSON.parse(JSON.stringify(state)),missions};
    validateContent();startMission(0);
  })();
  </script>
