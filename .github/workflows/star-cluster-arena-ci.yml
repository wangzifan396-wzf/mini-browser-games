name: Star Cluster Arena checks

on:
  push:
    branches: [main]
    paths: ['star-cluster-arena/**', '.github/workflows/star-cluster-arena-ci.yml']
  pull_request:
    paths: ['star-cluster-arena/**', '.github/workflows/star-cluster-arena-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sca-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-and-network:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: star-cluster-arena
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install production dependencies without lifecycle scripts
        run: npm ci --omit=dev --ignore-scripts --registry=https://registry.npmjs.org
      - name: Check source and local resources
        run: npm run check
      - name: Test shared rules, saves and real HTTP / WebSocket connections
        run: npm test
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --registry=https://registry.npmjs.org
