<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#253640">
  <title>星环合成：十二座引力实验室</title>
  <style>
    :root{--ink:#25343a;--muted:#68777c;--paper:#fff;--line:#b7c3c5;--deep:#253640;--teal:#287a78;--blue:#3c6f91;--gold:#bb812f;--red:#b94f58;--green:#438268;--radius:8px;--shadow:0 12px 30px rgba(37,52,58,.14)}
    *{box-sizing:border-box;letter-spacing:0}html,body{margin:0;min-height:100%;color:var(--ink);background:#e7eceb;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}button{font:inherit}.app{width:min(1190px,calc(100vw - 24px));margin:auto;padding:16px 0 30px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:17px 20px;border-bottom:4px solid #d5a447;color:#fff;background:var(--deep)}h1{margin:0;font-size:28px}.sub{margin:5px 0 0;color:#ccdadb;font-size:13px}.totals{display:flex;gap:18px;text-align:right}.totals b{display:block;color:#f0ca72;font-size:20px}.totals span{color:#c5d3d4;font-size:10px}.contracts{display:grid;grid-template-columns:repeat(12,minmax(42px,1fr));gap:5px;padding:11px 0}.contract{height:46px;border:1px solid #aab7b9;border-radius:6px;color:#405259;background:#f7f9f8;font-weight:900;cursor:pointer}.contract.active{border-color:var(--teal);color:#fff;background:var(--teal)}.contract:disabled{opacity:.42}.contract small{display:block;height:11px;color:#f2cc74;font-size:9px}.layout{display:grid;grid-template-columns:minmax(430px,760px) 330px;gap:14px;align-items:start}.lab{display:grid;grid-template-columns:minmax(340px,600px) minmax(150px,1fr);gap:12px;padding:12px;border:1px solid #8ea0a3;border-radius:var(--radius);background:#17242a;box-shadow:var(--shadow)}.chamber{position:relative;display:grid;place-items:center;min-width:0}.chamber canvas{display:block;width:min(100%,600px);height:auto;aspect-ratio:1;border:1px solid #5b7279;border-radius:6px;background:#0d181d;touch-action:none}.chamber-hud{position:absolute;inset:8px 8px auto;display:flex;justify-content:space-between;gap:6px;pointer-events:none}.chamber-hud span{padding:5px 7px;border:1px solid rgba(255,255,255,.2);border-radius:5px;color:#dbe8e9;background:rgba(23,36,42,.88);font-size:10px}.lab-info{display:flex;flex-direction:column;gap:9px;min-width:0;color:#e8eff0}.lab-info h2{margin:0;color:#fff;font-size:19px}.brief{margin:0;color:#b7c6c8;font-size:12px;line-height:1.55}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px}.metric{padding:8px;border:1px solid #50666d;border-radius:6px;background:#202f35}.metric b{display:block;color:#67d0c8;font-size:18px}.metric span{color:#aababc;font-size:9px}.queue{display:flex;flex-wrap:wrap;gap:5px;min-height:36px}.core-chip{display:grid;place-items:center;width:34px;height:34px;border:1px solid #6b7c81;border-radius:50%;color:#15262d;font-size:11px;font-weight:900}.dock-list{display:grid;gap:5px}.dock-item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 7px;border:1px solid #4b6168;border-radius:5px;color:#c7d5d6;background:#202f35;font-size:10px}.dock-item.done{border-color:#4c806e;color:#82d6b9}.lab-status{min-height:64px;margin:0;padding:9px;border-left:4px solid var(--gold);color:#cfdbdc;background:#202f35;font-size:11px;line-height:1.55}.side{display:flex;flex-direction:column;gap:10px}.panel{padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}.panel h3{margin:0 0 9px;font-size:14px}.rigs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.rig{min-height:63px;padding:6px;border:1px solid #a9b7b9;border-radius:6px;color:#405259;background:#f0f4f3;font-size:9px;font-weight:900;cursor:pointer}.rig b{display:block;font-size:12px}.rig.active{border-color:var(--blue);color:#fff;background:var(--blue)}.commands,.archive{display:grid;grid-template-columns:1fr 1fr;gap:6px}.commands button,.archive button{min-height:40px;border:1px solid #9daeb1;border-radius:6px;color:#34494f;background:#edf2f1;font-weight:900;cursor:pointer}.commands .primary{grid-column:1/-1;border-color:var(--teal);color:#fff;background:var(--teal)}.commands .wide{grid-column:1/-1}.commands button:disabled{opacity:.45;cursor:not-allowed}.aim-control{display:grid;grid-template-columns:40px 1fr 40px;gap:6px;margin:8px 0}.aim-control button{min-height:40px;border:1px solid #9daeb1;border-radius:6px;color:#34494f;background:#edf2f1;font-size:18px;font-weight:900}.aim-control input{width:100%;accent-color:var(--teal)}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:14px;background:rgba(13,24,29,.9);text-align:center}.overlay[hidden]{display:none}.overlay-card{width:min(360px,100%);padding:22px;border-radius:var(--radius);color:#fff;background:#2a3c43;box-shadow:0 24px 60px rgba(0,0,0,.45)}.overlay-card h2{margin:0;font-size:24px}.overlay-card p{color:#d0ddde;line-height:1.6}.overlay-stars{color:#efc667;font-size:34px}.overlay-card button{min-height:42px;padding:0 20px;border:0;border-radius:6px;color:#29373c;background:#efc667;font-weight:900;cursor:pointer}
    @media(max-width:960px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.side .panel:first-child{grid-column:1/-1}}
    @media(max-width:690px){.app{width:calc(100vw - 12px);padding-top:6px}.head{display:block;padding:13px}.head h1{font-size:22px}.sub{font-size:11px}.totals{justify-content:space-between;margin-top:11px;text-align:left}.contracts{grid-template-columns:repeat(6,1fr)}.contract{height:39px}.lab{grid-template-columns:minmax(0,1fr);padding:7px}.chamber canvas{width:min(100%,500px)}.lab-info{padding:4px}.side{display:flex}.panel{padding:10px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="head"><div><h1>星环合成：十二座引力实验室</h1><p class="sub">在固定来料与差异引力场中完成定向融合，把指定等级的天体送入左、中、右轨道带。</p></div><div class="totals"><div><b id="starTotal">0 / 36</b><span>实验星章</span></div><div><b id="clearTotal">0 / 12</b><span>通过合同</span></div><div><b id="cleanTotal">0 / 12</b><span>零回溯</span></div></div></header>
    <nav class="contracts" id="contracts" aria-label="引力合同"></nav>
    <section class="layout">
      <section class="lab">
        <div class="chamber"><canvas id="chamber" width="640" height="640" aria-label="引力合成舱"></canvas><div class="chamber-hud"><span>场型 <b id="fieldName">稳态场</b></span><span>分数 <b id="score">0</b></span></div><div class="overlay" id="overlay"><div class="overlay-card"><h2 id="overlayTitle"></h2><p id="overlayText"></p><div class="overlay-stars" id="overlayStars"></div><button id="overlayButton">开始</button></div></div></div>
        <div class="lab-info"><h2 id="contractTitle"></h2><p class="brief" id="contractBrief"></p><div class="metrics"><div class="metric"><b id="dockCount">0 / 0</b><span>轨道交付</span></div><div class="metric"><b id="mergeCount">0</b><span>融合次数</span></div><div class="metric"><b id="pulseCount">0</b><span>牵引使用</span></div><div class="metric"><b id="coreCount">0 / 0</b><span>已投来料</span></div></div><div><p class="brief">固定来料</p><div class="queue" id="queue"></div></div><div><p class="brief">轨道目标</p><div class="dock-list" id="dockList"></div></div><p class="lab-status" id="status"></p></div>
      </section>
      <aside class="side">
        <section class="panel"><h3>选择观测艇</h3><div class="rigs"><button class="rig" data-rig="survey"><b>测轨艇</b>完整落点预报</button><button class="rig" data-rig="tug"><b>牵引艇</b>四次横向修正</button><button class="rig" data-rig="salvage"><b>回收艇</b>两次投放回溯</button></div></section>
        <section class="panel"><div class="commands"><button class="primary" id="start">启动实验</button><button id="pulseLeft" title="向左牵引">← 牵引</button><button id="pulseRight" title="向右牵引">牵引 →</button><button id="rewind" class="wide">回溯</button><button id="restart">重开</button><button id="pause">暂停</button></div><div class="aim-control"><button id="aimLeft" title="投放点左移">←</button><input id="aim" type="range" min="10" max="90" value="50" aria-label="投放位置"><button id="aimRight" title="投放点右移">→</button></div><div class="commands"><button class="primary" id="drop">投放</button></div></section>
        <section class="panel"><div class="archive"><button id="exportSave">导出档案</button><button id="importSave">导入档案</button></div></section>
      </aside>
    </section>
  </main>
  <script>
  (()=>{
    "use strict";
    const SAVE_KEY="merge_orbit_v2",TAU=Math.PI*2,zoneNames={left:"左环",center:"中环",right:"右环"},zoneCenters={left:.24,center:.5,right:.76},zoneBounds={left:[.1,.365],center:[.37,.63],right:[.635,.9]},coreColors=["#8dd8d0","#70aeda","#d8b55d","#c47c72","#9a86c7","#68a878"];
    const fields={calm:{name:"稳态场",mode:"calm",strength:0},east:{name:"东向潮",mode:"drift",strength:.09},west:{name:"西向潮",mode:"drift",strength:-.09},well:{name:"中央井",mode:"well",strength:.42},twin:{name:"双星井",mode:"twin",strength:.5},shear:{name:"剪切波",mode:"shear",strength:.075},east2:{name:"强东潮",mode:"drift",strength:.14},west2:{name:"强西潮",mode:"drift",strength:-.14},well2:{name:"深中央井",mode:"well",strength:.5},twin2:{name:"强双星井",mode:"twin",strength:.76},shear2:{name:"强剪切波",mode:"shear",strength:.12},crown:{name:"冠冕复合场",mode:"crown",strength:.12}};
    function contract(title,brief,field,docks,order,pulsePar=0){return{title,brief,field,docks:docks.map(([level,zone])=>({level,zone})),order,pulsePar,limit:150}}
    const contracts=[
      contract("静海校准","低阶双核先在中环融合，再把第二枚成品送入左环。",fields.calm,[[2,"center"],[2,"left"]],[0,0,1,1]),
      contract("东潮折返","东向引力会持续推移来料，投放点需要提前留出漂移距离。",fields.east,[[2,"right"],[3,"left"]],[0,1,0,1]),
      contract("西潮换轨","两种尺寸交错进入舱室，在相反方向的潮流中分别归位。",fields.west,[[3,"right"],[2,"center"]],[0,1,1,0]),
      contract("中央坠井","中央引力会拉弯两侧轨迹，同级双核必须在落地前会合。",fields.well,[[3,"center"],[3,"left"]],[0,1,0,1]),
      contract("双星分舱","双引力井把天体拉向左右两翼，三份目标需要并行暂存。",fields.twin,[[2,"left"],[2,"right"],[3,"center"]],[0,1,2,0,1,2]),
      contract("剪切读数","横向剪切会随高度反向，观察完整轨迹后再做小幅牵引。",fields.shear,[[3,"right"],[4,"left"],[2,"center"]],[0,1,2,1,0,2],1),
      contract("东潮增压","更强东潮放大初始偏差，三种尺寸必须各守一条轨道带。",fields.east2,[[4,"center"],[3,"right"],[2,"left"]],[0,1,2,1,0,2],1),
      contract("西潮回卷","右环的大型来料与左环中型来料交错，中央目标最后闭合。",fields.west2,[[4,"right"],[3,"left"],[3,"center"]],[0,1,2,0,2,1],1),
      contract("深井套层","深中央井会收束远端投放，需利用外侧起点守住左右交付带。",fields.well2,[[4,"center"],[4,"left"],[2,"right"]],[0,1,2,1,0,2],1),
      contract("双井并轨","四份交付同时占用三条轨道，来料尺寸与暂存位置都要区分。",fields.twin2,[[3,"left"],[3,"right"],[4,"center"],[2,"center"]],[0,1,2,2,0,1,3,3],2),
      contract("剪切交响","强剪切场让相邻尺寸产生不同落点，牵引应留给最后修正。",fields.shear2,[[4,"right"],[4,"left"],[3,"center"],[2,"right"]],[0,1,2,1,0,2,3,3],2),
      contract("冠冕会合","复合场同时施加东潮与中央回拉，完成四枚高阶冠冕交付。",fields.crown,[[5,"center"],[4,"left"],[4,"right"],[3,"center"]],[0,1,2,1,2,0,3,3],2)
    ];
    for(const item of contracts){item.sequence=item.order.map(index=>item.docks[index].level-1);item.reference=item.order.map(index=>referencePoint(item.docks[index].zone,item.field))}
    const $=id=>document.getElementById(id),canvas=$("chamber"),ctx=canvas.getContext("2d"),overlay=$("overlay"),contractEl=$("contracts"),aimInput=$("aim");let profile=load(),selected=0,rig=profile.rig||"survey",q=null,last=0,raf=0,nextId=1;
    function defaults(){return{version:2,stars:{},best:{},clean:{},rig:"survey",updatedAt:Date.now()}}
    function normalize(value){const clean=defaults();if(!value||value.version!==2)return clean;for(let i=0;i<contracts.length;i++){clean.stars[i]=Math.max(0,Math.min(3,Number(value.stars?.[i])||0));if(Number.isFinite(Number(value.best?.[i])))clean.best[i]=Math.max(0,Number(value.best[i]));clean.clean[i]=Boolean(value.clean?.[i])}if(["survey","tug","salvage"].includes(value.rig))clean.rig=value.rig;return clean}
    function load(){try{return normalize(JSON.parse(localStorage.getItem(SAVE_KEY)))}catch{return defaults()}}
    function save(){profile.rig=rig;profile.updatedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(profile));renderCampaign()}
    function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
    function encodeProfile(){const body=btoa(unescape(encodeURIComponent(JSON.stringify(profile))));return`ORBIT2.${body}.${checksum(body)}`}
    function decodeProfile(code){const part=code.trim().split(".");if(part.length!==3||part[0]!=="ORBIT2"||checksum(part[1])!==part[2])throw Error("星环档案校验失败");return normalize(JSON.parse(decodeURIComponent(escape(atob(part[1])))))}
    function radius(level){return .032+level*.0085}
    function referencePoint(zone,field){let x=zoneCenters[zone];if(field.mode==="drift")x-=Math.sign(field.strength)*Math.min(.13,Math.abs(field.strength)*.78);if(field.mode==="well"&&zone!=="center"){const offset=.055+Math.max(0,field.strength-.42)*.36;x+=zone==="left"?-offset:offset}if(field.mode==="twin"&&zone==="center")x=.5;if(field.mode==="crown")x=zone==="left"?.11:zone==="right"?.74:.41;return Math.max(.11,Math.min(.89,x))}
    function rigBudget(){return rig==="survey"?{pulses:2,rewinds:1}:rig==="tug"?{pulses:4,rewinds:1}:{pulses:2,rewinds:2}}
    function cloneBalls(balls){return balls.map(ball=>({...ball}))}
    function makeState(index=selected,simulation=false){const budget=rigBudget(),item=contracts[index];return{index,contract:item,simulation,balls:[],cursor:0,docksDone:item.docks.map(()=>false),aim:.5,ready:true,run:false,paused:false,ended:false,won:false,overflow:false,elapsed:0,score:0,merges:0,shipped:0,pulses:budget.pulses,pulseUsed:0,rewinds:budget.rewinds,rewindsUsed:0,activeId:0,settleClock:0,snapshot:null,message:"等待投放固定来料。"}}
    function fieldForce(state,ball){const field=state.contract.field;if(field.mode==="drift")return field.strength;if(field.mode==="well")return(.5-ball.x)*field.strength;if(field.mode==="twin"){if(Math.abs(ball.x-.5)<.085)return(.5-ball.x)*.16;const well=ball.x<.5?.255:.745;return(well-ball.x)*field.strength}if(field.mode==="shear")return Math.sin(ball.y*3.2*Math.PI)*field.strength;if(field.mode==="crown")return field.strength*.5+(.5-ball.x)*.34+Math.sin(ball.y*TAU)*.035;return 0}
    function captureSnapshot(state){state.snapshot={balls:cloneBalls(state.balls),cursor:state.cursor,docksDone:state.docksDone.slice(),score:state.score,merges:state.merges,shipped:state.shipped}}
    function dropAt(state,x=state.aim){if(!state.run||state.paused||state.ended||!state.ready||state.cursor>=state.contract.sequence.length)return false;captureSnapshot(state);const level=state.contract.sequence[state.cursor++];const ball={id:nextId++,x:Math.max(.08+radius(level),Math.min(.92-radius(level),x)),y:.085,vx:0,vy:0,level,age:0,rest:0,anchored:false,supported:false};state.balls.push(ball);state.activeId=ball.id;state.ready=false;state.settleClock=0;state.message=`${level} 级来料已进入 ${Math.round(ball.x*100)} 号投放位。`;return true}
    function mergePair(state,a,b){const level=a.level+1,ball={id:nextId++,x:(a.x+b.x)/2,y:(a.y+b.y)/2,vx:(a.vx+b.vx)/2,vy:Math.min(-.035,(a.vy+b.vy)/2),level,age:0,rest:0,anchored:false,supported:false};state.balls=state.balls.filter(item=>item!==a&&item!==b);state.balls.push(ball);state.activeId=ball.id;state.merges++;state.score+=level*120;state.message=`融合完成：生成 ${level} 级天体。`;return ball}
    function resolvePhysics(state,dt){for(const ball of state.balls){ball.supported=false;if(ball.anchored)continue;ball.age+=dt;ball.vy+=1.05*dt;ball.vx+=fieldForce(state,ball)*dt;ball.vx*=Math.pow(.995,dt*60);ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const r=radius(ball.level);if(ball.x-r<.055){ball.x=.055+r;ball.vx=Math.abs(ball.vx)*.3}if(ball.x+r>.945){ball.x=.945-r;ball.vx=-Math.abs(ball.vx)*.3}if(ball.y+r>.965){ball.y=.965-r;ball.vy=-Math.abs(ball.vy)*.18;ball.vx*=.76;ball.supported=true}}
      let merged=true,guard=0;while(merged&&guard++<12){merged=false;outer:for(let i=0;i<state.balls.length;i++)for(let j=i+1;j<state.balls.length;j++){const a=state.balls[i],b=state.balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.0001,min=radius(a.level)+radius(b.level);if(d>=min)continue;if(a.level===b.level&&a.age>.04&&b.age>.04){mergePair(state,a,b);merged=true;break outer}const nx=dx/d,ny=dy/d,overlap=min-d,invA=a.anchored?0:1,invB=b.anchored?0:1,total=invA+invB||1;if(invA){a.x-=nx*overlap*invA/total;a.y-=ny*overlap*invA/total}if(invB){b.x+=nx*overlap*invB/total;b.y+=ny*overlap*invB/total}const relative=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(relative<0&&total){const impulse=-(1.18)*relative/total;if(invA){a.vx-=impulse*nx;a.vy-=impulse*ny}if(invB){b.vx+=impulse*nx;b.vy+=impulse*ny}}if(Math.abs(ny)>.55){if(a.y<b.y)a.supported=true;else b.supported=true}}}
      for(const ball of state.balls){if(ball.anchored)continue;const slow=Math.hypot(ball.vx,ball.vy)<.035;if(ball.supported&&slow)ball.rest+=dt;else ball.rest=0;if(ball.rest>.22){ball.anchored=true;ball.vx=0;ball.vy=0}}
    }
    function certifyDocks(state){let changed=false;for(let i=0;i<state.contract.docks.length;i++){if(state.docksDone[i])continue;const dock=state.contract.docks[i],bounds=zoneBounds[dock.zone],candidates=state.balls.filter(ball=>ball.anchored&&ball.level===dock.level&&ball.x>=bounds[0]&&ball.x<=bounds[1]);if(!candidates.length)continue;candidates.sort((a,b)=>Math.abs(a.x-zoneCenters[dock.zone])-Math.abs(b.x-zoneCenters[dock.zone]));const ball=candidates[0];state.balls=state.balls.filter(item=>item!==ball);state.docksDone[i]=true;state.shipped++;state.score+=dock.level*250;state.message=`${dock.level} 级天体已交付 ${zoneNames[dock.zone]}。`;changed=true}return changed}
    function settleState(state,dt){if(state.ready||state.ended)return;const moving=state.balls.some(ball=>!ball.anchored);if(moving){state.settleClock=0;return}state.settleClock+=dt;if(state.settleClock<.06)return;state.activeId=0;state.ready=true;certifyDocks(state);if(state.docksDone.every(Boolean)){state.won=true;state.ended=true;state.run=false;return}const redline=state.balls.some(ball=>ball.y-radius(ball.level)<.18);if(redline){state.overflow=true;state.ended=true;state.run=false;state.message="未交付天体越过警戒线。";return}if(state.cursor>=state.contract.sequence.length){state.ended=true;state.run=false;state.message="固定来料已用尽，仍有轨道目标未完成。"}}
    function stepState(state,dt){if(!state.run||state.paused||state.ended)return;state.elapsed+=dt;if(state.elapsed>=state.contract.limit){state.ended=true;state.run=false;state.message="实验时间窗已经关闭。";return}const steps=Math.max(1,Math.ceil(dt/(1/120))),unit=dt/steps;for(let i=0;i<steps;i++){resolvePhysics(state,unit);settleState(state,unit);if(state.ended)break}}
    function pulseState(state,direction){if(!state.run||state.paused||state.ended||state.ready||state.pulses<=0)return false;const ball=state.balls.find(item=>item.id===state.activeId&&!item.anchored);if(!ball)return false;ball.vx+=direction*.2;ball.anchored=false;ball.rest=0;state.pulses--;state.pulseUsed++;state.message=direction<0?"牵引脉冲向左修正当前天体。":"牵引脉冲向右修正当前天体。";return true}
    function rewindState(state){if(!state.run||state.paused||state.ended||!state.snapshot||state.rewinds<=0)return false;const keepElapsed=state.elapsed,used=state.rewindsUsed+1,left=state.rewinds-1,snapshot=state.snapshot;state.balls=cloneBalls(snapshot.balls);state.cursor=snapshot.cursor;state.docksDone=snapshot.docksDone.slice();state.score=snapshot.score;state.merges=snapshot.merges;state.shipped=snapshot.shipped;state.elapsed=keepElapsed;state.rewinds=left;state.rewindsUsed=used;state.activeId=0;state.ready=true;state.settleClock=0;state.snapshot=null;state.message="已回溯到上一次投放前。";return true}
    function runUntilReady(state,maxSteps=3600){for(let i=0;i<maxSteps&&!state.ready&&!state.ended;i++)stepState(state,1/120);return state.ready||state.ended}
    function simulateReference(index){const state=makeState(index,true);state.run=true;for(const x of state.contract.reference){if(state.ended)break;if(!dropAt(state,x))break;runUntilReady(state)}return{won:state.won,shipped:state.shipped,merges:state.merges,pulses:state.pulseUsed,rewinds:state.rewindsUsed,overflow:state.overflow,balls:state.balls.length,cursor:state.cursor}}
    function validateContent(){if(contracts.length!==12)throw Error("引力合同数量错误");let cores=0,docks=0,referenceWins=0;const signatures=new Set(),fieldNames=new Set();for(let i=0;i<contracts.length;i++){const item=contracts[i],signature=`${item.field.name}|${item.docks.map(d=>`${d.level}:${d.zone}`).join(",")}|${item.order.join("")}`;if(signatures.has(signature))throw Error(`第 ${i+1} 份合同重复`);signatures.add(signature);fieldNames.add(item.field.name);if(item.order.length!==item.sequence.length||item.reference.length!==item.sequence.length)throw Error(`第 ${i+1} 份来料计划缺失`);if(item.order.some(index=>index<0||index>=item.docks.length))throw Error(`第 ${i+1} 份目标索引越界`);cores+=item.sequence.length;docks+=item.docks.length;const result=simulateReference(i);if(!result.won||result.shipped!==item.docks.length||result.pulses||result.rewinds||result.overflow)throw Error(`第 ${i+1} 份参考航线未通过：${JSON.stringify(result)}`);referenceWins++}return{contracts:12,rigs:3,fields:fieldNames.size,cores,docks,referenceWins,uniqueContracts:signatures.size}}
    function unlocked(index){return index===0||Number(profile.stars[index-1])>0}
    function begin(index=selected){if(!unlocked(index))return;selected=index;q=makeState(index);renderAll();showOverlay("合同简报",`${q.contract.title}：${q.contract.sequence.length} 枚固定来料，完成 ${q.contract.docks.length} 项轨道交付。`,"","进入舱室",()=>{q.run=true;hideOverlay();setStatus("调整顶部投放位，让同级天体在指定轨道带内完成融合。")})}
    function finalize(){if(!q?.ended)return;if(q.won){const stars=1+(q.rewindsUsed===0?1:0)+(q.rewindsUsed===0&&q.pulseUsed<=q.contract.pulsePar?1:0);profile.stars[q.index]=Math.max(Number(profile.stars[q.index])||0,stars);profile.best[q.index]=Math.max(Number(profile.best[q.index])||0,q.score);profile.clean[q.index]=profile.clean[q.index]||q.rewindsUsed===0;save();renderAll();showOverlay("轨道验收通过",`交付 ${q.shipped} 项，融合 ${q.merges} 次，牵引 ${q.pulseUsed} 次。`,"★".repeat(stars)+"☆".repeat(3-stars),q.index<11?"下一座实验室":"返回合同簿",()=>{const next=q.index<11?q.index+1:q.index;selected=next;begin(next)})}else showOverlay("实验中止",q.message,"","重新校准",()=>begin(q.index))}
    function perform(action){if(!q)return;const before=q.ended;if(action==="drop")dropAt(q);if(action==="left")pulseState(q,-1);if(action==="right")pulseState(q,1);if(action==="rewind")rewindState(q);renderAll();if(!before&&q.ended)finalize()}
    function setStatus(text){if(q)q.message=text;$("status").textContent=text}
    function showOverlay(title,text,stars,label,handler){$("overlayTitle").textContent=title;$("overlayText").textContent=text;$("overlayStars").textContent=stars;$("overlayButton").textContent=label;$("overlayButton").onclick=handler;overlay.hidden=false}
    function hideOverlay(){overlay.hidden=true}
    function renderCampaign(){contractEl.innerHTML=contracts.map((item,index)=>`<button class="contract ${index===selected?"active":""}" data-index="${index}" ${unlocked(index)?"":"disabled"}>${String(index+1).padStart(2,"0")}<small>${"★".repeat(Number(profile.stars[index])||0)}</small></button>`).join("");$("starTotal").textContent=`${Object.values(profile.stars).reduce((a,b)=>a+Number(b||0),0)} / 36`;$("clearTotal").textContent=`${Object.values(profile.stars).filter(Boolean).length} / 12`;$("cleanTotal").textContent=`${Object.values(profile.clean).filter(Boolean).length} / 12`;document.querySelectorAll(".rig").forEach(button=>button.classList.toggle("active",button.dataset.rig===rig))}
    function renderInfo(){if(!q)return;const item=q.contract;$("contractTitle").textContent=`${String(q.index+1).padStart(2,"0")} · ${item.title}`;$("contractBrief").textContent=item.brief;$("fieldName").textContent=item.field.name;$("score").textContent=q.score;$("dockCount").textContent=`${q.shipped} / ${item.docks.length}`;$("mergeCount").textContent=q.merges;$("pulseCount").textContent=`${q.pulseUsed} / ${q.pulseUsed+q.pulses}`;$("coreCount").textContent=`${q.cursor} / ${item.sequence.length}`;$("queue").innerHTML=item.sequence.slice(q.cursor,q.cursor+8).map(level=>`<span class="core-chip" style="background:${coreColors[(level-1)%coreColors.length]}">${level}</span>`).join("")||"<span class='brief'>来料已尽</span>";$("dockList").innerHTML=item.docks.map((dock,index)=>`<div class="dock-item ${q.docksDone[index]?"done":""}"><span>${String(index+1).padStart(2,"0")} · ${zoneNames[dock.zone]}</span><b>${dock.level} 级 ${q.docksDone[index]?"已交付":"待融合"}</b></div>`).join("");$("status").textContent=q.message;$("rewind").textContent=`回溯 ${q.rewinds}`;$("pulseLeft").disabled=$("pulseRight").disabled=q.ready||q.pulses<=0;$("rewind").disabled=!q.snapshot||q.rewinds<=0;$("drop").disabled=!q.ready||q.cursor>=item.sequence.length;aimInput.value=Math.round(q.aim*100)}
    function drawField(state){const field=state.contract.field;ctx.strokeStyle="rgba(119,180,186,.18)";ctx.lineWidth=1;for(let i=1;i<8;i++){ctx.beginPath();ctx.moveTo(i*80,46);ctx.lineTo(i*80,620);ctx.stroke()}for(let i=1;i<8;i++){ctx.beginPath();ctx.moveTo(36,i*76);ctx.lineTo(604,i*76);ctx.stroke()}ctx.fillStyle="rgba(102,205,198,.22)";if(field.mode==="well"||field.mode==="crown"){for(const r of [38,72,108]){ctx.beginPath();ctx.arc(320,360,r,0,TAU);ctx.fill()}}if(field.mode==="twin"){for(const cx of [164,476]){ctx.beginPath();ctx.arc(cx,380,58,0,TAU);ctx.fill()}}ctx.strokeStyle="rgba(228,180,82,.55)";ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(36,115);ctx.lineTo(604,115);ctx.stroke();ctx.setLineDash([])}
    function drawDocks(state){for(const [zone,bounds] of Object.entries(zoneBounds)){const pending=state.contract.docks.filter((dock,index)=>dock.zone===zone&&!state.docksDone[index]);ctx.fillStyle=pending.length?"rgba(60,126,126,.16)":"rgba(67,130,104,.08)";ctx.fillRect(bounds[0]*640,520,(bounds[1]-bounds[0])*640,98);ctx.strokeStyle=pending.length?"rgba(106,207,198,.55)":"rgba(100,150,130,.25)";ctx.strokeRect(bounds[0]*640+2,522,(bounds[1]-bounds[0])*640-4,94);ctx.fillStyle="#b9d4d4";ctx.font="700 11px system-ui";ctx.textAlign="center";ctx.fillText(`${zoneNames[zone]} ${pending.map(d=>d.level).join("/")||"完成"}`,zoneCenters[zone]*640,610)}}
    function drawBall(ball){const r=radius(ball.level)*640,g=ctx.createRadialGradient(ball.x*640-r*.3,ball.y*640-r*.35,r*.12,ball.x*640,ball.y*640,r);g.addColorStop(0,"#f8f6df");g.addColorStop(.28,coreColors[(ball.level-1)%coreColors.length]);g.addColorStop(1,"#263b46");ctx.fillStyle=g;ctx.beginPath();ctx.arc(ball.x*640,ball.y*640,r,0,TAU);ctx.fill();ctx.strokeStyle="rgba(255,255,255,.52)";ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#13252b";ctx.font=`900 ${Math.max(12,r*.55)}px system-ui`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(ball.level,ball.x*640,ball.y*640)}
    function drawPrediction(state){const level=state.contract.sequence[state.cursor]||1,r=radius(level),preview=rig==="survey"?52:16;let x=state.aim,y=.085,vx=0,vy=0;ctx.fillStyle=rig==="survey"?"rgba(239,201,103,.68)":"rgba(239,201,103,.35)";for(let i=0;i<preview;i++){const fake={x,y},dt=.035;vy+=1.05*dt;vx+=fieldForce(state,fake)*dt;x+=vx*dt;y+=vy*dt;if(i%4===0){ctx.beginPath();ctx.arc(x*640,y*640,2.4,0,TAU);ctx.fill()}if(y+r>.965)break}}
    function draw(){if(!q)return;ctx.fillStyle="#0d181d";ctx.fillRect(0,0,640,640);drawField(q);drawDocks(q);for(const ball of q.balls)drawBall(ball);if(q.ready&&!q.ended&&q.cursor<q.contract.sequence.length)drawPrediction(q);const next=q.contract.sequence[q.cursor];if(next){ctx.strokeStyle="#f1cc72";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(q.aim*640,44);ctx.lineTo(q.aim*640,76);ctx.stroke();ctx.fillStyle=coreColors[(next-1)%coreColors.length];ctx.beginPath();ctx.arc(q.aim*640,40,Math.max(9,radius(next)*360),0,TAU);ctx.fill();ctx.fillStyle="#15272d";ctx.font="900 11px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(next,q.aim*640,40)}}
    function renderAll(){renderCampaign();renderInfo();draw()}
    function loop(time){const dt=Math.min(.05,(time-last)/1000||0);last=time;if(q){const before=q.ended;stepState(q,dt);renderInfo();draw();if(!before&&q.ended)finalize()}raf=requestAnimationFrame(loop)}
    contractEl.addEventListener("click",event=>{const button=event.target.closest("[data-index]");if(button){selected=Number(button.dataset.index);begin(selected)}});document.querySelectorAll(".rig").forEach(button=>button.addEventListener("click",()=>{if(q?.run)return;rig=button.dataset.rig;save();q=makeState(selected);renderAll()}));
    function setAim(value){if(!q)return;q.aim=Math.max(.1,Math.min(.9,value));renderAll()}aimInput.addEventListener("input",()=>setAim(Number(aimInput.value)/100));$("aimLeft").onclick=()=>setAim((q?.aim||.5)-.04);$("aimRight").onclick=()=>setAim((q?.aim||.5)+.04);canvas.addEventListener("pointermove",event=>{if(!q?.ready)return;const rect=canvas.getBoundingClientRect();setAim((event.clientX-rect.left)/rect.width)});canvas.addEventListener("pointerdown",event=>{event.preventDefault();if(q?.ready)perform("drop")});
    addEventListener("keydown",event=>{if(["ArrowLeft","KeyA"].includes(event.code)){event.preventDefault();setAim((q?.aim||.5)-.035)}if(["ArrowRight","KeyD"].includes(event.code)){event.preventDefault();setAim((q?.aim||.5)+.035)}if(event.code==="Space"){event.preventDefault();perform("drop")}if(event.code==="KeyQ")perform("left");if(event.code==="KeyE")perform("right");if(event.code==="KeyZ")perform("rewind");if(event.code==="KeyP")$("pause").click()});
    $("start").onclick=()=>begin(selected);$("drop").onclick=()=>perform("drop");$("pulseLeft").onclick=()=>perform("left");$("pulseRight").onclick=()=>perform("right");$("rewind").onclick=()=>perform("rewind");$("restart").onclick=()=>begin(q?.index??selected);$("pause").onclick=()=>{if(!q||q.ended)return;q.paused=!q.paused;$("pause").textContent=q.paused?"继续":"暂停";setStatus(q.paused?"实验已暂停。":"实验继续运行。")} ;
    $("exportSave").onclick=async()=>{const code=encodeProfile();try{await navigator.clipboard.writeText(code);setStatus("星环档案已复制。") }catch{prompt("复制星环档案",code)}};$("importSave").onclick=()=>{const code=prompt("粘贴 ORBIT2 星环档案");if(!code)return;try{profile=decodeProfile(code);rig=profile.rig;save();setStatus("星环档案已导入。");begin(selected)}catch(error){setStatus(error.message)}};
    q=makeState(0);renderAll();showOverlay("引力舱待机","选择观测艇与实验合同。每份来料序列固定，轨迹变化只由投放位置、引力场和牵引输入决定。","","查看合同",()=>begin(selected));raf=requestAnimationFrame(loop);
    window.__mergeOrbitTest={contracts,fields,makeState,dropAt,stepState,runUntilReady,simulateReference,validateContent,begin,getState:()=>q,getProfile:()=>profile,encodeProfile,decodeProfile,perform,setAim,forceFinish(){if(!q)return;q.docksDone=q.docksDone.map(()=>true);q.shipped=q.contract.docks.length;q.rewindsUsed=0;q.pulseUsed=0;q.ended=true;q.run=false;q.won=true;finalize()}};
  })();
  </script>
