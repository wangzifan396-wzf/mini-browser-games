ile.unlocked=Math.max(profile.unlocked,Math.min(12,q.voyage+2));profile.clears++;save();$("infoTitle").textContent=`重心验舱完成 · ${item.n}`;$("infoBody").innerHTML=`<div class="result"><strong>${"★".repeat(r.stars)}${"☆".repeat(3-r.stars)}</strong><ul><li>十件货物：承重、冷藏、加固、快卸与隔离全部合格</li><li>横向 / 纵向重心矩：${r.mx} / ${r.my}（限制 ±${item.momentLimit}）</li><li>装舱动作：${r.moves} / 大师线 ${item.par}</li><li>装载参考：${q.hints}</li></ul>${q.voyage<11?'<button class="btn primary" id="nextBtn">下一航次</button>':""}</div>`;$("infoOverlay").classList.remove("hidden");if($("nextBtn"))$("nextBtn").onclick=()=>start(q.voyage+1);draw();return r}
function cargoTags(c){return[c.cold?"❄️冷链":"",c.heavy?"🛡️重货":"",c.priority?"🚪优先":"",c.hazard?"⚠️危险":"",c.food?"📦补给":""].filter(Boolean)}function drawCanvas(){const item=VOYAGES[q.voyage],r=evaluate(q.voyage,q.placement,q.hints,q.moves);ctx.clearRect(0,0,960,420);ctx.fillStyle="#141b25";ctx.fillRect(0,0,960,420);ctx.fillStyle="#9ba9b8";ctx.font="bold 16px sans-serif";ctx.textAlign="center";ctx.fillText("上层甲板",480,30);ctx.fillText("下层甲板",480,232);item.slots.forEach(slot=>{const x=55+slot.col*178,y=slot.deck<0?55:255,w=150,h=125,cargoId=q.placement.findIndex(value=>value===slot.id);ctx.fillStyle=slot.cold?"#173d55":slot.reinforced?"#3b3544":"#202936";ctx.fillRect(x,y,w,h);ctx.strokeStyle=slot.access?"#ffd16a":"#647487";ctx.lineWidth=slot.access?4:2;ctx.strokeRect(x,y,w,h);ctx.fillStyle="#b8c4ce";ctx.font="13px sans-serif";ctx.textAlign="left";ctx.fillText(`${slot.n} · 容重${slot.cap}`,x+8,y+20);ctx.fillText(`${slot.cold?"❄️":""}${slot.reinforced?"🛡️":""}${slot.access?"🚪":""}`,x+8,y+42);if(cargoId>=0){const cargo=item.cargoes[cargoId];ctx.fillStyle=cargo.hazard?"#ff7d83":cargo.cold?"#75bff0":cargo.heavy?"#ffd16a":"#72d99b";ctx.font="32px serif";ctx.fillText(cargo.i,x+55,y+78);ctx.fillStyle="#f4f2e8";ctx.font="bold 12px sans-serif";ctx.fillText(cargo.n,x+8,y+106);ctx.fillText(`重量 ${cargo.weight}`,x+8,y+121)}});ctx.strokeStyle=r.balance?"#72d99b":"#ff7d83";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(480,190);ctx.lineTo(480+r.mx*12,210+r.my*4);ctx.stroke();ctx.fillStyle=r.balance?"#72d99b":"#ff7d83";ctx.font="bold 14px sans-serif";ctx.textAlign="center";ctx.fillText(`重心矩 X ${r.mx} · Y ${r.my}`,480,208)}
function drawBook(){$("voyages").innerHTML=VOYAGES.map((item,index)=>`<button class="voyage" data-voyage="${index}" ${index>=profile.unlocked?"disabled":""}><span>${["🛰️","🚀","🌌","🪐"][item.chapter]}</span><h3>${index+1}. ${item.n}</h3><p>第 ${item.chapter+1} 章 · 10 件货 / 10 舱位 · 重心限制 ±${item.momentLimit}<br>${item.brief}</p><div class="stars">${"★".repeat(profile.stars[index])}${"☆".repeat(3-profile.stars[index])}</div></button>`).join("");document.querySelectorAll("[data-voyage]").forEach(button=>button.onclick=()=>start(+button.dataset.voyage))}
function draw(){if(!q)return;const item=VOYAGES[q.voyage],r=evaluate(q.voyage,q.placement,q.hints,q.moves),placed=q.placement.filter(Number.isInteger).length;$("voyageStat").textContent=`${q.voyage+1} / 12`;$("placedStat").textContent=`${placed} / 10`;$("issueStat").textContent=(r.complete?0:1)+r.capacity.length+r.zones.length+r.separation.length+(r.balance?0:1);$("moveStat").textContent=`${q.moves} / ${item.par}`;$("starStat").textContent="★".repeat(profile.stars[q.voyage])+"☆".repeat(3-profile.stars[q.voyage]);$("voyageTitle").textContent=`🚀 ${item.n}`;$("voyageBrief").textContent=item.brief;$("chapterLabel").textContent=`第 ${item.chapter+1} 章 · 满载 ${r.totalWeight}`;$("message").textContent=q.message;$("cargoes").innerHTML=item.cargoes.map(cargo=>`<button class="cargo ${cargo.id===q.selected?"selected":""} ${q.placement[cargo.id]!=null?"placed":""}" data-cargo="${cargo.id}"><b>${cargo.i} ${cargo.n}</b><small>重量 ${cargo.weight} · 当前 ${q.placement[cargo.id]!=null?item.slots[q.placement[cargo.id]].n:"待装"}</small><span class="tags">${cargoTags(cargo).map(tag=>`<i class="tag">${tag}</i>`).join("")||'<i class="tag">普通</i>'}</span></button>`).join("");document.querySelectorAll("[data-cargo]").forEach(button=>button.onclick=()=>{q.selected=+button.dataset.cargo;save();draw()});$("slots").innerHTML=item.slots.map(slot=>{const cargoId=q.placement.findIndex(value=>value===slot.id);return`<button class="slot" data-slot="${slot.id}"><b>${slot.n} ${slot.cold?"❄️":""}${slot.reinforced?"🛡️":""}${slot.access?"🚪":""}</b><small>承重 ${slot.cap} · ${cargoId>=0?item.cargoes[cargoId].n:"空舱"}</small></button>`}).join("");document.querySelectorAll("[data-slot]").forEach(button=>button.onclick=()=>place(+button.dataset.slot));$("metrics").innerHTML=`<div class="metric"><span>装舱完成度</span><b>${placed}/10</b><small>每件货物只能占一个舱位</small></div><div class="metric"><span>横向重心矩</span><b>${r.mx}</b><small>验收范围 -${item.momentLimit} 至 +${item.momentLimit}</small></div><div class="metric"><span>纵向重心矩</span><b>${r.my}</b><small>验收范围 -${item.momentLimit} 至 +${item.momentLimit}</small></div>`;const issues=[];if(!r.complete)issues.push(`<div class="issue bad"><b>货物尚未满载</b><br>当前 ${placed}/10 件，且舱位不可重复。</div>`);r.capacity.slice(0,3).forEach(x=>issues.push(`<div class="issue bad"><b>舱位超重</b><br>${item.cargoes[x.cargo].n} 超过 ${item.slots[x.slot].n} 承重。</div>`));r.zones.slice(0,4).forEach(x=>issues.push(`<div class="issue bad"><b>${x.kind}</b><br>${item.cargoes[x.cargo].n}</div>`));if(r.separation.length)issues.push(`<div class="issue bad"><b>隔离距离不足</b><br>危险品与生活补给不得紧邻。</div>`);if(!r.balance)issues.push(`<div class="issue bad"><b>重心矩越界</b><br>当前 X ${r.mx} / Y ${r.my}。</div>`);$("issues").innerHTML=issues.join("")||'<div class="issue"><b>当前规则全部合格</b><br>执行重心验舱即可提交。</div>';drawCanvas();drawBook();save()}
function showArchive(){const code=encode();$("infoTitle").textContent="跨设备配载档案";$("infoBody").innerHTML=`<p class="sub">星级、最佳动作数与当前货舱方案包含在校验档案中。</p><textarea class="savebox" id="saveCode">${code}</textarea><div class="controls"><button class="btn" id="copyBtn">复制导出</button><button class="btn" id="importBtn">导入上方档案</button></div>`;$("infoOverlay").classList.remove("hidden");$("copyBtn").onclick=()=>navigator.clipboard?.writeText($("saveCode").value);$("importBtn").onclick=()=>{try{const d=decode($("saveCode").value);profile=d.profile;q=d.q||fresh(0);save();$("infoOverlay").classList.add("hidden");draw();toast("配载档案导入成功")}catch(error){toast(error.message)}}}
canvas.onpointerdown=event=>{if(!q)return;const rect=canvas.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width*960,y=(event.clientY-rect.top)/rect.height*420,item=VOYAGES[q.voyage],slot=item.slots.find(s=>{const sx=55+s.col*178,sy=s.deck<0?55:255;return x>=sx&&x<=sx+150&&y>=sy&&y<=sy+125});if(slot)place(slot.id)};$("submitBtn").onclick=submit;$("hintBtn").onclick=hint;$("removeBtn").onclick=remove;$("undoBtn").onclick=undo;$("resetBtn").onclick=()=>start(q.voyage);$("archiveBtn").onclick=showArchive;$("bookBtn").onclick=()=>{$("bookOverlay").classList.remove("hidden");drawBook()};$("closeInfoBtn").onclick=()=>$("infoOverlay").classList.add("hidden");load();drawBook();if(q){$("bookOverlay").classList.add("hidden");draw()}window.__orbitalStowage={VOYAGES,evaluate,referenceResult,validateContent,fresh,state:()=>q,profile:()=>profile,start,place,hint,submit,encode,decode};
})();</script></body></html>
