<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#173d4b">
  <title>噪声译码：十二信道</title>
  <style>
    :root{--bg:#e9eff1;--paper:#fff;--ink:#17323c;--muted:#63757c;--line:#bdcbd0;--deep:#173d4b;--cyan:#087d91;--gold:#b77918;--red:#b44742;--green:#35775c;--violet:#655985;--radius:8px;--shadow:0 12px 28px rgba(22,57,70,.12)}
    *{box-sizing:border-box;letter-spacing:0}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg)}button{font:inherit}.app{width:min(1180px,calc(100vw - 24px));margin:auto;padding:18px 0 30px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:18px 20px;border-bottom:4px solid #dfaa3f;color:#fff;background:var(--deep)}h1{margin:0;font-size:28px}.sub{margin:5px 0 0;color:#c7d9df;font-size:13px}.campaign{display:flex;gap:20px;text-align:right}.campaign b{display:block;color:#f3c45d;font-size:20px}.campaign span{color:#b9cdd4;font-size:10px}.missions{display:grid;grid-template-columns:repeat(12,minmax(40px,1fr));gap:5px;padding:12px 0}.mission{height:45px;border:1px solid #9fb1b7;border-radius:6px;color:#38515a;background:#f8fafb;font-weight:900;cursor:pointer}.mission.active{border-color:var(--cyan);color:#fff;background:var(--cyan)}.mission.locked{opacity:.42}.mission small{display:block;height:11px;color:#f3cb68;font-size:9px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px}.workbench{min-width:0;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);box-shadow:var(--shadow)}.brief{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}.brief h2{margin:0;font-size:21px}.brief p{margin:5px 0 0;color:var(--muted);font-size:12px}.goal{flex:0 0 auto;padding:7px 9px;border:1px solid #c79b48;border-radius:6px;color:#714c08;background:#fff4d5;font-size:11px;font-weight:900}.scope{position:relative;overflow:hidden;border-radius:6px;background:#102d37}.scope canvas{display:block;width:100%;aspect-ratio:3/1}.scope-label{position:absolute;top:8px;right:9px;color:#c7e3e8;font-size:9px}.relays{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:10px 0}.relay{min-height:68px;border:1px solid #9eb0b5;border-radius:6px;color:#354e57;background:#edf3f4;cursor:pointer}.relay b{display:block;font-size:18px}.relay span{display:block;margin-top:4px;font-size:10px}.relay.on{border-color:var(--cyan);color:#fff;background:var(--cyan)}.relay.on b{color:#e8d074}.clue-head{display:flex;align-items:center;justify-content:space-between;margin:12px 0 7px}.clue-head h3{margin:0;font-size:14px}.clue-head span{color:var(--muted);font-size:10px}.clues{display:grid;grid-template-columns:1fr 1fr;gap:7px}.clue{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;padding:8px 10px;border:1px solid #c7d1d4;border-radius:6px;color:#37505a;background:#f7f9f9;text-align:left;cursor:pointer}.clue b{font-size:12px}.clue span{flex:0 0 auto;padding:4px 7px;border-radius:4px;color:#fff;background:#58727b;font-size:11px}.clue.suspect{border-color:var(--red);box-shadow:inset 4px 0 var(--red);background:#fff1ef}.clue.suspect span{background:var(--red)}.panel{display:flex;flex-direction:column;gap:10px}.box{padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}.box h3{margin:0 0 9px;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px 3px;border:1px solid #d2dcdf;border-radius:6px;text-align:center;background:#f2f6f6}.stat b{display:block;color:var(--cyan);font-size:18px}.stat span{color:var(--muted);font-size:9px}.actions,.archive{display:grid;grid-template-columns:1fr 1fr;gap:6px}.actions button,.archive button{min-height:40px;border:1px solid #9cafb5;border-radius:6px;color:#304b54;background:#eff3f4;font-weight:900;cursor:pointer}.actions .primary{grid-column:1/-1;border-color:var(--cyan);color:#fff;background:var(--cyan)}.status{min-height:78px;margin:0;padding:10px;border-left:4px solid var(--cyan);color:#36515a;background:#edf5f6;font-size:12px;line-height:1.55}.rule{margin:0;color:var(--muted);font-size:11px;line-height:1.65}.result{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(11,37,45,.74)}.result[hidden]{display:none}.result-card{width:min(430px,100%);padding:22px;border-radius:var(--radius);background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.3);text-align:center}.result-card h2{margin:0}.result-card p{color:var(--muted);line-height:1.6}.result-stars{margin:12px 0;color:#d49a18;font-size:34px}.result-card button{min-height:42px;padding:0 18px;border:0;border-radius:6px;color:#fff;background:var(--cyan);font-weight:900;cursor:pointer}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.panel{display:grid;grid-template-columns:1fr 1fr}.panel .status{grid-column:1/-1}}
    @media(max-width:680px){.app{width:calc(100vw - 12px);padding-top:6px}.head{display:block;padding:14px}.campaign{justify-content:space-between;margin-top:12px;text-align:left}.missions{grid-template-columns:repeat(6,1fr)}.mission{height:39px}.workbench{padding:8px}.brief{display:block}.goal{display:inline-block;margin-top:7px}.scope canvas{aspect-ratio:2.25/1}.relays{gap:4px}.relay{min-height:58px;padding:4px}.relay b{font-size:15px}.clues{grid-template-columns:1fr}.panel{display:flex}}
  </style>
</head>
<body>
  <main class="app">
    <header class="head"><div><h1>噪声译码：十二信道</h1><p class="sub">还原六位中继码，并找出唯一一条被噪声改写的叠加读数。</p></div><div class="campaign"><div><b id="starTotal">0 / 36</b><span>译码星章</span></div><div><b id="cleanTotal">0 / 12</b><span>一次通过</span></div><div><b id="solvedTotal">0 / 12</b><span>恢复信道</span></div></div></header>
    <nav class="missions" id="missions" aria-label="译码任务"></nav>
    <section class="layout">
      <div class="workbench">
        <div class="brief"><div><h2 id="title"></h2><p id="brief"></p></div><span class="goal">6 位码 · 1 条噪声</span></div>
        <div class="scope"><canvas id="scope" width="900" height="300" aria-label="信道波形监视器"></canvas><span class="scope-label">LIVE CHANNEL SCOPE</span></div>
        <div class="relays" id="relays"></div>
        <div class="clue-head"><h3>叠加读数</h3><span>点击一条标记为噪声源</span></div>
        <div class="clues" id="clues"></div>
      </div>
      <aside class="panel">
        <section class="box"><h3>任务状态</h3><div class="stats"><div class="stat"><b id="ones">0</b><span>高电平</span></div><div class="stat"><b id="attempts">0</b><span>校验次数</span></div><div class="stat"><b id="hints">0</b><span>辅助次数</span></div></div></section>
        <section class="box"><div class="actions"><button class="primary" id="verify">执行译码校验</button><button id="hint">恢复一步</button><button id="reset">清空输入</button></div></section>
        <p class="status" id="status"></p>
        <section class="box"><h3>值班规则</h3><p class="rule">每条读数表示列出的中继中有多少个处于高电平。八条读数中恰好一条被噪声改写了 1，其余全部准确。</p></section>
        <section class="box"><div class="archive"><button id="exportSave">导出档案</button><button id="importSave">导入档案</button></div></section>
      </aside>
    </section>
  </main>
  <div class="result" id="result" hidden><div class="result-card"><h2 id="resultTitle"></h2><p id="resultText"></p><div class="result-stars" id="resultStars"></div><button id="next">下一条信道</button></div></div>
  <script>
  (()=>{
    "use strict";
    const SAVE_KEY="cipher_relay_v2",labels=["A","B","C","D","E","F"],masks=[[0,1,2],[1,3,4],[0,4,5],[2,3,5],[0,1,3,5],[1,2,4,5],[0,2,3,4],[0,1,2,3,4,5]],specs=[
      ["雾港报码","潮雾遮住了进港信标的主频。","101101",0],["极昼观测","日照脉冲让北侧阵列出现假高电平。","011010",1],["砂海中继","热噪声正在干扰地下光纤的返报码。","110001",2],["雨城水门","恢复六座水门控制器的同步状态。","001111",3],
      ["月台回声","列车离站后的回声污染了一组读数。","100110",4],["深井呼叫","矿井中继需要在下一次爆破前恢复。","111000",5],["雪线救援","找回失联测绘队的短波握手码。","010101",6],["浮岛气象","高空气流造成全频读数短暂偏移。","101010",7],
      ["古塔校时","让六面机械钟重新共享同一时基。","110110",0],["海沟声呐","从水压噪声中分离深潜器返回码。","001001",1],["星门握手","远距传输仅允许一次读数污染。","011101",2],["终局静默","在全域静默前恢复最后的主控密钥。","100011",3]
    ];
    const $=id=>document.getElementById(id),missionEl=$("missions"),relayEl=$("relays"),clueEl=$("clues"),statusEl=$("status"),cv=$("scope"),g=cv.getContext("2d");
    function signalCount(bits,mask){return mask.reduce((sum,index)=>sum+Number(bits[index]),0)}
    function buildMission(spec,index){const[title,brief,solution,noise]=spec,clues=masks.map(mask=>({mask:[...mask],shown:signalCount(solution,mask)})),actual=clues[noise].shown;clues[noise].shown+=actual<masks[noise].length?1:-1;return{id:`c${index+1}`,title,brief,solution,noise,clues}}
    const missions=specs.map(buildMission);
    let save=loadSave(),q=null,audio=null,phase=0;
    function defaults(){return{version:2,stars:{},attempts:{},updatedAt:Date.now()}}
    function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
    function normalize(value){const clean=defaults();if(!value||value.version!==2)return clean;for(const mission of missions){clean.stars[mission.id]=Math.max(0,Math.min(3,Number(value.stars?.[mission.id])||0));if(Number(value.attempts?.[mission.id])>0)clean.attempts[mission.id]=Number(value.attempts[mission.id])}return clean}
    function loadSave(){try{return normalize(JSON.parse(localStorage.getItem(SAVE_KEY)))}catch{return defaults()}}
    function persist(){save.updatedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(save));renderCampaign()}
    function encodeSave(){const body=btoa(unescape(encodeURIComponent(JSON.stringify(save))));return`CIPHER2.${body}.${checksum(body)}`}
    function decodeSave(code){const parts=code.trim().split(".");if(parts.length!==3||parts[0]!=="CIPHER2"||checksum(parts[1])!==parts[2])throw Error("译码档案校验失败");return normalize(JSON.parse(decodeURIComponent(escape(atob(parts[1])))))}
    function solveMission(mission){const solutions=[];for(let code=0;code<64;code++){const bits=code.toString(2).padStart(6,"0");for(let noise=0;noise<mission.clues.length;noise++){const valid=mission.clues.every((clue,index)=>{const delta=Math.abs(signalCount(bits,clue.mask)-clue.shown);return index===noise?delta===1:delta===0});if(valid)solutions.push({bits,noise})}}return solutions}
    function validateContent(){if(missions.length!==12)throw Error("信道任务数量错误");let clueCount=0;for(const mission of missions){const solutions=solveMission(mission);clueCount+=mission.clues.length;if(solutions.length!==1||solutions[0].bits!==mission.solution||solutions[0].noise!==mission.noise)throw Error(`${mission.id} 不是唯一解`)}return{missions:missions.length,uniqueSolutions:missions.length,clues:clueCount,codewords:64}}
    function unlocked(index){return index===0||Number(save.stars[missions[index-1].id])>0}
    function begin(index=0){if(!unlocked(index))return;q={index,mission:missions[index],bits:Array(6).fill(0),suspect:null,attempts:0,hints:0,hintStep:0};renderAll();setStatus("点击六个中继切换高低电平，再从八条读数中标出唯一的噪声源。")}
    function setStatus(text){statusEl.textContent=text}
    function renderCampaign(){const stars=Object.values(save.stars).reduce((sum,n)=>sum+Number(n||0),0),solved=Object.values(save.stars).filter(Boolean).length,clean=Object.values(save.attempts).filter(n=>n===1).length;$("starTotal").textContent=`${stars} / 36`;$("solvedTotal").textContent=`${solved} / 12`;$("cleanTotal").textContent=`${clean} / 12`}
    function renderMissions(){missionEl.replaceChildren();missions.forEach((mission,index)=>{const button=document.createElement("button"),stars=Number(save.stars[mission.id])||0;button.className=`mission${q?.index===index?" active":""}${unlocked(index)?"":" locked"}`;button.innerHTML=`${String(index+1).padStart(2,"0")}<small>${stars?"★".repeat(stars):""}</small>`;button.disabled=!unlocked(index);button.title=mission.title;button.onclick=()=>begin(index);missionEl.append(button)})}
    function renderRelays(){relayEl.replaceChildren();q.bits.forEach((bit,index)=>{const button=document.createElement("button");button.className=`relay${bit?" on":""}`;button.dataset.relay=index;button.innerHTML=`<b>${labels[index]} · ${bit}</b><span>${bit?"高电平":"低电平"}</span>`;button.onclick=()=>{q.bits[index]=q.bits[index]?0:1;renderRelays();renderPanel();tone(bit?220:410)};relayEl.append(button)})}
    function renderClues(){clueEl.replaceChildren();q.mission.clues.forEach((clue,index)=>{const button=document.createElement("button");button.className=`clue${q.suspect===index?" suspect":""}`;button.dataset.clue=index;button.innerHTML=`<b>${clue.mask.map(channel=>labels[channel]).join(" + ")}</b><span>= ${clue.shown}</span>`;button.onclick=()=>{q.suspect=q.suspect===index?null:index;renderClues();setStatus(q.suspect===null?"已取消噪声标记。":`已将读数 ${index+1} 标记为噪声源。`)};clueEl.append(button)})}
    function renderPanel(){$("title").textContent=`${String(q.index+1).padStart(2,"0")} · ${q.mission.title}`;$("brief").textContent=q.mission.brief;$("ones").textContent=q.bits.reduce((sum,n)=>sum+n,0);$("attempts").textContent=q.attempts;$("hints").textContent=q.hints;draw()}
    function renderAll(){renderCampaign();renderMissions();renderRelays();renderClues();renderPanel()}
    function tone(freq,duration=.08){try{audio??=new AudioContext();const osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=freq;gain.gain.setValueAtTime(.035,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain).connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}catch{}}
    function draw(){phase+=.18;g.fillStyle="#102d37";g.fillRect(0,0,900,300);g.strokeStyle="rgba(120,190,204,.12)";g.lineWidth=1;for(let x=0;x<=900;x+=50){g.beginPath();g.moveTo(x,0);g.lineTo(x,300);g.stroke()}for(let y=0;y<=300;y+=50){g.beginPath();g.moveTo(0,y);g.lineTo(900,y);g.stroke()}q.bits.forEach((bit,row)=>{const base=28+row*45;g.strokeStyle=bit?"#58ced7":"#55727b";g.lineWidth=3;g.beginPath();for(let x=0;x<=900;x+=10){const pulse=bit&&((x+row*35)%180<72)?-13:9,noise=Math.sin(x*.065+phase+row)*2,y=base+pulse+noise;if(x===0)g.moveTo(x,y);else g.lineTo(x,y)}g.stroke();g.fillStyle=bit?"#efca67":"#91a4aa";g.font="bold 14px sans-serif";g.fillText(labels[row],10,base+5)});if(q.suspect!==null){g.fillStyle="rgba(194,69,63,.7)";const x=680+(q.suspect%3)*55;g.fillRect(x,12,3,276)}}
    function verify(){q.attempts++;renderPanel();const code=q.bits.join("");if(code!==q.mission.solution){const wrong=q.bits.findIndex((bit,index)=>String(bit)!==q.mission.solution[index]);setStatus(`中继 ${labels[wrong]} 与全部可靠读数无法同时成立，请重新推导。`);tone(95,.18);return}if(q.suspect!==q.mission.noise){setStatus("六位码可以成立，但标记的噪声源不正确。");tone(110,.18);return}const stars=1+(q.hints<=2?1:0)+(q.hints===0&&q.attempts===1?1:0),id=q.mission.id;save.stars[id]=Math.max(Number(save.stars[id])||0,stars);save.attempts[id]=Math.min(save.attempts[id]||Infinity,q.attempts);persist();renderAll();$("resultTitle").textContent="信道恢复";$("resultText").textContent=`译码 ${code} 与八条读数闭环成立，噪声来自第 ${q.mission.noise+1} 条读数。`;$("resultStars").textContent="★".repeat(stars)+"☆".repeat(3-stars);$("next").textContent=q.index<missions.length-1?"下一条信道":"返回终局";$("result").hidden=false;tone(620,.2)}
    function hint(){if(q.hintStep<6){const index=q.hintStep;q.bits[index]=Number(q.mission.solution[index]);setStatus(`恢复中继 ${labels[index]} = ${q.bits[index]}。`)}else if(q.hintStep===6){q.suspect=q.mission.noise;setStatus(`已锁定第 ${q.mission.noise+1} 条读数为噪声源。`)}else{setStatus("全部参考信息已经恢复，可以执行校验。");return}q.hintStep++;q.hints++;renderAll()}
    $("verify").onclick=verify;$("hint").onclick=hint;$("reset").onclick=()=>begin(q.index);$("next").onclick=()=>{$("result").hidden=true;begin(Math.min(missions.length-1,q.index+1))};
    $("exportSave").onclick=async()=>{const code=encodeSave();try{await navigator.clipboard.writeText(code);setStatus("CIPHER2 档案码已复制。") }catch{prompt("CIPHER2 档案码",code)}};$("importSave").onclick=()=>{const code=prompt("输入 CIPHER2 档案码");if(!code)return;try{save=decodeSave(code);persist();begin(0);setStatus("译码档案导入完成。") }catch(error){setStatus(error.message)}};
    addEventListener("keydown",event=>{if(event.key>="1"&&event.key<="6"){const index=Number(event.key)-1;q.bits[index]=q.bits[index]?0:1;renderRelays();renderPanel()}if(event.code==="Enter")verify()});
    window.__cipherRelayTest={validateContent,solveMission,missions,getState:()=>({index:q.index,bits:[...q.bits],suspect:q.suspect})};validateContent();begin(0);
  })();
  </script>
</body>
</html>
