function submit(){let result=evaluateState(q);if(!result.pass){q.errors++;result=evaluateState(q);const unresolved=result.reports.filter(report=>!report.certified).length,wrong=result.reports.filter(report=>report.certified&&!report.correct).length,unselected=result.reports.filter(report=>report.certified&&report.correct===false).length;q.message=`认证退回：${unresolved} 份证据未唯一，${Math.max(wrong,unselected)} 份标签不符；错误计数已记录。`;save();draw();return result}const item=CASES[q.case];q.finished=true;profile.stars[q.case]=Math.max(profile.stars[q.case],result.stars);profile.bestTests[q.case]=profile.bestTests[q.case]==null?q.tests:Math.min(profile.bestTests[q.case],q.tests);profile.unlocked=Math.max(profile.unlocked,Math.min(12,q.case+2));profile.clears++;save();$("infoTitle").textContent=`整柜认证完成 · ${item.n}`;$("infoBody").innerHTML=`<div class="result"><strong>${"★".repeat(result.stars)}${"☆".repeat(3-result.stars)}</strong><ul><li>四份标本：全部证据唯一且标签正确</li><li>检验次数：${q.tests} / 大师线 ${item.parTests}</li><li>错误提交：${q.errors}</li><li>馆员提示：${q.hints}</li></ul>${q.case<11?'<button class="btn primary" id="nextCaseBtn">下一柜</button>':""}</div>`;$("infoOverlay").classList.remove("hidden");if($("nextCaseBtn"))$("nextCaseBtn").onclick=()=>startCase(q.case+1);draw();return result}
function drawSpecimen(){const item=CASES[q.case],sample=currentSample(),plant=PLANTS[sample.target],w=960,h=300;ctx.clearRect(0,0,w,h);ctx.fillStyle="#0a1c16";ctx.fillRect(0,0,w,h);ctx.fillStyle="#ffffff10";for(let i=0;i<16;i++){ctx.beginPath();ctx.arc(30+i*67,55+(i%4)*52,18+(i%3)*8,0,Math.PI*2);ctx.fill()}ctx.textAlign="center";ctx.fillStyle="#d9efd9";ctx.font="84px serif";ctx.fillText("🌿",180,175);ctx.fillStyle="#ffd06b";ctx.font="bold 23px sans-serif";ctx.fillText(`双盲标本 ${String.fromCharCode(65+q.current)}`,180,225);ctx.textAlign="left";ctx.fillStyle="#f1f5df";ctx.font="bold 22px sans-serif";ctx.fillText("已记录观察",360,54);const entries=Object.entries(sample.revealed);entries.forEach(([field,value],index)=>{const x=360+(index%2)*280,y=92+Math.floor(index/2)*58;ctx.fillStyle="#173b2d";ctx.fillRect(x,y,250,40);ctx.fillStyle="#abc5b6";ctx.font="14px sans-serif";ctx.fillText(FIELDS[field].n,x+12,y+17);ctx.fillStyle="#ffd06b";ctx.font="bold 16px sans-serif";ctx.fillText(value,x+12,y+35)});const left=candidatesFor(item,sample.revealed).length;ctx.fillStyle=left===1?"#71d99a":"#ffcf69";ctx.font="bold 18px sans-serif";ctx.fillText(left===1?`证据已唯一：可认证`:`仍有 ${left} 个一致候选`,360,276);void plant}
function drawBook(){$("cases").innerHTML=CASES.map((item,index)=>`<button class="case" data-case="${index}" ${index>=profile.unlocked?"disabled":""}><span>${item.i}</span><h3>${index+1}. ${item.n}</h3><p>第 ${item.chapter+1} 章 · 4 标本 / 8 候选 · 大师线 ${item.parTests} 次检验<br>${item.brief}</p><div class="stars">${"★".repeat(profile.stars[index])}${"☆".repeat(3-profile.stars[index])}</div></button>`).join("");document.querySelectorAll("[data-case]").forEach(button=>button.onclick=()=>startCase(+button.dataset.case))}
function draw(){if(!q)return;const item=CASES[q.case],sample=currentSample(),report=evaluateState(q),consistent=candidatesFor(item,sample.revealed);$("caseStat").textContent=`${q.case+1} / 12`;$("sampleStat").textContent=`${String.fromCharCode(65+q.current)} / D`;$("testStat").textContent=`${q.tests} / ${item.parTests}`;$("certStat").textContent=`${report.reports.filter(value=>value.pass).length} / 4`;$("starStat").textContent="★".repeat(profile.stars[q.case])+"☆".repeat(3-profile.stars[q.case]);$("caseTitle").textContent=`${item.i} ${item.n}`;$("caseBrief").textContent=item.brief;$("chapterLabel").textContent=`第 ${item.chapter+1} 章 · 初始观察 ${item.baseFields.length} 项`;$("message").textContent=q.message;$("log").textContent=q.message;$("samples").innerHTML=q.samples.map((value,index)=>{const candidates=candidatesFor(item,value.revealed),done=candidates.length===1&&value.selected===value.target;return`<button class="sample ${index===q.current?"active":""} ${done?"done":""}" data-sample="${index}"><b>${done?"✓ ":""}标本 ${String.fromCharCode(65+index)}</b><small>${candidates.length} 个一致候选 · ${value.selected!=null?PLANTS[value.selected].name:"未贴标签"}</small></button>`}).join("");document.querySelectorAll("[data-sample]").forEach(button=>button.onclick=()=>{q.current=+button.dataset.sample;save();draw()});$("evidence").innerHTML=Object.entries(sample.revealed).map(([field,value])=>`<div class="evidence-chip">${FIELDS[field].i} ${FIELDS[field].n}<b>${value}</b></div>`).join("")||'<span class="sub">本章没有预填观察，需要自己建立证据链。</span>';$("tests").innerHTML=FIELD_IDS.map(field=>`<button class="test" data-test="${field}" ${sample.revealed[field]!=null?"disabled":""}>${FIELDS[field].i} 检验${FIELDS[field].n}</button>`).join("");document.querySelectorAll("[data-test]").forEach(button=>button.onclick=()=>runTest(button.dataset.test));$("candidates").innerHTML=item.pool.map(id=>{const plant=PLANTS[id],possible=consistent.includes(id);return`<button class="candidate ${sample.selected===id?"selected":""} ${possible?"":"impossible"}" data-candidate="${id}"><b>🌿 ${plant.name}</b><small>叶形 ${plant.leaf} · 栖地 ${plant.habitat}<br>叶缘 ${plant.margin} · 叶脉 ${plant.vein} · 汁液 ${plant.sap} · 荧光 ${plant.uv}</small></button>`}).join("");document.querySelectorAll("[data-candidate]").forEach(button=>button.onclick=()=>selectCandidate(+button.dataset.candidate));$("rules").innerHTML=`<div class="rule"><b>唯一证据</b><br>每份标本的已记录特征必须只剩一个一致候选。</div><div class="rule"><b>正确标签</b><br>四份唯一候选与所贴名称全部一致才通过。</div><div class="rule"><b>三星</b><br>检验不超过 ${item.parTests} 次、零错误、零提示；放宽 1 次检验可获两星。</div>`;$("guide").innerHTML=item.pool.map(id=>{const plant=PLANTS[id];return`<article class="plant"><header><b>🌿 ${plant.name}</b><span>#${String(id+1).padStart(2,"0")}</span></header><small>叶形 ${plant.leaf} · 栖地 ${plant.habitat}<br>叶缘 ${plant.margin} · 叶脉 ${plant.vein}<br>汁液 ${plant.sap} · 紫外 ${plant.uv}</small></article>`}).join("");drawSpecimen();drawBook();save()}
function showArchive(){const code=encodeArchive();$("infoTitle").textContent="跨设备植鉴档案";$("infoBody").innerHTML=`<p class="sub">星级、最佳检验数和当前标本柜都包含在带校验的档案中。</p><textarea class="savebox" id="saveCode">${code}</textarea><div class="controls"><button class="btn" id="copyCodeBtn">复制导出</button><button class="btn" id="importCodeBtn">导入上方档案</button></div>`;$("infoOverlay").classList.remove("hidden");$("copyCodeBtn").onclick=()=>navigator.clipboard?.writeText($("saveCode").value);$("importCodeBtn").onclick=()=>{try{const data=decodeArchive($("saveCode").value);profile=data.profile;q=data.q||fresh(0);save();$("infoOverlay").classList.add("hidden");draw();toast("植鉴档案导入成功")}catch(error){toast(error.message)}}}
$("submitBtn").onclick=submit;$("hintBtn").onclick=applyHint;$("clearBtn").onclick=()=>{currentSample().selected=null;q.message="已清除当前标本标签。";save();draw()};$("resetBtn").onclick=()=>startCase(q.case);$("archiveBtn").onclick=showArchive;$("bookBtn").onclick=()=>{$("bookOverlay").classList.remove("hidden");drawBook()};$("closeInfoBtn").onclick=()=>$("infoOverlay").classList.add("hidden");load();drawBook();if(q){$("bookOverlay").classList.add("hidden");draw()}
window.__mistHerbarium={FIELDS,PLANTS,CASES,candidatesFor,minimalPlan,evaluateState,referenceResult,validateContent,fresh,state:()=>q,profile:()=>profile,start:startCase,runTest,selectCandidate,applyHint,submit,encode:encodeArchive,decode:decodeArchive};
})();
</script></body></html>
