function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
function encodeArchive(){const clean=q?{...q,running:false}:null,payload=btoa(unescape(encodeURIComponent(JSON.stringify({v:2,profile,q:clean}))));return`FACTORY2.${payload}.${checksum(payload)}`}
function decodeArchive(code){const match=String(code).trim().match(/^FACTORY2\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/);if(!match||checksum(match[1])!==match[2])throw Error("档案校验失败");const data=JSON.parse(decodeURIComponent(escape(atob(match[1]))));if(data.v!==2||!Array.isArray(data.profile?.stars))throw Error("档案版本不兼容");return data}
function save(){localStorage.setItem(SAVE,JSON.stringify({v:2,profile,q:q?{...q,running:false}:null}))}
function load(){try{const data=JSON.parse(localStorage.getItem(SAVE));if(data?.v===2){profile={...profile,...data.profile};q=data.q;if(q){q.running=false;q.sim=freshSim(q.contract,q.layout)}}else{const legacy=JSON.parse(localStorage.getItem(LEGACY));if(legacy?.v===3)profile.legacyOrders=legacy.stats?.orders||legacy.stage||0}}catch{}}
function nextKey(x,y,d){const nx=x+DIRS[d][0],ny=y+DIRS[d][1];return nx>=0&&nx<W&&ny>=0&&ny<H?pos(nx,ny):null}
function hasInputs(buffer,inputs){return Object.entries(inputs).every(([id,count])=>buffer.filter(item=>item===id).length>=count)}
function consume(buffer,inputs){for(const[id,count]of Object.entries(inputs))for(let i=0;i<count;i++)buffer.splice(buffer.indexOf(id),1)}
function deviceState(sim,device){return sim.devices[device.id]}
function targetInfo(contract,sim){let have=0,total=0;const rows=[];for(const sinkDevice of contract.sinks){const state=deviceState(sim,sinkDevice);for(const[item,need]of Object.entries(sinkDevice.want)){const count=state.delivered[item]||0;have+=Math.min(count,need);total+=need;rows.push({sink:sinkDevice.id,item,need,have:count})}}return{have,total,rows}}
function canReceive(contract,sim,key,item,reserved){const fixed=contract.fixed.get(key),tileState=sim.tiles[key];if(fixed){const state=deviceState(sim,fixed);if(fixed.type==="machine"){const recipe=RECIPES[fixed.recipe],itemKey=`${key}|${item}`,itemCount=state.buffer.filter(value=>value===item).length,itemCap=(recipe.inputs[item]||0)*4;return itemCap>0&&itemCount+(reserved[itemKey]||0)<itemCap&&state.buffer.length+(reserved[key]||0)<10}if(fixed.type==="sink")return Object.hasOwn(fixed.want,item);return false}if(tileState){if(tileState.type==="buffer")return tileState.queue.length+(reserved[key]||0)<6;return tileState.item==null&&(reserved[key]||0)<1}return false}
function stepSimulation(contract,sim){if(sim.complete||sim.tick>=contract.limit)return sim;sim.tick++;for(const device of contract.devices){if(device.type==="wall"||device.type==="sink")continue;const state=deviceState(sim,device);if(device.type==="source"){if(sim.tick%device.cadence===0){const item=device.sequence?device.sequence[state.seq++%device.sequence.length]:device.item;if(state.out.length<4)state.out.push(item);else sim.logs.unshift(`${device.id} 出料口阻塞`)}}else if(device.type==="machine"){const recipe=RECIPES[device.recipe];if(state.active){state.progress++;if(state.progress>=recipe.time){if(state.out.length<2){state.out.push(recipe.out);state.active=null;state.progress=0}else sim.logs.unshift(`${device.id} 成品口阻塞`)}}if(!state.active&&hasInputs(state.buffer,recipe.inputs)){consume(state.buffer,recipe.inputs);state.active=recipe.out;state.progress=0}}}
const emitters=[];for(const device of contract.devices){if(!["source","machine"].includes(device.type))continue;const state=deviceState(sim,device);if(state.out[0])emitters.push({key:`D:${device.id}`,x:device.x,y:device.y,dir:device.dir,item:state.out[0],remove:()=>state.out.shift()})}for(const[key,state]of Object.entries(sim.tiles)){state.blocked=false;const[x,y]=key.split(",").map(Number),item=state.type==="buffer"?state.queue[0]:state.item;if(!item)continue;let outDir=state.dir;if(state.type==="splitter"&&state.alt%2)outDir=(state.dir+1)%4;emitters.push({key:`T:${key}`,x,y,dir:outDir,item,remove:()=>{if(state.type==="buffer")state.queue.shift();else state.item=null;if(state.type==="splitter")state.alt++}})}emitters.sort((a,b)=>a.key.localeCompare(b.key));const reserved={},moves=[];for(const emitter of emitters){const target=nextKey(emitter.x,emitter.y,emitter.dir);if(target&&canReceive(contract,sim,target,emitter.item,reserved)){reserved[target]=(reserved[target]||0)+1;const itemKey=`${target}|${emitter.item}`;reserved[itemKey]=(reserved[itemKey]||0)+1;moves.push({emitter,target,item:emitter.item})}else{const own=sim.tiles[pos(emitter.x,emitter.y)];if(own)own.blocked=true}}
for(const move of moves)move.emitter.remove();for(const move of moves){const fixed=contract.fixed.get(move.target),state=sim.tiles[move.target];if(fixed){const fixedState=deviceState(sim,fixed);if(fixed.type==="machine")fixedState.buffer.push(move.item);else if(fixed.type==="sink"){if(Object.hasOwn(fixed.want,move.item))fixedState.delivered[move.item]=(fixedState.delivered[move.item]||0)+1;else sim.wrong++}}else if(state.type==="buffer")state.queue.push(move.item);else state.item=move.item}
const targets=targetInfo(contract,sim);sim.complete=targets.have>=targets.total;if(sim.complete&&!sim.finishedAt){sim.finishedAt=sim.tick;sim.logs.unshift(`第 ${sim.tick} 拍完成全部交付`)}sim.logs=sim.logs.slice(0,18);return sim}
function simulate(index,layout,maxTicks=CONTRACTS[index].limit){const contract=CONTRACTS[index],sim=freshSim(index,layout);while(!sim.complete&&sim.tick<maxTicks)stepSimulation(contract,sim);return sim}
function evaluate(index,layout,sim,hints=0){const contract=CONTRACTS[index],targets=targetInfo(contract,sim),build=Object.keys(layout).length,complete=sim.complete,ontime=complete&&sim.finishedAt<=contract.parTicks,efficient=build<=contract.parBelts;return{complete,ontime,efficient,build,parBelts:contract.parBelts,tick:sim.finishedAt||sim.tick,limit:contract.limit,wrong:sim.wrong,targets,stars:complete?1+(ontime&&sim.wrong===0?1:0)+(ontime&&sim.wrong===0&&efficient&&hints===0?1:0):0}}
function referenceResult(index){const contract=CONTRACTS[index],layout=Object.fromEntries(contract.ref.map(item=>[pos(item.x,item.y),{type:item.type,dir:item.dir}])),sim=simulate(index,layout);return{...evaluate(index,layout,sim,0),sim,layout}}
function validateContent(){const errors=[],references=[];for(const contract of CONTRACTS){const keys=new Set(contract.ref.map(item=>pos(item.x,item.y)));if(keys.size!==contract.ref.length)errors.push(`${contract.name} 参考蓝图重叠`);for(const item of contract.ref)if(contract.fixed.has(pos(item.x,item.y)))errors.push(`${contract.name} 参考设施覆盖固定设备`);const result=referenceResult(contract.index);references.push({name:contract.name,belts:result.build,tick:result.tick,stars:result.stars});if(result.stars!==3)errors.push(`${contract.name} 参考蓝图未三星：${result.targets.have}/${result.targets.total} @${result.tick}`)}return{valid:!errors.length,errors,contracts:CONTRACTS.length,devices:CONTRACTS.reduce((sum,item)=>sum+item.devices.length,0),referenceTiles:CONTRACTS.reduce((sum,item)=>sum+item.ref.length,0),references}}
function stop(){if(!q)return;q.running=false;clearInterval(timer);timer=null;save();draw()}
function step(){if(!q||q.sim.complete||q.sim.tick>=CONTRACTS[q.contract].limit){stop();if(q?.sim.complete)finish();return}stepSimulation(CONTRACTS[q.contract],q.sim);draw();if(q.sim.complete){stop();finish()}else if(q.sim.tick>=CONTRACTS[q.contract].limit){stop();q.message="时限耗尽，复位物流后调整蓝图再试。";draw()}}
function run(){if(q.running)return stop();if(!Object.keys(q.layout).length)return toast("先铺设至少一格物流设施");q.running=true;timer=setInterval(step,180/speed);draw()}
function pushHistory(){q.history.push(JSON.stringify(q.layout));q.history=q.history.slice(-40)}
function editCell(x,y){if(q.running)return toast("先暂停产线");const contract=CONTRACTS[q.contract],key=pos(x,y);if(contract.fixed.has(key))return;pushHistory();if(tool==="erase"){delete q.layout[key]}else if(q.layout[key])q.layout[key].dir=(q.layout[key].dir+1)%4;else{if(!contract.allowed.includes(tool))return q.history.pop(),toast("本合同尚未开放该设施");q.layout[key]={type:tool,dir}}q.sim=freshSim(q.contract,q.layout);q.message=q.layout[key]?`铺设 ${TOOLS[q.layout[key].type].n} ${ARROWS[q.layout[key].dir]}`:"已拆除物流设施";save();draw()}
function undo(){if(q.running)return;const previous=q.history.pop();if(!previous)return toast("没有可撤销的蓝图操作");q.layout=JSON.parse(previous);q.sim=freshSim(q.contract,q.layout);save();draw()}
function resetSim(){stop();q.sim=freshSim(q.contract,q.layout);q.message="物流已复位，蓝图保持不变。";draw()}
function clearLayout(){stop();pushHistory();q.layout={};q.sim=freshSim(q.contract,q.layout);q.hints=0;q.message="蓝图已清空。";draw()}
function hint(){if(q.running)return;const contract=CONTRACTS[q.contract],missing=contract.ref.find(item=>{const current=q.layout[pos(item.x,item.y)];return!current||current.type!==item.type||current.dir!==item.dir});if(!missing)return toast("当前蓝图已经包含完整参考路线");pushHistory();q.layout[pos(missing.x,missing.y)]={type:missing.type,dir:missing.dir};q.hints++;q.sim=freshSim(q.contract,q.layout);q.message=`提示：在 (${missing.x+1}, ${missing.y+1}) 铺设 ${TOOLS[missing.type].n} ${ARROWS[missing.dir]}。`;save();draw()}
function finish(){const result=evaluate(q.contract,q.layout,q.sim,q.hints),contract=CONTRACTS[q.contract],old=profile.stars[q.contract]||0;profile.stars[q.contract]=Math.max(old,result.stars);profile.bestTicks[q.contract]=profile.bestTicks[q.contract]==null?result.tick:Math.min(profile.bestTicks[q.contract],result.tick);profile.bestBelts[q.contract]=profile.bestBelts[q.contract]==null?result.build:Math.min(profile.bestBelts[q.contract],result.build);profile.clears[q.contract]=(profile.clears[q.contract]||0)+1;profile.unlocked=Math.max(profile.unlocked,Math.min(12,q.contract+2));save();$("infoTitle").textContent=`合同完成 · ${contract.name}`;$("infoBody").innerHTML=`<div class="result"><strong>${"★".repeat(result.stars)}${"☆".repeat(3-result.stars)}</strong><ul><li>交付：${result.targets.have}/${result.targets.total}</li><li>完成时钟：${result.tick}/${result.limit}</li><li>物流设施：${result.build}/${result.parBelts}</li><li>错误交付：${result.wrong}</li><li>提示次数：${q.hints}</li></ul>${q.contract<11?'<button class="btn primary" id="nextContractBtn">下一份合同</button>':""}</div>`;$("infoOverlay").classList.remove("hidden");if($("nextContractBtn"))$("nextContractBtn").onclick=()=>startContract(q.contract+1)}
function showArchive(){const code=encodeArchive();$("infoTitle").textContent="跨设备工业档案";$("infoBody").innerHTML=`<p class="sub">合同星级、最佳时钟、工料纪录、旧 V3 完成订单数和当前蓝图均包含在校验档案中。</p><textarea class="savebox" id="archiveCode">${code}</textarea><div class="controls"><button class="btn" id="copyArchiveBtn">复制档案</button><button class="btn" id="importArchiveBtn">导入上方档案</button></div>`;$("infoOverlay").classList.remove("hidden");$("copyArchiveBtn").onclick=()=>navigator.clipboard?.writeText($("archiveCode").value);$("importArchiveBtn").onclick=()=>{try{const data=decodeArchive($("archiveCode").value);profile=data.profile;q=data.q;if(q){q.running=false;q.sim=freshSim(q.contract,q.layout)}save();$("infoOverlay").classList.add("hidden");if(q){$("mapOverlay").classList.add("hidden");draw()}else{drawMap();$("mapOverlay").classList.remove("hidden")}toast("工业档案导入成功")}catch(error){toast(error.message)}}}
function startContract(index){stop();q=fresh(index);tool="belt";dir=0;$("mapOverlay").classList.add("hidden");$("infoOverlay").classList.add("hidden");save();draw()}
function drawMap(){$("contracts").innerHTML=CONTRACTS.map((contract,index)=>`<button class="contract" data-contract="${index}" ${index>=profile.unlocked?"disabled":""}><span>${contract.icon}</span><h3>${index+1}. ${contract.name}</h3><p>${contract.chapter} · 固定设备 ${contract.devices.length} · 工料 ${contract.parBelts}<br>${contract.brief}</p><div class="stars">${"★".repeat(profile.stars[index]||0)}${"☆".repeat(3-(profile.stars[index]||0))}</div></button>`).join("")+`<div class="contract"><h3>旧工区纪录</h3><p>已迁移 V3 完成订单 ${profile.legacyOrders||0} 份；旧布局因状态机不同不强行转换。</p></div>`;document.querySelectorAll("[data-contract]").forEach(button=>button.onclick=()=>startContract(+button.dataset.contract))}
function deviceIcon(device){if(device.type==="source")return ITEMS[device.item]?.i||"📤";if(device.type==="machine")return{plate:"🔥",cplate:"🔥",gear:"⚙️",circuit:"⚙️",engine:"🏭",drone:"🏭",science:"🔬"}[device.recipe];if(device.type==="sink")return"🚚";return""}
function draw(){if(!q)return;const contract=CONTRACTS[q.contract],result=evaluate(q.contract,q.layout,q.sim,q.hints),best=profile.stars[q.contract]||0;$("contractStat").textContent=`${q.contract+1} / 12`;$("tickStat").textContent=`${q.sim.tick} / ${contract.limit}`;$("buildStat").textContent=`${result.build} / ${contract.parBelts}`;$("deliveryStat").textContent=`${result.targets.have} / ${result.targets.total}`;$("starStat").textContent="★".repeat(best)+"☆".repeat(3-best);$("contractTitle").textContent=`${contract.icon} ${contract.name}`;$("contractBrief").textContent=contract.brief;$("chapterLabel").textContent=contract.chapter;$("message").textContent=q.message;$("tools").innerHTML=Object.entries(TOOLS).map(([id,item])=>`<button class="tool ${tool===id?"active":""}" data-tool="${id}" ${id!=="erase"&&!contract.allowed.includes(id)?"disabled":""}><span>${item.i}</span><b>${item.n}</b><small>${item.d}</small></button>`).join("");document.querySelectorAll("[data-tool]").forEach(button=>button.onclick=()=>{tool=button.dataset.tool;draw()});
const grid=$("grid");grid.innerHTML="";for(let y=0;y<H;y++)for(let x=0;x<W;x++){const key=pos(x,y),device=contract.fixed.get(key),placed=q.layout[key],simTile=q.sim.tiles[key],cell=document.createElement("div");cell.className=`cell ${device?.type==="wall"?"wall":""}`;cell.dataset.cell=key;cell.onclick=()=>editCell(x,y);if(device&&device.type!=="wall"){const state=deviceState(q.sim,device),item=device.type==="sink"?null:state.out[0]||state.buffer[0];cell.innerHTML=`<div class="fixed ${device.type}"><span>${deviceIcon(device)}</span><b>${device.id} ${device.type==="source"?ITEMS[device.item].n:device.type==="machine"?RECIPES[device.recipe].out==="science"?"实验室":ITEMS[RECIPES[device.recipe].out].n:"交付仓"}</b><small>${device.type==="source"?ARROWS[device.dir]:device.type==="machine"?ARROWS[device.dir]:""}</small></div>${item?`<span class="item">${ITEMS[item].i}</span>`:""}${state.buffer?.length?`<span class="count">${state.buffer.length}</span>`:""}`}else if(placed){const current=simTile?.type==="buffer"?simTile.queue[0]:simTile?.item,count=simTile?.type==="buffer"?simTile.queue.length:0;cell.innerHTML=`<div class="placed ${placed.type} ${simTile?.blocked?"blocked":""}"><span>${placed.type==="belt"?ARROWS[placed.dir]:placed.type==="splitter"?`🔀${ARROWS[placed.dir]}`:`📦${ARROWS[placed.dir]}`}</span><b>${TOOLS[placed.type].n}</b></div>${current?`<span class="item">${ITEMS[current].i}</span>`:""}${count?`<span class="count">${count}</span>`:""}`}grid.append(cell)}
$("targets").innerHTML=result.targets.rows.map(row=>`<div class="target"><header><b>${row.sink} · ${ITEMS[row.item].i}${ITEMS[row.item].n}</b><strong>${row.have}/${row.need}</strong></header><small>只计入对应交付仓</small><div class="bar"><i style="width:${Math.min(100,row.have/row.need*100)}%"></i></div></div>`).join("");$("recipes").innerHTML=contract.machines.map(device=>`<div class="recipe"><b>${device.id}</b> ${RECIPES[device.recipe].n} · ${RECIPES[device.recipe].time}拍</div>`).join("")||'<div class="recipe">本合同仅处理预制料物流。</div>';$("report").innerHTML=[`<div class="${result.complete?"ok":""}">交付 ${result.targets.have}/${result.targets.total}</div>`,`<div class="${result.build<=contract.parBelts?"ok":"bad"}">工料 ${result.build}/${contract.parBelts}</div>`,`<div>错误交付 ${q.sim.wrong}</div>`,...q.sim.logs.map(text=>`<div>${text}</div>`)].join("");$("rotateBtn").textContent=`旋转 ${ARROWS[dir]}`;$("runBtn").textContent=q.running?"暂停产线":"启动产线";$("undoBtn").disabled=!q.history.length;save()}
function toast(text){const el=document.createElement("div");el.className="toast";el.textContent=text;document.body.append(el);setTimeout(()=>el.remove(),1500)}
$("rotateBtn").onclick=()=>{dir=(dir+1)%4;$("rotateBtn").textContent=`旋转 ${ARROWS[dir]}`};$("undoBtn").onclick=undo;$("runBtn").onclick=run;$("stepBtn").onclick=step;$("speedBtn").onclick=()=>{speed=speed===1?2:speed===2?4:1;$("speedBtn").textContent=`速度 ×${speed}`;if(q.running){clearInterval(timer);timer=setInterval(step,180/speed)}};$("hintBtn").onclick=hint;$("resetSimBtn").onclick=resetSim;$("clearBtn").onclick=clearLayout;$("archiveBtn").onclick=showArchive;$("mapArchiveBtn").onclick=showArchive;$("mapBtn").onclick=()=>{stop();drawMap();$("mapOverlay").classList.remove("hidden")};$("closeInfoBtn").onclick=()=>$("infoOverlay").classList.add("hidden");load();drawMap();if(q){$("mapOverlay").classList.add("hidden");draw()}
window.__tinyFactory={CONTRACTS,RECIPES,TOOLS,freshSim,stepSimulation,simulate,evaluate,referenceResult,validateContent,state:()=>q,profile:()=>profile,start:startContract,applyReference(index=q?.contract||0){if(!q||q.contract!==index)q=fresh(index);q.layout=JSON.parse(JSON.stringify(referenceResult(index).layout));q.sim=freshSim(index,q.layout);draw();return q},runReference(index){return referenceResult(index)},encode:encodeArchive,decode:decodeArchive};
})();
