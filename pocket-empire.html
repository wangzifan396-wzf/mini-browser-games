  <style>
    :root{--bg:#14242a;--paper:#f7f3e5;--panel:#fffdf5;--ink:#1d292d;--muted:#64716e;--line:#94a39e;--green:#39745b;--blue:#397391;--gold:#ad812b;--red:#a84d49;--radius:8px;--shadow:rgba(5,15,18,.27)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:linear-gradient(135deg,#10222b,#31504a 56%,#4b4040)}button,textarea{font:inherit}.app{width:min(1460px,calc(100vw - 24px));margin:12px auto 28px}.topbar,.panel,.archive{border:1px solid var(--line);border-radius:var(--radius);background:rgba(255,253,245,.97);box-shadow:0 16px 38px var(--shadow)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 19px}.eyebrow{margin:0 0 4px;color:#88631c;font-size:12px;font-weight:900}.topbar h1{margin:0;font-size:clamp(27px,4vw,43px);line-height:1.05}.subtitle{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.actions,.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.actions{justify-content:flex-end}.btn{min-height:42px;padding:0 13px;border:1px solid #295c49;border-radius:var(--radius);color:#fff;background:var(--green);font-weight:900;cursor:pointer}.btn.secondary{color:var(--ink);background:#efd17b;border-color:#9c7520}.btn.ghost{color:var(--ink);background:#edf0e9;border-color:#82938d}.btn:disabled{opacity:.46;cursor:not-allowed}.layout{display:grid;grid-template-columns:235px minmax(430px,1fr) 300px;gap:12px;margin-top:12px;align-items:start}.panel{padding:12px}.panel h2{margin:0 0 9px;font-size:16px}.campaign{display:grid;gap:6px}.mission{width:100%;padding:9px;border:1px solid #a2ada7;border-radius:var(--radius);color:var(--ink);background:#faf7eb;text-align:left;cursor:pointer}.mission strong,.mission small{display:block}.mission small{margin-top:3px;color:var(--muted);font-size:11px}.mission span{float:right;color:var(--gold)}.mission.active{border-color:var(--green);box-shadow:0 0 0 2px rgba(57,116,91,.18);background:#e8f1ea}.mission:disabled{opacity:.46;cursor:not-allowed}.war-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px}.war-head h2{margin:0;font-size:24px}.war-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.turn{text-align:right;white-space:nowrap}.turn b{display:block;color:var(--blue);font-size:23px}.map{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;padding:7px;border:1px solid #6c817c;border-radius:var(--radius);background:#172d32;aspect-ratio:1}.tile{position:relative;min-width:0;padding:0;border:1px solid #60776f;border-radius:5px;color:#fff;background:#54735b;font-size:clamp(16px,2.5vw,27px);cursor:pointer;aspect-ratio:1}.tile.water{background:#39738a}.tile.mountain{background:#676966}.tile.fog{color:transparent;background:#25353a}.tile.selected{outline:3px solid #f0d16e;z-index:2}.tile.reachable{box-shadow:inset 0 0 0 3px rgba(103,222,154,.72)}.tile.enemy{border-color:#d27068}.tile small{position:absolute;right:3px;bottom:1px;color:#fff;font-size:10px}.tile:disabled{cursor:not-allowed}.commands{margin-top:9px}.message{flex:1 1 220px;color:var(--muted);font-size:12px;font-weight:800}.resources,.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{padding:8px;border:1px solid #a7b0aa;border-radius:var(--radius);background:#f8f5e9}.stat b{display:block;color:var(--blue);font-size:20px}.stat small{color:var(--muted);font-size:11px;font-weight:800}.techs,.doctrines{display:grid;gap:6px}.tech,.doctrine{padding:8px;border:1px solid #9da9a2;border-radius:var(--radius);color:var(--ink);background:#f8f5e9;text-align:left;cursor:pointer}.tech strong,.tech small,.doctrine strong,.doctrine small{display:block}.tech small,.doctrine small{margin-top:2px;color:var(--muted);font-size:10px;line-height:1.35}.tech.done,.doctrine.active{border-color:var(--gold);background:#fff2c7}.goal{margin-top:9px;padding:9px;border:1px solid #a7b0aa;border-radius:var(--radius);background:#f8f5e9}.goal-row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid #d9d9ce;font-size:12px}.goal-row:last-child{border-bottom:0}.goal-row.ok{color:var(--green);font-weight:900}.log{height:122px;overflow:auto;margin-top:9px;padding:8px;border:1px solid #a7b0aa;border-radius:var(--radius);background:#f8f5e9;font-size:12px;line-height:1.55}.archive{position:fixed;z-index:20;left:50%;top:50%;width:min(620px,calc(100vw - 26px));padding:18px;transform:translate(-50%,-50%)}.archive h2{margin:0 0 7px}.archive p{margin:0 0 10px;color:var(--muted);font-size:12px}.archive textarea{width:100%;min-height:94px;padding:9px;border:1px solid var(--line);border-radius:var(--radius);resize:vertical}.feedback{min-height:20px;margin-top:7px;color:var(--green);font-size:12px;font-weight:900}.hidden{display:none!important}@media(max-width:1080px){.layout{grid-template-columns:210px minmax(410px,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.log{height:100px}}@media(max-width:760px){.app{width:calc(100vw - 14px);margin-top:7px}.topbar{display:block;padding:14px}.actions{margin-top:11px;justify-content:stretch}.actions .btn{flex:1 1 auto}.layout{grid-template-columns:1fr}.campaign{grid-template-columns:repeat(2,1fr)}.right{grid-column:auto;display:block}.war-head{display:block}.turn{text-align:left;margin-top:7px}.map{gap:2px;padding:5px}.tile{font-size:18px}.commands .btn{flex:1 1 42%}}
  </style>

<body>
  <main class="app">
    <header class="topbar">
      <div><p class="eyebrow">DETERMINISTIC 4X CAMPAIGN</p><h1>方格帝国：六境远征</h1><p class="subtitle">六张固定大陆、三种文明学派与可预测敌军共同组成可复盘的轻量文明战役。</p></div>
      <div class="actions"><button class="btn" id="endBtn">结束时代</button><button class="btn secondary" id="referenceBtn">参考远征</button><button class="btn ghost" id="restartBtn">重开本章</button><button class="btn ghost" id="archiveBtn">帝国档案</button></div>
    </header>
    <section class="layout">
      <aside class="panel"><h2>六境战役</h2><div class="campaign" id="campaign"></div><h2 style="margin-top:13px">文明学派</h2><div class="doctrines" id="doctrines"></div></aside>
      <section class="panel battlefield"><div class="war-head"><div><h2 id="missionTitle"></h2><p id="missionBrief"></p></div><div class="turn"><b>时代 <span id="turn"></span>/<span id="limit"></span></b><span>行动 <strong id="ap"></strong>/4</span></div></div><div class="map" id="map"></div><div class="row commands"><button class="btn" id="settleBtn">建立城市</button><button class="btn" id="recruitBtn">招募军团</button><span class="message" id="message"></span></div></section>
      <aside class="right"><section class="panel"><h2>帝国资源</h2><div class="resources" id="resources"></div><div class="stats" id="stats" style="margin-top:7px"></div><div class="goal" id="goals"></div></section><section class="panel" style="margin-top:12px"><h2>科技树</h2><div class="techs" id="techs"></div><div class="log" id="log"></div></section></aside>
    </section>
  </main>
  <section class="archive hidden" id="archive"><h2>六境远征档案</h2><p>档案保存关卡解锁、星级与最佳回合，并带有完整性校验。</p><textarea id="archiveText" spellcheck="false"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="copyBtn">生成并复制</button><button class="btn secondary" id="importBtn">导入档案</button><button class="btn ghost" id="closeBtn">关闭</button></div><div class="feedback" id="feedback"></div></section>
  <script>
  (()=>{
    const N=8,STORAGE="pocketEmpireV2",$=id=>document.getElementById(id);
    const TERRAIN={".":{type:"plain",icon:""},f:{type:"plain",icon:"🌾",res:"food"},p:{type:"plain",icon:"⛏️",res:"prod"},k:{type:"plain",icon:"📚",res:"science"},r:{type:"plain",icon:"◆",relic:true},"~":{type:"water",icon:"≈"},"^":{type:"mountain",icon:"⛰️"}};
    const DOCTRINES={settler:{name:"拓土议会",text:"建立城市少花 10 生产",settle:10},scholar:{name:"星图学派",text:"研究科技少花 8 科技",research:8},marshal:{name:"铁誓军团",text:"军团作战力量 +1",power:1}};
    const TECHS={agri:{name:"轮作农业",cost:24,text:"城市每时代额外产出 3 粮食"},metal:{name:"合金锻造",cost:32,text:"军团作战力量 +1"},cartography:{name:"帝国测绘",cost:28,text:"移动后额外揭示一圈迷雾"},navigation:{name:"浅海航行",cost:38,text:"允许军团进入水域"},academia:{name:"公共学宫",cost:42,text:"城市每时代额外产出 3 科技"},logistics:{name:"军团辎重",cost:44,text:"每时代增加 1 行动，最多 5",requires:"metal"}};
    const SCENARIOS=[
      {id:"greenmarch",name:"青原初征",region:"青原",brief:"沿开阔谷地夺取赤焰王城。",map:["..^..f..",".p^.....","..^..~..","....~~..",".k......","...^....",".f......","........"],start:56,enemy:7,relics:[],enemyUnits:[[7,2],[15,1]],turns:8,par:4,bonus:{kind:"losses",value:0,label:"不损失军团"}},
      {id:"amberpass",name:"琥珀隘口",region:"西岭",brief:"穿过山口并控制古代界碑。",map:["...^....",".p.^.f..","...^....",".^^^.^..","....r...","..f^....","...^..k.","........"],start:56,enemy:6,relics:[36],enemyUnits:[[6,2],[14,1],[30,1]],turns:9,par:6,bonus:{kind:"relics",value:1,label:"控制 1 座界碑"}},
      {id:"rivercrown",name:"双河王冠",region:"双河",brief:"以轮作农业支撑跨河远征。",map:["..f...p.",".~~~....","....^...","..k.^...","....^...","...~~~..",".f....p.","........"],start:56,enemy:7,relics:[],enemyUnits:[[7,2],[23,1]],turns:10,par:6,bonus:{kind:"tech",value:"agri",label:"完成轮作农业"}},
      {id:"ironcoast",name:"铁岸城邦",region:"铁岸",brief:"在漫长海岸建立第二座城市。",map:["...p....",".~~...f.",".~~.^...","....^...",".k..^...","....^...",".f......","........"],start:56,enemy:7,relics:[],enemyUnits:[[7,3],[15,1],[31,1]],turns:11,par:7,bonus:{kind:"cities",value:2,label:"拥有 2 座城市"}},
      {id:"threebanners",name:"三旗荒原",region:"荒原",brief:"争夺分散矿粮，形成稳定补给线。",map:[".f....p.","..^..^..","p.^..^..","..^..^..","f....k..","..^^....","....p...","........"],start:56,enemy:7,relics:[],enemyUnits:[[7,3],[14,2],[23,1]],turns:12,par:8,bonus:{kind:"resources",value:3,label:"控制 3 处资源"}},
      {id:"ashenstar",name:"灰烬终局",region:"灰烬高地",brief:"以科技与军力终结赤焰帝国。",map:["..k..p..",".^^..^..","...r.^..",".~....~.",".~.^^.~.","...f....",".p....k.","........"],start:56,enemy:7,relics:[19],enemyUnits:[[7,4],[15,2],[23,2],[30,1]],turns:13,par:9,bonus:{kind:"techs",value:2,label:"完成 2 项科技"}}
    ];
    function blankProfile(){return{v:2,unlocked:0,stars:Array(6).fill(0),best:Array(6).fill(0),clears:0}}
    function normalize(p){return{v:2,unlocked:Math.max(0,Math.min(5,+p.unlocked||0)),stars:Array.from({length:6},(_,i)=>Math.max(0,Math.min(3,+p.stars?.[i]||0))),best:Array.from({length:6},(_,i)=>Math.max(0,+p.best?.[i]||0)),clears:Math.max(0,+p.clears||0)}}
    function load(){try{const p=JSON.parse(localStorage.getItem(STORAGE)||"null");return p?.v===2?normalize(p):blankProfile()}catch{return blankProfile()}}
    let profile=load(),scenarioIndex=Math.min(profile.unlocked,5),doctrine="settler",selected=null,state=makeState(scenarioIndex);
    function scenario(s=state){return SCENARIOS[s.scenario]}
    function makeState(index){const sc=SCENARIOS[index],tiles=sc.map.join("").split("").map((code,i)=>{const base=TERRAIN[code];return{code,type:base.type,res:base.res||null,relic:Boolean(base.relic),seen:false,owner:null,city:false,unit:0,fort:0,index:i}});tiles[sc.start].owner="p";tiles[sc.start].city=true;tiles[sc.start].unit=5;tiles[sc.enemy].owner="e";tiles[sc.enemy].city=true;for(const [i,power] of sc.enemyUnits){tiles[i].owner="e";tiles[i].unit=power}const s={scenario:index,turn:1,ap:4,food:55,prod:70,science:62,tiles,tech:{},lost:0,lostCities:0,done:false,stars:0,logs:[`侦察队抵达${sc.region}，固定军令已经展开。`],message:"选择军团，再点击相邻方格移动。"};reveal(s,sc.start,1);return s}
    function near(a,b){return Math.abs(Math.floor(a/N)-Math.floor(b/N))+Math.abs(a%N-b%N)===1}
    function reveal(s,index,range=1){const row=Math.floor(index/N),col=index%N;for(let y=Math.max(0,row-range);y<=Math.min(N-1,row+range);y++)for(let x=Math.max(0,col-range);x<=Math.min(N-1,col+range);x++)s.tiles[y*N+x].seen=true}
    function canEnter(s,t){return t.type!=="mountain"&&(t.type!=="water"||s.tech.navigation)}
    function move(index,s=state,testing=false){if(s.done||s.ap<1||selected===null||!near(selected,index))return{ok:false,reason:"需要选择相邻方格"};const from=s.tiles[selected],to=s.tiles[index];if(from.owner!=="p"||from.unit<1||!canEnter(s,to))return{ok:false,reason:"军团无法进入该地形"};if(to.owner==="e"){const attack=from.unit+(s.tech.metal?1:0)+(doctrine==="marshal"?1:0),defense=to.unit+(to.city?1:0)+to.fort;if(attack<=defense){from.unit=Math.max(0,from.unit-1);s.lost++;s.logs.unshift(`进攻受阻：战力 ${attack} 对 ${defense}。`);s.ap--;selected=from.unit?selected:null;if(!testing)renderAll();return{ok:true,battle:"lost"}}to.owner="p";to.unit=from.unit;to.fort=0;s.logs.unshift(to.city?"赤焰城市被攻占。":"敌方军团被击退。")}else{to.owner="p";to.unit=from.unit}from.unit=0;selected=index;s.ap--;reveal(s,index,s.tech.cartography?2:1);const result=checkEnd(s,testing);if(!testing)renderAll();return{ok:true,battle:"won",result}}
    function settleCity(s=state,testing=false){if(s.done||selected===null)return{ok:false,reason:"先选择军团所在方格"};const t=s.tiles[selected],cost=30-(doctrine==="settler"?10:0);if(t.owner!=="p"||!t.unit||t.city||t.type!=="plain"||s.prod<cost||s.ap<1)return{ok:false,reason:`需要陆地军团、1 行动和 ${cost} 生产`};s.prod-=cost;s.ap--;t.city=true;s.logs.unshift("新城建立，附近资源纳入供给圈。");const result=checkEnd(s,testing);if(!testing)renderAll();return{ok:true,result}}
    function recruit(s=state,testing=false){const city=selected!==null&&s.tiles[selected].owner==="p"&&s.tiles[selected].city?s.tiles[selected]:s.tiles.find(t=>t.owner==="p"&&t.city);if(!city||s.food<18||s.prod<14||s.ap<1||city.unit>=7)return{ok:false,reason:"城市需要 18 粮食、14 生产和 1 行动"};s.food-=18;s.prod-=14;s.ap--;city.unit+=2;selected=city.index;s.logs.unshift("两支预备队加入驻军。");if(!testing)renderAll();return{ok:true}}
    function research(key,s=state,testing=false){const tech=TECHS[key],cost=tech.cost-(doctrine==="scholar"?8:0);if(!tech||s.tech[key]||s.science<cost||(tech.requires&&!s.tech[tech.requires]))return{ok:false,reason:"科技点或前置科技不足"};s.science-=cost;s.tech[key]=true;s.logs.unshift(`${tech.name}研究完成。`);const result=checkEnd(s,testing);if(!testing)renderAll();return{ok:true,result}}
    function ownedMetrics(s=state){const owned=s.tiles.filter(t=>t.owner==="p"),cities=owned.filter(t=>t.city).length,resources=owned.filter(t=>t.res).length,relics=owned.filter(t=>t.relic).length,units=owned.reduce((sum,t)=>sum+t.unit,0);return{owned,cities,resources,relics,units,techs:Object.keys(s.tech).length,capital:s.tiles[scenario(s).enemy].owner==="p"}}
    function bonusMet(s=state){const b=scenario(s).bonus,m=ownedMetrics(s);if(b.kind==="losses")return s.lost<=b.value;if(b.kind==="relics")return m.relics>=b.value;if(b.kind==="tech")return Boolean(s.tech[b.value]);if(b.kind==="cities")return m.cities>=b.value;if(b.kind==="resources")return m.resources>=b.value;if(b.kind==="techs")return m.techs>=b.value;return false}
    function checkEnd(s=state,testing=false){if(s.done)return resultOf(s);const sc=scenario(s),metrics=ownedMetrics(s);if(metrics.capital){s.done=true;s.stars=1+(s.turn<=sc.par?1:0)+(bonusMet(s)?1:0);s.message=`远征完成，获得 ${s.stars} 星。`;s.logs.unshift(`${sc.name}归入帝国版图。`);if(!testing){profile.stars[s.scenario]=Math.max(profile.stars[s.scenario],s.stars);profile.best[s.scenario]=profile.best[s.scenario]?Math.min(profile.best[s.scenario],s.turn):s.turn;profile.unlocked=Math.max(profile.unlocked,Math.min(5,s.scenario+1));profile.clears++;save()}}return resultOf(s)}
    function resultOf(s){const m=ownedMetrics(s);return{ok:s.done&&m.capital,scenario:scenario(s).id,stars:s.stars,turn:s.turn,cities:m.cities,resources:m.resources,relics:m.relics,techs:m.techs,lost:s.lost}}
    function enemyTurn(s){const sc=scenario(s),capital=sc.start;const enemies=s.tiles.filter(t=>t.owner==="e"&&t.unit>0).sort((a,b)=>a.index-b.index);for(const from of enemies){if(from.owner!=="e"||!from.unit)continue;const options=s.tiles.filter(t=>near(from.index,t.index)&&t.type==="plain"&&t.owner!=="e").sort((a,b)=>distance(a.index,capital)-distance(b.index,capital)||a.index-b.index);const to=options[0];if(!to)continue;if(to.owner==="p"&&to.unit){if(from.unit>to.unit){s.lost+=to.unit;to.unit=from.unit;to.owner="e";if(to.city)s.lostCities++;s.logs.unshift("敌军突破一处帝国阵地。")}else{from.unit=Math.max(0,from.unit-1)}}else if((s.turn+from.index)%2===0){to.owner="e";to.unit=from.unit;from.unit=0}}
      const enemyCapital=s.tiles[sc.enemy];if(s.turn%3===0&&enemyCapital.owner==="e")enemyCapital.unit=Math.min(6,enemyCapital.unit+1)
    }
    function distance(a,b){return Math.abs(Math.floor(a/N)-Math.floor(b/N))+Math.abs(a%N-b%N)}
    function endTurn(s=state,testing=false){if(s.done)return resultOf(s);const m=ownedMetrics(s);s.food+=m.cities*6+m.owned.filter(t=>t.res==="food").length*4+(s.tech.agri?m.cities*3:0);s.prod+=m.cities*5+m.owned.filter(t=>t.res==="prod").length*4;s.science+=m.cities*4+m.owned.filter(t=>t.res==="science").length*5+(s.tech.academia?m.cities*3:0);enemyTurn(s);s.turn++;s.ap=s.tech.logistics?5:4;if(s.turn>scenario(s).turns&&!ownedMetrics(s).capital){s.done=true;s.stars=0;s.message="远征期限结束，王城仍未攻克。"}if(!testing)renderAll();return resultOf(s)}
    function save(){localStorage.setItem(STORAGE,JSON.stringify(profile))}
    function selectScenario(index,force=false){if(index<0||index>5||(!force&&index>profile.unlocked))return false;scenarioIndex=index;state=makeState(index);selected=null;renderAll();return true}
    function selectDoctrine(key){if(!DOCTRINES[key]||state.turn>1||state.ap<4)return false;doctrine=key;renderAll();return true}
    function pathfind(s,start,target){const queue=[start],prev=new Map([[start,null]]);while(queue.length){const at=queue.shift();if(at===target)break;for(let i=0;i<s.tiles.length;i++)if(!prev.has(i)&&near(at,i)&&canEnter(s,s.tiles[i])){prev.set(i,at);queue.push(i)}}if(!prev.has(target))return[];const out=[];for(let at=target;at!==null;at=prev.get(at))out.unshift(at);return out}
    function walkPath(s,path){selected=path[0];for(const index of path.slice(1)){if(s.ap<1)endTurn(s,true);const result=move(index,s,true);if(!result.ok||s.done)break}}
    function simulateReference(index){const oldDoctrine=doctrine,oldSelected=selected;doctrine="scholar";const s=makeState(index),sc=SCENARIOS[index],bonus=sc.bonus;if(bonus.kind==="tech")research(bonus.value,s,true);if(bonus.kind==="techs"){research("metal",s,true);research("cartography",s,true)}let current=sc.start;if(bonus.kind==="relics"){const target=s.tiles.find(t=>t.relic).index;const path=pathfind(s,current,target);walkPath(s,path);current=target}if(bonus.kind==="resources"){for(const target of s.tiles.filter(t=>t.res).slice(0,bonus.value).map(t=>t.index)){const path=pathfind(s,current,target);walkPath(s,path);current=target;if(s.done)break}}if(bonus.kind==="cities"){const candidate=pathfind(s,current,sc.enemy)[1];walkPath(s,[current,candidate]);current=candidate;settleCity(s,true)}if(!s.done)walkPath(s,pathfind(s,current,sc.enemy));const result=resultOf(s);doctrine=oldDoctrine;selected=oldSelected;return result}
    function applyReference(){const result=simulateReference(scenarioIndex),sc=SCENARIOS[scenarioIndex];doctrine="scholar";state=makeState(scenarioIndex);selected=sc.start;const bonus=sc.bonus;if(bonus.kind==="tech")research(bonus.value,state,true);if(bonus.kind==="techs"){research("metal",state,true);research("cartography",state,true)}let current=sc.start;if(bonus.kind==="relics"){const target=state.tiles.find(t=>t.relic).index;walkPath(state,pathfind(state,current,target));current=target}if(bonus.kind==="resources"){for(const target of state.tiles.filter(t=>t.res).slice(0,bonus.value).map(t=>t.index)){walkPath(state,pathfind(state,current,target));current=target;if(state.done)break}}if(bonus.kind==="cities"){const target=pathfind(state,current,sc.enemy)[1];walkPath(state,[current,target]);current=target;settleCity(state,true)}if(!state.done)walkPath(state,pathfind(state,current,sc.enemy));state.message=`参考远征：${result.stars} 星 / 第 ${result.turn} 时代完成。`;renderAll();return result}
    function validateContent(){const errors=[];for(const [i,sc] of SCENARIOS.entries()){if(sc.map.length!==8||sc.map.some(row=>row.length!==8))errors.push(`map ${i}`);const result=simulateReference(i);if(!result.ok||result.stars!==3)errors.push(`reference ${i}: ${JSON.stringify(result)}`)}return{valid:errors.length===0,errors,scenarios:SCENARIOS.length,tiles:SCENARIOS.length*64,doctrines:Object.keys(DOCTRINES).length,techs:Object.keys(TECHS).length,references:SCENARIOS.length}}
    function checksum(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
    function encode(){const payload=btoa(unescape(encodeURIComponent(JSON.stringify({v:2,u:profile.unlocked,s:profile.stars,b:profile.best,c:profile.clears}))));return`EMPIRE2.${payload}.${checksum(payload)}`}
    function decode(code){const p=String(code).trim().split(".");if(p.length!==3||p[0]!=="EMPIRE2"||checksum(p[1])!==p[2])throw Error("帝国档案校验失败");const data=JSON.parse(decodeURIComponent(escape(atob(p[1]))));if(data.v!==2)throw Error("帝国档案版本不兼容");return normalize({v:2,unlocked:data.u,stars:data.s,best:data.b,clears:data.c})}
    function tileLabel(t){if(!t.seen)return"未探索区域";const terrain=t.type==="mountain"?"山地":t.type==="water"?"水域":t.relic?"界碑":t.res==="food"?"粮田":t.res==="prod"?"矿脉":t.res==="science"?"学识遗迹":"平原";return`${terrain}${t.city?`，${t.owner==="p"?"帝国":"敌方"}城市`:""}${t.unit?`，${t.unit} 战力`:""}`}
    function renderCampaign(){$("campaign").innerHTML=SCENARIOS.map((sc,i)=>`<button class="mission ${i===scenarioIndex?"active":""}" data-scenario="${i}" ${i>profile.unlocked?"disabled":""}><span>${profile.stars[i]?"★".repeat(profile.stars[i]):i<=profile.unlocked?"待征":"锁定"}</span><strong>${i+1}. ${sc.name}</strong><small>${sc.region} · ${sc.turns} 时代</small></button>`).join("");$("campaign").querySelectorAll("[data-scenario]").forEach(b=>b.onclick=()=>selectScenario(+b.dataset.scenario))}
    function renderMap(){$("map").innerHTML=state.tiles.map((t,i)=>{const base=TERRAIN[t.code],icon=!t.seen?"":t.city?(t.owner==="p"?"🏛️":"🏰"):t.unit?(t.owner==="p"?"🛡️":"⚔️"):base.icon;return`<button class="tile ${t.type} ${t.seen?"":"fog"} ${t.owner==="e"?"enemy":""} ${selected===i?"selected":""} ${selected!==null&&near(selected,i)&&canEnter(state,t)?"reachable":""}" data-tile="${i}" aria-label="${tileLabel(t)}">${icon}${t.seen&&t.unit?`<small>${t.unit}</small>`:""}</button>`}).join("");$("map").querySelectorAll("[data-tile]").forEach(b=>b.onclick=()=>{const i=+b.dataset.tile,t=state.tiles[i];if(t.owner==="p"&&t.unit){selected=i;state.message="军团已选择，可移动、建城或招募。";renderAll()}else{const r=move(i);if(!r.ok){state.message=r.reason;renderAll()}}})}
    function renderRight(){const m=ownedMetrics();$("resources").innerHTML=[["粮食",state.food],["生产",state.prod],["科技",state.science],["行动",state.ap]].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join("");$("stats").innerHTML=[["城市",m.cities],["军团",m.units],["资源地",m.resources],["已探索",state.tiles.filter(t=>t.seen).length+"/64"]].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join("");const sc=scenario();const rows=[["攻占赤焰王城",m.capital],[`第 ${sc.par} 时代前完成`,state.done?state.turn<=sc.par:state.turn<=sc.par],[sc.bonus.label,bonusMet()]];$("goals").innerHTML=rows.map(x=>`<div class="goal-row ${x[1]?"ok":""}"><span>${x[0]}</span><b>${x[1]?"达成":"未达"}</b></div>`).join("");$("techs").innerHTML=Object.entries(TECHS).map(([key,t])=>`<button class="tech ${state.tech[key]?"done":""}" data-tech="${key}" ${state.tech[key]?"disabled":""}><strong>${t.name} · ${state.tech[key]?"完成":t.cost-(doctrine==="scholar"?8:0)+" 科技"}</strong><small>${t.text}</small></button>`).join("");$("techs").querySelectorAll("[data-tech]").forEach(b=>b.onclick=()=>{const r=research(b.dataset.tech);if(!r.ok){state.message=r.reason;renderAll()}});$("log").innerHTML=state.logs.slice(0,9).map(x=>`<div>· ${x}</div>`).join("")}
    function renderAll(){const sc=scenario();renderCampaign();renderMap();renderRight();$("doctrines").innerHTML=Object.entries(DOCTRINES).map(([key,d])=>`<button class="doctrine ${doctrine===key?"active":""}" data-doctrine="${key}" ${state.turn>1||state.ap<4?"disabled":""}><strong>${d.name}</strong><small>${d.text}</small></button>`).join("");$("doctrines").querySelectorAll("[data-doctrine]").forEach(b=>b.onclick=()=>selectDoctrine(b.dataset.doctrine));$("missionTitle").textContent=sc.name;$("missionBrief").textContent=sc.brief;$("turn").textContent=Math.min(state.turn,sc.turns);$("limit").textContent=sc.turns;$("ap").textContent=state.ap;$("message").textContent=state.message;$("endBtn").disabled=state.done;$("settleBtn").disabled=state.done;$("recruitBtn").disabled=state.done}
    $("endBtn").onclick=()=>endTurn();$("settleBtn").onclick=()=>{const r=settleCity();if(!r.ok){state.message=r.reason;renderAll()}};$("recruitBtn").onclick=()=>{const r=recruit();if(!r.ok){state.message=r.reason;renderAll()}};$("restartBtn").onclick=()=>selectScenario(scenarioIndex,true);$("referenceBtn").onclick=applyReference;$("archiveBtn").onclick=()=>{$("archiveText").value=encode();$("feedback").textContent="";$("archive").classList.remove("hidden")};$("closeBtn").onclick=()=>$("archive").classList.add("hidden");$("copyBtn").onclick=async()=>{$("archiveText").value=encode();$("archiveText").select();try{await navigator.clipboard.writeText($("archiveText").value);$("feedback").textContent="档案已复制。"}catch{$("feedback").textContent="档案已生成，请手动复制。"}};$("importBtn").onclick=()=>{try{profile=decode($("archiveText").value);save();scenarioIndex=Math.min(profile.unlocked,5);state=makeState(scenarioIndex);selected=null;$("feedback").textContent="导入成功。";renderAll()}catch(error){$("feedback").textContent=error.message}};
    window.__pocketEmpire={SCENARIOS,DOCTRINES,TECHS,profile:()=>profile,state:()=>state,selectScenario,selectDoctrine,move,settleCity,recruit,research,endTurn,ownedMetrics,simulateReference,applyReference,validateContent,encode,decode,renderAll};renderAll();
  })();
  </script>
