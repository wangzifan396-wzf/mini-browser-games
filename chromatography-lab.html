  <style>

r-radius:6px;color:var(--ink);background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}.action{min-height:40px;padding:0 13px;border:1px solid #a9bdba;border-radius:6px;color:var(--ink);background:#edf4f0;font-weight:900}.action.primary{border-color:var(--blue);color:#fff;background:var(--blue)}.status{min-height:26px;margin-top:10px;color:var(--muted);font-size:12px;font-weight:900}.status.good{color:var(--teal)}.status.bad{color:var(--red)}.archive{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;margin-top:12px}.archive input{min-width:0;height:39px;padding:0 10px;border:1px solid #a9bdba;border-radius:6px;background:#fff}.archive button{height:39px;padding:0 11px;border:1px solid #a9bdba;border-radius:6px;background:#edf4f0;font-weight:900}dialog{width:min(520px,calc(100vw - 28px));padding:0;border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);background:var(--paper);box-shadow:0 20px 55px rgba(8,30,35,.3)}dialog::backdrop{background:rgba(8,28,33,.45)}.dialog-inner{padding:20px}.dialog-inner h3{margin:0 0 8px}.dialog-inner p{margin:7px 0;color:var(--muted);font-size:13px;line-height:1.6}.dialog-close{float:right;min-height:36px;padding:0 12px;border:1px solid #a9bdba;border-radius:6px;background:#edf4f0;font-weight:900}@media(max-width:900px){.layout{grid-template-columns:1fr}.campaign{order:2}.contract-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.notice{display:none}}@media(max-width:620px){.shell{width:calc(100vw - 18px)}.top-inner{display:block}.top-links{margin-top:16px}.top-links a{flex:1}.layout{padding-top:12px}.chart-panel,.control-panel,.campaign{padding:12px}.chart-head{display:block}.metrics{justify-content:flex-start;margin-top:10px}.metric{flex:1;min-width:0;text-align:left}.canvas-wrap canvas{height:250px}.controls{grid-template-columns:1fr 1fr}.archive{grid-template-columns:1fr 1fr}.archive input{grid-column:1/-1}.archive button{widt <body>
  <header class="top"><div class="shell top-inner"><div><p class="eyebrow">SEPARATION SCIENCE · CHROMA2</p><h1>色谱实验室</h1><p>十二份混合物分离委托。选择色谱柱、溶剂梯度、柱温与流速，让每个峰既分得开，也能按时洗脱。</p></div><nav class="top-links" aria-label="项目链接"><a class="primary" href="index.html">游戏目录</a><a href="https://github.com/wangzifan396-wzf/mini-browser-games">GitHub</a></nav></div></header>
  <main class="shell layout">
    <aside class="panel campaign"><h2 class="panel-title"><span>样品队列</span><span id="progressText">0 / 12</span></h2><div id="contractList"></div><p class="notice">这是用于规则学习的简化模型，不用于真实实验、医疗、食品或环境检测决策。</p></aside>
    <section class="lab">
      <section class="panel chart-panel"><div class="chart-head"><div><h2 id="contractTitle">载入样品</h2><p id="contractBrief">正在校准检测器。</p></div><div class="metrics"><div class="metric"><b id="resolutionMetric">--</b><span>最小分离度</span></div><div class="metric"><b id="runtimeMetric">--</b><span>运行时间</span></div><div class="metric"><b id="starMetric">--</b><span>当前星级</span></div></div></div><div class="canvas-wrap"><canvas id="chromCanvas" width="920" height="310" aria-label="色谱图"></canvas></div><div class="sample-list" id="sampleList"></div></section>
      <section class="panel control-panel"><div class="control-head"><div><h3>方法开发台</h3><p>改变任一参数都会重新计算保留时间、峰宽与分离度。</p></div><div class="goal" id="goalText">目标载入中</div></div><div class="controls"><div class="field"><label for="columnSelect">固定相</label><select id="columnSelect"></select></div><div class="field"><label for="gradientSelect">溶剂梯度</label><select id="gradientSelect"></select></div><div class="field"><label for="tempSelect">柱温</label><select id="tempSelect"></select></div><div class="field"><label for="flowSelect">流速</label><select id="flowSelect"></select></div></div><div class="actions"><button class="action primary" id="verifyButton">提交方法</button><button class="action" id="hintButton" title="校准一个参数">⌁ 方法提示</button><button class="action" id="undoButton" title="撤回上一步">↶ 撤回</button><button class="action" id="resetButton" title="恢复初始方法">⌫ 重置</button></div><div class="status" id="statusText">选择参数后观察峰形。</div><div class="archive"><input id="archiveCode" placeholder="CHROMA2. 跨设备档案码" aria-label="CHROMA2 档案码"><button id="exportButton">导出档案</button><button id="importButton">导入档案</button></div></section>
    </section>
  </main>
  <dialog id="resultDialog"><div class="dialog-inner"><button class="dialog-close" id="closeDialog">关闭</button><h3 id="dialogTitle">方法验收</h3><p id="dialogSummary"></p><p id="dialogDetail"></p></div></dialog>
  <script>
  (()=>{
    const COLUMNS={c18:{label:"C18 反相",mode:"reverse",aromatic:.05,shape:.12},phenyl:{label:"苯基选择",mode:"reverse",aromatic:.32,shape:-.08},silica:{label:"硅胶正相",mode:"normal",aromatic:.08,shape:.18}};
    const GRADIENTS={gentle:{label:"缓升 20→55%",start:.2,end:.55},balanced:{label:"均衡 30→75%",start:.3,end:.75},steep:{label:"陡升 45→95%",start:.45,end:.95}};
    const TEMPS={cool:{label:"35 °C",value:35},warm:{label:"50 °C",value:50},hot:{label:"65 °C",value:65}};
    const FLOWS={slow:{label:"0.8 mL/min",value:.8},normal:{label:"1.0 mL/min",value:1},fast:{label:"1.2 mL/min",value:1.2}};
    const P={
      caffeine:["咖啡因",.72,.46,1,.42,"#dd8c49"],theobromine:["可可碱",.82,.38,1,.46,"#b96d51"],vanillin:["香草醛",.63,.55,1,.36,"#d4a04e"],cinnamal:["肉桂醛",.24,.68,1,.34,"#c56750"],limonene:["柠檬烯",.12,.82,0,.31,"#e3bc3e"],linalool:["芳樟醇",.38,.74,0,.35,"#8ebf62"],pinene:["蒎烯",.09,.88,0,.29,"#5bad75"],menthol:["薄荷醇",.29,.66,0,.38,"#57b5a5"],aspirin:["阿司匹林",.58,.37,1,.41,"#d87673"],para:["对乙酰氨基酚",.78,.28,1,.43,"#a878c4"],ibuprofen:["布洛芬",.31,.25,1,.48,"#668ac7"],naproxen:["萘普生",.42,.18,1,.52,"#526bb5"],anthracene:["蒽",.08,.08,1,.55,"#8a6c9d"],naph:["萘",.1,.6,1,.44,"#6e81a4"],fluorene:["芴",.12,.33,1,.49,"#5b6f89"],phenol:["苯酚",.66,.57,1,.33,"#c98b68"],aniline:["苯胺",.52,.52,1,.36,"#bd7b8d"],toluene:["甲苯",.09,.9,1,.3,"#d3a35d"],xylene:["二甲苯",.07,.56,1,.34,"#cb8654"],ethylbenz:["乙苯",.08,.72,1,.32,"#c39955"],chlorophyll:["叶绿素片段",.22,.05,1,.65,"#3f9e68"],carotene:["胡萝卜素",.04,.04,0,.68,"#df8437"],lutein:["叶黄素",.16,.06,1,.61,"#d6b43d"],indigo:["靛蓝片段",.48,.08,1,.59,"#4f69b7"],rhodamine:["罗丹明标记",.92,.12,1,.54,"#d35a91"],fluorescein:["荧光素标记",.84,.16,1,.51,"#76b850"],acetone:["丙酮",.74,.94,0,.25,"#77a9bc"],ethanol:["乙醇",.88,.98,0,.22,"#79b4a3"],ethylacet:["乙酸乙酯",.47,.9,0,.28,"#8fa6cd"],butanol:["正丁醇",.58,.72,0,.33,"#8fc28d"]};
    const compound=key=>{const [name,polarity,volatility,aromatic,size,color]=P[key];return{key,name,polarity,volatility,aromatic,size,color}};
    const CONTRACTS=[
      {id:"coffee",chapter:0,title:"晨间咖啡",brief:"分开生物碱与烘焙香气。",items:["caffeine","theobromine","vanillin"],reference:{column:"c18",gradient:"gentle",temp:"warm",flow:"normal"}},
      {id:"citrus",chapter:0,title:"柑橘精油",brief:"处理挥发性相近的萜烯组分。",items:["limonene","linalool","pinene","menthol"],reference:{column:"silica",gradient:"gentle",temp:"cool",flow:"slow"}},
      {id:"spice",chapter:0,title:"香辛料谱",brief:"芳香醛与萜烯需要不同选择性。",items:["vanillin","cinnamal","limonene","linalool"],reference:{column:"phenyl",gradient:"balanced",temp:"warm",flow:"slow"}},
      {id:"pain",chapter:1,title:"镇痛样品",brief:"四种芳香族组分保留接近。",items:["aspirin","para","ibuprofen","naproxen"],reference:{column:"c18",gradient:"balanced",temp:"hot",flow:"normal"}},
      {id:"aromatic",chapter:1,title:"芳烃阶梯",brief:"利用苯基固定相放大结构差异。",items:["anthracene","naph","fluorene","toluene"],reference:{column:"phenyl",gradient:"gentle",temp:"cool",flow:"normal"}},
      {id:"solvent",chapter:1,title:"溶剂残留",brief:"高挥发组分快速洗脱，避免首峰重叠。",items:["acetone","ethanol","ethylacet","butanol"],reference:{column:"silica",gradient:"steep",temp:"hot",flow:"fast"}},
      {id:"ink",chapter:2,title:"档案墨水",brief:"极性跨度较大的染料需要平衡梯度。",items:["indigo","rhodamine","fluorescein","phenol"],reference:{column:"silica",gradient:"balanced",temp:"warm",flow:"normal"}},
      {id:"leaf",chapter:2,title:"叶片色素",brief:"大分子色素峰宽明显，需降低流速。",items:["chlorophyll","carotene","lutein","indigo"],reference:{column:"c18",gradient:"steep",temp:"hot",flow:"slow"}},
      {id:"river",chapter:2,title:"河口筛查",brief:"芳香族与极性标记物混在同一水样。",items:["phenol","aniline","toluene","fluorescein","caffeine"],reference:{column:"phenyl",gradient:"steep",temp:"warm",flow:"fast"}},
      {id:"factory",chapter:3,title:"涂料车间",brief:"三种烷基苯和含氧溶剂形成密集峰群。",items:["toluene","xylene","ethylbenz","ethylacet","butanol"],reference:{column:"phenyl",gradient:"balanced",temp:"hot",flow:"slow"}},
      {id:"clinic",chapter:3,title:"联合质控",brief:"药物、标记物和溶剂跨越宽极性区间。",items:["aspirin","para","ibuprofen","rhodamine","acetone"],reference:{column:"c18",gradient:"steep",temp:"cool",flow:"fast"}},
      {id:"finale",chapter:3,title:"盲样终验",brief:"六组分盲样同时考查选择性、时间与峰宽。",items:["caffeine","vanillin","cinnamal","linalool","naph","fluorescein"],reference:{column:"silica",gradient:"gentle",temp:"hot",flow:"normal"}},
    ];
    const CHAPTERS=["食品风味","方法校准","环境档案","综合质控"],ARCHIVE="CHROMA2",history=[];let profile=freshProfile(),state=null;
    const $=id=>document.getElementById(id),clone=value=>JSON.parse(JSON.stringify(value));
    function hash(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,"0")}
    function to64(text){const bytes=new TextEncoder().encode(text);let raw="";for(const byte of bytes)raw+=String.fromCharCode(byte);return btoa(raw).replace(/=+$/g,"").replace(/\+/g,"-").replace(/\//g,"_")}
    function from64(code){const raw=atob(code.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((code.length+3)%4));return new TextDecoder().decode(Uint8Array.from(raw,c=>c.charCodeAt(0)))}
    function freshProfile(){return{contract:0,stars:Array(CONTRACTS.length).fill(0),bestResolution:Array(CONTRACTS.length).fill(null),clears:Array(CONTRACTS.length).fill(0)}}
    function simulate(spec,config){const column=COLUMNS[config.column],gradient=GRADIENTS[config.gradient],temp=TEMPS[config.temp].value,flow=FLOWS[config.flow].value;const peaks=spec.compounds.map(item=>{const affinity=column.mode==="reverse"?1-item.polarity:item.polarity,selectivity=Math.max(.04,affinity*(1+column.aromatic*item.aromatic)+column.shape*(item.volatility-.5)),solvent=gradient.start+(gradient.end-gradient.start)*(.22+.72*affinity);const retention=(1.1+8.6*selectivity)/(.48+1.55*solvent)*Math.pow(50/temp,.58)/flow+(1-item.volatility)*1.25;const width=.055+item.size*.05+retention*.004*(1.15/flow);return{...item,retention,width}}).sort((a,b)=>a.retention-b.retention);let minResolution=Infinity;for(let i=1;i<peaks.length;i++){const value=2*(peaks[i].retention-peaks[i-1].retention)/(peaks[i].width+peaks[i-1].width);minResolution=Math.min(minResolution,value)}const runtime=peaks.at(-1).retention+peaks.at(-1).width*2;return{peaks,minResolution:Number.isFinite(minResolution)?minResolution:0,runtime}}
    CONTRACTS.forEach(spec=>{spec.compounds=spec.items.map(compound);const reference=simulate(spec,spec.reference);spec.goalResolution=Math.max(1.5,reference.minResolution*.92);spec.goalRuntime=reference.runtime*1.06;spec.maxRuntime=reference.runtime*1.28;spec.referenceResult=reference;spec.chapterName=CHAPTERS[spec.chapter]});
    function evaluate(spec,config,hints=0){const result=simulate(spec,config),allEluted=result.runtime<=spec.maxRuntime,won=allEluted&&result.minResolution>=spec.goalResolution;let stars=won?1:0;if(won&&result.runtime<=spec.goalRuntime)stars=2;if(stars===2&&hints===0)stars=3;return{...result,allEluted,won,stars}}
    function defaultConfig(){return{column:"phenyl",gradient:"gentle",temp:"cool",flow:"slow"}}
    function freshState(index=profile.contract){return{index,config:defaultConfig(),hints:0,edits:0,result:null}}
    function snapshot(){return clone({index:state.index,config:state.config,hints:state.hints,edits:state.edits})}
    function restore(saved){state={...freshState(saved.index),...saved};refresh()}
    function pushHistory(){history.push(snapshot());if(history.length>30)history.shift()}
    function begin(index){profile.contract=Math.max(0,Math.min(CONTRACTS.length-1,index));state=freshState(profile.contract);history.length=0;refresh()}
    function setConfig(patch,record=true){if(record)pushHistory();state.config={...state.config,...patch};state.edits++;state.result=null;refresh()}
    function reset(){pushHistory();state.config=defaultConfig();state.edits++;state.result=null;refresh()}
    function undo(){const saved=history.pop();if(saved)restore(saved)}
    function hint(){const reference=CONTRACTS[state.index].reference,key=["column","gradient","temp","flow"].find(name=>state.config[name]!==reference[name]);if(!key){setStatus("当前方法已经与参考方法一致。","good");return}pushHistory();state.config[key]=reference[key];state.hints++;state.edits++;state.result=null;refresh();setStatus(`方法提示已校准“${{column:"固定相",gradient:"溶剂梯度",temp:"柱温",flow:"流速"}[key]}”。`)}
    function verify(){const spec=CONTRACTS[state.index],result=evaluate(spec,state.config,state.hints);state.result=result;profile.clears[state.index]++;if(result.won){profile.stars[state.index]=Math.max(profile.stars[state.index],result.stars);if(profile.bestResolution[state.index]===null||result.minResolution>profile.bestResolution[state.index])profile.bestResolution[state.index]=result.minResolution;saveProfile()}refresh();showResult(spec,result)}
    function saveProfile(){localStorage.setItem("chromatography-lab-profile",JSON.stringify(profile))}
    function loadProfile(){try{const raw=JSON.parse(localStorage.getItem("chromatography-lab-profile")||"null");if(raw?.stars?.length===CONTRACTS.length)profile={...freshProfile(),...raw}}catch{profile=freshProfile()}}
    function setStatus(text,tone=""){const node=$("statusText");node.textContent=text;node.className=`status ${tone}`}
    function fillSelect(id,options,key){const node=$(id);node.innerHTML=Object.entries(options).map(([value,item])=>`<option value="${value}"${state.config[key]===value?" selected":""}>${item.label}</option>`).join("")}
    function renderContracts(){const host=$("contractList");host.replaceChildren();CHAPTERS.forEach((chapter,chapterIndex)=>{const label=document.createElement("div");label.className="chapter";label.textContent=chapter;host.append(label);const grid=document.createElement("div");grid.className="contract-grid";CONTRACTS.filter(item=>item.chapter===chapterIndex).forEach(spec=>{const index=CONTRACTS.indexOf(spec),button=document.createElement("button");button.className=`contract${index===state.index?" active":""}${profile.stars[index]>=3?" done":""}`;button.dataset.index=index;button.innerHTML=`<strong>${String(index+1).padStart(2,"0")} · ${spec.title}</strong><small>${profile.stars[index]?"★".repeat(profile.stars[index])+" · ":""}${spec.compounds.length} 组分</small>`;grid.append(button)});host.append(grid)});$("progressText").textContent=`${profile.stars.filter(Boolean).length} / ${CONTRACTS.length}`}
    function draw(result,spec){const canvas=$("chromCanvas"),ctx=canvas.getContext("2d"),w=canvas.width,h=canvas.height,pad={l:48,r:20,t:22,b:36},plotW=w-pad.l-pad.r,plotH=h-pad.t-pad.b,maxTime=Math.max(spec.maxRuntime,result.runtime)*1.05;ctx.clearRect(0,0,w,h);ctx.fillStyle="#102f36";ctx.fillRect(0,0,w,h);ctx.strokeStyle="rgba(207,235,228,.15)";ctx.lineWidth=1;for(let i=0;i<=6;i++){const x=pad.l+plotW*i/6;ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,h-pad.b);ctx.stroke();ctx.fillStyle="#a9c2c1";ctx.font="11px system-ui";ctx.textAlign="center";ctx.fillText((maxTime*i/6).toFixed(1),x,h-12)}for(let i=0;i<=4;i++){const y=pad.t+plotH*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke()}const samples=360,curve=[];for(let i=0;i<samples;i++){const time=maxTime*i/(samples-1);let y=0;for(const peak of result.peaks)y+=Math.exp(-.5*Math.pow((time-peak.retention)/peak.width,2));curve.push(y)}const maxY=Math.max(1,...curve);ctx.strokeStyle="#69c6b2";ctx.lineWidth=2.4;ctx.beginPath();curve.forEach((value,index)=>{const x=pad.l+plotW*index/(samples-1),y=h-pad.b-value/maxY*plotH*.82;index?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();result.peaks.forEach((peak,index)=>{const x=pad.l+plotW*peak.retention/maxTime,y=h-pad.b-Math.exp(0)/maxY*plotH*.82,markerY=Math.max(pad.t+9,y-5),labelY=Math.max(pad.t+12,markerY-12-(index%2)*16);ctx.fillStyle=peak.color;ctx.beginPath();ctx.arc(x,markerY,5,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(x,labelY);ctx.rotate(-.42);ctx.fillStyle="#e9f4f0";ctx.font="10px system-ui";ctx.textAlign="center";ctx.fillText(peak.name,0,0);ctx.restore()});ctx.fillStyle="#a9c2c1";ctx.font="11px system-ui";ctx.textAlign="right";ctx.fillText("min",w-pad.r,h-12)}
    function renderSamples(spec){const host=$("sampleList");host.innerHTML=spec.compounds.map(item=>`<span class="sample"><i style="background:${item.color}"></i>${item.name}</span>`).join("")}
    function refresh(){const spec=CONTRACTS[state.index],result=evaluate(spec,state.config,state.hints);$("contractTitle").textContent=`${String(state.index+1).padStart(2,"0")} · ${spec.title}`;$("contractBrief").textContent=spec.brief;$("resolutionMetric").textContent=result.minResolution.toFixed(2);$("runtimeMetric").textContent=`${result.runtime.toFixed(1)} min`;$("starMetric").textContent=result.stars?"★".repeat(result.stars):"—";$("goalText").innerHTML=`分离度 ≥ ${spec.goalResolution.toFixed(2)}<br>三星时间 ≤ ${spec.goalRuntime.toFixed(1)} min`;fillSelect("columnSelect",COLUMNS,"column");fillSelect("gradientSelect",GRADIENTS,"gradient");fillSelect("tempSelect",TEMPS,"temp");fillSelect("flowSelect",FLOWS,"flow");renderContracts();renderSamples(spec);draw(result,spec)}
    function showResult(spec,result){$("dialogTitle").textContent=result.won?`${spec.title} · 分离通过`:`${spec.title} · 方法未通过`;$("dialogSummary").textContent=result.won?`获得 ${result.stars} 星；最小分离度 ${result.minResolution.toFixed(2)}，运行时间 ${result.runtime.toFixed(1)} 分钟。`:`当前最小分离度 ${result.minResolution.toFixed(2)}，目标 ${spec.goalResolution.toFixed(2)}；运行时间 ${result.runtime.toFixed(1)} 分钟。`;$("dialogDetail").textContent=result.won?"方法已写入本地档案，可以继续处理下一份样品。":result.allEluted?"相邻峰仍有重叠，尝试改变固定相选择性或放缓梯度。":"末峰未在时间窗内洗脱，尝试增强梯度、升温或提高流速。";$("resultDialog").showModal()}
    function encodeArchive(){const data={contract:profile.contract,stars:profile.stars,bestResolution:profile.bestResolution,clears:profile.clears},body=JSON.stringify(data);return`${ARCHIVE}.${to64(JSON.stringify({...data,check:hash(body)}))}`}
    function decodeArchive(code){if(typeof code!=="string"||!code.startsWith(`${ARCHIVE}.`))throw Error("档案前缀错误");const payload=JSON.parse(from64(code.slice(ARCHIVE.length+1))),{check,...data}=payload;if(check!==hash(JSON.stringify(data)))throw Error("档案校验失败");if(!Array.isArray(data.stars)||data.stars.length!==CONTRACTS.length)throw Error("档案内容错误");return data}
    function exportArchive(){$("archiveCode").value=encodeArchive();setStatus("档案已生成，可复制到另一台设备。","good")}
    function importArchive(){try{profile={...freshProfile(),...decodeArchive($("archiveCode").value.trim())};saveProfile();begin(profile.contract);setStatus("档案导入成功。","good")}catch(error){setStatus(`导入失败：${error.message}`,"bad")}}
    $("contractList").addEventListener("click",event=>{const button=event.target.closest("[data-index]");if(button)begin(Number(button.dataset.index))});[["columnSelect","column"],["gradientSelect","gradient"],["tempSelect","temp"],["flowSelect","flow"]].forEach(([id,key])=>$(id).addEventListener("change",event=>setConfig({[key]:event.target.value})));$("verifyButton").addEventListener("click",verify);$("hintButton").addEventListener("click",hint);$("undoButton").addEventListener("click",undo);$("resetButton").addEventListener("click",reset);$("exportButton").addEventListener("click",exportArchive);$("importButton").addEventListener("click",importArchive);$("closeDialog").addEventListener("click",()=>$("resultDialog").close());
    loadProfile();state=freshState(profile.contract);window.__chromatographyTest={columns:COLUMNS,gradients:GRADIENTS,temps:TEMPS,flows:FLOWS,contracts:CONTRACTS,chapters:CHAPTERS,getState:()=>clone(state),freshProfile,begin,setConfig:(config)=>{state.config={...defaultConfig(),...config};state.hints=0;state.result=null;refresh()},evaluate:(index,config)=>evaluate(CONTRACTS[index],config,0),encodeArchive,decodeArchive,validateContent:()=>{const references=CONTRACTS.map((spec,index)=>{const result=evaluate(spec,spec.reference,0);return{id:spec.id,won:result.won,stars:result.stars,resolution:result.minResolution,runtime:result.runtime,compounds:spec.compounds.length,config:Object.values(spec.reference).join("/")}});return{contracts:CONTRACTS.length,chapters:CHAPTERS.length,compounds:CONTRACTS.reduce((sum,item)=>sum+item.compounds.length,0),uniqueCompounds:new Set(CONTRACTS.flatMap(item=>item.items)).size,columns:Object.keys(COLUMNS).length,gradients:Object.keys(GRADIENTS).length,temperatures:Object.keys(TEMPS).length,flows:Object.keys(FLOWS).length,uniqueReferences:new Set(references.map(item=>item.config)).size,referenceWins:references.filter(item=>item.won).length,referenceThreeStars:references.filter(item=>item.stars===3).length,references}}};refresh();
  })();
