<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#102b36">
    <title>万象爪局：十二柜收藏委托</title>
    <style>
      * { box-sizing: border-box; }
      :root {
        --ink: #10232d;
        --muted: #58717a;
        --paper: #f5f8f5;
        --panel: #ffffff;
        --line: #c8d7d7;
        --teal: #176f78;
        --teal-dark: #0f545d;
        --coral: #d65f4a;
        --gold: #d5a431;
        --sky: #b9e0df;
      }
      html, body { margin: 0; min-height: 100%; }
      body {
        color: var(--ink);
        background-color: #102b36;
        background-image: linear-gradient(#173b47 1px, transparent 1px), linear-gradient(90deg, #173b47 1px, transparent 1px);
        background-size: 32px 32px;
        font-family: system-ui, "Microsoft YaHei", sans-serif;
      }
      button, textarea { font: inherit; letter-spacing: 0; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .42; }
      .app-shell { width: min(1380px, calc(100vw - 28px)); margin: 14px auto 24px; }
      .topbar {
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        padding: 16px 20px; border: 1px solid var(--line); border-radius: 8px; background: #eef6f4;
      }
      .eyebrow { margin: 0 0 3px; color: #8a6410; font-size: 12px; font-weight: 900; }
      h1 { margin: 0; font-size: clamp(30px, 4vw, 50px); line-height: 1; letter-spacing: 0; }
      h2, h3, p { margin-top: 0; }
      .top-actions, .button-row, .touch-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      button {
        min-height: 42px; border: 1px solid #8fa9aa; border-radius: 7px; padding: 9px 13px;
        color: var(--ink); background: #fff; font-weight: 850;
      }
      button:hover:not(:disabled) { border-color: var(--teal); }
      .primary { color: white; border-color: var(--teal); background: var(--teal); }
      .primary:hover:not(:disabled) { background: var(--teal-dark); }
      .accent { color: white; border-color: var(--coral); background: var(--coral); }
      .icon-button { width: 44px; padding: 0; font-size: 22px; }
      .contract-strip {
        display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 14px; align-items: center;
        margin: 12px 0; padding: 12px 16px; border: 1px solid var(--line); border-radius: 8px; background: #fffdf7;
      }
      .contract-strip strong, .contract-strip span { display: block; }
      .contract-strip span { margin-top: 2px; color: var(--muted); font-size: 13px; }
      .contract-stars { color: #b88718; font-size: 22px; white-space: nowrap; }
      .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
      .machine-panel {
        position: relative; min-height: 650px; aspect-ratio: 16 / 10; overflow: hidden;
        border: 1px solid #80a6a8; border-radius: 8px; background: #88c8cb;
      }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .hud {
        position: absolute; z-index: 3; left: 12px; right: 12px; top: 12px;
        display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; pointer-events: none;
      }
      .stat { min-width: 0; padding: 8px 10px; border-radius: 7px; color: white; background: rgba(16, 43, 54, .82); }
      .stat span, .stat b { display: block; overflow-wrap: anywhere; }
      .stat span { font-size: 11px; color: #d8eeee; }
      .stat b { margin-top: 1px; font-size: 18px; }
      .confidence {
        position: absolute; z-index: 3; top: 84px; right: 12px; width: min(210px, 43%);
        padding: 8px 10px; border: 1px solid rgba(255,255,255,.55); border-radius: 7px; color: white; background: rgba(16,43,54,.78);
      }
      .confidence div { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 850; }
      .confidence meter { width: 100%; height: 8px; }
      .touch-controls {
        position: absolute; z-index: 4; left: 12px; right: 12px; bottom: 12px; justify-content: center;
      }
      .touch-controls button { flex: 1 1 90px; height: 50px; font-size: 24px; background: rgba(255,255,255,.94); }
      .touch-controls .drop-button { flex: 1.4 1 130px; color: white; border-color: var(--coral); background: var(--coral); }
      .overlay {
        position: absolute; z-index: 7; inset: 0; display: grid; place-items: center; padding: 18px;
        background: rgba(9, 30, 38, .63);
      }
      .overlay[hidden] { display: none; }
      .dialog {
        width: min(500px, 100%); max-height: 88%; overflow: auto; padding: 20px;
        border: 1px solid #aac2c2; border-radius: 8px; background: #fffdf8;
      }
      .dialog h2 { margin-bottom: 8px; font-size: 26px; }
      .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
      .result-grid div { padding: 10px; border: 1px solid #dfcf9b; border-radius: 7px; background: #fff8df; }
      .result-grid span, .result-grid b { display: block; }
      .result-grid span { color: var(--muted); font-size: 12px; }
      .result-grid b { font-size: 20px; }
      .side-panel { display: grid; gap: 12px; }
      .board { padding: 15px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
      .board h2 { margin-bottom: 12px; font-size: 22px; }
      .record-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .record {
        padding: 10px; border: 1px solid #dec98b; border-radius: 7px; background: #fff9e8;
      }
      .record span, .record b { display: block; }
      .record span { color: #775f28; font-size: 11px; }
      .record b { margin-top: 3px; font-size: 20px; }
      .status { min-height: 42px; margin: 10px 0 0; color: var(--muted); font-weight: 750; }
      .goal-list { display: grid; gap: 8px; }
      .goal {
        display: grid; grid-template-columns: 42px 1fr auto; gap: 9px; align-items: center;
        padding: 9px; border: 1px solid #d8c78e; border-radius: 7px; background: #fffdf5;
      }
      .goal-icon { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 7px; background: #e5f1ef; font-size: 22px; }
      .goal span { color: var(--muted); font-size: 12px; }
      .goal b { font-size: 14px; }
      .order-list { display: flex; flex-wrap: wrap; gap: 6px; }
      .order-chip { padding: 5px 8px; border: 1px solid #aec4c3; border-radius: 6px; background: white; }
      .order-chip.done { border-color: #679c79; background: #e5f2e7; }
      .screen-modal {
        position: fixed; z-index: 20; inset: 0; overflow: auto; padding: 18px; background: rgba(7,24,30,.76);
      }
      .screen-modal[hidden] { display: none; }
      .screen-card { width: min(980px, 100%); margin: 0 auto; padding: 20px; border-radius: 8px; background: #f7faf7; }
      .loadout-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .loadout-button { min-height: 92px; text-align: left; }
      .loadout-button strong, .loadout-button span { display: block; }
      .loadout-button span { margin-top: 5px; color: var(--muted); font-size: 12px; }
      .loadout-button.active { border-color: var(--teal); box-shadow: inset 0 0 0 2px var(--teal); }
      .cabinet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
      .cabinet-card { min-height: 96px; text-align: left; }
      .cabinet-card strong, .cabinet-card span { display: block; }
      .cabinet-card span { margin-top: 5px; color: var(--muted); font-size: 12px; }
      .cabinet-card.active { border-color: var(--coral); box-shadow: inset 0 0 0 2px var(--coral); }
      .archive-box { width: 100%; min-height: 150px; resize: vertical; padding: 10px; border: 1px solid #9db5b5; border-radius: 7px; }
      .collection { display: grid; grid-template-columns: repeat(8, 1fr); gap: 7px; }
      .collection span { display: grid; place-items: center; min-height: 42px; border: 1px solid #c3d3d2; border-radius: 6px; background: white; font-size: 22px; }
      .collection span.locked { filter: grayscale(1); opacity: .32; }
      @media (max-width: 900px) {
        .layout { grid-template-columns: 1fr; }
        .machine-panel { min-height: 590px; }
        .side-panel { grid-template-columns: 1fr 1fr; }
      }
      @media (max-width: 620px) {
        .app-shell { width: min(100vw - 16px, 620px); margin: 8px auto 18px; }
        .topbar { display: grid; padding: 13px; }
        h1 { font-size: 34px; }
        .top-actions { display: grid; grid-template-columns: repeat(3, 1fr); }
        .top-actions button { width: auto; padding: 8px; }
        .contract-strip { grid-template-columns: 1fr auto; }
        .contract-strip > div:first-child { grid-column: 1 / -1; }
        .machine-panel { height: 600px; min-height: 0; aspect-ratio: auto; }
        .hud { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .confidence { top: 155px; }
        .side-panel { grid-template-columns: 1fr; }
        .loadout-grid, .cabinet-grid { grid-template-columns: 1fr; }
        .collection { grid-template-columns: repeat(4, 1fr); }
        .result-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">固定机台 · 确定性抓力 · 收藏巡回</p>
          <h1>万象爪局</h1>
        </div>
        <div class="top-actions">
          <button id="cabinetButton" type="button">柜台</button>
          <button id="archiveButton" type="button">档案</button>
          <button id="startTop" class="primary" type="button">开局</button>
          <button id="pauseButton" type="button">暂停</button>
          <button id="muteButton" class="icon-button" type="button" title="音效" aria-label="音效">♪</button>
        </div>
      </header>

      <section class="contract-strip" aria-label="当前收藏委托">
        <div><strong id="cabinetName">1. 晨光软偶柜</strong><span id="cabinetRule">基础抓力与低摆幅教学</span></div>
        <div><strong id="loadoutName">校准员 · 平衡爪</strong><span id="contractGoals">完成订单 · 参考币数 · 柜台挑战</span></div>
        <div class="contract-stars" id="cabinetStars">☆☆☆</div>
      </section>

      <main class="layout">
        <section class="machine-panel" id="machinePanel" aria-label="万象爪局抓取机台">
          <canvas id="gameCanvas"></canvas>
          <div class="hud">
            <div class="stat"><span>代币</span><b id="tokenText">0</b></div>
            <div class="stat"><span>委托</span><b id="orderText">0/0</b></div>
            <div class="stat"><span>得分</span><b id="scoreText">0</b></div>
            <div class="stat"><span>连抓</span><b id="comboText">x0</b></div>
            <div class="stat"><span>摆幅</span><b id="swingText">稳</b></div>
          </div>
          <div class="confidence">
            <div><span>当前抓取余量</span><b id="confidenceText">--</b></div>
            <meter id="confidenceMeter" min="0" max="1" value="0"></meter>
          </div>
          <div class="touch-controls">
            <button id="leftButton" type="button" title="左移" aria-label="左移">←</button>
            <button id="dropButton" class="drop-button" type="button" title="下爪" aria-label="下爪">↓</button>
            <button id="rightButton" type="button" title="右移" aria-label="右移">→</button>
            <button id="brakeButton" type="button" title="稳爪" aria-label="稳爪">◎</button>
          </div>

          <div class="overlay" id="readyOverlay">
            <div class="dialog">
              <p class="eyebrow">COLLECTION CONTRACT</p>
              <h2 id="readyTitle">晨光软偶柜</h2>
              <p id="readyText"></p>
              <div class="button-row">
                <button id="startButton" class="primary" type="button">投入代币</button>
                <button id="selectButton" type="button">选择柜台</button>
              </div>
            </div>
          </div>
          <div class="overlay" id="pauseOverlay" hidden>
            <div class="dialog"><h2>机台暂停</h2><p>机械爪已锁在导轨上。</p><div class="button-row"><button id="resumeButton" class="primary" type="button">继续</button><button id="restartPause" type="button">重开</button></div></div>
          </div>
          <div class="overlay" id="resultOverlay" hidden>
            <div class="dialog">
              <p class="eyebrow">CABINET REPORT</p><h2 id="resultTitle">委托结算</h2><p id="resultText"></p>
              <div class="result-grid"><div><span>评价</span><b id="resultStars">☆☆☆</b></div><div><span>使用代币</span><b id="resultTurns">0</b></div><div><span>收藏分</span><b id="resultScore">0</b></div></div>
              <div class="button-row"><button id="retryButton" class="primary" type="button">重抓本柜</button><button id="nextButton" type="button">下一柜</button></div>
            </div>
          </div>
        </section>

        <aside class="side-panel">
          <section class="board">
            <h2>巡回档案</h2>
            <div class="record-grid">
              <div class="record"><span>当前星章</span><b id="currentStars">0/3</b></div>
              <div class="record"><span>最佳代币</span><b id="bestTurns">--</b></div>
              <div class="record"><span>巡回星章</span><b id="totalStars">0/36</b></div>
              <div class="record"><span>图鉴</span><b id="dexText">0/16</b></div>
            </div>
            <p class="status" id="statusText">固定柜台已装载。</p>
          </section>
          <section class="board">
            <h2>本柜委托</h2>
            <div class="order-list" id="orderList"></div>
            <div class="goal-list" id="goalList"></div>
          </section>
          <section class="board">
            <h2>万象图鉴</h2>
            <div class="collection" id="collection"></div>
          </section>
        </aside>
      </main>
    </div>

    <div class="screen-modal" id="screenModal" hidden role="dialog" aria-modal="true" aria-labelledby="screenTitle">
      <section class="screen-card">
        <p class="eyebrow" id="screenKicker">十二柜收藏巡回</p>
        <h2 id="screenTitle">万象柜台</h2>
        <div id="screenBody"></div>
      </section>
    </div>

          ui.goalList.innerHTML = `
            <div class="goal"><span class="goal-icon">箱</span><div><b>完成收藏订单</b><span>集齐本柜指定奖品</span></div><b>${requiredProgress()}/${cabinet.needs.length}</b></div>
            <div class="goal"><span class="goal-icon">币</span><div><b>${cabinet.par} 枚代币内</b><span>减少空抓与滑落</span></div><b>${run.attempts}</b></div>
            <div class="goal"><span class="goal-icon">星</span><div><b>${challenge.label}</b><span>本柜附加挑战</span></div><b>${challengeDisplay}</b></div>`;
          ui.collection.innerHTML = prizeIds.map((id) => `<span class="${profile.dex[id] ? "" : "locked"}" title="${PRIZES[id].name}">${profile.dex[id] ? PRIZES[id].icon : "?"}</span>`).join("");
        }

        function showCabinets() {
          ui.screenKicker.textContent = "操作员、爪头与十二台固定柜"; ui.screenTitle.textContent = "万象爪局巡回";
          ui.screenBody.innerHTML = `
            <h3>操作员</h3><div class="loadout-grid">${Object.entries(operators).map(([id, value]) => `<button class="loadout-button ${profile.operator === id ? "active" : ""}" data-operator="${id}" ${operatorUnlocked(id) ? "" : "disabled"}><strong>${value.name}</strong><span>${value.desc}${operatorUnlocked(id) ? "" : " · 星章不足"}</span></button>`).join("")}</div>
            <h3>机械爪头</h3><div class="loadout-grid">${Object.entries(heads).map(([id, value]) => `<button class="loadout-button ${profile.head === id ? "active" : ""}" data-head="${id}" ${headUnlocked(id) ? "" : "disabled"}><strong>${value.name}</strong><span>${value.desc}${headUnlocked(id) ? "" : " · 星章不足"}</span></button>`).join("")}</div>
            <h3>收藏柜台</h3><div class="cabinet-grid">${cabinets.map((cabinet, index) => `<button class="cabinet-card ${profile.cabinet === index ? "active" : ""}" data-cabinet="${index}" ${isCabinetUnlocked(index) ? "" : "disabled"}><strong>${index + 1}. ${cabinet.name}　${"★".repeat(profile.stars[index])}${"☆".repeat(3 - profile.stars[index])}</strong><span>${cabinet.region} · ${cabinet.rule}</span></button>`).join("")}</div>
            <button id="closeScreen" class="primary" type="button">返回当前柜台</button>`;
          ui.screenModal.hidden = false;
          ui.screenBody.querySelectorAll("[data-operator]").forEach((button) => button.addEventListener("click", () => { profile.operator = button.dataset.operator; saveProfile(); prepareCabinet(); showCabinets(); }));
          ui.screenBody.querySelectorAll("[data-head]").forEach((button) => button.addEventListener("click", () => { profile.head = button.dataset.head; saveProfile(); prepareCabinet(); showCabinets(); }));
          ui.screenBody.querySelectorAll("[data-cabinet]").forEach((button) => button.addEventListener("click", () => { profile.cabinet = Number(button.dataset.cabinet); saveProfile(); ui.screenModal.hidden = true; prepareCabinet(); }));
          $("closeScreen").addEventListener("click", () => { ui.screenModal.hidden = true; prepareCabinet(); });
        }
        function showArchive(message = "") {
          ui.screenKicker.textContent = "跨设备收藏档案"; ui.screenTitle.textContent = "CLAW2 巡回档案";
          ui.screenBody.innerHTML = `${message ? `<p><strong>${message}</strong></p>` : ""}<textarea class="archive-box" id="archiveText" aria-label="万象爪局档案码">${encodeArchive()}</textarea><div class="button-row"><button id="copyArchive" type="button">复制档案</button><button id="importArchive" type="button">导入档案</button><button id="closeArchive" class="primary" type="button">返回柜台</button></div>`;
          ui.screenModal.hidden = false;
          const input = $("archiveText");
          $("copyArchive").addEventListener("click", async () => { input.select(); try { await navigator.clipboard.writeText(input.value); } catch { document.execCommand("copy"); } });
          $("importArchive").addEventListener("click", () => { try { profile = decodeArchive(input.value); saveProfile(); prepareCabinet(); showArchive("档案已导入并通过校验"); } catch (error) { showArchive(error.message || "档案无效"); } });
          $("closeArchive").addEventListener("click", () => { ui.screenModal.hidden = true; prepareCabinet(); });
        }

        function bindHold(button, key) {
          button.addEventListener("pointerdown", (event) => { event.preventDefault(); button.setPointerCapture?.(event.pointerId); held[key] = true; });
          const release = () => { held[key] = false; };
          button.addEventListener("pointerup", release); button.addEventListener("pointercancel", release); button.addEventListener("lostpointercapture", release);
        }
        function releaseControls() { held.left = false; held.right = false; held.brake = false; }
        function bindEvents() {
          window.addEventListener("resize", resize);
          $("cabinetButton").addEventListener("click", showCabinets); $("archiveButton").addEventListener("click", () => showArchive());
          $("startTop").addEventListener("click", () => startCabinet()); $("startButton").addEventListener("click", () => startCabinet()); $("selectButton").addEventListener("click", showCabinets);
          $("pauseButton").addEventListener("click", () => mode === "paused" ? resume() : pause()); $("resumeButton").addEventListener("click", resume); $("restartPause").addEventListener("click", () => startCabinet());
          $("retryButton").addEventListener("click", () => startCabinet()); $("nextButton").addEventListener("click", nextCabinet); $("dropButton").addEventListener("click", beginGrab);
          $("muteButton").addEventListener("click", () => { muted = !muted; $("muteButton").textContent = muted ? "×" : "♪"; ensureAudio(); });
          bindHold($("leftButton"), "left"); bindHold($("rightButton"), "right"); bindHold($("brakeButton"), "brake");
          canvas.addEventListener("pointerdown", (event) => { if (mode !== "running" || run.animation) return; const rect = canvas.getBoundingClientRect(); claw.x = clamp((event.clientX - rect.left) / rect.width, .08, .92); claw.vx = 0; claw.swingV += (claw.x - .5) * .18; });
          document.addEventListener("keydown", (event) => {
            const key = event.key.toLowerCase();
            if (["arrowleft", "arrowright", "arrowdown", " "].includes(key)) event.preventDefault();
            if (key === "arrowleft" || key === "a") held.left = true;
            if (key === "arrowright" || key === "d") held.right = true;
            if (key === "arrowdown" || key === "s") held.brake = true;
            if ((key === " " || key === "arrowup" || key === "w") && !event.repeat) beginGrab();
            if (key === "p" && !event.repeat) mode === "paused" ? resume() : pause();
          });
          document.addEventListener("keyup", (event) => { const key = event.key.toLowerCase(); if (key === "arrowleft" || key === "a") held.left = false; if (key === "arrowright" || key === "d") held.right = false; if (key === "arrowdown" || key === "s") held.brake = false; });
        }
        function ensureAudio() { if (!audioCtx) { const AudioContext = window.AudioContext || window.webkitAudioContext; if (AudioContext) audioCtx = new AudioContext(); } if (audioCtx?.state === "suspended") audioCtx.resume(); }
        function beep(frequency, duration, type, gainValue, delay = 0) { if (muted || !audioCtx || run.testing) return; const oscillator = audioCtx.createOscillator(), gain = audioCtx.createGain(), start = audioCtx.currentTime + delay; oscillator.type = type; oscillator.frequency.setValueAtTime(frequency, start); gain.gain.setValueAtTime(gainValue, start); gain.gain.exponentialRampToValueAtTime(.001, start + duration); oscillator.connect(gain); gain.connect(audioCtx.destination); oscillator.start(start); oscillator.stop(start + duration); }
        function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

        function validateContent() {
          const generated = cabinets.map(buildPieces);
          if (cabinets.length !== 12 || new Set(cabinets.map((cabinet) => cabinet.id)).size !== 12) throw new Error("柜台配置必须包含 12 个唯一 id");
          if (prizeIds.length !== 16 || Object.keys(operators).length !== 3 || Object.keys(heads).length !== 3) throw new Error("图鉴或配置数据不完整");
          if (generated.some((pieces) => pieces.length !== 12) || cabinets.some((cabinet) => cabinet.needs.some((id) => !PRIZES[id]))) throw new Error("固定奖品布局无效");
          return { cabinets: cabinets.length, prizes: prizeIds.length, operators: Object.keys(operators).length, heads: Object.keys(heads).length, pieces: generated.reduce((sum, pieces) => sum + pieces.length, 0), uniqueSeeds: new Set(cabinets.map((cabinet) => cabinet.seed)).size };
        }
        function runReferenceCabinet(index) {
          profile.cabinet = index;
          [profile.operator, profile.head] = currentCabinet().ref;
          startCabinet({ testing: true });
          for (const type of currentCabinet().needs) {
            const piece = run.pieces.find((item) => !item.caught && item.type === type);
            if (!piece) throw new Error(`${currentCabinet().name} 缺少参考奖品 ${type}`);
            claw.x = piece.x; claw.vx = 0; claw.swing = 0; claw.swingV = 0;
            run.tokens -= 1; run.attempts += 1;
            applyGrab(grabEvaluation(piece));
          }
          return { id: currentCabinet().id, won: Boolean(run.result?.won), stars: run.result?.stars || 0, attempts: run.attempts, score: run.score, misses: run.misses, combo: run.bestCombo, precision: run.precisionCount ? run.precisionSum / run.precisionCount : 0 };
        }
        window.__clawCarnivalTest = {
          cabinets, prizes: PRIZES, operators, heads, freshProfile, encodeArchive, decodeArchive, validateContent, runReferenceCabinet,
          begin(index = 0, operator = "calibrator", head = "balanced", options = {}) { profile.cabinet = index; profile.operator = operator; profile.head = head; startCabinet(options); },
          aim(x) { claw.x = clamp(Number(x), .08, .92); claw.vx = 0; },
          step(dt = 1 / 60, controls = {}) { held.left = Boolean(controls.left); held.right = Boolean(controls.right); held.brake = Boolean(controls.brake); updatePhysics(dt); },
          dropInstant() { if (mode !== "running" || run.tokens <= 0) return null; run.tokens -= 1; run.attempts += 1; const evaluation = grabEvaluation(); applyGrab(evaluation); return { success: evaluation.success, confidence: evaluation.confidence, precision: evaluation.precision, type: evaluation.piece?.type || null }; },
          getState() { return { mode, cabinet: profile.cabinet, operator: profile.operator, head: profile.head, x: claw.x, swing: claw.swing, tokens: run.tokens, attempts: run.attempts, score: run.score, combo: run.combo, misses: run.misses, collected: { ...run.collected }, result: run.result, pieces: run.pieces.map((piece) => ({ ...piece })) }; }
        };

        bindEvents(); resize(); prepareCabinet(); raf = requestAnimationFrame(update);
        window.addEventListener("beforeunload", () => cancelAnimationFrame(raf));
      })();
    </script>
  </body>
</html>
