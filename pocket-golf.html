<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#244737">
  <title>口袋高尔夫：三地巡回</title>
  <style>
    :root{--bg:#e9eee9;--paper:#fffef8;--ink:#1b2e27;--muted:#66766f;--line:#c1ccc4;--green:#31755a;--blue:#227797;--gold:#b9821e;--red:#a84f4f;--violet:#6d6088;--deep:#244737;--radius:8px;--shadow:0 12px 30px rgba(31,61,48,.12)}
    *{box-sizing:border-box;letter-spacing:0}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg)}button{font:inherit}.app{width:min(1200px,calc(100vw - 24px));margin:auto;padding:18px 0 30px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:18px 20px;border-bottom:4px solid #e0b84f;color:#fff;background:var(--deep)}h1{margin:0;font-size:28px}.sub{margin:5px 0 0;color:#d5e2da;font-size:13px}.campaign{display:flex;gap:20px;text-align:right}.campaign b{display:block;color:#f1c85c;font-size:20px}.campaign span{color:#c0d1c7;font-size:10px}.holes{display:grid;grid-template-columns:repeat(18,minmax(36px,1fr));gap:4px;padding:12px 0}.hole-btn{height:43px;border:1px solid #9eafa4;border-radius:6px;color:#40564b;background:#f7f9f4;font-weight:900;cursor:pointer}.hole-btn.active{border-color:var(--green);color:#fff;background:var(--green)}.hole-btn.locked{opacity:.42}.hole-btn small{display:block;height:11px;color:#f1c453;font-size:9px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px}.field{min-width:0;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);box-shadow:var(--shadow)}.brief{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}.brief h2{margin:0;font-size:21px}.brief p{margin:5px 0 0;color:var(--muted);font-size:12px}.goal{flex:0 0 auto;padding:7px 9px;border:1px solid #d1ad59;border-radius:6px;color:#73510c;background:#fff4d6;font-size:11px;font-weight:900}.course{position:relative;border:8px solid #c8a65e;border-radius:var(--radius);overflow:hidden;background:#4d995d}.course canvas{display:block;width:100%;aspect-ratio:16/9;touch-action:none}.aim{position:absolute;left:10px;bottom:10px;padding:6px 8px;border-radius:5px;color:#fff;background:rgba(28,53,43,.78);font-size:10px}.scoreline{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.score-chip{padding:5px 8px;border:1px solid #b5c4ba;border-radius:5px;color:#4b6055;background:#f1f5ef;font-size:10px}.score-chip.current{border-color:var(--green);color:#fff;background:var(--green)}.panel{display:flex;flex-direction:column;gap:10px}.box{padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}.box h3{margin:0 0 9px;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px 4px;border:1px solid #d2dbd4;border-radius:6px;text-align:center;background:#f3f6f2}.stat b{display:block;color:var(--green);font-size:18px}.stat span{color:var(--muted);font-size:10px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.seg button{min-height:42px;border:1px solid #9eafa5;border-radius:6px;color:#354d41;background:#f2f5f0;font-weight:900;cursor:pointer}.seg button.active{border-color:var(--green);color:#fff;background:var(--green)}.seg button small{display:block;font-size:8px;font-weight:600}.balls button:nth-child(2).active{border-color:var(--blue);background:var(--blue)}.balls button:nth-child(3).active{border-color:var(--violet);background:var(--violet)}.actions,.archive{display:grid;grid-template-columns:1fr 1fr;gap:6px}.actions button,.archive button{min-height:39px;border:1px solid #9eafa5;border-radius:6px;color:#354d41;background:#f2f5f0;font-weight:900;cursor:pointer}.actions .primary{border-color:var(--blue);color:#fff;background:var(--blue)}.status{min-height:66px;margin:0;padding:10px;border-left:4px solid var(--green);color:#3e574a;background:#edf4ef;font-size:12px;line-height:1.55}.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;color:var(--muted);font-size:10px}.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:2px}.result{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(20,43,34,.72)}.result[hidden]{display:none}.result-card{width:min(430px,100%);padding:22px;border-radius:var(--radius);background:var(--paper);box-shadow:0 24px 70px rgba(0,0,0,.3);text-align:center}.result-card h2{margin:0}.result-stars{margin:12px 0;color:#d49a18;font-size:34px}.result-card button{min-height:42px;padding:0 18px;border:0;border-radius:6px;color:#fff;background:var(--green);font-weight:900;cursor:pointer}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.panel{display:grid;grid-template-columns:1fr 1fr}.panel .status{grid-column:1/-1}}
    @media(max-width:680px){.app{width:calc(100vw - 12px);padding-top:6px}.head{display:block;padding:14px}.campaign{justify-content:space-between;margin-top:12px;text-align:left}.holes{grid-template-columns:repeat(6,1fr);gap:4px}.hole-btn{height:38px}.field{padding:8px}.brief{display:block}.goal{display:inline-block;margin-top:7px}.course{border-width:5px}.panel{display:flex}.sub{line-height:1.5}.aim{font-size:9px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="head"><div><h1>口袋高尔夫：三地巡回</h1><p class="sub">十八个固定球洞，共享同一套材质、机关与碰撞物理。</p></div><div class="campaign"><div><b id="starTotal">0 / 54</b><span>巡回星章</span></div><div><b id="underTotal">E</b><span>累计杆差</span></div><div><b id="ghostTotal">0 / 18</b><span>个人幽灵</span></div></div></header>
    <nav class="holes" id="holes" aria-label="巡回球洞"></nav>
    <section class="layout">
      <div class="field"><div class="brief"><div><h2 id="title"></h2><p id="brief"></p></div><span class="goal" id="goal"></span></div><div class="course"><canvas id="course" width="960" height="540" aria-label="高尔夫球场"></canvas><span class="aim" id="aim">等待开球</span></div><div class="scoreline" id="scoreline"></div></div>
      <aside class="panel">
        <section class="box"><h3>本洞状态</h3><div class="stats"><div class="stat"><b id="strokes">0</b><span>杆数</span></div><div class="stat"><b id="par">3</b><span>标准杆</span></div><div class="stat"><b id="penalties">0</b><span>罚杆</span></div></div></section>
        <section class="box"><h3>球杆</h3><div class="seg" id="clubs"><button data-club="precision">推杆<small>精细 360</small></button><button data-club="iron">铁杆<small>均衡 500</small></button><button data-club="driver">木杆<small>远距 620</small></button></div></section>
        <section class="box"><h3>巡回用球</h3><div class="seg balls" id="balls"><button data-ball="tour">巡回球<small>均衡</small></button><button data-ball="grip">抓地球<small>沙地稳定</small></button><button data-ball="glide">滑翔球<small>冰面稳定</small></button></div></section>
        <section class="box"><div class="actions"><button class="primary" id="resetBall">重置落点</button><button id="restartHole">重开本洞</button><button id="toggleGhost">隐藏幽灵</button><button id="reference">参考球路</button></div></section>
        <p class="status" id="status"></p>
        <section class="box"><div class="legend"><span><i style="background:#d6b969"></i>沙地减速</span><span><i style="background:#a9d9ed"></i>冰面滑行</span><span><i style="background:#3185b1"></i>水域罚杆</span><span><i style="background:#c95f4e"></i>风场加速</span></div></section>
        <section class="box"><div class="archive"><button id="exportSave">导出档案</button><button id="importSave">导入档案</button></div></section>
      </aside>
    </section>
  </main>
  <div class="result" id="result" hidden><div class="result-card"><h2 id="resultTitle"></h2><p id="resultText"></p><div class="result-stars" id="resultStars"></div><button id="next">下一洞</button></div></div>
  <script>
  (()=>{
    "use strict";
    const SAVE_KEY="pocket_golf_v2",cv=document.getElementById("course"),g=cv.getContext("2d"),$=id=>document.getElementById(id),holeEl=$("holes"),statusEl=$("status");
    const tours=[{name:"苔庭林克斯",theme:"garden"},{name:"霜环观测站",theme:"frost"},{name:"熔金工坊",theme:"ember"}],clubs={precision:{max:360,mult:2.15},iron:{max:500,mult:2.7},driver:{max:620,mult:3.15}},balls={tour:{sand:.955,ice:.994},grip:{sand:.972,ice:.991},glide:{sand:.948,ice:.989}};
    const layouts=[
      {name:"长草直道",start:[90,270],cup:[870,270],ref:[[430,270],[870,270]],items:[{type:"sand",x:360,y:350,w:220,h:120}]},
      {name:"北岬狗腿",start:[90,440],cup:[860,90],ref:[[270,110],[650,110],[860,90]],items:[{type:"wall",x:360,y:190,w:150,h:350},{type:"sand",x:610,y:260,w:180,h:100}]},
      {name:"双门蛇线",start:[90,100],cup:[860,440],ref:[[210,420],[440,420],[470,100],[720,100],[860,440]],items:[{type:"wall",x:290,y:0,w:65,h:335},{type:"wall",x:560,y:205,w:65,h:335}]},
      {name:"折跃短洞",start:[90,270],cup:[870,270],ref:[[280,270],[870,270]],items:[{type:"portal",x:280,y:270,pair:1},{type:"portal",x:650,y:270,pair:0},{type:"water",x:390,y:90,w:150,h:120},{type:"water",x:390,y:330,w:150,h:120}]},
      {name:"镜池弯月",start:[90,440],cup:[860,100],ref:[[300,110],[690,110],[860,100]],items:[{type:"bumper",x:480,y:275,r:68},{type:"water",x:365,y:365,w:230,h:140}]},
      {name:"潮沟走廊",start:[90,270],cup:[870,270],ref:[[430,270],[870,270]],items:[{type:"water",x:330,y:0,w:290,h:190},{type:"water",x:330,y:350,w:290,h:190}]}
    ];
    function makeHole(index){const tour=Math.floor(index/6),base=layouts[index%6],theme=tours[tour],items=base.items.map(item=>({...item})),reference=base.ref.map(point=>[...point]);if(tour===1){items.push({type:"ice",x:80+(index%3)*250,y:index%2?35:420,w:170,h:80});items.push({type:"fan",x:720,y:180,w:140,h:80,ax:0,ay:-28})}if(tour===2){items.push({type:"sand",x:55+(index%2)*690,y:index%2?410:50,w:180,h:75});items.push({type:"fan",x:700,y:180,w:150,h:80,ax:-22,ay:-18});if(index%2===0)items.push({type:"bumper",x:760,y:270,r:34});if(index===12)reference.splice(1,1,[700,150],[870,270],[870,270],[870,270]);if(index===14)reference.splice(4,1,[900,100],[900,440],[860,440])}return{id:`h${index+1}`,index,tour,theme:theme.theme,title:`${theme.name} · ${base.name}`,brief:tour===0?"草地、沙坑与基础墙面构成入门巡回。":tour===1?"冰面与横风会改变停球距离。":"风场、弹性障碍与高风险区域组成终段。",start:base.start,cup:base.cup,items,reference,par:Math.max(2,reference.length)}}
    const holes=Array.from({length:18},(_,index)=>makeHole(index));
    let save=loadSave(),q=null,drag=null,last=0,club="iron",ballType="tour",audio=null,preview=false;

    function defaults(){return{version:2,stars:{},scores:{},ghosts:{},ball:"tour",updatedAt:Date.now()}}
    function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
    function normalize(value){const clean=defaults();if(!value||value.version!==2)return clean;for(const hole of holes){clean.stars[hole.id]=Math.max(0,Math.min(3,Number(value.stars?.[hole.id])||0));if(Number(value.scores?.[hole.id])>0)clean.scores[hole.id]=Number(value.scores[hole.id]);if(Array.isArray(value.ghosts?.[hole.id]))clean.ghosts[hole.id]=value.ghosts[hole.id].slice(0,600)}clean.ball=balls[value.ball]?value.ball:"tour";return clean}
    function loadSave(){try{return normalize(JSON.parse(localStorage.getItem(SAVE_KEY)))}catch{return defaults()}}
    function persist(){save.ball=ballType;save.updatedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(save));renderCampaign()}
    function encodeSave(){const body=btoa(unescape(encodeURIComponent(JSON.stringify(save))));return`GOLF2.${body}.${checksum(body)}`}
    function decodeSave(code){const parts=code.trim().split(".");if(parts.length!==3||parts[0]!=="GOLF2"||checksum(parts[1])!==parts[2])throw Error("巡回档案校验失败");return normalize(JSON.parse(decodeURIComponent(escape(atob(parts[1])))))}
    function insideRect(x,y,item,r=0){return x>item.x-r&&x<item.x+item.w+r&&y>item.y-r&&y<item.y+item.h+r}
    function resetSim(hole){return{x:hole.start[0],y:hole.start[1],vx:0,vy:0,portalCd:0,holed:false,hazard:false}}
    function surfaceAt(sim,hole){let type="grass";for(const item of hole.items)if((item.type==="sand"||item.type==="ice")&&insideRect(sim.x,sim.y,item))type=item.type;return type}
    function stepPhysics(sim,hole,dt,ball="tour"){if(sim.holed)return;const px=sim.x,py=sim.y;sim.portalCd=Math.max(0,sim.portalCd-dt);for(const item of hole.items)if(item.type==="fan"&&insideRect(sim.x,sim.y,item)){sim.vx+=item.ax*dt;sim.vy+=item.ay*dt}sim.x+=sim.vx*dt;sim.y+=sim.vy*dt;if(sim.x<12||sim.x>948){sim.x=Math.max(12,Math.min(948,sim.x));sim.vx*=-.78}if(sim.y<12||sim.y>528){sim.y=Math.max(12,Math.min(528,sim.y));sim.vy*=-.78}for(const item of hole.items){if(item.type==="wall"&&insideRect(sim.x,sim.y,item,11)){if(px<=item.x-11||px>=item.x+item.w+11)sim.vx*=-.76;else sim.vy*=-.76;sim.x=px;sim.y=py}if(item.type==="bumper"){const dx=sim.x-item.x,dy=sim.y-item.y,d=Math.hypot(dx,dy);if(d<item.r+11){const nx=dx/(d||1),ny=dy/(d||1),dot=sim.vx*nx+sim.vy*ny;sim.vx-=1.8*dot*nx;sim.vy-=1.8*dot*ny;sim.x=item.x+nx*(item.r+12);sim.y=item.y+ny*(item.r+12)}}if((item.type==="water"||item.type==="lava")&&insideRect(sim.x,sim.y,item)){sim.hazard=true;sim.vx=sim.vy=0;return}if(item.type==="portal"&&sim.portalCd<=0&&Math.hypot(sim.x-item.x,sim.y-item.y)<23){const other=hole.items.filter(x=>x.type==="portal")[item.pair];if(other){sim.x=other.x;sim.y=other.y;sim.portalCd=.8}}}const surface=surfaceAt(sim,hole),friction=surface==="sand"?balls[ball].sand:surface==="ice"?balls[ball].ice:.985;sim.vx*=Math.pow(friction,dt*60);sim.vy*=Math.pow(friction,dt*60);const speed=Math.hypot(sim.vx,sim.vy);if(Math.hypot(sim.x-hole.cup[0],sim.y-hole.cup[1])<18&&speed<115){sim.x=hole.cup[0];sim.y=hole.cup[1];sim.vx=sim.vy=0;sim.holed=true}if(speed<3)sim.vx=sim.vy=0}
    function shootSim(sim,hole,target,ball="tour",record=false){const dx=target[0]-sim.x,dy=target[1]-sim.y,d=Math.hypot(dx,dy)||1,power=Math.min(620,d*.91);sim.vx=dx/d*power;sim.vy=dy/d*power;const trail=[];for(let frame=0;frame<1200;frame++){stepPhysics(sim,hole,1/60,ball);if(record&&frame%6===0)trail.push([Math.round(sim.x),Math.round(sim.y)]);if(sim.holed||sim.hazard||Math.hypot(sim.vx,sim.vy)===0)break}return trail}
    function simulateReference(hole){const sim=resetSim(hole),trail=[];for(const target of hole.reference){trail.push(...shootSim(sim,hole,target,"tour",true));if(sim.hazard)break;if(sim.holed)break}return{holed:sim.holed,hazard:sim.hazard,x:sim.x,y:sim.y,strokes:hole.reference.length,trail}}
    function validateContent(){if(holes.length!==18)throw Error("球洞数量错误");const failures=[];for(const hole of holes){const result=simulateReference(hole);if(!result.holed||result.hazard||result.strokes>hole.par)failures.push(`${hole.id}(${Math.round(result.x)},${Math.round(result.y)})`)}if(failures.length)throw Error(`参考球路失败：${failures.join("、")}`);return{holes:holes.length,tours:3,referencesPassed:holes.length,totalPar:holes.reduce((sum,hole)=>sum+hole.par,0)}}
    function unlocked(index){return index===0||Number(save.stars[holes[index-1].id])>0}
    function begin(index=0){if(!unlocked(index))return;const hole=holes[index],sim=resetSim(hole);q={index,hole,ball:sim,strokes:0,penalties:0,moving:false,done:false,lastSafe:[...hole.start],trail:[[...hole.start]],ghostVisible:true};drag=null;preview=false;renderAll();setStatus("从白球向后拖拽并松开发球；短拖精调，长拖提高击球速度。")}
    function setStatus(text){statusEl.textContent=text}
    function renderCampaign(){const stars=Object.values(save.stars).reduce((sum,n)=>sum+Number(n||0),0),played=holes.filter(hole=>save.scores[hole.id]).length,diff=holes.reduce((sum,hole)=>sum+(save.scores[hole.id]?save.scores[hole.id]-hole.par:0),0);$("starTotal").textContent=`${stars} / 54`;$("underTotal").textContent=played?(diff>0?`+${diff}`:diff===0?"E":String(diff)):"E";$("ghostTotal").textContent=`${Object.keys(save.ghosts).length} / 18`}
    function renderHoles(){holeEl.replaceChildren();holes.forEach((hole,index)=>{const button=document.createElement("button"),stars=Number(save.stars[hole.id])||0;button.className=`hole-btn${q?.index===index?" active":""}${unlocked(index)?"":" locked"}`;button.innerHTML=`${index+1}<small>${stars?"★".repeat(stars):""}</small>`;button.disabled=!unlocked(index);button.title=hole.title;button.onclick=()=>begin(index);holeEl.append(button)})}
    function renderPanel(){$("title").textContent=`${String(q.index+1).padStart(2,"0")} · ${q.hole.title}`;$("brief").textContent=q.hole.brief;$("goal").textContent=`Par ${q.hole.par} · ${q.hole.reference.length} 杆参考`;$("strokes").textContent=q.strokes;$("par").textContent=q.hole.par;$("penalties").textContent=q.penalties;document.querySelectorAll("[data-club]").forEach(button=>button.classList.toggle("active",button.dataset.club===club));document.querySelectorAll("[data-ball]").forEach(button=>button.classList.toggle("active",button.dataset.ball===ballType));$("toggleGhost").textContent=q.ghostVisible?"隐藏幽灵":"显示幽灵";$("reference").textContent=preview?"隐藏参考":"参考球路";$("aim").textContent=q.moving?"球体运动中":drag?`力度 ${Math.round(drag.power/620*100)}%`:"等待击球"}
    function renderScoreline(){$("scoreline").innerHTML=holes.map((hole,index)=>`<span class="score-chip ${index===q.index?"current":""}">${index+1} · ${save.scores[hole.id]??"--"}</span>`).join("")}
    function renderAll(){renderCampaign();renderHoles();renderPanel();renderScoreline();draw()}
    function colorTheme(){return q.hole.theme==="frost"?{grass:"#7fb1aa",rough:"#d7e7e3"}:q.hole.theme==="ember"?{grass:"#718f5b",rough:"#e0c37c"}:{grass:"#58a660",rough:"#d4ba70"}}
    function drawItem(item){if(item.type==="wall"){g.fillStyle="#615547";g.fillRect(item.x,item.y,item.w,item.h)}if(item.type==="sand"){g.fillStyle="#d6b969";g.fillRect(item.x,item.y,item.w,item.h)}if(item.type==="ice"){g.fillStyle="#a9d9ed";g.fillRect(item.x,item.y,item.w,item.h)}if(item.type==="water"){g.fillStyle="#3185b1";g.fillRect(item.x,item.y,item.w,item.h)}if(item.type==="fan"){g.fillStyle="rgba(201,95,78,.58)";g.fillRect(item.x,item.y,item.w,item.h);g.fillStyle="#fff";g.font="18px sans-serif";g.fillText("风",item.x+item.w/2-9,item.y+item.h/2+6)}if(item.type==="bumper"){g.fillStyle="#7b5f8f";g.beginPath();g.arc(item.x,item.y,item.r,0,Math.PI*2);g.fill();g.strokeStyle="#e8d8f1";g.lineWidth=4;g.stroke()}if(item.type==="portal"){g.strokeStyle="#50c4d8";g.lineWidth=8;g.beginPath();g.arc(item.x,item.y,20,0,Math.PI*2);g.stroke()}}
    function drawPath(points,color,width=3,dash=[]){if(!points?.length)return;g.save();g.strokeStyle=color;g.lineWidth=width;g.setLineDash(dash);g.beginPath();g.moveTo(points[0][0],points[0][1]);for(const point of points.slice(1))g.lineTo(point[0],point[1]);g.stroke();g.restore()}
    function draw(){if(!q)return;const theme=colorTheme();g.fillStyle=theme.grass;g.fillRect(0,0,960,540);g.strokeStyle="rgba(255,255,255,.09)";g.lineWidth=2;for(let x=0;x<960;x+=60){g.beginPath();g.moveTo(x,0);g.lineTo(x,540);g.stroke()}for(const item of q.hole.items)drawItem(item);if(q.ghostVisible)drawPath(save.ghosts[q.hole.id],"rgba(255,255,255,.42)",3,[8,7]);if(preview)drawPath(simulateReference(q.hole).trail,"rgba(241,200,92,.9)",4,[10,6]);g.fillStyle="#142024";g.beginPath();g.arc(q.hole.cup[0],q.hole.cup[1],13,0,Math.PI*2);g.fill();g.fillStyle="#fff";g.fillRect(q.hole.cup[0],q.hole.cup[1]-62,3,62);g.fillStyle="#cf4f4f";g.fillRect(q.hole.cup[0]+3,q.hole.cup[1]-62,34,20);g.strokeStyle="rgba(255,255,255,.35)";g.lineWidth=2;drawPath(q.trail,"rgba(255,255,255,.26)",2);g.fillStyle=ballType==="glide"?"#d7c7ef":ballType==="grip"?"#d0edf6":"#fff";g.beginPath();g.arc(q.ball.x,q.ball.y,11,0,Math.PI*2);g.fill();g.strokeStyle="#53645c";g.lineWidth=2;g.stroke();if(drag){g.strokeStyle="#fff";g.lineWidth=3;g.beginPath();g.moveTo(q.ball.x,q.ball.y);g.lineTo(drag.x,drag.y);g.stroke();g.fillStyle="rgba(255,255,255,.15)";g.beginPath();g.arc(q.ball.x,q.ball.y,Math.min(120,drag.distance),0,Math.PI*2);g.fill()}}
    function tone(freq,duration=.08){try{audio??=new AudioContext();const osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=freq;gain.gain.setValueAtTime(.04,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain).connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}catch{}}
    function point(event){const rect=cv.getBoundingClientRect(),source=event.touches?.[0]||event;return{x:(source.clientX-rect.left)*960/rect.width,y:(source.clientY-rect.top)*540/rect.height}}
    function strike(target){const dx=q.ball.x-target.x,dy=q.ball.y-target.y,d=Math.hypot(dx,dy)||1,settings=clubs[club],power=Math.min(settings.max,d*settings.mult);q.ball.vx=dx/d*power;q.ball.vy=dy/d*power;q.strokes++;q.moving=true;q.lastSafe=[q.ball.x,q.ball.y];q.trail.push([Math.round(q.ball.x),Math.round(q.ball.y)]);tone(180+power*.25);drag=null;renderPanel()}
    function update(dt){if(!q?.moving)return;stepPhysics(q.ball,q.hole,dt,ballType);if(Math.random()<.18)q.trail.push([Math.round(q.ball.x),Math.round(q.ball.y)]);if(q.ball.hazard){q.penalties++;q.strokes++;q.ball=resetSim(q.hole);q.ball.x=q.lastSafe[0];q.ball.y=q.lastSafe[1];q.moving=false;setStatus("球体进入水域，罚一杆并返回上一次安全落点。");tone(80,.2)}else if(q.ball.holed)finishHole();else if(Math.hypot(q.ball.vx,q.ball.vy)===0){q.moving=false;q.lastSafe=[q.ball.x,q.ball.y];setStatus(`停球位置 ${Math.round(q.ball.x)}, ${Math.round(q.ball.y)}。可以准备下一杆。`);renderPanel()}}
    function finishHole(){if(q.done)return;q.done=true;q.moving=false;const stars=1+(q.strokes<=q.hole.par?1:0)+(q.strokes<q.hole.par&&q.penalties===0?1:0),id=q.hole.id,previous=save.scores[id]||Infinity;if(q.strokes<previous){save.scores[id]=q.strokes;save.ghosts[id]=q.trail.slice(0,600)}save.stars[id]=Math.max(Number(save.stars[id])||0,stars);persist();$("resultTitle").textContent=q.strokes<q.hole.par?"低于标准杆":q.strokes===q.hole.par?"标准杆完成":"球洞完成";$("resultText").textContent=`第 ${q.index+1} 洞以 ${q.strokes} 杆完成，罚杆 ${q.penalties}。`;$("resultStars").textContent="★".repeat(stars)+"☆".repeat(3-stars);$("next").textContent=q.index<holes.length-1?"下一洞":"返回巡回终点";$("result").hidden=false;tone(580,.22);renderAll()}
    function loop(time){const dt=Math.min(.04,(time-last)/1000||0);last=time;update(dt);draw();requestAnimationFrame(loop)}
    cv.onpointerdown=event=>{const p=point(event);if(q.moving||q.done||Math.hypot(p.x-q.ball.x,p.y-q.ball.y)>42)return;cv.setPointerCapture?.(event.pointerId);drag={...p,distance:0,power:0};renderPanel()};cv.onpointermove=event=>{if(!drag)return;const p=point(event);drag.x=p.x;drag.y=p.y;drag.distance=Math.hypot(q.ball.x-p.x,q.ball.y-p.y);drag.power=Math.min(clubs[club].max,drag.distance*clubs[club].mult);renderPanel();draw()};cv.onpointerup=event=>{if(!drag)return;const p=point(event);if(Math.hypot(q.ball.x-p.x,q.ball.y-p.y)>8)strike(p);else{drag=null;renderPanel()}};
    document.querySelectorAll("[data-club]").forEach(button=>button.onclick=()=>{club=button.dataset.club;renderPanel()});document.querySelectorAll("[data-ball]").forEach(button=>button.onclick=()=>{ballType=button.dataset.ball;persist();renderPanel()});$("resetBall").onclick=()=>{if(q.moving)return;q.strokes++;q.ball=resetSim(q.hole);q.trail.push([...q.hole.start]);q.lastSafe=[...q.hole.start];setStatus("已返回发球点并计一杆。");renderAll()};$("restartHole").onclick=()=>begin(q.index);$("toggleGhost").onclick=()=>{q.ghostVisible=!q.ghostVisible;renderAll()};$("reference").onclick=()=>{preview=!preview;renderAll();setStatus(preview?"金色虚线为同源物理参考球路。":"已隐藏参考球路。")};$("next").onclick=()=>{$("result").hidden=true;begin(Math.min(holes.length-1,q.index+1))};
    $("exportSave").onclick=async()=>{const code=encodeSave();try{await navigator.clipboard.writeText(code);setStatus("GOLF2 档案码已复制。") }catch{prompt("GOLF2 档案码",code)}};$("importSave").onclick=()=>{const code=prompt("输入 GOLF2 档案码");if(!code)return;try{save=decodeSave(code);ballType=save.ball;persist();begin(0);setStatus("巡回档案导入完成。") }catch(error){setStatus(error.message)}};
    window.__pocketGolfTest={validateContent,simulateReference,holes,getState:()=>({index:q.index,strokes:q.strokes,moving:q.moving})};validateContent();ballType=save.ball;begin(0);requestAnimationFrame(loop);
  })();
  </script>
