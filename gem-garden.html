  <script>
  (()=>{
    const $=id=>document.getElementById(id),canvas=$("gameCanvas"),ctx=canvas.getContext("2d"),N=8,K=6,STORAGE="mini_gem_garden_v2",COLORS=["#d65a4a","#d6a33d","#287468","#326f91","#7b5bb4","#d9823b"],NAMES=["莓红","蜜金","薄荷","雨蓝","暮紫","橘光"];

    const MISSIONS=[
      {id:"first-sprout",name:"初芽订单",season:"春庭",brief:"翻松中央苗床，收齐第一篮莓红与薄荷晶糖。",seed:1301,moves:24,par:7,target:560,bed:"sprout",layers:1,colors:[[0,4],[2,3]]},
      {id:"rain-terrace",name:"雨阶花圃",season:"春庭",brief:"沿两道雨阶整理蜜金晶糖，让花床均匀吸水。",seed:2309,moves:26,par:6,target:680,bed:"terrace",layers:1,colors:[[1,6],[3,4]]},
      {id:"corner-bloom",name:"四角开花",season:"春庭",brief:"照看四角苗床，同时完成薄荷与暮紫的配色订单。",seed:3313,moves:27,par:6,target:760,bed:"corners",layers:1,colors:[[2,6],[4,5]]},
      {id:"sun-cross",name:"日轮十字",season:"夏圃",brief:"高温让中央花床干结，优先在十字区域完成消除。",seed:4327,moves:29,par:6,target:860,bed:"cross",layers:1,colors:[[5,7],[0,5]]},
      {id:"mint-lanes",name:"薄荷双径",season:"夏圃",brief:"清理四段并行花径，为雨蓝与薄荷腾出种植位。",seed:5333,moves:33,par:6,target:980,bed:"lanes",layers:1,colors:[[2,7],[3,7]]},
      {id:"amber-diamond",name:"琥珀花冠",season:"夏圃",brief:"在菱形花冠中制造连锁，完成蜜金与橘光订单。",seed:6337,moves:31,par:5,target:1080,bed:"diamond",layers:1,colors:[[1,8],[5,7]]},

      {id:"wind-checker",name:"风纹棋圃",season:"秋苑",brief:"秋风把土层吹成交错纹路，按棋格逐片整理。",seed:8363,moves:34,par:5,target:1320,bed:"checker",layers:1,colors:[[3,8],[5,7]]},
      {id:"purple-ring",name:"暮紫礼冠",season:"秋苑",brief:"为晚宴准备环圃礼冠，集中收获暮紫与橘光。",seed:9371,moves:35,par:5,target:1450,bed:"ring",layers:1,colors:[[4,10],[5,9]]},
      {id:"frost-sprout",name:"霜下新芽",season:"冬园",brief:"双层冻土覆盖中央苗床，每次有效消除只翻开一层。",seed:10391,moves:35,par:5,target:1500,bed:"terrace",layers:2,colors:[[0,8],[3,8]]},
      {id:"frozen-diamond",name:"冰晶花冠",season:"冬园",brief:"深入双层菱形冻土，利用特殊晶糖扩大翻土范围。",seed:11497,moves:38,par:4,target:1660,bed:"diamond",layers:2,colors:[[1,9],[2,9]]},
      {id:"four-season",name:"四季终圃",season:"冬园",brief:"最后一份全色委托，完成交错冻土并封存四季种谱。",seed:12503,moves:42,par:4,target:1880,bed:"checker",layers:2,colors:[[0,5],[1,5],[2,5],[3,5],[4,5],[5,5]]}
    ];
    const MEDALS=[{id:"first",name:"第一束花",test:r=>r.success},{id:"toolfree",name:"徒手园艺",test:r=>r.success&&r.toolsUsed===0},{id:"cascade",name:"四重花瀑",test:r=>r.maxChain>=4},{id:"spring",name:"春庭全星",test:()=>profile.stars.slice(0,3).every(v=>v===3)},{id:"keeper",name:"二十四星园丁",test:()=>sumStars()>=24},{id:"master",name:"四季大师",test:()=>profile.stars.every(v=>v===3)}];
    function blankProfile(){return{v:2,unlocked:0,stars:Array(12).fill(0),scores:Array(12).fill(0),gardener:"dew",charms:["rain"],clears:0,medals:[]}}
    function normalize(p){const gardener=GARDENERS[p?.gardener]?p.gardener:"dew",charms=[...new Set(Array.isArray(p?.charms)?p.charms:[])].filter(id=>CHARMS[id]).slice(0,2);return{v:2,unlocked:Math.max(0,Math.min(11,+p?.unlocked||0)),stars:Array.from({length:12},(_,i)=>Math.max(0,Math.min(3,+p?.stars?.[i]||0))),scores:Array.from({length:12},(_,i)=>Math.max(0,+p?.scores?.[i]||0)),gardener,charms,clears:Math.max(0,+p?.clears||0),medals:[...new Set(Array.isArray(p?.medals)?p.medals:[])].filter(id=>MEDALS.some(m=>m.id===id))}}
    function load(){try{const p=JSON.parse(localStorage.getItem(STORAGE)||"null");return p?.v===2?normalize(p):blankProfile()}catch{return blankProfile()}}
    let profile=load(),missionIndex=Math.min(profile.unlocked,11),state=null,w=900,h=680,dpr=1,last=performance.now(),pointerDown=null;
    function sumStars(){return profile.stars.reduce((a,b)=>a+b,0)}function save(){localStorage.setItem(STORAGE,JSON.stringify(profile))}function gem(t){return{t,kind:0,flash:0,scale:1}}
    function random(s){s.rng=Math.imul(s.rng,1664525)+1013904223>>>0;return s.rng/4294967296}
    function rulesFor(gardenerId,charms){const g=GARDENERS[gardenerId]||GARDENERS.dew,set=new Set(charms||[]);return{moves:g.moves+(set.has("rain")?1:0),hammers:1+g.hammers+(set.has("glove")?1:0),collect:set.has("basket")?2:1,soil:set.has("trowel")?2:1,score:g.score*(set.has("bell")?1.18:1),prism:set.has("prism")}}
    function makeGame(index,options={}){const m=MISSIONS[index],gardener=options.gardener||profile.gardener,charms=options.charms||profile.charms,rules=rulesFor(gardener,charms),soil=BEDS[m.bed].map(row=>[...row].map(v=>v==="1"?m.layers:0)),s={mode:"menu",mission:index,rng:m.seed>>>0,board:[],soil,initialSoil:soil.flat().reduce((a,b)=>a+b,0),goals:m.colors.map(([t,n])=>({t,n,left:n})),moves:m.moves+rules.moves,score:0,maxChain:0,chain:0,hammers:rules.hammers,shuffles:1,toolsUsed:0,specialsCreated:0,specialsUsed:0,rules,gardener,charms:[...charms],selected:null,hint:null,hintTimer:0,hammerMode:false,busy:false,done:false,success:false,events:[],message:"",messageTimer:0,visual:Boolean(options.visual)};fillBoard(s);return s}
    function fillBoard(s){for(let attempt=0;attempt<30;attempt++){s.board=[];for(let y=0;y<N;y++){const row=[];for(let x=0;x<N;x++){let t,guard=0;do{t=Math.floor(random(s)*K);guard++}while(guard<30&&((x>1&&row[x-1].t===t&&row[x-2].t===t)||(y>1&&s.board[y-1][x].t===t&&s.board[y-2][x].t===t)));row.push(gem(t))}s.board.push(row)}if(findMoves(s).length)return true}s.board[3][3].t=s.board[3][4].t;s.board[2][3].t=s.board[3][3].t;return true}
    function cloneGame(s){return{...s,board:s.board.map(row=>row.map(g=>({...g}))),soil:s.soil.map(row=>[...row]),goals:s.goals.map(g=>({...g})),events:[],charms:[...s.charms],visual:false,selected:null,hint:null}}
    function adjacent(a,b){return a&&b&&Math.abs(a.x-b.x)+Math.abs(a.y-b.y)===1}function swap(s,a,b){const g=s.board[a.y][a.x];s.board[a.y][a.x]=s.board[b.y][b.x];s.board[b.y][b.x]=g}

    canvas.addEventListener("pointerdown",e=>{if(state?.mode!=="running"||state.busy)return;canvas.setPointerCapture?.(e.pointerId);const p=point(e),c=cellAt(p.x,p.y);if(!c)return;if(state.hammerMode){hammerAt(c);return}pointerDown={cell:c,x:p.x,y:p.y};if(state.selected&&adjacent(state.selected,c))trySwap(state.selected,c);else{state.selected=c;sync()}});canvas.addEventListener("pointermove",e=>{if(!pointerDown||state.busy)return;const p=point(e),dx=p.x-pointerDown.x,dy=p.y-pointerDown.y,a=area();if(Math.hypot(dx,dy)>a.cell*.38){const dir=Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)},b={x:pointerDown.cell.x+dir.x,y:pointerDown.cell.y+dir.y};pointerDown=null;if(b.x>=0&&b.x<N&&b.y>=0&&b.y<N)trySwap(state.selected,b)}});canvas.addEventListener("pointerup",()=>pointerDown=null);canvas.addEventListener("pointercancel",()=>pointerDown=null);
    $("startBtn").onclick=startMission;$("referenceBtn").onclick=()=>applyReference(missionIndex);$("hintBtn").onclick=hint;$("dockHintBtn").onclick=hint;$("hammerBtn").onclick=()=>{if(state?.mode!=="running"||state.hammers<1)return;state.hammerMode=!state.hammerMode;sync()};$("shuffleBtn").onclick=doShuffle;$("archiveBtn").onclick=()=>{$("archiveText").value=encode();$("feedback").textContent="";$("archive").classList.remove("hidden")};$("closeBtn").onclick=()=>$("archive").classList.add("hidden");$("copyBtn").onclick=async()=>{$("archiveText").value=encode();$("archiveText").select();try{await navigator.clipboard.writeText($("archiveText").value);$("feedback").textContent="档案已复制。"}catch{$("feedback").textContent="档案已生成，请手动复制。"}};$("importBtn").onclick=()=>{try{profile=decode($("archiveText").value);save();missionIndex=Math.min(profile.unlocked,11);renderSide();showMenu();$("feedback").textContent="导入成功。"}catch(error){$("feedback").textContent=error.message}};addEventListener("keydown",e=>{if(e.code==="KeyH")hint();if(e.code==="KeyR"&&state?.mode==="running")startMission()});addEventListener("resize",resize);
    window.__gemGarden={MISSIONS,GARDENERS,CHARMS,BEDS,profile:()=>profile,state:()=>state,makeGame,boardSignature,boardRect,suggestMove,findMoves,performSwap,useHammer,shuffleBoard,resultOf,simulateReference,applyReference,selectMission,selectGardener,toggleCharm,validateContent,encode,decode,renderSide};renderSide();state=makeGame(missionIndex,{visual:true});resize();showMenu();requestAnimationFrame(loop);
