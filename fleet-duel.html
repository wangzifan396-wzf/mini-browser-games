<!doctype html>
<html lang="zh-CN">
<head>

  <title>深海舰队：静默海域</title>
  <style>
    :root{--ink:#17262e;--muted:#61727a;--paper:#f8f6ed;--line:#91a3aa;--blue:#326e8a;--deep:#193f55;--gold:#b17f2b;--red:#a94b4b;--green:#34725d;--radius:8px;--shadow:rgba(3,14,20,.3)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:linear-gradient(135deg,#071d2a,#17485c 58%,#484345)}button,textarea{font:inherit}.app{width:min(1460px,calc(100vw - 24px));margin:12px auto 28px}.topbar,.panel,.archive{border:1px solid var(--line);border-radius:var(--radius);background:rgba(248,246,237,.97);box-shadow:0 16px 38px var(--shadow)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 19px}.eyebrow{margin:0 0 4px;color:#87611b;font-size:12px;font-weight:900}.topbar h1{margin:0;font-size:clamp(27px,4vw,43px);line-height:1.05}.subtitle{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.actions,.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.actions{justify-content:flex-end}.btn{min-height:42px;padding:0 13px;border:1px solid #285b72;border-radius:var(--radius);color:#fff;background:var(--blue);font-weight:900;cursor:pointer}.btn.secondary{color:var(--ink);background:#efd17b;border-color:#99731f}.btn.ghost{color:var(--ink);background:#e9edef;border-color:#82949b}.btn.active{box-shadow:0 0 0 3px rgba(177,127,43,.28);background:#8b6426}.btn:disabled{opacity:.46;cursor:not-allowed}.layout{display:grid;grid-template-columns:225px minmax(560px,1fr) 285px;gap:12px;margin-top:12px;align-items:start}.panel{padding:12px}.panel h2{margin:0 0 9px;font-size:16px}.mission-list{display:grid;gap:6px}.mission{width:100%;padding:9px;border:1px solid #a1adb1;border-radius:var(--radius);color:var(--ink);background:#f5f4eb;text-align:left;cursor:pointer}.mission strong,.mission small{display:block}.mission small{margin-top:3px;color:var(--muted);font-size:11px}.mission span{float:right;color:var(--gold)}.mission.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(50,110,138,.18);background:#e6f0f3}.mission:disabled{opacity:.46;cursor:not-allowed}.captains{display:grid;gap:6px}.captain{padding:8px;border:1px solid #9aa8ad;border-radius:var(--radius);color:var(--ink);background:#f5f4eb;text-align:left;cursor:pointer}.captain strong,.captain small{display:block}.captain small{margin-top:2px;color:var(--muted);font-size:10px;line-height:1.35}.captain.active{border-color:var(--gold);background:#fff0c2}.sea-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}.sea-head h2{margin:0;font-size:24px}.sea-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.operation{text-align:right;white-space:nowrap}.operation b{display:block;color:var(--blue);font-size:22px}.boards{display:grid;grid-template-columns:1fr 1fr;gap:14px}.board-wrap h3{margin:0 0 6px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;padding:7px;border:1px solid #547686;border-radius:var(--radius);background:#092d40;aspect-ratio:1}.cell{position:relative;min-width:0;padding:0;border:1px solid #39708a;border-radius:4px;color:#fff;background:#10506d;font-size:clamp(15px,2vw,23px);cursor:pointer;aspect-ratio:1}.enemy-grid .cell:hover,.enemy-grid .cell:focus-visible{border-color:#f0d071;outline:none;background:#176786}.cell.ship{background:#637d89}.cell.hit{background:#aa4549}.cell.miss{background:#36596a}.cell.sunk{background:#772f37}.cell.reef{background:#40565c;color:#c9d5d6}.cell.scanned{box-shadow:inset 0 0 0 3px rgba(239,209,123,.72)}.cell small{position:absolute;right:2px;bottom:1px;color:#fff4be;font-size:9px}.battle-actions{margin-top:9px}.message{flex:1 1 230px;color:var(--muted);font-size:12px;font-weight:800}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{padding:8px;border:1px solid #a3afb2;border-radius:var(--radius);background:#f5f4eb}.stat b{display:block;color:var(--blue);font-size:20px}.stat small{color:var(--muted);font-size:10px;font-weight:800}.goal{margin-top:9px;padding:9px;border:1px solid #a3afb2;border-radius:var(--radius);background:#f5f4eb}.goal-row{display:flex;justify-content:space-between;gap:7px;padding:4px 0;border-bottom:1px solid #d6d9d8;font-size:12px}.goal-row:last-child{border-bottom:0}.goal-row.ok{color:var(--green);font-weight:900}.fleet{display:grid;gap:5px;margin-top:9px}.ship-row{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border:1px solid #a3afb2;border-radius:var(--radius);background:#f5f4eb;font-size:12px}.ship-row.sunk{color:var(--red);text-decoration:line-through}.log{height:130px;overflow:auto;margin-top:9px;padding:8px;border:1px solid #a3afb2;border-radius:var(--radius);background:#f5f4eb;font-size:12px;line-height:1.55}.archive{position:fixed;z-index:20;left:50%;top:50%;width:min(620px,calc(100vw - 26px));padding:18px;transform:translate(-50%,-50%)}.archive h2{margin:0 0 7px}.archive p{margin:0 0 10px;color:var(--muted);font-size:12px}.archive textarea{width:100%;min-height:94px;padding:9px;border:1px solid var(--line);border-radius:var(--radius);resize:vertical}.feedback{min-height:20px;margin-top:7px;color:var(--green);font-size:12px;font-weight:900}.hidden{display:none!important}@media(max-width:1110px){.layout{grid-template-columns:210px minmax(540px,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.log{height:105px}}@media(max-width:780px){.app{width:calc(100vw - 14px);margin-top:7px}.topbar{display:block;padding:14px}.actions{margin-top:11px;justify-content:stretch}.actions .btn{flex:1 1 auto}.layout{grid-template-columns:1fr}.mission-list{grid-template-columns:repeat(2,1fr)}.right{grid-column:auto;display:block}.sea-head{display:block}.operation{text-align:left;margin-top:7px}.boards{grid-template-columns:1fr}.grid{gap:2px;padding:5px}.cell{font-size:18px}.battle-actions .btn{flex:1 1 42%}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div><p class="eyebrow">DETERMINISTIC NAVAL CAMPAIGN</p><h1>深海舰队：静默海域</h1><p class="subtitle">六片固定海域、追击型敌军与有限声呐，把海战棋从随机短局变成可复盘的舰队战役。</p></div><div class="actions"><button class="btn" id="sonarBtn">声呐扫描</button><button class="btn secondary" id="referenceBtn">参考航迹</button><button class="btn ghost" id="restartBtn">重新部署</button><button class="btn ghost" id="archiveBtn">舰队档案</button></div></header>
    <section class="layout">
      <aside class="panel"><h2>静默海域</h2><div class="mission-list" id="missionList"></div><h2 style="margin-top:13px">舰长</h2><div class="captains" id="captains"></div></aside>
      <section class="panel"><div class="sea-head"><div><h2 id="missionTitle"></h2><p id="missionBrief"></p></div><div class="operation"><b>行动 <span id="shots"></span> 发</b><span>命中率 <strong id="accuracy"></strong>%</span></div></div><div class="boards"><section class="board-wrap"><h3>己方海域</h3><div class="grid" id="ownGrid"></div></section><section class="board-wrap"><h3>敌方海域</h3><div class="grid enemy-grid" id="enemyGrid"></div></section></div><div class="row battle-actions"><button class="btn" id="sonarActionBtn">启动声呐</button><button class="btn ghost" id="cancelSonarBtn">取消扫描</button><span class="message" id="message"></span></div></section>
      <aside class="right"><section class="panel"><h2>战术态势</h2><div class="stats" id="stats"></div><div class="goal" id="goals"></div><div class="fleet" id="fleet"></div></section><section class="panel" style="margin-top:12px"><h2>战斗记录</h2><div class="log" id="log"></div></section></aside>
    </section>
  </main>
  <section class="archive hidden" id="archive"><h2>静默海域档案</h2><p>档案保存行动解锁、星级与最佳炮数，并带有完整性校验。</p><textarea id="archiveText" spellcheck="false"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="copyBtn">生成并复制</button><button class="btn secondary" id="importBtn">导入档案</button><button class="btn ghost" id="closeBtn">关闭</button></div><div class="feedback" id="feedback"></div></section>
  <script>
  (()=>{
    const N=8,STORAGE="fleetDuelV2",$=id=>document.getElementById(id),COLS="ABCDEFGH";
    const SHIPS=[{name:"航空舰",len:4},{name:"战列舰",len:3},{name:"巡洋舰",len:3},{name:"潜艇",len:2},{name:"驱逐舰",len:2}];
    const CAPTAINS={navigator:{name:"林岚 · 航迹官",text:"初始声呐增加到 3 次",sonar:3,armor:0,sinkTempo:false},gunner:{name:"韩烽 · 炮术官",text:"击沉舰艇后获得一次免反击校射",sonar:2,armor:0,sinkTempo:true},guardian:{name:"周宁 · 守备官",text:"装甲带吸收前 2 次有效命中",sonar:2,armor:2,sinkTempo:false}};
    const OWN_LAYOUT=[[56,"h"],[1,"v"],[21,"h"],[39,"v"],[43,"h"]];
    const SCENARIOS=[
      {id:"shoal",name:"浅滩听潮",region:"白沙浅滩",brief:"识别基础舰形，完成第一次静默交火。",layout:[[0,"h"],[17,"v"],[35,"h"],[14,"v"],[53,"h"]],reefs:[10,11,42],seed:5,par:17,bonus:{kind:"fleet",value:3,label:"保全 3 艘舰艇"}},
      {id:"bluegap",name:"蓝隙伏击",region:"蓝隙海峡",brief:"礁带切割视线，敌舰分散于两翼。",layout:[[4,"v"],[33,"h"],[48,"h"],[7,"v"],[54,"h"]],reefs:[1,2,26,43],seed:11,par:18,bonus:{kind:"accuracy",value:70,label:"命中率 ≥ 70%"}},
      {id:"crosscurrent",name:"逆流交叉",region:"逆流洋面",brief:"纵横舰形交错，谨慎使用九宫声呐。",layout:[[8,"h"],[6,"v"],[40,"h"],[29,"v"],[52,"h"]],reefs:[0,1,31,39],seed:19,par:18,bonus:{kind:"sonar",value:1,label:"声呐使用 ≤ 1"}},
      {id:"nightline",name:"夜航断线",region:"无月航道",brief:"敌军追击更快，优先保护受伤舰艇。",layout:[[3,"v"],[32,"h"],[45,"v"],[7,"v"],[56,"h"]],reefs:[5,6,40,41],seed:27,par:17,bonus:{kind:"fleet",value:3,label:"保全 3 艘舰艇"}},
      {id:"ironring",name:"铁环封锁",region:"铁环群岛",brief:"密集礁区要求用命中方向判断舰身。",layout:[[24,"h"],[2,"v"],[39,"v"],[48,"h"],[61,"h"]],reefs:[6,7,43,44],seed:37,par:16,bonus:{kind:"accuracy",value:80,label:"命中率 ≥ 80%"}},
      {id:"silentcrown",name:"静默王冠",region:"深蓝终线",brief:"在高压终局中保存舰队并限制侦察。",layout:[[0,"v"],[36,"h"],[7,"v"],[49,"h"],[61,"h"]],reefs:[5,6,32,33,54],seed:49,par:16,bonus:{kind:"combined",value:3,label:"保全 3 舰且声呐 ≤ 1"}}
    ];
    function blankProfile(){return{v:2,unlocked:0,stars:Array(6).fill(0),best:Array(6).fill(0),clears:0}}
    function normalize(p){return{v:2,unlocked:Math.max(0,Math.min(5,+p.unlocked||0)),stars:Array.from({length:6},(_,i)=>Math.max(0,Math.min(3,+p.stars?.[i]||0))),best:Array.from({length:6},(_,i)=>Math.max(0,+p.best?.[i]||0)),clears:Math.max(0,+p.clears||0)}}
    function load(){try{const p=JSON.parse(localStorage.getItem(STORAGE)||"null");return p?.v===2?normalize(p):blankProfile()}catch{return blankProfile()}}
    let profile=load(),scenarioIndex=Math.min(profile.unlocked,5),captainId="navigator",state=makeState(scenarioIndex),sonarMode=false;
    function cellsFor(start,dir,len){return Array.from({length:len},(_,i)=>start+(dir==="h"?i:i*N))}
    function createFleet(layout){const board=Array(64).fill(null),ships=layout.map(([start,dir],id)=>{const cells=cellsFor(start,dir,SHIPS[id].len);for(const cell of cells)board[cell]=id;return{id,cells,hits:new Set()}});return{board,ships,shots:new Set()}}
    function aiOrder(seed){const out=[];for(let i=0;i<64;i++)out.push((seed+i*17)%64);return out}
    function makeState(index,captain=captainId){const sc=SCENARIOS[index],cap=CAPTAINS[captain];return{scenario:index,captain,own:createFleet(OWN_LAYOUT),enemy:createFleet(sc.layout),playerShots:0,hits:0,sonar:cap.sonar,sonarUsed:0,armor:cap.armor,aiQueue:aiOrder(sc.seed),aiCursor:0,scans:new Map(),done:false,won:false,stars:0,logs:[`${sc.region}进入静默状态，舰队等待第一轮炮击。`],message:"点击敌方海域开火；声呐会报告九宫格内未毁舰段数。"}}
    function scenario(s=state){return SCENARIOS[s.scenario]}
    function shipAlive(ship){return ship.hits.size<ship.cells.length}
    function fleetAlive(side){return side.ships.filter(shipAlive).length}
    function shootCore(side,index){if(side.shots.has(index))return{ok:false,reason:"该坐标已经射击"};side.shots.add(index);const id=side.board[index];if(id===null)return{ok:true,hit:false,sunk:false,id:null};const ship=side.ships[id];ship.hits.add(index);return{ok:true,hit:true,sunk:!shipAlive(ship),id}}
    function coord(index){return`${COLS[index%N]}${Math.floor(index/N)+1}`}
    function chooseAiTarget(s){for(const ship of s.own.ships)if(ship.hits.size&&shipAlive(ship)){for(const hit of ship.hits){const row=Math.floor(hit/N),col=hit%N;for(const next of [hit-1,hit+1,hit-N,hit+N])if(next>=0&&next<64&&!s.own.shots.has(next)&&Math.abs(Math.floor(next/N)-row)+Math.abs(next%N-col)===1)return next}}while(s.aiCursor<s.aiQueue.length){const target=s.aiQueue[s.aiCursor++];if(!s.own.shots.has(target))return target}return Array.from({length:64},(_,i)=>i).find(i=>!s.own.shots.has(i))}
    function aiTurn(s){const target=chooseAiTarget(s);if(target===undefined)return;const result=shootCore(s.own,target);if(result.hit&&s.armor>0){s.armor--;s.own.ships[result.id].hits.delete(target);s.logs.unshift(`装甲带在 ${coord(target)} 吸收一次命中。`);return}s.logs.unshift(result.hit?`敌军命中 ${coord(target)} 的${SHIPS[result.id].name}${result.sunk?"并将其击沉":""}。`:`敌军炮击 ${coord(target)} 落空。`)}
    function accuracy(s=state){return s.playerShots?Math.round(s.hits/s.playerShots*100):0}
    function bonusMet(s=state){const b=scenario(s).bonus,fleet=fleetAlive(s.own),acc=accuracy(s);if(b.kind==="fleet")return fleet>=b.value;if(b.kind==="accuracy")return acc>=b.value;if(b.kind==="sonar")return s.sonarUsed<=b.value;if(b.kind==="combined")return fleet>=b.value&&s.sonarUsed<=1;return false}
    function checkEnd(s=state,testing=false){if(s.done)return resultOf(s);if(fleetAlive(s.enemy)===0){s.done=true;s.won=true;s.stars=1+(s.playerShots<=scenario(s).par?1:0)+(bonusMet(s)?1:0);s.message=`海域肃清，获得 ${s.stars} 星。`;s.logs.unshift(`${scenario(s).name}行动完成。`);if(!testing){profile.stars[s.scenario]=Math.max(profile.stars[s.scenario],s.stars);profile.best[s.scenario]=profile.best[s.scenario]?Math.min(profile.best[s.scenario],s.playerShots):s.playerShots;profile.unlocked=Math.max(profile.unlocked,Math.min(5,s.scenario+1));profile.clears++;save()}}else if(fleetAlive(s.own)===0){s.done=true;s.won=false;s.stars=0;s.message="己方舰队失去作战能力。"}return resultOf(s)}
    function fireAt(index,s=state,testing=false){if(s.done||scenario(s).reefs.includes(index))return{ok:false,reason:"该坐标无法射击"};const result=shootCore(s.enemy,index);if(!result.ok)return result;s.playerShots++;if(result.hit){s.hits++;s.logs.unshift(`命中 ${coord(index)} 的${SHIPS[result.id].name}${result.sunk?"并将其击沉":""}。`);if(result.sunk)s.sonar=Math.min(4,s.sonar+1)}else s.logs.unshift(`${coord(index)} 未发现敌舰。`);const tempo=result.sunk&&CAPTAINS[s.captain].sinkTempo;if(fleetAlive(s.enemy)>0&&!tempo)aiTurn(s);else if(tempo&&fleetAlive(s.enemy)>0)s.logs.unshift("炮术校射生效，敌军本轮无法还击。");checkEnd(s,testing);if(!testing)renderAll();return{...result,tempo}}
    function scanAt(index,s=state,testing=false){if(s.done||s.sonar<1||scenario(s).reefs.includes(index))return{ok:false,reason:"当前无法扫描"};const row=Math.floor(index/N),col=index%N;let count=0;for(let y=Math.max(0,row-1);y<=Math.min(N-1,row+1);y++)for(let x=Math.max(0,col-1);x<=Math.min(N-1,col+1);x++){const i=y*N+x,id=s.enemy.board[i];if(id!==null&&!s.enemy.ships[id].hits.has(i))count++}s.sonar--;s.sonarUsed++;s.scans.set(index,count);s.message=`${coord(index)} 九宫声呐：发现 ${count} 段未毁舰体。`;s.logs.unshift(s.message);if(!testing)renderAll();return{ok:true,count,index}}
    function resultOf(s){return{ok:s.done&&s.won,scenario:scenario(s).id,stars:s.stars,shots:s.playerShots,hits:s.hits,accuracy:accuracy(s),own:fleetAlive(s.own),enemy:fleetAlive(s.enemy),sonarUsed:s.sonarUsed}}
    function simulateReference(index){const s=makeState(index,"gunner");for(const ship of s.enemy.ships)for(const cell of ship.cells){const result=fireAt(cell,s,true);if(!result.ok)return{ok:false,reason:result.reason,cell};if(s.done)break}return resultOf(s)}
    function applyReference(){captainId="gunner";state=makeState(scenarioIndex,captainId);sonarMode=false;for(const ship of state.enemy.ships)for(const cell of ship.cells){fireAt(cell,state,true);if(state.done)break}const result=resultOf(state);state.message=`参考航迹：${result.stars} 星 / ${result.shots} 发 / 保全 ${result.own} 舰。`;renderAll();return result}
    function validateLayout(sc,index){const errors=[],occupied=new Set();for(const [id,[start,dir]] of sc.layout.entries()){const cells=cellsFor(start,dir,SHIPS[id].len),row=Math.floor(start/N),col=start%N;if(cells.some(cell=>cell<0||cell>=64||(dir==="h"&&Math.floor(cell/N)!==row)||(dir==="v"&&cell%N!==col)))errors.push(`bounds ${index}-${id}`);for(const cell of cells){if(occupied.has(cell))errors.push(`overlap ${index}-${cell}`);if(sc.reefs.includes(cell))errors.push(`reef ${index}-${cell}`);occupied.add(cell)}}return errors}
    function validateContent(){const errors=[];for(const [i,sc] of SCENARIOS.entries()){errors.push(...validateLayout(sc,i));const result=simulateReference(i);if(!result.ok||result.stars!==3)errors.push(`reference ${i}: ${JSON.stringify(result)}`)}return{valid:errors.length===0,errors,scenarios:SCENARIOS.length,ships:SCENARIOS.length*SHIPS.length,captains:Object.keys(CAPTAINS).length,cells:64,references:SCENARIOS.length}}
    function save(){localStorage.setItem(STORAGE,JSON.stringify(profile))}
    function selectScenario(index,force=false){if(index<0||index>5||(!force&&index>profile.unlocked))return false;scenarioIndex=index;state=makeState(index,captainId);sonarMode=false;renderAll();return true}
    function selectCaptain(id){if(!CAPTAINS[id]||state.playerShots>0||state.sonarUsed>0)return false;captainId=id;state=makeState(scenarioIndex,captainId);sonarMode=false;renderAll();return true}
    function checksum(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
    function encode(){const payload=btoa(unescape(encodeURIComponent(JSON.stringify({v:2,u:profile.unlocked,s:profile.stars,b:profile.best,c:profile.clears}))));return`FLEET2.${payload}.${checksum(payload)}`}
    function decode(code){const p=String(code).trim().split(".");if(p.length!==3||p[0]!=="FLEET2"||checksum(p[1])!==p[2])throw Error("舰队档案校验失败");const data=JSON.parse(decodeURIComponent(escape(atob(p[1]))));if(data.v!==2)throw Error("舰队档案版本不兼容");return normalize({v:2,unlocked:data.u,stars:data.s,best:data.b,clears:data.c})}
    function cellContent(side,index,enemy=false){const shot=side.shots.has(index),id=side.board[index];if(shot&&id!==null)return"✕";if(shot)return"·";if(!enemy&&id!==null)return"▰";return""}
    function cellClass(side,index,enemy=false){const shot=side.shots.has(index),id=side.board[index];if(shot&&id!==null)return side.ships[id].hits.size===side.ships[id].cells.length?"sunk":"hit";if(shot)return"miss";if(!enemy&&id!==null)return"ship";return""}
    function renderMissionList(){$("missionList").innerHTML=SCENARIOS.map((sc,i)=>`<button class="mission ${i===scenarioIndex?"active":""}" data-mission="${i}" ${i>profile.unlocked?"disabled":""}><span>${profile.stars[i]?"★".repeat(profile.stars[i]):i<=profile.unlocked?"待战":"锁定"}</span><strong>${i+1}. ${sc.name}</strong><small>${sc.region} · ${sc.par} 发标杆</small></button>`).join("");$("missionList").querySelectorAll("[data-mission]").forEach(b=>b.onclick=()=>selectScenario(+b.dataset.mission))}
    function renderBoards(){const sc=scenario();$("ownGrid").innerHTML=state.own.board.map((_,i)=>`<button class="cell ${cellClass(state.own,i)}" data-own="${i}" aria-label="己方 ${coord(i)}">${cellContent(state.own,i)}</button>`).join("");$("enemyGrid").innerHTML=state.enemy.board.map((_,i)=>{const reef=sc.reefs.includes(i),scan=state.scans.has(i);return`<button class="cell ${reef?"reef":cellClass(state.enemy,i,true)} ${scan?"scanned":""}" data-enemy="${i}" aria-label="敌方 ${coord(i)}${reef?" 礁石":""}" ${reef||state.done?"disabled":""}>${reef?"◆":cellContent(state.enemy,i,true)}${scan?`<small>${state.scans.get(i)}</small>`:""}</button>`}).join("");$("enemyGrid").querySelectorAll("[data-enemy]").forEach(b=>b.onclick=()=>{const i=+b.dataset.enemy;if(sonarMode){const result=scanAt(i);if(result.ok)sonarMode=false;else{state.message=result.reason;renderAll()}}else{const result=fireAt(i);if(!result.ok){state.message=result.reason;renderAll()}}})}
    function renderRight(){const own=fleetAlive(state.own),enemy=fleetAlive(state.enemy),acc=accuracy(),sc=scenario();$("stats").innerHTML=[["己方舰艇",own],["敌方舰艇",enemy],["声呐",state.sonar],["装甲",state.armor],["命中",state.hits],["已开火",state.playerShots]].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join("");const rows=[["击沉全部敌舰",enemy===0],[`炮数 ≤ ${sc.par}`,state.playerShots<=sc.par],[sc.bonus.label,bonusMet()]];$("goals").innerHTML=rows.map(x=>`<div class="goal-row ${x[1]?"ok":""}"><span>${x[0]}</span><b>${x[1]?"达成":"未达"}</b></div>`).join("");$("fleet").innerHTML=state.enemy.ships.map((ship,i)=>`<div class="ship-row ${shipAlive(ship)?"":"sunk"}"><span>${SHIPS[i].name}</span><b>${ship.hits.size}/${ship.cells.length}</b></div>`).join("");$("log").innerHTML=state.logs.slice(0,10).map(x=>`<div>· ${x}</div>`).join("");$("accuracy").textContent=acc}
    function renderAll(){const sc=scenario();renderMissionList();renderBoards();renderRight();$("captains").innerHTML=Object.entries(CAPTAINS).map(([id,c])=>`<button class="captain ${state.captain===id?"active":""}" data-captain="${id}" ${state.playerShots||state.sonarUsed?"disabled":""}><strong>${c.name}</strong><small>${c.text}</small></button>`).join("");$("captains").querySelectorAll("[data-captain]").forEach(b=>b.onclick=()=>selectCaptain(b.dataset.captain));$("missionTitle").textContent=sc.name;$("missionBrief").textContent=sc.brief;$("shots").textContent=state.playerShots;$("message").textContent=state.message;$("sonarActionBtn").classList.toggle("active",sonarMode);$("sonarActionBtn").disabled=state.done||state.sonar<1;$("sonarBtn").disabled=state.done||state.sonar<1}
    function toggleSonar(){if(state.sonar<1||state.done)return;sonarMode=!sonarMode;state.message=sonarMode?"选择敌方中心坐标，扫描周围九宫格。":"声呐扫描已取消。";renderAll()}
    $("sonarBtn").onclick=toggleSonar;$("sonarActionBtn").onclick=toggleSonar;$("cancelSonarBtn").onclick=()=>{sonarMode=false;state.message="声呐扫描已取消。";renderAll()};$("restartBtn").onclick=()=>selectScenario(scenarioIndex,true);$("referenceBtn").onclick=applyReference;$("archiveBtn").onclick=()=>{$("archiveText").value=encode();$("feedback").textContent="";$("archive").classList.remove("hidden")};$("closeBtn").onclick=()=>$("archive").classList.add("hidden");$("copyBtn").onclick=async()=>{$("archiveText").value=encode();$("archiveText").select();try{await navigator.clipboard.writeText($("archiveText").value);$("feedback").textContent="档案已复制。"}catch{$("feedback").textContent="档案已生成，请手动复制。"}};$("importBtn").onclick=()=>{try{profile=decode($("archiveText").value);save();scenarioIndex=Math.min(profile.unlocked,5);state=makeState(scenarioIndex,captainId);$("feedback").textContent="导入成功。";renderAll()}catch(error){$("feedback").textContent=error.message}};
    window.__fleetDuel={SCENARIOS,SHIPS,CAPTAINS,profile:()=>profile,state:()=>state,selectScenario,selectCaptain,fireAt,scanAt,accuracy,fleetAlive,simulateReference,applyReference,validateContent,encode,decode,renderAll};renderAll();
  })();
  </script>
</body>
</html>
