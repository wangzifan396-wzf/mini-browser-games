  <style>
    :root{--ink:#17303b;--muted:#63757d;--paper:#fff;--line:#b9c9cf;--navy:#173c4d;--cyan:#16819a;--red:#b44e51;--gold:#bc8125;--ice:#e9f2f4;--green:#367663;--radius:8px;--shadow:0 12px 28px rgba(23,48,59,.13)}
    *{box-sizing:border-box;letter-spacing:0}html,body{margin:0;min-height:100%;background:#dce6e9;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}button{font:inherit}.app{width:min(1180px,calc(100vw - 24px));margin:auto;padding:16px 0 28px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:17px 20px;border-bottom:4px solid #e2b854;color:#fff;background:var(--navy)}h1{margin:0;font-size:28px}.sub{margin:5px 0 0;color:#c8dbe1;font-size:13px}.totals{display:flex;gap:18px;text-align:right}.totals b{display:block;color:#f2cb70;font-size:20px}.totals span{color:#bfd1d7;font-size:10px}.matches{display:grid;grid-template-columns:repeat(12,minmax(42px,1fr));gap:5px;padding:11px 0}.match{height:46px;border:1px solid #a4b8bf;border-radius:6px;color:#3c5661;background:#f8fbfc;font-weight:900;cursor:pointer}.match.active{border-color:var(--cyan);color:#fff;background:var(--cyan)}.match:disabled{opacity:.42}.match small{display:block;height:11px;color:#f5d47d;font-size:9px}.layout{display:grid;grid-template-columns:minmax(0,780px) 300px;gap:14px;align-items:start}.rink{position:relative;min-height:600px;border:1px solid #91adb8;border-radius:var(--radius);overflow:hidden;background:#0d394b;box-shadow:var(--shadow);touch-action:none}.rink canvas{display:block;width:100%;height:600px}.scoreboard{position:absolute;top:12px;left:50%;z-index:2;display:flex;align-items:center;gap:10px;min-width:200px;padding:7px 10px;border:1px solid rgba(255,255,255,.35);border-radius:6px;transform:translateX(-50%);color:#fff;background:rgba(14,45,57,.86);text-align:center;pointer-events:none}.scoreboard b{flex:1;font-size:25px}.scoreboard span{font-size:10px;color:#bad8df}.side{display:flex;flex-direction:column;gap:10px}.panel{padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}.panel h2,.panel h3{margin:0}.panel h2{font-size:20px}.panel h3{margin-bottom:9px;font-size:14px}.brief{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px 2px;border:1px solid #d2dde1;border-radius:6px;text-align:center;background:#f1f5f6}.stat b{display:block;color:var(--cyan);font-size:17px}.stat span{color:var(--muted);font-size:9px}.paddles{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.paddle{min-height:56px;padding:5px;border:1px solid #a9bbc2;border-radius:6px;color:#37525d;background:#f0f5f6;font-size:11px;font-weight:900;cursor:pointer}.paddle b{display:block;font-size:13px}.paddle.active{border-color:var(--cyan);color:#fff;background:var(--cyan)}.meter{height:9px;margin-top:8px;border-radius:4px;overflow:hidden;background:#d7e1e4}.meter i{display:block;width:0;height:100%;background:#d6a13e}.commands{display:grid;grid-template-columns:1fr 1fr;gap:6px}.commands button,.archive button{min-height:40px;border:1px solid #9aafb7;border-radius:6px;color:#304c57;background:#edf3f4;font-weight:900;cursor:pointer}.commands .primary{grid-column:1/-1;border-color:var(--cyan);color:#fff;background:var(--cyan)}.commands .pulse{border-color:#b98425;color:#65430b;background:#fff0c8}.status{min-height:82px;margin:0;padding:10px;border-left:4px solid var(--cyan);color:#38535e;background:#eaf2f4;font-size:12px;line-height:1.55}.archive{display:grid;grid-template-columns:1fr 1fr;gap:6px}.overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:18px;background:rgba(9,37,47,.84);text-align:center}.overlay[hidden]{display:none}.overlay-card{width:min(430px,100%);padding:23px;border-radius:var(--radius);color:#fff;background:#173c4d;box-shadow:0 24px 60px rgba(0,0,0,.35)}.overlay-card h2{margin:0;font-size:25px}.overlay-card p{color:#c7dae0;line-height:1.6}.overlay-stars{color:#efc45f;font-size:35px}.overlay-card button{min-height:42px;padding:0 20px;border:0;border-radius:6px;color:#17303b;background:#f0c861;font-weight:900;cursor:pointer}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.side .status{grid-column:1/-1}.rink,.rink canvas{min-height:560px;height:560px}}
    @media(max-width:620px){.app{width:calc(100vw - 12px);padding-top:6px}.head{display:block;padding:13px}.totals{justify-content:space-between;margin-top:11px;text-align:left}.matches{grid-template-columns:repeat(6,1fr)}.match{height:39px}.rink,.rink canvas{min-height:520px;height:520px}.scoreboard{top:7px}.side{display:flex}.paddle{min-height:50px}.panel{padding:10px}.sub{font-size:11px}}

<body>
  <main class="app">
    <header class="head"><div><h1>极光冰球：十二席杯赛</h1><p class="sub">读懂对手站位、桌面机关与反弹角度，用战术脉冲打穿十二席擂台。</p></div><div class="totals"><div><b id="starTotal">0 / 36</b><span>杯赛星章</span></div><div><b id="winTotal">0 / 12</b><span>已胜对手</span></div><div><b id="shutoutTotal">0 / 12</b><span>零封场次</span></div></div></header>
    <nav class="matches" id="matches" aria-label="杯赛赛程"></nav>
    <section class="layout">
      <div class="rink" id="rink"><canvas id="canvas"></canvas><div class="scoreboard"><span>挑战者</span><b id="score">0 : 0</b><span id="opponentTop">对手</span></div><div class="overlay" id="overlay"><div class="overlay-card"><h2 id="overlayTitle">准备开球</h2><p id="overlayText"></p><div class="overlay-stars" id="overlayStars"></div><button id="overlayButton">进入球桌</button></div></div></div>
      <aside class="side">
        <section class="panel"><h2 id="matchTitle"></h2><p class="brief" id="matchBrief"></p></section>
        <section class="panel"><div class="stats"><div class="stat"><b id="roundGoal">3</b><span>胜利分数</span></div><div class="stat"><b id="combo">0</b><span>连续回击</span></div><div class="stat"><b id="clock">0:00</b><span>比赛用时</span></div></div></section>
        <section class="panel"><h3>选择球拍</h3><div class="paddles"><button class="paddle" data-paddle="striker"><b>强袭</b>快移 / 窄面</button><button class="paddle" data-paddle="guard"><b>壁垒</b>宽面 / 稳速</button><button class="paddle" data-paddle="vector"><b>折线</b>控角 / 充能</button></div><div class="meter"><i id="meterFill"></i></div></section>
        <section class="panel"><div class="commands"><button class="primary" id="start">开始本场</button><button class="pulse" id="pulse">脉冲 Space</button><button id="pause">暂停</button><button id="restart">重开</button></div></section>
        <p class="status" id="status"></p>
        <section class="panel"><h3>杯赛档案</h3><div class="archive"><button id="exportSave">导出</button><button id="importSave">导入</button></div></section>
      </aside>
    </section>
  </main>
  <script>
  (()=>{
    "use strict";
    const SAVE_KEY="air_hockey_cup_v2",paddles={striker:{name:"强袭",radius:.054,speed:1.65,pulse:1.3,charge:19},guard:{name:"壁垒",radius:.073,speed:1.08,pulse:1.05,charge:15},vector:{name:"折线",radius:.061,speed:1.3,pulse:1.18,charge:25}};
    const matches=[
      {title:"港湾热身",opponent:"巡岸员",brief:"标准球桌。先学会在球拍偏侧触球，主动制造斜线。",rule:"标准桌",goal:3,ai:[1.04,.20,.50],bumpers:[],rec:"guard"},
      {title:"左舷追风",opponent:"斜帆",brief:"单枚偏置挡柱会改写线路，借一次折射绕过守门。",rule:"偏置挡柱",goal:3,ai:[1.10,.17,.56],bumpers:[[.28,.46,.045]],rec:"vector"},
      {title:"双塔门廊",opponent:"门卫",brief:"中央双柱压缩直线空间，底线救球后从外侧反攻。",rule:"双柱桌",goal:3,ai:[1.16,.15,.60],bumpers:[[.38,.46,.042],[.62,.46,.042]],rec:"striker"},
      {title:"窄门试炼",opponent:"针眼",brief:"球门缩窄。耐心做两次横向调度，再寻找空角。",rule:"窄球门",goal:4,ai:[1.20,.14,.63],goalWidth:.22,bumpers:[],rec:"vector"},
      {title:"三角潮汐",opponent:"潮标",brief:"三点挡柱制造连续折射，避免把球拍停在中线。",rule:"三角柱",goal:4,ai:[1.23,.13,.66],bumpers:[[.3,.42,.038],[.7,.42,.038],[.5,.54,.043]],rec:"guard"},
      {title:"加速航道",opponent:"流光",brief:"两侧航道会给冰球加速，提前回撤而非追着球跑。",rule:"加速带",goal:4,ai:[1.27,.12,.69],boost:true,bumpers:[],rec:"striker"},
      {title:"环礁封锁",opponent:"礁影",brief:"四柱围出中央环礁，外圈反弹比正面硬撞更可靠。",rule:"四柱桌",goal:4,ai:[1.31,.11,.72],bumpers:[[.36,.42,.035],[.64,.42,.035],[.36,.58,.035],[.64,.58,.035]],rec:"vector"},
      {title:"脉冲镜面",opponent:"回声",brief:"充能效率提高，贴近冰球释放脉冲可改变攻防节奏。",rule:"高能桌",goal:4,ai:[1.34,.10,.74],charge:1.35,bumpers:[[.5,.5,.046]],rec:"vector"},
      {title:"冰峡穿针",opponent:"峡客",brief:"窄门与双柱叠加，先拉开守门员再走另一侧。",rule:"冰峡桌",goal:5,ai:[1.37,.095,.77],goalWidth:.24,bumpers:[[.4,.48,.04],[.6,.48,.04]],rec:"striker"},
      {title:"逆流回廊",opponent:"逆潮",brief:"侧道加速且中央受阻，接球位置比追求最大力量更重要。",rule:"逆流桌",goal:5,ai:[1.40,.09,.79],boost:true,bumpers:[[.5,.48,.052]],rec:"guard"},
      {title:"极昼四门",opponent:"白昼",brief:"四枚挡柱与窄门要求连续判断；保留脉冲处理失位。",rule:"极昼阵",goal:5,ai:[1.43,.085,.82],goalWidth:.23,charge:1.25,bumpers:[[.3,.43,.034],[.7,.43,.034],[.38,.57,.034],[.62,.57,.034]],rec:"vector"},
      {title:"极光王席",opponent:"冠冕",brief:"所有桌面机制同时登场。把球速、角度和脉冲留给真正的空档。",rule:"王席桌",goal:5,ai:[1.47,.08,.85],goalWidth:.24,boost:true,charge:1.25,bumpers:[[.34,.45,.036],[.66,.45,.036],[.5,.56,.045]],rec:"striker"}
    ];
    const $=id=>document.getElementById(id),canvas=$("canvas"),ctx=canvas.getContext("2d"),rink=$("rink"),overlay=$("overlay"),matchEl=$("matches");let profile=load(),q=null,raf=0,last=0,pointer={x:.5,y:.82},selectedPaddle="guard",audio=null;
    function defaults(){return{version:2,stars:{},best:{},shutouts:{},updatedAt:Date.now()}}
    function normalize(value){const clean=defaults();if(!value||value.version!==2)return clean;for(let i=0;i<matches.length;i++){clean.stars[i]=Math.max(0,Math.min(3,Number(value.stars?.[i])||0));if(Number.isFinite(Number(value.best?.[i])))clean.best[i]=Math.max(0,Number(value.best[i]));clean.shutouts[i]=Boolean(value.shutouts?.[i])}return clean}
    function load(){try{return normalize(JSON.parse(localStorage.getItem(SAVE_KEY)))}catch{return defaults()}}
    function save(){profile.updatedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(profile));renderCampaign()}
    function checksum(text){let h=2166136261;for(const ch of text){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
    function encodeProfile(){const body=btoa(unescape(encodeURIComponent(JSON.stringify(profile))));return`HOCKEY2.${body}.${checksum(body)}`}
    function decodeProfile(code){const part=code.trim().split(".");if(part.length!==3||part[0]!=="HOCKEY2"||checksum(part[1])!==part[2])throw Error("杯赛档案校验失败");return normalize(JSON.parse(decodeURIComponent(escape(atob(part[1])))))}
    function unlocked(index){return index===0||Number(profile.stars[index-1])>0}
    function rng(seed){let value=seed>>>0;return()=>((value=Math.imul(value^value>>>15,1|value),value^=value+Math.imul(value^value>>>7,61|value),(value^value>>>14)>>>0)/4294967296)}
    function makeState(index,paddle=selectedPaddle,simulation=false){const match=matches[index],random=rng(7717+index*911);return{index,match,paddle,random,simulation,run:false,paused:false,ended:false,player:0,enemy:0,combo:0,bestCombo:0,time:0,charge:simulation?100:45,pulseFlash:0,serveDelay:.55,puck:{x:.5,y:.5,vx:(random()-.5)*.22,vy:.47},me:{x:.5,y:.82,vx:0,vy:0},ai:{x:.5,y:.18,vx:0,vy:0},boostLatch:false}}
    function resetPuck(state,towardPlayer=true){state.puck={x:.5,y:.5,vx:(state.random()-.5)*.3,vy:(towardPlayer?1:-1)*(.43+state.index*.008)};state.me.x=.5;state.me.y=.82;state.ai.x=.5;state.ai.y=.18;state.serveDelay=.5;state.boostLatch=false}
    function moveMallet(mallet,target,speed,dt,minY,maxY,radius){const dx=target.x-mallet.x,dy=target.y-mallet.y,d=Math.hypot(dx,dy),travel=Math.min(d,speed*dt),ox=mallet.x,oy=mallet.y;if(d>.0001){mallet.x+=dx/d*travel;mallet.y+=dy/d*travel}mallet.x=Math.max(radius,Math.min(1-radius,mallet.x));mallet.y=Math.max(minY,Math.min(maxY,mallet.y));mallet.vx=(mallet.x-ox)/dt;mallet.vy=(mallet.y-oy)/dt}
    function collideDisc(puck,disc,radius){const dx=puck.x-disc.x,dy=puck.y-disc.y,d=Math.hypot(dx,dy),min=radius+.018;if(d>=min||!d)return false;const nx=dx/d,ny=dy/d,overlap=min-d;puck.x+=nx*overlap;puck.y+=ny*overlap;const relative=(puck.vx-(disc.vx||0))*nx+(puck.vy-(disc.vy||0))*ny;if(relative<0){puck.vx-=1.78*relative*nx;puck.vy-=1.78*relative*ny;puck.vx+=(disc.vx||0)*.34;puck.vy+=(disc.vy||0)*.34}const speed=Math.hypot(puck.vx,puck.vy);if(speed<.34){puck.vx*=.34/(speed||.1);puck.vy*=.34/(speed||.1)}return true}
    function scoreGoal(state,side){if(side==="player"){state.player++;state.combo++;state.bestCombo=Math.max(state.bestCombo,state.combo)}else{state.enemy++;state.combo=0}if(state.player>=state.match.goal||state.enemy>=state.match.goal){state.ended=true;state.run=false;return}resetPuck(state,side==="player")}
    function aiTarget(state){const m=state.match,p=state.puck,attack=m.ai[2],reading=Math.sin(state.time*(1.35+state.index*.04))*m.ai[1];let x=.5,y=.18;if(p.y<.58){x=p.x+reading;y=p.y<.32?Math.max(.12,p.y+.075):.26+attack*.09}else{x=.5+(p.x-.5)*.28;y=.18}return{x:Math.max(.08,Math.min(.92,x)),y:Math.max(.09,Math.min(.43,y))}}
    function goalWidth(state){return Math.min(.52,(state.match.goalWidth||.3)+Math.max(0,state.time-45)*.002)}
    function step(state,input,dt){if(!state.run||state.paused||state.ended)return state;state.time+=dt;state.pulseFlash=Math.max(0,state.pulseFlash-dt);const kit=paddles[state.paddle],overtime=Math.max(0,state.time-55),chargeRate=kit.charge*(state.match.charge||1)*(1+Math.min(1,overtime/70)),aiFatigue=1-Math.min(.7,state.combo*.012+overtime*.005);state.charge=Math.min(100,state.charge+chargeRate*dt);moveMallet(state.me,{x:input.x,y:Math.max(.57,Math.min(.92,input.y))},kit.speed,dt,.55,.92,kit.radius);moveMallet(state.ai,aiTarget(state),state.match.ai[0]*aiFatigue,dt,.08,.45,.061);if(input.pulse&&state.charge>=100){const dx=state.puck.x-state.me.x,dy=state.puck.y-state.me.y,d=Math.hypot(dx,dy);if(d<.265&&state.puck.y>.48){const side=Math.max(-.32,Math.min(.32,(state.puck.x-state.me.x)*2.2));state.puck.vx=side*kit.pulse;state.puck.vy=-(.68+.16*kit.pulse);state.charge=0;state.pulseFlash=.22;state.combo++;state.bestCombo=Math.max(state.bestCombo,state.combo)}}
      if(state.serveDelay>0){state.serveDelay-=dt;return state}const p=state.puck;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.998,dt*60);p.vy*=Math.pow(.998,dt*60);if(p.x<.021){p.x=.021;p.vx=Math.abs(p.vx)}if(p.x>.979){p.x=.979;p.vx=-Math.abs(p.vx)}const goal=goalWidth(state)/2;if(p.y<.018){if(Math.abs(p.x-.5)<goal){scoreGoal(state,"player");return state}p.y=.018;p.vy=Math.abs(p.vy)}if(p.y>.982){if(Math.abs(p.x-.5)<goal){scoreGoal(state,"enemy");return state}p.y=.982;p.vy=-Math.abs(p.vy)}
      if(collideDisc(p,state.me,kit.radius)){p.vy=Math.min(p.vy,-.24);state.combo++;state.bestCombo=Math.max(state.bestCombo,state.combo)}if(collideDisc(p,state.ai,.061))p.vy=Math.max(p.vy,.22);for(const item of state.match.bumpers){const disc={x:item[0],y:item[1],vx:0,vy:0};if(collideDisc(p,disc,item[2])){p.vx*=1.015;p.vy*=1.015}}
      if(state.match.boost){const inLane=(p.x<.18||p.x>.82)&&p.y>.28&&p.y<.72;if(inLane&&!state.boostLatch){p.vx*=1.18;p.vy*=1.18;state.boostLatch=true}else if(!inLane)state.boostLatch=false}const speed=Math.hypot(p.vx,p.vy);if(speed>.92){p.vx*=.92/speed;p.vy*=.92/speed}return state}
    function autoInput(state){const p=state.puck,me=state.me,aim=state.player%2?.062:-.062;let x=.5,y=.82;if(p.y>.48&&p.vy>-.08){const intercept=p.x+p.vx*Math.max(0,(.78-p.y)/(Math.abs(p.vy)+.05));x=Math.max(.07,Math.min(.93,intercept+aim));y=Math.max(.61,Math.min(.86,p.y+.085))}else if(p.y>.64){x=Math.max(.07,Math.min(.93,p.x+aim));y=Math.min(.88,p.y+.07)}else{x=.5+(p.x-.5)*.18;y=.82}return{x,y,pulse:state.charge>=100&&Math.hypot(p.x-me.x,p.y-me.y)<.24&&p.y>.5}}
    function simulateReference(index){const state=makeState(index,matches[index].rec,true);state.run=true;let frames=0;for(;frames<72000&&!state.ended;frames++)step(state,autoInput(state),1/120);return{won:state.player>=state.match.goal,player:state.player,enemy:state.enemy,seconds:+state.time.toFixed(2),frames,paddle:state.paddle}}
    function validateContent(){if(matches.length!==12)throw Error("杯赛场次数量错误");let goals=0,bumpers=0;const references=[];for(let i=0;i<matches.length;i++){const m=matches[i];if(!paddles[m.rec]||m.goal<3)throw Error(`第 ${i+1} 场配置错误`);goals+=m.goal;bumpers+=m.bumpers.length;const result=simulateReference(i);if(!result.won)throw Error(`第 ${i+1} 场自动球员未能获胜`);references.push(result)}return{matches:12,paddles:3,goals,bumpers,referenceWins:references.filter(r=>r.won).length,maxFrames:Math.max(...references.map(r=>r.frames))}}
    function begin(index=q?.index||0){if(!unlocked(index))return;q=makeState(index,selectedPaddle);renderAll();showOverlay("准备开球",`${q.match.opponent} · ${q.match.rule}。率先得到 ${q.match.goal} 分获胜。`,"","开始",()=>{q.run=true;hideOverlay();setStatus("比赛开始。拖动球拍守住下方球门，击球偏侧可以改变反射角。")})}
    function finish(){const won=q.player>q.enemy;if(won){const stars=3-(q.enemy>0?1:0)-(q.time>55+q.index*2?1:0),earned=Math.max(1,stars);profile.stars[q.index]=Math.max(Number(profile.stars[q.index])||0,earned);profile.best[q.index]=Math.min(Number(profile.best[q.index])||Infinity,q.time);if(q.enemy===0)profile.shutouts[q.index]=true;save();showOverlay("本席胜出",`${q.player} : ${q.enemy}，用时 ${clockText(q.time)}。${q.index<11?"下一席已解锁。":"十二席杯赛完成。"}`,"★".repeat(earned),q.index<11?"挑战下一席":"再战王席",()=>begin(q.index<11?q.index+1:q.index))}else showOverlay("本席失守",`${q.player} : ${q.enemy}。观察对手回撤路线，下一次把球送往另一侧空角。`,"","重新挑战",()=>begin(q.index))}
    function showOverlay(title,text,stars,label,action){$("overlayTitle").textContent=title;$("overlayText").textContent=text;$("overlayStars").textContent=stars;$("overlayButton").textContent=label;$("overlayButton").onclick=action;overlay.hidden=false}
    function hideOverlay(){overlay.hidden=true}
    function setStatus(text){$("status").textContent=text}
    function clockText(seconds){return`${Math.floor(seconds/60)}:${String(Math.floor(seconds%60)).padStart(2,"0")}`}
    function renderCampaign(){const stars=Object.values(profile.stars).reduce((s,n)=>s+Number(n||0),0),wins=Object.values(profile.stars).filter(Boolean).length,shutouts=Object.values(profile.shutouts).filter(Boolean).length;$("starTotal").textContent=`${stars} / 36`;$("winTotal").textContent=`${wins} / 12`;$("shutoutTotal").textContent=`${shutouts} / 12`;matchEl.replaceChildren();matches.forEach((m,index)=>{const b=document.createElement("button"),star=Number(profile.stars[index])||0;b.className=`match${q?.index===index?" active":""}`;b.innerHTML=`${String(index+1).padStart(2,"0")}<small>${star?"★".repeat(star):""}</small>`;b.disabled=!unlocked(index);b.title=m.title;b.onclick=()=>begin(index);matchEl.append(b)})}
    function renderAll(){renderCampaign();if(!q)return;$("matchTitle").textContent=`${String(q.index+1).padStart(2,"0")} · ${q.match.title}`;$("matchBrief").textContent=`对手：${q.match.opponent}｜${q.match.brief}`;$("opponentTop").textContent=q.match.opponent;$("roundGoal").textContent=q.match.goal;document.querySelectorAll(".paddle").forEach(b=>b.classList.toggle("active",b.dataset.paddle===selectedPaddle));sync()}
    function sync(){if(!q)return;$("score").textContent=`${q.player} : ${q.enemy}`;$("combo").textContent=q.combo;$("clock").textContent=clockText(q.time);$("meterFill").style.width=`${q.charge}%`;$("pulse").disabled=q.charge<100;$("pause").textContent=q.paused?"继续":"暂停"}
    function resize(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);if(canvas.width!==Math.round(rect.width*dpr)||canvas.height!==Math.round(rect.height*dpr)){canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}}
    function draw(){if(!q)return;resize();const w=canvas.clientWidth,h=canvas.clientHeight,g=goalWidth(q)*w,gradient=ctx.createLinearGradient(0,0,0,h);gradient.addColorStop(0,"#174d60");gradient.addColorStop(.5,"#d9eef0");gradient.addColorStop(1,"#1d596b");ctx.fillStyle=gradient;ctx.fillRect(0,0,w,h);ctx.strokeStyle="rgba(255,255,255,.72)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();ctx.beginPath();ctx.arc(w/2,h/2,Math.min(w,h)*.12,0,Math.PI*2);ctx.stroke();ctx.lineWidth=7;ctx.strokeStyle="#d7eef2";ctx.beginPath();ctx.moveTo(0,3);ctx.lineTo((w-g)/2,3);ctx.moveTo((w+g)/2,3);ctx.lineTo(w,3);ctx.moveTo(0,h-3);ctx.lineTo((w-g)/2,h-3);ctx.moveTo((w+g)/2,h-3);ctx.lineTo(w,h-3);ctx.stroke();if(q.match.boost){ctx.fillStyle="rgba(236,190,67,.28)";ctx.fillRect(0,h*.28,w*.18,h*.44);ctx.fillRect(w*.82,h*.28,w*.18,h*.44);ctx.fillStyle="rgba(114,75,10,.65)";ctx.font="700 11px system-ui";ctx.fillText("BOOST",8,h*.5);ctx.fillText("BOOST",w-48,h*.5)}for(const b of q.match.bumpers){const radial=ctx.createRadialGradient(b[0]*w,b[1]*h,2,b[0]*w,b[1]*h,b[2]*w);radial.addColorStop(0,"#f3d271");radial.addColorStop(1,"#9c6820");ctx.fillStyle=radial;ctx.beginPath();ctx.arc(b[0]*w,b[1]*h,b[2]*w,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff4c5";ctx.lineWidth=2;ctx.stroke()}drawMallet(q.ai,.061,"#c85659");drawMallet(q.me,paddles[q.paddle].radius,"#157d96");ctx.shadowBlur=14;ctx.shadowColor="#ffe79d";ctx.fillStyle="#fff7cf";ctx.beginPath();ctx.arc(q.puck.x*w,q.puck.y*h,Math.max(7,w*.018),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(q.pulseFlash>0){ctx.strokeStyle=`rgba(241,194,73,${q.pulseFlash*4})`;ctx.lineWidth=5;ctx.beginPath();ctx.arc(q.me.x*w,q.me.y*h,w*(.08+(.22-q.pulseFlash)*.45),0,Math.PI*2);ctx.stroke()}}
    function drawMallet(mallet,radius,color){const w=canvas.clientWidth,h=canvas.clientHeight,rad=Math.max(17,radius*w);ctx.shadowBlur=12;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();ctx.arc(mallet.x*w,mallet.y*h,rad,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle="rgba(255,255,255,.8)";ctx.lineWidth=3;ctx.stroke()}
    function loop(now){const dt=Math.min(.025,(now-last)/1000||0);last=now;if(q?.run&&!q.paused&&!q.ended){step(q,{...pointer,pulse:false},dt);if(q.ended)finish();sync()}draw();raf=requestAnimationFrame(loop)}
    function tone(){try{audio??=new AudioContext();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=180;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}catch{}}
    function pulse(){if(!q?.run||q.paused)return;const before=q.charge;step(q,{...pointer,pulse:true},1/240);if(before!==q.charge){tone();setStatus("战术脉冲已释放：近距离冰球被强制推向对方半场。")}}
    rink.addEventListener("pointerdown",event=>{if(event.target!==canvas)return;rink.setPointerCapture?.(event.pointerId);movePointer(event)});rink.addEventListener("pointermove",event=>{if(event.target===canvas||rink.hasPointerCapture?.(event.pointerId))movePointer(event)});function movePointer(event){const r=canvas.getBoundingClientRect();pointer={x:Math.max(.02,Math.min(.98,(event.clientX-r.left)/r.width)),y:Math.max(.55,Math.min(.94,(event.clientY-r.top)/r.height))}}
    document.addEventListener("keydown",event=>{if(event.code==="Space"){event.preventDefault();pulse()}const delta=.055;if(event.key==="ArrowLeft")pointer.x-=delta;if(event.key==="ArrowRight")pointer.x+=delta;if(event.key==="ArrowUp")pointer.y-=delta;if(event.key==="ArrowDown")pointer.y+=delta;pointer.x=Math.max(.02,Math.min(.98,pointer.x));pointer.y=Math.max(.55,Math.min(.94,pointer.y))});
    document.querySelectorAll(".paddle").forEach(button=>button.onclick=()=>{selectedPaddle=button.dataset.paddle;if(q&&!q.run){q.paddle=selectedPaddle;q.me={x:.5,y:.82,vx:0,vy:0}}renderAll();setStatus(`${paddles[selectedPaddle].name}球拍已装配。`) });
    $("start").onclick=()=>begin(q?.index||0);$("pulse").onclick=pulse;$("pause").onclick=()=>{if(!q?.run)return;q.paused=!q.paused;sync();setStatus(q.paused?"比赛暂停。":"比赛继续。")};$("restart").onclick=()=>begin(q?.index||0);$("exportSave").onclick=async()=>{const code=encodeProfile();try{await navigator.clipboard.writeText(code);setStatus("HOCKEY2 档案已复制到剪贴板。")}catch{prompt("复制杯赛档案",code)}};$("importSave").onclick=()=>{const code=prompt("粘贴 HOCKEY2 杯赛档案");if(!code)return;try{profile=decodeProfile(code);save();begin(0);setStatus("杯赛档案导入成功。")}catch(error){setStatus(error.message)}};
    window.__airHockeyTest={matches,paddles,makeState,step,autoInput,simulateReference,validateContent,getState:()=>q,getProfile:()=>profile,encodeProfile,decodeProfile,begin,forceFinish:(player,enemy,time=20)=>{q.player=player;q.enemy=enemy;q.time=time;q.ended=true;q.run=false;finish()}};
    q=makeState(0,selectedPaddle);renderAll();setStatus("选择球拍后开始第一席。球拍只能在下半场移动，空格键或按钮释放满能量脉冲。");showOverlay("十二席杯赛",`首战对手：${matches[0].opponent}。三种球拍均可随时更换，杯赛会自动保存。`,"","进入首战",()=>begin(0));raf=requestAnimationFrame(loop);
  })();
