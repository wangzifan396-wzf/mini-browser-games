      .side{display:grid;align-content:start;gap:12px}.panel{border:1px solid var(--line);border-top:5px solid var(--teal);background:var(--paper)}.panel-inner{padding:13px}.panel h3{margin:0 0 11px;font-size:18px}.metrics{display:grid;grid-template-columns:1fr 1fr;border:1px solid #b5c3bf}.metric{padding:10px;text-align:center}.metric:nth-child(odd){border-right:1px solid #b5c3bf}.metric:nth-child(-n+2){border-bottom:1px solid #b5c3bf}.metric b{display:block;font-size:22px}.metric span{color:var(--muted);font-size:11px;font-weight:800}.brief{margin:10px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.goals{display:grid;gap:7px}.goal{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:9px;border-left:4px solid #a1b2ad;background:#edf2ee}.goal.done{border-color:var(--gold);background:#fff7d8}.goal strong:first-child{color:var(--teal)}.goal b{white-space:nowrap}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}.command{min-height:44px;padding:0 10px;border:1px solid #88a09a;border-radius:var(--radius);color:var(--ink);background:#edf2ee;font-weight:900}.command.primary{border-color:#0e5b60;color:#fff;background:var(--teal)}.command.danger{border-color:#aa473d;color:#fff;background:var(--red)}.status-line{min-height:37px;margin:9px 0 0;color:var(--muted);font-size:12px;line-height:1.45;text-align:center}.legend{display:grid;gap:7px}.legend-item{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center}.legend-item b{display:grid;place-items:center;width:34px;height:34px;border-radius:6px;color:#fff;background:var(--steel)}.legend-item strong,.legend-item small{display:block}.legend-item small{color:var(--muted);font-size:10px}

  <body>
    <header class="topbar">
      <div class="brand"><h1>齿轮校时：十二座钟芯委托</h1><p>齿数比 · 转向 · 扭矩 · 槽位约束</p></div>
      <div class="top-actions">
        <button class="icon-button" id="contractButton" title="选择委托" aria-label="选择委托">▦</button>
        <button class="icon-button" id="archiveButton" title="钟芯档案" aria-label="钟芯档案">⇄</button>
        <button class="icon-button" id="muteButton" title="声音" aria-label="切换声音">♪</button>
      </div>
    </header>
    <main class="app">
      <section class="contract-head"><div><p class="chapter" id="chapterText">第一辑 · 单级传动</p><h2 id="contractName">01 分针复位</h2></div><div class="saved-stars" id="savedStars">☆☆☆</div></section>
      <section class="layout">
        <div class="workbench">
          <div class="canvas-wrap" id="canvasWrap"><canvas id="gearCanvas" aria-label="钟芯齿轮传动预览"></canvas></div>
          <section class="slots-section"><div class="section-head"><h3>钟芯级位</h3><span class="selection-note" id="selectionNote">先选传动匣，再点级位装入</span></div><div class="slot-rack" id="slotRack"></div></section>
          <section class="inventory-section"><div class="section-head"><h3>传动匣库</h3><span class="selection-note" id="inventoryCount"></span></div><div class="module-grid" id="moduleGrid"></div></section>
        </div>
        <aside class="side">
          <section class="panel"><div class="panel-inner"><h3>实时校时</h3><div class="metrics">
            <div class="metric"><b id="rpmText">--</b><span>输出 RPM</span></div>
            <div class="metric"><b id="directionText">--</b><span>输出方向</span></div>
            <div class="metric"><b id="torqueText">--</b><span>输出扭矩</span></div>
            <div class="metric"><b id="ratioText">1:1</b><span>总传动比</span></div>
          </div><p class="brief" id="briefText"></p></div></section>
          <section class="panel"><div class="panel-inner"><h3>三星验收</h3><div class="goals" id="goals"></div></div></section>
          <section class="panel"><div class="panel-inner"><h3>校时操作</h3><div class="controls">
            <button class="command" id="flipButton">翻面</button><button class="command" id="removeButton">取下</button>
            <button class="command" id="undoButton">撤回</button><button class="command" id="hintButton">提示</button>
            <button class="command danger" id="clearButton">清空</button><button class="command primary" id="verifyButton">验收</button>
          </div><p class="status-line" id="statusLine">目标转速、方向和最低扭矩必须同时满足</p></div></section>
          <section class="panel"><div class="panel-inner"><h3>传动规则</h3><div class="legend">
            <div class="legend-item"><b>啮</b><span><strong>齿轮啮合</strong><small>每经过一级反转一次方向</small></span></div>
            <div class="legend-item"><b style="background:#31816e">带</b><span><strong>同向柔传</strong><small>保持方向，效率通常更高</small></span></div>
            <div class="legend-item"><b style="background:#d6a62c">翻</b><span><strong>传动匣翻面</strong><small>交换输入齿数与输出齿数</small></span></div>
          </div></div></section>
        </aside>
      </section>
    </main>

    <dialog id="contractDialog"><div class="dialog-head"><h2>十二座钟芯委托</h2><button class="close" data-close="contractDialog" aria-label="关闭">×</button></div><div class="dialog-body" id="contractGrid"></div></dialog>
    <dialog id="archiveDialog"><div class="dialog-head"><h2>GEAR2 钟芯档案</h2><button class="close" data-close="archiveDialog" aria-label="关闭">×</button></div><div class="dialog-body"><p class="dialog-copy" id="archiveMessage">档案保存十二座星级、最佳扭矩与当前委托，可跨设备导入；被修改的档案会被拒绝。</p><textarea class="archive-box" id="archiveText" aria-label="GEAR2 档案码"></textarea><div class="dialog-actions"><button class="command" id="copyArchive">复制</button><button class="command" id="importArchive">导入并校验</button><button class="command primary" data-close="archiveDialog">返回工台</button></div></div></dialog>
    <dialog id="resultDialog"><div class="dialog-head"><h2>钟芯验收</h2><button class="close" data-close="resultDialog" aria-label="关闭">×</button></div><div class="dialog-body result"><p class="chapter" id="resultChapter"></p><h3 id="resultTitle"></h3><div class="result-stars" id="resultStars"></div><p class="result-summary" id="resultSummary"></p><div class="dialog-actions"><button class="command" id="retryResult">重新装配</button><button class="command primary" id="nextResult">下一座</button></div></div></dialog>

    <script>
      (() => {
        const M=(id,name,a,b,kind,material,eff)=>({id,name,a,b,kind,material,eff});
        const MODULES=[
          M("g12_24","黄铜 12/24",12,24,"mesh","brass",.94),M("g14_28","精钢 14/28",14,28,"mesh","steel",.97),M("g16_24","黄铜 16/24",16,24,"mesh","brass",.95),M("g18_30","精钢 18/30",18,30,"mesh","steel",.97),
          M("g20_30","黄铜 20/30",20,30,"mesh","brass",.95),M("g24_36","精钢 24/36",24,36,"mesh","steel",.96),M("g15_25","精钢 15/25",15,25,"mesh","steel",.97),M("g21_28","黄铜 21/28",21,28,"mesh","brass",.95),
          M("g24_32","精钢 24/32",24,32,"mesh","steel",.98),M("g18_27","黄铜 18/27",18,27,"mesh","brass",.95),M("g20_25","精钢 20/25",20,25,"mesh","steel",.98),M("g24_30","黄铜 24/30",24,30,"mesh","brass",.96),
          M("b12_18","纤维 12/18",12,18,"belt","fiber",.99),M("b16_24","纤维 16/24",16,24,"belt","fiber",.99),M("b20_30","皮带 20/30",20,30,"belt","fiber",.98),M("b18_24","纤维 18/24",18,24,"belt","fiber",.99),
          M("b24_36","皮带 24/36",24,36,"belt","fiber",.98),M("b20_25","皮带 20/25",20,25,"belt","fiber",.99),M("b21_28","纤维 21/28",21,28,"belt","fiber",.99),M("b24_32","皮带 24/32",24,32,"belt","fiber",.98)
        ];
        const S=(kind="any",material="any",max=40)=>({kind,material,max});
        const C=(id,chapter,name,input,torque,inventory,slots,reference,brief)=>({id,chapter,name,input,torque,inventory,slots,reference,brief});
        const CONTRACTS=[
          C("minute","第一辑 · 单级传动","分针复位",60,12,["g12_24","b18_24","g16_24","b12_18"],[S("mesh","any",28),S("belt","any",28)],[["g12_24",0],["b18_24",1]],"啮合级负责降速，柔传级翻面补回一部分转速。"),
          C("harbor","第一辑 · 单级传动","港钟快摆",48,14,["g14_28","g21_28","g18_30","g20_30"],[S("mesh","steel",30),S("mesh","any",30)],[["g14_28",1],["g21_28",0]],"两次啮合恢复原方向，精钢首级必须承受输入冲击。"),
          C("tram","第一辑 · 单级传动","电车报时",72,13,["b12_18","g18_30","g20_25","b20_30","g16_24"],[S("belt","any",30),S("mesh","any",30),S("any","any",30)],[["b12_18",0],["g18_30",1],["g20_25",0]],"三级混合传动需要在降速后用翻面精钢匣恢复扭矩余量。"),
          C("gallery","第二辑 · 复合钟列","展厅逆摆",90,15,["g20_30","b16_24","g18_30","g24_32","b20_25"],[S("mesh","brass",32),S("belt","any",32),S("mesh","steel",32)],[["g20_30",1],["b16_24",0],["g18_30",0]],"首级升速、柔传降速、末级精钢再校正，最终保持两次反转。"),
          C("observatory","第二辑 · 复合钟列","星台恒动",54,18,["g15_25","b20_25","g24_30","g24_32","b18_24"],[S("mesh","steel",28),S("belt","any",28),S("mesh","brass",32)],[["g15_25",0],["b20_25",1],["g24_30",1]],"狭窄钟芯限制前两级直径，黄铜末级必须翻面拉高输出。"),
          C("station","第二辑 · 复合钟列","总站母钟",80,20,["b16_24","g24_36","b21_28","g20_25","g18_30","b12_18"],[S("belt","any",28),S("mesh","steel",36),S("belt","any",30),S("mesh","any",28)],[["b16_24",0],["g24_36",1],["b21_28",0],["g20_25",0]],"四级母钟同时约束两处柔传和一处大直径精钢升速。"),
          C("lighthouse","第三辑 · 逆向擒纵","灯塔夜轮",66,22,["g20_25","g18_30","b24_36","g24_30","g16_24","b20_25"],[S("any","any",25),S("mesh","steel",30),S("belt","any",36),S("mesh","brass",32)],[["g20_25",0],["g18_30",1],["b24_36",0],["g24_30",1]],"紧凑首级之后连续升降，两个啮合级让灯塔刻度保持正向。"),
          C("theater","第三辑 · 逆向擒纵","剧院幕钟",96,19,["g12_24","g21_28","b24_32","g24_32","g15_25","b16_24"],[S("mesh","any",28),S("mesh","brass",30),S("belt","any",32),S("mesh","steel",32)],[["g12_24",1],["g21_28",0],["b24_32",0],["g24_32",0]],"三处啮合使幕钟逆向，柔传级承担中段平滑降速。"),
          C("archive","第三辑 · 逆向擒纵","档案馆静摆",75,21,["b18_24","g18_27","g15_25","b20_30","g24_32","b12_18"],[S("belt","any",26),S("mesh","brass",28),S("mesh","steel",28),S("belt","any",30)],[["b18_24",1],["g18_27",0],["g15_25",1],["b20_30",0]],"静摆要求两处高效柔传，黄铜与精钢啮合级必须占据各自材料位。"),
          C("museum","第四辑 · 总芯验收","博物馆联钟",84,24,["g14_28","b21_28","g24_30","b12_18","g20_25","g18_27","b20_30"],[S("mesh","steel",30),S("belt","any",30),S("mesh","brass",32),S("belt","any",24),S("mesh","any",28)],[["g14_28",1],["b21_28",0],["g24_30",0],["b12_18",1],["g20_25",0]],"五级联钟有两处小直径门槛，材料和翻面次序共同决定输出。"),
          C("civic","第四辑 · 总芯验收","市政塔钟",64,26,["b20_25","g18_30","g21_28","b24_36","g24_32","g16_24","b18_24"],[S("belt","any",28),S("mesh","steel",30),S("mesh","brass",30),S("belt","any",36),S("mesh","steel",32)],[["b20_25",1],["g18_30",0],["g21_28",1],["b24_36",0],["g24_32",1]],"塔钟需要在五级损耗后保住扭矩，三次啮合决定最终逆向。"),
          C("master","第四辑 · 总芯验收","总师终校",120,30,["g24_36","b16_24","g24_30","b21_28","g15_25","g20_25","b24_32"],[S("mesh","steel",36),S("belt","any",26),S("mesh","brass",32),S("belt","any",30),S("mesh","steel",28)],[["g24_36",0],["b16_24",1],["g24_30",1],["b21_28",0],["g15_25",1]],"终校把大直径降速、两处柔传与两次升速压入五个受限级位。")
        ];
        const moduleById=(id)=>MODULES.find((module)=>module.id===id);
        function gcd(a,b){while(b){const next=a%b;a=b;b=next}return Math.abs(a)||1}
