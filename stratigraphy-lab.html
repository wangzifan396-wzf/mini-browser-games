</style></head><body><main class="app"><header class="top"><div><h1>地层档案：十二座遗址年代序</h1><div class="sub">依据覆盖、切穿与上下关系，把遗址事件从最早排到最晚；只有唯一拓扑序才进入档案。</div></div><div class="stats"><div class="stat"><small>遗址</small><b id="siteStat">1 / 12</b></div><div class="stat"><small>事件</small><b id="eventStat">0</b></div><div class="stat"><small>矛盾证据</small><b id="violationStat">0</b></div><div class="stat"><small>交换</small><b id="moveStat">0 / 0</b></div><div class="stat"><small>最佳</small><b id="starStat">☆☆☆</b></div></div></header><div class="layout"><section class="panel site"><div class="site-head"><div><h2 id="siteTitle"></h2><div class="sub" id="siteBrief"></div></div><span class="chapter" id="chapterLabel"></span></div><canvas id="sectionCanvas" width="960" height="300" aria-label="遗址地层剖面"></canvas><div class="sequence" id="sequence"></div><div class="controls"><button class="btn primary" id="submitBtn">提交年代序</button><button class="btn blue" id="hintBtn">档案员校序</button><button class="btn" id="undoBtn">撤回交换</button><button class="btn" id="resetBtn">重置乱序</button><button class="btn" id="archiveBtn">档案码</button><button class="btn" id="bookBtn">遗址目录</button></div><div class="message" id="message"></div></section><aside class="side"><section class="panel section"><h2>相对年代证据</h2><div class="clues" id="clues"></div></section><section class="panel section"><h2>事件卡说明</h2><div id="notes"></div></section><section class="panel section"><h2>规则</h2><div class="message">顺序从左到右表示最早到最晚。先点一张事件卡，再点另一张即可交换。证据全部满足才通过；三星要求达到公开最少交换数且不使用校序。本作是抽象逻辑谜题，不替代真实考古判断。</div></section></aside></div></main><div class="overlay" id="bookOverlay"><section class="modal"><h2>十二座遗址年代序</h2><p>四章逐步增加事件和交叉证据。每座遗址均由正式拓扑求解器证明恰好一条合法年代序。</p><div class="sites" id="sites"></div></section></div><div class="overlay hidden" id="infoOverlay"><section class="modal"><h2 id="infoTitle"></h2><div id="infoBody"></div><div class="controls"><button class="btn primary" id="closeInfoBtn">返回地层台</button></div></section></div><script>
(()=>{"use strict";const $=id=>document.getElementById(id),SAVE="stratigraphyLabV2",canvas=$("sectionCanvas"),ctx=canvas.getContext("2d"),NAMES=["河湾探方","山门基址","旧港仓址","北坡聚落","盐路驿站","古井院落","城墙转角","窑场废址","寺前街面","沙洲码头","王庭侧院","终局复合区"],BRIEFS=["六个基础沉积事件，先理解上下覆盖关系。","加入铺面与填土的先后关系。","切槽事件必须晚于被切地层。","交叉证据开始连接不同区域。","七至八个事件形成更长年代链。","填土、使用面和废弃层需要分开。","九事件遗址加入重复类型卡。","关系文本不再按卡片名称暗示年代。","交叉切穿证据增加。","十至十一事件复合遗址。","最少交换数提高，先规划再交换。","终局十一事件与完整交叉证据。"],BASE=[{n:"河砂沉积",i:"🟨",d:"自然沉积层"},{n:"炭灰层",i:"⬛",d:"火烧或废弃痕迹"},{n:"石墙基槽",i:"🧱",d:"切入旧层的营造事件"},{n:"陶片填土",i:"🏺",d:"回填形成的新堆积"},{n:"洪水淤层",i:"🌊",d:"覆盖既有使用面"},{n:"木柱坑",i:"🪵",d:"柱坑切入早期地层"},{n:"炉址废弃",i:"🔥",d:"炉体停用后的堆积"},{n:"道路铺面",i:"🛣️",d:"人为整平形成表面"},{n:"排水沟槽",i:"⛏️",d:"切穿在先地层"},{n:"坍塌堆积",i:"🪨",d:"建筑废弃后的覆盖层"},{n:"表土封存",i:"🌱",d:"遗址最晚封存层"}];
function rng(seed){let x=seed>>>0;return()=>{x+=0x6d2b79f5;let t=x;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}function shuffled(n,seed){const a=Array.from({length:n},(_,i)=>i),r=rng(seed);for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function minSwaps(from,to){const target=Object.fromEntries(to.map((id,index)=>[id,index])),p=from.map(id=>target[id]),seen=Array(p.length).fill(false);let swaps=0;for(let i=0;i<p.length;i++){if(seen[i]||p[i]===i)continue;let size=0,j=i;while(!seen[j]){seen[j]=true;j=p[j];size++}swaps+=size-1}return swaps}
function buildSite(index){const count=6+Math.floor(index/2),chapter=Math.floor(index/3),idOrder=shuffled(count,1009+index*97),events=idOrder.map((id,pos)=>{const base=BASE[(pos+index*2)%BASE.length];return{id,pos,n:`${base.n}${String.fromCharCode(65+id)}`,i:base.i,d:base.d,color:["#c89b5d","#56473b","#9b6f4c","#d7b076","#657d82","#876c50"][pos%6]}}),reference=[...events].sort((a,b)=>a.pos-b.pos).map(e=>e.id),byPos=Object.fromEntries(events.map(e=>[e.pos,e])),clues=[];for(let pos=0;pos<count-1;pos++){const older=byPos[pos],newer=byPos[pos+1],kind=(pos+index)%4,text=kind===0?`${older.n} 位于 ${newer.n} 之下`:kind===1?`${newer.n} 覆盖 ${older.n}`:kind===2?`${newer.n} 形成时，${older.n} 已经存在`:`${older.n} 早于 ${newer.n}`;clues.push({older:older.id,newer:newer.id,text})}for(let pos=0;pos<count-2;pos+=2){const older=byPos[pos],newer=byPos[Math.min(count-1,pos+2+(index%2))];clues.push({older:older.id,newer:newer.id,text:`交叉记录：${newer.n} 晚于 ${older.n}`})}const initial=shuffled(count,7001+index*131).map(position=>reference[position]);if(initial.every((id,i)=>id===reference[i]))[initial[0],initial[1]]=[initial[1],initial[0]];return{index,n:NAMES[index],brief:BRIEFS[index],chapter,events,reference,initial,clues,par:minSwaps(initial,reference)}}
const SITES=Array.from({length:12},(_,i)=>buildSite(i));function countOrders(item,limit=2){const ids=item.events.map(e=>e.id),before=Object.fromEntries(ids.map(id=>[id,new Set()]));item.clues.forEach(c=>before[c.newer].add(c.older));let count=0;function walk(done){if(count>=limit)return;if(done.length===ids.length){count++;return}for(const id of ids)if(!done.includes(id)&&[...before[id]].every(x=>done.includes(x)))walk([...done,id])}walk([]);return count}function evaluate(index,order,hints=0,moves=0){const item=SITES[index],positions=Object.fromEntries(order.map((id,i)=>[id,i])),violations=item.clues.filter(c=>positions[c.older]>=positions[c.newer]),complete=order.length===item.events.length&&new Set(order).size===item.events.length,pass=complete&&!violations.length,efficient=pass&&moves<=item.par+1,master=efficient&&moves<=item.par&&hints===0,stars=pass?1+(efficient?1:0)+(master?1:0):0;return{pass,complete,violations,moves,hints,efficient,master,stars}}function referenceResult(index){const item=SITES[index];return evaluate(index,item.reference,0,item.par)}function validateContent(){const errors=[],references=[];for(const item of SITES){const solutions=countOrders(item);if(solutions!==1)errors.push(`${item.n} 拓扑序数量 ${solutions}`);if(evaluate(item.index,item.initial).pass)errors.push(`${item.n} 初始乱序已通过`);const ref=referenceResult(item.index);references.push({name:item.n,events:item.events.length,clues:item.clues.length,solutions,par:item.par,stars:ref.stars});if(ref.stars!==3)errors.push(`${item.n} 参考年代序未三星`)}return{valid:!errors.length,errors,sites:SITES.length,events:SITES.reduce((s,x)=>s+x.events.length,0),clues:SITES.reduce((s,x)=>s+x.clues.length,0),unique:SITES.filter(x=>countOrders(x)===1).length,references}}
function freshProfile(){return{v:2,unlocked:1,stars:Array(12).fill(0),bestMoves:Array(12).fill(null),clears:0}}function norm(v={}){return{v:2,unlocked:Math.max(1,Math.min(12,+v.unlocked||1)),stars:Array.from({length:12},(_,i)=>Math.max(0,Math.min(3,+v.stars?.[i]||0))),bestMoves:Array.from({length:12},(_,i)=>Number.isInteger(v.bestMoves?.[i])?v.bestMoves[i]:null),clears:+v.clears||0}}function fresh(index){const item=SITES[index];return{v:2,site:index,order:[...item.initial],selected:null,history:[],moves:0,hints:0,finished:false,message:"顺序从左到右为最早到最晚。选择两张事件卡即可交换。"}}let profile=freshProfile(),q=null;function hash(t){let h=2166136261;for(const c of t){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}function encode(){const p=btoa(unescape(encodeURIComponent(JSON.stringify({v:2,profile,q}))));return`STRATA2.${p}.${hash(p)}`}function decode(code){const m=String(code).trim().match(/^STRATA2\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/);if(!m||hash(m[1])!==m[2])throw Error("档案校验失败");const d=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(d.v!==2||!Array.isArray(d.profile?.stars))throw Error("档案版本不兼容");return{v:2,profile:norm(d.profile),q:d.q}}function save(){localStorage.setItem(SAVE,JSON.stringify({v:2,profile,q}))}function load(){try{const d=JSON.parse(localStorage.getItem(SAVE));if(d?.v===2){profile=norm(d.profile);q=d.q}}catch{}}function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),1400)}
function start(index){if(index>=profile.unlocked)return;q=fresh(index);$("bookOverlay").classList.add("hidden");$("infoOverlay").classList.add("hidden");save();draw()}function choose(id){if(q.selected==null){q.selected=id;q.message="已选择第一张事件卡，再选一张即可交换。";return draw()}if(q.selected===id){q.selected=null;q.message="已取消选择。";return draw()}const a=q.order.indexOf(q.selected),b=q.order.indexOf(id);q.history.push({order:[...q.order],moves:q.moves});[q.order[a],q.order[b]]=[q.order[b],q.order[a]];q.moves++;q.selected=null;q.message=`已交换第 ${a+1} 与第 ${b+1} 张事件卡。`;save();draw()}function undo(){const old=q.history.pop();if(!old)return toast("没有可撤回的交换");q.order=old.order;q.moves=old.moves;q.selected=null;q.message="已撤回上一次交换。";save();draw()}function hint(){const item=SITES[q.site];q.history.push({order:[...q.order],moves:q.moves});q.order=[...item.reference];q.moves+=item.par;q.hints++;q.selected=null;q.message="档案员校序已装入；本次最高两星。";save();draw();return evaluate(q.site,q.order,q.hints,q.moves)}function submit(){const item=SITES[q.site],r=evaluate(q.site,q.order,q.hints,q.moves);if(!r.pass){q.message=`年代序未通过：仍有 ${r.violations.length} 条证据与当前排序矛盾。`;save();draw();return r}q.finished=true;profile.stars[q.site]=Math.max(profile.stars[q.site],r.stars);profile.bestMoves[q.site]=profile.bestMoves[q.site]==null?r.moves:Math.min(profile.bestMoves[q.site],r.moves);profile.unlocked=Math.max(profile.unlocked,Math.min(12,q.site+2));profile.clears++;save();$("infoTitle").textContent=`年代序归档 · ${item.n}`;$("infoBody").innerHTML=`<div class="result"><strong>${"★".repeat(r.stars)}${"☆".repeat(3-r.stars)}</strong><ul><li>${item.events.length} 个事件与 ${item.clues.length} 条证据全部一致</li><li>正式求解器：唯一年代序</li><li>交换：${r.moves} / 最少 ${item.par}</li><li>档案员校序：${q.hints}</li></ul>${q.site<11?'<button class="btn primary" id="nextBtn">下一座遗址</button>':""}</div>`;$("infoOverlay").classList.remove("hidden");if($("nextBtn"))$("nextBtn").onclick=()=>start(q.site+1);draw();return r}
function drawCanvas(){const item=SITES[q.site],byId=Object.fromEntries(item.events.map(e=>[e.id,e])),r=evaluate(q.site,q.order,q.hints,q.moves);ctx.clearRect(0,0,960,300);ctx.fillStyle="#20170f";ctx.fillRect(0,0,960,300);const h=220/q.order.length;q.order.forEach((id,index)=>{const e=byId[id],y=260-(index+1)*h;ctx.fillStyle=e.color;ctx.fillRect(80,y,800,h-2);ctx.fillStyle="#1b130d";ctx.font="bold 14px sans-serif";ctx.textAlign="left";ctx.fillText(`${index+1}. ${e.i} ${e.n}`,95,y+h*.65)});ctx.fillStyle=r.violations.length?"#ff7e7f":"#79d5a1";ctx.font="bold 17px sans-serif";ctx.textAlign="center";ctx.fillText(r.violations.length?`当前仍有 ${r.violations.length} 条矛盾证据`:`全部证据一致，可提交归档`,480,288);ctx.fillStyle="#cbbba8";ctx.font="13px sans-serif";ctx.fillText("上方较晚 · 下方较早（卡片顺序仍按左到右：最早 → 最晚）",480,22)}function drawBook(){$("sites").innerHTML=SITES.map((item,index)=>`<button class="site-card" data-site="${index}" ${index>=profile.unlocked?"disabled":""}><span>${["🏺","⛏️","🧱","📜"][item.chapter]}</span><h3>${index+1}. ${item.n}</h3><p>第 ${item.chapter+1} 章 · ${item.events.length} 事件 / ${item.clues.length} 证据 · 最少 ${item.par} 次交换<br>${item.brief}</p><div class="stars">${"★".repeat(profile.stars[index])}${"☆".repeat(3-profile.stars[index])}</div></button>`).join("");document.querySelectorAll("[data-site]").forEach(b=>b.onclick=()=>start(+b.dataset.site))}

$("submitBtn").onclick=submit;$("hintBtn").onclick=hint;$("undoBtn").onclick=undo;$("resetBtn").onclick=()=>start(q.site);$("archiveBtn").onclick=showArchive;$("bookBtn").onclick=()=>{$("bookOverlay").classList.remove("hidden");drawBook()};$("closeInfoBtn").onclick=()=>$("infoOverlay").classList.add("hidden");load();drawBook();if(q){$("bookOverlay").classList.add("hidden");draw()}window.__stratigraphyLab={SITES,countOrders,minSwaps,evaluate,referenceResult,validateContent,fresh,state:()=>q,profile:()=>profile,start,choose,hint,submit,encode,decode};})();</script></body></html>
